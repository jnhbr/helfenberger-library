<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>SVA – Dossier-Werkstatt</title>
<style>
  /* Design «Diplomarbeit»: Papier, Serifenschrift, Dunkelblau und Gold – die Seite sieht aus wie eine gesetzte Abschlussarbeit. */
  :root{--ink:#1b2a4a;--ink2:#4a5674;--gold:#8a6d1f;--goldhell:#c9a646;--papier:#f6f1e4;--blatt:#fffdf6;--linie:#c9bfa4;--ok:#2f7d4f;--warn:#a3301f;--gelb:#fff3bf;}
  *{box-sizing:border-box;}
  body{margin:0;font-family:Georgia,"Times New Roman",serif;font-size:17px;line-height:1.55;color:var(--ink);background:var(--papier);}
  header{max-width:940px;margin:0 auto;padding:22px 14px 0;text-align:center;}
  .titelblatt{border-top:4px double var(--ink);border-bottom:4px double var(--ink);padding:14px 10px 12px;}
  .schule{font-size:12.5px;letter-spacing:2.5px;color:var(--gold);text-transform:uppercase;}
  header h1{margin:4px 0 2px;font-size:32px;font-weight:400;letter-spacing:.3px;}
  header p{margin:0;font-style:italic;color:var(--ink2);}
  .bar{height:3px;background:var(--linie);margin:12px auto 0;max-width:420px;}
  .bar span{display:block;height:100%;background:var(--gold);transition:width .3s;}
  .barinfo{font-size:14px;margin-top:6px;color:var(--ink2);font-style:italic;}
  nav{display:flex;gap:4px 18px;flex-wrap:wrap;justify-content:center;padding:10px 14px;background:var(--papier);border-bottom:1px solid var(--linie);position:sticky;top:0;z-index:5;}
  nav button{font:inherit;font-size:14px;letter-spacing:1.4px;text-transform:uppercase;border:0;border-bottom:2px solid transparent;background:none;color:var(--ink2);padding:4px 2px;cursor:pointer;}
  nav button.on{color:var(--ink);border-bottom-color:var(--gold);}
  main{max-width:940px;margin:0 auto;padding:18px 14px 60px;}
  h2{font-size:24px;font-weight:400;margin:10px 0 12px;padding-bottom:4px;border-bottom:1px solid var(--ink);}
  .karte{background:var(--blatt);border:1px solid var(--linie);padding:14px 18px;margin:0 0 12px;}
  .hinweis{background:var(--blatt);border-left:4px solid var(--gold);padding:9px 14px;margin:10px 0;}
  .achtung{background:#fbf1ec;border-left:4px solid var(--warn);padding:9px 14px;margin:10px 0;}
  .station{padding:0;margin:0;border-width:0 0 1px;border-style:dotted;border-color:#8a93a8;background:none;}
  .station.offen{background:var(--blatt);border:1px solid var(--linie);margin:8px 0 14px;}
  .skopf{display:flex;align-items:baseline;gap:10px;width:100%;text-align:left;font:inherit;background:none;border:0;padding:9px 6px;cursor:pointer;color:inherit;}
  .station.offen .skopf{padding:12px 18px;border-bottom:1px solid var(--linie);}
  .snr{flex:none;min-width:30px;font-variant-numeric:tabular-nums;color:var(--gold);}
  .stitel{font-size:18px;}
  .station.offen .stitel{font-size:21px;}
  .leiter{flex:1;border-bottom:1px dotted #8a93a8;transform:translateY(-4px);min-width:16px;}
  .szeit{font-size:14px;color:var(--ink2);white-space:nowrap;font-style:italic;}
  .sstatus{display:none;font-size:14px;color:var(--ok);white-space:nowrap;}
  .station.fertig .sstatus{display:inline;}
  .station.fertig .stitel{color:var(--ink2);}
  .station.gesperrt .skopf{cursor:not-allowed;color:#9aa0b0;} .station.gesperrt .snr{color:#b9b3a0;}
  .sbody{display:none;padding:2px 18px 18px;}
  .station.offen .sbody{display:block;}
  .sbody h3{font-size:12.5px;font-weight:400;text-transform:uppercase;letter-spacing:1.8px;color:var(--gold);margin:18px 0 4px;}
  ol.weg{margin:4px 0;padding-left:24px;} ol.weg li{margin:4px 0;}
  kbd,.klick{font-family:Calibri,"Segoe UI",Arial,sans-serif;font-size:.92em;background:#fff;border:1px solid var(--ink);padding:0 6px;white-space:nowrap;}
  kbd{border-radius:4px;border-color:var(--ink2);box-shadow:0 1px 0 var(--ink2);}
  ul.fehler{margin:4px 0;padding-left:22px;} ul.fehler li{margin:2px 0;}
  .checks label{display:flex;gap:11px;align-items:flex-start;padding:7px 10px;border:1px solid var(--linie);margin:6px 0;cursor:pointer;background:#fff;}
  .checks input{width:19px;height:19px;margin-top:4px;flex:none;accent-color:var(--ok);}
  .checks label.an{background:#eef6ee;border-color:#a9cdb2;}
  .video{margin:8px 0;}
  .video iframe{width:100%;aspect-ratio:16/9;border:1px solid var(--ink);background:#000;display:block;margin-top:8px;}
  .btn{font-family:Calibri,"Segoe UI",Arial,sans-serif;font-size:16px;border:1px solid var(--ink);padding:7px 15px;cursor:pointer;background:var(--ink);color:#fffdf6;text-decoration:none;display:inline-block;}
  .btn.leise{background:transparent;color:var(--ink);}
  .reihe{display:flex;gap:8px;flex-wrap:wrap;align-items:center;}
  table.plan{width:100%;border-collapse:collapse;} table.plan td,table.plan th{border-bottom:1px dotted #8a93a8;padding:8px 6px;text-align:left;vertical-align:top;}
  table.plan th{font-weight:400;font-size:12.5px;letter-spacing:1.8px;text-transform:uppercase;color:var(--gold);border-bottom:1px solid var(--ink);}
  table.plan tr.vorbei td{color:#8b93a5;} table.plan tr.naechste td{background:var(--gelb);}
  .tag{display:inline-block;padding:0 8px;font-family:Calibri,Arial,sans-serif;font-size:13px;border:1px solid var(--gold);color:var(--gold);letter-spacing:.5px;}
  .tag.rot{border-color:var(--warn);color:var(--warn);}
  .frage{margin:0 0 14px;} .frage p{margin:0 0 6px;font-size:18px;}
  .frage label{display:block;padding:6px 10px;border:1px solid var(--linie);margin:4px 0;cursor:pointer;background:#fff;}
  .frage label.richtig{background:#eef6ee;border-color:#8fc3a0;} .frage label.falsch{background:#fbeceb;border-color:#e0a59e;}
  .gruppe{font-size:12.5px;letter-spacing:1.8px;text-transform:uppercase;color:var(--gold);margin:18px 0 4px;}
  .abschluss{display:flex;gap:18px;align-items:center;max-width:912px;margin:16px auto 0;padding:16px 20px;border:1px solid var(--goldhell);background:var(--blatt);text-align:left;}
  .siegel{flex:none;width:86px;height:86px;border-radius:50%;background:var(--goldhell);color:var(--ink);display:grid;place-items:center;text-align:center;font-size:11.5px;letter-spacing:1.2px;text-transform:uppercase;line-height:1.25;
    box-shadow:0 0 0 3px var(--blatt),0 0 0 5px var(--goldhell);animation:siegel .7s cubic-bezier(.2,1.4,.4,1) both;}
  .siegel b{display:block;font-size:22px;letter-spacing:0;}
  @keyframes siegel{from{transform:scale(2.2) rotate(-25deg);opacity:0;}to{transform:scale(1) rotate(-8deg);opacity:1;}}
  @media (prefers-reduced-motion:reduce){.siegel{animation:none;transform:rotate(-8deg);}}
  .nurdruck{display:none;}
  table.kb td,table.kb th{border:1px solid var(--linie);padding:5px 8px;vertical-align:top;text-align:left;} table.kb{border-collapse:collapse;width:100%;background:#fff;}
  table.kb th{font-weight:400;font-size:12.5px;letter-spacing:1.4px;text-transform:uppercase;}
  @media print{
    header,nav,.nichtdrucken{display:none!important;} body{background:#fff;font-family:Calibri,Arial,sans-serif;font-size:11pt;line-height:1.5;} main{max-width:none;padding:0;}
    .ansicht{display:none!important;} #kurzblatt{display:block!important;} .nurdruck{display:block;} .karte{border:0;padding:0;}
    table.kb td,table.kb th{border:1px solid #999;padding:3px 6px;font-size:10pt;line-height:1.5;}
  }
</style>
</head>
<body>
<header>
  <div class="titelblatt">
    <div class="schule">Sekundarschule Altnau · SVA 2026/27</div>
    <h1>Dossier-Werkstatt</h1>
    <p>Schritt für Schritt zu deinem Arbeitsdossier in Word – mit dem Erklärvideo von Herrn Schoch</p>
  </div>
  <div class="bar"><span id="barFill" style="width:0%"></span></div>
  <div class="barinfo" id="barInfo"></div>
  <div id="abschluss"></div>
</header>
<nav id="nav"></nav>
<main>
  <section class="ansicht" id="v-start"></section>
  <section class="ansicht" id="v-check"></section>
  <section class="ansicht" id="v-stationen"></section>
  <section class="ansicht" id="v-abgabe"></section>
  <section class="ansicht" id="v-termine"></section>
  <section class="ansicht" id="kurzblatt"></section>
</main>
<script>
/* Eigener Speicher-Schlüssel (Präfix sva_), nie localStorage.clear(). Die Library sichert ihn geräteübergreifend. */
var KEY = 'sva_dw_v1';
var VIDEO = 'nVc2cYSEgpA';
var JAHR = '2026/27';
var S = laden();
function laden(){ try{ var o = JSON.parse(localStorage.getItem(KEY) || '{}'); o.c = o.c || {}; o.q = o.q || {}; o.a = o.a || {}; return o; }catch(e){ return {c:{},q:{},a:{}}; } }
function sichern(){ try{ S.t = Date.now(); localStorage.setItem(KEY, JSON.stringify(S)); }catch(e){} melden(); }
function esc(s){ return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
function k(s){ return s.replace(/\[\[(.+?)\]\]/g, '<span class="klick">$1</span>').replace(/\{\{(.+?)\}\}/g, '<kbd>$1</kbd>'); }
function sek(t){ var p = t.split(':'); return (+p[0])*60 + (+p[1]); }

/* ---------- Termine ---------- */
var TERMINE = [
  {d:'2026-11-02', bis:null,         t:'Themenfindung', wo:'Schule (Montagmorgen)', z:'Dein Thema ist konkret und bereit zur Umsetzung. Du hast einen Plan B im Hinterkopf.'},
  {d:'2026-11-23', bis:'2026-11-25', t:'Grundsteine und erste Schritte', wo:'Schule / zu Hause', z:'Grobkonzept steht, Dossier-Gerüst ist gebaut, Materialliste ist erstellt, erste Arbeitsschritte sind gemacht.'},
  {d:'2026-11-25', bis:null,         t:'Abgabe Grobkonzept', wo:'Briefkasten in der Library oder auf Papier', z:'Unterschrieben von dir, deinen Eltern und der Lehrperson.', abgabe:true},
  {d:'2026-11-25', bis:null,         t:'Abgabe Dossier-Gerüst', wo:'Briefkasten in der Library', z:'Titelseite, Kapitel, Verzeichnisse, Kopf- und Fusszeile stehen (Stationen 1–8 und 12–13).', abgabe:true},
  {d:'2026-12-09', bis:'2026-12-11', t:'Freie Arbeitszeit', wo:'zu Hause', z:'Der erste Teil deiner SVA ist erstellt. Du schreibst das Protokoll laufend.'},
  {d:'2026-12-11', bis:null,         t:'Zwischenstand + erster Rapport', wo:'Briefkasten in der Library', z:'Aktuelles Dossier einwerfen und der Lehrperson kurz berichten.', abgabe:true},
  {d:'2027-01-19', bis:'2027-01-21', t:'Freie Arbeitszeit', wo:'zu Hause', z:'Deine SVA ist zum grossen Teil gemacht, das Dossier ist schon ziemlich fertig.'},
  {d:'2027-01-21', bis:null,         t:'Zwischenstand + Rapport', wo:'Briefkasten in der Library', z:'Aktuelles Dossier einwerfen und der Lehrperson kurz berichten.', abgabe:true},
  {d:'2027-03-08', bis:null,         t:'Schlussabgabe Dossier', wo:'Word + PDF im Briefkasten und gedruckt', z:'Die Arbeit ist fertig! Zuerst den Abgabe-Check machen.', abgabe:true},
  {d:'2027-03-08', bis:null,         t:'Ausstellungsplanung', wo:'Schule', z:'Ort und Material für deine Ausstellung sind geplant, die Präsentation ist vorbereitet.'},
  {d:'2027-03-18', bis:null,         t:'Ausstellung einrichten', wo:'Schule (Nachmittag)', z:'Du richtest deinen Platz ein.'},
  {d:'2027-03-19', bis:'2027-03-20', t:'SVA-Ausstellung', wo:'Schule', z:'Freitag: Besuchstag und 2. Klassen. Samstag: öffentliche Ausstellung, danach aufräumen.'}
];
var WT = ['So','Mo','Di','Mi','Do','Fr','Sa'], MON = ['Januar','Februar','März','April','Mai','Juni','Juli','August','September','Oktober','November','Dezember'];
function dat(iso){ var p = iso.split('-'); return new Date(+p[0], +p[1]-1, +p[2]); }
function datText(t){ var a = dat(t.d); if(!t.bis) return WT[a.getDay()]+', '+a.getDate()+'. '+MON[a.getMonth()]+' '+a.getFullYear(); var b = dat(t.bis); return WT[a.getDay()]+'–'+WT[b.getDay()]+', '+a.getDate()+'.–'+b.getDate()+'. '+MON[b.getMonth()]+' '+b.getFullYear(); }
function tageBis(iso){ var h = new Date(); h.setHours(0,0,0,0); return Math.round((dat(iso) - h) / 86400000); }
function naechsterTermin(nurAbgabe){ for(var i=0;i<TERMINE.length;i++){ var t = TERMINE[i]; if(tageBis(t.bis || t.d) >= 0 && (!nurAbgabe || t.abgabe)) return t; } return null; }
function inTagen(n){ return n === 0 ? 'heute' : n === 1 ? 'morgen' : 'in '+n+' Tagen'; }

/* ---------- Stationen ---------- */
var STATIONEN = [
 {id:'s1', t:'Speichern und starten', v:['0:00','1:06'],
  weg:['Word öffnen und ein [[Leeres Dokument]] erstellen.','[[Datei]] › [[Speichern unter]] › dein [[OneDrive]] der Schule wählen.','Dateiname: «SVA_Dossier_DeinVorname». Mit [[Speichern]] bestätigen.','Oben links prüfen: [[Automatisches Speichern]] steht auf «Ein».'],
  tipp:'Liegt die Datei auf OneDrive, speichert Word von selbst. So verlierst du nichts, auch wenn der Akku leer ist.',
  fehler:['Datei nur auf dem Desktop oder im Download-Ordner gespeichert.','Mehrere Fassungen mit ähnlichen Namen (Dossier_neu, Dossier_neu2).'],
  c:['Mein Dossier liegt auf OneDrive.','«Automatisches Speichern» ist eingeschaltet.']},
 {id:'s2', t:'Gliederung: die Kapitel hinschreiben', v:['1:06','1:51'],
  weg:['Schreibe die Kapitel untereinander, jedes auf eine eigene Zeile: Inhaltsverzeichnis, Vorwort, Theorie, Arbeitsprotokoll, Schlusswort, Bild- und Literaturnachweis, Anhang.','Notizen, die später wieder wegkommen, markierst du gelb: Text markieren › [[Start]] › [[Texthervorhebungsfarbe]].'],
  tipp:'Gelb heisst: «Das muss ich noch ersetzen oder löschen.» Am Schluss darf nichts Gelbes mehr im Dossier stehen.',
  fehler:['Kapitel fehlen oder heissen anders als verlangt.'],
  c:['Alle sieben Kapitel stehen untereinander im Dokument.']},
 {id:'s3', t:'Titelseite', v:['1:51','5:22'],
  weg:['Cursor ganz an den Anfang setzen. [[Einfügen]] › [[Deckblatt]] › ein schlichtes Deckblatt wählen.','Titel deiner Arbeit eintragen.','Darunter: «SVA '+JAHR+'», dein Vor- und Nachname, deine Klasse.','Bild oder Grafik einfügen: [[Einfügen]] › [[Bilder]] › [[Dieses Gerät]].','Logo der Sek Altnau einfügen (unten herunterladen).','Bild anklicken › Symbol [[Layoutoptionen]] neben dem Bild › [[Hinter den Text]]. Jetzt kannst du es frei verschieben.'],
  achtung:'Im Video steht «2023/24» und das Logo kommt aus Teams. Bei dir gilt: «SVA '+JAHR+'», und das Logo lädst du hier herunter.',
  logo:true,
  fehler:['Unscharfes oder zu dunkles Bild: der Titel ist kaum lesbar.','Jahr, Name oder Klasse fehlen.'],
  c:['Titel, Bild, Logo, «SVA '+JAHR+'», Name und Klasse stehen auf der Titelseite.','Mein Bild ist scharf und der Titel gut lesbar.']},
 {id:'s4', t:'Überschriften und Seitenumbrüche', v:['5:22','7:05'],
  weg:['Jeden Kapitelnamen anklicken › [[Start]] › Formatvorlagen › [[Überschrift 1]].','Cursor vor den ersten Buchstaben eines Kapitels setzen › {{Strg}} + {{Enter}} (oder [[Einfügen]] › [[Seitenumbruch]]).','Das bei jedem Hauptkapitel wiederholen: Jedes Kapitel beginnt oben auf einer neuen Seite.'],
  tipp:'Nie mit vielen leeren Zeilen auf die nächste Seite «rutschen». Sobald du Text ergänzt, verschiebt sich sonst alles.',
  fehler:['Überschrift nur fett und gross gemacht statt mit der Formatvorlage: Dann erscheint sie nicht im Inhaltsverzeichnis.','Leerzeilen statt Seitenumbruch.'],
  c:['Alle Hauptkapitel haben die Formatvorlage «Überschrift 1».','Jedes Hauptkapitel beginnt mit einem Seitenumbruch auf einer neuen Seite.']},
 {id:'s5', t:'Inhaltsverzeichnis', v:['7:05','8:28'],
  weg:['Cursor auf die Seite «Inhaltsverzeichnis» setzen.','[[Referenzen]] › [[Inhaltsverzeichnis]] › [[Automatische Tabelle 1]].','Word schreibt selbst einen Titel darüber. Deinen eigenen Titel «Inhaltsverzeichnis» kannst du löschen.','Aktualisieren: ins Verzeichnis klicken › [[Inhaltsverzeichnis aktualisieren]] › [[Gesamtes Verzeichnis aktualisieren]].'],
  tipp:'Das Verzeichnis ändert sich nicht von allein. Vor jeder Abgabe aktualisieren!',
  fehler:['Im Verzeichnis steht «Fehler! Textmarke nicht definiert.» Das passiert, wenn es nicht aktualisiert wurde.','Seitenzahlen im Verzeichnis stimmen nicht mit dem Dossier überein.'],
  c:['Mein Inhaltsverzeichnis ist automatisch erstellt (nicht von Hand getippt).','Ich weiss, wie ich es aktualisiere.']},
 {id:'s6', t:'Vorwort mit Unterkapiteln und Theorie', v:['8:28','11:02'],
  weg:['Auf der Seite «Vorwort» drei Zeilen schreiben: Projektvorstellung, Ziele, Betreuung und Unterstützung.','Jede der drei Zeilen anklicken › [[Start]] › [[Überschrift 2]].','Inhaltsverzeichnis aktualisieren: Die Unterkapitel erscheinen eingerückt.','Auf der Seite «Theorie» in Gelb notieren: Welches Wissen brauche ich für mein Projekt? Welche Materialien, Techniken oder Maschinen verwende ich, und was muss ich darüber wissen?'],
  achtung:'Das Kapitel «Theorie» kommt im Video noch nicht vor. Es gehört bei uns zwischen Vorwort und Arbeitsprotokoll.',
  tipp:'Projektvorstellung: Was mache ich? Wie kam ich auf die Idee? Was motiviert mich? · Ziele: aus deinem Grobkonzept. · Betreuung: Wer unterstützt dich und warum?',
  fehler:['Vorwort zu kurz: Die drei Teile fehlen.'],
  c:['Mein Vorwort hat die drei Unterkapitel als «Überschrift 2».','Die Unterkapitel erscheinen im Inhaltsverzeichnis.']},
 {id:'s7', t:'Arbeitsprotokoll als Tabelle', v:['11:02','15:31'],
  weg:['[[Einfügen]] › [[Tabelle]] › 2 Spalten × 3 Zeilen.','Die drei Zellen links markieren › Rechtsklick › [[Zellen verbinden]]: Platz für das Bild.','Rechts oben: Datum, Arbeitszeit (von–bis) und Arbeitsort.','Die zwei Zellen rechts unten markieren › Rechtsklick › [[Zellen verbinden]]: Platz für den Text.','Ganze Tabelle markieren › {{Strg}} + {{C}}. Darunter klicken › {{Strg}} + {{V}}: So entsteht der nächste Eintrag.','Immer eine leere Tabelle am Schluss stehen lassen, die du wieder kopieren kannst.','Formatierungszeichen einblenden: [[Start]] › [[¶]]. Dann siehst du Absätze und Umbrüche (beim Drucken sind sie unsichtbar).'],
  tipp:'Jeder Eintrag: Datum, Arbeitszeit, Arbeitsort · Titel des Arbeitsschritts (fett) · Was habe ich gemacht? · ein Bild · ein Kommentar (Was hat gut geklappt? Was war schwierig? Was nehme ich mit?).',
  fehler:['Bilder zu klein: Man erkennt nichts.','Einträge erst am Schluss aus dem Gedächtnis geschrieben.','Ein Eintrag ist über zwei Seiten zerrissen.'],
  c:['Meine Protokoll-Tabelle steht und ich habe eine leere Kopie am Schluss.','Ich weiss, was in jeden Eintrag gehört.']},
 {id:'s8', t:'Schlusswort', v:['15:31','15:56'],
  weg:['Auf der Seite «Schlusswort» in Gelb notieren, was hineinkommt: Was nehme ich mit? Was hat gut geklappt? Was würde ich anders machen? Zeitaufwand, Gedanken zur Arbeit, Dank.','Das Schlusswort schreibst du erst am Ende, als zusammenhängenden Text.'],
  fehler:['Der Zeitaufwand fehlt.','Schlusswort in Eile geschrieben: viele Fehler, anderer Zeilenabstand.'],
  c:['Meine Notizen fürs Schlusswort stehen (gelb markiert).']},
 {id:'s9', t:'Bilder beschriften und Bildverzeichnis', v:['15:56','19:53'],
  weg:['Bild einfügen: [[Einfügen]] › [[Bilder]].','Rechtsklick auf das Bild › [[Beschriftung einfügen…]].','Bezeichnung: [[Abbildung]] · Position: [[Unter dem ausgewählten Element]] · Text: was man sieht und woher das Bild ist.','Auf der Seite «Bild- und Literaturnachweis»: [[Referenzen]] › [[Abbildungsverzeichnis einfügen]].','Darüber den Titel «Bildverzeichnis» schreiben › [[Überschrift 2]].','Alles aktualisieren: {{Strg}} + {{A}}, dann {{F9}} (auf manchen Laptops {{Fn}} + {{F9}}).'],
  tipp:'Beschriften musst du alle Bilder aus dem Internet – mit der Webseite, von der sie stammen. Eigene Fotos brauchen keine Beschriftung. Lizenzfreie Bilder findest du z. B. auf pixabay.com.',
  fehler:['Bilder nur nummeriert, aber nicht benannt.','Quelle bei Internetbildern fehlt.'],
  c:['Jedes Bild aus dem Internet hat eine Beschriftung mit «Abbildung …» und Quelle.','Mein Bildverzeichnis ist automatisch eingefügt.']},
 {id:'s10', t:'Quellen und Literaturverzeichnis', v:['19:53','24:09'],
  weg:['Cursor hinter den Satz setzen, der aus einer Quelle stammt.','[[Referenzen]] › [[Zitat einfügen]] › [[Neue Quelle hinzufügen…]].','Quellentyp wählen: [[Website]] oder [[Buch]].','Website: Autor (bei Wikipedia «Wikipedia»), Name der Webseite, URL und das Datum, an dem du die Seite geöffnet hast.','Buch: Autor, Titel, Jahr, Ort und Verlag.','Auf der Seite «Bild- und Literaturnachweis»: [[Referenzen]] › [[Literaturverzeichnis]] einfügen. Titel «Literaturverzeichnis» als [[Überschrift 2]].'],
  achtung:'Künstliche Intelligenz (ChatGPT, Copilot usw.) darfst du nur zum Korrigieren deines eigenen Textes brauchen. Schreiben musst du selbst.',
  fehler:['Text aus dem Internet kopiert, ohne die Quelle anzugeben.','Nur «Google» oder «Internet» als Quelle.'],

function fertig(st){ var c = S.c[st.id] || []; for(var i=0;i<st.c.length;i++){ if(!c[i]) return false; } return true; }
function anzahlFertig(){ return STATIONEN.filter(fertig).length; }
/* Pflicht: Zuerst alle Auffrisch-Stationen, erst dann öffnen sich die 14 Stationen. */
function auffrischFertig(){ return AUFFRISCHEN.every(fertig); }
function auffrischAnzahl(){ return AUFFRISCHEN.filter(fertig).length; }
function melden(){
  var n = anzahlFertig();
  document.getElementById('barFill').style.width = Math.round(n / STATIONEN.length * 100) + '%';
  var t = naechsterTermin(true);
  var ab = document.getElementById('abschluss'), alle = n === STATIONEN.length;
  if(alle && !ab.firstChild) ab.innerHTML = '<div class="abschluss"><div class="siegel"><span>Dossier<b>✓</b>formal bereit</span></div><div><b style="font-size:20px;font-weight:400">Alle '+STATIONEN.length+' Stationen erledigt – dein Dossier steht!</b><br>Jetzt zählt der Inhalt: Protokoll laufend schreiben und vor jeder Abgabe den Abgabe-Check machen.</div></div>';
  if(!alle && ab.firstChild) ab.innerHTML = '';
  document.getElementById('barInfo').textContent = (auffrischFertig() ? 'Station ' + Math.min(n + 1, STATIONEN.length) + ' von ' + STATIONEN.length + ' · ' + n + ' erledigt' : 'Zuerst auffrischen: ' + auffrischAnzahl() + ' von ' + AUFFRISCHEN.length + ' erledigt') + (t ? ' · nächste Abgabe: ' + t.t + ' ' + inTagen(tageBis(t.d)) : '');
}

var ANSICHTEN = [['start','Start'],['check','Einstiegs-Check'],['stationen','Stationen'],['abgabe','Abgabe-Check'],['termine','Termine'],['kurz','Kurzblatt']];
function zeige(id){
  S.v = id;
  try{ localStorage.setItem(KEY, JSON.stringify(S)); }catch(e){}
  document.getElementById('nav').innerHTML = ANSICHTEN.map(function(a){ return '<button type="button" data-v="'+a[0]+'"'+(a[0]===id?' class="on"':'')+'>'+a[1]+'</button>'; }).join('');
  Array.prototype.forEach.call(document.querySelectorAll('.ansicht'), function(el){ el.style.display = 'none'; });
  var el = document.getElementById(id === 'kurz' ? 'kurzblatt' : 'v-'+id);
  el.style.display = 'block';
  ({start:zStart, check:zCheck, stationen:zStationen, abgabe:zAbgabe, termine:zTermine, kurz:zKurz})[id](el);
  window.scrollTo(0, 0);
}

    '<div class="reihe"><button class="btn" type="button" data-go="'+(Object.keys(S.q).length ? 'stationen' : 'check')+'">'+(!Object.keys(S.q).length ? 'Los gehts: Einstiegs-Check' : !auffrischFertig() ? 'Weiter: Auffrischen' : 'Weiter bei Station '+(offen ? STATIONEN.indexOf(offen)+1 : 14))+'</button>'+

    '<div class="karte"><b>So arbeitest du</b><ol class="weg"><li>Word und diese Seite nebeneinander öffnen ({{Windows}} + {{←}} und {{Windows}} + {{→}}).</li><li>Zuerst der Einstiegs-Check und die vier Auffrisch-Stationen – sie sind für alle Pflicht. Danach öffnen sich die 14 Stationen.</li><li>Videoausschnitt ansehen, dann die Schritte in deinem eigenen Dossier nachmachen.</li><li>Selbstcheck abhaken. Deine Lehrperson sieht, bei welcher Station du stehst.</li></ol></div>'.replace(/\{\{(.+?)\}\}/g,'<kbd>$1</kbd>')+

  el.onclick = function(e){ var b = e.target.closest('[data-go]'); if(b) zeige(b.getAttribute('data-go')); };

function zCheck(el){
  var beantwortet = Object.keys(S.q).length, html = '<h2>Einstiegs-Check</h2><div class="karte">Acht kurze Fragen zu Word. Danach siehst du, worauf du beim Auffrischen besonders achten solltest. Keine Note – nur für dich.</div>';
  FRAGEN.forEach(function(q, i){
    var g = S.q[i];
    html += '<div class="karte frage"><p>'+(i+1)+'. '+esc(q.f)+'</p>'+q.a.map(function(a, j){
      var cls = g === undefined ? '' : (j === q.r ? ' class="richtig"' : (j === g ? ' class="falsch"' : ''));
      return '<label'+cls+'><input type="radio" name="q'+i+'" value="'+j+'"'+(g===j?' checked':'')+(g!==undefined?' disabled':'')+'> '+esc(a)+'</label>';
    }).join('')+'</div>';
  });
  if(beantwortet === FRAGEN.length){
    var falsch = FRAGEN.filter(function(q, i){ return S.q[i] !== q.r; }), ziele = {};
    falsch.forEach(function(q){ ziele[q.zu] = true; });
    var liste = Object.keys(ziele).map(function(id){ var s = AUFFRISCHEN.concat(STATIONEN).filter(function(x){ return x.id === id; })[0]; return '<li>'+(id.charAt(0)==='a' ? 'Auffrischen: ' : 'Station: ')+esc(s.t)+'</li>'; }).join('');
    html += '<div class="karte"><b>'+(FRAGEN.length - falsch.length)+' von '+FRAGEN.length+' richtig.</b> '+(falsch.length ? 'Schau dir das besonders gut an:<ul class="fehler">'+liste+'</ul>' : 'Super! Das Auffrischen geht bei dir schnell.')+
      '<div class="reihe"><button class="btn" type="button" id="zuSt">Weiter zum Auffrischen</button><button class="btn leise" type="button" id="nochmal">Check wiederholen</button></div></div>';
  }
  el.innerHTML = html;
  el.onchange = function(e){ var r = e.target; if(r.type !== 'radio') return; S.q[+r.name.slice(1)] = +r.value; sichern(); zCheck(el); };
  var a = document.getElementById('zuSt'); if(a) a.onclick = function(){ zeige('stationen'); };
  var b = document.getElementById('nochmal'); if(b) b.onclick = function(){ S.q = {}; sichern(); zCheck(el); window.scrollTo(0,0); };
}

function stationHtml(st, nr, mitVideo, gesperrt){
  if(gesperrt) return '<div class="karte station gesperrt" data-id="'+st.id+'"><button type="button" class="skopf" disabled><span class="snr">'+nr+'</span><span class="stitel">'+esc(st.t)+'</span><span class="leiter"></span><span class="szeit">gesperrt</span></button></div>';

    '<button type="button" class="skopf"><span class="snr">'+nr+'</span><span class="stitel">'+esc(st.t)+'</span><span class="leiter"></span><span class="sstatus">erledigt ✓</span>'+(st.v?'<span class="szeit">Video '+st.v[0]+'</span>':'')+'</button><div class="sbody">';
  var sub = 0, h3 = function(t){ return '<h3>'+nr+'.'+(++sub)+' '+t+'</h3>'; };

      '<a class="btn leise" target="_blank" rel="noopener" href="https://youtu.be/'+VIDEO+'?t='+sek(st.v[0])+'">Auf YouTube öffnen</a></div></div>';
  }
  if(st.achtung) h += '<div class="achtung"><b>Achtung, bei uns anders:</b> '+esc(st.achtung)+'</div>';
  h += h3('So gehts in Word')+'<ol class="weg">'+st.weg.map(function(w){ return '<li>'+k(esc(w))+'</li>'; }).join('')+'</ol>';
  if(st.logo) h += '<p><a class="btn leise" href="assets/logo-pruefung.png" download="Logo_Sek_Altnau.png">⬇ Logo der Sek Altnau herunterladen</a></p>';
  if(st.tipp) h += '<div class="hinweis"><b>Tipp:</b> '+k(esc(st.tipp))+'</div>';
  if(st.fehler) h += h3('Typische Fehler')+'<ul class="fehler">'+st.fehler.map(function(f){ return '<li>'+esc(f)+'</li>'; }).join('')+'</ul>';
  h += h3('Selbstcheck')+'<div class="checks">'+st.c.map(function(t, i){ return '<label'+(c[i]?' class="an"':'')+'><input type="checkbox" data-i="'+i+'"'+(c[i]?' checked':'')+'><span>'+esc(t)+'</span></label>'; }).join('')+'</div>';
  return h + '</div></div>';
}
function zStationen(el){
  var frei = auffrischFertig();
  el.innerHTML = '<h2>Teil 1 · Auffrischen</h2><div class="hinweis"><b>Für alle Pflicht:</b> Arbeite zuerst diese vier kurzen Stationen zu den Grundlagen durch und hake den Selbstcheck ab. Erst dann öffnen sich die 14 Stationen.'+(frei ? ' <b style="color:var(--ok)">Erledigt ✓</b>' : '')+'</div>'+
    AUFFRISCHEN.map(function(s, i){ return stationHtml(s, 'A'+(i+1), false); }).join('')+
    '<h2 style="margin-top:30px">Teil 2 · Die 14 Stationen</h2>'+

    STATIONEN.map(function(s, i){ return stationHtml(s, i+1, true, !frei); }).join('');
