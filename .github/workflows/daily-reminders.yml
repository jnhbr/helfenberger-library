name: Tägliche Erinnerungen

on:
  schedule:
    # GitHub startet geplante Läufe teils Stunden zu spät (Sept. 2026: der
    # 18-Uhr-Lauf kam erst um 21-22 Uhr). Deshalb mehrere Läufe ab Mittag:
    # das Skript wartet bei einem Lauf vor 18 Uhr (Schweizer Zeit) bis 18:00
    # und verschickt dann; kommt ein Lauf erst nach 18 Uhr, verschickt es
    # sofort. Ein Firestore-Log sorgt dafür, dass nur einmal pro Tag
    # verschickt wird. Sommer-/Winterzeit regelt das Skript selbst.
    - cron: '0 11 * * *'
    - cron: '0 12 * * *'
    - cron: '0 13 * * *'
    - cron: '0 14 * * *'
    - cron: '0 15 * * *'
    - cron: '0 16 * * *'
    - cron: '0 17 * * *'
  workflow_dispatch:
    inputs:
      force:
        description: 'Sofort verschicken, unabhängig von der Uhrzeit (zum Testen)'
        required: false
        default: 'false'

concurrency:
  group: daily-reminders
  cancel-in-progress: false

jobs:
  send-reminders:
    runs-on: ubuntu-latest
    timeout-minutes: 340
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install dependencies
        working-directory: admin
        run: npm install --omit=dev
      - name: Send reminders
        working-directory: admin
        env:
          FIREBASE_SERVICE_ACCOUNT_KEY: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_KEY }}
          VAPID_PUBLIC_KEY: ${{ secrets.VAPID_PUBLIC_KEY }}
          VAPID_PRIVATE_KEY: ${{ secrets.VAPID_PRIVATE_KEY }}
          VAPID_SUBJECT: ${{ secrets.VAPID_SUBJECT }}
          FORCE_SEND: ${{ github.event.inputs.force }}
        run: node send-reminders.js
