name: Tägliche Erinnerungen

on:
  schedule:
    # 18:00 Uhr Schweizer Zeit abdecken (Sommer- UND Winterzeit), plus 19:00
    # als Absicherung, falls GitHub Actions einen Lauf mal verspätet startet
    # (schon vorgekommen - dann lief das Skript erst nach 18 Uhr lokal und hat
    # bewusst nichts verschickt). Das Skript selbst prüft, welcher der Läufe
    # gerade wirklich 18 oder 19 Uhr lokal ist, und tut sonst nichts; ein
    # Firestore-Log verhindert Doppelversand, falls sowohl der 18-Uhr- als
    # auch der 19-Uhr-Lauf durchkommen.
    - cron: '0 16 * * *'   # 18:00 MESZ (Sommerzeit, UTC+2)
    - cron: '0 17 * * *'   # 18:00 MEZ (Winterzeit) / 19:00 MESZ-Fallback (UTC+1/+2 je nach Jahreszeit)
    - cron: '0 18 * * *'   # 19:00 MEZ-Fallback (Winterzeit, UTC+1)
  workflow_dispatch:
    inputs:
      force:
        description: 'Sofort verschicken, unabhängig von der Uhrzeit (zum Testen)'
        required: false
        default: 'false'

jobs:
  send-reminders:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install dependencies
        working-directory: admin
        run: npm install --omit=dev
      - name: Send reminders
        working-directory: admin
        env:
          FIREBASE_SERVICE_ACCOUNT_KEY: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_KEY }}
          VAPID_PUBLIC_KEY: ${{ secrets.VAPID_PUBLIC_KEY }}
          VAPID_PRIVATE_KEY: ${{ secrets.VAPID_PRIVATE_KEY }}
          VAPID_SUBJECT: ${{ secrets.VAPID_SUBJECT }}
          FORCE_SEND: ${{ github.event.inputs.force }}
        run: node send-reminders.js
