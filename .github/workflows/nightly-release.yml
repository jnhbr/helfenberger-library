name: Testseite live schalten

# Änderungen werden auf der Testseite gemacht (jnhbr/helfenberger-library-test,
# https://jnhbr.github.io/helfenberger-library-test/). Dieser Workflow kopiert
# deren Stand hierher (= Live-Seite).
#
# Seit 21.10.2026 nicht mehr nur nachts: Er schaut alle 15 Minuten nach. Ein
# neuer Stand der Testseite geht live, sobald dessen «Prüfen» im Test-Repo
# (Leitplanken, Smoke-, Regel-, Login- und Funktionstest) grün ist. Ist es rot
# oder läuft es noch, passiert nichts. Geräte, auf denen die Library offen ist,
# merken die neue Version selbst (sw-push.js + neueVersionBeobachten in
# index.html): still neu laden, solange niemand etwas tut, sonst unten
# «🔄 Neue Version» - nie während einer Prüfung.
#
# - Pause: eine Datei namens PAUSE im Test-Repo anlegen -> nichts geht live,
#   bis sie wieder gelöscht ist.
# - Sofort live: Actions -> "Testseite live schalten" -> "Run workflow" bzw.
#   «🚀 Jetzt live» auf der Testseite (ignoriert «Prüfen» und PAUSE).
# - .github/ wird nie kopiert: Workflows (auch die täglichen Erinnerungen)
#   leben nur hier im Live-Repo.
# - manifest.json und assets/icon-*.png werden nie kopiert: die Testseite hat
#   dort eigene Versionen (Name "Library Test", Icon mit Zahnrad), weil Safari
#   beim "Zum Dock hinzufügen" nur die statischen Dateien liest.
# - Der Dateiname nightly-release.yml bleibt (der Knopf «🚀 Jetzt live» und
#   Skripte rufen ihn so auf).

on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  actions: read

concurrency:
  group: nightly-release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Neuen, geprüften Stand suchen
        id: gate
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          T=jnhbr/helfenberger-library-test
          sha=$(gh api "repos/$T/commits/main" --jq .sha)
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "Von Hand gestartet - Stand ${sha:0:7} geht live."
            echo "run=true" >> "$GITHUB_OUTPUT"; exit 0
          fi
          live=$(gh api "repos/${{ github.repository }}/commits?per_page=30" --jq '.[].commit.message')
          if grep -q "Test-Commit: $sha" <<< "$live"; then
            echo "Stand ${sha:0:7} ist schon live - nichts zu tun."
            echo "run=false" >> "$GITHUB_OUTPUT"; exit 0
          fi
          erg=$(gh api "repos/$T/actions/workflows/pruefen.yml/runs?head_sha=$sha&per_page=10" \
            --jq '[.workflow_runs[] | select(.status == "completed") | .conclusion] | if index("success") then "gruen" elif length > 0 then "rot" else "offen" end')
          case "$erg" in
            gruen) echo "«Prüfen» für ${sha:0:7} ist grün - geht live."; echo "run=true" >> "$GITHUB_OUTPUT" ;;
            rot)   echo "«Prüfen» für ${sha:0:7} ist rot - bleibt auf der Testseite, bis ein grüner Stand kommt."; echo "run=false" >> "$GITHUB_OUTPUT" ;;
            *)     echo "«Prüfen» für ${sha:0:7} läuft noch - nächster Versuch in 15 Minuten."; echo "run=false" >> "$GITHUB_OUTPUT" ;;
          esac

      - uses: actions/checkout@v4
        if: steps.gate.outputs.run == 'true'
        with:
          path: live

      - uses: actions/checkout@v4
        if: steps.gate.outputs.run == 'true'
        with:
          repository: jnhbr/helfenberger-library-test
          path: test
          ref: ${{ steps.gate.outputs.sha }}

      - name: Pause prüfen
        id: pause
        if: steps.gate.outputs.run == 'true'
        run: |
          if [ -f test/PAUSE ] && [ "${{ github.event_name }}" != "workflow_dispatch" ]; then
            echo "PAUSE-Datei im Test-Repo gefunden - es wird nichts live geschaltet."
            echo "go=false" >> "$GITHUB_OUTPUT"
          else
            echo "go=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Syntax der Testseite prüfen
        if: steps.pause.outputs.go == 'true'
        run: |
          node -e '
            const fs = require("fs");
            const html = fs.readFileSync("test/index.html", "utf8");
            const parts = [...html.matchAll(/<script type="module">([\s\S]*?)<\/script>/g)].map(m => m[1]);
            if (!parts.length) { console.error("Kein <script type=module> gefunden"); process.exit(1); }
            parts.forEach((js, i) => fs.writeFileSync(`/tmp/check-${i}.mjs`, js));
          '
          for f in /tmp/check-*.mjs; do node --check "$f"; done

      - name: Stand übernehmen
        id: sync
        if: steps.pause.outputs.go == 'true'
        run: |
          rsync -a --delete --exclude .git --exclude .github --exclude PAUSE \
            --exclude /manifest.json --exclude '/assets/icon-*.png' test/ live/
          cd live
          if [ -z "$(git status --porcelain)" ]; then
            echo "Keine Änderungen gegenüber der Live-Seite."
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          src=$(git -C ../test log -1 --format='%h %s')
          git commit -m "Testseite live geschaltet (Stand: $src)" -m "Test-Commit: $(git -C ../test rev-parse HEAD)"
          git push origin HEAD:main
          echo "changed=true" >> "$GITHUB_OUTPUT"

      - name: GitHub Pages neu bauen
        if: steps.sync.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X POST "repos/${{ github.repository }}/pages/builds" || true
