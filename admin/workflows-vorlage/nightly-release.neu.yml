# VORLAGE (neue Fassung von .github/workflows/nightly-release.yml im LIVE-Repo jnhbr/helfenberger-library).
# Neu gegenüber der bisherigen: Leitplanken + Browser-Smoke-Test vor dem Live-Schalten, und der Stand,
# der per «Live zurücksetzen» zurückgenommen wurde (.github/rollback-pin), wird nachts nicht erneut live geschaltet.

name: Testseite live schalten

# Änderungen werden auf der Testseite gemacht (jnhbr/helfenberger-library-test,
# https://jnhbr.github.io/helfenberger-library-test/). Dieser Workflow kopiert
# deren Stand jede Nacht hierher (= Live-Seite), damit die Schüler:innen nicht
# mitten im Lernen von halbfertigen Deploys getroffen werden.
#
# - Läuft nur, wenn sich etwas geändert hat und der JavaScript-Code die
#   Syntaxprüfung besteht.
# - Pause: eine Datei namens PAUSE im Test-Repo anlegen -> nachts passiert
#   nichts, bis sie wieder gelöscht ist.
# - Sofort live: Actions -> "Testseite live schalten" -> "Run workflow"
#   (ignoriert Uhrzeit und PAUSE).
# - .github/ wird nie kopiert: Workflows (auch die täglichen Erinnerungen)
#   leben nur hier im Live-Repo.
# - manifest.json und assets/icon-*.png werden nie kopiert: die Testseite hat
#   dort eigene Versionen (Name "Library Test", Icon mit Zahnrad), weil Safari
#   beim "Zum Dock hinzufügen" nur die statischen Dateien liest.

on:
  schedule:
    # Mitternacht Schweizer Zeit in Sommer- UND Winterzeit, plus ein späterer
    # Lauf als Absicherung, falls GitHub einen Lauf verspätet startet. Das
    # Skript lässt nur Läufe zwischen 00:00 und 05:59 Uhr lokal durch; ein
    # zweiter Lauf in derselben Nacht findet keine Änderungen mehr.
    - cron: '0 22 * * *'   # 00:00 MESZ (Sommerzeit, UTC+2)
    - cron: '0 23 * * *'   # 00:00 MEZ (Winterzeit, UTC+1)
    - cron: '0 1 * * *'    # 02:00 / 03:00 Fallback
  workflow_dispatch:

permissions:
  contents: write
  pages: write

concurrency:
  group: nightly-release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Uhrzeit prüfen
        id: gate
        run: |
          hour=$(TZ=Europe/Zurich date +%H)
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] || [ "$hour" -lt 6 ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "Lokal ist es $hour Uhr - kein Nachtlauf, nichts zu tun."
            echo "run=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v4
        if: steps.gate.outputs.run == 'true'
        with:
          path: live

      - uses: actions/checkout@v4
        if: steps.gate.outputs.run == 'true'
        with:
          repository: jnhbr/helfenberger-library-test
          path: test

      - name: Pause prüfen
        id: pause
        if: steps.gate.outputs.run == 'true'
        run: |
          testhead=$(git -C test rev-parse HEAD)
          pin=$(cat live/.github/rollback-pin 2>/dev/null || true)
          if [ -f test/PAUSE ] && [ "${{ github.event_name }}" != "workflow_dispatch" ]; then
            echo "PAUSE-Datei im Test-Repo gefunden - heute Nacht wird nichts live geschaltet."
            echo "go=false" >> "$GITHUB_OUTPUT"
          elif [ -n "$pin" ] && [ "$pin" = "$testhead" ] && [ "${{ github.event_name }}" != "workflow_dispatch" ]; then
            echo "Dieser Stand der Testseite ($testhead) wurde per «Live zurücksetzen» zurückgenommen - nichts wird live geschaltet, bis es einen neuen Commit gibt."
            echo "go=false" >> "$GITHUB_OUTPUT"
          else
            echo "go=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Syntax der Testseite prüfen
        if: steps.pause.outputs.go == 'true'
        run: |
          node -e '
            const fs = require("fs");
            const html = fs.readFileSync("test/index.html", "utf8");
            const parts = [...html.matchAll(/<script type="module">([\s\S]*?)<\/script>/g)].map(m => m[1]);
            if (!parts.length) { console.error("Kein <script type=module> gefunden"); process.exit(1); }
            parts.forEach((js, i) => fs.writeFileSync(`/tmp/check-${i}.mjs`, js));
          '
          for f in /tmp/check-*.mjs; do node --check "$f"; done

      - name: Leitplanken prüfen
        if: steps.pause.outputs.go == 'true'
        run: node test/admin/check-leitplanken.js test

      - uses: actions/setup-node@v4
        if: steps.pause.outputs.go == 'true'
        with:
          node-version: '20'

      - name: Smoke-Test im Browser (Anmeldemaske, keine JavaScript-Fehler)
        if: steps.pause.outputs.go == 'true'
        run: |
          mkdir -p "$RUNNER_TEMP/pw" && cd "$RUNNER_TEMP/pw"
          npm init -y >/dev/null && npm install --no-audit --no-fund playwright@1 >/dev/null
          npx playwright install --with-deps chromium >/dev/null
          cd "$GITHUB_WORKSPACE"
          NODE_PATH="$RUNNER_TEMP/pw/node_modules" node test/admin/smoke-test.js test

      - name: Stand übernehmen
        id: sync
        if: steps.pause.outputs.go == 'true'
        run: |
          rsync -a --delete --exclude .git --exclude .github --exclude PAUSE \
            --exclude /manifest.json --exclude '/assets/icon-*.png' test/ live/
          cd live
          if [ -z "$(git status --porcelain)" ]; then
            echo "Keine Änderungen gegenüber der Live-Seite."
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          src=$(git -C ../test log -1 --format='%h %s')
          git commit -m "Testseite live geschaltet (Stand: $src)"
          git push origin HEAD:main
          echo "changed=true" >> "$GITHUB_OUTPUT"

      - name: GitHub Pages neu bauen
        if: steps.sync.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X POST "repos/${{ github.repository }}/pages/builds" || true
