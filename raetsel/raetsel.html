<!doctype html>
<html lang="de-CH">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Rätsel &amp; Logik</title>
<style>
:root{
  --bg-1:#16304f; --bg-2:#0e1f36; --bg-3:#08121f;
  --panel:#122339; --panel-2:#17304d; --line:#2f5079; --line-soft:#223c5c;
  --gold:#e0b95a; --gold-2:#a8782a; --gold-soft:#f3dca0;
  --teal:#3aa6b0; --ivory:#f4efe2; --muted:#9db3cc; --ink:#10233a;
  --ok:#6fcf8d; --bad:#ee7a68; --warn:#f0b650;
  --paper:#f8f4e8; --paper-2:#ece5d0; --pline:#b9ae8f;
  --serif:"Iowan Old Style","Palatino Linotype",Palatino,"Book Antiqua",Georgia,"Times New Roman",serif;
  --sans:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  --bs:min(calc(100vw - 36px), calc(100vh - 250px), 540px);
}
*{box-sizing:border-box;}
html,body{margin:0;min-height:100%;}
body{font-family:var(--sans); color:var(--ivory); font-size:16px; line-height:1.4; -webkit-text-size-adjust:100%;
  background:radial-gradient(1200px 700px at 50% -10%, var(--bg-1) 0%, var(--bg-2) 50%, var(--bg-3) 100%); background-attachment:fixed;}
button{font:inherit; color:inherit; cursor:pointer;}
[hidden]{display:none !important;}
#app{max-width:1000px; margin:0 auto; padding:14px 16px 40px;}
.top{display:flex; align-items:center; gap:12px; margin-bottom:14px;}
.logo{width:44px; height:44px; border-radius:50%; display:grid; place-items:center; flex:none; font-size:24px; color:var(--ink);
  background:radial-gradient(circle at 35% 30%, #f6e2a8, var(--gold) 55%, var(--gold-2)); box-shadow:0 2px 0 #6b4a14, 0 6px 14px #0008;}
.brand{flex:1; min-width:0;}
.brand h1{margin:0; font-family:var(--serif); font-size:24px; letter-spacing:.12em; text-transform:uppercase; color:var(--gold-soft); line-height:1.05;}
.brand small{display:block; color:var(--muted); font-size:12.5px; letter-spacing:.04em;}
.chip{display:inline-flex; align-items:center; gap:6px; padding:6px 12px; border-radius:999px; font-size:13px; font-weight:600; border:1px solid var(--line); background:#0006; white-space:nowrap;}
.chip i{width:9px; height:9px; border-radius:50%; background:var(--ok); box-shadow:0 0 8px var(--ok);}
.chip.zu i{background:var(--bad); box-shadow:0 0 8px var(--bad);}
.card{background:linear-gradient(180deg,var(--panel-2),var(--panel)); border:1px solid var(--line); border-radius:14px; padding:16px 18px; box-shadow:0 10px 26px #0006, inset 0 1px 0 #ffffff12;}
.card h2,.card h3{font-family:var(--serif); margin:0 0 8px; color:var(--gold-soft); letter-spacing:.04em;}
.card h2{font-size:20px;} .card h3{font-size:17px;}
.muted{color:var(--muted);}
.btn{border:1px solid #6b4a14; border-radius:10px; padding:10px 16px; font-weight:700; color:var(--ink);
  background:linear-gradient(180deg,#f3dc9c,var(--gold) 50%,var(--gold-2)); box-shadow:0 2px 0 #5a3d0e, 0 6px 14px #0006; transition:transform .08s, filter .15s;}
.btn:hover{filter:brightness(1.07);} .btn:active{transform:translateY(1px);}
.btn.ghost{background:transparent; color:var(--ivory); border-color:var(--line); box-shadow:none;}
.btn.ghost:hover{border-color:var(--gold); color:var(--gold-soft);}
.btn.danger{background:linear-gradient(180deg,#f29a8a,#d1503f 55%,#a63427); color:#fff; border-color:#6e1f15;}
.btn.sm{padding:6px 12px; font-size:14px; border-radius:8px;}
.btn[disabled]{opacity:.45; cursor:default;}
.row{display:flex; gap:8px; flex-wrap:wrap; align-items:center;}
button:focus-visible,select:focus-visible,input:focus-visible{outline:2px solid var(--gold-soft); outline-offset:2px;}
.iconbtn{width:40px; height:40px; border-radius:50%; border:1px solid var(--line); background:#0006; font-size:18px; display:grid; place-items:center;}

.topnav{display:flex; gap:6px; flex-wrap:wrap; margin:0 0 14px;}
.topnav button{padding:8px 15px; border-radius:999px; border:1px solid var(--line); background:#0005; font-size:14.5px;}
.topnav button.on{background:linear-gradient(180deg,#f3dc9c,var(--gold)); color:var(--ink); border-color:#6b4a14; font-weight:700;}
.lvls{display:flex; gap:6px; flex-wrap:wrap; margin:0 0 12px;}
.lvls button{padding:6px 13px; border-radius:9px; border:1px solid var(--line); background:#0005; font-size:14px;}
.lvls button.on{background:var(--teal); color:#04222a; border-color:#1d6a72; font-weight:700;}

/* Gesperrt */
.gate{text-align:center; padding:34px 22px 30px; max-width:560px; margin:24px auto;}
.gate .lock{font-size:70px; line-height:1;}
.gate h2{font-size:24px; margin-top:8px;}
.gate .big{font-family:var(--serif); font-size:34px; color:var(--gold-soft); margin:6px 0 2px; font-variant-numeric:tabular-nums;}
.gate ul{list-style:none; padding:0; margin:16px auto 0; max-width:380px; text-align:left; color:var(--muted); font-size:14.5px;}
.gate li{padding:4px 0 4px 24px; position:relative;} .gate li::before{content:"🧩"; position:absolute; left:0; font-size:13px;}
.teacher{margin-bottom:16px; padding:0;}
.teacher summary{list-style:none; cursor:pointer; padding:12px 18px; display:flex; align-items:center; gap:10px; font-family:var(--serif); color:var(--gold-soft); letter-spacing:.04em; font-size:17px;}
.teacher summary::-webkit-details-marker{display:none;}
.teacher summary .sub{margin-left:auto; font-family:var(--sans); font-size:13px; color:var(--muted); letter-spacing:0;}
.teacher .body{padding:2px 18px 16px; border-top:1px solid var(--line-soft);}
.teacher .klassen{display:flex; flex-wrap:wrap; gap:6px 12px; margin:8px 0 2px; font-size:14px;}
.teacher label{display:inline-flex; align-items:center; gap:5px; color:var(--muted);}

/* Dialog, Toast */
.modal{position:fixed; inset:0; z-index:100; background:rgba(3,8,16,.74); display:grid; place-items:center; padding:16px; overflow:auto;}
.dlg{width:min(520px,100%); max-height:100%; overflow:auto;} .dlg h2{font-size:22px;}
.dlg .actions{display:flex; gap:8px; justify-content:flex-end; margin-top:18px; flex-wrap:wrap;}
#toast{position:fixed; left:50%; bottom:22px; transform:translateX(-50%) translateY(20px); background:#06101df0; border:1px solid var(--gold); color:var(--ivory); padding:10px 16px; border-radius:10px; opacity:0; pointer-events:none; transition:.2s; z-index:200; max-width:90vw; text-align:center;}
#toast.show{opacity:1; transform:translateX(-50%);}
.bar{height:8px; border-radius:99px; background:#0006; overflow:hidden; margin:8px 0;} .bar>i{display:block; height:100%; background:linear-gradient(90deg,var(--gold-2),var(--gold-soft));}

/* Rätsel-Kopf */
.ph{display:flex; align-items:center; gap:10px; flex-wrap:wrap; margin:0 0 10px;}
.ph .grow{flex:1;} .ph .stat{font-variant-numeric:tabular-nums; color:var(--muted); font-size:14px;}
.help{font-size:14.5px; color:var(--muted); margin:0 0 10px;}
.win{margin:12px 0; padding:12px 16px; border-radius:12px; border:1px solid var(--ok); background:#2e7d4f33; text-align:center; font-size:17px;}
.win b{color:var(--gold-soft);}
.paper{background:var(--paper); color:var(--ink); border-radius:12px; border:1px solid var(--pline); box-shadow:0 8px 20px #0007;}

/* Sudoku */
.sd-wrap{display:flex; gap:18px; flex-wrap:wrap; justify-content:center; align-items:flex-start;}
.sd-board{display:grid; background:var(--ink); border:3px solid var(--ink); border-radius:6px; gap:0; width:var(--bs); height:var(--bs); user-select:none; touch-action:manipulation;}
.sd-c{position:relative; background:var(--paper); display:grid; place-items:center; font-size:calc(var(--bs) / var(--n) * .58); font-family:var(--serif); color:#1c4f8f; cursor:pointer; border:0; padding:0; line-height:1; color-scheme:light;}
.sd-c.g{color:var(--ink); font-weight:700;}
.sd-c.peer{background:#e7e0c8;} .sd-c.same{background:#f4d98a;} .sd-c.sel{background:#7fd0d8; box-shadow:inset 0 0 0 3px var(--teal);}
.sd-c.err{color:#c0301f !important; background:#f8d0c8;}
.sd-c.hint{color:#2e7d4f;}
.sd-c .nt{position:absolute; inset:2px; display:grid; font-size:calc(var(--bs) / var(--n) * .22); font-family:var(--sans); color:#4a5a70; line-height:1; text-align:center; align-content:center;}
.sd-c .nt i{font-style:normal;}
.sd-pad{display:grid; gap:8px; width:min(var(--bs), 280px); margin:0 auto;}
.sd-pad button{padding:10px 0; border-radius:10px; border:1px solid var(--line); background:#0007; font-size:20px; font-family:var(--serif);}
.sd-pad button:hover{border-color:var(--gold);} .sd-pad button.done{opacity:.3;}
.sd-tools{display:flex; flex-wrap:wrap; gap:6px; justify-content:center; width:min(var(--bs), 340px); margin:10px auto 0;}
.sd-tools button.on{background:var(--teal); color:#04222a; border-color:#1d6a72;}

/* Logik */
.lg-clues{counter-reset:cl; list-style:none; padding:0; margin:0;}
.lg-clues li{counter-increment:cl; padding:7px 10px 7px 38px; position:relative; border-bottom:1px dashed var(--pline);}
.lg-clues li::before{content:counter(cl); position:absolute; left:8px; top:6px; width:22px; height:22px; border-radius:50%; background:var(--ink); color:var(--gold-soft); display:grid; place-items:center; font-size:12.5px; font-weight:700;}
.lg-clues li.x{opacity:.45; text-decoration:line-through;}
.lg-tab{border-collapse:collapse; width:100%; margin:6px 0;}
.lg-tab th,.lg-tab td{border:1px solid var(--pline); padding:5px 6px; text-align:center;}
.lg-tab th{background:var(--paper-2); font-size:14px;}
.lg-tab th.cat{text-align:left; white-space:nowrap;}
.lg-tab select{width:100%; min-width:84px; padding:6px 4px; border-radius:8px; border:1px solid var(--pline); background:#fff; color:var(--ink); font-size:15px;}
.lg-tab select.err{border-color:#c0301f; background:#fbe0da;} .lg-tab select.ok{border-color:#2e7d4f; background:#dff1e4;}
.lg-two{display:grid; grid-template-columns:minmax(0,1fr) minmax(0,1.25fr); gap:14px;} .lg-two>*{min-width:0;} @media (max-width:760px){.lg-two{grid-template-columns:minmax(0,1fr);}}
.lg-people{display:grid; gap:8px;}
.lg-p{display:flex; gap:10px; align-items:center; padding:8px 10px; border:1px solid var(--pline); border-radius:10px; background:#fff;}
.lg-p .who{font-weight:700; width:92px; flex:none;} .lg-p .st{flex:1; font-size:15.5px;}
.lg-p .ch{display:flex; gap:5px;} .lg-p .ch button{padding:6px 10px; border-radius:8px; border:1px solid var(--pline); background:var(--paper-2); color:var(--ink); font-size:14px;}
.lg-p .ch button.on{background:var(--teal); color:#04222a; border-color:#1d6a72; font-weight:700;}
.lg-p.err{border-color:#c0301f; background:#fbe0da;} .lg-p.ok{border-color:#2e7d4f; background:#dff1e4;}
.zs-g{padding:7px 10px; border-bottom:1px dashed var(--pline); display:flex; gap:12px; align-items:center; flex-wrap:wrap;}
.zs-d{display:inline-flex; gap:4px;} .zs-d b{width:34px; height:40px; display:grid; place-items:center; background:var(--ink); color:var(--gold-soft); border-radius:7px; font-size:21px; font-family:var(--serif);}
.zs-code{display:flex; gap:8px; justify-content:center; margin:10px 0;} .zs-code input{width:52px; height:60px; text-align:center; font-size:30px; border-radius:10px; border:2px solid var(--pline); background:#fff; color:var(--ink); font-family:var(--serif);}
.zs-code input.err{border-color:#c0301f; background:#fbe0da;} .zs-code input.ok{border-color:#2e7d4f; background:#dff1e4;}

/* Kreuzworträtsel */
.cw-wrap{display:grid; grid-template-columns:minmax(0,auto) minmax(0,1fr); gap:16px; align-items:start;} .cw-wrap>*{min-width:0;} @media (max-width:880px){.cw-wrap{grid-template-columns:minmax(0,1fr);}}
.cw-board{display:grid; gap:0; background:var(--ink); border:3px solid var(--ink); border-radius:6px; user-select:none; touch-action:manipulation; width:fit-content; max-width:100%;}
.cw-c{position:relative; width:var(--cs); height:var(--cs); background:var(--ink); border:0; padding:0;}
.cw-c.w{background:var(--paper); cursor:pointer; box-shadow:inset 0 0 0 .5px #8a8466; color:var(--ink);}
.cw-c.w.inw{background:#cfe9ec;} .cw-c.w.cur{background:#f4d98a; box-shadow:inset 0 0 0 3px #d49a14;}
.cw-c .n{position:absolute; left:2px; top:0; font-size:calc(var(--cs) * .27); color:#4a5a70; line-height:1.2; font-family:var(--sans);}
.cw-c .l{position:absolute; inset:0; display:grid; place-items:center; font-size:calc(var(--cs) * .56); font-family:var(--serif); font-weight:700; color:#1c4f8f; padding-top:calc(var(--cs) * .08);}
.cw-c.bad .l{color:#c0301f; background:#f8d0c8;} .cw-c.good .l{color:#2e7d4f;} .cw-c.lk .l{color:var(--ink);}
.cw-cl h3{margin:8px 0 6px;} .cw-cl ol{margin:0 0 6px; padding:0; list-style:none;}
.cw-cl li{padding:5px 8px; border-radius:8px; cursor:pointer; font-size:15px; display:flex; gap:8px;} .cw-cl li b{min-width:26px; color:var(--gold-soft);}
.cw-cl li.act{background:#f4d98a33; outline:1px solid var(--gold);} .cw-cl li.inw{background:#3aa6b022;} .cw-cl li.fertig{opacity:.5;}
.cw-cl li small{color:var(--muted);}
.cw-key{position:fixed; left:-300px; top:0; width:10px; opacity:0;}
.cw-cur{padding:8px 12px; border-radius:10px; background:#0006; border:1px solid var(--line); margin:0 0 10px; min-height:40px;}

@media (max-width:560px){
  #app{padding:10px 10px 32px;} .logo{width:38px;height:38px;font-size:21px;} .brand h1{font-size:18px; letter-spacing:.08em;} .brand small{display:none;}
  .top{flex-wrap:wrap;} .chip{order:10; flex:1 1 100%; justify-content:center; font-size:12.5px;} .card{padding:14px;}
  .topnav button{padding:6px 12px; font-size:13.5px;}
}
@media (prefers-reduced-motion:reduce){*{animation:none !important; transition:none !important;}}
</style>
</head>
<body>
<div id="app">
  <header class="top">
    <div class="logo" aria-hidden="true">🧩</div>
    <div class="brand"><h1>Rätsel &amp; Logik</h1><small>Helfenberger&rsquo;s Library &middot; Sudoku, Logikrätsel, Kreuzworträtsel</small></div>
    <span class="chip" id="chip" hidden><i></i><span id="chipTxt"></span></span>
  </header>
  <nav class="topnav" id="topnav" hidden></nav>
  <div id="gate" hidden></div>
  <details class="card teacher" id="teacher" hidden></details>
  <main id="main"></main>
</div>
<div class="modal" id="modal" hidden></div>
<div id="toast" role="status"></div>
<script>
(function(){
'use strict';
var $ = function(id){ return document.getElementById(id); };
function esc(s){ return String(s == null ? '' : s).replace(/[&<>"']/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]; }); }
function pad(n){ return (n < 10 ? '0' : '') + n; }
function hm(d){ return pad(d.getHours()) + ':' + pad(d.getMinutes()); }
function dstr(d){ return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate()); }
function rnd(n){ return Math.floor(Math.random() * n); }
function pick(a){ return a[rnd(a.length)]; }
function shuffle(a){ a = a.slice(); for(var i = a.length - 1; i > 0; i--){ var j = rnd(i + 1), t = a[i]; a[i] = a[j]; a[j] = t; } return a; }
function fmtT(s){ s = Math.max(0, Math.round(s)); return Math.floor(s / 60) + ':' + pad(s % 60); }
var QS = new URLSearchParams(location.search);
var T0 = Date.now();
/* lokaler Speicher: nie mit hl_ beginnen, nie clear() */
function lsGet(k, def){ try{ var v = localStorage.getItem(k); return v == null ? def : JSON.parse(v); }catch(e){ return def; } }
function lsSet(k, v){ try{ localStorage.setItem(k, JSON.stringify(v)); }catch(e){} }
function lsDel(k){ try{ localStorage.removeItem(k); }catch(e){} }

/* ---------- API: in der Library von der Hülle (window.parent.__hlRaetsel), allein geöffnet eine Attrappe ---------- */
function mockApi(){
  var FKEY = 'raetsel_mock_frei', lehrer = /lehrer/.test(location.search + location.hash);
  function read(k){ try{ return JSON.parse(localStorage.getItem(k) || 'null') || {}; }catch(e){ return {}; } }
  return {
    mock:true, uid:'u1', name:lehrer ? 'Herr Test' : 'Schüler Test', klasse:'G3b', lehrer:lehrer,
    klassen:[{id:'G3a', label:'G3a'}, {id:'G3b', label:'G3b'}],
    ferien:function(){ return false; },
    freigabeWatch:function(cb){ var last = null; function go(){ var s = JSON.stringify(read(FKEY)); if(s !== last){ last = s; var o = JSON.parse(s); cb(o && o.bis ? o : null); } } go(); var iv = setInterval(go, 400); return function(){ clearInterval(iv); }; },
    freigabeSetzen:function(klassen, bis){ localStorage.setItem(FKEY, JSON.stringify({bis:bis, von:'Test'})); return Promise.resolve(); }
  };
}
var API = null;
try{ if(window.parent && window.parent !== window && typeof window.parent.__hlRaetsel === 'function') API = window.parent.__hlRaetsel(); }catch(e){}
if(!API) API = mockApi();

/* ---------- Unterrichtszeit: Mo–Fr 07:30–11:50 und 13:30–16:55 gesperrt (Freitag ab 15:00 frei), Wochenende/Ferien frei ---------- */
function jetzt(){
  if(API.mock && QS.get('jetzt')){ var d = new Date(QS.get('jetzt')); if(!isNaN(d)) return new Date(d.getTime() + (Date.now() - T0)); }
  return new Date();
}
function minToDate(d, min){ var x = new Date(d); x.setHours(Math.floor(min / 60), min % 60, 0, 0); return x; }
function unterricht(d){
  var day = d.getDay(), m = d.getHours() * 60 + d.getMinutes();
  if(day === 0 || day === 6) return {zu:false};
  try{ if(API.ferien && API.ferien(dstr(d))) return {zu:false, ferien:true}; }catch(e){}
  var bl = [[450, 710], [810, day === 5 ? 900 : 1015]], next = null;
  for(var i = 0; i < bl.length; i++){
    if(m >= bl[i][0] && m < bl[i][1]) return {zu:true, bis:minToDate(d, bl[i][1])};
    if(m < bl[i][0] && next == null) next = bl[i][0];
  }
  return {zu:false, ab:next == null ? null : minToDate(d, next)};
}
var S = {view:'sudoku', lehrer:!!API.lehrer, frei:null, offen:null};
function status(){
  var d = jetzt(), u = unterricht(d);
  if(S.lehrer) return {offen:true, lehrer:true, u:u, d:d};
  if(!u.zu) return {offen:true, u:u, d:d};
  if(S.frei && S.frei.bis > Date.now()) return {offen:true, frei:S.frei, u:u, d:d};
  return {offen:false, u:u, d:d};
}
var toastTimer = null;
function toast(msg){ var t = $('toast'); t.textContent = msg; t.classList.add('show'); clearTimeout(toastTimer); toastTimer = setTimeout(function(){ t.classList.remove('show'); }, 2800); }
function modal(html, bind){
  var m = $('modal'); m.innerHTML = '<div class="card dlg" role="dialog" aria-modal="true">' + html + '</div>'; m.hidden = false;
  if(bind) bind(m);
  var f = m.querySelector('button.btn'); if(f) try{ f.focus({preventScroll:true}); }catch(e){}
}
function closeModal(){ var m = $('modal'); m.hidden = true; m.innerHTML = ''; }
function ask(titel, text, okLabel, cb, gefahr){
  modal('<h2>' + esc(titel) + '</h2><p class="muted">' + text + '</p><div class="actions"><button class="btn ghost" data-a="no" type="button">Abbrechen</button><button class="btn' + (gefahr ? ' danger' : '') + '" data-a="ok" type="button">' + esc(okLabel) + '</button></div>', function(m){
    m.querySelector('[data-a="no"]').onclick = closeModal;
    m.querySelector('[data-a="ok"]').onclick = function(){ closeModal(); cb(); };
  });
}
$('modal').addEventListener('click', function(e){ if(e.target === $('modal')) closeModal(); });
/* =====================================================================
   SUDOKU – Erzeugen (eindeutig lösbar, Schwierigkeit über Hinweise und nötige Technik) und Lösen
   ===================================================================== */
var SD_LV = [
  {id:'e4', name:'Einsteiger 4×4', n:4, bw:2, bh:2, givens:8, tech:'naked'},
  {id:'l6', name:'Leicht 6×6', n:6, bw:3, bh:2, givens:17, tech:'naked'},
  {id:'l9', name:'Leicht', n:9, bw:3, bh:3, givens:42, tech:'naked'},
  {id:'m9', name:'Mittel', n:9, bw:3, bh:3, givens:33, tech:'hidden'},
  {id:'s9', name:'Schwer', n:9, bw:3, bh:3, givens:26, tech:'hidden'},
  {id:'p9', name:'Profi', n:9, bw:3, bh:3, givens:24, tech:null}
];
function sdLv(id){ return SD_LV.filter(function(l){ return l.id === id; })[0] || SD_LV[2]; }
function sdPop(m){ var c = 0; while(m){ m &= m - 1; c++; } return c; }
function sdUnits(cfg){
  if(cfg._u) return cfg._u;
  var n = cfg.n, rows = [], cols = [], boxes = [], i, r, c;
  for(i = 0; i < n; i++){ rows.push([]); cols.push([]); boxes.push([]); }
  for(r = 0; r < n; r++) for(c = 0; c < n; c++){ var ix = r * n + c; rows[r].push(ix); cols[c].push(ix); boxes[(r / cfg.bh | 0) * (n / cfg.bw) + (c / cfg.bw | 0)].push(ix); }
  var peers = [];
  for(r = 0; r < n; r++) for(c = 0; c < n; c++){

var WL_LV = [

  h += '<div class="cw-wrap"><div><div class="cw-cur" id="cwCur"></div><div style="overflow-x:auto;padding-bottom:4px"><div id="cwBoard" class="cw-board" style="--cs:max(26px,min(40px,calc((100vw - 56px) / ' + p.cols + '),calc(560px / ' + p.cols + ')));grid-template-columns:repeat(' + p.cols + ',var(--cs))">' + cwBoardHtml() + '</div></div>';
  h += '<div class="row" style="margin-top:12px"><button class="btn" data-a="check" type="button">✔️ Prüfen</button><button class="btn sm ghost" data-a="letter" type="button">💡 Buchstabe</button><button class="btn sm ghost" data-a="wort" type="button">💡 Wort</button><button class="btn sm ghost" data-a="clear" type="button">🧹 Alles löschen</button><button class="btn sm" data-a="neu" type="button">🎲 Neues Rätsel</button></div></div>';
  h += '<div class="cw-cl" id="cwClues">' + cwCluesHtml() + '</div></div></div><input class="cw-key" id="cwKey" type="text" autocomplete="off" autocapitalize="characters" autocorrect="off" spellcheck="false" aria-label="Eingabe für das Kreuzworträtsel">';
  m.innerHTML = h; cwBind(); cwInfo(); cwWinBox();
}
function cwBoardHtml(){
  var p = CW.p, h = '', cur = CW.sel ? cwWord(CW.sel[0], CW.sel[1], CW.dir) : null, inw = {};
  if(cur) cwCells(cur).forEach(function(x){ inw[x[0] + ',' + x[1]] = 1; });
  for(var r = 0; r < p.rows; r++) for(var c = 0; c < p.cols; c++){
    var k = r + ',' + c, g = CW.grid[k];
    if(!g){ h += '<div class="cw-c"></div>'; continue; }
    var cls = 'cw-c w' + (inw[k] ? ' inw' : '') + (CW.sel && CW.sel[0] === r && CW.sel[1] === c ? ' cur' : '') + (CW.flags && CW.flags[k] ? ' ' + CW.flags[k] : '');
    h += '<div class="' + cls + '" data-r="' + r + '" data-c="' + c + '">' + (g.n ? '<span class="n">' + g.n + '</span>' : '') + '<span class="l">' + esc(CW.letters[k] || '') + '</span></div>';
  }
  return h;
}
function cwCluesHtml(){
  var p = CW.p, cur = CW.sel ? cwWord(CW.sel[0], CW.sel[1], CW.dir) : null, other = CW.sel ? cwWord(CW.sel[0], CW.sel[1], CW.dir === 'h' ? 'v' : 'h') : null, h = '';
  [['h', 'Waagrecht →'], ['v', 'Senkrecht ↓']].forEach(function(d){
    h += '<h3>' + d[1] + '</h3><ol>';
    p.items.forEach(function(it, i){
      if(it.dir !== d[0]) return;
      var done = cwCells(it).every(function(x){ return CW.letters[x[0] + ',' + x[1]]; });
      h += '<li data-i="' + i + '" class="' + (it === cur ? 'act' : it === other ? 'inw' : '') + (done ? ' fertig' : '') + '"><b>' + it.n + '</b><span>' + esc(it.clue) + ' <small>(' + it.w.length + ')</small></span></li>';
    });
    h += '</ol>';
  });
  return h;
}
function cwInfo(){
  var el = $('cwCur'); if(!el) return;
  var it = CW.sel ? cwWord(CW.sel[0], CW.sel[1], CW.dir) : null;
  el.innerHTML = it ? '<b style="color:var(--gold-soft)">' + it.n + (it.dir === 'h' ? ' waagrecht' : ' senkrecht') + '</b> · ' + esc(it.clue) + ' <span class="muted">(' + it.w.length + ' Buchstaben)</span>' : '<span class="muted">Tippe ein Feld oder einen Hinweis an.</span>';
}
function cwWinBox(){
  var el = $('cwWin'); if(!el) return;
  el.innerHTML = CW.won ? '<div class="win">🎉 Gelöst! <b>' + fmtT(CW.el) + '</b> Minuten' + (CW.hints ? ' mit ' + CW.hints + (CW.hints === 1 ? ' Tipp' : ' Tipps') : ' ohne Tipp') + '.<div class="row" style="justify-content:center;margin-top:8px"><button class="btn" data-a="neu" type="button">Neues Rätsel</button></div></div>' : '';
  el.querySelectorAll('[data-a]').forEach(function(b){ b.onclick = function(){ cwAction(b.dataset.a); }; });
}
function cwRefresh(){
  var b = $('cwBoard'); if(!b) return; b.innerHTML = cwBoardHtml(); $('cwClues').innerHTML = cwCluesHtml(); cwBindClues(); cwInfo(); cwWinBox();
}
function cwSelect(r, c, dir){
  CW.sel = [r, c];
  if(dir) CW.dir = dir; else if(!cwWord(r, c, CW.dir)) CW.dir = CW.dir === 'h' ? 'v' : 'h';
  CW.flags = null; cwRefresh();
  var k = $('cwKey'); if(k){ try{ k.focus({preventScroll:true}); }catch(e){} }
}
function cwCheckWin(){
  if(CW.won) return;
  var ok = true; Object.keys(CW.grid).forEach(function(k){ if(CW.letters[k] !== CW.grid[k].ch) ok = false; });
  if(ok){ cwCommit(); CW.won = true; cwSave(); }
}
function cwType(ch){
  if(!CW.sel || CW.won) return;
  var k = CW.sel[0] + ',' + CW.sel[1]; CW.letters[k] = ch; CW.flags = null;
  var it = cwWord(CW.sel[0], CW.sel[1], CW.dir), cells = it ? cwCells(it) : [], i = cells.findIndex(function(x){ return x[0] === CW.sel[0] && x[1] === CW.sel[1]; });
  if(i >= 0 && cells[i + 1]) CW.sel = cells[i + 1];
  cwCheckWin(); cwSave(); cwRefresh();
}
function cwBack(){
  if(!CW.sel || CW.won) return;
  var k = CW.sel[0] + ',' + CW.sel[1];
  if(CW.letters[k]){ delete CW.letters[k]; }
  else { var it = cwWord(CW.sel[0], CW.sel[1], CW.dir), cells = it ? cwCells(it) : [], i = cells.findIndex(function(x){ return x[0] === CW.sel[0] && x[1] === CW.sel[1]; }); if(i > 0){ CW.sel = cells[i - 1]; delete CW.letters[CW.sel[0] + ',' + CW.sel[1]]; } }
  CW.flags = null; cwSave(); cwRefresh();
}
function cwMoveArrow(dr, dc){
  if(!CW.sel){ var f = CW.p.items[0]; cwSelect(f.r, f.c, f.dir); return; }
  var r = CW.sel[0] + dr, c = CW.sel[1] + dc;
  while(r >= 0 && c >= 0 && r < CW.p.rows && c < CW.p.cols && !CW.grid[r + ',' + c]){ r += dr; c += dc; }
  if(r >= 0 && c >= 0 && r < CW.p.rows && c < CW.p.cols){ CW.sel = [r, c]; if(!cwWord(r, c, CW.dir)) CW.dir = CW.dir === 'h' ? 'v' : 'h'; CW.flags = null; cwRefresh(); }
}
function cwNextWord(back){
  var items = CW.p.items, cur = CW.sel ? cwWord(CW.sel[0], CW.sel[1], CW.dir) : null, i = cur ? items.indexOf(cur) : -1;
  var nx = items[(i + (back ? -1 : 1) + items.length) % items.length]; cwSelect(nx.r, nx.c, nx.dir);
}
function cwAction(a){
  var p = CW.p;
  if(a === 'neu'){ var go = function(){ cwNew(CW.lv); cwRender(); }; if(!CW.won && Object.keys(CW.letters).length) ask('Neues Rätsel?', 'Dein angefangenes Rätsel geht verloren.', 'Neues Rätsel', go, true); else go(); }
  else if(a === 'clear') ask('Alles löschen?', 'Alle deine Buchstaben in diesem Rätsel werden gelöscht.', 'Löschen', function(){ CW.letters = {}; CW.flags = null; CW.won = false; CW.el = 0; CW.t = Date.now(); CW.hints = 0; cwSave(); cwRender(); });
  else if(a === 'check'){
    var bad = 0, filled = 0; CW.flags = {};
    Object.keys(CW.grid).forEach(function(k){ var l = CW.letters[k]; if(!l) return; filled++; if(l !== CW.grid[k].ch){ CW.flags[k] = 'bad'; bad++; } });
    toast(!filled ? 'Schreibe zuerst etwas ein.' : bad ? bad + (bad === 1 ? ' Buchstabe ist falsch (rot).' : ' Buchstaben sind falsch (rot).') : 'Bis jetzt stimmt alles!'); cwRefresh();
  }
  else if(a === 'letter' || a === 'wort'){
    if(!CW.sel){ toast('Tippe zuerst ein Feld an.'); return; }
    var it = cwWord(CW.sel[0], CW.sel[1], CW.dir), todo = a === 'letter' ? [CW.sel] : (it ? cwCells(it) : []), n = 0;
    todo.forEach(function(x){ var k = x[0] + ',' + x[1]; if(CW.letters[k] !== CW.grid[k].ch){ CW.letters[k] = CW.grid[k].ch; n++; } });
    if(n){ CW.hints += a === 'letter' ? 1 : 2; CW.flags = null; cwCheckWin(); cwSave(); cwRefresh(); } else toast('Das stimmt schon.');
  }
}
function cwBindClues(){
  document.querySelectorAll('#cwClues li').forEach(function(li){ li.onclick = function(){ var it = CW.p.items[+li.dataset.i]; cwSelect(it.r, it.c, it.dir); }; });
}
function cwBind(){
  var m = $('main');
  m.querySelectorAll('[data-lv]').forEach(function(b){ b.onclick = function(){ cwCommit(); cwSave(); cwLoad(b.dataset.lv); cwRender(); }; });
  m.querySelectorAll('.row [data-a]').forEach(function(b){ b.onclick = function(){ cwAction(b.dataset.a); }; });
  $('cwBoard').onclick = function(e){
    var c = e.target.closest ? e.target.closest('.cw-c.w') : null; if(!c) return;
    var r = +c.dataset.r, cc = +c.dataset.c;
    if(CW.sel && CW.sel[0] === r && CW.sel[1] === cc){ var o = CW.dir === 'h' ? 'v' : 'h'; if(cwWord(r, cc, o)) CW.dir = o; cwSelect(r, cc, CW.dir); }
    else cwSelect(r, cc);
  };
  cwBindClues();
  var k = $('cwKey');
  k.oninput = function(){
    var v = (k.value || '').toUpperCase(); k.value = '';
    v = v.replace(/Ä/g, 'AE').replace(/Ö/g, 'OE').replace(/Ü/g, 'UE').replace(/ß/g, 'SS');
    for(var i = 0; i < v.length; i++) if(v[i] >= 'A' && v[i] <= 'Z') cwType(v[i]);
  };
  k.onkeydown = function(e){
    if(e.key === 'Backspace'){ cwBack(); e.preventDefault(); }
    else if(e.key === 'ArrowUp'){ cwMoveArrow(-1, 0); e.preventDefault(); } else if(e.key === 'ArrowDown'){ cwMoveArrow(1, 0); e.preventDefault(); }
    else if(e.key === 'ArrowLeft'){ cwMoveArrow(0, -1); e.preventDefault(); } else if(e.key === 'ArrowRight'){ cwMoveArrow(0, 1); e.preventDefault(); }
    else if(e.key === 'Tab'){ cwNextWord(e.shiftKey); e.preventDefault(); }
    else if(e.key === 'Enter' || e.key === ' '){ if(CW.sel){ var o = CW.dir === 'h' ? 'v' : 'h'; if(cwWord(CW.sel[0], CW.sel[1], o)){ CW.dir = o; cwRefresh(); } } e.preventDefault(); }
  };
}
function showKreuz(){ if(!CW.p) cwLoad(CW.lv); cwRender(); }
/* =====================================================================
   Gesperrt / Lehrperson / Navigation / Start
   ===================================================================== */
function renderGate(st){
  var g = $('gate'), nm = $('gateCount');
  g.innerHTML = '<div class="card gate"><div class="lock">🔒</div><h2>Die Rätsel sind geschlossen</h2><p class="muted">Im Unterricht wird nicht geknobelt – ausser deine Lehrperson schaltet es frei.</p>' +
    '<div class="big" id="gateCount"></div><div class="muted" id="gateSub"></div>' +
    '<ul><li>Frei: vor 07:30, über Mittag (11:50–13:30) und ab 16:55</li><li>Freitag ab 15:00 (Freifach) und am Wochenende</li><li>Deine Lehrperson kann Sudoku, Logik- und Kreuzworträtsel für die Klasse freischalten</li></ul></div>';
  gateTick(st);
}
function gateTick(st){
  var c = $('gateCount'); if(!c) return;
  var ende = st.u && st.u.bis;
  if(ende){
    var s = Math.max(0, Math.round((ende - jetzt()) / 1000)), hh = Math.floor(s / 3600), mm = Math.floor(s % 3600 / 60);
    c.textContent = (hh ? hh + ':' + pad(mm) : mm) + ':' + pad(s % 60);
    $('gateSub').textContent = 'bis ' + hm(ende) + ' Uhr geschlossen';
  }
}
function renderTeacher(st){
  var t = $('teacher');
  if(!S.lehrer){ t.hidden = true; return; }
  t.hidden = false;
  var open = t.open, u = st.u, kl = API.klassen || [], sel = lsGet('raetsel_klassen', [API.klasse]);
  var f = S.frei && S.frei.bis > Date.now() ? S.frei : null;
  var sub = f ? '🔓 freigeschaltet bis ' + hm(new Date(f.bis)) : (u.zu ? '🔒 für Schüler:innen gesperrt bis ' + hm(u.bis) : '🟢 gerade ohnehin offen');
  var h = '<summary><span>🔑</span> Lehrperson: Freischaltung <span class="sub">' + esc(sub) + '</span></summary><div class="body">';
  h += '<p class="muted" style="margin:10px 0 8px">Im Unterricht (Mo–Fr 07:30–11:50 und 13:30–16:55, Freitag ab 15:00 frei) sind Sudoku, Logikrätsel und Kreuzworträtsel für Schüler:innen gesperrt. Hier schaltest du sie für <b>' + esc(API.klasse) + '</b>' + (kl.length > 1 ? ' (und gewählte Klassen)' : '') + ' frei. Du selbst kannst immer rätseln.</p><div class="row">';
  [15, 30, 45].forEach(function(m){ h += '<button class="btn sm" data-fr="' + m + '" type="button">🔓 ' + m + ' Min</button>'; });
  if(u.zu) h += '<button class="btn sm" data-fr="ende" type="button">🔓 Bis ' + hm(u.bis) + '</button>';
  h += '<button class="btn sm ghost" data-fr="0" type="button">🔒 Wieder sperren</button></div>';
  if(kl.length > 1) h += '<div class="klassen"><span class="muted">Auch für:</span>' + kl.map(function(k){ return '<label><input type="checkbox" data-k="' + esc(k.id) + '"' + (sel.indexOf(k.id) >= 0 || k.id === API.klasse ? ' checked' : '') + (k.id === API.klasse ? ' disabled' : '') + '> ' + esc(k.label) + '</label>'; }).join('') + '</div>';
  h += '</div>';
  t.innerHTML = h; t.open = open;
  t.querySelectorAll('[data-fr]').forEach(function(b){ b.onclick = function(){
    var v = b.dataset.fr, bis;
    if(v === 'ende') bis = Date.now() + (st.u.bis - jetzt()); else if(v === '0') bis = 0; else bis = Date.now() + (+v) * 60000;
    var ks = [API.klasse]; t.querySelectorAll('[data-k]').forEach(function(c){ if(c.checked && ks.indexOf(c.dataset.k) < 0) ks.push(c.dataset.k); });
    lsSet('raetsel_klassen', ks);
    Promise.resolve(API.freigabeSetzen(ks, bis)).then(function(){ toast(bis ? 'Die Rätsel sind freigeschaltet.' : 'Die Rätsel sind wieder gesperrt.'); }).catch(function(e){ console.error(e); toast('Das hat nicht geklappt.'); });
  }; });
}
var NAV = [['sudoku', '🔢 Sudoku'], ['logik', '🕵️ Logikrätsel'], ['kreuz', '✏️ Kreuzworträtsel']];
function renderNav(){
  var n = $('topnav'); n.hidden = false;
  n.innerHTML = NAV.map(function(i){ return '<button type="button" data-v="' + i[0] + '" class="' + (S.view === i[0] ? 'on' : '') + '">' + i[1] + '</button>'; }).join('');
  n.querySelectorAll('[data-v]').forEach(function(b){ b.onclick = function(){ leaveView(); S.view = b.dataset.v; lsSet('raetsel_view', S.view); lastKey = ''; refresh(true); }; });
}
function leaveView(){ if(S.view === 'sudoku'){ sdCommitTime(); sdSave(); } else if(S.view === 'logik'){ lgCommit(LG.sub); lgSave(LG.sub); } else if(S.view === 'kreuz'){ cwCommit(); cwSave(); } }
function showView(){ if(S.view === 'sudoku') showSudoku(); else if(S.view === 'logik') showLogik(); else showKreuz(); }
var lastKey = '';
function refresh(force){
  var st = status(), key = (st.offen ? 'o' : 'z') + (st.lehrer ? 'L' : '') + (st.frei ? st.frei.bis : '') + S.view;
  var chip = $('chip'); chip.hidden = false; chip.classList.toggle('zu', !st.offen);
  var txt;
  if(st.lehrer) txt = !st.u.zu ? 'Offen' : (S.frei && S.frei.bis > Date.now() ? 'Freigeschaltet bis ' + hm(new Date(S.frei.bis)) : 'Schüler:innen: gesperrt bis ' + hm(st.u.bis));
  else if(!st.offen) txt = 'Gesperrt bis ' + hm(st.u.bis);
  else if(st.frei) txt = 'Freigeschaltet bis ' + hm(new Date(st.frei.bis));
  else txt = st.u.ab ? 'Offen bis ' + hm(st.u.ab) : 'Offen';
  $('chipTxt').textContent = txt;
  if(!st.offen && S.offen !== false && S.offen !== null) leaveView();    // Sperre beginnt: Stand sichern
  S.offen = st.offen;
  if(force || key !== lastKey){
    var wasOffen = lastKey.charAt(0) === 'o', nowOffen = st.offen;
    lastKey = key;
    $('gate').hidden = st.offen;
    if(!st.offen){ renderGate(st); $('main').innerHTML = ''; $('topnav').hidden = true; }
    else { renderNav(); if(!wasOffen || force || $('main').innerHTML === '') showView(); else if(!document.activeElement || document.activeElement.tagName === 'BODY') { /* nichts */ } }
    renderTeacher(st);
  } else if(!st.offen) gateTick(st);
}
function tickTimes(){
  var e;
  if(S.view === 'sudoku' && SD.p && (e = $('sdTime'))) e.textContent = '⏱ ' + fmtT(sdElapsed());
  else if(S.view === 'logik' && (e = $('lgTime')) && LG[LG.sub].p) e.textContent = '⏱ ' + fmtT(lgElapsed(LG[LG.sub]));
  else if(S.view === 'kreuz' && CW.p && (e = $('cwTime'))) e.textContent = '⏱ ' + fmtT(cwElapsed());
}
function init(){
  var v = lsGet('raetsel_view', 'sudoku'); if(['sudoku', 'logik', 'kreuz'].indexOf(v) >= 0) S.view = v;
  API.freigabeWatch(function(f){ S.frei = f; refresh(true); });
  refresh(true);
  setInterval(function(){ refresh(); tickTimes(); }, 1000);
  window.addEventListener('pagehide', leaveView);
  if(API.mock){ window.__raetsel = {S:S, SD:SD, LG:LG, CW:CW}; }
}
init();
})();
</script>
