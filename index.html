<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Helfenberger's Library</title>
<link rel="icon" href="assets/icon-192.png">
<link rel="apple-touch-icon" href="assets/icon-180.png">
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#3A3F73">
<script>
// Gespeicherte Dark-/Light-Mode-Wahl VOR dem ersten Rendern setzen, sonst blitzt
// beim Laden kurz das falsche Theme auf (Systemvorgabe statt manueller Wahl).
(function(){
  try{
    var t = localStorage.getItem('hl_theme');
    if(t === 'dark' || t === 'light'){ document.documentElement.setAttribute('data-theme', t); }
  }catch(e){}
})();
</script>
<!-- "Zum Home-Bildschirm hinzufügen" auf iOS ignoriert das Web-Manifest weitgehend und
     braucht diese eigenen Meta-Tags, um als eigenständige App (ohne Safari-Chrome) zu starten. -->
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Library">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Karla:ital,wght@0,400;0,500;0,600;0,700;1,400&display=swap">
<style>
  :root{
    --bg:#F4F5FA;
    --surface:#FFFFFF;
    --surface-2:#EEF0F8;
    --border:#DDE1EE;
    --text:#1C2033;
    --text-muted:#666C87;
    --brand:#3A3F73;
    --brand-ink:#22254A;
    --brand-contrast:#FFFFFF;
    --good:#2E9E5B; --good-soft:#DEF3E6;
    --bad:#E63950; --bad-soft:#FBDDE1;
    --radius:20px;
    --radius-sm:13px;
    --shadow:0 1px 2px rgba(20,20,40,.06), 0 14px 32px -16px rgba(20,20,40,.25);
    color-scheme: light;
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --bg:#14162200; --bg:#14161F; --surface:#1C1F2E; --surface-2:#242840; --border:#323752;
      --text:#EDEEF7; --text-muted:#A0A5C2;
      --brand:#8890E8; --brand-ink:#C4C9FA; --brand-contrast:#14161F;
      --good:#4FCB84; --good-soft:#173428;
      --bad:#F0748A; --bad-soft:#3A1B22;
      --shadow:0 1px 2px rgba(0,0,0,.5), 0 14px 32px -16px rgba(0,0,0,.6);
      color-scheme: dark;
    }
  }
  :root[data-theme="dark"]{
    --bg:#14161F; --surface:#1C1F2E; --surface-2:#242840; --border:#323752;
    --text:#EDEEF7; --text-muted:#A0A5C2;
    --brand:#8890E8; --brand-ink:#C4C9FA; --brand-contrast:#14161F;
    --good:#4FCB84; --good-soft:#173428;
    --bad:#F0748A; --bad-soft:#3A1B22;
    color-scheme: dark;
  }

  *{box-sizing:border-box;}
  html{margin:0;padding:0;background:var(--bg);}
  html,body{min-height:100%;overflow-x:hidden;}
  body{
    margin:0;padding:0;color:var(--text);
    font:15px/1.5 Karla,-apple-system,BlinkMacSystemFont,sans-serif;
    background-color:var(--bg);
    background-image:
      radial-gradient(ellipse at 12% 0%, color-mix(in srgb, var(--brand) 5%, transparent), transparent 45%),
      radial-gradient(ellipse at 100% 100%, color-mix(in srgb, #C98B1F 6%, transparent), transparent 50%),
      linear-gradient(color-mix(in srgb, var(--bg) 88%, transparent), color-mix(in srgb, var(--bg) 88%, transparent)),
      url('assets/background.jpg');
    background-size:auto,auto,cover,cover;
    background-position:center,center,center,center;
    background-repeat:no-repeat;
    background-attachment:fixed;
  }
  /* Mobile: "background-attachment:fixed" combined with a background-image on
     <body> is notoriously unreliable on phone browsers (especially iOS
     Safari) — the photo only paints inside the first viewport-height and then
     disappears while scrolling, since mobile browsers don't reliably repaint
     a fixed background against the dynamic viewport. Rather than fight that,
     the photo layer is simply dropped below this breakpoint (explicit user
     request: keep it on desktop, drop it on the phone/app version); the two
     subtle gradient accents stay so the background doesn't look flat. */
  @media (max-width:600px){
    body{
      background-image:
        radial-gradient(ellipse at 12% 0%, color-mix(in srgb, var(--brand) 5%, transparent), transparent 45%),
        radial-gradient(ellipse at 100% 100%, color-mix(in srgb, #C98B1F 6%, transparent), transparent 50%);
      background-size:auto,auto;
      background-position:center,center;
      background-attachment:scroll;
    }
  }
  /* Testseite: Hintergrund rot statt blau getönt, damit man sie sofort von
     der Live-Seite unterscheidet. Klasse wird im <head> gesetzt (Pfad enthält -test/). */
  html.test-site{--test-bg:color-mix(in srgb, var(--bg) 82%, #E53935);background:var(--test-bg);}
  html.test-site body{
    background-color:var(--test-bg);
    background-image:
      radial-gradient(ellipse at 12% 0%, rgba(229,57,53,.16), transparent 45%),
      radial-gradient(ellipse at 100% 100%, rgba(229,57,53,.12), transparent 50%),
      linear-gradient(color-mix(in srgb, var(--test-bg) 88%, transparent), color-mix(in srgb, var(--test-bg) 88%, transparent)),
      url('assets/background.jpg');
  }
  @media (max-width:600px){
    html.test-site body{
      background-image:
        radial-gradient(ellipse at 12% 0%, rgba(229,57,53,.16), transparent 45%),
        radial-gradient(ellipse at 100% 100%, rgba(229,57,53,.12), transparent 50%);
    }
  }
  .desk-prop{position:fixed;bottom:0;font-size:64px;line-height:1;opacity:.5;pointer-events:none;z-index:0;filter:saturate(.9);}
  .desk-prop-left{left:14px;}
  .desk-prop-right{right:70px;}
  /* Bleistift-Easter-Egg: eigenes Element statt Teil des dekorativen
     "☕✏️"-Texts, damit genau dieser Bleistift klickbar sein kann, ohne die
     ganze Kaffeetasse mit-interaktiv zu machen. */
  .desk-prop-pencil{right:14px;z-index:2;background:none;border:0;padding:0;margin:0;color:inherit;pointer-events:auto;cursor:pointer;transition:opacity .15s ease;}
  .desk-prop-pencil:hover,.desk-prop-pencil:focus-visible{opacity:.75;}
  .desk-prop-pencil:focus-visible{outline:2px solid var(--brand);outline-offset:3px;border-radius:8px;}
  .desk-prop-pencil-off{opacity:.22;filter:grayscale(1) saturate(.9);}
  .pencil-bubble{position:fixed;bottom:92px;right:14px;z-index:70;background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);box-shadow:0 10px 30px rgba(0,0,0,.18);padding:14px 16px;width:280px;max-width:calc(100vw - 28px);}
  .pencil-bubble::after{content:'';position:absolute;bottom:-9px;right:26px;width:16px;height:16px;background:var(--surface);border-right:1px solid var(--border);border-bottom:1px solid var(--border);transform:rotate(45deg);}
  .pencil-bubble-close{position:absolute;top:4px;right:6px;background:none;border:0;font-size:19px;line-height:1;cursor:pointer;color:var(--text-muted);padding:4px 7px;}
  .pencil-bubble-msg{font-size:14px;line-height:1.5;padding-right:16px;}
  .pencil-bubble-teacher{margin-top:10px;padding-top:10px;border-top:1px dashed var(--border);}
  .pencil-bubble-teacher textarea{width:100%;box-sizing:border-box;margin:6px 0 10px;font:inherit;padding:8px 10px;border:1px solid var(--border);border-radius:10px;background:var(--surface-2);color:var(--text);resize:vertical;}
  .pencil-bubble-actions{display:flex;gap:8px;flex-wrap:wrap;}

  /* ---------- Schulden ("Geld-Symbol" oben links) ---------- */
  .topbar-coin{position:relative;font-size:17px;line-height:1;padding:7px 10px;flex-shrink:0;}
  .topbar-coin-badge{position:absolute;top:-3px;right:-3px;min-width:18px;height:18px;padding:0 4px;box-sizing:border-box;border-radius:999px;background:var(--bad);color:#fff;font-size:10.5px;font-weight:800;line-height:18px;text-align:center;}
  .coin-bubble{position:fixed;top:66px;left:14px;z-index:70;background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);box-shadow:0 10px 30px rgba(0,0,0,.18);padding:14px 16px;width:300px;max-width:calc(100vw - 28px);}
  .coin-bubble::before{content:'';position:absolute;top:-9px;left:28px;width:16px;height:16px;background:var(--surface);border-left:1px solid var(--border);border-top:1px solid var(--border);transform:rotate(45deg);}
  .coin-bubble h4{margin:0 0 8px;font-size:15px;padding-right:18px;}
  .coin-bubble-close{position:absolute;top:4px;right:6px;background:none;border:0;font-size:19px;line-height:1;cursor:pointer;color:var(--text-muted);padding:4px 7px;}
  .coin-bubble-total{font-weight:800;color:var(--bad);font-size:17px;margin-bottom:8px;}
  .coin-list{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px;font-size:13.5px;}
  .coin-list li{display:flex;justify-content:space-between;gap:10px;border-top:1px dashed var(--border);padding-top:6px;}
  .coin-list li span{min-width:0;overflow-wrap:anywhere;}
  .coin-list li b{white-space:nowrap;}
  .debt-list{max-height:calc(85vh - 320px);overflow-y:auto;margin:10px 0;}
  .debt-row,.debt-entry{display:flex;align-items:center;gap:10px;padding:8px 2px;border-bottom:1px solid var(--border);font-size:14.5px;}
  .debt-row-name,.debt-entry-what{flex:1;min-width:0;overflow-wrap:anywhere;}
  .debt-entry-date{font-size:11.5px;color:var(--text-muted);}
  .debt-row-sum{font-weight:800;white-space:nowrap;color:var(--text-muted);}
  .debt-row-sum.has-debt{color:var(--bad);}
  .debt-divider{font-size:12px;font-weight:700;color:var(--text-muted);letter-spacing:.03em;text-transform:uppercase;margin:16px 0 4px;}
  .debt-form{display:flex;gap:10px;flex-wrap:wrap;align-items:flex-end;margin:14px 0 6px;}
  .debt-form input{margin-bottom:0 !important;}
  .debt-form-amount{width:120px;}
  .debt-form-what{flex:1;min-width:160px;}
  @media (max-width:900px){ .desk-prop{display:none;} }
  #app{position:relative;z-index:1;}
  h1,h2,h3{font-family:'Baloo 2',Karla,sans-serif;margin:0 0 6px;}
  button{font:inherit;cursor:pointer;}
  input{font:inherit;}
  a{color:inherit;}

  #app{min-height:100vh;display:flex;flex-direction:column;}

  /* ---------- Login ---------- */
  .login-wrap{flex:1;display:flex;align-items:center;justify-content:center;padding:24px;}
  .login-card{width:100%;max-width:400px;background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);box-shadow:var(--shadow);padding:36px 32px;text-align:center;}
  .login-logo{width:100%;max-width:210px;margin:0 auto 14px;}
  .login-logo img{width:100%;height:auto;object-fit:contain;display:block;}
  .login-card h1{font-size:26px;color:var(--brand-ink);}
  .login-card p.sub{color:var(--text-muted);margin:0 0 22px;font-size:14px;}
  .login-card input{width:100%;padding:13px 14px;border:2px solid var(--border);border-radius:var(--radius-sm);background:var(--surface-2);color:var(--text);margin-bottom:12px;text-align:center;font-size:16px;}
  .login-card input:focus{outline:none;border-color:var(--brand);}
  .login-card .btn{width:100%;}
  .login-err{background:var(--bad-soft);color:var(--bad);border-radius:var(--radius-sm);padding:10px 12px;font-size:13px;margin-bottom:12px;display:none;}
  .login-err.show{display:block;}
  .login-hint{margin-top:18px;font-size:12px;color:var(--text-muted);}

  /* ---------- Buttons ---------- */
  .btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:12px 20px;border-radius:999px;border:none;font-weight:700;font-size:14px;transition:transform .12s ease, box-shadow .12s ease;}
  .btn:active{transform:scale(.97);}
  .btn-primary{background:var(--brand);color:var(--brand-contrast);box-shadow:0 8px 20px -8px color-mix(in srgb, var(--brand) 60%, transparent);}
  .btn-primary:hover{box-shadow:0 10px 24px -8px color-mix(in srgb, var(--brand) 70%, transparent);}
  .btn-ghost{background:var(--surface-2);color:var(--text);}
  .btn-ghost:hover{background:var(--border);}
  .btn-sm{padding:8px 14px;font-size:13px;}
  .btn-danger{background:var(--bad-soft);color:var(--bad);}

  /* ---------- Chrome / header ---------- */
  .topbar{display:flex;align-items:center;flex-wrap:wrap;row-gap:8px;gap:14px;padding:14px 22px;background:var(--surface);border-bottom:1px solid var(--border);position:sticky;top:0;z-index:20;}
  .topbar-logo{height:36px;width:auto;flex-shrink:0;cursor:pointer;display:flex;align-items:center;}
  .topbar-logo img{height:100%;width:auto;object-fit:contain;display:block;}
  .topbar-title{font-family:'Baloo 2';font-weight:800;font-size:17px;color:var(--brand-ink);cursor:pointer;}
  .topbar-ferien{display:flex;align-items:center;gap:4px;font-size:12px;color:var(--text-muted);white-space:nowrap;}
  .topbar-ferien b{color:var(--bad);font-weight:700;}
  .topbar-spacer{flex:1;}
  /* margin-left:auto (not just the spacer) so this block still hugs the right edge
     even when it wraps onto its own row on a narrow screen — see the mobile
     breakpoint below, which is what keeps the topbar from overflowing sideways. */
  .topbar-user{display:flex;align-items:center;flex-wrap:wrap;gap:10px;margin-left:auto;font-size:14px;color:var(--text-muted);}
  .topbar-user b{color:var(--text);}
  .topbar-bell{position:relative;font-size:17px;line-height:1;padding:7px 10px;}
  .push-popover{position:fixed;top:60px;right:18px;z-index:60;background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);box-shadow:0 10px 30px rgba(0,0,0,.18);padding:14px 16px;width:270px;}
  .push-popover h4{margin:0 0 6px;font-size:14.5px;}
  .push-popover .push-hint{font-size:12.5px;color:var(--text-muted);margin:4px 0 10px;}
  @media (max-width:480px){
    .topbar{padding:12px 16px;gap:10px;}
    .topbar-user{font-size:12.5px;gap:7px;}
    .badge-teacher{padding:2px 8px;font-size:10px;}
    .topbar-user .btn-sm{padding:7px 12px;font-size:12px;}
    .topbar-ferien{font-size:11px;}
  }
  .badge-teacher{background:var(--brand);color:var(--brand-contrast);border-radius:999px;padding:2px 10px;font-size:11px;font-weight:700;letter-spacing:.02em;}

  .content{flex:1;max-width:1100px;margin:0 auto;padding:28px 22px 60px;width:100%;}

  /* ---------- Home / subject grid ---------- */
  /* Prägnanter Begrüssungstitel direkt auf dem Seitenhintergrund (Foto in body),
     ohne eigene Box/Wandtafel-Deko dahinter - siehe helfenberger-library-quickfix. */
  .page-welcome{font-size:26px;font-weight:800;color:#fff;text-shadow:0 2px 12px rgba(0,0,0,.5);margin:4px 0 22px;}

  .subject-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:20px;}
  @media (max-width:840px){ .subject-grid{grid-template-columns:repeat(2,1fr);} }
  @media (max-width:560px){ .subject-grid{grid-template-columns:1fr;} }
  .subject-card{background:var(--surface);border:1px solid var(--border);border-radius:22px;padding:22px 20px;text-align:left;box-shadow:var(--shadow);transition:transform .15s ease, box-shadow .15s ease;display:flex;align-items:center;gap:18px;min-height:150px;}
  .subject-card-wide{grid-column:1/-1;}
  .subject-card:hover{transform:translateY(-3px);box-shadow:0 18px 34px -16px rgba(20,20,40,.32);}
  .subject-card-body{flex:1;min-width:0;display:flex;flex-direction:column;gap:9px;}
  .subject-visual{border-radius:18px;display:flex;align-items:center;justify-content:center;flex-shrink:0;overflow:hidden;}
  .subject-visual img{width:100%;height:100%;object-fit:contain;padding:11px;box-sizing:border-box;display:block;}
  .subject-card .subject-visual{width:84px;height:84px;}
  .subject-head .subject-visual{width:56px;height:56px;border-radius:16px;}
  .subject-card h3{font-size:18px;}
  .subject-meta{font-size:12.5px;color:var(--text-muted);}
  .subject-bar{height:7px;border-radius:99px;background:var(--surface-2);overflow:hidden;}
  .subject-bar span{display:block;height:100%;border-radius:99px;transition:width .4s ease;}

  /* ---------- Subject page ---------- */
  .back-row{display:flex;align-items:center;gap:10px;margin-bottom:18px;}
  .subject-head{display:flex;align-items:center;gap:14px;margin-bottom:22px;}
  .subject-head h2{font-size:24px;}

  .resource-list{display:flex;flex-direction:column;gap:12px;}
  .resource-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-sm);padding:16px 18px;box-shadow:var(--shadow);display:flex;align-items:center;gap:16px;flex-wrap:wrap;transition:border-color .15s ease, box-shadow .15s ease;}
  .resource-card.current{border-color:var(--bad);box-shadow:var(--shadow), inset 4px 0 0 var(--bad);}
  .resource-info{flex:1;min-width:200px;}
  .resource-info h4{margin:0 0 4px;font-size:15.5px;display:flex;align-items:center;gap:8px;flex-wrap:wrap;}
  .chip-current{background:var(--bad-soft);color:var(--bad);border-radius:999px;padding:2px 10px;font-size:11px;font-weight:700;letter-spacing:.02em;}
  .resource-bar{height:6px;border-radius:99px;background:var(--surface-2);overflow:hidden;width:100%;max-width:260px;margin-top:6px;}
  .resource-bar span{display:block;height:100%;border-radius:99px;}
  .resource-meta{font-size:12px;color:var(--text-muted);margin-top:4px;}
  .resource-actions{display:flex;align-items:center;gap:8px;flex-shrink:0;}
  .move-btns{display:flex;flex-direction:column;gap:2px;flex-shrink:0;}
  .move-btn{width:26px;height:22px;border-radius:7px;border:1px solid var(--border);background:var(--surface-2);color:var(--text-muted);display:flex;align-items:center;justify-content:center;cursor:pointer;padding:0;}
  .move-btn:hover:not(:disabled){background:var(--border);color:var(--text);}
  .move-btn:disabled{opacity:.35;cursor:default;}
  .move-btn svg{width:13px;height:13px;}
  .btn-current{background:var(--bad-soft);color:var(--bad);}
  .btn-current.active{background:var(--bad);color:#fff;}

  .empty-state{background:var(--surface);border:1px dashed var(--border);border-radius:var(--radius);padding:36px 20px;text-align:center;color:var(--text-muted);}

  /* Fehleranalyse Diktate (Lehrperson) */
  .da-toolbar{display:flex;justify-content:flex-end;margin-bottom:10px;}
  .da-table{width:100%;border-collapse:collapse;background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);overflow:hidden;font-size:13.5px;}
  .da-table th,.da-table td{text-align:left;padding:8px 12px;border-bottom:1px solid var(--border);white-space:nowrap;}
  .da-table th{background:var(--surface-2);font-weight:600;font-size:12.5px;color:var(--text-muted);}
  .da-table tr:last-child td{border-bottom:none;}
  /* Namensspalte bleibt beim horizontalen Scrollen sichtbar (v.a. Deutsch mit vielen Diktaten). */
  .da-table th:first-child,.da-table td:first-child{position:sticky;left:0;z-index:1;box-shadow:1px 0 0 var(--border);}
  .da-table td:first-child{background:var(--surface);}
  .da-table th:first-child{background:var(--surface-2);z-index:2;}
  .da-student-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:16px 18px;margin-bottom:14px;}
  .da-student-card h4{margin:0 0 10px;}
  .weak-bar-row{display:flex;align-items:center;gap:10px;margin:8px 0;}
  .weak-bar-label{width:220px;flex:none;font-size:13px;display:flex;align-items:center;gap:6px;}
  .weak-bar-track{flex:1;height:9px;background:var(--surface-2);border-radius:6px;overflow:hidden;}
  .weak-bar-fill{height:100%;border-radius:6px;}
  .weak-bar-count{width:24px;text-align:right;font-size:12.5px;color:var(--text-muted);}
  .table-scroll{overflow-x:auto;}
  .da-reset-badge{display:inline-block;background:var(--bad-soft);color:var(--bad);border-radius:999px;padding:1px 7px;font-size:11px;font-weight:700;margin-left:4px;cursor:help;white-space:nowrap;}


  /* ---------- Ordner (Unterordner pro Fach) ---------- */
  .crumbs{display:flex;align-items:center;gap:6px;flex-wrap:wrap;font-size:13.5px;color:var(--text-muted);margin-bottom:16px;}
  .crumbs button{background:none;border:0;padding:2px 4px;border-radius:6px;font:inherit;color:var(--brand-ink);cursor:pointer;}
  .crumbs button:hover{background:var(--surface-2);text-decoration:underline;}
  .crumbs .sep{opacity:.5;}
  .crumbs .here{color:var(--text);font-weight:700;}

  .folder-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-sm);padding:14px 18px;box-shadow:var(--shadow);display:flex;align-items:center;gap:16px;flex-wrap:wrap;}
  .folder-card.has-current{border-color:var(--bad);box-shadow:var(--shadow), inset 4px 0 0 var(--bad);}
  .folder-open{display:flex;align-items:center;gap:12px;flex:1;min-width:200px;background:none;border:0;padding:0;font:inherit;color:inherit;text-align:left;cursor:pointer;}
  .folder-glyph{width:40px;height:40px;border-radius:11px;display:flex;align-items:center;justify-content:center;flex-shrink:0;background:var(--surface-2);}
  .folder-glyph svg{width:22px;height:22px;}
  .folder-name{font-weight:700;font-size:15.5px;display:flex;align-items:center;gap:8px;flex-wrap:wrap;}
  .folder-count{font-size:12px;color:var(--text-muted);margin-top:2px;}
  .folder-actions{display:flex;align-items:center;gap:8px;flex-shrink:0;flex-wrap:wrap;}
  .section-label{font-size:12px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;color:var(--text-muted);margin:4px 2px -2px;}

  /* ---------- Eigener Dialog (nie window.confirm/prompt — siehe Vollbild-Hinweis) ---------- */
  .modal-overlay{position:fixed;inset:0;background:rgba(15,16,32,.55);display:none;align-items:center;justify-content:center;padding:20px;z-index:2000;}
  .modal-overlay.show{display:flex;}
  .modal{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);box-shadow:0 24px 60px rgba(0,0,0,.28);width:100%;max-width:440px;max-height:85vh;overflow:auto;padding:22px;}
  .modal-wide{max-width:640px;}
  .modal.ued-modal{max-width:980px;width:100%;height:88vh;max-height:88vh;display:flex;flex-direction:column;overflow:hidden;}
  .ued-tabs{display:flex;gap:6px;flex-wrap:wrap;margin:4px 0 10px;}
  .ued-tabs .btn.active{background:var(--brand);color:#fff;}
  .ued-bar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:10px;}
  .modal .ued-bar input[type=text]{flex:1;min-width:180px;margin:0;}
  .ued-bar label{font-size:12.5px;color:var(--text-muted);display:flex;gap:6px;align-items:center;white-space:nowrap;}
  .ued-body{flex:1;min-height:0;overflow:auto;border:1px solid var(--border);border-radius:10px;background:var(--surface-2);padding:10px;}
  .ued-group{font-size:13px;font-weight:700;margin:14px 2px 6px;color:var(--text);}
  .ued-group:first-child{margin-top:2px;}
  .ued-entry{background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:8px 10px;margin-bottom:8px;}
  .ued-entry.changed{border-color:var(--brand);box-shadow:0 0 0 1px var(--brand);}
  .ued-entry small{display:block;font-size:11.5px;color:var(--text-muted);margin-bottom:4px;font-family:ui-monospace,Menlo,monospace;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .modal .ued-entry textarea{margin:0;padding:7px 9px;font-size:14px;min-height:0;}
  .modal .ued-code{width:100%;height:100%;margin:0;box-sizing:border-box;font:12.5px/1.45 ui-monospace,Menlo,monospace;white-space:pre;overflow:auto;resize:none;background:var(--surface);}
  .ued-body.ued-code-wrap{padding:0;overflow:hidden;}
  .ued-body iframe{width:100%;height:100%;border:0;background:#fff;border-radius:10px;}
  .ued-body.ued-preview{padding:0;overflow:hidden;}
  .ued-hint{font-size:12.5px;color:var(--text-muted);margin:0 0 8px;}
  .ued-err{font-size:13px;color:#C62828;margin:8px 0 0;}
  .ued-foot{display:flex;gap:10px;justify-content:space-between;flex-wrap:wrap;margin-top:12px;}
  .ued-foot > div{display:flex;gap:8px;flex-wrap:wrap;}
  .modal h3{font-size:18px;margin:0 0 8px;}
  .modal p{font-size:14px;color:var(--text-muted);margin:0 0 16px;line-height:1.5;}
  .modal input[type=text],.modal input[type=password],.modal input[type=number]{width:100%;padding:11px 13px;border:1px solid var(--border);border-radius:10px;font:inherit;background:var(--surface-2);color:var(--text);margin-bottom:16px;}
  .modal input[type=text]:focus,.modal input[type=password]:focus,.modal input[type=number]:focus{outline:2px solid var(--brand);outline-offset:1px;}
  .modal select,.modal input[type=date],.modal textarea{width:100%;padding:11px 13px;border:1px solid var(--border);border-radius:10px;font:inherit;background:var(--surface-2);color:var(--text);margin-bottom:16px;resize:vertical;}
  .modal select:focus,.modal input[type=date]:focus,.modal textarea:focus{outline:2px solid var(--brand);outline-offset:1px;}
  .modal-label{display:block;font-size:12.5px;font-weight:600;color:var(--text-muted);margin:0 0 6px;}
  .modal-actions{display:flex;gap:10px;justify-content:flex-end;flex-wrap:wrap;}

  /* Kalender */
  .cal-list{display:flex;flex-direction:column;gap:10px;}
  .cal-entry{display:flex;gap:14px;background:var(--surface);border:1px solid var(--border);border-left:5px solid var(--cal-c,var(--brand));border-radius:var(--radius-sm);padding:12px 14px;align-items:flex-start;}
  .cal-entry-date{flex:none;width:64px;font-weight:700;font-size:14px;line-height:1.3;}
  .cal-entry-weekday{display:block;font-weight:500;font-size:11px;color:var(--text-muted);}
  .cal-entry-body{flex:1;min-width:0;}
  .cal-entry-type{font-weight:600;font-size:12.5px;color:var(--cal-c,var(--brand));}
  .cal-entry-title{margin-bottom:2px;}
  .cal-entry-text{font-size:14.5px;font-weight:600;}
  .cal-entry-desc{font-size:13px;color:var(--text-muted);margin-top:2px;white-space:pre-wrap;}
  .cal-open-res-btn{margin-top:6px;padding-left:0;}
  .cal-sub-btn{margin-top:6px;margin-left:8px;}
  .submission-toolbar{display:flex;justify-content:flex-end;margin-top:10px;}
  .submission-list{max-height:calc(85vh - 170px);overflow-y:auto;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:2px 16px;margin:10px 0;align-content:start;}
  .submission-row{display:flex;align-items:center;gap:8px;font-size:14.5px;padding:4px 2px;min-width:0;}
  .submission-row span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  @media (max-width:480px){ .submission-list{gap:2px 10px;} .submission-row{font-size:13.5px;} }
  .reset-history-row{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin:6px 0;font-size:13.5px;}
  .reset-history-select{max-width:280px;padding:4px 8px;border:1px solid var(--border);border-radius:8px;font:inherit;background:var(--surface-2);color:var(--text);}
  .cal-private-tag{display:inline-block;font-size:11.5px;font-weight:600;color:var(--text-muted);background:var(--surface-2);border:1px solid var(--border);border-radius:999px;padding:1px 8px;margin-left:4px;}
  .noten-add{display:grid;grid-template-columns:1fr 1fr;gap:0 10px;background:var(--surface-2);border:1px solid var(--border);border-radius:var(--radius-sm);padding:12px 12px 0;margin-bottom:16px;}
  .noten-add .modal-label{margin-top:0;}
  .noten-add .noten-add-wide{grid-column:1 / -1;}
  .noten-add select,.noten-add input[type=text],.noten-add input[type=number]{background:var(--surface);margin-bottom:12px;}
  .noten-add .btn{grid-column:1 / -1;margin-bottom:12px;}
  .noten-fach{border:1px solid var(--border);border-left:5px solid var(--nf-c,var(--brand));border-radius:var(--radius-sm);margin-bottom:10px;background:var(--surface);}
  .noten-fach summary{cursor:pointer;list-style:none;display:flex;align-items:center;gap:10px;padding:10px 12px;font-weight:700;}
  .noten-fach summary::-webkit-details-marker{display:none;}
  .noten-fach summary::before{content:'▶';font-size:10px;color:var(--text-muted);transition:transform .15s;}
  .noten-fach[open] summary::before{transform:rotate(90deg);}
  .noten-fach-name{flex:1;min-width:0;}
  .noten-fach-count{font-weight:500;font-size:12px;color:var(--text-muted);}
  .noten-schnitt{font-size:14px;white-space:nowrap;}
  .noten-schnitt small{font-weight:500;color:var(--text-muted);margin-left:4px;}
  .noten-rows{padding:0 12px 10px;}
  .noten-row{display:grid;grid-template-columns:1fr 74px 74px 32px;gap:8px;align-items:center;margin-bottom:6px;}
  .noten-row-head{font-size:11px;color:var(--text-muted);font-weight:600;margin-bottom:2px;}
  .modal .noten-row input{margin:0;padding:7px 9px;}
  .noten-hint{font-size:12px;color:var(--text-muted);margin:14px 0 0;line-height:1.45;}
  .noten-empty{font-size:13.5px;color:var(--text-muted);text-align:center;padding:14px 0 4px;}
  .cal-entry-actions{flex:none;display:flex;flex-direction:column;gap:4px;}
  .cal-list-past{opacity:.6;}
  .cal-past-details summary{cursor:pointer;font-weight:700;font-size:15px;padding:8px 0;list-style:none;}
  .cal-past-details summary::-webkit-details-marker{display:none;}
  .cal-past-details summary::before{content:'▶';display:inline-block;margin-right:8px;font-size:11px;transition:transform .15s;}
  .cal-past-details[open] summary::before{transform:rotate(90deg);}
  .cal-past-details .cal-list-past{margin-top:8px;}

  .search-results{max-height:360px;overflow-y:auto;display:flex;flex-direction:column;gap:6px;margin-top:2px;}
  .search-result-row{display:flex;align-items:center;gap:10px;padding:9px 10px;border-radius:10px;border:1px solid transparent;background:var(--surface-2);cursor:pointer;text-align:left;width:100%;font:inherit;color:inherit;}
  .search-result-row:hover,.search-result-row:focus-visible{border-color:var(--border);outline:none;}
  .search-result-icon{flex:none;width:11px;height:11px;border-radius:50%;margin-top:4px;}
  .search-result-body{min-width:0;}
  .search-result-title{font-weight:600;font-size:14px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .search-result-path{font-size:12px;color:var(--text-muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:16px 18px;margin-bottom:16px;}
  .homework-card{border-left:5px solid #4361EE;}
  .cal-ferien-item{display:flex;align-items:center;gap:6px;flex-wrap:wrap;padding:6px 14px 6px 17px;border-left:3px dashed var(--border);font-size:12.5px;color:var(--text-muted);}
  .cal-ferien-item b{color:var(--text);font-weight:600;}
  .cal-ferien-item .cal-ferien-tag{color:var(--bad);font-weight:700;}
  .push-card{border-left:5px solid #8B5CF6;}
  .push-hint{font-size:13px;color:var(--text-muted);margin:4px 0 10px;}
  .pick-list{display:flex;flex-direction:column;gap:6px;margin-bottom:16px;}
  .pick-item{display:flex;align-items:center;gap:8px;width:100%;text-align:left;padding:10px 12px;border:1px solid var(--border);border-radius:10px;background:var(--surface-2);font:inherit;color:var(--text);cursor:pointer;}
  .pick-item:hover:not(:disabled){border-color:var(--brand);background:var(--surface);}
  .pick-item:disabled{opacity:.45;cursor:default;}
  .pick-item .pick-here{margin-left:auto;font-size:11px;font-weight:700;color:var(--text-muted);text-transform:uppercase;letter-spacing:.05em;}

  /* ---------- Lehrerbereich: To-do-Liste (nur Lehrperson) ---------- */
  .topbar-todo{position:relative;font-size:16px;line-height:1;padding:8px 14px;flex-shrink:0;gap:7px;}
  .topbar-todo-badge{min-width:22px;height:22px;padding:0 6px;box-sizing:border-box;border-radius:999px;background:var(--brand);color:var(--brand-contrast);font-size:12px;font-weight:800;line-height:22px;text-align:center;}
  .topbar-todo-badge.due{background:var(--bad);color:#fff;}
  .todo-popover{position:fixed;top:66px;left:50%;transform:translateX(-50%);z-index:60;width:min(760px,calc(100vw - 24px));max-height:calc(100vh - 88px);overflow:auto;background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);box-shadow:0 18px 44px rgba(0,0,0,.26);padding:20px 22px;}
  .todo-popover-head{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:14px;}
  .todo-popover-head h3{margin:0;font-size:20px;}
  .todo-popover-close{background:none;border:0;font-size:24px;line-height:1;cursor:pointer;color:var(--text-muted);padding:2px 8px;}
  .todo-add{display:flex;gap:10px;flex-wrap:wrap;align-items:stretch;margin-bottom:18px;}
  .todo-add input[type=text]{flex:1 1 210px;min-width:0;padding:13px 15px;border:1px solid var(--border);border-radius:12px;font:inherit;font-size:16px;background:var(--surface-2);color:var(--text);}
  .todo-add select,.todo-add input[type=date]{flex:0 1 165px;min-width:0;padding:13px 12px;border:1px solid var(--border);border-radius:12px;font:inherit;font-size:15px;background:var(--surface-2);color:var(--text);}
  .todo-add input:focus,.todo-add select:focus{outline:2px solid var(--brand);outline-offset:1px;}
  .todo-add .btn{flex:0 0 auto;padding:13px 18px;font-size:15px;white-space:nowrap;}
  .todo-add textarea{flex:1 1 100%;min-height:62px;padding:12px 15px;border:1px solid var(--border);border-radius:12px;font:inherit;font-size:15px;line-height:1.45;background:var(--surface-2);color:var(--text);resize:vertical;}
  .todo-add textarea:focus{outline:2px solid var(--brand);outline-offset:1px;}
  .todo-list{display:flex;flex-direction:column;gap:10px;}
  .todo-item{display:flex;align-items:flex-start;gap:14px;background:var(--surface-2);border:1px solid var(--border);border-left:5px solid var(--todo-c,var(--border));border-radius:var(--radius-sm);padding:14px 16px;}
  .todo-check{flex:none;width:30px;height:30px;margin-top:1px;border-radius:9px;border:2.5px solid var(--border);background:var(--surface);cursor:pointer;display:flex;align-items:center;justify-content:center;color:transparent;font-size:18px;font-weight:800;line-height:1;padding:0;transition:border-color .12s ease,background .12s ease,color .12s ease;}
  .todo-check:hover{border-color:var(--good);}
  .todo-check.on{background:var(--good);border-color:var(--good);color:#fff;}
  .todo-body{flex:1;min-width:0;}
  .todo-text{font-size:16.5px;font-weight:600;line-height:1.4;overflow-wrap:anywhere;}
  .todo-desc{font-size:14.5px;color:var(--text-muted);margin-top:5px;line-height:1.5;white-space:pre-wrap;overflow-wrap:anywhere;}
  .todo-meta{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:7px;font-size:13.5px;color:var(--text-muted);}
  .todo-tag{padding:3px 11px;border-radius:999px;font-size:12.5px;font-weight:700;background:var(--todo-soft,var(--border));color:var(--todo-c,var(--text));}
  .todo-due{font-weight:600;}
  .todo-due.soon{color:var(--bad);font-weight:800;}
  /* Faellig heute oder ueberfaellig: nicht nur das Datum, die ganze Karte faellt auf. */
  .todo-item-due{border-color:var(--bad);border-left-color:var(--bad);background:var(--bad-soft);}
  .todo-item-due .todo-text{color:var(--bad);font-weight:800;}
  .todo-actions{flex:none;display:flex;gap:4px;}
  .todo-actions .btn{padding:7px 11px;font-size:14px;}
  .todo-item-done{opacity:.62;}
  .todo-item-done .todo-text{text-decoration:line-through;font-weight:500;}
  .todo-done-details{margin-top:18px;border-top:1px dashed var(--border);padding-top:10px;}
  .todo-done-details summary{cursor:pointer;font-weight:700;font-size:16px;padding:8px 2px;list-style:none;}
  .todo-done-details summary::-webkit-details-marker{display:none;}
  .todo-done-details summary::before{content:'▶';display:inline-block;margin-right:9px;font-size:12px;transition:transform .15s;}
  .todo-done-details[open] summary::before{transform:rotate(90deg);}
  .todo-done-details .todo-list{margin-top:10px;}
  .todo-open-scroll{max-height:46vh;overflow-y:auto;padding-right:2px;}
  .todo-hint{font-size:12.5px;color:var(--text-muted);margin:12px 2px 2px;}
  .todo-empty{background:var(--surface-2);border:1px dashed var(--border);border-radius:var(--radius-sm);padding:22px 16px;text-align:center;color:var(--text-muted);font-size:15px;}
  @media (max-width:600px){
    .todo-popover{top:auto;bottom:0;left:0;transform:none;width:100vw;max-height:88vh;border-radius:var(--radius) var(--radius) 0 0;padding:16px 14px;}
    .topbar-todo{padding:7px 11px;font-size:15px;}
    .todo-open-scroll{max-height:none;}
    .todo-add input[type=text]{flex:1 1 100%;}
    .todo-add select,.todo-add input[type=date]{flex:1 1 calc(50% - 5px);}
    .todo-add .btn{flex:1 1 100%;}
  }

  /* ---------- Teacher upload zone ---------- */
  .dropzone{border:2.5px dashed var(--border);border-radius:var(--radius);padding:28px 20px;text-align:center;color:var(--text-muted);margin-bottom:22px;background:var(--surface);transition:border-color .15s ease, background .15s ease;}
  .dropzone.drag{border-color:var(--brand);background:var(--surface-2);color:var(--text);}
  .dropzone input[type=file]{display:none;}
  .dropzone .dz-title{font-weight:700;color:var(--text);margin-bottom:4px;}
  .upload-progress{margin-top:14px;font-size:13px;color:var(--brand-ink);display:none;}
  .upload-progress.show{display:block;}

  /* ---------- Resource viewer ---------- */
  .viewer-wrap{display:flex;flex-direction:column;gap:14px;}
  .viewer-head{display:flex;align-items:center;gap:12px;flex-wrap:wrap;}
  .viewer-head h2{font-size:19px;flex:1;}
  .viewer-progress{font-size:13px;color:var(--text-muted);}
  .viewer-frame-wrap{position:relative;background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);box-shadow:var(--shadow);overflow:hidden;height:calc(100vh - 210px);min-height:420px;}
  .viewer-frame-wrap iframe{width:100%;height:100%;border:0;display:block;background:#fff;}
  .viewer-frame-wrap:fullscreen,
  .viewer-frame-wrap:-webkit-full-screen{border-radius:0;border:0;height:100vh;}
  .viewer-frame-wrap:fullscreen iframe,
  .viewer-frame-wrap:-webkit-full-screen iframe{height:100%;}
  /* Safari on iOS (incl. installed "Zum Home-Bildschirm"-Apps) has no Fullscreen
     API at all for arbitrary elements — requestFullscreen is simply undefined
     there, so the native path above never applies. For that case we fake it with
     plain CSS: cover the whole viewport with position:fixed instead. Same visual
     result, works everywhere, and uses the same enter/exit button pair. */
  .viewer-frame-wrap.pseudo-fullscreen{position:fixed;inset:0;z-index:1000;width:100vw;height:100vh;height:100dvh;border-radius:0;border:0;box-shadow:none;}
  .viewer-frame-wrap.pseudo-fullscreen iframe{height:100%;}
  body.pseudo-fs-active{overflow:hidden;}
  /* #fsBtn (in .viewer-head) sits OUTSIDE #frameWrap, so once #frameWrap is the
     Fullscreen-API element (or, in the CSS fallback above, position:fixed over
     everything), #fsBtn is no longer part of what's on screen and can't be
     clicked — Esc was the only way out for native fullscreen, and there was no
     way out at all for the CSS fallback. This overlay button lives INSIDE
     #frameWrap instead, so it stays visible/clickable in both fullscreen modes,
     and is hidden the rest of the time via the selectors below. */
  .btn-fs-overlay-exit{position:absolute;top:14px;right:14px;z-index:5;display:none;align-items:center;justify-content:center;width:40px;height:40px;border-radius:999px;border:none;background:rgba(20,20,32,.55);color:#fff;cursor:pointer;backdrop-filter:blur(2px);transition:background .15s ease;}
  .btn-fs-overlay-exit:hover{background:rgba(20,20,32,.78);}
  .btn-fs-overlay-exit svg{width:18px;height:18px;}
  .viewer-frame-wrap:fullscreen .btn-fs-overlay-exit,
  .viewer-frame-wrap:-webkit-full-screen .btn-fs-overlay-exit,
  .viewer-frame-wrap.pseudo-fullscreen .btn-fs-overlay-exit{display:flex;}
  .btn-fs svg{width:15px;height:15px;}

  .toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);background:var(--brand-ink);color:#fff;padding:11px 20px;border-radius:999px;font-size:13.5px;box-shadow:var(--shadow);z-index:99;opacity:0;pointer-events:none;transition:opacity .25s ease, transform .25s ease;}
  .toast.show{opacity:1;transform:translateX(-50%) translateY(-6px);}

  .spinner-wrap{flex:1;display:flex;align-items:center;justify-content:center;color:var(--text-muted);font-size:14px;}

  @media (max-width:560px){
    .content{padding:20px 14px 50px;}
  }

  @media print{
    .topbar,.back-row,.da-toolbar,.push-popover,.modal-overlay,.toast,.desk-prop,.pencil-bubble,.coin-bubble{display:none !important;}
    body{background:#fff;}
    .content{padding:0;}
    .table-scroll{overflow:visible;}
    .da-table{font-size:12px;}
  }

  /* =========================================================
     KLASSENZIMMER-WERKZEUGE, QUIZ, STREAK, FRAGEBOX
     ========================================================= */

  /* ---------- Vollbild-Overlays (Beamer) ---------- */
  .kz-overlay{position:fixed;inset:0;z-index:70;background:var(--bg);display:flex;flex-direction:column;overflow:auto;}
  .kz-bar{display:flex;align-items:center;gap:10px;padding:12px 18px;border-bottom:1px solid var(--border);background:var(--surface);flex-wrap:wrap;flex-shrink:0;}
  .kz-bar-title{font-family:'Baloo 2',system-ui,sans-serif;font-weight:700;font-size:18px;}
  .kz-bar-spacer{flex:1;}
  .kz-tab{border:1px solid var(--border);background:var(--surface-2);color:var(--text);border-radius:999px;padding:8px 16px;font:inherit;font-weight:700;font-size:14px;cursor:pointer;}
  .kz-tab-on{background:var(--brand);color:var(--brand-contrast);border-color:transparent;}
  .kz-close{border:none;background:var(--surface-2);color:var(--text);border-radius:999px;width:38px;height:38px;font-size:17px;cursor:pointer;flex-shrink:0;}
  .kz-close:hover{background:var(--bad-soft);color:var(--bad);}
  .kz-stage{flex:1;display:flex;align-items:center;justify-content:center;padding:20px;}

  /* ---------- Timer ---------- */
  .tm-wrap{display:flex;flex-direction:column;align-items:center;gap:22px;width:100%;}
  .tm-ring-wrap{position:relative;width:min(46vh,340px);aspect-ratio:1;}
  .tm-ring{width:100%;height:100%;transform:rotate(-90deg);}
  .tm-ring-bg{fill:none;stroke:var(--surface-2);stroke-width:14;}
  .tm-ring-fg{fill:none;stroke:var(--brand);stroke-width:14;stroke-linecap:round;transition:stroke-dashoffset .95s linear, stroke .3s;}
  .tm-clock{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-family:'Baloo 2',system-ui,sans-serif;font-weight:800;font-size:clamp(46px,11vh,86px);font-variant-numeric:tabular-nums;}
  .tm-presets{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;}
  .tm-preset{padding:8px 14px;font-size:13px;}
  .tm-actions{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;}
  .tm-big{padding:14px 26px;font-size:16px;}
  .tm-warn .tm-ring-fg{stroke:var(--bad);}
  .tm-warn .tm-clock{color:var(--bad);}
  .tm-done .tm-ring-fg{stroke:var(--good);}
  .tm-done .tm-clock{color:var(--good);animation:tmPulse 1s ease-in-out infinite;}
  @keyframes tmPulse{0%,100%{transform:scale(1);}50%{transform:scale(1.06);}}

  /* ---------- Ruhephase: Timer + Lärmampel + Sprecher in einem Bild ---------- */
  .rp-grid{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,.75fr) minmax(0,1fr);gap:26px;width:100%;align-items:center;}
  @media (max-width:1000px){ .rp-grid{grid-template-columns:1fr;gap:20px;} }
  .rp-col{display:flex;flex-direction:column;align-items:center;gap:12px;min-width:0;}
  .rp-col-speak{align-items:stretch;gap:9px;}
  .rp-col-timer .tm-ring-wrap{width:min(32vh,260px);}
  .rp-col-timer .tm-clock{font-size:clamp(34px,7.5vh,60px);}
  .rp-col-timer .tm-preset{padding:5px 10px;font-size:12px;}
  .rp-col-timer .tm-big{padding:10px 18px;font-size:14px;}

  /* ---------- Wer darf sprechen ---------- */
  .sk-head{font-family:'Baloo 2',system-ui,sans-serif;font-weight:800;font-size:clamp(18px,2.4vw,24px);text-align:center;}
  .sk-chosen{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;min-height:46px;align-content:flex-start;}
  .sk-none{color:var(--text-muted);font-size:14px;align-self:center;}
  .sk-chip{display:inline-flex;align-items:center;gap:9px;background:var(--good);color:#fff;border:none;border-radius:999px;padding:9px 16px;font:inherit;font-size:clamp(14px,1.7vw,19px);font-weight:700;cursor:pointer;}
  .sk-chip span{opacity:.7;font-size:.75em;}
  .sk-chip:hover{background:var(--bad);}
  .sk-add-label{font-size:11px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;color:var(--text-muted);text-align:center;}
  .sk-pool{display:flex;flex-wrap:wrap;gap:5px;justify-content:center;max-height:28vh;overflow:auto;}
  .sk-pool-item{background:var(--surface-2);border:1px solid var(--border);color:var(--text);border-radius:999px;padding:5px 11px;font:inherit;font-size:12.5px;cursor:pointer;}
  .sk-pool-item:hover{border-color:var(--good);background:var(--good-soft);}
  .sk-clear{align-self:center;}

  /* ---------- Lärmampel ---------- */
  .am-wrap{display:flex;gap:18px;align-items:center;justify-content:center;}
  .am-lights{background:#1B1D2A;border-radius:26px;padding:18px;display:flex;flex-direction:column;gap:16px;box-shadow:var(--shadow);}
  .am-light span{display:block;width:min(9.5vh,72px);aspect-ratio:1;border-radius:50%;background:#2E3142;transition:background .25s, box-shadow .25s;}
  .am-lights[data-on="red"] .am-red span{background:#E63950;box-shadow:0 0 42px #E6395099;}
  .am-lights[data-on="yellow"] .am-yellow span{background:#E8B72C;box-shadow:0 0 42px #E8B72C99;}
  .am-lights[data-on="green"] .am-green span{background:#2E9E5B;box-shadow:0 0 42px #2E9E5B99;}
  .am-level-wrap{position:relative;width:42px;height:min(26vh,190px);background:var(--surface-2);border-radius:12px;overflow:hidden;}
  .am-level{position:absolute;left:0;right:0;bottom:0;height:0%;background:var(--good);transition:height .09s linear;}
  .am-level[data-on="yellow"]{background:#E8B72C;}
  .am-level[data-on="red"]{background:var(--bad);}
  .am-mark{position:absolute;left:0;right:0;height:2px;background:var(--text);opacity:.45;}
  .am-points{font-family:'Baloo 2',system-ui,sans-serif;font-weight:700;font-size:19px;}
  .am-status{font-size:12px;color:var(--text-muted);text-align:center;max-width:260px;}
  .am-sliders{display:flex;flex-direction:column;gap:7px;font-size:12px;color:var(--text-muted);width:100%;max-width:230px;align-items:stretch;}
  .am-sliders label{display:flex;align-items:center;gap:7px;justify-content:space-between;}
  .am-sliders input{width:130px;}

  /* ---------- Würfel ---------- */
  .wu-wrap{display:flex;flex-direction:column;align-items:center;gap:22px;width:100%;}
  .wu-dice{display:flex;flex-wrap:wrap;gap:clamp(14px,3vw,34px);justify-content:center;max-width:1100px;}
  .wu-die{width:clamp(90px,18vh,170px);aspect-ratio:1;border-radius:22%;background:var(--surface);border:3px solid var(--border);box-shadow:var(--shadow);display:grid;grid-template-columns:repeat(3,1fr);grid-template-rows:repeat(3,1fr);padding:13%;cursor:pointer;color:var(--text);font:inherit;transition:border-color .2s;}
  .wu-pip{width:76%;aspect-ratio:1;border-radius:50%;background:var(--brand);place-self:center;}
  .wu-num{grid-column:1 / -1;grid-row:1 / -1;place-self:center;font-family:'Baloo 2',system-ui,sans-serif;font-weight:800;font-size:clamp(38px,7.5vh,76px);font-variant-numeric:tabular-nums;line-height:1;}
  .wu-rolling .wu-die{animation:wuShake .16s linear infinite;}
  .wu-hit .wu-die{border-color:var(--brand);}
  @keyframes wuShake{0%{transform:rotate(0);}25%{transform:rotate(-9deg) translateY(-4px);}75%{transform:rotate(9deg) translateY(3px);}100%{transform:rotate(0);}}
  @media (prefers-reduced-motion: reduce){ .wu-rolling .wu-die{animation:none;} }
  .wu-sum{font-family:'Baloo 2',system-ui,sans-serif;font-weight:800;font-size:clamp(26px,5vh,44px);min-height:1.3em;line-height:1.3;}
  .wu-settings{display:flex;gap:10px 18px;flex-wrap:wrap;justify-content:center;align-items:center;font-size:13px;color:var(--text-muted);}
  .wu-seg{display:inline-flex;gap:4px;flex-wrap:wrap;justify-content:center;}
  .wu-opt{border:1px solid var(--border);background:var(--surface-2);color:var(--text);border-radius:999px;padding:6px 13px;font:inherit;font-weight:700;font-size:13px;cursor:pointer;}
  .wu-opt-on{background:var(--brand);color:var(--brand-contrast);border-color:transparent;}
  .wu-history,.wu-hint{font-size:13px;color:var(--text-muted);text-align:center;}
  .wu-hint{font-size:12px;opacity:.8;}

  /* ---------- Glücksrad ---------- */
  .gl-wrap{display:flex;gap:28px 40px;align-items:center;justify-content:center;width:100%;flex-wrap:wrap;}
  .gl-wheel-box{position:relative;width:min(74vh,88vw,640px);aspect-ratio:1;flex-shrink:0;}
  .gl-wheel-box canvas{width:100%;height:100%;display:block;}
  .gl-pointer{position:absolute;top:-8px;left:50%;transform:translateX(-50%);width:0;height:0;border-left:19px solid transparent;border-right:19px solid transparent;border-top:36px solid var(--text);z-index:2;filter:drop-shadow(0 2px 3px rgba(0,0,0,.35));}
  .gl-hub{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:20%;aspect-ratio:1;border-radius:50%;background:var(--surface);border:4px solid var(--text);color:var(--text);font-family:'Baloo 2',system-ui,sans-serif;font-weight:800;font-size:clamp(12px,2.2vh,19px);cursor:pointer;box-shadow:var(--shadow);}
  .gl-hub:disabled{cursor:default;opacity:.85;}
  .gl-side{display:flex;flex-direction:column;gap:14px;align-items:center;width:min(340px,100%);}
  .gl-result{font-family:'Baloo 2',system-ui,sans-serif;font-weight:800;font-size:clamp(30px,6vh,64px);text-align:center;min-height:1.2em;line-height:1.05;overflow-wrap:anywhere;transition:transform .2s;}
  .gl-hit .gl-result{color:var(--brand);transform:scale(1.06);}
  .gl-info{font-size:13px;color:var(--text-muted);text-align:center;}

  /* ---------- Wer ist dran ---------- */
  .wd-wrap{display:flex;flex-direction:column;align-items:center;gap:22px;width:100%;}
  .wd-name{font-family:'Baloo 2',system-ui,sans-serif;font-weight:800;font-size:clamp(38px,10vw,110px);text-align:center;line-height:1.05;transition:transform .2s;}
  .wd-hit .wd-name{color:var(--brand);transform:scale(1.06);}
  .wd-actions{display:flex;gap:14px;align-items:center;flex-wrap:wrap;justify-content:center;}
  .wd-check{display:flex;align-items:center;gap:7px;font-size:14px;color:var(--text-muted);}
  .wd-list{display:flex;flex-wrap:wrap;gap:7px;justify-content:center;max-width:780px;}
  .wd-chip{background:var(--surface-2);border-radius:999px;padding:5px 12px;font-size:12.5px;display:inline-flex;gap:6px;align-items:center;}
  .wd-chip b{color:var(--text-muted);font-size:11px;}
  .wd-chip-new{outline:1px solid var(--good);}

  /* ---------- Live-Klassenraum ---------- */
  .lk-summary{padding:12px 20px;font-size:16px;color:var(--text-muted);border-bottom:1px solid var(--border);}
  .lk-grid{flex:1;display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:12px;padding:16px 20px;align-content:start;}
  .lk-card{border:1px solid var(--border);border-radius:var(--radius-sm);padding:12px 14px;background:var(--surface);}
  .lk-name{font-weight:700;font-size:15px;display:flex;align-items:center;gap:7px;}
  .lk-dot{width:9px;height:9px;border-radius:50%;background:var(--good);animation:lkBlink 1.4s ease-in-out infinite;}
  @keyframes lkBlink{0%,100%{opacity:1;}50%{opacity:.25;}}
  .lk-bar{height:8px;border-radius:999px;background:var(--surface-2);overflow:hidden;margin:9px 0 7px;}
  .lk-bar span{display:block;height:100%;background:var(--brand);border-radius:999px;transition:width .4s;}
  .lk-meta{font-size:13px;font-weight:600;}
  .lk-sub{font-size:11.5px;color:var(--text-muted);min-height:14px;}
  .lk-idle{opacity:.6;}
  .lk-work{border-color:var(--brand);}
  .lk-done{border-color:var(--good);background:var(--good-soft);}
  .lk-done .lk-bar span{background:var(--good);}
  .lk-bad{border-color:var(--bad);background:var(--bad-soft);}
  .lk-bad .lk-bar span{background:var(--bad);}
  .lk-active{box-shadow:0 0 0 2px color-mix(in srgb, var(--brand) 40%, transparent);}
  .lk-hard{padding:10px 20px 20px;display:flex;flex-wrap:wrap;gap:8px;align-items:center;}
  .lk-hard-title{font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--text-muted);width:100%;}
  .lk-hard-chip{background:var(--bad-soft);color:var(--bad);border-radius:999px;padding:5px 12px;font-size:12.5px;font-weight:600;}

  /* ---------- Lernstand-Übersicht: ein Klappfach pro Fach ----------
     <details>/<summary> statt eigener JS-Logik. Alle Fächer starten zu; offen
     wird pro Fach im localStorage gemerkt (Präfix hl_ gehört der Shell, in der
     wir hier sind).
     Beim Drucken werden alle Fächer aufgeklappt (siehe lsPrintBtn). */
  .ls-fach{border:1px solid var(--border);border-radius:var(--radius);background:var(--surface);margin-top:14px;overflow:hidden;}
  .ls-fach > summary{list-style:none;cursor:pointer;display:flex;align-items:center;gap:10px;padding:13px 16px;font-family:'Baloo 2',system-ui,sans-serif;font-weight:700;font-size:17px;}
  .ls-fach > summary::-webkit-details-marker{display:none;}
  .ls-fach > summary:hover{background:var(--surface-2);}
  .ls-fach > summary::before{content:'▸';font-size:13px;color:var(--text-muted);transition:transform .15s ease;}
  .ls-fach[open] > summary::before{transform:rotate(90deg);}
  .ls-fach > summary .ls-fach-count{margin-left:auto;font-family:inherit;font-size:12px;font-weight:500;color:var(--text-muted);}
  .ls-fach-body{padding:0 16px 16px;}


  /* ---------- Stadt Land Fluss ---------- */
  .slf-wrap{display:flex;gap:24px 34px;align-items:center;justify-content:center;width:100%;flex-wrap:wrap;}
  .slf-wheel-box{width:min(56vh,86vw,520px);}
  .slf-mid{display:flex;flex-direction:column;align-items:center;gap:16px;min-width:0;flex:1 1 320px;max-width:620px;}
  .slf-letter{font-family:'Baloo 2',system-ui,sans-serif;font-weight:800;font-size:clamp(90px,22vh,210px);line-height:1;color:var(--text-muted);transition:transform .2s,color .2s;}
  .slf-hit .slf-letter{color:var(--brand);transform:scale(1.06);}
  .slf-cats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;width:100%;}
  .slf-cat{background:var(--surface);border:2px solid var(--border);border-radius:12px;padding:12px 10px;text-align:center;font-weight:800;font-size:clamp(15px,2.4vh,22px);line-height:1.2;overflow-wrap:anywhere;}
  .slf-cat-fix{border-color:var(--brand);}
  .slf-cat-pkt{background:var(--surface-2);color:var(--text-muted);}
  .slf-used{font-size:14px;color:var(--text-muted);text-align:center;}
  .slf-used-list{letter-spacing:.12em;font-weight:700;text-decoration:line-through;}
  .slf-side{display:flex;flex-direction:column;gap:12px;align-items:center;width:min(320px,100%);}
  .slf-glass-box{position:relative;display:flex;align-items:center;gap:14px;}
  .slf-glass{width:auto;height:min(30vh,230px);}
  .slf-glass-bulb{fill:var(--surface);}
  .slf-glass-line{fill:none;stroke:var(--text);stroke-width:3;}
  .slf-glass-frame{fill:#8B6944;}
  .slf-sand{fill:#E8B72C;}
  .slf-stream{stroke:#E8B72C;stroke-width:3;transition:opacity .2s;}
  .slf-clock{font-family:'Baloo 2',system-ui,sans-serif;font-weight:800;font-size:clamp(30px,6vh,54px);font-variant-numeric:tabular-nums;min-width:3.2ch;}
  .slf-warn .slf-clock{color:var(--bad);}
  .slf-status{font-family:'Baloo 2',system-ui,sans-serif;font-weight:800;font-size:clamp(20px,3.6vh,34px);text-align:center;min-height:1.2em;line-height:1.1;}
  .slf-over .slf-status{color:var(--bad);}
  .slf-stop{background:var(--bad);color:#fff;font-size:clamp(22px,3.6vh,32px);font-weight:800;padding:16px 34px;border-radius:999px;width:100%;}
  .slf-stop:disabled{opacity:.35;cursor:default;}
  .slf-btns{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;}
  .slf-btns .btn{padding:12px 20px;font-size:16px;}

  /* ---------- Pflanzen-Erinnerung ---------- */
  .pf-banner{background:var(--bad-soft);border:2px solid var(--bad);border-radius:var(--radius);padding:12px 16px;margin:0 0 16px;}
  .pf-banner-title{font-weight:800;color:var(--bad);font-size:17px;margin-bottom:8px;}
  .pf-banner-list{display:flex;flex-direction:column;gap:6px;}
  .pf-banner-item{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;}
  .pf-banner-info{background:var(--surface-2);border-color:#E8B72C;}
  .pf-banner-info .pf-banner-title{color:var(--text);}
  .pf-banner-sub{font-size:13.5px;color:var(--text-muted);margin:-4px 0 8px;}
  .pf-banner-when{color:var(--bad);font-size:13.5px;font-weight:600;}
  .pf-done{background:var(--bad);color:#fff;}
  .pf-btn-due{background:var(--bad-soft);color:var(--bad);animation:pfPulse 1.6s ease-in-out infinite;}
  @keyframes pfPulse{50%{box-shadow:0 0 0 4px var(--bad-soft);}}
  @media (prefers-reduced-motion: reduce){ .pf-btn-due{animation:none;} }
  .pf-hint{font-size:13px;}
  .pf-list{display:flex;flex-direction:column;gap:8px;margin-bottom:6px;}
  .pf-item{display:flex;gap:10px;align-items:center;background:var(--surface-2);border:1px solid var(--border);border-left:5px solid #2E9E5B;border-radius:var(--radius-sm);padding:10px 12px;flex-wrap:wrap;}
  .pf-item-due{border-color:var(--bad);border-left-color:var(--bad);background:var(--bad-soft);}
  .pf-body{flex:1 1 220px;min-width:0;}
  .pf-name{font-weight:800;font-size:15.5px;}
  .pf-meta{font-size:13px;color:var(--text-muted);margin-top:3px;line-height:1.45;}
  .pf-actions{display:flex;gap:4px;}
  .pf-label{display:block;font-size:13px;font-weight:700;margin-bottom:4px;}
  .pf-row{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
  .modal.pf-modal{max-width:620px;}

  /* ---------- Klassenzimmer-Sammelseite ---------- */
  .kz-intro{color:var(--text-muted);font-size:14px;margin:0 2px 16px;}
  .kz-tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:14px;}
  .kz-tile{display:flex;gap:14px;align-items:flex-start;text-align:left;background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:18px;cursor:pointer;font:inherit;color:var(--text);}
  .kz-tile:hover{border-color:var(--brand);transform:translateY(-2px);box-shadow:var(--shadow);}
  .kz-tile h3{margin:0 0 4px;font-size:16px;}
  .kz-tile p{margin:0;font-size:13px;color:var(--text-muted);line-height:1.45;}
  .kz-tile-icon{font-size:28px;line-height:1;flex-shrink:0;}

  /* ---------- Sitzplan ---------- */
  .sp-select{border:1px solid var(--border);background:var(--surface);color:var(--text);border-radius:999px;padding:7px 12px;font:inherit;font-size:13px;}
  .sp-tools{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-bottom:16px;}
  .sp-tool-group{display:flex;flex-wrap:wrap;gap:7px;align-items:center;padding:6px 10px;border:1px solid var(--border);border-radius:999px;background:var(--surface);}
  .sp-tool-label{font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--text-muted);}
  .sp-layout{display:grid;grid-template-columns:minmax(0,1fr) 260px;gap:18px;align-items:start;}
  @media (max-width:860px){ .sp-layout{grid-template-columns:1fr;} }
  .sp-room-outer{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:14px;}
  /* Raster = 1 m. background-size statt repeating-linear-gradient: nur so
     sitzen die Linien wirklich bei 1/9 bzw. 1/8 der Fläche. */
  /* Der Raum steckt in .sp-room-wrap: dessen seitliche Polster tragen die
     Beschriftungen "Fenster" und "Tür", die ausserhalb der Wand stehen. Die
     max-width sitzt darum am Wrapper (Raumbreite + beide Polster). */
  .sp-room-wrap{position:relative;width:100%;max-width:calc(66vh * 9 / 8 + 44px);margin:0 auto;padding:0 22px;box-sizing:border-box;}
  .sp-edge-label{position:absolute;width:22px;display:flex;align-items:center;justify-content:center;writing-mode:vertical-rl;text-orientation:mixed;font-size:10px;font-weight:700;letter-spacing:.18em;text-transform:uppercase;color:var(--text-muted);pointer-events:none;}
  .sp-edge-window{top:0;bottom:0;transform:rotate(180deg);}
  .sp-room{position:relative;width:100%;margin:0 auto;aspect-ratio:9/8;background-color:var(--surface);background-image:linear-gradient(to right,var(--border) 1px,transparent 1px),linear-gradient(to bottom,var(--border) 1px,transparent 1px);background-size:calc(100%/9) calc(100%/8);border:2px solid var(--text-muted);border-radius:8px;touch-action:none;overflow:hidden;}
  .sp-board{position:absolute;top:0;left:50%;transform:translateX(-50%);width:33%;height:4.5%;background:#000;color:#fff;font-size:11px;font-weight:700;display:flex;align-items:center;justify-content:center;border-radius:0 0 6px 6px;letter-spacing:.05em;z-index:1;}
  /* Fenstersims: durchgehend an der Fensterwand, 0,5 m tief. Breite/Position
     kommen aus SILL_W, damit CSS und Vorlagen nicht auseinanderlaufen. */
  .sp-sill{position:absolute;top:0;bottom:0;background:#C9CDD4;border-right:1px solid #9AA0AA;display:flex;align-items:center;justify-content:center;}
  .sp-sill-mirror{border-right:none;border-left:1px solid #9AA0AA;}
  /* "Fenstersims" steht auf der grauen Fläche, "Fenster" gleich daneben an der
     Wand. Beide liegen unter den Tischen (DOM-Reihenfolge), damit ein Möbel sie
     im Zweifel überdeckt statt umgekehrt. */
  .sp-sill-label{writing-mode:vertical-rl;text-orientation:mixed;transform:rotate(180deg);font-size:10px;font-weight:700;letter-spacing:.18em;text-transform:uppercase;color:#4A5059;pointer-events:none;}
  /* Tür: brauner Strich in der rechten Wand, 20 cm von der hinteren Ecke; das
     Wort steht wie beim Fenster ausserhalb der Wand. */
  .sp-door{position:absolute;background:#8B6944;}
  .sp-room-size{position:absolute;right:6px;top:4px;font-size:10.5px;color:var(--text-muted);}
  .sp-table{position:absolute;display:flex;background:#C99B6A;border:1px solid #8B6944;border-radius:4px;overflow:visible;cursor:grab;box-shadow:0 2px 5px rgba(0,0,0,.18);touch-action:none;}
  .sp-dragging{opacity:.85;cursor:grabbing;z-index:6;}
  .sp-kind-pult{background:#6B4F35;border-color:#43301F;}
  .sp-kind-block{background:#1F5134;border-color:#12301F;}
