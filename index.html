/* ===================== ORDNER-AKTIONEN (nur Lehrperson) ===================== */

function createFolder(subjectId, parentId, name){
  var siblings = foldersIn(parentId);
  var id = subjectId+'_f_'+Date.now();
  setDoc(doc(db,'folders', id), {
    subject: subjectId,
    parentId: parentId || null,
    name: name.slice(0,60),
    order: siblings.length,
    createdAt: serverTimestamp(),
    createdBy: state.user.uid
  }).then(function(){ toast('Ordner «'+name+'» angelegt.'); })
    .catch(function(err){ console.error(err); toast('Ordner konnte nicht angelegt werden.'); });
}

function renameFolder(f, name){
  setDoc(doc(db,'folders', f.id), {name: name.slice(0,60)}, {merge:true})
    .catch(function(err){ console.error(err); toast('Umbenennen fehlgeschlagen.'); });
}

// Reihenfolge der Ordner innerhalb desselben Elternordners (gleiches Muster wie
// bei den Übungen: nach dem Tausch bekommt JEDER Ordner der Liste eine frische
// 0..n-1-Nummer, damit auch nie manuell sortierte Ordner konsistent bleiben).
function reorderFolder(folders, index, direction){
  var newIndex = index + direction;
  if(newIndex < 0 || newIndex >= folders.length) return;
  var reordered = folders.slice();
  var tmp = reordered[index]; reordered[index] = reordered[newIndex]; reordered[newIndex] = tmp;
  var batch = writeBatch(db);
  reordered.forEach(function(f, i){ batch.update(doc(db,'folders', f.id), {order: i}); });
  batch.commit().catch(function(err){ console.error(err); toast('Verschieben fehlgeschlagen.'); });
}

function askMoveFolder(f){
  // Ein Ordner darf weder in sich selbst noch in einen seiner eigenen
  // Unterordner wandern — sonst hinge der Teilbaum in einem Zyklus fest.
  var blocked = subtreeIds(f.id);
  uiPickFolder('«'+f.name+'» verschieben', 'Wohin soll der Ordner mit seinem ganzen Inhalt?', f.parentId || null, blocked, function(targetId){
    var ownHeight = maxDepthBelow(f.id);
    if(folderDepth(targetId) + 1 + ownHeight > MAX_FOLDER_DEPTH){
      uiInfo('Zu tief verschachtelt', 'Dort würden mehr als '+MAX_FOLDER_DEPTH+' Ordner-Ebenen entstehen. Wähle einen Ort weiter oben.');
      return;
    }
    var siblings = foldersIn(targetId);
    setDoc(doc(db,'folders', f.id), {parentId: targetId || null, order: siblings.length}, {merge:true})
      .then(function(){ toast('«'+f.name+'» verschoben.'); })
      .catch(function(err){ console.error(err); toast('Verschieben fehlgeschlagen.'); });
  });
}

// Wie viele Ebenen hängen unter diesem Ordner noch dran? (0 = keine Unterordner)
function maxDepthBelow(folderId){
  var kids = state.folders.filter(function(f){ return (f.parentId||null) === folderId; });
  if(!kids.length) return 0;
  return 1 + Math.max.apply(null, kids.map(function(k){ return maxDepthBelow(k.id); }));
}

// Löschen bewusst nur, wenn wirklich nichts mehr drin ist — so kann nie
// versehentlich eine ganze Übungssammlung mitverschwinden.
function askDeleteFolder(f){
  var c = subtreeCounts(f.id);
  if(c.folders || c.resources){
    var was = [];
    if(c.folders) was.push(c.folders+' Unterordner');
    if(c.resources) was.push(c.resources+' Übung'+(c.resources===1?'':'en'));
    uiInfo('Ordner ist nicht leer',
      '«'+f.name+'» enthält noch '+was.join(' und ')+'. Verschiebe den Inhalt zuerst woandershin (Knopf «Verschieben»), dann lässt sich der Ordner löschen.');
    return;
  }
  uiConfirm('Ordner löschen?', '«'+f.name+'» ist leer und wird entfernt.', 'Löschen', function(){
    deleteDoc(doc(db,'folders', f.id))
      .then(function(){ toast('Ordner gelöscht.'); })
      .catch(function(err){ console.error(err); toast('Löschen fehlgeschlagen.'); });
  }, true);
}

/* ===================== ÜBUNGEN: SORTIEREN, VERSCHIEBEN, MARKIEREN ===================== */

// Übungen mit ausdrücklicher `order` (gesetzt, sobald die Pfeile benutzt wurden)
// kommen zuerst; alles nie manuell Sortierte fällt auf "neuste zuoberst" zurück.
function sortResources(resources){
  resources.sort(function(a, b){
    var oa = typeof a.order === 'number' ? a.order : null;
    var ob = typeof b.order === 'number' ? b.order : null;
    if(oa !== null && ob !== null) return oa - ob;
    if(oa !== null) return -1;
    if(ob !== null) return 1;
    var ta = a.uploadedAt && a.uploadedAt.toDate ? a.uploadedAt.toDate().getTime() : 0;
    var tb = b.uploadedAt && b.uploadedAt.toDate ? b.uploadedAt.toDate().getTime() : 0;
    return tb - ta;
  });
}

// Verschiebt die Übung an `index` innerhalb des GERADE ANGEZEIGTEN Containers
// (Fach-Hauptebene oder ein Ordner) und schreibt danach für jede Übung dieses
// Containers eine frische 0..n-1-Nummer.
function moveResource(resources, index, direction){
  var newIndex = index + direction;
  if(newIndex < 0 || newIndex >= resources.length) return;
  var reordered = resources.slice();
  var tmp = reordered[index]; reordered[index] = reordered[newIndex]; reordered[newIndex] = tmp;
  var batch = writeBatch(db);
  reordered.forEach(function(r, i){ batch.update(doc(db,'resources', r.id), {order: i}); });
  batch.commit().catch(function(err){ console.error(err); toast('Verschieben fehlgeschlagen.'); });
}

// Übung in einen anderen Ordner desselben Fachs legen. Sie landet am Ende des
// Zielcontainers; im Herkunftscontainer werden die Nummern wieder lückenlos
// durchgezählt, damit die Pfeile dort weiter sauber funktionieren.
function askMoveResource(r){
  var title = r.title || r.fileName;
  uiPickFolder('«'+title+'» verschieben', 'In welchen Ordner soll diese Übung?', r.folderId || null, [], function(targetId){
    var targetList = resourcesIn(targetId);
    var sourceList = resourcesIn(r.folderId || null).filter(function(x){ return x.id !== r.id; });
    var batch = writeBatch(db);
    batch.update(doc(db,'resources', r.id), {folderId: targetId || null, order: targetList.length, prevOrder: null});
    sourceList.forEach(function(x, i){ batch.update(doc(db,'resources', x.id), {order: i}); });
    batch.commit()
      .then(function(){ toast('«'+title+'» verschoben.'); })
      .catch(function(err){ console.error(err); toast('Verschieben fehlgeschlagen.'); });
  });
}

// Markiert genau EINE Übung pro Fach als "aktuell" (rot hervorgehoben, auch für
// die Klasse sichtbar). Beim Markieren rutscht sie zusätzlich an den Anfang
// ihres eigenen Ordners; beim Entfernen der Markierung wieder genau dorthin
// zurück, wo sie vorher stand (prevOrder). Ordner, in denen das aktuelle Thema
// liegt, werden im Kärtchen ebenfalls rot markiert, damit man es findet.
function toggleCurrent(resources, r){
  var makeCurrent = !r.current;
  var batch = writeBatch(db);

  if(makeCurrent){
    var prevIndex = resources.findIndex(function(x){ return x.id === r.id; });
    var reordered = [r].concat(resources.filter(function(x){ return x.id !== r.id; }));
    reordered.forEach(function(item, i){
      var patch = { order: i };
      if(item.id === r.id){ patch.current = true; patch.prevOrder = prevIndex; }
      batch.update(doc(db,'resources', item.id), patch);
    });
    // jede andere im Fach als "aktuell" markierte Übung entmarkieren — auch in
    // anderen Ordnern, deshalb über state.resources statt nur die Liste hier
    state.resources.forEach(function(x){
      if(x.id !== r.id && x.current){ batch.update(doc(db,'resources', x.id), {current: false}); }
    });
  } else {
    var others = resources.filter(function(x){ return x.id !== r.id; });
    var restoreAt = typeof r.prevOrder === 'number' ? Math.max(0, Math.min(r.prevOrder, others.length)) : others.length;
    var back = others.slice(0, restoreAt).concat([r]).concat(others.slice(restoreAt));
    back.forEach(function(item, i){
      var patch = { order: i };
      if(item.id === r.id){ patch.current = false; patch.prevOrder = null; }
      batch.update(doc(db,'resources', item.id), patch);
    });
  }

  batch.commit().catch(function(err){ console.error(err); toast('Aktualisieren fehlgeschlagen.'); });
}

function resourceCardHtml(r, index, total, isTeacher){
  var uploaded = r.uploadedAt && r.uploadedAt.toDate ? r.uploadedAt.toDate().toLocaleDateString('de-CH') : '';
  var html = '<div class="resource-card'+(r.current?' current':'')+'" id="card-'+r.id+'">';
  if(isTeacher){
    html += '<div class="move-btns">';
    html += '<button class="move-btn" id="up-'+r.id+'" type="button" title="Nach oben"'+(index===0?' disabled':'')+'><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M6 15l6-6 6 6"/></svg></button>';
    html += '<button class="move-btn" id="down-'+r.id+'" type="button" title="Nach unten"'+(index===total-1?' disabled':'')+'><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9l6 6 6-6"/></svg></button>';
    html += '</div>';
  }
  html += '<div class="resource-info"><h4>'+esc(r.title || r.fileName)+(r.current?' <span class="chip-current">Aktuell</span>':'')+'</h4>';
  html += '<div class="resource-bar"><span id="pbar-'+r.id+'" style="width:0%;background:var(--brand)"></span></div>';
  html += '<div class="resource-meta" id="pmeta-'+r.id+'">Noch nicht geübt'+(uploaded?' · hinzugefügt am '+uploaded:'')+'</div>';
  html += '</div>';
  html += '<div class="resource-actions">';
  html += '<button class="btn btn-primary btn-sm" id="open-'+r.id+'">Öffnen</button>';
  if(isTeacher){
    html += '<button class="btn btn-sm btn-current'+(r.current?' active':'')+'" id="cur-'+r.id+'">'+(r.current?'Nicht mehr aktuell':'Als aktuell markieren')+'</button>';
    html += '<button class="btn btn-ghost btn-sm" id="mv-'+r.id+'" type="button">Verschieben</button>';
    html += '<button class="btn btn-danger btn-sm" id="del-'+r.id+'">Löschen</button>';
  }
  html += '</div></div>';
  return html;
}

function updateResourceBar(resourceId, p){
  var bar = document.getElementById('pbar-'+resourceId);
  var meta = document.getElementById('pmeta-'+resourceId);
  if(!bar || !meta) return;
  if(!p || p.attempted===0){ bar.style.width='0%'; meta.textContent = meta.textContent.indexOf('hinzugefügt')>=0 ? meta.textContent : 'Noch nicht geübt'; return; }
  var pct = p.coveragePct!==null ? p.coveragePct : p.correctPct;
  bar.style.width = pct+'%';
  var parts = [];
  if(p.total){ parts.push(p.attempted+' / '+p.total+' geübt'); } else { parts.push(p.attempted+' bearbeitet'); }
  if(p.correctPct!==null){ parts.push(p.correctPct+'% richtig'); }
  meta.textContent = parts.join(' · ');
}

function askDeleteResource(r){
  uiConfirm('Übung löschen?',
    '«'+(r.title||r.fileName)+'» wird endgültig entfernt. Das kann nicht rückgängig gemacht werden.',
    'Löschen', function(){ deleteResource(r); }, true);
}

async function deleteResource(r){
  try{
    var contentSnap = await getDoc(doc(db,'resourceContent', r.id));
    var chunkCount = (contentSnap.exists() && contentSnap.data().chunkCount) || 0;
    var batch = writeBatch(db);
    batch.delete(doc(db,'resources', r.id));
    batch.delete(doc(db,'resourceContent', r.id));
    for(var i=0;i<chunkCount;i++){
      batch.delete(doc(db,'resourceContent', r.id, 'chunks', String(i)));
    }
    await batch.commit();
    toast('Übung gelöscht.');
  }catch(err){
    console.error(err);
    toast('Löschen fehlgeschlagen.');
  }
}

/* ===================== TEACHER UPLOAD ===================== */

// Die Dropzone lädt immer in den GERADE OFFENEN Ordner (state.route.folderId).
// Sie wird nur einmal pro Fachseite verdrahtet und liest das Ziel erst beim
// Ablegen aus — so stimmt es auch nach einem Wechsel in einen Unterordner.
function wireDropzone(subjectId){
  var dz = document.getElementById('dropzone');
  var input = document.getElementById('fileInput');
  ['dragenter','dragover'].forEach(function(evt){
    dz.addEventListener(evt, function(e){ e.preventDefault(); dz.classList.add('drag'); });
  });
  ['dragleave','drop'].forEach(function(evt){
    dz.addEventListener(evt, function(e){ e.preventDefault(); dz.classList.remove('drag'); });
  });
  dz.addEventListener('drop', function(e){
    var files = e.dataTransfer.files;
    if(files && files.length){ handleUpload(subjectId, state.route.folderId || null, files[0]); }
  });
  input.addEventListener('change', function(){
    if(input.files && input.files.length){ handleUpload(subjectId, state.route.folderId || null, input.files[0]); input.value=''; }
  });
}

function readFileAsText(file){
  return new Promise(function(resolve, reject){
    var reader = new FileReader();
    reader.onload = function(){ resolve(reader.result); };
    reader.onerror = function(){ reject(reader.error); };
    reader.readAsText(file, 'utf-8');
  });
}

function handleUpload(subjectId, folderId, file){
  if(!/\.html?$/i.test(file.name) && file.type !== 'text/html'){
    toast('Bitte eine HTML-Datei hochladen (.html).');
    return;
  }
  if(file.size > MAX_RESOURCE_BYTES){
    toast('Datei ist zu gross (max. '+Math.round(MAX_RESOURCE_BYTES/1024/1024)+' MB).');
    return;
  }
  var suggested = file.name.replace(/\.html?$/i,'').replace(/[_-]+/g,' ');
  var where_ = folderId ? ('Ordner «'+(folderById(folderId) ? folderById(folderId).name : '')+'»') : 'Fach-Hauptebene';
  uiPrompt('Titel für diese Übung', 'Die Datei wird in der '+where_+' abgelegt.', suggested, 'Hochladen', function(title){
    doUpload(subjectId, folderId, file, title);
  });
}

async function doUpload(subjectId, folderId, file, title){
  var progEl = document.getElementById('uploadProgress');
  if(!progEl) return;
  progEl.textContent = 'Lade «'+file.name+'» hoch …';
  progEl.classList.add('show');
  try{
    var htmlText = await readFileAsText(file);
    if(new Blob([htmlText]).size > MAX_RESOURCE_BYTES){
      toast('Datei ist zu gross (max. '+Math.round(MAX_RESOURCE_BYTES/1024/1024)+' MB).');
      return;
    }
    var chunks = chunkStringByBytes(htmlText, MAX_CHUNK_BYTES);
    var resId = subjectId+'_'+Date.now();
    var batch = writeBatch(db);
    batch.set(doc(db,'resources', resId), {
      subject: subjectId,
      folderId: folderId || null,
      title: title,
      fileName: file.name,
      uploadedAt: serverTimestamp(),
      uploadedBy: state.user.uid
    });
    batch.set(doc(db,'resourceContent', resId), { chunkCount: chunks.length });
    chunks.forEach(function(chunk, i){
      batch.set(doc(db,'resourceContent', resId, 'chunks', String(i)), { html: chunk });
    });
    await batch.commit();
    toast('«'+title+'» wurde veröffentlicht.');
  }catch(err){
    console.error(err);
    toast('Hochladen fehlgeschlagen: '+(err && err.message ? err.message : 'unbekannter Fehler'));
  }finally{
    progEl.classList.remove('show');
  }
}

/* ===================== ÜBUNGSSTAND GERÄTEÜBERGREIFEND SYNCHRONISIEREN =====

   Problem: die Übungsseiten speichern ihren Detailstand (beantwortete Fragen,
   Karteikarten, Diktat-Eingaben) in `localStorage` — also pro Gerät/Browser.
   Wer am Laptop übt und am Handy weitermacht, fing bisher wieder bei null an,
   und der leere Handy-Stand überschrieb sogar die angezeigten Prozentzahlen.

   Lösung ohne Änderung an den Übungsseiten selbst: die Seiten laufen in einem
   `srcdoc`-iframe und teilen deshalb denselben Origin — und damit denselben
   `localStorage` — mit der Library-Shell. Die Shell kann den Stand also direkt
   lesen und schreiben:

     - Beim Öffnen einer Übung wird der in Firestore gesicherte Stand geladen
       und (falls neuer als der lokale) in `localStorage` geschrieben, BEVOR
       das iframe geladen wird.
     - Während die Übung offen ist, wird `localStorage` beobachtet; alles, was
       sich ändert, gehört zu dieser Übung und wird gebündelt nach Firestore
       geschrieben (`progress/{uid}/resources/{rid}`, Feld `storeJson`).

   Konfliktregel (bewusst so gewählt): NEUESTER STAND GEWINNT, ohne Nachfrage.
   Dafür trägt jeder Stand eine Revisionsnummer (`storeRev`, aus `Date.now()`),
   die lokal unter `hl_rev_<rid>` mitgeführt wird. Nur wenn die Revision in
   Firestore grösser ist als die lokale, wird der entfernte Stand angewendet.

   Warum `storeJson` (String) statt einer Firestore-Map: `setDoc(..., {merge:true})`
   führt Maps FELDWEISE zusammen — ein gelöschter Schlüssel (z.B. nach „Alles
   zurücksetzen") bliebe dann für immer stehen. Ein String wird komplett ersetzt.
============================================================================ */

var LIB_PREFIX = 'hl_';        // eigene Schlüssel der Shell — werden nie synchronisiert
var SYNC_MAX_BYTES = 600000;   // Sicherheitsabstand zum 1-MiB-Limit eines Firestore-Dokuments
var SYNC_POLL_MS = 1500;
var SYNC_DEBOUNCE_MS = 800;

var syncState = {
  resourceId: null,   // Übung, die gerade offen ist
  tracked: {},        // Schlüssel, die zu dieser Übung gehören (Objekt als Set)
  baseline: {},       // localStorage-Stand beim Öffnen — Vergleichsbasis
  lastWritten: null,  // zuletzt geschriebenes JSON (spart unnötige Schreibvorgänge)
  pollTimer: null,
  writeTimer: null
};

function lsGet(k){ try{ return localStorage.getItem(k); }catch(e){ return null; } }
function lsSet(k,v){ try{ localStorage.setItem(k,v); }catch(e){} }
function lsDel(k){ try{ localStorage.removeItem(k); }catch(e){} }

// Alle Schlüssel ausser den eigenen der Shell.
function lsSnapshot(){
  var out = {};
  try{
    for(var i=0;i<localStorage.length;i++){
      var k = localStorage.key(i);
      if(k && k.indexOf(LIB_PREFIX) !== 0) out[k] = localStorage.getItem(k);
    }
  }catch(e){}
  return out;
}

function localRev(rid){ return parseInt(lsGet(LIB_PREFIX+'rev_'+rid) || '0', 10) || 0; }
function setLocalRev(rid, rev){ lsSet(LIB_PREFIX+'rev_'+rid, String(rev)); }

// Welche Schlüssel gehören zu dieser Übung? Lokal gemerkt, damit die Zuordnung
// einen Reload überlebt; beim Öffnen mit der Liste aus Firestore vereinigt.
function loadTrackedKeys(rid){
  var out = {};
  try{
    var raw = lsGet(LIB_PREFIX+'keys_'+rid);
    if(raw) JSON.parse(raw).forEach(function(k){ out[k] = true; });
  }catch(e){}
  return out;
}
function saveTrackedKeys(rid, tracked){
  try{ lsSet(LIB_PREFIX+'keys_'+rid, JSON.stringify(Object.keys(tracked))); }catch(e){}
}

// Entfernten Stand anwenden: gesetzte Schlüssel schreiben, fehlende entfernen
// (so wandert auch ein „Alles zurücksetzen" auf das andere Gerät).
function applyRemoteStore(keys, store){
  keys.forEach(function(k){
    if(k.indexOf(LIB_PREFIX) === 0) return;
    if(Object.prototype.hasOwnProperty.call(store, k)) lsSet(k, store[k]);
    else lsDel(k);
  });
}

// Vor dem Laden des iframes aufrufen. Läuft nie in einen Fehler, der das
// Öffnen der Übung verhindern würde — im Zweifel wird ohne Sync geöffnet.
async function prepareResourceSync(rid){
  stopResourceSync();          // evtl. vorherige Übung sauber abschliessen
  syncState.resourceId = rid;
  syncState.tracked = loadTrackedKeys(rid);
  syncState.lastWritten = null;
  if(!state.user){ syncState.baseline = lsSnapshot(); return; }
  try{
    var snap = await getDoc(doc(db,'progress', state.user.uid, 'resources', rid));
    var data = snap.exists() ? snap.data() : null;
    var remoteRev = (data && typeof data.storeRev === 'number') ? data.storeRev : 0;
    var keys = (data && Array.isArray(data.storeKeys)) ? data.storeKeys : [];
    keys.forEach(function(k){ syncState.tracked[k] = true; });
    if(data && data.storeJson && remoteRev > localRev(rid)){
      var store = {};
      try{ store = JSON.parse(data.storeJson) || {}; }catch(e){ store = {}; }
      applyRemoteStore(keys, store);
      setLocalRev(rid, remoteRev);
      saveTrackedKeys(rid, syncState.tracked);
    }
  }catch(err){
    console.error('Stand konnte nicht geladen werden', err);
  }
  syncState.baseline = lsSnapshot();
  syncState.pollTimer = setInterval(function(){ checkLocalChanges(rid); }, SYNC_POLL_MS);
}

// Jeder Schlüssel, der sich seit dem Öffnen geändert hat oder neu ist, gehört
// zu dieser Übung. Einmal erfasste Schlüssel bleiben erfasst (auch wenn ihr
// Wert später wieder dem Ausgangswert entspricht oder sie gelöscht werden).
function checkLocalChanges(rid){
  if(syncState.resourceId !== rid) return;
  var now = lsSnapshot(), changed = false;
  Object.keys(now).forEach(function(k){
    if(now[k] !== syncState.baseline[k] && !syncState.tracked[k]){ syncState.tracked[k] = true; changed = true; }
  });
  Object.keys(syncState.baseline).forEach(function(k){
    if(!(k in now) && !syncState.tracked[k]){ syncState.tracked[k] = true; changed = true; }
  });
  var payload = buildStorePayload();
  if(changed || payload.json !== syncState.lastWritten) scheduleStoreWrite(rid);
}

function buildStorePayload(){
  var keys = Object.keys(syncState.tracked).sort(), store = {};
  keys.forEach(function(k){ var v = lsGet(k); if(v !== null) store[k] = v; });
  return { keys: keys, json: JSON.stringify(store) };
}

function scheduleStoreWrite(rid){
  clearTimeout(syncState.writeTimer);
  syncState.writeTimer = setTimeout(function(){ writeStore(rid); }, SYNC_DEBOUNCE_MS);
}

/* ===================== LERNSTAND-HISTORIE (überlebt "Zurücksetzen") =====

   Wunsch von Jan: auch wenn ein Kind seinen Übungsstand zurücksetzt, soll
   sichtbar bleiben, OB und WIE VIEL vorher gelernt wurde - für alle
   Übungen, nicht nur Diktate. Die Übungsseiten selbst sollen dafür NICHT
   angepasst werden müssen (unterschiedliche Formate: die Quiz-Lernpakete
   melden stats/total per postMessage, die Diktate ihren Stand über den
   generischen localStorage-Sync/storeJson - siehe oben).

   Lösung: an der einzigen Stelle, an der progress/{uid}/resources/{rid}
   tatsächlich geschrieben wird (writeProgressWithHistory, von beiden
   Schreibpfaden benutzt), wird VOR jedem Schreiben zuerst der bisherige
   Stand gelesen und in einen normalisierten "Lernstand" umgerechnet
   (learnedSummary). Fällt dieser Wert von "etwas" auf "nichts" (= ein
   Reset-Knopf wurde gedrückt), wird der alte Stand zuerst in ein
   history-Array gehängt, bevor die neuen (leeren) Werte geschrieben
   werden. Nur ab jetzt - bereits vor diesem Update erfolgte Resets sind
   nicht mehr rekonstruierbar. */

var PROGRESS_HISTORY_MAX = 50;

// Rechnet die auf progress/{uid}/resources/{rid} gespeicherten Rohdaten in
// einen einzigen, vergleichbaren "Lernstand" um - unabhängig davon, ob die
// Übung über stats/total (Quiz-Lernpakete) oder storeJson (Diktate, über
// den generischen Sync) meldet. null = noch kein auswertbarer Lernstand.
function learnedSummary(data){
  if(!data) return null;
  if(data.stats && typeof data.total === 'number'){
    var attempted=0, correct=0;
    Object.keys(data.stats).forEach(function(k){
      if(data.stats[k] && data.stats[k].status){ attempted++; if(data.stats[k].status==='correct') correct++; }
    });
    if(attempted>0){
      return { kind:'quiz', attempted:attempted, correct:correct, total:data.total,
        pct: data.total ? Math.round(correct/data.total*100) : null };
    }
  }
  if(data.storeJson){
    try{
      var store = JSON.parse(data.storeJson);
      var attemptsKey = Object.keys(store).filter(function(k){ return /_attempts$/.test(k); })[0];
      if(attemptsKey){
        var attempts = JSON.parse(store[attemptsKey]);
        if(Array.isArray(attempts) && attempts.length){
          var last = attempts[attempts.length-1];
          return { kind:'diktat', attemptCount:attempts.length, pct:last.pct, correct:last.correct, total:last.total, lastDate:last.date };
        }
      }
    }catch(e){}
  }
  return null;
}
function summaryAmount(s){
  if(!s) return 0;
  return s.kind==='quiz' ? s.attempted : s.attemptCount;
}

// Einziger Schreibweg nach progress/{uid}/resources/{rid}. Liest zuerst den
// aktuellen Stand, erkennt einen Reset (Lernstand fällt auf 0) und sichert
// ihn dann als history-Eintrag, bevor die neuen Felder geschrieben werden.
async function writeProgressWithHistory(uid, rid, newFields){
  var ref_ = doc(db, 'progress', uid, 'resources', rid);
  var before = null;
  try{
    var snap = await getDoc(ref_);
    before = snap.exists() ? snap.data() : null;
  }catch(e){
    console.error('Lernstand konnte vor dem Schreiben nicht gelesen werden', e);
  }

  var merged = Object.assign({}, before||{}, newFields);
  var oldSummary = learnedSummary(before);
  var newSummary = learnedSummary(merged);
  var payload = Object.assign({}, newFields);

  if(oldSummary && summaryAmount(oldSummary) > 0 && summaryAmount(newSummary) === 0){
    var history = (before && Array.isArray(before.history)) ? before.history.slice() : [];
    history.push({ archivedAt: new Date().toISOString(), summary: oldSummary });
    if(history.length > PROGRESS_HISTORY_MAX) history = history.slice(history.length - PROGRESS_HISTORY_MAX);
    payload.history = history;
  }

  return setDoc(ref_, payload, {merge:true});
}

function writeStore(rid){
  if(!state.user || syncState.resourceId !== rid) return;
  var payload = buildStorePayload();
  if(!payload.keys.length || payload.json === syncState.lastWritten) return;
  if(payload.json.length > SYNC_MAX_BYTES){
    console.warn('Übungsstand zu gross für die Synchronisierung ('+payload.json.length+' Zeichen) — bleibt nur auf diesem Gerät.');
    return;
  }
  // Revision optimistisch hochzählen: so gewinnt auch dann das zuletzt
  // benutzte Gerät, wenn der Schreibvorgang gerade offline scheitert.
  var rev = Math.max(Date.now(), localRev(rid) + 1);
  setLocalRev(rid, rev);
  saveTrackedKeys(rid, syncState.tracked);
  syncState.lastWritten = payload.json;
  writeProgressWithHistory(state.user.uid, rid, {
    storeJson: payload.json,
    storeKeys: payload.keys,
    storeRev: rev,
    storeAt: serverTimestamp()
  }).catch(function(err){
    console.error('Stand konnte nicht gespeichert werden', err);
    syncState.lastWritten = null;   // beim nächsten Versuch erneut schreiben
  });
}

// Beim Verlassen der Übung (oder der Seite) noch einmal alles sichern.
function flushResourceSync(){
  var rid = syncState.resourceId;
  if(!rid) return;
  clearTimeout(syncState.writeTimer);
  checkLocalChanges(rid);
  writeStore(rid);
}

function stopResourceSync(){
  flushResourceSync();
  clearInterval(syncState.pollTimer);
  clearTimeout(syncState.writeTimer);
  syncState.pollTimer = null;
  syncState.writeTimer = null;
  syncState.resourceId = null;
  syncState.tracked = {};
  syncState.baseline = {};
  syncState.lastWritten = null;
}

window.addEventListener('pagehide', flushResourceSync);
document.addEventListener('visibilitychange', function(){
  if(document.visibilityState === 'hidden') flushResourceSync();
});

/* ===================== RENDER: RESOURCE VIEWER ===================== */

var currentViewerResourceId = null;
var progressWriteTimers = {};

function renderResource(r){
  clearOverviewWatchers();
  clearSubjectWatchers();
  unwatchAllProgress();
  currentViewerResourceId = r.id;
  var s = subjectById(r.subject);

  var html = '<div class="viewer-wrap">';
  html += '<div class="back-row"><button class="btn btn-ghost btn-sm" id="backBtn">&larr; '+esc(s ? s.name : 'Fach')+'</button></div>';
  html += '<div class="viewer-head"><h2>'+esc(r.title || r.fileName)+'</h2><span class="viewer-progress" id="viewerProgress"></span>';
  html += '<button class="btn btn-ghost btn-sm btn-fs" id="fsBtn" type="button"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M8 3H5a2 2 0 0 0-2 2v3M16 3h3a2 2 0 0 1 2 2v3M8 21H5a2 2 0 0 1-2-2v-3M16 21h3a2 2 0 0 0 2-2v-3"/></svg> Vollbild</button>';
  html += '</div>';
  html += '<div class="viewer-frame-wrap" id="frameWrap">';
  html += '<button class="btn-fs-overlay-exit" id="fsExitBtn" type="button" title="Vollbild verlassen" aria-label="Vollbild verlassen"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 3v3a2 2 0 0 1-2 2H4M15 3v3a2 2 0 0 0 2 2h3M9 21v-3a2 2 0 0 0-2-2H4M15 21v-3a2 2 0 0 1 2-2h3"/></svg></button>';
  html += '<iframe id="resourceFrame" title="'+esc(r.title||r.fileName)+'"></iframe>';
  html += '</div>';
  html += '</div>';

  renderChrome(html);
  document.getElementById('backBtn').addEventListener('click', function(){ goSubject(r.subject, r.folderId || null); });
  wireFullscreen();

  watchProgress(r.id, function(p){ updateViewerProgress(p); });

  var contentPromise = getDoc(doc(db,'resourceContent', r.id)).then(function(snap){
    if(!snap.exists()){ throw new Error('no content'); }
    var chunkCount = snap.data().chunkCount || 0;
    var chunkIndexes = [];
    for(var i=0;i<chunkCount;i++){ chunkIndexes.push(i); }
    return Promise.all(chunkIndexes.map(function(i){
      return getDoc(doc(db,'resourceContent', r.id, 'chunks', String(i)));
    }));
  });

  // Der gesicherte Übungsstand muss in localStorage stehen, BEVOR das iframe
  // lädt — die Übungsseite liest ihn direkt beim Start. Beides läuft parallel,
  // damit das Öffnen nicht langsamer wird.
  Promise.all([contentPromise, prepareResourceSync(r.id)]).then(function(res){
    var chunkSnaps = res[0];
    var html = chunkSnaps.map(function(s){ return (s.exists() && s.data().html) || ''; }).join('');
    document.getElementById('resourceFrame').srcdoc = html;
  }).catch(function(err){
    console.error(err);
    var wrap = document.querySelector('.viewer-frame-wrap');
    if(wrap) wrap.innerHTML = '<div class="empty-state">Diese Übung konnte nicht geladen werden.</div>';
  });
}

var FS_ICON_ENTER = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M8 3H5a2 2 0 0 0-2 2v3M16 3h3a2 2 0 0 1 2 2v3M8 21H5a2 2 0 0 1-2-2v-3M16 21h3a2 2 0 0 0 2-2v-3"/></svg> Vollbild';
var FS_ICON_EXIT = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 3v3a2 2 0 0 1-2 2H4M15 3v3a2 2 0 0 0 2 2h3M9 21v-3a2 2 0 0 0-2-2H4M15 21v-3a2 2 0 0 1 2-2h3"/></svg> Vollbild verlassen';
var fullscreenListenerAttached = false;

// Fullscreens the viewer's frame wrapper (not the iframe itself) so it works
// consistently across browsers. Looks elements up by id on every call/event
// rather than closing over them, so this is safe to call again on every
// resource-viewer render without leaking stale references or duplicate
// document-level listeners.
function isPseudoFsActive(){
  var wrap = document.getElementById('frameWrap');
  return !!(wrap && wrap.classList.contains('pseudo-fullscreen'));
}

function enterPseudoFullscreen(){
  var wrap = document.getElementById('frameWrap');
  if(!wrap) return;
  wrap.classList.add('pseudo-fullscreen');
  document.body.classList.add('pseudo-fs-active');
  updateFsButtonLabel();
}

function exitPseudoFullscreen(){
  var wrap = document.getElementById('frameWrap');
  if(!wrap) return;
  wrap.classList.remove('pseudo-fullscreen');
  document.body.classList.remove('pseudo-fs-active');
  updateFsButtonLabel();
}

function updateFsButtonLabel(){
  var wrap = document.getElementById('frameWrap');
  var btn = document.getElementById('fsBtn');
  if(!wrap || !btn) return;
  var isFs = (document.fullscreenElement || document.webkitFullscreenElement) === wrap || isPseudoFsActive();
  btn.innerHTML = isFs ? FS_ICON_EXIT : FS_ICON_ENTER;
}

function exitFullscreenNow(){
  if(isPseudoFsActive()){ exitPseudoFullscreen(); return; }
  if(document.fullscreenElement || document.webkitFullscreenElement){
    var action = (document.exitFullscreen || document.webkitExitFullscreen).call(document);
    if(action && action.catch){ action.catch(function(){}); }
  }
}

function wireFullscreen(){
  var wrap = document.getElementById('frameWrap');
  var btn = document.getElementById('fsBtn');
  var exitBtn = document.getElementById('fsExitBtn');
  if(!wrap || !btn) return;
  // Safari on iOS (incl. installed Home-Screen apps) has no Fullscreen API for
  // arbitrary elements at all — requestFullscreen/webkitRequestFullscreen are
  // simply undefined there. Rather than hiding the buttons (old behaviour),
  // fall back to the CSS-only pseudo-fullscreen so the app version gets the
  // same enter/exit button pair as desktop.
  var nativeSupported = !!(wrap.requestFullscreen || wrap.webkitRequestFullscreen);
  btn.addEventListener('click', function(){
    var w = document.getElementById('frameWrap');
    if(!w) return;
    if(!nativeSupported){
      if(isPseudoFsActive()){ exitPseudoFullscreen(); } else { enterPseudoFullscreen(); }
      return;
    }
    var isFs = (document.fullscreenElement || document.webkitFullscreenElement) === w;
    if(isFs){ exitFullscreenNow(); return; }
    var action = (w.requestFullscreen || w.webkitRequestFullscreen).call(w);
    if(action && action.catch){
      action.catch(function(){
        // Native request refused at runtime (rare) — fall back to the CSS
        // version instead of leaving the user with a dead button.
        enterPseudoFullscreen();
      });
    }
  });
  // #fsBtn sits in .viewer-head, OUTSIDE #frameWrap — once #frameWrap is the
  // fullscreen element (native or pseudo), #fsBtn is no longer on screen at all
  // (only the fullscreen element and its descendants render), so it can't be
  // clicked to get back out. #fsExitBtn lives inside #frameWrap instead (see
  // CSS: shown while :fullscreen or .pseudo-fullscreen) so there's always a
  // visible, clickable way out besides Esc (and Esc doesn't even apply to the
  // CSS fallback, since that isn't the real Fullscreen API).
  if(exitBtn){ exitBtn.addEventListener('click', exitFullscreenNow); }
  updateFsButtonLabel();
  if(!fullscreenListenerAttached){
    document.addEventListener('fullscreenchange', updateFsButtonLabel);
    document.addEventListener('webkitfullscreenchange', updateFsButtonLabel);
    document.addEventListener('keydown', function(e){
      if(e.key === 'Escape' && isPseudoFsActive()){ exitPseudoFullscreen(); }
    });
    fullscreenListenerAttached = true;
  }
}

function updateViewerProgress(p){
  var el = document.getElementById('viewerProgress');
  if(!el) return;
  if(!p || p.attempted===0){ el.textContent = 'Noch nicht geübt'; return; }
  var parts = [];
  if(p.total){ parts.push(p.attempted+' / '+p.total+' geübt'); } else { parts.push(p.attempted+' bearbeitet'); }
  if(p.correctPct!==null){ parts.push(p.correctPct+'% richtig'); }
  el.textContent = parts.join(' · ');
}

window.addEventListener('message', function(e){
  var data = e.data;
  if(!data || !data.__libProgress || !currentViewerResourceId || !state.user) return;
  var resourceId = currentViewerResourceId;
  // Eine Fortschrittsmeldung heisst: in der Übung ist gerade etwas passiert —
  // guter Moment, auch den localStorage-Stand einzusammeln.
  checkLocalChanges(resourceId);
  clearTimeout(progressWriteTimers[resourceId]);
  progressWriteTimers[resourceId] = setTimeout(function(){
    writeProgressWithHistory(state.user.uid, resourceId, {
      stats: data.stats || {},
      total: typeof data.total === 'number' ? data.total : null,
      updatedAt: serverTimestamp()
    }).catch(function(err){ console.error('progress write failed', err); });
  }, 500);
});

/* ===================== MAIN RENDER ===================== */

function render(){
  clearOverviewWatchers();
  // Übung verlassen: Stand ein letztes Mal sichern und die Beobachtung stoppen.
  if(state.route.name !== 'resource' && syncState.resourceId){
    stopResourceSync();
    currentViewerResourceId = null;
  }
  if(state.route.name === 'loading'){
    app.innerHTML = '<div class="spinner-wrap">Lädt …</div>';
    return;
  }
  if(state.route.name === 'login'){ renderLogin(); return; }
  if(!state.profile){ app.innerHTML = '<div class="spinner-wrap">Lädt …</div>'; return; }
  if(state.route.name === 'home'){ renderHome(); return; }
  if(state.route.name === 'subject'){ renderSubject(state.route.subject, state.route.folderId || null); return; }
  if(state.route.name === 'resource'){ renderResource(state.route.resource); return; }
  if(state.route.name === 'diktatauswertung'){ renderDiktatAuswertung(); return; }
  if(state.route.name === 'lernstand'){ renderLernstandUebersicht(); return; }
  if(state.route.name === 'kalender'){ renderKalender(); return; }
}
</script>
</body>
</html>
