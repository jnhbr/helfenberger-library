// Lädt für alle Diktat-Ressourcen des Fachs Deutsch und alle Schüler:innen
// den jeweils letzten Diktatversuch (aus progress/{uid}/resources/{rid}) und
// fasst die Fehlerkategorien pro Schüler:in zusammen. Einmaliger Ladevorgang
// (kein Live-Listener) - die Ansicht hat einen "Neu laden"-Knopf.
async function loadDiktatAuswertung(){
  var result = { resources: [], students: [], perStudent: {} };

  var resSnap = await getDocs(query(collection(db,'resources'), where('subject','==','deutsch')));
  var diktatResources = [];
  resSnap.forEach(function(d){
    var data = d.data();
    var title = data.title || data.fileName || '';
    if(/diktat/i.test(title)) diktatResources.push(Object.assign({id:d.id}, data));
  });
  diktatResources.sort(function(a,b){ return (a.title||'').localeCompare(b.title||'', 'de'); });
  result.resources = diktatResources;

  var students = await loadStudentRoster();
  result.students = students;

  // Jedes {Schüler:in x Diktat}-Paar einzeln lesen (Lehrperson-Leserecht laut
  // firestore.rules) - bei 14-16 Kindern x wenigen Diktaten unproblematisch
  // fürs kostenlose Firestore-Kontingent.
  var reads = [];
  students.forEach(function(stu){
    diktatResources.forEach(function(res){
      reads.push(
        getDoc(doc(db,'progress', stu.uid, 'resources', res.id)).then(function(snap){
          return {uid:stu.uid, resId:res.id, snap:snap};
        }).catch(function(){ return {uid:stu.uid, resId:res.id, snap:null}; })
      );
    });
  });
  var settled = await Promise.all(reads);

  students.forEach(function(stu){
    result.perStudent[stu.uid] = { byResource:{}, categoryTotals:{} };
  });

  settled.forEach(function(r){
    if(!r.snap || !r.snap.exists()) return;
    var data = r.snap.data();
    if(!data.storeJson) return;
    var store;
    try{ store = JSON.parse(data.storeJson); }catch(e){ return; }
    var attemptsKey = Object.keys(store).filter(function(k){ return /_attempts$/.test(k); })[0];
    if(!attemptsKey) return;
    var attempts;
    try{ attempts = JSON.parse(store[attemptsKey]); }catch(e){ return; }
    if(!Array.isArray(attempts) || !attempts.length) return;
    var last = attempts[attempts.length-1];
    var bucket = result.perStudent[r.uid];
    bucket.byResource[r.resId] = { pct: last.pct, date: last.date, attemptCount: attempts.length };
    Object.keys(last.weakness||{}).forEach(function(catId){
      var meta = DIKTAT_RULE_META[catId] ? catId : 'sonstige';
      bucket.categoryTotals[meta] = (bucket.categoryTotals[meta]||0) + last.weakness[catId];
    });
  });

  return result;
}

  clearSubjectWatchers(); clearOverviewWatchers(); unwatchAllProgress();
  var html = '<div class="back-row"><button class="btn btn-ghost btn-sm" id="backBtn">&larr; Deutsch</button></div>';
  html += '<h2>📊 Fehleranalyse Diktate</h2>';
  html += '<p class="muted" style="margin:-6px 0 14px;">Fasst pro Schüler:in den jeweils letzten Versuch aller Diktate zusammen. Nur für dich sichtbar.</p>';

        h += '<td>'+(by ? by.pct+'%' : '<span class="muted">–</span>')+'</td>';
      });
      h += '</tr>';
    });
    h += '</tbody></table>';

    h += '<h3 style="margin-top:26px;">Fehlerkategorien pro Schüler:in (alle Diktate zusammen)</h3>';
    result.students.forEach(function(stu){

            '<div class="weak-bar-track"><div class="weak-bar-fill" style="width:'+Math.round(e.count/max*100)+'%;background:'+meta.color+'"></div></div>' +
            '<div class="weak-bar-count">'+e.count+'</div></div>';

    body.innerHTML = h;

  }).catch(function(err){
    console.error(err);

  });

/* ===================== LERNSTAND-ÜBERSICHT (alle Fächer, Lehrperson) =====================
   Zeigt für jede Übung in jedem Fach, ob und wie viel jede/r Schüler:in
   gelernt hat - aktueller Stand plus die komplette Reset-Historie (siehe
   writeProgressWithHistory oben). Baut auf denselben Rohdaten wie die
   Diktat-Auswertung, aber fachübergreifend und mit sichtbarer Historie. */

function fmtLearnedSummary(s){
  if(!s) return '–';
  if(s.kind==='quiz') return s.attempted+' / '+s.total+(s.pct!==null ? ' ('+s.pct+'% richtig)' : '');
  return s.pct+'% richtig (Versuch '+s.attemptCount+')';
}
function fmtHistoryEntry(h){
  var d = new Date(h.archivedAt);
  var ds = isNaN(d) ? h.archivedAt : d.toLocaleDateString('de-CH', {day:'2-digit', month:'2-digit', year:'numeric'});
  return ds+': '+fmtLearnedSummary(h.summary);
}
// Sekunden (aus progress/{uid}/resources/{rid}.timeSpentSec, siehe Lernzeit-
// Tracking oben) in Stunden auf eine Nachkommastelle. Unter 6 Minuten wird
// nichts angezeigt — zu wenig aussagekräftig, meist nur kurz reingeschaut.
function fmtHours(sec){
  if(!sec) return null;
  var h = Math.round(sec/360)/10;
  if(h < 0.1) return null;
  return h.toString().replace('.',',')+' Std.';
}

// Fächer, die in der Lernstand-Übersicht nichts verloren haben: Berufswahl
// (keine "gelernt"-Metrik im klassischen Sinn) und Lehrerbereich (interne
// Tools, keine Schüler:innen-Übungen).
var LERNSTAND_EXCLUDED_SUBJECTS = ['berufswahl', 'lehrerbereich'];

async function loadLernstandUebersicht(){
  var resSnap = await getDocs(collection(db,'resources'));
  var resources = [];
  resSnap.forEach(function(d){
    var data = d.data();
    if(LERNSTAND_EXCLUDED_SUBJECTS.indexOf(data.subject) !== -1) return;
    resources.push(Object.assign({id:d.id}, data));
  });
  resources.sort(function(a,b){
    var sa = subjectById(a.subject), sb = subjectById(b.subject);
    var sn = (sa?sa.name:a.subject).localeCompare(sb?sb.name:b.subject, 'de');
    if(sn!==0) return sn;
    // Als "aktuelles Thema" markierte Übungen zuvorderst, sonst alphabetisch.
    var ac = a.current ? 0 : 1, bc = b.current ? 0 : 1;
    if(ac!==bc) return ac-bc;
    return (a.title||a.fileName||'').localeCompare(b.title||b.fileName||'', 'de');
  });

  var students = await loadStudentRoster();

  var reads = [];
  students.forEach(function(stu){
    resources.forEach(function(res){
      reads.push(
        getDoc(doc(db,'progress', stu.uid, 'resources', res.id)).then(function(snap){
          return {uid:stu.uid, resId:res.id, data: snap.exists() ? snap.data() : null};
        }).catch(function(){ return {uid:stu.uid, resId:res.id, data:null}; })
      );
    });
  });
  var settled = await Promise.all(reads);

  var bySubject = {};
  resources.forEach(function(res){
    if(!bySubject[res.subject]) bySubject[res.subject] = {resources:[], cell:{}};
    bySubject[res.subject].resources.push(res);
  });
  settled.forEach(function(r){
    var subj = resources.find(function(x){ return x.id===r.resId; }).subject;
    bySubject[subj].cell[r.uid+'|'+r.resId] = {
      current: learnedSummary(r.data),
      history: (r.data && Array.isArray(r.data.history)) ? r.data.history : [],
      timeSpentSec: (r.data && typeof r.data.timeSpentSec === 'number') ? r.data.timeSpentSec : 0
    };
  });

  return {students:students, bySubject:bySubject};
}

// Offen/zu-Zustand der Fach-Klappboxen. Default: ZU — die Seite startet als
// kompakte Fächerliste, aufgeklappt wird, was gerade interessiert.
function lsFachOffen(subjId){
  try{ return localStorage.getItem('hl_lernstand_auf_'+subjId) === '1'; }
  catch(e){ return false; }
}
function lsFachSetzen(subjId, offen){
  try{
    if(offen) localStorage.setItem('hl_lernstand_auf_'+subjId, '1');
    else localStorage.removeItem('hl_lernstand_auf_'+subjId);
  }catch(e){}
}

function renderLernstandUebersicht(){
  clearSubjectWatchers(); clearOverviewWatchers(); unwatchAllProgress();

  html += '<h2>📈 Lernstand-Übersicht</h2>';

    var subjectIds = Object.keys(result.bySubject).filter(function(id){ return result.bySubject[id].resources.length>0; });
    subjectIds.sort(function(a,b){

    });

    var h = '<div class="da-toolbar" style="gap:8px;"><button class="btn btn-ghost btn-sm" id="lsPrintBtn" type="button">🖨️ Drucken</button>'+
      '<button class="btn btn-ghost btn-sm" id="lsCsvBtn" type="button">⬇️ CSV</button>'+
      '<button class="btn btn-ghost btn-sm" id="lsReloadBtn" type="button">↻ Neu laden</button></div>';
    subjectIds.forEach(function(subjId){
      var sub = result.bySubject[subjId];
      var s = subjectById(subjId);
      h += '<details class="ls-fach" data-subj="'+esc(subjId)+'"'+(lsFachOffen(subjId)?' open':'')+'>';
      h += '<summary>'+esc(s?s.name:subjId)+'<span class="ls-fach-count">'+sub.resources.length+' '+(sub.resources.length===1?'Übung':'Übungen')+'</span></summary>';
      h += '<div class="ls-fach-body">';
      h += '<div class="table-scroll"><table class="da-table"><thead><tr><th>Schüler:in</th>';
      sub.resources.forEach(function(res){ h += '<th>'+esc(res.title||res.fileName)+'</th>'; });
      h += '</tr></thead><tbody>';
      result.students.forEach(function(stu){
        h += '<tr><td>'+esc(stu.displayName)+'</td>';
        sub.resources.forEach(function(res){
          var cell = sub.cell[stu.uid+'|'+res.id];
          var current = cell ? cell.current : null;
          var histCount = cell ? cell.history.length : 0;
          var hours = fmtHours(cell ? cell.timeSpentSec : 0);
          h += '<td>'+esc(fmtLearnedSummary(current)) + (histCount ? ' <span class="da-reset-badge" title="'+esc(cell.history.map(fmtHistoryEntry).join(' · '))+'">↺'+histCount+'</span>' : '') +
            (hours ? '<br><span class="tiny muted">⏱ '+esc(hours)+'</span>' : '') + '</td>';
        });
        h += '</tr>';
      });
      h += '</tbody></table></div>';

      // Ausführliche Historie nur für Zellen mit mindestens einem Reset anzeigen.
      var histLines = [];
      result.students.forEach(function(stu){
        sub.resources.forEach(function(res){
          var cell = sub.cell[stu.uid+'|'+res.id];
          if(cell && cell.history.length){
            histLines.push({stu:stu, res:res, cell:cell});
          }
        });
      });
      if(histLines.length){
        h += '<div class="da-student-card"><h4 style="margin-top:0;">Reset-Verlauf</h4>';
        histLines.forEach(function(l){
          var opts = l.cell.history.map(fmtHistoryEntry).map(function(t){ return '<option>'+esc(t)+'</option>'; }).join('');
          h += '<div class="reset-history-row"><strong>'+esc(l.stu.displayName)+'</strong> · '+esc(l.res.title||l.res.fileName)+
            ' <select class="reset-history-select" title="Stand jeweils unmittelbar vor dem Reset">'+opts+'</select></div>';
        });
        h += '</div>';
      }
      h += '</div></details>';
    });

    body.innerHTML = h;
    // Offen/zu je Fach merken.
    Array.prototype.forEach.call(body.querySelectorAll('.ls-fach'), function(d){
      d.addEventListener('toggle', function(){ lsFachSetzen(d.getAttribute('data-subj'), d.open); });
    });
    document.getElementById('lsReloadBtn').addEventListener('click', renderLernstandUebersicht);
    document.getElementById('lsPrintBtn').addEventListener('click', function(){
      // Zugeklappte Fächer stehen nicht im Ausdruck — vorher alle öffnen.
      Array.prototype.forEach.call(body.querySelectorAll('.ls-fach'), function(d){ d.open = true; });
      window.print();
    });
    document.getElementById('lsCsvBtn').addEventListener('click', function(){
      var rows = [['Fach','Schüler:in','Übung','Stand','Anzahl Reset','Lernzeit (Std.)']];
      subjectIds.forEach(function(subjId){
        var sub = result.bySubject[subjId];
        var s = subjectById(subjId);
        result.students.forEach(function(stu){
          sub.resources.forEach(function(res){
            var cell = sub.cell[stu.uid+'|'+res.id];
            var h = cell ? Math.round((cell.timeSpentSec||0)/360)/10 : 0;
            rows.push([s?s.name:subjId, stu.displayName, res.title||res.fileName, fmtLearnedSummary(cell?cell.current:null), cell?cell.history.length:0, h.toString().replace('.',',')]);
          });
        });
      });
      var csv = rows.map(function(r){ return r.map(csvField).join(','); }).join('\r\n');
      downloadTextFile('lernstand-'+todayStr()+'.csv', csv, 'text/csv');
    });
  }).catch(function(err){
    console.error(err);
    var body = document.getElementById('lernstandBody');
    if(body) body.innerHTML = '<div class="empty-state">Übersicht konnte nicht geladen werden.</div>';
  });
}

/* ===================== "BLEISTIFT"-EASTER-EGG (unten rechts) =====================
   Rein dekoratives Detail für aufmerksame Schüler:innen: der Bleistift neben der
   Kaffeetasse ist klickbar und öffnet eine Sprechblase mit einer versteckten
   Nachricht. An/Aus + Text liegen in Firestore unter appMeta/pencilEgg (appMeta
   erlaubt laut firestore.rules bereits: alle lesen, nur die Lehrperson schreibt -
   keine Regeländerung nötig). Für die Lehrperson bleibt der Bleistift auch im
   ausgeblendeten Zustand sichtbar (nur schwächer/entsättigt), damit sie ihn
   jederzeit wieder einschalten kann; für alle anderen verschwindet er komplett. */
var PENCIL_EGG_DEFAULT_MESSAGE = "Du bist die erste Person, die mich entdeckt hat. Hol dir dein Schoggibrötli bei Herrn Helfenberger ab.";
var pencilEgg = { enabled:true, message:PENCIL_EGG_DEFAULT_MESSAGE };
var pencilEggBtn = document.getElementById('pencilEgg');
if(pencilEggBtn){
  pencilEggBtn.addEventListener('click', function(e){
    e.stopPropagation();
    if(document.getElementById('pencilBubble')){ closePencilBubble(); } else { openPencilBubble(); }
  });
}
function loadPencilEgg(){
  getDoc(doc(db,'appMeta','pencilEgg')).then(function(snap){
    if(snap.exists()){
      var data = snap.data();
      if(typeof data.enabled === 'boolean') pencilEgg.enabled = data.enabled;
      if(typeof data.message === 'string' && data.message.trim()) pencilEgg.message = data.message;
    }
    applyPencilEggVisibility();
  }).catch(function(err){ console.error(err); applyPencilEggVisibility(); });
}
function applyPencilEggVisibility(){
  if(!pencilEggBtn) return;
  var isTeacher = state.profile && state.profile.role === 'teacher';
  pencilEggBtn.hidden = !(pencilEgg.enabled || isTeacher);
  pencilEggBtn.classList.toggle('desk-prop-pencil-off', !pencilEgg.enabled);
}
function openPencilBubble(){
  var isTeacher = state.profile && state.profile.role === 'teacher';
  var html = '<div class="pencil-bubble" id="pencilBubble">'+
    '<button type="button" class="pencil-bubble-close" id="pencilBubbleClose" aria-label="Schliessen">×</button>'+
    '<div class="pencil-bubble-msg">'+esc(pencilEgg.message)+'</div>';
  if(isTeacher){
    html += '<div class="pencil-bubble-teacher">'+
      '<label class="modal-label">Nachricht (nur du siehst dieses Feld)</label>'+
      '<textarea id="pencilMsgInput" rows="3" maxlength="300">'+esc(pencilEgg.message)+'</textarea>'+
      '<div class="pencil-bubble-actions">'+
        '<button class="btn btn-ghost btn-sm" id="pencilSaveBtn" type="button">Speichern</button>'+
        '<button class="btn btn-ghost btn-sm" id="pencilHideBtn" type="button">'+(pencilEgg.enabled ? 'Funktion ausblenden' : 'Funktion einblenden')+'</button>'+
      '</div></div>';
  }
  html += '</div>';
  document.body.insertAdjacentHTML('beforeend', html);
  document.getElementById('pencilBubbleClose').addEventListener('click', closePencilBubble);
  if(isTeacher){
    document.getElementById('pencilSaveBtn').addEventListener('click', function(){
      var val = document.getElementById('pencilMsgInput').value.trim().slice(0,300);
      if(!val) return;
      savePencilEgg({message:val});
      closePencilBubble();
    });
    document.getElementById('pencilHideBtn').addEventListener('click', function(){
      savePencilEgg({enabled: !pencilEgg.enabled});
      closePencilBubble();
    });
  }
  setTimeout(function(){ document.addEventListener('click', onOutsidePencilClick); }, 0);
}
function closePencilBubble(){
  var el = document.getElementById('pencilBubble');
  if(el) el.remove();
  document.removeEventListener('click', onOutsidePencilClick);
}
function onOutsidePencilClick(e){
  var el = document.getElementById('pencilBubble');
  if(!el) return;
  if(el.contains(e.target) || e.target === pencilEggBtn) return;
  closePencilBubble();
}
function savePencilEgg(patch){
  Object.assign(pencilEgg, patch);
  applyPencilEggVisibility();
  setDoc(doc(db,'appMeta','pencilEgg'), patch, {merge:true}).then(function(){
    toast('Gespeichert.');
  }).catch(function(err){
    console.error(err);
    toast('Konnte nicht gespeichert werden.');
  });
}

/* ===================== HOVER-PANELS (To-dos & Schulden) =====================
   Die beiden Topbar-Fenster (To-do-Panel, Schulden-Fenster) gehen schon beim
   Drüberfahren mit der Maus auf und wieder zu, sobald der Zeiger Knopf und
   Fenster verlassen hat. Erst ein Klick "pinnt" das Fenster - dann bleibt es
   offen, bis man es bewusst schliesst (x, Klick daneben, Esc, erneuter Klick
   auf den Knopf).

   Warum Zeiger-Koordinaten statt mouseenter/mouseleave: Das Schulden-Fenster
   ist ein Modal, dessen abgedunkeltes Overlay den Topbar-Knopf im selben
   Moment überdeckt, in dem es aufgeht - mit enter/leave würde es sich sofort
   wieder schliessen. Die Rechteck-Prüfung kennt dieses Problem nicht. Der
   mousemove-Handler hängt nur so lange am Dokument, wie tatsächlich ein per
   Hover geöffnetes Fenster offen ist. */
var HOVER_OPEN_MS = 140;   // kurze Absicht-Verzögerung: blosses Vorbeifahren öffnet nichts
var HOVER_CLOSE_MS = 500;  // Karenz, um mit der Maus vom Knopf ins Fenster zu wechseln

function pointInEl(x, y, el, pad){
  if(!el || el.hidden) return false;
  var r = el.getBoundingClientRect();
  if(!r.width && !r.height) return false;
  pad = pad || 0;
  return x >= r.left - pad && x <= r.right + pad && y >= r.top - pad && y <= r.bottom + pad;
}

// cfg: { open(byClick), close(), isOpen(), isOver(x,y), trigger(), keepOpen() }
function makeHoverPanel(cfg){
  var openTimer = null, closeTimer = null, pinned = false, tracking = false, byHover = false;

  function clearTimers(){
    if(openTimer){ clearTimeout(openTimer); openTimer = null; }
    if(closeTimer){ clearTimeout(closeTimer); closeTimer = null; }
  }
  function startTracking(){
    if(tracking) return;
    tracking = true;
    document.addEventListener('mousemove', onMove);
    document.addEventListener('mousedown', onDocDown, true);
  }
  function stopTracking(){
    if(!tracking) return;
    tracking = false;
    document.removeEventListener('mousemove', onMove);
    document.removeEventListener('mousedown', onDocDown, true);
  }
  function onDocDown(e){
    if(pinned || !cfg.isOpen()) return;
    // Der Topbar-Knopf hat seine eigene Klick-Logik (pinnen bzw. schliessen).
    var trg = cfg.trigger && cfg.trigger();
    if(trg && trg.contains(e.target)) return;
    if(!cfg.isOver(e.clientX, e.clientY)) return;
    pinned = true;
    byHover = false;
    clearTimers();
    stopTracking();
  }
  function onMove(e){
    if(pinned){ clearTimers(); stopTracking(); return; }
    if(!cfg.isOpen()){ clearTimers(); stopTracking(); return; }
    if(cfg.isOver(e.clientX, e.clientY)){
      if(closeTimer){ clearTimeout(closeTimer); closeTimer = null; }
      return;
    }
    if(closeTimer) return;
    closeTimer = setTimeout(function(){
      closeTimer = null;
      if(pinned || !cfg.isOpen()) return;
      if(cfg.keepOpen && cfg.keepOpen()) return;
      api.close();
    }, HOVER_CLOSE_MS);
  }

  var api = {
    hoverIn: function(){
      clearTimers();
      if(pinned || cfg.isOpen()) return;
      openTimer = setTimeout(function(){
        openTimer = null;
        cfg.open(false);
        byHover = true;
        startTracking();
      }, HOVER_OPEN_MS);
    },
    hoverOut: function(){
      if(openTimer){ clearTimeout(openTimer); openTimer = null; }
      // Das Zumachen erledigt onMove anhand der Zeiger-Position.
      if(byHover && !pinned && cfg.isOpen()) startTracking();
    },
    click: function(){
      clearTimers();
      if(pinned && cfg.isOpen()){ api.close(); return; }
      cfg.open(true);
      pinned = true;
      byHover = false;
      stopTracking();
    },
    close: function(){ cfg.close(); },
    isPinned: function(){ return pinned; },
    // Aufräumen, wenn das Fenster (auch von aussen) geschlossen wurde.
    reset: function(){ pinned = false; byHover = false; clearTimers(); stopTracking(); }
  };
  return api;
}

/* ===================== SCHULDEN ("Geld-Symbol" oben links) =====================
   Kleine Beträge, die Schüler:innen Herrn Helfenberger schulden (Schoggibrötli
   & Co.). Datenmodell: debts/{uid} -> {entries:[{id, amount, what, createdAt}],
   updatedAt}. Laut firestore.rules liest jede:r nur das eigene Dokument, die
   Lehrperson liest/schreibt alle - so sieht jede Schüler:in ausschliesslich die
   eigenen Schulden. Das Dokument wird bei jeder Änderung komplett neu
   geschrieben (setDoc ohne merge), damit gelöschte Einträge wirklich
   verschwinden. Für Schüler:innen erscheint das Symbol nur bei offenen Schulden
   und öffnet die Sprechblase von selbst; die Lehrperson sieht sie immer (mit
   Badge = Anzahl Schuldner:innen) und muss sie anklicken, um die Verwaltung zu
   öffnen. */
var myDebt = { entries:[], total:0 };
var myDebtUnsub = null;
var teacherDebtCount = 0;
var coinAutoShownSig = '';
// Ist gerade das Schulden-Fenster der Lehrperson offen? (Für die Hover-Logik:
// nur dann zählt das Modal zum Geld-Symbol und darf per Maus zugehen.)
var debtHoverActive = false;
// Gegen ein Wettrennen: Das Fenster lädt asynchron. Wird es in der Zwischenzeit
// per Maus wieder geschlossen, darf das nachgeladene Ergebnis es nicht erneut
// aufreissen.
var debtLoadToken = 0;

function coinIsTeacher(){ return !!(state.profile && state.profile.role === 'teacher'); }

var coinHover = makeHoverPanel({
  trigger: function(){ return document.getElementById('coinBtn'); },
  isOpen: function(){
    if(coinIsTeacher()) return debtHoverActive && modalEl.classList.contains('show');
    return !!document.getElementById('coinBubble');
  },
  isOver: function(x, y){
    if(pointInEl(x, y, document.getElementById('coinBtn'), 14)) return true;
    if(pointInEl(x, y, document.getElementById('coinBubble'), 14)) return true;
    if(debtHoverActive && pointInEl(x, y, modalEl.querySelector('.modal'), 10)) return true;
    return false;
  },
  open: function(){
    if(coinIsTeacher()){
      if(!(debtHoverActive && modalEl.classList.contains('show'))) openDebtManager();
    } else if(!document.getElementById('coinBubble')){
      openCoinBubble();
    }
  },
  close: function(){
    if(debtHoverActive) closeModal();
    else closeCoinBubble();
  }
});

function fmtChf(n){ return 'CHF ' + (Math.round(Number(n)*100)/100).toFixed(2); }
function debtSum(entries){
  return (entries||[]).reduce(function(s,e){ var v = Number(e.amount); return s + (isFinite(v) ? v : 0); }, 0);
}
function normalizeDebtEntries(data){
  var arr = (data && Array.isArray(data.entries)) ? data.entries : [];
  return arr.filter(function(e){ return e && isFinite(Number(e.amount)); }).map(function(e){
    return {
      id: e.id || ('d_'+Date.now()+'_'+Math.random().toString(36).slice(2,8)),
      amount: Number(e.amount),
      what: (e.what||'').toString(),
      createdAt: Number(e.createdAt) || 0
    };
  });
}
function fmtDebtDate(ms){
  if(!ms) return '';
  var d = new Date(ms);
  return pad2(d.getDate())+'.'+pad2(d.getMonth()+1)+'.'+d.getFullYear();
}
function startDebtWatch(){
  stopDebtWatch();
  if(!state.user) return;
  if(state.profile && state.profile.role === 'teacher'){ loadTeacherDebtCount(); return; }
  myDebtUnsub = onSnapshot(doc(db,'debts', state.user.uid), function(snap){
    myDebt.entries = snap.exists() ? normalizeDebtEntries(snap.data()) : [];
    myDebt.total = debtSum(myDebt.entries);
    refreshMyDebtUi();
  }, function(err){ console.error(err); });
}
function stopDebtWatch(){
  if(myDebtUnsub){ myDebtUnsub(); myDebtUnsub = null; }
  myDebt = { entries:[], total:0 };
  teacherDebtCount = 0;
  coinAutoShownSig = '';
  closeCoinBubble();
}
function loadTeacherDebtCount(){
  // Bewusst ohne where()/orderBy(): die Collection ist winzig, und so wird kein
  // Composite Index nötig.
  getDocs(collection(db,'debts')).then(function(snap){
    var n = 0;
    snap.forEach(function(d){ if(debtSum(normalizeDebtEntries(d.data())) > 0) n++; });
    teacherDebtCount = n;
    updateCoinButton();
  }).catch(function(err){ console.error(err); });
}
function updateCoinButton(){
  var btn = document.getElementById('coinBtn');
  if(!btn) return;
  var badge = document.getElementById('coinBadge');
  var isTeacher = state.profile && state.profile.role === 'teacher';
  if(isTeacher){
    btn.hidden = false;
    btn.title = teacherDebtCount ? teacherDebtCount+' mit offenen Schulden' : 'Schulden verwalten';
    if(badge){ badge.hidden = !teacherDebtCount; badge.textContent = teacherDebtCount ? String(teacherDebtCount) : ''; }
  } else {
    btn.hidden = !(myDebt.total > 0);
    btn.title = 'Offene Schulden: '+fmtChf(myDebt.total);
    if(badge){ badge.hidden = true; badge.textContent = ''; }
  }
}
function refreshMyDebtUi(){
  updateCoinButton();
  if(myDebt.total <= 0){ coinAutoShownSig = ''; closeCoinBubble(); return; }
  // Die Sprechblase geht von selbst auf - beim Anmelden und jedes Mal, wenn ein
  // Eintrag dazukommt oder sich ändert. Wer sie wegklickt, hat Ruhe, bis sich
  // wieder etwas an den eigenen Schulden ändert.
  var sig = myDebt.entries.map(function(e){ return e.id+':'+e.amount+':'+e.what; }).join('|');
  if(sig !== coinAutoShownSig){ coinAutoShownSig = sig; openCoinBubble(); return; }
  if(document.getElementById('coinBubble')) openCoinBubble();
}
function onCoinClick(){ coinHover.click(); }
function openCoinBubble(){
  closeCoinBubble();
  var items = myDebt.entries.slice().sort(function(a,b){ return (b.createdAt||0)-(a.createdAt||0); }).map(function(e){
    return '<li><span>'+esc(e.what || 'Ohne Angabe')+'</span><b>'+esc(fmtChf(e.amount))+'</b></li>';
  }).join('');
  document.body.insertAdjacentHTML('beforeend',
    '<div class="coin-bubble" id="coinBubble">'+
      '<button type="button" class="coin-bubble-close" id="coinBubbleClose" aria-label="Schliessen">×</button>'+
      '<h4>Du schuldest Herrn Helfenberger</h4>'+
      '<div class="coin-bubble-total">'+esc(fmtChf(myDebt.total))+'</div>'+
      '<ul class="coin-list">'+items+'</ul>'+
    '</div>');
  document.getElementById('coinBubbleClose').addEventListener('click', closeCoinBubble);
  setTimeout(function(){ document.addEventListener('click', onOutsideCoinClick); }, 0);
}
function closeCoinBubble(){
  var el = document.getElementById('coinBubble');
  if(el) el.remove();
  document.removeEventListener('click', onOutsideCoinClick);
  coinHover.reset();
}
function onOutsideCoinClick(e){
  var el = document.getElementById('coinBubble');
  if(!el) return;
  var btn = document.getElementById('coinBtn');
  if(el.contains(e.target) || (btn && btn.contains(e.target))) return;
  closeCoinBubble();
}

/* --- Verwaltung (nur Lehrperson) --- */
async function openDebtManager(){
  openModal('<h3>Schulden</h3><p>Wird geladen …</p>', 'modal-wide');
  debtHoverActive = true;
  var token = ++debtLoadToken;
  var rows;
  try{
    var roster = await loadStudentRoster();
    var byUid = {};
    var snap = await getDocs(collection(db,'debts'));
    snap.forEach(function(d){ byUid[d.id] = normalizeDebtEntries(d.data()); });
    rows = roster.map(function(s){
      var entries = byUid[s.uid] || [];
      return { stu:s, entries:entries, total:debtSum(entries) };
    });
  }catch(err){
    console.error(err);
    // "permission-denied" heisst hier praktisch immer: die firestore.rules mit
    // dem debts-Block sind noch nicht deployt (firebase deploy --only firestore:rules).
    var denied = err && (err.code === 'permission-denied' || /permission/i.test(err.message||''));
    if(token !== debtLoadToken) return;
    openModal('<h3>Schulden</h3><p>'+(denied
        ? 'Zugriff verweigert – die Firestore-Regeln für „debts“ sind noch nicht deployt. Einmal <b>firebase deploy --only firestore:rules</b> ausführen.'
        : 'Konnte nicht geladen werden.')+'</p>'+
      '<div class="modal-actions"><button class="btn btn-primary btn-sm" id="modalOk" type="button">Ok</button></div>');
    document.getElementById('modalOk').addEventListener('click', closeModal);
    return;
  }
  if(token !== debtLoadToken) return;
  renderDebtOverview(rows);
}
function debtRowHtml(r){
  return '<div class="debt-row">'+
    '<span class="debt-row-name">'+esc(r.stu.displayName||r.stu.username)+'</span>'+
    '<span class="debt-row-sum'+(r.total>0?' has-debt':'')+'">'+esc(fmtChf(r.total))+'</span>'+
    '<button class="btn btn-ghost btn-sm debt-open" type="button" data-uid="'+esc(r.stu.uid)+'">'+(r.total>0?'Bearbeiten':'Eintragen')+'</button>'+
    '</div>';
}
function renderDebtOverview(rows){
  var debtors = rows.filter(function(r){ return r.total > 0; });
  var rest = rows.filter(function(r){ return r.total <= 0; });
  var gesamt = debtors.reduce(function(s,r){ return s + r.total; }, 0);
  openModal(
    '<h3>Schulden</h3>'+
    '<p>'+(debtors.length
      ? esc(debtors.length+' Schüler:in'+(debtors.length===1?'':'nen')+' mit offenen Schulden · total '+fmtChf(gesamt))
      : 'Momentan hat niemand offene Schulden.')+'</p>'+
    '<div class="debt-list">'+
      debtors.map(debtRowHtml).join('')+
      (rest.length ? '<div class="debt-divider">Ohne Schulden</div>'+rest.map(debtRowHtml).join('') : '')+
    '</div>'+
    '<div class="modal-actions"><button class="btn btn-primary btn-sm" id="modalOk" type="button">Fertig</button></div>',
    'modal-wide'
  );
  document.getElementById('modalOk').addEventListener('click', closeModal);
  Array.prototype.forEach.call(document.querySelectorAll('.debt-open'), function(b){
    b.addEventListener('click', function(){
      var uid = b.getAttribute('data-uid');
      var row = rows.filter(function(x){ return x.stu.uid === uid; })[0];
      if(row) renderDebtDetail(row, rows);
    });
  });
}
function renderDebtDetail(row, rows){
  var sorted = row.entries.slice().sort(function(a,b){ return (b.createdAt||0)-(a.createdAt||0); });
  var list = sorted.length ? sorted.map(function(e){
    return '<div class="debt-entry">'+
      '<span class="debt-entry-what">'+esc(e.what||'Ohne Angabe')+
        (e.createdAt ? '<span class="debt-entry-date"> · '+esc(fmtDebtDate(e.createdAt))+'</span>' : '')+'</span>'+
      '<span class="debt-row-sum has-debt">'+esc(fmtChf(e.amount))+'</span>'+
      '<button class="btn btn-ghost btn-sm debt-del" type="button" data-id="'+esc(e.id)+'" title="Beglichen – Eintrag löschen">🗑</button>'+
      '</div>';
  }).join('') : '<div class="empty-state">Keine offenen Schulden.</div>';
  openModal(
    '<h3>'+esc(row.stu.displayName||row.stu.username)+'</h3>'+
    '<p>Offen: <b>'+esc(fmtChf(row.total))+'</b></p>'+
    '<div class="debt-list">'+list+'</div>'+
    '<div class="debt-form">'+
      '<div class="debt-form-amount"><label class="modal-label" for="debtAmount">Betrag (CHF)</label>'+
        '<input type="number" id="debtAmount" step="0.05" min="0" placeholder="2.00"></div>'+
      '<div class="debt-form-what"><label class="modal-label" for="debtWhat">Wofür?</label>'+
        '<input type="text" id="debtWhat" maxlength="80" placeholder="z.B. Schoggibrötli"></div>'+
      '<button class="btn btn-primary btn-sm" id="debtAddBtn" type="button">Hinzufügen</button>'+
    '</div>'+
    '<div class="login-err" id="debtErr"></div>'+
    '<div class="modal-actions">'+
      (row.total>0 ? '<button class="btn btn-danger btn-sm" id="debtClearBtn" type="button">Alles beglichen</button>' : '')+
      '<button class="btn btn-ghost btn-sm" id="debtBackBtn" type="button">Zurück</button>'+
    '</div>',
    'modal-wide'
  );
  var errEl = document.getElementById('debtErr');
  var amountEl = document.getElementById('debtAmount');
  var whatEl = document.getElementById('debtWhat');

  function addEntry(){
    errEl.classList.remove('show');
    var amount = Math.round(parseFloat((amountEl.value||'').replace(',','.'))*100)/100;
    var what = whatEl.value.trim().slice(0,80);
    if(!isFinite(amount) || amount <= 0){
      errEl.textContent = 'Bitte einen Betrag grösser als 0 eingeben.'; errEl.classList.add('show'); amountEl.focus(); return;
    }
    if(!what){
      errEl.textContent = 'Bitte eintragen, wofür.'; errEl.classList.add('show'); whatEl.focus(); return;
    }
    saveDebtEntries(row, rows, row.entries.concat([{
      id: 'd_'+Date.now()+'_'+Math.random().toString(36).slice(2,8),
      amount: amount,
      what: what,
      createdAt: Date.now()
    }]));
  }
  document.getElementById('debtAddBtn').addEventListener('click', addEntry);
  whatEl.addEventListener('keydown', function(e){ if(e.key === 'Enter') addEntry(); });
  amountEl.addEventListener('keydown', function(e){ if(e.key === 'Enter') whatEl.focus(); });
  document.getElementById('debtBackBtn').addEventListener('click', function(){ renderDebtOverview(rows); });
  var clearBtn = document.getElementById('debtClearBtn');
  if(clearBtn){
    clearBtn.addEventListener('click', function(){
      uiConfirm('Alles beglichen?', (row.stu.displayName||row.stu.username)+' hat '+fmtChf(row.total)+' bezahlt. Alle Einträge werden gelöscht.', 'Ja, beglichen', function(){
        saveDebtEntries(row, rows, []);
      }, true);
    });
  }
  Array.prototype.forEach.call(document.querySelectorAll('.debt-del'), function(b){
    b.addEventListener('click', function(){
      var id = b.getAttribute('data-id');
      saveDebtEntries(row, rows, row.entries.filter(function(e){ return e.id !== id; }));
    });
  });
}
function saveDebtEntries(row, rows, entries){
  // Ganzes Dokument ersetzen (kein merge): nur so verschwinden gelöschte
  // Einträge auch wirklich aus dem Array.
  setDoc(doc(db,'debts', row.stu.uid), { entries: entries, updatedAt: serverTimestamp() }).then(function(){
    row.entries = entries;
    row.total = debtSum(entries);
    teacherDebtCount = rows.filter(function(r){ return r.total > 0; }).length;
    updateCoinButton();
    toast('Gespeichert.');
    renderDebtDetail(row, rows);
  }).catch(function(err){
    console.error(err);
    toast('Konnte nicht gespeichert werden.');
  });
}

function csvField(v){
  var s = v==null ? '' : String(v);
  if(/[",\n]/.test(s)) s = '"'+s.replace(/"/g,'""')+'"';
  return s;
}
function downloadTextFile(filename, text, mime){
  var blob = new Blob(['﻿'+text], {type:(mime||'text/plain')+';charset=utf-8'});
  var url = URL.createObjectURL(blob);
  var a = document.createElement('a');
  a.href = url; a.download = filename;
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  setTimeout(function(){ URL.revokeObjectURL(url); }, 1000);
}

/* ===================== DARSTELLUNG (Dark/Light Mode) ===================== */

function currentEffectiveTheme(){
  var explicit = document.documentElement.getAttribute('data-theme');
  if(explicit === 'dark' || explicit === 'light') return explicit;
  return (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches) ? 'dark' : 'light';
}
function toggleTheme(){
  var next = currentEffectiveTheme() === 'dark' ? 'light' : 'dark';
  document.documentElement.setAttribute('data-theme', next);
  try{ localStorage.setItem('hl_theme', next); }catch(e){}
  var btn = document.getElementById('themeToggleBtn');
  if(btn) btn.textContent = next === 'dark' ? '☀️' : '🌙';
}

/* ===================== AUTH ===================== */

function slugName(name){
  return name.trim().toLowerCase()
    .replace(/ä/g,'ae').replace(/ö/g,'oe').replace(/ü/g,'ue').replace(/ß/g,'ss')
    .replace(/[^a-z0-9-]/g,'');
}

async function doLogin(rawName, customPassword){
  var slug = slugName(rawName);
  if(!slug){ throw new Error('leer'); }
  var email = slug + '@' + EMAIL_DOMAIN;
  var password = customPassword ? customPassword : (slug + PASSWORD_SUFFIX);
  await setPersistence(auth, browserLocalPersistence);
  await signInWithEmailAndPassword(auth, email, password);
}

// true, wenn fuer diesen Namen ein eigenes Passwort verlangt wird (Lehrperson).
function needsOwnPassword(rawName){
  return PASSWORD_LOGIN_SLUGS.indexOf(slugName(rawName)) !== -1;
}

function doLogout(){
  stopResourceSync();   // offenen Übungsstand noch sichern, solange die Rechte da sind
  stopTimeTracking();   // dito für die Lernzeit
  Object.values(state.progressUnsubs).forEach(function(fn){ try{fn();}catch(e){} });
  state.progressUnsubs = {};
  clearSubjectWatchers();
  stopTeacherTodoWatcher();
  stopQuizWatcher();
  signOut(auth);
}

var lastAuthedUid = null;
onAuthStateChanged(auth, async function(user){
  // onAuthStateChanged feuert nicht nur bei An-/Abmeldung, sondern z.B. auch
  // nach stillem Token-Refresh erneut für dieselbe Person - ohne diese Sperre
  // hat das mitten in einem offenen Dialog (z.B. Hausaufgabe eintragen) auf
  // "Start" zurückgesetzt und so unbemerkt den bereits getippten Text riskiert.
  if(user && lastAuthedUid && user.uid === lastAuthedUid){ state.user = user; return; }
  state.user = user;
  if(!user){
    lastAuthedUid = null;
    state.profile = null;
    state.route = {name:'login'};
    closePencilBubble();
    stopDebtWatch();
    stopQuizWatcher();
    applyPencilEggVisibility();
    render();
    return;
  }
  try{
    var snap = await getDoc(doc(db, 'students', user.uid));
    if(!snap.exists()){
      toast('Kein Profil gefunden – bitte Lehrperson kontaktieren.');
      await signOut(auth);
      return;
    }
    lastAuthedUid = user.uid;
    state.profile = snap.data();
    state.route = {name:'home'};
    render();
    loadPencilEgg();
    startDebtWatch();
    startQuizWatcher();
    if(state.profile.role === 'teacher'){
      refreshFrageboxBadge();
    } else {
      loadStreak().then(updateStreakButton);
    }
  }catch(err){
    console.error(err);
    toast('Fehler beim Laden des Profils.');
  }
});

/* ===================== ROUTER ===================== */

function goHome(){ state.route = {name:'home'}; render(); }
function goSubject(id, folderId){
  var sameSubject = state.route.name === 'subject' && state.route.subject === id;
  state.route = {name:'subject', subject:id, folderId: folderId || null};
  // Innerhalb desselben Fachs nur den Inhalt neu zeichnen: die Firestore-
  // Listener hängen am ganzen Fach und müssen beim Wechsel in einen
  // Unterordner nicht neu aufgebaut werden.
  if(sameSubject && document.getElementById('resourceList')){ renderFolderContents(); return; }
  render();
}
// Ein "resources"-Dokument mit externalUrl ist kein hochgeladener Übungsinhalt,
// sondern nur ein Link auf ein externes Tool (z.B. Rotstift) — statt in den
// internen Übungs-Viewer zu navigieren, öffnet es in einem neuen Tab.
function goResource(res){
  if(res.externalUrl){ window.open(res.externalUrl, '_blank', 'noopener'); return; }
  state.route = {name:'resource', resource:res}; render();
}

function renderLogin(){
  app.innerHTML =
    '<div class="login-wrap"><div class="login-card">'+
    '<div class="login-logo"><img src="assets/logo.png" alt="" onerror="this.style.display=\'none\'"></div>'+
    '<h1>Helfenberger\'s Library</h1>'+
    '<p class="sub">Gib deinen Namen ein, um loszulegen.</p>'+
    '<div class="login-err" id="loginErr"></div>'+
    '<form id="loginForm">'+
    '<input type="text" id="loginName" placeholder="Dein Name" autocomplete="username" autofocus>'+

    '<button type="submit" class="btn btn-primary">Anmelden</button>'+
    '</form>'+
    '<p class="login-hint">Frag deine Lehrperson, falls dein Login nicht funktioniert.</p>'+
    '</div></div>';

  var form = document.getElementById('loginForm');
  var errEl = document.getElementById('loginErr');

  nameEl.addEventListener('input', function(){

  });

  form.addEventListener('submit', async function(e){
    e.preventDefault();
    errEl.classList.remove('show');
    var name = nameEl.value;

    // Lehrpersonen-Zugang: kein automatisches Passwort senden, sondern danach fragen.
    if(needsOwnPassword(name) && !passVisible()){
      passEl.style.display = '';
      passEl.focus();
      errEl.textContent = 'Für diesen Zugang ist ein Passwort nötig.';
      errEl.classList.add('show');
      return;
    }

    var btn = form.querySelector('button');
    btn.disabled = true;
    try{
      await doLogin(name, passVisible() ? passEl.value : null);
    }catch(err){
      var msg = 'Login fehlgeschlagen. Prüfe die Schreibweise deines Namens.';
      if(err && err.code === 'auth/too-many-requests'){ msg = 'Zu viele Versuche. Bitte warte kurz und versuch es erneut.'; }
      else if(passVisible()){ msg = 'Passwort stimmt nicht.'; }
      errEl.textContent = msg;
      errEl.classList.add('show');
    }finally{
      btn.disabled = false;
    }
  });
}

function progressFor(resourceId){ return state.progressCache[resourceId] || null; }

function watchProgress(resourceId, onChange){
  if(state.progressUnsubs[resourceId]) return;
  var ref_ = doc(db, 'progress', state.user.uid, 'resources', resourceId);
  state.progressUnsubs[resourceId] = onSnapshot(ref_, function(snap){
    var data = snap.exists() ? snap.data() : null;
    var stats = (data && data.stats) || {};
    var total = data && typeof data.total === 'number' ? data.total : null;
    var attempted = 0, correct = 0;
    Object.keys(stats).forEach(function(k){
      if(stats[k] && stats[k].status){ attempted++; if(stats[k].status==='correct') correct++; }
    });
    state.progressCache[resourceId] = {
      attempted:attempted, correct:correct, total:total,
      coveragePct: total ? Math.round(attempted/total*100) : null,
      // "% richtig" muss mit der Formel in den Übungsseiten selbst übereinstimmen
      // (naehrstoffe_training.html / industrialisierung_training.html:
      // richtig / ALLE Aufgaben insgesamt, sinkt nie mehr) — vorher stand hier
      // richtig/bereits-bearbeitet, was bei wenigen Versuchen fälschlich hoch
      // wirkte und nicht zur Anzeige in der Übung selbst passte.
      correctPct: total ? Math.round(correct/total*100) : (attempted ? Math.round(correct/attempted*100) : null)
    };
    if(onChange) onChange(state.progressCache[resourceId]);
  }, function(err){ console.error(err); });
}

}

/* ===================== ORDNER: Datenmodell & Helfer =====================

   Firestore-Collection `folders`:
     folders/{folderId} -> {subject, parentId, name, order, createdAt, createdBy}
       parentId === null  ->  Ordner liegt direkt im Fach
       parentId === '<id>' -> Ordner liegt in diesem Ordner (beliebig tief)

   Eine Übung (resources/{id}) liegt in genau einem Container:
     folderId fehlt/null   ->  direkt im Fach  (so liegen alle Altbestände)
     folderId === '<id>'   ->  in diesem Ordner

   Beide Queries filtern NUR nach `subject` (reine Gleichheitsbedingung, kein
   orderBy) — damit braucht es weiterhin KEINEN Firestore-Composite-Index.
   Sortiert und verschachtelt wird alles im Client; pro Fach sind es nur ein
   paar Dutzend Dokumente.
   ===================================================================== */

var MAX_FOLDER_DEPTH = 6;   // Sicherheitsnetz gegen versehentlich tiefe Bäume

function clearSubjectWatchers(){
  if(state.resourceUnsub){ try{ state.resourceUnsub(); }catch(e){} state.resourceUnsub = null; }
  if(state.folderUnsub){ try{ state.folderUnsub(); }catch(e){} state.folderUnsub = null; }
}

function folderById(id){
  if(!id) return null;
  for(var i=0;i<state.folders.length;i++){ if(state.folders[i].id === id) return state.folders[i]; }
  return null;
}

// Kette vom obersten Ordner bis zum angegebenen (für die Brotkrumen-Navigation).
// Der Zähler bricht ab, falls je ein Zyklus in den Daten landen sollte.
function folderChain(folderId){
  var chain = [], guard = 0, cur = folderById(folderId);
  while(cur && guard++ < 50){ chain.unshift(cur); cur = folderById(cur.parentId); }
  return chain;
}

function foldersIn(parentId){
  var list = state.folders.filter(function(f){ return (f.parentId || null) === (parentId || null); });
  sortByOrder(list, 'name');
  return list;
}

function resourcesIn(folderId){
  var list = state.resources.filter(function(r){ return (r.folderId || null) === (folderId || null); });
  sortResources(list);
  return list;
}

// Alle Nachfahren-Ordner-Ids (inkl. des Ordners selbst) — für die Zählung im
// Ordner-Kärtchen und um zu verhindern, dass ein Ordner in sich selbst wandert.
function subtreeIds(folderId){
  var ids = [folderId], queue = [folderId], guard = 0;
  while(queue.length && guard++ < 500){
    var cur = queue.shift();
    state.folders.forEach(function(f){
      if((f.parentId || null) === cur && ids.indexOf(f.id) < 0){ ids.push(f.id); queue.push(f.id); }
    });
  }
  return ids;
}

function subtreeCounts(folderId){
  var ids = subtreeIds(folderId);
  var res = state.resources.filter(function(r){ return ids.indexOf(r.folderId || null) >= 0; });
  return { folders: ids.length - 1, resources: res.length, hasCurrent: res.some(function(r){ return !!r.current; }) };
}

function folderDepth(folderId){ return folderChain(folderId).length; }

function sortByOrder(list, fallbackField){
  list.sort(function(a,b){
    var oa = typeof a.order === 'number' ? a.order : null;
    var ob = typeof b.order === 'number' ? b.order : null;
    if(oa !== null && ob !== null && oa !== ob) return oa - ob;
    if(oa !== null && ob === null) return -1;
    if(oa === null && ob !== null) return 1;
    return String(a[fallbackField]||'').localeCompare(String(b[fallbackField]||''), 'de');
  });
  return list;
}

var modalEl = document.getElementById('modalOverlay');

function closeModal(){
  modalEl.classList.remove('show'); modalEl.innerHTML = '';
  if(debtHoverActive){ debtHoverActive = false; debtLoadToken++; coinHover.reset(); }
}

function openModal(innerHtml, extraClass){
  modalEl.innerHTML = '<div class="modal'+(extraClass?' '+extraClass:'')+'" role="dialog" aria-modal="true">'+innerHtml+'</div>';
  modalEl.classList.add('show');
  // Klick auf den abgedunkelten Rand schliesst den Dialog - aber nur wenn
  // Mousedown UND Mouseup beide auf dem Rand liegen. Sonst schliesst sich der
  // Dialog fälschlich, sobald man beim Tippen Text in einem Feld markiert und
  // die Maus dabei über den Rand hinaus zieht (Mouseup landet dann auf
  // modalEl statt im Feld) - dabei ging bisher der bereits getippte Text
  // verloren.
  var mouseDownOnOverlay = false;
  modalEl.onmousedown = function(e){ mouseDownOnOverlay = (e.target === modalEl); };
  modalEl.onclick = function(e){
    if(mouseDownOnOverlay && e.target === modalEl) closeModal();
    mouseDownOnOverlay = false;
  };
  document.addEventListener('keydown', modalEscHandler);
}
function modalEscHandler(e){
  if(e.key === 'Escape' && modalEl.classList.contains('show')){
    closeModal();
    document.removeEventListener('keydown', modalEscHandler);
  }
}

/* ===================== SUCHE ===================== */
// Sucht über ALLE Fächer/Ordner hinweg im Titel der Übungen (die `resources`-
// Collection ist laut firestore.rules für jede angemeldete Person lesbar, also
// genügt ein einmaliger ungefilterter getDocs() pro Modal-Öffnung — keine
// Composite-Index-Sorgen, da hier gar nicht per Query gefiltert wird).
function openSearchModal(){
  var isTeacher = state.profile.role === 'teacher';
  openModal(
    '<h3>🔍 Suche</h3>'+
    '<input type="text" id="searchInput" placeholder="Übung suchen …" maxlength="80">'+
    '<div class="search-results" id="searchResults"><div class="empty-state" style="padding:18px;">Wird geladen …</div></div>'
  );
  var input = document.getElementById('searchInput');
  input.focus();

  Promise.all([
    getDocs(collection(db,'resources')),
    getDocs(collection(db,'folders'))
  ]).then(function(res){
    var resultsEl = document.getElementById('searchResults');
    if(!resultsEl) return; // Modal wurde inzwischen geschlossen

    var foldersById = {};
    res[1].docs.forEach(function(d){ foldersById[d.id] = Object.assign({id:d.id}, d.data()); });
    function breadcrumb(r){
      var parts = [], f = r.folderId ? foldersById[r.folderId] : null, guard = 0;
      while(f && guard++ < MAX_FOLDER_DEPTH + 2){ parts.unshift(f.name); f = f.parentId ? foldersById[f.parentId] : null; }
      return parts;
    }
    var allResources = res[0].docs.map(function(d){ return Object.assign({id:d.id}, d.data()); }).filter(function(r){
      var s = subjectById(r.subject);
      return s && (!s.teacherOnly || isTeacher);
    });

    function renderResults(qstr){
      var q = qstr.trim().toLowerCase();
      if(!q){ resultsEl.innerHTML = '<div class="empty-state" style="padding:18px;">Suchbegriff eingeben …</div>'; return; }
      var matches = allResources.filter(function(r){
        return (r.title || r.fileName || '').toLowerCase().indexOf(q) !== -1;
      }).slice(0, 30);
      if(!matches.length){ resultsEl.innerHTML = '<div class="empty-state" style="padding:18px;">Keine Treffer.</div>'; return; }
      resultsEl.innerHTML = matches.map(function(r){
        var s = subjectById(r.subject);
        var path = (s ? s.name : r.subject) + (breadcrumb(r).length ? ' › '+breadcrumb(r).map(esc).join(' › ') : '');
        return '<button type="button" class="search-result-row" data-id="'+esc(r.id)+'">'+
          '<span class="search-result-icon" style="background:'+(s ? s.color : '#999')+';"></span>'+
          '<span class="search-result-body">'+
            '<span class="search-result-title">'+esc(r.title || r.fileName)+'</span>'+
            '<span class="search-result-path">'+path+'</span>'+
          '</span>'+
        '</button>';
      }).join('');
      Array.prototype.forEach.call(resultsEl.querySelectorAll('.search-result-row'), function(btn){
        btn.addEventListener('click', function(){
          var r = allResources.find(function(x){ return x.id === btn.getAttribute('data-id'); });
          if(!r) return;
          closeModal();
          goResource(r);
        });
      });
    }
    resultsEl.innerHTML = '<div class="empty-state" style="padding:18px;">Suchbegriff eingeben …</div>';
    input.addEventListener('input', function(){ renderResults(input.value); });
  }).catch(function(err){
    console.error(err);
    var resultsEl = document.getElementById('searchResults');
    if(resultsEl) resultsEl.innerHTML = '<div class="empty-state" style="padding:18px;">Suche momentan nicht verfügbar.</div>';
  });
}

      '<button class="btn btn-ghost btn-sm" id="modalCancel" type="button">Abbrechen</button>'+
      '<button class="btn btn-primary btn-sm" id="modalOk" type="button">Speichern</button>'+
    '</div>'
  );
  var errEl = document.getElementById('pwErr');
  var oldEl = document.getElementById('pwOld');
  var newEl = document.getElementById('pwNew');

  var okBtn = document.getElementById('modalOk');
  oldEl.focus();

  function showErr(m){ errEl.textContent = m; errEl.classList.add('show'); }

  async function submit(){
    errEl.classList.remove('show');
    var oldPw = oldEl.value;
    var a = newEl.value;
    var b = new2El.value;
    if(!oldPw){ showErr('Bitte das aktuelle Passwort eingeben.'); oldEl.focus(); return; }
    if(a.length < 6){ showErr('Das neue Passwort braucht mindestens 6 Zeichen.'); newEl.focus(); return; }
    if(a !== b){ showErr('Die beiden neuen Passwörter stimmen nicht überein.'); new2El.focus(); return; }
    var user = auth.currentUser;
    if(!user){ showErr('Nicht angemeldet.'); return; }
    okBtn.disabled = true;
    try{
      await reauthenticateWithCredential(user, EmailAuthProvider.credential(user.email, oldPw));
      await updatePassword(user, a);
      closeModal();
      toast('Passwort geändert.');
    }catch(err){
      console.error(err);
      var m = 'Konnte nicht geändert werden. Bitte nochmals versuchen.';
      if(err && (err.code === 'auth/wrong-password' || err.code === 'auth/invalid-credential')){ m = 'Das aktuelle Passwort stimmt nicht.'; }
      else if(err && err.code === 'auth/weak-password'){ m = 'Das neue Passwort ist zu schwach (mind. 6 Zeichen).'; }
      else if(err && err.code === 'auth/too-many-requests'){ m = 'Zu viele Versuche. Bitte kurz warten.'; }
      showErr(m);
    }finally{
      okBtn.disabled = false;
    }
  }

  okBtn.addEventListener('click', submit);
  document.getElementById('modalCancel').addEventListener('click', closeModal);
  [oldEl, newEl, new2El].forEach(function(el){
    el.addEventListener('keydown', function(e){ if(e.key === 'Enter'){ e.preventDefault(); submit(); } });
  });
}

// Zielauswahl für "Verschieben": zeigt die Fach-Hauptebene und darunter den
// eingerückten Ordnerbaum des GLEICHEN Fachs. `blockedIds` schliesst Ordner aus
// (ein Ordner darf nie in sich selbst oder einen seiner Unterordner wandern),
// `currentId` markiert den jetzigen Ort und ist nicht anklickbar.
function uiPickFolder(title, description, currentId, blockedIds, onPick){
  var rows = '';
  function row(id, label, depth, disabled, reason){
    rows += '<button class="pick-item" type="button" data-target="'+(id===null?'__root__':esc(id))+'"'+(disabled?' disabled':'')+
      ' style="padding-left:'+(12 + depth*18)+'px">'+
      '<svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/></svg>'+
      '<span>'+esc(label)+'</span>'+
      (reason ? '<span class="pick-here">'+esc(reason)+'</span>' : '')+
      '</button>';
  }
  row(null, 'Fach-Hauptebene', 0, (currentId||null) === null, (currentId||null) === null ? 'hier' : '');
  (function walk(parentId, depth){
    foldersIn(parentId).forEach(function(f){
      var blocked = blockedIds.indexOf(f.id) >= 0;
      var isHere = f.id === currentId;
      row(f.id, f.name, depth + 1, blocked || isHere, isHere ? 'hier' : '');
      if(depth + 1 < MAX_FOLDER_DEPTH) walk(f.id, depth + 1);
    });
  })(null, 0);

  openModal(
    '<h3>'+esc(title)+'</h3>'+
    (description ? '<p>'+esc(description)+'</p>' : '')+
    '<div class="pick-list">'+rows+'</div>'+
    '<div class="modal-actions"><button class="btn btn-ghost btn-sm" id="modalCancel" type="button">Abbrechen</button></div>'
  );
  document.getElementById('modalCancel').addEventListener('click', closeModal);
  Array.prototype.forEach.call(modalEl.querySelectorAll('.pick-item'), function(btn){
    btn.addEventListener('click', function(){
      var t = btn.getAttribute('data-target');
      closeModal();
      onPick(t === '__root__' ? null : t);
    });
  });
}

/* ===================== TO-DO-LISTE DER LEHRPERSON =====================
   Erreichbar über den Knopf oben im Reiter (zwischen Ferien-Countdown und
   "Lehrperson"), darum auf jeder Seite - der Listener läuft ab dem Anmelden
   durch und wird beim Seitenwechsel NICHT abgeräumt.
   Eigene Firestore-Collection `teacherTodos/{id}`:
     {text, description, subject (''=kein Fach), dueDate ("YYYY-MM-DD" oder ''), done,
      doneAt (ms, null solange offen), createdAt (ms), createdBy}
   Nur für die Lehrperson lesbar/schreibbar (siehe firestore.rules) - das sind
   private Notizen, die die Klasse nie sehen soll. Bewusst die ganze (kleine)
   Collection ohne where()/orderBy() laden und client-seitig sortieren, damit
   kein Composite Index nötig wird. Zeitstempel als Millisekunden-Zahl statt
   serverTimestamp(), weil serverTimestamp() im lokalen Snapshot kurzzeitig
   null ist - das würde Sortierung und Aufräumen durcheinanderbringen.
   ===================================================================== */

var TODO_KEEP_DAYS = 28;   // erledigte To-dos werden 4 Wochen nach dem Abhaken gelöscht
var todoItems = [];
var todoPruning = false;

function todoSubjectOptionsHtml(selected){
  var opts = ['<option value="">— Kein Fach —</option>'];
  SUBJECTS.filter(function(s){ return !s.teacherOnly; }).forEach(function(s){
    opts.push('<option value="'+esc(s.id)+'"'+(s.id===selected?' selected':'')+'>'+esc(s.name)+'</option>');
  });
  return opts.join('');
}

function todoPanelHtml(){
  var h = '<div class="todo-popover-head"><h3>✅ Meine To-dos</h3>';
  h += '<button class="todo-popover-close" id="todoClose" type="button" aria-label="Schliessen">×</button></div>';
  h += '<div class="todo-add">';
  h += '<input type="text" id="todoText" maxlength="200" placeholder="Was ist zu tun? (z.B. Prüfungen korrigieren)">';
  h += '<select id="todoSubject" title="Fach (optional)">'+todoSubjectOptionsHtml('')+'</select>';
  h += '<input type="date" id="todoDate" title="Bis wann (optional)">';
  h += '<button class="btn btn-primary" id="todoAddBtn" type="button">+ Hinzufügen</button>';
  h += '<textarea id="todoDesc" rows="2" maxlength="1000" placeholder="Genauere Beschreibung (optional) — z.B. welche Seiten, wer betroffen ist, woran du denken musst …"></textarea>';
  h += '</div>';
  h += '<div class="todo-open-scroll" id="todoOpen"><div class="todo-empty">Wird geladen …</div></div>';
  h += '<details class="todo-done-details" id="todoDoneBox"><summary id="todoDoneSummary">Gemacht</summary><div id="todoDone"></div>';
  h += '<div class="todo-hint">Abgehakte To-dos verschwinden automatisch 4 Wochen nach dem Abhaken.</div>';
  h += '</details>';
  return h;
}

function todoItemHtml(t){
  var s = t.subject ? subjectById(t.subject) : null;
  var style = s ? ' style="--todo-c:'+s.color+';--todo-soft:'+s.soft+';"' : '';
  var h = '<div class="todo-item'+(t.done?' todo-item-done':'')+'"'+style+'>';
  h += '<button class="todo-check'+(t.done?' on':'')+'" id="tchk-'+esc(t.id)+'" type="button" title="'+(t.done?'Wieder öffnen':'Als erledigt abhaken')+'">✓</button>';
  h += '<div class="todo-body">';
  h += '<div class="todo-text">'+esc(t.text)+'</div>';
  if(t.description) h += '<div class="todo-desc">'+esc(t.description)+'</div>';
  var meta = '';
  if(s) meta += '<span class="todo-tag">'+esc(s.name)+'</span>';
  if(t.dueDate){
    var soon = !t.done && t.dueDate <= todayStr();
    meta += '<span class="todo-due'+(soon?' soon':'')+'">📅 bis '+esc(weekdayLabel(t.dueDate))+', '+esc(fmtDueDate(t.dueDate))+(soon?' — fällig!':'')+'</span>';
  }
  if(t.done && t.doneAt) meta += '<span>✔️ erledigt am '+esc(fmtDueDate(localDateStr(new Date(t.doneAt))))+'</span>';
  if(meta) h += '<div class="todo-meta">'+meta+'</div>';
  h += '</div>';
  h += '<div class="todo-actions">';
  h += '<button class="btn btn-ghost btn-sm" id="tedit-'+esc(t.id)+'" type="button" title="Bearbeiten">✏️</button>';
  h += '<button class="btn btn-danger btn-sm" id="tdel-'+esc(t.id)+'" type="button" title="Löschen">🗑</button>';
  h += '</div></div>';
  return h;
}

function renderTodoLists(){
  updateTodoButton();
  var openEl = document.getElementById('todoOpen');
  var doneEl = document.getElementById('todoDone');
  if(!openEl || !doneEl) return; // Panel gerade zu - der Knopf oben reicht

  var open = todoItems.filter(function(t){ return !t.done; });
  var done = todoItems.filter(function(t){ return t.done; });
  // Offen: zuerst was ein Datum hat (das nächste zuoberst), danach der Rest
  // nach Erstellzeit; Erledigt: zuletzt Abgehaktes zuoberst.
  open.sort(function(a,b){
    var ad = a.dueDate || '9999-12-31', bd = b.dueDate || '9999-12-31';
    if(ad !== bd) return ad.localeCompare(bd);
    return (a.createdAt||0) - (b.createdAt||0);
  });
  done.sort(function(a,b){ return (b.doneAt||0) - (a.doneAt||0); });

  openEl.innerHTML = open.length
    ? '<div class="todo-list">'+open.map(todoItemHtml).join('')+'</div>'
    : '<div class="todo-empty">Nichts offen — alles erledigt! 🎉</div>';
  doneEl.innerHTML = done.length
    ? '<div class="todo-list">'+done.map(todoItemHtml).join('')+'</div>'
    : '<div class="todo-empty">Noch nichts abgehakt.</div>';

  var summary = document.getElementById('todoDoneSummary');
  if(summary) summary.textContent = 'Gemacht ('+done.length+')';
  updateTodoButton();

  todoItems.forEach(function(t){
    var chk = document.getElementById('tchk-'+t.id);
    if(chk) chk.addEventListener('click', function(){ toggleTodo(t); });
    var edit = document.getElementById('tedit-'+t.id);
    if(edit) edit.addEventListener('click', function(){ openTodoEditor(t); });
    var del = document.getElementById('tdel-'+t.id);
    if(del) del.addEventListener('click', function(){
      uiConfirm('To-do löschen?', t.text, 'Löschen', function(){
        deleteDoc(doc(db,'teacherTodos', t.id))
          .then(function(){ toast('Gelöscht.'); })
          .catch(function(err){ console.error(err); toast('Konnte nicht gelöscht werden.'); });
      }, true);
    });
  });
}

// Räumt erledigte To-dos auf, die länger als TODO_KEEP_DAYS abgehakt sind.
// Läuft bei jedem Snapshot; das Löschen löst einen neuen Snapshot aus, bei dem
// dann nichts Altes mehr übrig ist — die Schleife endet also von selbst.
function pruneOldDoneTodos(){
  if(todoPruning) return;
  var cutoff = Date.now() - TODO_KEEP_DAYS*86400000;
  var old = todoItems.filter(function(t){ return t.done && t.doneAt && t.doneAt < cutoff; });
  if(!old.length) return;
  todoPruning = true;
  var batch = writeBatch(db);
  old.forEach(function(t){ batch.delete(doc(db,'teacherTodos', t.id)); });
  batch.commit()
    .catch(function(err){ console.error(err); })
    .finally(function(){ todoPruning = false; });
}

var todoUnsub = null;
var todoLoadFailed = false;

// Läuft ab dem Anmelden der Lehrperson durch (nicht pro Seite), damit der
// Zähler im Reiter überall stimmt, ohne bei jedem Seitenwechsel neu zu laden.
function ensureTeacherTodoWatcher(){
  if(todoUnsub) return;
  todoUnsub = onSnapshot(collection(db,'teacherTodos'), function(snap){
    todoItems = [];
    snap.forEach(function(d){ todoItems.push(Object.assign({id:d.id}, d.data())); });
    todoLoadFailed = false;
    renderTodoLists();
    pruneOldDoneTodos();
  }, function(err){
    console.error(err);
    todoLoadFailed = true;
    var openEl = document.getElementById('todoOpen');
    if(openEl) openEl.innerHTML = '<div class="todo-empty">To-dos konnten nicht geladen werden.</div>';
  });
}

function stopTeacherTodoWatcher(){
  if(todoUnsub){ try{ todoUnsub(); }catch(e){} todoUnsub = null; }
  todoItems = [];
}

function openTodoCount(){ return todoItems.filter(function(t){ return !t.done; }).length; }
function todoHasDue(){
  var today = todayStr();
  return todoItems.some(function(t){ return !t.done && t.dueDate && t.dueDate <= today; });
}

function updateTodoButton(){
  var badge = document.getElementById('todoBadge');
  if(!badge) return;
  var n = openTodoCount();
  badge.textContent = String(n);
  badge.classList.toggle('due', todoHasDue());
  var btn = document.getElementById('todoBtn');
  if(btn) btn.title = n ? n+' offene To-do'+(n===1?'':'s') : 'Keine offenen To-dos';
}

var todoHover = makeHoverPanel({
  trigger: function(){ return document.getElementById('todoBtn'); },
  isOpen: function(){
    var pop = document.getElementById('todoPopover');
    return !!pop && !pop.hidden;
  },
  isOver: function(x, y){
    if(pointInEl(x, y, document.getElementById('todoBtn'), 14)) return true;
    if(pointInEl(x, y, document.getElementById('todoPopover'), 14)) return true;
    return false;
  },
  open: openTodoPopover,
  close: closeTodoPopover,
  // Solange der Bearbeiten-Dialog darüber liegt, bleibt das Panel stehen.
  keepOpen: function(){ return modalEl.classList.contains('show'); }
});

function toggleTodoPopover(){ todoHover.click(); }

// byClick: nur dann ins Eingabefeld springen - beim blossen Drüberfahren wäre
// ein Fokuswechsel störend.
function openTodoPopover(byClick){
  var pop = document.getElementById('todoPopover');
  if(!pop) return;
  if(pop.hidden){
    pop.innerHTML = todoPanelHtml();
    pop.hidden = false;
    document.getElementById('todoClose').addEventListener('click', closeTodoPopover);
    wireTodoPanel();
    renderTodoLists();
    if(todoLoadFailed){
      var openEl = document.getElementById('todoOpen');
      if(openEl) openEl.innerHTML = '<div class="todo-empty">To-dos konnten nicht geladen werden.</div>';
    }
  }
  if(byClick){
    var textEl = document.getElementById('todoText');
    if(textEl) textEl.focus();
  }
}

function closeTodoPopover(){
  todoHover.reset();
  var pop = document.getElementById('todoPopover');
  if(!pop || pop.hidden) return;
  pop.hidden = true;
  pop.innerHTML = '';
}

// Klick daneben schliesst - aber nicht, wenn gerade der Bearbeiten-Dialog
// offen ist (der liegt über dem Panel und wäre sonst ein "Aussenklick").
function onOutsideTodoClick(e){
  var pop = document.getElementById('todoPopover');
  if(!pop || pop.hidden) return;
  if(pop.contains(e.target)) return;
  if(e.target.closest && e.target.closest('#todoBtn, .modal-overlay')) return;
  closeTodoPopover();
}

// Einmalig registriert (nicht pro renderChrome), sonst würden sich die
// Listener bei jedem Seitenwechsel stapeln.
document.addEventListener('click', onOutsideTodoClick);
document.addEventListener('keydown', function(e){
  if(e.key === 'Escape' && !modalEl.classList.contains('show')) closeTodoPopover();
});

function wireTodoPanel(){
  var textEl = document.getElementById('todoText');
  var subjectEl = document.getElementById('todoSubject');
  var dateEl = document.getElementById('todoDate');
  var descEl = document.getElementById('todoDesc');
  var addBtn = document.getElementById('todoAddBtn');
  if(!textEl || !addBtn) return;

  function add(){
    var text = textEl.value.trim();
    if(!text){ textEl.focus(); return; }
    var data = {
      text: text.slice(0,200),
      description: descEl.value.trim().slice(0,1000),
      subject: subjectEl.value || '',
      dueDate: dateEl.value || '',
      done: false,
      doneAt: null,
      createdAt: Date.now(),
      createdBy: state.user.uid
    };
    textEl.value = ''; dateEl.value = ''; descEl.value = ''; textEl.focus();
    setDoc(doc(db,'teacherTodos', 'todo_'+Date.now()+'_'+Math.random().toString(36).slice(2,8)), data)
      .catch(function(err){ console.error(err); toast('Konnte nicht gespeichert werden.'); });
  }
  addBtn.addEventListener('click', add);
  textEl.addEventListener('keydown', function(e){ if(e.key === 'Enter') add(); });
}

function toggleTodo(t){
  var nowDone = !t.done;
  updateDoc(doc(db,'teacherTodos', t.id), {done:nowDone, doneAt: nowDone ? Date.now() : null})
    .catch(function(err){ console.error(err); toast('Konnte nicht geändert werden.'); });
}

function openTodoEditor(t){
  openModal(
    '<h3>To-do bearbeiten</h3>'+
    '<label class="modal-label">Aufgabe</label><input type="text" id="todoEditText" maxlength="200" value="'+esc(t.text)+'">'+
    '<label class="modal-label">Beschreibung (optional)</label><textarea id="todoEditDesc" rows="4" maxlength="1000" placeholder="Genauere Beschreibung …">'+esc(t.description||'')+'</textarea>'+
    '<label class="modal-label">Fach (optional)</label><select id="todoEditSubject">'+todoSubjectOptionsHtml(t.subject||'')+'</select>'+
    '<label class="modal-label">Bis wann (optional)</label><input type="date" id="todoEditDate" value="'+esc(t.dueDate||'')+'">'+
    '<div class="modal-actions">'+
      '<button class="btn btn-ghost btn-sm" id="modalCancel" type="button">Abbrechen</button>'+
      '<button class="btn btn-primary btn-sm" id="modalOk" type="button">Speichern</button>'+
    '</div>'
  );
  var textEl = document.getElementById('todoEditText');
  textEl.focus(); textEl.select();
  document.getElementById('modalCancel').addEventListener('click', closeModal);
  document.getElementById('modalOk').addEventListener('click', function(){
    var text = textEl.value.trim();
    if(!text){ textEl.focus(); return; }
    var updates = {
      text: text.slice(0,200),
      description: document.getElementById('todoEditDesc').value.trim().slice(0,1000),
      subject: document.getElementById('todoEditSubject').value || '',
      dueDate: document.getElementById('todoEditDate').value || ''
    };
    closeModal();
    updateDoc(doc(db,'teacherTodos', t.id), updates)
      .then(function(){ toast('Gespeichert.'); })
      .catch(function(err){ console.error(err); toast('Konnte nicht gespeichert werden.'); });
  });
}

/* ===================== RENDER: FACH / ORDNER ===================== */

function renderSubject(subjectId, folderId){
  clearOverviewWatchers();
  clearSubjectWatchers();
  unwatchAllProgress();
  state.folders = [];
  state.resources = [];

  var s = subjectById(subjectId);
  var isTeacher = state.profile.role === 'teacher';

  var html = '';
  html += '<div class="back-row"><button class="btn btn-ghost btn-sm" id="backBtn">&larr; Alle Fächer</button></div>';
  html += '<div class="subject-head"><div class="subject-visual" style="background:'+s.soft+';">'+s.icon+'</div><h2>'+s.name+'</h2></div>';
  html += '<div class="crumbs" id="crumbs"></div>';

  if(isTeacher && subjectId==='deutsch'){
    html += '<div class="back-row"><button class="btn btn-ghost btn-sm" id="diktatAnalyseBtn" type="button">📊 Fehleranalyse Diktate</button></div>';
  }

  if(isTeacher){
    html += '<div class="dropzone" id="dropzone">';
    html += '<div class="dz-title">Neue Übungsseite hinzufügen</div>';
    html += '<div>HTML-Datei hierher ziehen oder <label for="fileInput" style="color:var(--brand);text-decoration:underline;cursor:pointer;">Datei auswählen</label></div>';
    html += '<div id="dzTarget" style="font-size:12.5px;margin-top:8px;"></div>';
    html += '<input type="file" id="fileInput" accept=".html,text/html">';
    html += '<div class="upload-progress" id="uploadProgress"></div>';
    html += '</div>';
    html += '<div class="back-row"><button class="btn btn-ghost btn-sm" id="newFolderBtn" type="button">+ Neuer Ordner</button></div>';
  }

  html += '<div id="resourceList" class="resource-list"><div class="empty-state">Wird geladen …</div></div>';

  renderChrome(html);
  document.getElementById('backBtn').addEventListener('click', goHome);
  var diktatAnalyseBtn = document.getElementById('diktatAnalyseBtn');
  if(diktatAnalyseBtn){
    diktatAnalyseBtn.addEventListener('click', function(){
      state.route = {name:'diktatauswertung'};
      render();
    });
  }
  if(isTeacher){
    wireDropzone(subjectId);
    document.getElementById('newFolderBtn').addEventListener('click', function(){
      var here = state.route.folderId || null;
      if(folderDepth(here) >= MAX_FOLDER_DEPTH){
        uiInfo('Zu tief verschachtelt', 'Mehr als '+MAX_FOLDER_DEPTH+' Ordner-Ebenen sind nicht vorgesehen — sonst wird das Zurechtfinden für die Klasse mühsam.');
        return;
      }
      uiPrompt('Neuer Ordner', 'Wie soll der Ordner heissen? (z.B. «Diktate»)', '', 'Anlegen', function(name){
        createFolder(subjectId, here, name);
      });
    });
  }

  var loaded = {res:false, fold:false};
  function maybeRender(){ if(loaded.res && loaded.fold) renderFolderContents(); }

  var qf = query(collection(db,'folders'), where('subject','==',subjectId));
  state.folderUnsub = onSnapshot(qf, function(snap){
    state.folders = [];
    snap.forEach(function(d){ state.folders.push(Object.assign({id:d.id}, d.data())); });
    loaded.fold = true;
    maybeRender();
  }, function(err){ console.error(err); loaded.fold = true; maybeRender(); });

  var qr = query(collection(db,'resources'), where('subject','==',subjectId));
  state.resourceUnsub = onSnapshot(qr, function(snap){
    state.resources = [];
    snap.forEach(function(d){ state.resources.push(Object.assign({id:d.id}, d.data())); });
    loaded.res = true;
    maybeRender();
  }, function(err){
    console.error(err);
    var listEl = document.getElementById('resourceList');
    if(listEl) listEl.innerHTML = '<div class="empty-state">Übungen konnten nicht geladen werden.</div>';
  });
}

// Zeichnet Brotkrumen + den Inhalt des gerade offenen Containers neu. Wird bei
// jeder Snapshot-Änderung und nach jeder Navigation in einen Unterordner
// aufgerufen — die Firestore-Listener bleiben dabei bestehen (sie hängen am
// ganzen Fach, nicht am einzelnen Ordner).
function renderFolderContents(){
  var listEl = document.getElementById('resourceList');
  if(!listEl) return;
  var subjectId = state.route.subject;
  var here = state.route.folderId || null;
  var isTeacher = state.profile.role === 'teacher';
  var s = subjectById(subjectId);

  // Ordner könnte inzwischen (z.B. auf einem anderen Gerät) gelöscht worden sein
  if(here && !folderById(here)){ state.route.folderId = null; here = null; }

  var chain = folderChain(here);
  var crumbHtml = '<button type="button" data-crumb="__root__">'+esc(s.name)+'</button>';
  chain.forEach(function(f, i){
    crumbHtml += '<span class="sep">/</span>';
    crumbHtml += (i === chain.length-1)
      ? '<span class="here">'+esc(f.name)+'</span>'
      : '<button type="button" data-crumb="'+esc(f.id)+'">'+esc(f.name)+'</button>';
  });
  var crumbEl = document.getElementById('crumbs');
  if(crumbEl){
    // Auf der Fach-Hauptebene wäre die Brotkrume nur eine Wiederholung der
    // Überschrift — erst ab dem ersten Ordner ist sie eine echte Navigation.
    crumbEl.style.display = chain.length ? 'flex' : 'none';
    crumbEl.innerHTML = crumbHtml;
    Array.prototype.forEach.call(crumbEl.querySelectorAll('button'), function(b){
      b.addEventListener('click', function(){
        var t = b.getAttribute('data-crumb');
        goSubject(subjectId, t === '__root__' ? null : t);
      });
    });
  }
  var dzTarget = document.getElementById('dzTarget');
  if(dzTarget){
    dzTarget.innerHTML = here
      ? 'Die Datei landet im Ordner <b>'+esc(folderById(here).name)+'</b>.'
      : 'Die Datei landet direkt im Fach <b>'+esc(s.name)+'</b>.';
  }

  var folders = foldersIn(here);
  var resources = resourcesIn(here);

  if(!folders.length && !resources.length){
    listEl.innerHTML = '<div class="empty-state">'+
      (here ? 'Dieser Ordner ist noch leer.' : 'Für dieses Fach gibt es noch keine Übung.')+
      (isTeacher ? ' Lade oben eine Datei hoch oder lege einen Ordner an.' : ' Schau später wieder vorbei!')+
      '</div>';
    return;
  }

  var html = '';
  if(folders.length){
    html += '<div class="section-label">Ordner</div>';
    html += folders.map(function(f, i){ return folderCardHtml(f, i, folders.length, isTeacher); }).join('');
  }
  if(resources.length){
    if(folders.length) html += '<div class="section-label">Übungen</div>';
    html += resources.map(function(r, i){ return resourceCardHtml(r, i, resources.length, isTeacher); }).join('');
  }
  listEl.innerHTML = html;

  folders.forEach(function(f, i){
    document.getElementById('fopen-'+f.id).addEventListener('click', function(){ goSubject(subjectId, f.id); });
    if(!isTeacher) return;
    document.getElementById('fup-'+f.id).addEventListener('click', function(){ reorderFolder(folders, i, -1); });
    document.getElementById('fdown-'+f.id).addEventListener('click', function(){ reorderFolder(folders, i, 1); });
    document.getElementById('frename-'+f.id).addEventListener('click', function(){
      uiPrompt('Ordner umbenennen', null, f.name, 'Speichern', function(name){ renameFolder(f, name); });
    });
    document.getElementById('fmove-'+f.id).addEventListener('click', function(){ askMoveFolder(f); });
    document.getElementById('fdel-'+f.id).addEventListener('click', function(){ askDeleteFolder(f); });
  });

  resources.forEach(function(r, i){
    watchProgress(r.id, function(p){ updateResourceBar(r.id, p); });
    var openBtn = document.getElementById('open-'+r.id);
    if(openBtn) openBtn.addEventListener('click', function(){ goResource(r); });
    if(!isTeacher) return;
    document.getElementById('del-'+r.id).addEventListener('click', function(){ askDeleteResource(r); });
    document.getElementById('up-'+r.id).addEventListener('click', function(){ moveResource(resources, i, -1); });
    document.getElementById('down-'+r.id).addEventListener('click', function(){ moveResource(resources, i, 1); });
    var curBtn = document.getElementById('cur-'+r.id);
    if(curBtn) curBtn.addEventListener('click', function(){ toggleCurrent(resources, r); });
    document.getElementById('rrename-'+r.id).addEventListener('click', function(){
      uiPrompt('Übung umbenennen', null, r.title || r.fileName, 'Speichern', function(title){ renameResource(r, title); });
    });
    document.getElementById('mv-'+r.id).addEventListener('click', function(){ askMoveResource(r); });
  });
}
