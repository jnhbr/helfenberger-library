  html += '<select class="sp-select" id="spSavedSel">';
  if(!sp.saved.length){ html += '<option value="">– noch keine –</option>'; }
  else { html += sp.saved.map(function(p){ return '<option value="'+esc(p.id)+'">'+esc(p.name)+'</option>'; }).join(''); }
  html += '</select>';
  html += '<button class="btn btn-ghost btn-sm" id="spLoadPlan" type="button"'+(sp.saved.length?'':' disabled')+'>Laden</button>';
  html += '<button class="btn btn-ghost btn-sm" id="spSavePlan" type="button">💾 Sichern</button>';
  html += '<button class="btn btn-danger btn-sm" id="spDelPlan" type="button"'+(sp.saved.length?'':' disabled')+'>Löschen</button>';
  html += '</span>';
  html += '<span class="sp-tool-group">';
  html += '<button class="btn btn-ghost btn-sm" id="spMirror" type="button">'+(sp.doc.mirror?'🔁 Sicht: Klasse':'🔁 Sicht: Lehrer')+'</button>';
  html += '<button class="btn btn-ghost btn-sm" id="spFs" type="button">'+(spIsFs()?'✕ Vollbild beenden':'⛶ Vollbild')+'</button>';
  html += '<button class="btn btn-ghost btn-sm" id="spPrint" type="button">🖨 Drucken</button>';
  html += '</span>';
  html += '</div>';
  html += '<button class="sp-fs-exit" id="spFsExit" type="button">✕ Vollbild beenden</button>';

  html += '<div class="sp-layout">';

  /* Raum */
  html += '<div class="sp-room-outer" id="spRoomOuter">';
  // Fenstersims und Tür kippen im gespiegelten Blick auf die andere Seite mit,
  // sonst stimmte auf dem Ausdruck links/rechts nicht mehr.
  var mir = !!sp.doc.mirror;
  // Die beiden Wörter stehen ausserhalb der Wand, im Polster des Wrappers:
  // "Fenster" links neben dem Fenstersims, "Tür" rechts neben dem Türstrich.
  var doorBottomPct = DOOR_GAP/ROOM_D*100, doorHeightPct = DOOR_W/ROOM_D*100;
  html += '<div class="sp-room-wrap">';
  html += '<span class="sp-edge-label sp-edge-window" style="'+(mir?'right':'left')+':0;">Fenster</span>';
  html += '<span class="sp-edge-label" style="'+(mir?'left':'right')+':0;bottom:'+doorBottomPct+'%;height:'+doorHeightPct+'%;'
        + (mir?'transform:rotate(180deg);':'')+'">Tür</span>';
  html += '<div class="sp-room" id="spRoom">';
  html += '<div class="sp-board">Wandtafel</div>';
  html += '<div class="sp-sill'+(mir?' sp-sill-mirror':'')+'" style="'+(mir?'right':'left')+':0;width:'+(SILL_W/ROOM_W*100)+'%;">'
        + '<span class="sp-sill-label">Fenstersims</span></div>';
  html += '<div class="sp-door" style="'+(mir?'left':'right')+':0;width:'+(DOOR_D/ROOM_W*100)+'%;'
        + 'bottom:'+doorBottomPct+'%;height:'+doorHeightPct+'%;"></div>';
  html += '<div class="sp-room-size">9 m × 8 m</div>';
  sp.doc.tables.forEach(function(t){
    var kind = spKind(t);
    var size = spTableSize(t);
    var x = sp.doc.mirror ? (ROOM_W - t.x) : t.x;
    var rot = sp.doc.mirror ? (360 - (t.rot||0)) % 360 : (t.rot||0);
    var sel = sp.selected === t.id;
    html += '<div class="sp-table sp-kind-'+kind+(sel?' sp-table-sel':'')+'" data-table="'+t.id+'" style="left:'+(x/ROOM_W*100)+'%;top:'+(t.y/ROOM_D*100)+'%;width:'+(size.w/ROOM_W*100)+'%;height:'+(size.h/ROOM_D*100)+'%;transform:translate(-50%,-50%) rotate('+rot+'deg);">';
    if(kind === 'tisch'){
      [0,1].forEach(function(slot){
        // Beim gespiegelten Blick tauschen die beiden Plätze die Seite, damit
        // links/rechts auch auf dem Ausdruck stimmt.
        var shown = sp.doc.mirror ? (1-slot) : slot;
        var uid = spSeatedUid(spSeatId(t.id, shown));
        var g = uid ? spGender(uid) : '';
        html += '<button class="sp-seat'+(uid?' sp-seat-on':'')+(g?' sp-g-'+g:'')+'" type="button" title="'+esc(uid?spFullName(uid):'Freier Platz')+'" data-seat="'+spSeatId(t.id, shown)+'">';
        // Ein um 180 Grad gedrehter Tisch stünde sonst mit kopfstehenden Namen da.
        html += '<span'+(rot===180?' style="transform:rotate(180deg);"':'')+'>'+(uid ? esc(spSeatLabel(uid)) : '')+'</span>';
        html += '</button>';
      });
    } else {
      html += '<span class="sp-table-label"'+(rot===180?' style="transform:rotate(180deg);"':'')+'>'+(kind === 'pult' ? 'Pult' : '')+'</span>';
    }
    if(sel){
      html += '<button class="sp-mini sp-mini-rot" type="button" data-rot="'+t.id+'" title="Drehen">↻</button>';
      html += '<button class="sp-mini sp-mini-del" type="button" data-del="'+t.id+'" title="Entfernen">✕</button>';
    }
    html += '</div>';
  });
  html += '</div></div></div>';

  /* Seitenliste */
  html += '<div class="sp-side">';
  html += '<div class="sp-side-head">Klasse <span>'+spActiveStudents().length+' anwesend</span></div>';
  html += '<div class="sp-hint">'+(sp.picked
      ? 'Ausgewählt: <b>'+esc(spFullName(sp.picked))+'</b> — jetzt auf einen Platz tippen.'
      : 'Kind antippen, dann einen Platz antippen. Ein besetzter Platz gibt das Kind wieder frei. Möbel lassen sich frei verschieben.')+'</div>';
  html += '<div class="sp-people">';
  sp.roster.forEach(function(s){
    var isSeated = !!seated[s.uid];
    var abs = spIsAbsent(s.uid);
    var g = spGender(s.uid);
    html += '<div class="sp-person'+(abs?' sp-person-abs':'')+(isSeated?' sp-person-seated':'')+(sp.picked===s.uid?' sp-person-picked':'')+'">';
    html += '<button class="sp-person-name" type="button" data-pick="'+s.uid+'"'+(abs?' disabled':'')+'>'+esc(s.displayName)+'</button>';
    html += '<div class="sp-person-tags">';
    html += '<button class="sp-tag'+(g==='m'?' sp-tag-on sp-g-m':'')+'" type="button" data-g="m" data-uid="'+s.uid+'" title="Junge">J</button>';
    html += '<button class="sp-tag'+(g==='w'?' sp-tag-on sp-g-w':'')+'" type="button" data-g="w" data-uid="'+s.uid+'" title="Mädchen">M</button>';
    html += '<button class="sp-tag'+(abs?' sp-tag-abs':'')+'" type="button" data-abs="'+s.uid+'" title="Abwesend / nicht einplanen">'+(abs?'abw.':'da')+'</button>';
    html += '</div></div>';
  });
  html += '</div>';
  html += '<div class="sp-side-foot">'+free.length+' ohne Platz · '+spAllSeatIds().length+' Plätze</div>';
  html += '</div>';

  html += '</div>';
  host.innerHTML = html;
  wireSitzplan();
}

/* ---------- Platz-Klick ---------- */
function spHandleSeatClick(seatId){
  var here = spSeatedUid(seatId);
  if(sp.picked){
    var from = spSeatOf(sp.picked);
    if(from) delete sp.doc.seats[from];
    if(here && from) sp.doc.seats[from] = here;     // Platztausch
    sp.doc.seats[seatId] = sp.picked;
    sp.picked = null;
  } else if(here){
    delete sp.doc.seats[seatId];
    sp.picked = here;
  } else {
    return false;
  }
  spSave(); paintSitzplan();
  return true;
}

function wireSitzplan(){
  var host = document.getElementById('spHost');
  if(!host) return;

  Array.prototype.forEach.call(host.querySelectorAll('[data-add-kind]'), function(b){
    b.addEventListener('click', function(){
      var kind = b.getAttribute('data-add-kind');
      var n = sp.doc.tables.length;
      var pos = kind === 'pult'
        ? { x: ROOM_W-1.4, y: 1.2 }
        : { x: SILL_W + 1.0 + (n%5)*1.7, y: 2.4 + Math.floor(n/5)*1.0 };
      var neu = { id: spNewTableId(), kind: kind, x: pos.x, y: pos.y, rot: 0 };
      sp.doc.tables.push(spClampTable(neu));
      spSave(); paintSitzplan();
    });
  });

  Array.prototype.forEach.call(host.querySelectorAll('[data-layout]'), function(b){
    b.addEventListener('click', function(){ spAutoLayout(b.getAttribute('data-layout')); });
  });

  host.querySelector('#spGenderMode').addEventListener('change', function(e){
    sp.doc.genderMode = e.target.value; spSave();
  });
  host.querySelector('#spShuffle').addEventListener('click', spShuffleSeats);
  host.querySelector('#spRules').addEventListener('click', spRulesModal);
  host.querySelector('#spClearSeats').addEventListener('click', function(){
    uiConfirm('Alle Plätze leeren?', 'Die Möbel bleiben stehen, nur die Namen werden entfernt.', 'Leeren', function(){
      sp.doc.seats = {}; sp.picked = null; spSave(); paintSitzplan();
    }, true);
  });
  host.querySelector('#spMirror').addEventListener('click', function(){
    sp.doc.mirror = !sp.doc.mirror; spSave(); paintSitzplan();
  });
  host.querySelector('#spFs').addEventListener('click', spToggleFs);
  host.querySelector('#spFsExit').addEventListener('click', spExitFs);
  spWireFsOnce();
  host.querySelector('#spPrint').addEventListener('click', function(){
    document.body.classList.add('sp-printing');
    window.print();
    setTimeout(function(){ document.body.classList.remove('sp-printing'); }, 500);
  });

  /* Gespeicherte Sitzordnungen */
  host.querySelector('#spSavePlan').addEventListener('click', function(){
    uiPrompt('Sitzordnung sichern', 'Name der Variante', 'Sitzordnung ' + (sp.saved.length+1), 'Sichern', function(name){
      if(sp.saved.length >= 30){ toast('Maximal 30 gespeicherte Varianten.'); return; }
      sp.saved.push({
        id: 'p' + Date.now().toString(36),
        name: name,
        savedAt: new Date().toISOString(),
        tables: JSON.parse(JSON.stringify(sp.doc.tables)),
        seats: Object.assign({}, sp.doc.seats)
      });
      spSaveVarianten().then(function(){ toast('„'+name+'" gesichert.'); });
      paintSitzplan();
    });
  });
  host.querySelector('#spLoadPlan').addEventListener('click', function(){
    var id = host.querySelector('#spSavedSel').value;
    var plan = sp.saved.filter(function(p){ return p.id === id; })[0];
    if(!plan) return;
    uiConfirm('„'+plan.name+'" laden?', 'Die aktuelle Tisch- und Sitzordnung wird ersetzt.', 'Laden', function(){
      sp.doc.tables = spNormTables(JSON.parse(JSON.stringify(plan.tables || [])));
      sp.doc.seats = Object.assign({}, plan.seats || {});
      sp.picked = null; sp.selected = null;
      spSave(); paintSitzplan();
      toast('„'+plan.name+'" geladen.');
    });
  });
  host.querySelector('#spDelPlan').addEventListener('click', function(){
    var id = host.querySelector('#spSavedSel').value;
    var plan = sp.saved.filter(function(p){ return p.id === id; })[0];
    if(!plan) return;
    uiConfirm('„'+plan.name+'" löschen?', 'Die gespeicherte Variante wird entfernt. Der aktuelle Plan bleibt.', 'Löschen', function(){
      sp.saved = sp.saved.filter(function(p){ return p.id !== id; });
      spSaveVarianten();
      paintSitzplan();
    }, true);
  });

  /* Kinder-Liste */
  Array.prototype.forEach.call(host.querySelectorAll('[data-pick]'), function(btn){
    btn.addEventListener('click', function(){
      var uid = btn.getAttribute('data-pick');
      sp.picked = (sp.picked === uid) ? null : uid;
      paintSitzplan();
    });
  });
  Array.prototype.forEach.call(host.querySelectorAll('[data-g]'), function(btn){
    btn.addEventListener('click', function(){
      var uid = btn.getAttribute('data-uid'), g = btn.getAttribute('data-g');
      if(!sp.doc.meta[uid]) sp.doc.meta[uid] = {};
      sp.doc.meta[uid].g = (spGender(uid) === g) ? '' : g;
      spSave(); paintSitzplan();
    });
  });
  Array.prototype.forEach.call(host.querySelectorAll('[data-abs]'), function(btn){
    btn.addEventListener('click', function(){
      var uid = btn.getAttribute('data-abs');
      var i = sp.doc.absent.indexOf(uid);
      if(i >= 0){ sp.doc.absent.splice(i,1); }
      else {
        sp.doc.absent.push(uid);
        var seat = spSeatOf(uid);
        if(seat) delete sp.doc.seats[seat];
        if(sp.picked === uid) sp.picked = null;
      }
      spSave(); paintSitzplan();
    });
  });

  /* Möbel drehen / entfernen */
  Array.prototype.forEach.call(host.querySelectorAll('[data-rot]'), function(btn){
    btn.addEventListener('click', function(e){
      e.stopPropagation();
      var t = spTableById(btn.getAttribute('data-rot'));
      if(!t) return;
      t.rot = ((t.rot||0) + 90) % 360;   // nur waagrecht/senkrecht
      spClampTable(t);                   // gedreht könnte er sonst aufs Sims ragen
      spSave(); paintSitzplan();
    });
  });
  Array.prototype.forEach.call(host.querySelectorAll('[data-del]'), function(btn){
    btn.addEventListener('click', function(e){
      e.stopPropagation();
      var id = btn.getAttribute('data-del');
      sp.doc.tables = sp.doc.tables.filter(function(t){ return t.id !== id; });
      delete sp.doc.seats[spSeatId(id,0)];
      delete sp.doc.seats[spSeatId(id,1)];
      sp.selected = null;
      spSave(); paintSitzplan();
    });
  });

  /* Möbel frei verschieben.
     Ziehen und Antippen laufen beide über pointerdown/-up auf dem Möbelstück:
     die zwei Sitzplatz-Knöpfe füllen den Tisch komplett aus, ein separater
     click-Handler auf ihnen würde das Ziehen also verunmöglichen. Erst ab ein
     paar Pixeln Bewegung gilt es als Ziehen, darunter als Tippen. */
  var room = host.querySelector('#spRoom');
  Array.prototype.forEach.call(host.querySelectorAll('.sp-table'), function(el){
    el.addEventListener('pointerdown', function(e){
      if(e.target.closest('.sp-mini')) return;
      var t = spTableById(el.getAttribute('data-table'));
      if(!t) return;
      e.preventDefault();
      var seatBtn = e.target.closest('.sp-seat');
      var seatId = seatBtn ? seatBtn.getAttribute('data-seat') : null;
      var rect = room.getBoundingClientRect();
      var startX = e.clientX, startY = e.clientY, moved = false;
      try{ el.setPointerCapture(e.pointerId); }catch(err){}

      function onMove(ev){
        if(!moved && Math.abs(ev.clientX-startX) < 4 && Math.abs(ev.clientY-startY) < 4) return;
        moved = true;
        el.classList.add('sp-dragging');
        var mx = (ev.clientX - rect.left) / rect.width * ROOM_W;
        var my = (ev.clientY - rect.top) / rect.height * ROOM_D;
        if(sp.doc.mirror) mx = ROOM_W - mx;
        t.x = mx; t.y = my;
        spClampTable(t);
        var showX = sp.doc.mirror ? (ROOM_W - t.x) : t.x;
        el.style.left = (showX/ROOM_W*100)+'%';
        el.style.top  = (t.y/ROOM_D*100)+'%';
      }
      function onUp(){
        el.removeEventListener('pointermove', onMove);
        el.removeEventListener('pointerup', onUp);
        el.removeEventListener('pointercancel', onUp);
        el.classList.remove('sp-dragging');
        if(moved){ sp.selected = t.id; spSave(); paintSitzplan(); return; }
        if(seatId && spHandleSeatClick(seatId)) return;
        sp.selected = (sp.selected === t.id) ? null : t.id;
        paintSitzplan();
      }
      el.addEventListener('pointermove', onMove);
      el.addEventListener('pointerup', onUp);
      el.addEventListener('pointercancel', onUp);
    });
  });

  room.addEventListener('pointerdown', function(e){
    if(e.target === room || e.target.classList.contains('sp-board')){
      sp.selected = null; sp.picked = null; paintSitzplan();
    }
  });
}

/* ---------- Tischordnungs-Vorlagen ----------
   Betreffen nur die Zweiertische — Lehrerpult und gesperrte Flächen bleiben
   stehen, wo sie hingestellt wurden. */

function spAutoLayout(kind, silent){
  var n = SP_DEFAULT_TABLES;
  var keep = sp.doc.tables.filter(function(t){ return !spHasSeats(t); });
  var tables = [];
  var i;
  // Nutzbare Breite = Zimmer ohne das Fenstersims links.
  var USE_X0 = SILL_W, USE_W = ROOM_W - SILL_W;
  if(kind === 'reihen'){
    // Vier Tische pro Reihe mit Mittelgang, alle zur Wandtafel ausgerichtet.
    var cols = 4, gapX = 0.25, blockGap = 0.5;
    var rowY = 2.4, rowGap = 1.1;
    var rowWidth = cols*TABLE_W + (cols-1)*gapX + blockGap;
    var startX = USE_X0 + (USE_W - rowWidth)/2 + TABLE_W/2;
    for(i=0;i<n;i++){
      var c = i % cols, r = Math.floor(i/cols);
      var x = startX + c*(TABLE_W+gapX) + (c >= cols/2 ? blockGap : 0);
      tables.push({ id: spNewTableId(), kind:'tisch', x: spSnap(x), y: spSnap(Math.min(ROOM_D-0.5, rowY + r*rowGap)), rot: 0 });
    }
  } else if(kind === 'gruppen'){
    // Inseln aus zwei Tischen (=4 Plätze), drei Inseln pro Reihe.
    var perRow = 3, gx = (USE_W - perRow*TABLE_W) / (perRow+1);
    var islands = Math.ceil(n/2);
    for(i=0;i<islands;i++){
      var ic = i % perRow, ir = Math.floor(i/perRow);
      var cx = USE_X0 + gx + TABLE_W/2 + ic*(TABLE_W+gx);
      var cy = 2.6 + ir*1.9;
      tables.push({ id: spNewTableId(), kind:'tisch', x: spSnap(cx), y: spSnap(Math.min(ROOM_D-1.0, cy - TABLE_H/2 - 0.02)), rot: 0 });
      if(tables.length < n) tables.push({ id: spNewTableId(), kind:'tisch', x: spSnap(cx), y: spSnap(Math.min(ROOM_D-0.5, cy + TABLE_H/2 + 0.02)), rot: 180 });
    }
    tables = tables.slice(0, n);
  } else if(kind === 'u'){
    // U-Form: die beiden Flanken zur Mitte gedreht, hinten eine Reihe. Ein um
    // 90 Grad gedrehter Tisch ist TABLE_W tief — der Abstand der Flankentische
    // muss darum grösser sein als die Tischlänge. Die linke Flanke steht neben
    // dem Fenstersims, nicht darauf.
    var sideGap = TABLE_W + 0.2, sideTop = 2.4;
    var maxSide = Math.max(0, Math.floor((ROOM_D - sideTop - 1.5) / sideGap) + 1);
    var sideCount = Math.min(maxSide, Math.floor(n/3));
    var sideX = spSnap(USE_X0 + TABLE_H/2 + 0.15);
    for(i=0;i<sideCount;i++){
      tables.push({ id: spNewTableId(), kind:'tisch', x: sideX, y: spSnap(sideTop + i*sideGap), rot: 90 });
      if(tables.length < n) tables.push({ id: spNewTableId(), kind:'tisch', x: spSnap(ROOM_W - TABLE_H/2 - 0.15), y: spSnap(sideTop + i*sideGap), rot: 270 });
    }
    var backCount = Math.max(0, n - tables.length);
    var bw = Math.min(4, Math.max(1, backCount));
    var bStart = USE_X0 + (USE_W - (bw*TABLE_W + (bw-1)*0.2))/2 + TABLE_W/2;
    for(i=0;i<backCount;i++){
      var bc = i % bw, br = Math.floor(i/bw);
      tables.push({ id: spNewTableId(), kind:'tisch', x: spSnap(bStart + bc*(TABLE_W+0.2)), y: spSnap(Math.max(1.5, ROOM_D-1.0 - br*(TABLE_H+0.2))), rot: 180 });
    }
    tables = tables.slice(0, n);
  } else {
    // Zufall: gesetzt wird nur, wo nichts kollidiert (einfacher Radius-Test).
    var minX = USE_X0 + TABLE_W/2 + 0.1, maxX = ROOM_W - TABLE_W/2 - 0.1;
    var minY = 2.2 + TABLE_H/2, maxY = ROOM_D - TABLE_H/2 - 0.1;
    var fits = function(list, cand, mx, my){
      return list.every(function(t){
        return Math.abs(t.x-cand.x) > mx || Math.abs(t.y-cand.y) > my;
      });
    };
    var tries = 0;
    while(tables.length < n && tries < 4000){
      tries++;
      var cand = {
        id: spNewTableId(), kind:'tisch',
        x: spSnap(minX + Math.random()*(maxX-minX)),
        y: spSnap(minY + Math.random()*(maxY-minY)),
        rot: [0,0,0,180,180][Math.floor(Math.random()*5)]   // gleicher Grundriss
      };
      if(fits(tables, cand, TABLE_W+0.2, TABLE_H+0.3)) tables.push(cand);
    }
    // Das Zimmer ist eng: der reine Zufall (mit
    // grosszügigem Abstand) bringt oft nur 8-10 Tische unter. Der Rest wird
    // danach feinrastrig aufgefüllt — dort reicht ein Abstand, bei dem sich
    // die Tische gerade nicht mehr überlappen.
    for(var gy = minY; gy <= maxY + 0.001 && tables.length < n; gy += SNAP){
      for(var gx2 = minX; gx2 <= maxX + 0.001 && tables.length < n; gx2 += SNAP){
        var slot = { id: spNewTableId(), kind:'tisch', x: spSnap(gx2), y: spSnap(gy), rot: 0 };
        if(fits(tables, slot, TABLE_W+0.05, TABLE_H+0.05)) tables.push(slot);
      }
    }
  }

  // Sitzende Kinder nach Möglichkeit mitnehmen: gleiche Reihenfolge, neue Tische.
  var order = [];
  spSeatTables().forEach(function(t){
    [0,1].forEach(function(s){ var u = spSeatedUid(spSeatId(t.id,s)); if(u) order.push(u); });
  });
  sp.doc.tables = keep.concat(tables);
  sp.doc.seats = {};
  var seatIds = spAllSeatIds();
  order.slice(0, seatIds.length).forEach(function(uid, idx){ sp.doc.seats[seatIds[idx]] = uid; });
  sp.selected = null;
  spSave(); paintSitzplan();
  if(!silent) toast(tables.length + ' Zweiertische gesetzt.');
}

/* ---------- Regeln ---------- */

function spRulesModal(){
  function optionsHtml(sel){
    return sp.roster.map(function(s){
      return '<option value="'+esc(s.uid)+'"'+(sel===s.uid?' selected':'')+'>'+esc(s.displayName)+'</option>';
    }).join('');
  }
  function listHtml(){
    if(!sp.doc.rules.length) return '<div class="sp-rule-empty">Noch keine Regeln.</div>';
    return sp.doc.rules.map(function(r, i){
      var a = spStudentById(r.a), b = spStudentById(r.b);
      var txt;
      if(r.t === 'nicht') txt = esc(a?a.displayName:'?') + ' <b>nicht neben</b> ' + esc(b?b.displayName:'?');
      else if(r.t === 'zusammen') txt = esc(a?a.displayName:'?') + ' <b>neben</b> ' + esc(b?b.displayName:'?');
      else if(r.t === 'allein') txt = esc(a?a.displayName:'?') + ' <b>sitzt allein</b> am Tisch';
      else txt = esc(a?a.displayName:'?') + ' <b>sitzt vorne</b>';
      return '<div class="sp-rule"><span>'+txt+'</span><button class="btn btn-danger btn-sm" type="button" data-rule-del="'+i+'">Entfernen</button></div>';
    }).join('');
  }
  function build(){
    var h = '';
    h += '<h3>⚖️ Sitz-Regeln</h3>';
    h += '<p>Werden beim zufälligen Setzen berücksichtigt. Lässt sich eine Regel nicht erfüllen, wird die Variante mit den wenigsten Verstössen gewählt.</p>';
    h += '<div class="sp-rule-list" id="spRuleList">'+listHtml()+'</div>';
    h += '<div class="sp-rule-add">';
    h += '<select class="sp-select" id="spRuleType"><option value="nicht">darf nicht neben</option><option value="zusammen">soll neben</option><option value="allein">soll allein am Tisch sitzen</option><option value="vorne">soll vorne sitzen</option></select>';
    h += '<select class="sp-select" id="spRuleA">'+optionsHtml(null)+'</select>';
    h += '<select class="sp-select" id="spRuleB">'+optionsHtml(null)+'</select>';
    h += '<button class="btn btn-primary btn-sm" id="spRuleAdd" type="button">Hinzufügen</button>';
    h += '</div>';
    h += '<div class="modal-actions"><button class="btn btn-primary btn-sm" id="spRuleClose" type="button">Fertig</button></div>';
    openModal(h, 'modal-wide');
    wire();
  }
  function wire(){
    var typeSel = document.getElementById('spRuleType');
    var bSel = document.getElementById('spRuleB');
    // "vorne" und "allein" betreffen nur EIN Kind — das zweite Feld verschwindet.
    function syncB(){ bSel.style.display = (typeSel.value === 'vorne' || typeSel.value === 'allein') ? 'none' : ''; }
    typeSel.addEventListener('change', syncB); syncB();
    document.getElementById('spRuleAdd').addEventListener('click', function(){
      var t = typeSel.value;
      var a = document.getElementById('spRuleA').value;
      var b = bSel.value;
      var einzeln = (t === 'vorne' || t === 'allein');
      if(!einzeln && a === b){ toast('Bitte zwei verschiedene Kinder wählen.'); return; }
      if(sp.doc.rules.length >= 60){ toast('Maximal 60 Regeln.'); return; }
      sp.doc.rules.push({ t:t, a:a, b: einzeln ? '' : b });
      spSave(); build(); paintSitzplan();
    });
    Array.prototype.forEach.call(document.querySelectorAll('[data-rule-del]'), function(btn){
      btn.addEventListener('click', function(){
        sp.doc.rules.splice(parseInt(btn.getAttribute('data-rule-del'),10), 1);
        spSave(); build(); paintSitzplan();
      });
    });
    document.getElementById('spRuleClose').addEventListener('click', closeModal);
  }
  build();
}

/* ---------- Zufällige Sitzordnung mit Regeln ----------
   Bewertet eine Verteilung mit Straf-Punkten und verbessert sie durch
   zufälliges Tauschen zweier Plätze (Hill-Climbing mit mehreren Neustarts).
   Kein exaktes Verfahren, aber für eine Klasse dieser Grösse in Millisekunden
   fertig und praktisch immer verstossfrei, wenn es überhaupt möglich ist. */

function spShuffleSeats(){
  var seatIds = spAllSeatIds();
  var students = spActiveStudents().map(function(s){ return s.uid; });
  if(!seatIds.length){ toast('Zuerst Zweiertische setzen.'); return; }
  if(students.length > seatIds.length){
    toast('Zu wenig Plätze: '+students.length+' Kinder, '+seatIds.length+' Plätze.');
    return;
  }

  // Nachbarschaft + "vorne" vorberechnen
  var partner = {}, frontness = {};
  spSeatTables().forEach(function(t){
    var a = spSeatId(t.id,0), b = spSeatId(t.id,1);
    partner[a] = b; partner[b] = a;
    frontness[a] = t.y; frontness[b] = t.y;
  });
  var ys = spSeatTables().map(function(t){ return t.y; });
  var frontLimit = ys.length ? (Math.min.apply(null, ys) + (Math.max.apply(null, ys) - Math.min.apply(null, ys)) / 3 + 0.01) : 0;

  var notPairs = [], togetherPairs = [], frontKids = [], aloneKids = [];
  sp.doc.rules.forEach(function(r){
    if(r.t === 'nicht') notPairs.push([r.a, r.b]);
    else if(r.t === 'zusammen') togetherPairs.push([r.a, r.b]);
    else if(r.t === 'allein') aloneKids.push(r.a);
    else if(r.t === 'vorne') frontKids.push(r.a);
  });
  // Wer allein sitzen soll, belegt faktisch einen ganzen Tisch - ohne genügend
  // Plätze geht das nicht auf, darum vorher nachrechnen und Bescheid geben.
  if(students.length + aloneKids.length > seatIds.length){
    toast('Zu wenig Plätze: '+aloneKids.length+' Kind(er) sollen allein sitzen.');
    return;
  }

  function score(assign){   // assign: seatId -> uid
    var pen = 0;
    var seatOf = {};
    Object.keys(assign).forEach(function(sid){ if(assign[sid]) seatOf[assign[sid]] = sid; });
    notPairs.forEach(function(p){
      var sa = seatOf[p[0]], sbb = seatOf[p[1]];
      if(sa && sbb && partner[sa] === sbb) pen += 100;
    });
    togetherPairs.forEach(function(p){
      var sa = seatOf[p[0]], sbb = seatOf[p[1]];
      if(!sa || !sbb || partner[sa] !== sbb) pen += 50;
    });
    aloneKids.forEach(function(uid){
      var sid = seatOf[uid];
      if(!sid || assign[partner[sid]]) pen += 80;
    });
    frontKids.forEach(function(uid){
      var sid = seatOf[uid];
      if(!sid || frontness[sid] > frontLimit) pen += 30;
    });
    if(sp.doc.genderMode !== 'egal'){
      spSeatTables().forEach(function(t){
        var u1 = assign[spSeatId(t.id,0)], u2 = assign[spSeatId(t.id,1)];
        if(!u1 || !u2) return;
        var g1 = spGender(u1), g2 = spGender(u2);
        if(!g1 || !g2) return;
        if(sp.doc.genderMode === 'gemischt' && g1 === g2) pen += 10;
        if(sp.doc.genderMode === 'gleich' && g1 !== g2) pen += 10;
      });
    }
    // Leere Plätze möglichst hinten lassen - ausser sie gehören zu einem Tisch,
    // an dem jemand bewusst allein sitzt.
    seatIds.forEach(function(sid){
      if(assign[sid]) return;
      var neighbour = assign[partner[sid]];
      if(neighbour && aloneKids.indexOf(neighbour) >= 0) return;
      pen += Math.max(0, (frontLimit - frontness[sid])) * 2;
    });
    return pen;
  }

  function shuffled(arr){
    var a = arr.slice();
    for(var i=a.length-1;i>0;i--){ var j = Math.floor(Math.random()*(i+1)); var tmp=a[i]; a[i]=a[j]; a[j]=tmp; }
    return a;
  }

  var best = null, bestScore = Infinity;
  for(var restart=0; restart<10; restart++){
    var pool = shuffled(students);
    var assign = {};
    shuffled(seatIds).forEach(function(sid, i){ assign[sid] = pool[i] || null; });
    var cur = score(assign);
    for(var step=0; step<3000 && cur > 0; step++){
      var s1 = seatIds[Math.floor(Math.random()*seatIds.length)];
      var s2 = seatIds[Math.floor(Math.random()*seatIds.length)];
      if(s1 === s2) continue;
      var t1 = assign[s1], t2 = assign[s2];
      assign[s1] = t2; assign[s2] = t1;
      var next = score(assign);
      if(next <= cur){ cur = next; }
      else { assign[s1] = t1; assign[s2] = t2; }
    }
    if(cur < bestScore){ bestScore = cur; best = assign; }
    if(bestScore === 0) break;
  }

  sp.doc.seats = {};
  Object.keys(best).forEach(function(sid){ if(best[sid]) sp.doc.seats[sid] = best[sid]; });
  sp.picked = null;
  spSave(); paintSitzplan();
  toast(bestScore === 0 ? 'Sitzordnung gesetzt — alle Regeln erfüllt.' : 'Sitzordnung gesetzt — nicht alle Regeln liessen sich erfüllen.');
}

/* ===================== ❓ ANONYME FRAGEBOX =====================
   Schüler:innen stellen eine Frage, ohne dass irgendwo festgehalten wird, von
   wem sie kommt: das Dokument enthält KEINE uid. Gelesen wird es nur von der
   Lehrperson — ausser sie beantwortet und veröffentlicht die Frage, dann wird
   sie für alle sichtbar (published:true). Die Schüler-Abfrage filtert mit genau
   einem where('published','==',true) und ohne orderBy, sortiert wird lokal. */

function openFragebox(){
  var isTeacher = state.profile.role === 'teacher';
  if(isTeacher) openFrageboxTeacher(); else openFrageboxStudent();
}

function frageZeit(f){
  var ms = f.createdAt && f.createdAt.toMillis ? f.createdAt.toMillis() : 0;
  return ms;
}
function fmtFrageDatum(f){
  var ms = frageZeit(f);
  if(!ms) return '';
  return new Date(ms).toLocaleDateString('de-CH', {day:'2-digit', month:'2-digit'});
}

function openFrageboxStudent(){
  var h = '';
  h += '<h3>❓ Frage stellen</h3>';
  h += '<p>Du kannst anonym fragen — dann steht nirgends, von wem die Frage kommt. Oder du schickst deinen Namen mit, damit Herr Helfenberger dich direkt ansprechen kann.</p>';
  h += '<div class="fb-who-choice">';
  h += '<label><input type="radio" name="fbWho" value="anon" checked> Anonym fragen</label>';
  h += '<label><input type="radio" name="fbWho" value="name"> Mit meinem Namen ('+esc(state.profile.displayName)+')</label>';
  h += '</div>';
  h += '<select class="sp-select" id="fbSubject" style="margin-bottom:10px;width:100%;"><option value="">Fach wählen (optional)</option>'
     + SUBJECTS.filter(function(s){ return !s.teacherOnly; }).map(function(s){ return '<option value="'+s.id+'">'+esc(s.name)+'</option>'; }).join('')
     + '</select>';
  h += '<textarea id="fbText" class="fb-textarea" maxlength="600" placeholder="Was hast du nicht verstanden?"></textarea>';
  h += '<div class="modal-actions"><button class="btn btn-ghost btn-sm" id="fbCancel" type="button">Abbrechen</button>'
     + '<button class="btn btn-primary btn-sm" id="fbSend" type="button">Anonym senden</button></div>';
  h += '<div class="section-label" style="margin-top:18px;">Beantwortete Fragen der Klasse</div>';
  h += '<div class="fb-wall" id="fbWall">wird geladen …</div>';
  openModal(h, 'modal-wide');

  document.getElementById('fbCancel').addEventListener('click', closeModal);
  document.getElementById('fbText').focus();
  document.getElementById('fbSend').addEventListener('click', function(){
    var txt = document.getElementById('fbText').value.trim();
    if(txt.length < 5){ toast('Bitte schreib etwas mehr.'); return; }
    var whoEl = document.querySelector('input[name="fbWho"]:checked');
    var mitName = !!(whoEl && whoEl.value === 'name');
    setDoc(doc(collection(db,'fragen')), {
      text: txt,
      subject: document.getElementById('fbSubject').value || '',
      // Ohne diese Zeile steht im Dokument wirklich nichts über die Person -
      // die Frage ist dann auch im Nachhinein nicht zuzuordnen.
      name: mitName ? state.profile.displayName : '',
      answer: '',
      published: false,
      createdAt: serverTimestamp()
    }).then(function(){
      closeModal();
      toast(mitName ? 'Danke — deine Frage ist angekommen.' : 'Danke — deine Frage ist anonym angekommen.');
    }).catch(function(err){
      console.error(err); toast('Frage konnte nicht gesendet werden.');
    });
  });

  getDocs(query(collection(db,'fragen'), where('published','==',true))).then(function(snap){
    var wall = document.getElementById('fbWall');
    if(!wall) return;
    var list = [];
    snap.forEach(function(d){ list.push(Object.assign({id:d.id}, d.data())); });
    list.sort(function(a,b){ return frageZeit(b) - frageZeit(a); });
    if(!list.length){ wall.innerHTML = '<div class="fb-empty">Noch nichts veröffentlicht.</div>'; return; }
    wall.innerHTML = list.slice(0,30).map(function(f){
      var s = subjectById(f.subject);
      return '<div class="fb-item"><div class="fb-q">'+(s?'<span class="fb-tag">'+esc(s.name)+'</span>':'')+esc(f.text)+'</div>'
           + '<div class="fb-a">'+esc(f.answer||'')+'</div></div>';
    }).join('');
  }).catch(function(err){
    console.error(err);
    var wall = document.getElementById('fbWall');
    if(wall) wall.innerHTML = '<div class="fb-empty">Konnte nicht geladen werden.</div>';
  });
}

function openFrageboxTeacher(){
  openModal('<h3>❓ Fragebox</h3><div class="fb-wall" id="fbWall">wird geladen …</div>'
    + '<div class="modal-actions"><button class="btn btn-primary btn-sm" id="fbClose" type="button">Schliessen</button></div>', 'modal-wide');
  document.getElementById('fbClose').addEventListener('click', closeModal);
  loadFrageboxTeacher();
}

function loadFrageboxTeacher(){
  getDocs(collection(db,'fragen')).then(function(snap){
    var wall = document.getElementById('fbWall');
    if(!wall) return;
    var list = [];
    snap.forEach(function(d){ list.push(Object.assign({id:d.id}, d.data())); });
    // Unbeantwortete zuerst, innerhalb davon die neuesten oben.
    list.sort(function(a,b){
      if(!!a.published !== !!b.published) return a.published ? 1 : -1;
      return frageZeit(b) - frageZeit(a);
    });
    if(!list.length){ wall.innerHTML = '<div class="fb-empty">Keine Fragen.</div>'; return; }
    wall.innerHTML = list.map(function(f){
      var s = subjectById(f.subject);
      var h = '<div class="fb-item'+(f.published?' fb-item-done':'')+'">';
      h += '<div class="fb-q">'+(s?'<span class="fb-tag">'+esc(s.name)+'</span>':'')
         + '<span class="fb-who'+(f.name?'':' fb-anon')+'">'+esc(f.name || 'anonym')+'</span>'
         + esc(f.text)
         + '<span class="fb-date">'+esc(fmtFrageDatum(f))+'</span></div>';
      h += '<textarea class="fb-textarea fb-answer" data-ans="'+esc(f.id)+'" maxlength="800" placeholder="Antwort für die Klasse …">'+esc(f.answer||'')+'</textarea>';
      h += '<div class="fb-actions">';
      h += '<button class="btn btn-primary btn-sm" data-pub="'+esc(f.id)+'" type="button">'+(f.published?'Antwort aktualisieren':'Antworten & veröffentlichen')+'</button>';
      h += '<button class="btn btn-danger btn-sm" data-del="'+esc(f.id)+'" type="button">Löschen</button>';
      h += '</div></div>';
      return h;
    }).join('');

    Array.prototype.forEach.call(wall.querySelectorAll('[data-pub]'), function(btn){
      btn.addEventListener('click', function(){
        var id = btn.getAttribute('data-pub');
        var ta = wall.querySelector('[data-ans="'+id+'"]');
        var ans = (ta.value || '').trim();
        if(!ans){ toast('Bitte zuerst eine Antwort schreiben.'); return; }
        updateDoc(doc(db,'fragen',id), { answer: ans, published: true })
          .then(function(){ toast('Veröffentlicht.'); loadFrageboxTeacher(); })
          .catch(function(err){ console.error(err); toast('Konnte nicht gespeichert werden.'); });
      });
    });
    Array.prototype.forEach.call(wall.querySelectorAll('[data-del]'), function(btn){
      btn.addEventListener('click', function(){
        var id = btn.getAttribute('data-del');
        uiConfirm('Frage löschen?', 'Die Frage wird endgültig entfernt.', 'Löschen', function(){
          deleteDoc(doc(db,'fragen',id))
            .then(function(){ openFrageboxTeacher(); })
            .catch(function(err){ console.error(err); toast('Konnte nicht gelöscht werden.'); });
        }, true);
      });
    });
  }).catch(function(err){
    console.error(err);
    var wall = document.getElementById('fbWall');
    if(wall) wall.innerHTML = '<div class="fb-empty">Konnte nicht geladen werden.</div>';
  });
}

/* ===================== 🔥 LERN-STREAK (Schüler:innen) =====================
   Zählt pro Tag die tatsächlich geübte Zeit (dieselbe Messung wie beim
   Lernzeit-Tracking oben) und macht daraus Serie, Wochenziel und Abzeichen.
   Gespeichert in streaks/{uid} als Map Tag -> Sekunden; Serie und Rekord
   werden beim Anzeigen aus dieser Map gerechnet, damit ein verpasster Tag
   nicht von einem hängengebliebenen Zähler abhängt. */

var STREAK_MIN_SEC = 120;        // unter 2 Minuten zählt ein Tag nicht als geübt
var STREAK_KEEP_DAYS = 180;
var streakState = { days:null, goalMin:60, loaded:false, lastBump:0 };

function streakDayList(days){
  return Object.keys(days || {}).filter(function(k){ return (days[k]||0) >= STREAK_MIN_SEC; }).sort();
}
function streakCurrent(days){
  var set = {};
  streakDayList(days).forEach(function(d){ set[d] = true; });
  var n = 0, d = new Date();
  // Heute noch nicht geübt? Dann zählt die Serie bis gestern weiter.
  if(!set[localDateStr(d)]) d.setDate(d.getDate()-1);
  while(set[localDateStr(d)]){ n++; d.setDate(d.getDate()-1); }
  return n;
}
function streakBest(days){
  var list = streakDayList(days);
  var best = 0, run = 0, prev = null;
  list.forEach(function(ds){
    if(prev){
      var p = new Date(prev+'T00:00:00'), c = new Date(ds+'T00:00:00');
      run = Math.round((c-p)/86400000) === 1 ? run+1 : 1;
    } else { run = 1; }
    if(run > best) best = run;
    prev = ds;
  });
  return best;
}
function streakWeekSec(days){
  var sum = 0;
  for(var i=0;i<7;i++){
    var d = new Date(); d.setDate(d.getDate()-i);
    sum += (days && days[localDateStr(d)]) || 0;
  }
  return sum;
}
function streakTotalSec(days){
  var sum = 0;
  Object.keys(days||{}).forEach(function(k){ sum += days[k]||0; });
  return sum;
}
function streakBadges(days){
  var cur = streakCurrent(days), best = streakBest(days), total = streakTotalSec(days);
  var out = [];
  out.push({ icon:'🌱', name:'Erster Tag',        got: best >= 1 });
  out.push({ icon:'🔥', name:'3 Tage am Stück',   got: best >= 3 });
  out.push({ icon:'⚡️', name:'1 Woche am Stück',  got: best >= 7 });
  out.push({ icon:'🏆', name:'30 Tage am Stück',  got: best >= 30 });
  out.push({ icon:'⏳', name:'5 Stunden geübt',   got: total >= 5*3600 });
  out.push({ icon:'💎', name:'20 Stunden geübt',  got: total >= 20*3600 });
  out.push({ icon:'📅', name:'Wochenziel erreicht', got: streakWeekSec(days) >= streakState.goalMin*60 });
  out.push({ icon:'🚀', name:'Serie läuft ('+cur+')', got: cur >= 2 });
  return out;
}

async function loadStreak(){
  if(!state.user || state.profile.role === 'teacher') return null;
  try{
    var snap = await getDoc(doc(db,'streaks', state.user.uid));
    var d = snap.exists() ? snap.data() : {};
    streakState.days = d.days || {};
    streakState.goalMin = typeof d.goalMin === 'number' ? d.goalMin : 60;
    streakState.loaded = true;
    // Alte Tage wegräumen. Ein verschachteltes Feld lässt sich nur mit
    // updateDoc komplett ersetzen — setDoc(...,{merge:true}) würde die alten
    // Schlüssel stehen lassen.
    var keys = Object.keys(streakState.days);
    if(keys.length > STREAK_KEEP_DAYS + 40){
      var keep = {};
      keys.sort().slice(-STREAK_KEEP_DAYS).forEach(function(k){ keep[k] = streakState.days[k]; });
      streakState.days = keep;
      updateDoc(doc(db,'streaks', state.user.uid), { days: keep }).catch(function(){});
    }
    return streakState.days;
  }catch(err){
    console.error('Streak konnte nicht geladen werden', err);
    return null;
  }
}

// Wird vom Lernzeit-Tracking aufgerufen, sobald echte Übungszeit gemeldet wird.
function bumpStreak(seconds){
  if(!state.user || !state.profile || state.profile.role === 'teacher') return;
  if(!(seconds > 0)) return;
  var today = todayStr();
  var patch = {};
  patch['days.' + today] = increment(seconds);
  setDoc(doc(db,'streaks', state.user.uid), { days: {} }, {merge:true})
    .then(function(){ return updateDoc(doc(db,'streaks', state.user.uid), patch); })
    .then(function(){
      if(!streakState.days) streakState.days = {};
      streakState.days[today] = (streakState.days[today] || 0) + seconds;
      updateStreakButton();
    })
    .catch(function(err){ console.error('Streak konnte nicht geschrieben werden', err); });
}

function updateStreakButton(){
  var btn = document.getElementById('streakBtn');
  if(!btn) return;
  var cur = streakCurrent(streakState.days || {});
  btn.innerHTML = '🔥 <b>'+cur+'</b>';
  btn.classList.toggle('streak-off', cur === 0);
  btn.title = cur ? ('Lern-Serie: '+cur+' Tage in Folge') : 'Noch keine Lern-Serie — heute üben startet sie!';
}

function openStreakModal(){
  var days = streakState.days || {};
  var cur = streakCurrent(days), best = streakBest(days);
  var weekSec = streakWeekSec(days), goalSec = streakState.goalMin*60;
  var pct = goalSec ? Math.min(100, Math.round(weekSec/goalSec*100)) : 0;

  var h = '';
  h += '<h3>🔥 Dein Lernpfad</h3>';
  h += '<div class="st-top"><div class="st-big"><b>'+cur+'</b><span>Tage in Folge</span></div>'
     + '<div class="st-big"><b>'+best+'</b><span>Rekord</span></div>'
     + '<div class="st-big"><b>'+(Math.round(streakTotalSec(days)/360)/10).toString().replace('.',',')+'</b><span>Stunden total</span></div></div>';

  h += '<div class="section-label">Diese Woche</div>';
  h += '<div class="st-goal"><div class="st-goal-bar"><span style="width:'+pct+'%"></span></div>'
     + '<div class="st-goal-txt">'+Math.round(weekSec/60)+' von '+streakState.goalMin+' Minuten · '+pct+'%</div></div>';
  h += '<div class="st-goal-set"><label>Wochenziel <select class="sp-select" id="stGoal">'
     + [30,60,90,120,180,240].map(function(m){ return '<option value="'+m+'"'+(streakState.goalMin===m?' selected':'')+'>'+m+' min</option>'; }).join('')
     + '</select></label></div>';

  h += '<div class="section-label">Letzte 14 Tage</div>';
  h += '<div class="st-days">';
  for(var i=13;i>=0;i--){
    var d = new Date(); d.setDate(d.getDate()-i);
    var ds = localDateStr(d);
    var sec = days[ds] || 0;
    var lvl = sec >= 1800 ? 3 : (sec >= 600 ? 2 : (sec >= STREAK_MIN_SEC ? 1 : 0));
    h += '<div class="st-day st-lvl-'+lvl+'" title="'+esc(ds+': '+Math.round(sec/60)+' min')+'">'
       + '<span>'+['So','Mo','Di','Mi','Do','Fr','Sa'][d.getDay()].charAt(0)+'</span></div>';
  }
  h += '</div>';

  h += '<div class="section-label">Abzeichen</div>';
  h += '<div class="st-badges">'+streakBadges(days).map(function(b){
    return '<div class="st-badge'+(b.got?' st-badge-on':'')+'"><span>'+b.icon+'</span>'+esc(b.name)+'</div>';
  }).join('')+'</div>';

  h += '<div class="modal-actions"><button class="btn btn-primary btn-sm" id="stClose" type="button">Weiter üben</button></div>';
  openModal(h, 'modal-wide');
  document.getElementById('stClose').addEventListener('click', closeModal);
  document.getElementById('stGoal').addEventListener('change', function(e){
    streakState.goalMin = parseInt(e.target.value,10);
    setDoc(doc(db,'streaks', state.user.uid), { goalMin: streakState.goalMin }, {merge:true}).catch(function(){});
    closeModal(); openStreakModal();
  });
}

/* ===================== 🎮 KLASSEN-QUIZ (live, auf den Geräten der Klasse) =====================
   Ablauf: Lehrperson startet ein Quiz -> quizSessions/aktiv wird beschrieben.
   Alle angemeldeten Geräte beobachten genau dieses eine Dokument (fester
   Dokumentname statt einer Abfrage nach der "laufenden" Sitzung — es läuft
   ohnehin immer nur ein Quiz, und so braucht es weder Query noch Index).

   Wichtig fürs Schummeln: die Fragen mit den richtigen Antworten liegen in
   quizzes/{id} und sind laut Regeln NUR für die Lehrperson lesbar. In die
   Session wandert pro Frage nur der Text plus die Antwortmöglichkeiten; der
   Index der richtigen Antwort erst beim Auflösen. Die Punkte rechnet das Gerät
   der Lehrperson und schreibt sie in quizSessions/aktiv/spieler/{uid} — die
   Kinder können ihren eigenen Punktestand nicht selbst setzen. */

var QUIZ_SESSION = ['quizSessions', 'aktiv'];
var quizLive = { session:null, unsub:null, overlay:null, unsubAnswers:null, unsubPlayers:null, tick:null, answered:{}, players:[] };

function quizSessionRef(){ return doc(db, QUIZ_SESSION[0], QUIZ_SESSION[1]); }
function quizAnswersCol(){ return collection(db, QUIZ_SESSION[0], QUIZ_SESSION[1], 'antworten'); }
function quizPlayersCol(){ return collection(db, QUIZ_SESSION[0], QUIZ_SESSION[1], 'spieler'); }
function quizIsRunning(s){ return !!(s && s.state && s.state !== 'idle'); }

// Läuft für alle Angemeldeten ab dem Login: sobald ein Quiz startet, erscheint
// oben der Mitmachen-Knopf.
function startQuizWatcher(){
  if(quizLive.unsub) return;
  quizLive.unsub = onSnapshot(quizSessionRef(), function(snap){
    quizLive.session = snap.exists() ? snap.data() : null;
    updateQuizBanner();
    if(state.route.name === 'quizplay') renderQuizPlay();
  }, function(err){ console.error('Quiz-Listener', err); });
}
function stopQuizWatcher(){
  if(quizLive.unsub){ quizLive.unsub(); quizLive.unsub = null; }
  quizLive.session = null;
}

function updateQuizBanner(){
  var btn = document.getElementById('quizJoinBtn');
  if(!btn || !state.profile) return;
  var running = quizIsRunning(quizLive.session);
  btn.hidden = !running || state.profile.role === 'teacher';
  if(running) btn.innerHTML = '🎮 Quiz läuft — mitmachen';
}

/* ---------- Lehrer: Quiz-Verwaltung ---------- */

function renderQuizVerwaltung(){
  clearSubjectWatchers(); clearOverviewWatchers();
  var html = '';
  html += '<div class="back-row"><button class="btn btn-ghost btn-sm" id="backBtn" type="button">&larr; Klassenzimmer</button></div>';

        + '<button class="btn btn-ghost btn-sm" id="qzImport" type="button">📋 Aus Text erstellen</button></div>';
  html += '<div id="qzList"><div class="empty-state">Wird geladen …</div></div>';
  renderChrome(html);
  document.getElementById('backBtn').addEventListener('click', function(){ state.route = {name:'klassenzimmer'}; render(); });
  document.getElementById('qzNew').addEventListener('click', function(){ openQuizEditor(null); });
  document.getElementById('qzImport').addEventListener('click', openQuizImport);
  loadQuizList();
}

function loadQuizList(){
  getDocs(collection(db,'quizzes')).then(function(snap){
    var host = document.getElementById('qzList');
    if(!host) return;
    var list = [];
    snap.forEach(function(d){ list.push(Object.assign({id:d.id}, d.data())); });
    list.sort(function(a,b){ return (b.createdAt && b.createdAt.toMillis ? b.createdAt.toMillis() : 0) - (a.createdAt && a.createdAt.toMillis ? a.createdAt.toMillis() : 0); });
    if(!list.length){ host.innerHTML = '<div class="empty-state">Noch kein Quiz angelegt.</div>'; return; }
    host.innerHTML = list.map(function(q){
      var s = subjectById(q.subject);
      var n = (q.questions||[]).length;
      return '<div class="card qz-row"><div class="qz-row-body"><h3>'+esc(q.title)+'</h3>'
        + '<div class="qz-row-meta">'+n+' Frage'+(n===1?'':'n')+(s?' · '+esc(s.name):'')+'</div></div>'
        + '<div class="qz-row-actions">'
        + '<button class="btn btn-primary btn-sm" data-start="'+esc(q.id)+'" type="button">▶︎ Starten</button>'
        + '<button class="btn btn-ghost btn-sm" data-edit="'+esc(q.id)+'" type="button">Bearbeiten</button>'
        + '<button class="btn btn-danger btn-sm" data-del="'+esc(q.id)+'" type="button">Löschen</button>'
        + '</div></div>';
    }).join('');
    Array.prototype.forEach.call(host.querySelectorAll('[data-start]'), function(b){
      b.addEventListener('click', function(){
        var q = list.filter(function(x){ return x.id === b.getAttribute('data-start'); })[0];
        if(q) startQuizSession(q);
      });
    });
    Array.prototype.forEach.call(host.querySelectorAll('[data-edit]'), function(b){
      b.addEventListener('click', function(){
        var q = list.filter(function(x){ return x.id === b.getAttribute('data-edit'); })[0];
        if(q) openQuizEditor(q);
      });
    });
    Array.prototype.forEach.call(host.querySelectorAll('[data-del]'), function(b){
      b.addEventListener('click', function(){
        var id = b.getAttribute('data-del');
        uiConfirm('Quiz löschen?', 'Das Quiz wird endgültig entfernt.', 'Löschen', function(){
          deleteDoc(doc(db,'quizzes',id)).then(loadQuizList)
            .catch(function(err){ console.error(err); toast('Konnte nicht gelöscht werden.'); });
        }, true);
      });
    });
  }).catch(function(err){
    console.error(err);
    var host = document.getElementById('qzList');
    if(host) host.innerHTML = '<div class="empty-state">Quiz-Liste konnte nicht geladen werden.</div>';
  });
}

function quizEmptyQuestion(){ return { q:'', a:['','','',''], c:0, sec:25 }; }

function openQuizEditor(existing){
  var data = existing
    ? { id:existing.id, title:existing.title||'', subject:existing.subject||'', questions:(existing.questions||[]).map(function(x){ return {q:x.q||'', a:(x.a||['','','','']).slice(), c:x.c||0, sec:x.sec||25}; }) }
    : { id:null, title:'', subject:'', questions:[quizEmptyQuestion()] };

  function build(){
    var h = '';
    h += '<h3>'+(data.id ? 'Quiz bearbeiten' : 'Neues Quiz')+'</h3>';
    h += '<input type="text" id="qzTitle" maxlength="80" placeholder="Titel des Quiz" value="'+esc(data.title)+'">';
    h += '<select class="sp-select" id="qzSubject" style="width:100%;margin-top:8px;"><option value="">Fach (optional)</option>'
       + SUBJECTS.filter(function(s){ return !s.teacherOnly; }).map(function(s){ return '<option value="'+s.id+'"'+(data.subject===s.id?' selected':'')+'>'+esc(s.name)+'</option>'; }).join('')
       + '</select>';
    h += '<div class="qz-q-list">';
    data.questions.forEach(function(q, i){
      h += '<div class="qz-q"><div class="qz-q-head"><b>Frage '+(i+1)+'</b>'
         + '<span class="qz-q-head-actions">'
         + '<button class="move-btn" type="button" data-up="'+i+'"'+(i===0?' disabled':'')+'>↑</button>'
         + '<button class="move-btn" type="button" data-down="'+i+'"'+(i===data.questions.length-1?' disabled':'')+'>↓</button>'
         + '<button class="btn btn-danger btn-sm" type="button" data-qdel="'+i+'">✕</button>'
         + '</span></div>';
      h += '<textarea class="fb-textarea" data-q="'+i+'" maxlength="300" placeholder="Fragetext">'+esc(q.q)+'</textarea>';
      q.a.forEach(function(ans, j){
        h += '<label class="qz-ans"><input type="radio" name="qzc'+i+'" data-c="'+i+'_'+j+'"'+(q.c===j?' checked':'')+'>'
           + '<input type="text" data-a="'+i+'_'+j+'" maxlength="120" placeholder="Antwort '+(j+1)+'" value="'+esc(ans)+'"></label>';
      });
      h += '<label class="qz-sec">Zeit <input type="number" data-sec="'+i+'" min="5" max="180" value="'+q.sec+'"> Sekunden</label>';
      h += '</div>';
    });
    h += '</div>';
    h += '<button class="btn btn-ghost btn-sm" id="qzAddQ" type="button">➕ Frage</button>';
    h += '<div class="modal-actions"><button class="btn btn-ghost btn-sm" id="qzCancel" type="button">Abbrechen</button>'
       + '<button class="btn btn-primary btn-sm" id="qzSave" type="button">Speichern</button></div>';
    openModal(h, 'modal-wide');
    wire();
  }

  function readBack(){
    data.title = (document.getElementById('qzTitle').value || '').trim();
    data.subject = document.getElementById('qzSubject').value || '';
    Array.prototype.forEach.call(document.querySelectorAll('[data-q]'), function(el){
      data.questions[parseInt(el.getAttribute('data-q'),10)].q = el.value;
    });
    Array.prototype.forEach.call(document.querySelectorAll('[data-a]'), function(el){
      var p = el.getAttribute('data-a').split('_');
      data.questions[parseInt(p[0],10)].a[parseInt(p[1],10)] = el.value;
    });
    Array.prototype.forEach.call(document.querySelectorAll('[data-c]'), function(el){
      if(!el.checked) return;
      var p = el.getAttribute('data-c').split('_');
      data.questions[parseInt(p[0],10)].c = parseInt(p[1],10);
    });
    Array.prototype.forEach.call(document.querySelectorAll('[data-sec]'), function(el){
      var v = parseInt(el.value,10);
      data.questions[parseInt(el.getAttribute('data-sec'),10)].sec = (v>=5 && v<=180) ? v : 25;
    });
  }

  function wire(){
    document.getElementById('qzAddQ').addEventListener('click', function(){ readBack(); data.questions.push(quizEmptyQuestion()); build(); });
    document.getElementById('qzCancel').addEventListener('click', closeModal);
    Array.prototype.forEach.call(document.querySelectorAll('[data-qdel]'), function(b){
      b.addEventListener('click', function(){
        readBack();
        if(data.questions.length <= 1){ toast('Mindestens eine Frage.'); return; }
        data.questions.splice(parseInt(b.getAttribute('data-qdel'),10),1); build();
      });
    });
    Array.prototype.forEach.call(document.querySelectorAll('[data-up]'), function(b){
      b.addEventListener('click', function(){
        readBack();
        var i = parseInt(b.getAttribute('data-up'),10);
        var t = data.questions[i-1]; data.questions[i-1] = data.questions[i]; data.questions[i] = t; build();
      });
    });
    Array.prototype.forEach.call(document.querySelectorAll('[data-down]'), function(b){
      b.addEventListener('click', function(){
        readBack();
        var i = parseInt(b.getAttribute('data-down'),10);
        var t = data.questions[i+1]; data.questions[i+1] = data.questions[i]; data.questions[i] = t; build();
      });
    });
    document.getElementById('qzSave').addEventListener('click', function(){
      readBack();
      if(!data.title){ toast('Bitte einen Titel eingeben.'); return; }
      var bad = data.questions.filter(function(q){
        return !q.q.trim() || q.a.filter(function(x){ return x.trim(); }).length < 2;
      });
      if(bad.length){ toast('Jede Frage braucht einen Text und mindestens zwei Antworten.'); return; }
      var payload = {
        title: data.title, subject: data.subject,
        questions: data.questions.map(function(q){
          return { q:q.q.trim(), a:q.a.map(function(x){ return x.trim(); }), c:q.c, sec:q.sec };
        }),
        createdBy: state.profile.displayName
      };
      var p;
      if(data.id){ p = updateDoc(doc(db,'quizzes',data.id), payload); }
      else { payload.createdAt = serverTimestamp(); p = setDoc(doc(collection(db,'quizzes')), payload); }
      p.then(function(){ closeModal(); toast('Quiz gespeichert.'); loadQuizList(); })
       .catch(function(err){ console.error(err); toast('Quiz konnte nicht gespeichert werden.'); });
    });
  }

  build();
}

// Schnellerfassung: Frage, darunter die Antworten, die richtige mit * davor;
// Leerzeile trennt die Fragen. Spart bei 15 Fragen sehr viel Klickerei.
function openQuizImport(){
  var beispiel = 'Wie heisst die Hauptstadt der Schweiz?\n*Bern\nZürich\nGenf\nBasel\n\n2 + 2 = ?\n*4\n3\n5';
  var h = '<h3>📋 Quiz aus Text</h3>';
  h += '<p>Pro Block: erst die Frage, dann die Antworten — die richtige mit einem <b>*</b> davor. Leerzeile zwischen den Fragen.</p>';
  h += '<input type="text" id="qzImpTitle" maxlength="80" placeholder="Titel des Quiz">';
  h += '<textarea id="qzImpText" class="fb-textarea" style="min-height:220px;font-family:ui-monospace,Menlo,Consolas,monospace;" placeholder="'+esc(beispiel)+'"></textarea>';
  h += '<div class="modal-actions"><button class="btn btn-ghost btn-sm" id="qzImpCancel" type="button">Abbrechen</button>'
     + '<button class="btn btn-primary btn-sm" id="qzImpOk" type="button">Erstellen</button></div>';
  openModal(h, 'modal-wide');
  document.getElementById('qzImpCancel').addEventListener('click', closeModal);
  document.getElementById('qzImpOk').addEventListener('click', function(){
    var title = (document.getElementById('qzImpTitle').value||'').trim();
    var raw = document.getElementById('qzImpText').value || '';
    if(!title){ toast('Bitte einen Titel eingeben.'); return; }
    var blocks = raw.split(/\n\s*\n/).map(function(b){ return b.trim(); }).filter(Boolean);
    var questions = [];
    blocks.forEach(function(b){
      var lines = b.split('\n').map(function(l){ return l.trim(); }).filter(Boolean);
      if(lines.length < 3) return;
      var qText = lines.shift();
      var correct = 0;
      var answers = lines.slice(0,4).map(function(l, i){
        if(l.charAt(0) === '*'){ correct = i; return l.slice(1).trim(); }
        return l;
      });
      while(answers.length < 2) answers.push('');
      questions.push({ q:qText, a:answers, c:correct, sec:25 });
    });
    if(!questions.length){ toast('Kein gültiger Frageblock erkannt.'); return; }
    setDoc(doc(collection(db,'quizzes')), {
      title: title, subject: '', questions: questions,
      createdBy: state.profile.displayName, createdAt: serverTimestamp()
    }).then(function(){ closeModal(); toast(questions.length+' Fragen erstellt.'); loadQuizList(); })
      .catch(function(err){ console.error(err); toast('Quiz konnte nicht erstellt werden.'); });
  });
}

/* ---------- Lehrer: Live-Steuerung ---------- */

function startQuizSession(quiz){
  setDoc(quizSessionRef(), {
    quizId: quiz.id, title: quiz.title, state:'lobby', qIndex:-1,
    totalQ: (quiz.questions||[]).length, question:null, sec:0, startedAt:0,
    correctIndex:-1, stats:[], updatedAt: serverTimestamp()
  }).then(function(){
    // Punktestände und Antworten der letzten Runde wegräumen.
    return Promise.all([
      getDocs(quizPlayersCol()).then(function(s){ var b = writeBatch(db); s.forEach(function(d){ b.delete(d.ref); }); return b.commit(); }),
      getDocs(quizAnswersCol()).then(function(s){ var b = writeBatch(db); s.forEach(function(d){ b.delete(d.ref); }); return b.commit(); })
    ]);
  }).then(function(){ openQuizHost(quiz); })
    .catch(function(err){ console.error(err); toast('Quiz konnte nicht gestartet werden.'); });
}

function openQuizHost(quiz){
  if(quizLive.overlay) return;
  var html = '';
  html += '<div class="kz-bar"><div class="kz-bar-title">🎮 '+esc(quiz.title)+'</div><div class="kz-bar-spacer"></div>'
        + '<button class="kz-close" id="qhClose" type="button" title="Quiz beenden">✕</button></div>';
  html += '<div class="qh-stage" id="qhStage"></div>';
  quizLive.overlay = openOverlay(html, function(){
    if(quizLive.unsubAnswers){ quizLive.unsubAnswers(); quizLive.unsubAnswers = null; }
    if(quizLive.unsubPlayers){ quizLive.unsubPlayers(); quizLive.unsubPlayers = null; }
    clearInterval(quizLive.tick);
    quizLive.overlay = null;
    setDoc(quizSessionRef(), { state:'idle', question:null, updatedAt: serverTimestamp() }, {merge:true}).catch(function(){});
  }, 'kz-overlay-quiz');

  quizLive.overlay.el.querySelector('#qhClose').addEventListener('click', function(){
    uiConfirm('Quiz beenden?', 'Die Klasse sieht danach wieder die normale Ansicht.', 'Beenden', function(){
      if(quizLive.overlay) quizLive.overlay.close();
    }, true);
  });

  quizLive.answered = {};
  quizLive.unsubAnswers = onSnapshot(quizAnswersCol(), function(snap){
    quizLive.answered = {};
    snap.forEach(function(d){ quizLive.answered[d.id] = d.data(); });
    paintQuizHost(quiz);
  });
  quizLive.unsubPlayers = onSnapshot(quizPlayersCol(), function(snap){
    quizLive.players = [];
    snap.forEach(function(d){ quizLive.players.push(Object.assign({uid:d.id}, d.data())); });
    paintQuizHost(quiz);
  });
  quizLive.tick = setInterval(function(){ paintQuizHost(quiz); }, 500);
  paintQuizHost(quiz);
}

function quizLeaderboard(){
  return quizLive.players.slice().sort(function(a,b){ return (b.score||0)-(a.score||0) || (a.name||'').localeCompare(b.name||'', 'de'); });
}

function paintQuizHost(quiz){
  if(!quizLive.overlay) return;
  var stage = quizLive.overlay.el.querySelector('#qhStage');
  var s = quizLive.session || {};
  var h = '';

  if(s.state === 'lobby'){
    h += '<div class="qh-lobby"><div class="qh-big">Bereit?</div>';
    h += '<p class="qh-sub">Die Klasse tippt in der Library oben auf <b>„Quiz läuft — mitmachen"</b>.</p>';
    h += '<div class="qh-players">'+quizLive.players.map(function(p){ return '<span class="qh-chip">'+esc(p.name||'?')+'</span>'; }).join('')+'</div>';
    h += '<div class="qh-count">'+quizLive.players.length+' dabei</div>';
    h += '<button class="btn btn-primary tm-big" id="qhNext" type="button">Erste Frage ▶︎</button></div>';
  } else if(s.state === 'frage'){
    var left = Math.max(0, Math.round((s.sec||0) - (Date.now() - (s.startedAt||0))/1000));
    var count = Object.keys(quizLive.answered).filter(function(uid){ return quizLive.answered[uid].qIndex === s.qIndex; }).length;
    h += '<div class="qh-q"><div class="qh-qnum">Frage '+((s.qIndex||0)+1)+' / '+(s.totalQ||0)+'</div>';
    h += '<div class="qh-qtext">'+esc(s.question ? s.question.text : '')+'</div>';
    h += '<div class="qh-answers">'+((s.question && s.question.answers)||[]).map(function(a, i){
      return a ? '<div class="qh-a qh-a-'+i+'"><b>'+['▲','◆','●','■'][i]+'</b>'+esc(a)+'</div>' : '';
    }).join('')+'</div>';
    h += '<div class="qh-timer'+(left<=5?' qh-timer-hot':'')+'">'+left+'</div>';
    h += '<div class="qh-count">'+count+' von '+quizLive.players.length+' geantwortet</div>';
    h += '<button class="btn btn-primary tm-big" id="qhReveal" type="button">Auflösen</button></div>';
  } else if(s.state === 'aufloesung'){
    var total = (s.stats||[]).reduce(function(a,b){ return a+b; }, 0) || 1;
    h += '<div class="qh-q"><div class="qh-qnum">Auflösung</div>';
    h += '<div class="qh-qtext">'+esc(s.question ? s.question.text : '')+'</div>';
    h += '<div class="qh-answers">'+((s.question && s.question.answers)||[]).map(function(a, i){
      if(!a) return '';
      var n = (s.stats && s.stats[i]) || 0;
      return '<div class="qh-a qh-a-'+i+(i===s.correctIndex?' qh-a-right':' qh-a-wrong')+'">'
           + '<b>'+['▲','◆','●','■'][i]+'</b>'+esc(a)
           + '<span class="qh-a-bar"><i style="width:'+Math.round(n/total*100)+'%"></i></span><span class="qh-a-n">'+n+'</span></div>';
    }).join('')+'</div>';
    h += '<div class="qh-lead">'+quizLeaderboard().slice(0,5).map(function(p, i){
      return '<span class="qh-chip">'+(i+1)+'. '+esc(p.name||'?')+' <b>'+(p.score||0)+'</b></span>';
    }).join('')+'</div>';
    h += '<button class="btn btn-primary tm-big" id="qhNext" type="button">'
       + (((s.qIndex||0)+1) < (s.totalQ||0) ? 'Nächste Frage ▶︎' : 'Schlussrangliste 🏆') + '</button></div>';
  } else if(s.state === 'ende'){
    var lb = quizLeaderboard();
    h += '<div class="qh-end"><div class="qh-big">🏆 Rangliste</div>';
    h += '<ol class="qh-podium">'+lb.slice(0,12).map(function(p){
      return '<li><span>'+esc(p.name||'?')+'</span><b>'+(p.score||0)+'</b></li>';
    }).join('')+'</ol>';
    h += '<button class="btn btn-ghost tm-big" id="qhFinish" type="button">Fertig</button></div>';
  } else {
    h += '<div class="qh-lobby"><div class="qh-big">…</div></div>';
  }

  stage.innerHTML = h;
  var nextBtn = stage.querySelector('#qhNext');
  if(nextBtn) nextBtn.addEventListener('click', function(){ quizNextStep(quiz); });
  var revealBtn = stage.querySelector('#qhReveal');
  if(revealBtn) revealBtn.addEventListener('click', function(){ quizReveal(quiz); });
  var finishBtn = stage.querySelector('#qhFinish');
  if(finishBtn) finishBtn.addEventListener('click', function(){ if(quizLive.overlay) quizLive.overlay.close(); });
}

function quizNextStep(quiz){
  var s = quizLive.session || {};
  var nextIndex = (typeof s.qIndex === 'number' ? s.qIndex : -1) + 1;
  var questions = quiz.questions || [];
  if(nextIndex >= questions.length){
    setDoc(quizSessionRef(), { state:'ende', question:null, updatedAt: serverTimestamp() }, {merge:true})
      .catch(function(err){ console.error(err); });
    return;
  }
  var q = questions[nextIndex];
  setDoc(quizSessionRef(), {
    state:'frage', qIndex: nextIndex,
    question: { text: q.q, answers: q.a },
    sec: q.sec || 25, startedAt: Date.now(),
    correctIndex: -1, stats: [], updatedAt: serverTimestamp()
  }, {merge:true}).catch(function(err){ console.error(err); toast('Frage konnte nicht gestartet werden.'); });
}

function quizReveal(quiz){
  var s = quizLive.session || {};
  var qIndex = s.qIndex || 0;
  var q = (quiz.questions || [])[qIndex];
  if(!q) return;
  var sec = q.sec || 25;

  getDocs(quizAnswersCol()).then(function(snap){
    var stats = [0,0,0,0];
    var updates = [];
    var byUid = {};
    quizLive.players.forEach(function(p){ byUid[p.uid] = p; });

    snap.forEach(function(d){
      var a = d.data();
      if(a.qIndex !== qIndex) return;
      if(typeof a.choice === 'number' && a.choice >= 0 && a.choice < 4) stats[a.choice]++;
      var player = byUid[d.id];
      var gained = 0;
      if(a.choice === q.c){
        // Grundpunkte plus Tempo-Bonus — schnell und richtig lohnt sich.
        var usedSec = Math.max(0, Math.min(sec, (a.at - (s.startedAt||a.at))/1000));
        gained = 500 + Math.round(500 * (1 - usedSec/sec));
      }
      updates.push({
        uid: d.id,
        name: (player && player.name) || a.name || '?',
        score: ((player && player.score) || 0) + gained,
        correct: ((player && player.correct) || 0) + (gained > 0 ? 1 : 0)
      });
    });

    var batch = writeBatch(db);
    updates.forEach(function(u){
      batch.set(doc(quizPlayersCol(), u.uid), { name:u.name, score:u.score, correct:u.correct }, {merge:true});
    });
    return batch.commit().then(function(){
      return setDoc(quizSessionRef(), {
        state:'aufloesung', correctIndex: q.c, stats: stats, updatedAt: serverTimestamp()
      }, {merge:true});
    });
  }).catch(function(err){ console.error(err); toast('Auflösen fehlgeschlagen.'); });
}

/* ---------- Schüler:innen: mitspielen ---------- */

var quizPlay = { choice:null, lastQIndex:-1 };

function renderQuizPlay(){
  var s = quizLive.session;
  if(!quizIsRunning(s)){
    state.route = {name:'home'};
    render();
    return;
  }
  if(s.qIndex !== quizPlay.lastQIndex){ quizPlay.lastQIndex = s.qIndex; quizPlay.choice = null; }

  var html = '';
  html += '<div class="qp-wrap">';
  html += '<div class="qp-head"><b>🎮 '+esc(s.title||'Quiz')+'</b>'
        + '<button class="btn btn-ghost btn-sm" id="qpLeave" type="button">Verlassen</button></div>';

  if(s.state === 'lobby'){
    html += '<div class="qp-mid"><div class="qp-big">Du bist dabei!</div><p>Gleich geht es los …</p></div>';
  } else if(s.state === 'frage'){
    var left = Math.max(0, Math.round((s.sec||0) - (Date.now() - (s.startedAt||0))/1000));
    html += '<div class="qp-timer'+(left<=5?' qh-timer-hot':'')+'">'+left+'</div>';
    html += '<div class="qp-q">'+esc(s.question ? s.question.text : '')+'</div>';
    html += '<div class="qp-answers">'+((s.question && s.question.answers)||[]).map(function(a, i){
      if(!a) return '';
      return '<button class="qp-a qh-a-'+i+(quizPlay.choice===i?' qp-a-picked':'')+'" type="button" data-choice="'+i+'">'
           + '<b>'+['▲','◆','●','■'][i]+'</b>'+esc(a)+'</button>';
    }).join('')+'</div>';
    if(quizPlay.choice !== null) html += '<div class="qp-note">Antwort abgeschickt ✓</div>';
  } else if(s.state === 'aufloesung'){
    var right = quizPlay.choice === s.correctIndex;
    var me = quizLive.players.filter(function(p){ return p.uid === state.user.uid; })[0];
    html += '<div class="qp-mid '+(right?'qp-right':'qp-wrong')+'">';
    html += '<div class="qp-big">'+(quizPlay.choice === null ? '⏳ Keine Antwort' : (right ? '✅ Richtig!' : '❌ Leider falsch'))+'</div>';
    html += '<p>Richtig war: <b>'+esc((s.question && s.question.answers && s.question.answers[s.correctIndex]) || '')+'</b></p>';
    if(me) html += '<div class="qp-score">'+(me.score||0)+' Punkte</div>';
    html += '</div>';
  } else if(s.state === 'ende'){
    var lb = quizLeaderboard();
    var rank = lb.map(function(p){ return p.uid; }).indexOf(state.user.uid);
    html += '<div class="qp-mid"><div class="qp-big">🏆 Rangliste</div>';
    if(rank >= 0) html += '<p>Du bist auf Platz <b>'+(rank+1)+'</b> von '+lb.length+'.</p>';
    html += '<ol class="qh-podium">'+lb.slice(0,10).map(function(p){
      return '<li'+(p.uid===state.user.uid?' class="qp-me"':'')+'><span>'+esc(p.name||'?')+'</span><b>'+(p.score||0)+'</b></li>';
    }).join('')+'</ol></div>';
  }
  html += '</div>';

  renderChrome(html);
  document.getElementById('qpLeave').addEventListener('click', function(){ state.route = {name:'home'}; render(); });
  Array.prototype.forEach.call(document.querySelectorAll('[data-choice]'), function(b){
    b.addEventListener('click', function(){
      if(quizPlay.choice !== null) return;   // eine Antwort pro Frage
      var c = parseInt(b.getAttribute('data-choice'),10);
      quizPlay.choice = c;
      playBlip();
      setDoc(doc(quizAnswersCol(), state.user.uid), {
        qIndex: s.qIndex, choice: c, at: Date.now(), name: state.profile.displayName
      }).catch(function(err){ console.error(err); toast('Antwort kam nicht an.'); });
      renderQuizPlay();
    });
  });

  // Den Countdown weiterlaufen lassen, ohne auf ein Firestore-Update zu warten.
  clearTimeout(quizPlay.tick);
  if(s.state === 'frage'){ quizPlay.tick = setTimeout(function(){ if(state.route.name==='quizplay') renderQuizPlay(); }, 500); }
}

function joinQuiz(){
  if(!quizIsRunning(quizLive.session)) return;
  // Eigener Spieler-Eintrag mit 0 Punkten; die Punkte setzt danach nur noch
  // das Lehrer-Gerät (siehe firestore.rules). Beim erneuten Beitreten während
  // derselben Runde darf der Eintrag NICHT neu geschrieben werden - das würde
  // den bereits erspielten Punktestand auf 0 zurücksetzen (und die Regel, die
  // genau das verhindert, den Schreibvorgang ablehnen).
  var playerRef = doc(quizPlayersCol(), state.user.uid);
  getDoc(playerRef).then(function(snap){
    if(snap.exists()) return null;
    return setDoc(playerRef, { name: state.profile.displayName, score: 0, correct: 0 });
  }).catch(function(err){ console.error(err); });
  if(!quizLive.unsubPlayers){
    quizLive.unsubPlayers = onSnapshot(quizPlayersCol(), function(snap){
      quizLive.players = [];
      snap.forEach(function(d){ quizLive.players.push(Object.assign({uid:d.id}, d.data())); });
      if(state.route.name === 'quizplay') renderQuizPlay();
    }, function(err){ console.error(err); });
  }
  quizPlay.lastQIndex = -1;
  state.route = {name:'quizplay'};
  render();
}



/* ===================== 🏫 KLASSENZIMMER (Sammelseite der Werkzeuge) ===================== */

function renderKlassenzimmer(){
  clearSubjectWatchers(); clearOverviewWatchers();
  var tiles = [
    { id:'beamer',  icon:'⏱',  name:'Ruhephase',           desc:'Countdown, Lärmampel und wer gerade sprechen darf — in einem Bild.' },
    { id:'dran',    icon:'🎲', name:'Wer ist dran?',       desc:'Faire Zufallsziehung — wer schon oft dran war, kommt seltener.' },
    { id:'sitzplan',icon:'🪑', name:'Sitzplan',            desc:'Möbel stellen, Plätze verteilen, Regeln, Zufall und gespeicherte Varianten.' },
    { id:'quiz',    icon:'🎮', name:'Klassen-Quiz',        desc:'Live-Quiz auf den Geräten der Klasse, Rangliste am Beamer.' },
    { id:'fragen',  icon:'❓', name:'Fragebox',            desc:'Anonyme Fragen der Klasse lesen und beantworten.' }
  ];
  var html = '';
  html += '<div class="back-row"><button class="btn btn-ghost btn-sm" id="backBtn" type="button">&larr; Startseite</button></div>';
  html += '<h2 class="page-welcome" style="margin-bottom:6px;">🏫 Klassenzimmer</h2>';
  html += '<p class="kz-intro">Werkzeuge für den Unterricht — nur für dich sichtbar.</p>';
  html += '<div class="kz-tiles">';
  tiles.forEach(function(t){
    html += '<button class="kz-tile" data-tool="'+t.id+'" type="button">';
    html += '<div class="kz-tile-icon">'+t.icon+'</div>';
    html += '<div><h3>'+esc(t.name)+'</h3><p>'+esc(t.desc)+'</p></div></button>';
  });
  html += '</div>';
  html += '<p class="kz-intro" style="margin-top:22px;">Den <b>Live-Klassenraum</b> öffnest du direkt in einer Übung — dort oben rechts auf 📡 Live.</p>';
  renderChrome(html);

  document.getElementById('backBtn').addEventListener('click', goHome);
  Array.prototype.forEach.call(document.querySelectorAll('[data-tool]'), function(b){
    b.addEventListener('click', function(){
      var id = b.getAttribute('data-tool');
      if(id === 'beamer') openBeamerTools('ruhe');
      else if(id === 'dran') openBeamerTools('dran');
      else if(id === 'sitzplan'){ state.route = {name:'sitzplan'}; render(); }
      else if(id === 'quiz'){ state.route = {name:'quiz'}; render(); }
      else if(id === 'fragen') openFragebox();
    });
  });
}

/* ===================== 📶 OFFLINE-ANZEIGE =====================
   Der Service Worker (sw-push.js) legt die App-Hülle in einen Cache, und die
   Firestore-Persistenz oben hält die bereits geöffneten Übungen vor. Hier geht
   es nur darum, dass man den Zustand auch SIEHT — sonst wirkt eine Übung, die
   offline aus dem Cache kommt, wie ein Fehler. */

function updateOnlineBadge(){
  var el = document.getElementById('offlineBadge');
  if(!el) return;
  el.hidden = navigator.onLine !== false;
}
window.addEventListener('online', function(){ updateOnlineBadge(); toast('Wieder online — dein Stand wird synchronisiert.'); });
window.addEventListener('offline', function(){ updateOnlineBadge(); toast('Offline — geöffnete Übungen laufen weiter.'); });

function registerAppServiceWorker(){
  if(!('serviceWorker' in navigator) || !window.isSecureContext) return;
  navigator.serviceWorker.register('sw-push.js').catch(function(err){
    console.error('Service Worker konnte nicht registriert werden', err);
  });
}

/* ===================== MAIN RENDER ===================== */

function render(){
  clearOverviewWatchers();
  // Übung verlassen: Stand und Lernzeit ein letztes Mal sichern, Beobachtung stoppen.
  if(state.route.name !== 'resource' && syncState.resourceId){
    stopResourceSync();
    currentViewerResourceId = null;
  }
  if(state.route.name !== 'resource' && timeTrack.resourceId){
    stopTimeTracking();
  }
  if(state.route.name === 'loading'){
    app.innerHTML = '<div class="spinner-wrap">Lädt …</div>';
    return;
  }
  if(state.route.name === 'login'){ renderLogin(); return; }
  if(!state.profile){ app.innerHTML = '<div class="spinner-wrap">Lädt …</div>'; return; }
  if(state.route.name === 'home'){ renderHome(); return; }
  if(state.route.name === 'subject'){ renderSubject(state.route.subject, state.route.folderId || null); return; }
  if(state.route.name === 'resource'){ renderResource(state.route.resource); return; }
  if(state.route.name === 'diktatauswertung'){ renderDiktatAuswertung(); return; }
  if(state.route.name === 'lernstand'){ renderLernstandUebersicht(); return; }
  if(state.route.name === 'kalender'){ renderKalender(); return; }
  if(state.route.name === 'klassenzimmer'){ renderKlassenzimmer(); return; }
  if(state.route.name === 'sitzplan'){ renderSitzplan(); return; }
  if(state.route.name === 'quiz'){ renderQuizVerwaltung(); return; }
  if(state.route.name === 'quizplay'){ renderQuizPlay(); return; }
}

// App-Hülle offline verfügbar machen (siehe sw-push.js).
registerAppServiceWorker();
</script>
