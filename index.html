var FS_ICON_ENTER = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M8 3H5a2 2 0 0 0-2 2v3M16 3h3a2 2 0 0 1 2 2v3M8 21H5a2 2 0 0 1-2-2v-3M16 21h3a2 2 0 0 0 2-2v-3"/></svg> Vollbild';
var FS_ICON_EXIT = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 3v3a2 2 0 0 1-2 2H4M15 3v3a2 2 0 0 0 2 2h3M9 21v-3a2 2 0 0 0-2-2H4M15 21v-3a2 2 0 0 1 2-2h3"/></svg> Vollbild verlassen';
var fullscreenListenerAttached = false;

// Fullscreens the viewer's frame wrapper (not the iframe itself) so it works
// consistently across browsers. Looks elements up by id on every call/event
// rather than closing over them, so this is safe to call again on every
// resource-viewer render without leaking stale references or duplicate
// document-level listeners.
function isPseudoFsActive(){
  var wrap = document.getElementById('frameWrap');
  return !!(wrap && wrap.classList.contains('pseudo-fullscreen'));
}

function enterPseudoFullscreen(){
  var wrap = document.getElementById('frameWrap');
  if(!wrap) return;
  wrap.classList.add('pseudo-fullscreen');
  document.body.classList.add('pseudo-fs-active');
  updateFsButtonLabel();
}

function exitPseudoFullscreen(){
  var wrap = document.getElementById('frameWrap');
  if(!wrap) return;
  wrap.classList.remove('pseudo-fullscreen');
  document.body.classList.remove('pseudo-fs-active');
  updateFsButtonLabel();
}

function updateFsButtonLabel(){
  var wrap = document.getElementById('frameWrap');
  var btn = document.getElementById('fsBtn');
  if(!wrap || !btn) return;
  var isFs = (document.fullscreenElement || document.webkitFullscreenElement) === wrap || isPseudoFsActive();
  btn.innerHTML = isFs ? FS_ICON_EXIT : FS_ICON_ENTER;
}

function exitFullscreenNow(){
  if(isPseudoFsActive()){ exitPseudoFullscreen(); return; }
  if(document.fullscreenElement || document.webkitFullscreenElement){
    var action = (document.exitFullscreen || document.webkitExitFullscreen).call(document);
    if(action && action.catch){ action.catch(function(){}); }
  }
}

function wireFullscreen(){
  var wrap = document.getElementById('frameWrap');
  var btn = document.getElementById('fsBtn');
  var exitBtn = document.getElementById('fsExitBtn');
  if(!wrap || !btn) return;
  // Safari on iOS (incl. installed Home-Screen apps) has no Fullscreen API for
  // arbitrary elements at all — requestFullscreen/webkitRequestFullscreen are
  // simply undefined there. Rather than hiding the buttons (old behaviour),
  // fall back to the CSS-only pseudo-fullscreen so the app version gets the
  // same enter/exit button pair as desktop.
  var nativeSupported = !!(wrap.requestFullscreen || wrap.webkitRequestFullscreen);
  btn.addEventListener('click', function(){
    var w = document.getElementById('frameWrap');
    if(!w) return;
    if(!nativeSupported){
      if(isPseudoFsActive()){ exitPseudoFullscreen(); } else { enterPseudoFullscreen(); }
      return;
    }
    var isFs = (document.fullscreenElement || document.webkitFullscreenElement) === w;
    if(isFs){ exitFullscreenNow(); return; }
    var action = (w.requestFullscreen || w.webkitRequestFullscreen).call(w);
    if(action && action.catch){
      action.catch(function(){
        // Native request refused at runtime (rare) — fall back to the CSS
        // version instead of leaving the user with a dead button.
        enterPseudoFullscreen();
      });
    }
  });
  // #fsBtn sits in .viewer-head, OUTSIDE #frameWrap — once #frameWrap is the
  // fullscreen element (native or pseudo), #fsBtn is no longer on screen at all
  // (only the fullscreen element and its descendants render), so it can't be
  // clicked to get back out. #fsExitBtn lives inside #frameWrap instead (see
  // CSS: shown while :fullscreen or .pseudo-fullscreen) so there's always a
  // visible, clickable way out besides Esc (and Esc doesn't even apply to the
  // CSS fallback, since that isn't the real Fullscreen API).
  if(exitBtn){ exitBtn.addEventListener('click', exitFullscreenNow); }
  updateFsButtonLabel();
  if(!fullscreenListenerAttached){
    document.addEventListener('fullscreenchange', updateFsButtonLabel);
    document.addEventListener('webkitfullscreenchange', updateFsButtonLabel);
    document.addEventListener('keydown', function(e){
      if(e.key === 'Escape' && isPseudoFsActive()){ exitPseudoFullscreen(); }
    });
    fullscreenListenerAttached = true;
  }
}

function updateViewerProgress(p){
  var el = document.getElementById('viewerProgress');
  if(!el) return;
  if(!p || p.attempted===0){ el.textContent = 'Noch nicht geübt'; return; }
  var parts = [];
  if(p.total){ parts.push(p.attempted+' / '+p.total+' geübt'); } else { parts.push(p.attempted+' bearbeitet'); }
  if(p.correctPct!==null){ parts.push(p.correctPct+'% richtig'); }
  el.textContent = parts.join(' · ');
}

window.addEventListener('message', function(e){
  var data = e.data;
  if(!data || !data.__libProgress || !currentViewerResourceId || !state.user) return;
  var resourceId = currentViewerResourceId;
  // Eine Fortschrittsmeldung heisst: in der Übung ist gerade etwas passiert —
  // guter Moment, auch den localStorage-Stand einzusammeln.
  checkLocalChanges(resourceId);
  clearTimeout(progressWriteTimers[resourceId]);
  progressWriteTimers[resourceId] = setTimeout(function(){
    writeProgressWithHistory(state.user.uid, resourceId, {
      stats: data.stats || {},
      total: typeof data.total === 'number' ? data.total : null,
      updatedAt: serverTimestamp()
    }).catch(function(err){ console.error('progress write failed', err); });
  }, 500);
});


/* =====================================================================
   KLASSENZIMMER-WERKZEUGE
   =====================================================================
   Alles, was unten folgt, hängt am Lehrerbereich bzw. an der Startseite:
   Beamer-Werkzeuge (Ruhephase, Wer ist dran), Live-Klassenraum,
   Sitzplan, anonyme Fragebox, Lern-Streak und Klassen-Quiz.

   Gemeinsame Regeln in diesem Block:
   - Overlays hängen an document.body, NICHT in #app — render() baut #app
     komplett neu auf und würde sie sonst mitten im Betrieb wegräumen.
   - Das Overlay selbst geht in den nativen Vollbildmodus; alle Knöpfe sind
     darum Nachfahren davon (Geschwister werden im Vollbild nicht gerendert).
     Ohne Fullscreen-API (iOS-Safari im Homescreen-Modus) ist das
     position:fixed;inset:0 des Overlays bereits das Pseudo-Vollbild.
   - Keine nativen Dialoge (confirm/alert/prompt) — nur openModal & Co.
   - Firestore-Queries mit höchstens einem where() und ohne orderBy(),
     sortiert wird client-seitig (keine Composite Indexes).
   ===================================================================== */

var overlayStack = [];

// Legt ein Vollbild-Overlay an. onClose wird beim Schliessen aufgerufen, damit
// laufende Timer/Mikrofon-Streams/Listener sauber abgeräumt werden können.
function openOverlay(innerHtml, onClose, extraClass){
  var el = document.createElement('div');
  el.className = 'kz-overlay' + (extraClass ? ' ' + extraClass : '');
  el.innerHTML = innerHtml;
  document.body.appendChild(el);
  var entry = { el: el, onClose: onClose || null };
  overlayStack.push(entry);
  // Dialoge und Toasts mit ins Overlay nehmen. Im nativen Vollbild wird NUR
  // das Vollbild-Element samt Nachfahren gerendert — als Geschwister von
  // #app blieben Dialog und Toast unsichtbar (genau der Fehler, der die
  // Übungsseiten schon einmal weiss gerendert hat).
  adoptOverlayChrome(el);
  try{ if(el.requestFullscreen) el.requestFullscreen().catch(function(){}); }catch(e){}
  document.addEventListener('keydown', overlayEscHandler);
  return {
    el: el,
    close: function(){ closeOverlay(entry); }
  };
}

function closeOverlay(entry){
  var i = overlayStack.indexOf(entry);
  if(i < 0) return;
  overlayStack.splice(i, 1);
  try{ if(entry.onClose) entry.onClose(); }catch(e){ console.error(e); }
  adoptOverlayChrome(overlayStack.length ? overlayStack[overlayStack.length-1].el : document.body);
  if(entry.el && entry.el.parentNode) entry.el.parentNode.removeChild(entry.el);
  if(!overlayStack.length){
    document.removeEventListener('keydown', overlayEscHandler);
    try{ if(document.fullscreenElement) document.exitFullscreen(); }catch(e){}
  }
}

// Hängt Dialog-Overlay und Toast unter das angegebene Element. Beide sind
// position:fixed, die Darstellung ändert sich dadurch nicht — nur, ob sie im
// nativen Vollbild überhaupt gezeichnet werden.
function adoptOverlayChrome(target){
  if(!target) target = document.body;
  if(modalEl && modalEl.parentNode !== target) target.appendChild(modalEl);
  if(toastEl && toastEl.parentNode !== target) target.appendChild(toastEl);
}

function overlayEscHandler(e){
  if(e.key !== 'Escape' || !overlayStack.length) return;
  // Läuft ein Dialog über dem Overlay, schliesst Escape zuerst den Dialog.
  if(modalEl.classList.contains('show')) return;
  closeOverlay(overlayStack[overlayStack.length-1]);
}

/* ---------- Töne ohne Audiodatei (WebAudio) ---------- */
// Gong/Piepser werden synthetisiert statt als Datei ausgeliefert: kein
// zusätzlicher Download, funktioniert auch offline.
var audioCtx = null;
function ensureAudio(){
  try{
    if(!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    if(audioCtx.state === 'suspended') audioCtx.resume();
    return audioCtx;
  }catch(e){ return null; }
}
function playTone(freq, seconds, type, gainPeak){
  var ctx = ensureAudio();
  if(!ctx) return;
  var osc = ctx.createOscillator(), gain = ctx.createGain();
  osc.type = type || 'sine';
  osc.frequency.value = freq;
  gain.gain.setValueAtTime(0.0001, ctx.currentTime);
  gain.gain.exponentialRampToValueAtTime(gainPeak || 0.25, ctx.currentTime + 0.02);
  gain.gain.exponentialRampToValueAtTime(0.0001, ctx.currentTime + seconds);
  osc.connect(gain); gain.connect(ctx.destination);
  osc.start(); osc.stop(ctx.currentTime + seconds + 0.05);
}
function playGong(){
  playTone(523.25, 1.6, 'sine', 0.3);
  setTimeout(function(){ playTone(392.00, 2.0, 'sine', 0.25); }, 90);
  setTimeout(function(){ playTone(261.63, 2.6, 'sine', 0.22); }, 180);
}
function playBlip(){ playTone(880, 0.12, 'triangle', 0.18); }

/* ===================== BEAMER-WERKZEUGE (Ruhephase · Wer ist dran · Würfel · Glücksrad · Stadt Land Fluss) =====================
   Mehrere Werkzeuge in einem Vollbild-Overlay. "Ruhephase" fasst Countdown,
   Lärmampel und die Liste der Kinder, die gerade sprechen dürfen, in EIN Bild
   zusammen — genau das steht im Unterricht gleichzeitig am Beamer. */

var beamer = { tab:'ruhe', overlay:null, cleanups:[] };

function openBeamerTools(initialTab){
  if(beamer.overlay) return;
  beamer.tab = initialTab || 'ruhe';
  var html = '';
  html += '<div class="kz-bar">';
  html += '<button class="kz-tab" data-tab="ruhe" type="button">⏱ Ruhephase</button>';
  html += '<button class="kz-tab" data-tab="dran" type="button">🎲 Wer ist dran?</button>';
  html += '<button class="kz-tab" data-tab="wuerfel" type="button">🎲 Würfel</button>';
  html += '<button class="kz-tab" data-tab="rad" type="button">🎡 Glücksrad</button>';
  html += '<button class="kz-tab" data-tab="slf" type="button">🌍 Stadt Land Fluss</button>';
  html += '<div class="kz-bar-spacer"></div>';
  html += gaesteToggleHtml('kzGaeste');
  html += '<button class="kz-close" id="kzClose" type="button" title="Schliessen (Esc)">✕</button>';
  html += '</div>';
  html += '<div class="kz-stage" id="kzStage"></div>';

  beamer.overlay = openOverlay(html, function(){
    runBeamerCleanups();
    beamer.overlay = null;
  }, 'kz-overlay-beamer');

  var root = beamer.overlay.el;
  root.querySelector('#kzClose').addEventListener('click', function(){ beamer.overlay.close(); });
  Array.prototype.forEach.call(root.querySelectorAll('.kz-tab[data-tab]'), function(btn){
    btn.addEventListener('click', function(){ switchBeamerTab(btn.getAttribute('data-tab')); });
  });
  wireGaesteToggle(root.querySelector('#kzGaeste'), function(){ switchBeamerTab(beamer.tab); });
  switchBeamerTab(beamer.tab);
}

function runBeamerCleanups(){
  beamer.cleanups.forEach(function(fn){ try{ fn(); }catch(e){} });
  beamer.cleanups = [];
}

function switchBeamerTab(tab){
  if(!beamer.overlay) return;
  // Beim Wechsel alles abräumen, was das vorherige Werkzeug laufen liess
  // (Intervalle, Mikrofon-Stream) — sonst läuft die Lärmampel im Hintergrund
  // weiter und hält das Mikrofon offen.
  runBeamerCleanups();
  beamer.tab = tab;
  var root = beamer.overlay.el;
  Array.prototype.forEach.call(root.querySelectorAll('.kz-tab[data-tab]'), function(b){
    b.classList.toggle('kz-tab-on', b.getAttribute('data-tab') === tab);
  });
  var stage = root.querySelector('#kzStage');
  if(tab === 'dran'){ mountWerIstDran(stage); return; }
  if(tab === 'wuerfel'){ mountWuerfel(stage); return; }
  if(tab === 'rad'){ mountGlueck(stage); return; }
  if(tab === 'slf'){ mountStadtLandFluss(stage); return; }

  stage.innerHTML = '<div class="rp-grid">'
    + '<div class="rp-col rp-col-timer" id="rpTimer"></div>'
    + '<div class="rp-col rp-col-ampel" id="rpAmpel"></div>'
    + '<div class="rp-col rp-col-speak" id="rpSpeak"></div>'
    + '</div>';
  mountTimer(stage.querySelector('#rpTimer'));
  mountAmpel(stage.querySelector('#rpAmpel'));
  mountSprecher(stage.querySelector('#rpSpeak'));
}

/* ---------- ⏱ Timer ---------- */

var TIMER_PRESETS = [1, 2, 3, 5, 10, 15, 20];

function fmtClock(sec){
  if(sec < 0) sec = 0;
  var m = Math.floor(sec/60), s = sec%60;
  return m + ':' + pad2(s);
}

function mountTimer(host){
  var t = { total: 5*60, left: 5*60, running:false, tick:null, done:false };
  var saved = parseInt(lsGet(LIB_PREFIX+'timer_min') || '5', 10);
  if(saved > 0 && saved <= 180){ t.total = saved*60; t.left = t.total; }

  var html = '';
  html += '<div class="tm-wrap">';
  html += '<div class="tm-ring-wrap"><svg class="tm-ring" viewBox="0 0 200 200" aria-hidden="true">';
  html += '<circle class="tm-ring-bg" cx="100" cy="100" r="90"></circle>';
  html += '<circle class="tm-ring-fg" id="tmRing" cx="100" cy="100" r="90"></circle>';
  html += '</svg><div class="tm-clock" id="tmClock">'+fmtClock(t.left)+'</div></div>';
  html += '<div class="tm-presets">';
  TIMER_PRESETS.forEach(function(m){ html += '<button class="btn btn-ghost tm-preset" data-min="'+m+'" type="button">'+m+'</button>'; });
  html += '<button class="btn btn-ghost tm-preset" id="tmCustom" type="button">…</button>';
  html += '</div>';
  html += '<div class="tm-actions">';
  html += '<button class="btn btn-primary tm-big" id="tmStart" type="button">▶︎ Start</button>';
  html += '<button class="btn btn-ghost tm-big" id="tmPlus" type="button">+1 min</button>';
  html += '<button class="btn btn-ghost tm-big" id="tmReset" type="button">↺</button>';
  html += '</div>';
  html += '</div>';
  host.innerHTML = html;

  var ringEl = host.querySelector('#tmRing');
  var clockEl = host.querySelector('#tmClock');
  var startBtn = host.querySelector('#tmStart');
  var CIRC = 2 * Math.PI * 90;
  ringEl.style.strokeDasharray = CIRC + ' ' + CIRC;

  function paint(){
    clockEl.textContent = fmtClock(t.left);
    var frac = t.total ? (t.left / t.total) : 0;
    ringEl.style.strokeDashoffset = String(CIRC * (1 - frac));
    host.classList.toggle('tm-warn', !t.done && t.left <= 10 && t.left > 0 && t.running);
    host.classList.toggle('tm-done', t.done);
    startBtn.textContent = t.running ? '❚❚ Pause' : '▶︎ Start';
  }
  function stop(){ clearInterval(t.tick); t.tick = null; t.running = false; }
  function start(){
    if(t.left <= 0) return;
    t.done = false;
    t.running = true;
    t.tick = setInterval(function(){
      t.left--;
      if(t.left <= 5 && t.left > 0) playBlip();
      if(t.left <= 0){ t.left = 0; stop(); t.done = true; playGong(); }
      paint();
    }, 1000);
    paint();
  }
  function setMinutes(m){
    stop(); t.done = false; t.total = m*60; t.left = t.total;
    lsSet(LIB_PREFIX+'timer_min', String(m));
    paint();
  }

  Array.prototype.forEach.call(host.querySelectorAll('.tm-preset[data-min]'), function(b){
    b.addEventListener('click', function(){ setMinutes(parseInt(b.getAttribute('data-min'),10)); });
  });
  host.querySelector('#tmCustom').addEventListener('click', function(){
    uiPrompt('Eigene Dauer', 'Minuten (1–180)', String(Math.round(t.total/60)), 'Setzen', function(v){
      var m = parseInt(v, 10);
      if(!(m >= 1 && m <= 180)){ toast('Bitte eine Zahl zwischen 1 und 180.'); return; }
      setMinutes(m);
    });
  });
  startBtn.addEventListener('click', function(){ if(t.running) { stop(); paint(); } else start(); });
  host.querySelector('#tmPlus').addEventListener('click', function(){
    t.left += 60; t.total = Math.max(t.total, t.left); t.done = false; paint();
  });
  host.querySelector('#tmReset').addEventListener('click', function(){ stop(); t.left = t.total; t.done = false; paint(); });

  paint();
  beamer.cleanups.push(stop);
}

/* ---------- 🔊 Lärmampel ----------
   Misst nur den Pegel über das Mikrofon (AnalyserNode) — es wird nichts
   aufgezeichnet, gespeichert oder übertragen. Bei verweigerter Freigabe
   erscheint eine Erklärung statt eines Fehlers. */

function mountAmpel(host){
  var thrGreen = parseInt(lsGet(LIB_PREFIX+'ampel_green') || '35', 10);
  var thrRed   = parseInt(lsGet(LIB_PREFIX+'ampel_red')   || '60', 10);
  var html = '';
  html += '<div class="am-wrap">';
  html += '<div class="am-lights" id="amLights">';
  html += '<div class="am-light am-red"><span></span></div>';
  html += '<div class="am-light am-yellow"><span></span></div>';
  html += '<div class="am-light am-green"><span></span></div>';
  html += '</div>';
  html += '<div class="am-level-wrap"><div class="am-level" id="amLevel"></div>'
        + '<div class="am-mark am-mark-g" id="amMarkG"></div><div class="am-mark am-mark-r" id="amMarkR"></div></div>';
  html += '</div>';
  html += '<div class="am-points" id="amPoints">Ruhe-Punkte: 0</div>';
  html += '<div class="am-status" id="amStatus">Mikrofon wird gefragt …</div>';
  html += '<div class="am-sliders">';
  html += '<label>grün/gelb <input type="range" id="amG" min="5" max="90" value="'+thrGreen+'"></label>';
  html += '<label>gelb/rot <input type="range" id="amR" min="10" max="99" value="'+thrRed+'"></label>';
  html += '<button class="btn btn-ghost btn-sm" id="amResetPts" type="button">Punkte zurücksetzen</button>';
  html += '</div>';
  host.innerHTML = html;

  var lightsEl = host.querySelector('#amLights');
  var levelEl  = host.querySelector('#amLevel');
  var statusEl = host.querySelector('#amStatus');
  var pointsEl = host.querySelector('#amPoints');
  var gEl = host.querySelector('#amG'), rEl = host.querySelector('#amR');
  var markG = host.querySelector('#amMarkG'), markR = host.querySelector('#amMarkR');
  var points = 0, stream = null, raf = null, ctx = null, stopped = false;
  var smooth = 0, lastPointAt = Date.now();

  function paintMarks(){
    markG.style.bottom = thrGreen + '%';
    markR.style.bottom = thrRed + '%';
  }
  gEl.addEventListener('input', function(){
    thrGreen = Math.min(parseInt(gEl.value,10), thrRed-5);
    gEl.value = thrGreen; lsSet(LIB_PREFIX+'ampel_green', String(thrGreen)); paintMarks();
  });
  rEl.addEventListener('input', function(){
    thrRed = Math.max(parseInt(rEl.value,10), thrGreen+5);
    rEl.value = thrRed; lsSet(LIB_PREFIX+'ampel_red', String(thrRed)); paintMarks();
  });
  host.querySelector('#amResetPts').addEventListener('click', function(){ points = 0; pointsEl.textContent = 'Ruhe-Punkte: 0'; });
  paintMarks();

  function cleanup(){
    stopped = true;
    if(raf) cancelAnimationFrame(raf);
    if(stream){ stream.getTracks().forEach(function(tr){ try{ tr.stop(); }catch(e){} }); stream = null; }
    if(ctx){ try{ ctx.close(); }catch(e){} ctx = null; }
  }
  beamer.cleanups.push(cleanup);

  if(!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia){
    statusEl.textContent = 'Dieses Gerät stellt kein Mikrofon zur Verfügung.';
    return;
  }
  navigator.mediaDevices.getUserMedia({audio:{echoCancellation:false, noiseSuppression:false, autoGainControl:false}}).then(function(s){
    if(stopped){ s.getTracks().forEach(function(tr){ tr.stop(); }); return; }
    stream = s;
    ctx = new (window.AudioContext || window.webkitAudioContext)();
    var src = ctx.createMediaStreamSource(s);
    var analyser = ctx.createAnalyser();
    analyser.fftSize = 1024;
    src.connect(analyser);
    var buf = new Float32Array(analyser.fftSize);
    statusEl.textContent = 'Läuft — es wird nichts aufgezeichnet.';

    function loop(){
      if(stopped) return;
      analyser.getFloatTimeDomainData(buf);
      var sum = 0;
      for(var i=0;i<buf.length;i++){ sum += buf[i]*buf[i]; }
      var rms = Math.sqrt(sum / buf.length);
      // dBFS grob auf 0–100 abbilden: -60 dB = still, -10 dB = sehr laut.
      var db = 20 * Math.log10(rms || 1e-7);
      var lvl = Math.max(0, Math.min(100, (db + 60) / 50 * 100));
      smooth = smooth * 0.82 + lvl * 0.18;
      var v = Math.round(smooth);
      levelEl.style.height = v + '%';
      var color = v < thrGreen ? 'green' : (v < thrRed ? 'yellow' : 'red');
      lightsEl.setAttribute('data-on', color);
      levelEl.setAttribute('data-on', color);
      if(color === 'green' && Date.now() - lastPointAt > 3000){
        lastPointAt = Date.now();
        points++;
        pointsEl.textContent = 'Ruhe-Punkte: ' + points;
      }
      if(color !== 'green') lastPointAt = Date.now();
      raf = requestAnimationFrame(loop);
    }
    loop();
  }).catch(function(){
    statusEl.textContent = 'Kein Zugriff aufs Mikrofon. In den Browser-Einstellungen für diese Seite erlauben und das Werkzeug neu öffnen.';
  });
}

/* ---------- 🗣 Wer darf sprechen ----------
   Während einer Ruhephase gibt es fast immer ein paar Kinder, die reden
   dürfen (Gruppenauftrag, Helferrolle, Vortragsvorbereitung). Die Liste steht
   gross am Beamer, damit nicht nachgefragt werden muss. Sie liegt lokal auf
   dem Gerät der Lehrperson (hl_-Präfix, wird darum nie in den Übungs-Sync
   gezogen) — es ist eine Momentaufnahme der Lektion, kein Datenbestand. */

var sprecherState = { uids:null, roster:null };

function loadSprecher(){
  if(sprecherState.uids) return sprecherState.uids;
  try{ sprecherState.uids = JSON.parse(lsGet(LIB_PREFIX+'speakers') || '[]') || []; }
  catch(e){ sprecherState.uids = []; }
  return sprecherState.uids;
}
function saveSprecher(){
  lsSet(LIB_PREFIX+'speakers', JSON.stringify(sprecherState.uids || []));
}

function mountSprecher(host){
  loadSprecher();
  function paint(){
    var roster = gaesteOptional(sprecherState.roster || []);
    var byUid = {};
    roster.forEach(function(s){ byUid[s.uid] = s; });
    var chosen = sprecherState.uids.filter(function(u){ return byUid[u]; });
    var rest = roster.filter(function(s){ return sprecherState.uids.indexOf(s.uid) < 0; });

    var h = '';
    h += '<div class="sk-head">🗣 dürfen FLÜSTERN</div>';
    h += '<div class="sk-chosen">';
    if(!chosen.length){
      h += '<div class="sk-none">'+(roster.length ? 'Niemand — es ist still.' : 'Klassenliste wird geladen …')+'</div>';
    } else {
      h += chosen.map(function(u){
        return '<button class="sk-chip" type="button" data-remove="'+esc(u)+'" title="Entfernen">'+esc(byUid[u].displayName)+'<span>✕</span></button>';
      }).join('');
    }
    h += '</div>';
    if(roster.length){
      h += '<div class="sk-add-label">Hinzufügen</div>';
      h += '<div class="sk-pool">'+rest.map(function(s){
        return '<button class="sk-pool-item" type="button" data-add="'+esc(s.uid)+'">'+esc(s.displayName)+'</button>';
      }).join('')+'</div>';
      if(chosen.length) h += '<button class="btn btn-ghost btn-sm sk-clear" id="skClear" type="button">Alle entfernen</button>';
    }
    host.innerHTML = h;

    Array.prototype.forEach.call(host.querySelectorAll('[data-add]'), function(b){
      b.addEventListener('click', function(){
        sprecherState.uids.push(b.getAttribute('data-add'));
        saveSprecher(); paint();
      });
    });
    Array.prototype.forEach.call(host.querySelectorAll('[data-remove]'), function(b){
      b.addEventListener('click', function(){
        var uid = b.getAttribute('data-remove');
        sprecherState.uids = sprecherState.uids.filter(function(u){ return u !== uid; });
        saveSprecher(); paint();
      });
    });
    var clearBtn = host.querySelector('#skClear');
    if(clearBtn) clearBtn.addEventListener('click', function(){
      sprecherState.uids = []; saveSprecher(); paint();
    });
  }

  paint();
  if(sprecherState.roster) return;
  loadStudentRoster().then(function(list){
    sprecherState.roster = list;
    if(beamer.overlay && beamer.tab === 'ruhe' && host.isConnected) paint();
  }).catch(function(err){ console.error(err); });
}

/* ---------- 🎲 Wer ist dran? ----------
   Gewichtete Ziehung: wer schon oft dran war, kommt seltener. Die Zählung
   liegt lokal (hl_-Präfix) und gehört zum Gerät der Lehrperson. */

var dranNames = null;

function dranCounts(){
  try{ return JSON.parse(lsGet(LIB_PREFIX+'dran_counts') || '{}') || {}; }catch(e){ return {}; }
}
function setDranCounts(c){ lsSet(LIB_PREFIX+'dran_counts', JSON.stringify(c)); }

function mountWerIstDran(stage){
  stage.innerHTML = '<div class="wd-wrap"><div class="wd-name" id="wdName">wird geladen …</div></div>';
  var fair = lsGet(LIB_PREFIX+'dran_fair') !== '0';

  function build(names){
    var counts = dranCounts();
    var html = '';
    html += '<div class="wd-wrap">';
    html += '<div class="wd-name" id="wdName">Bereit</div>';
    html += '<div class="wd-actions">';
    html += '<button class="btn btn-primary tm-big" id="wdDraw" type="button">🎲 Ziehen</button>';
    html += '<label class="wd-check"><input type="checkbox" id="wdFair"'+(fair?' checked':'')+'> Jede:r zuerst einmal</label>';
    html += '<button class="btn btn-ghost btn-sm" id="wdReset" type="button">Zähler zurücksetzen</button>';
    html += '</div>';
    html += '<div class="wd-list" id="wdList"></div>';
    html += '</div>';
    stage.innerHTML = html;

    var nameEl = stage.querySelector('#wdName');
    var listEl = stage.querySelector('#wdList');
    var spinning = false, spinTimer = null;

    function paintList(){
      listEl.innerHTML = names.map(function(n){
        var c = counts[n.uid] || 0;
        return '<span class="wd-chip'+(c?'':' wd-chip-new')+'">'+esc(n.displayName)+'<b>'+c+'</b></span>';
      }).join('');
    }
    function pool(){
      if(!fair) return names.slice();
      var min = Math.min.apply(null, names.map(function(n){ return counts[n.uid] || 0; }));
      return names.filter(function(n){ return (counts[n.uid] || 0) === min; });
    }
    function weightedPick(list){
      var weights = list.map(function(n){ var c = counts[n.uid] || 0; return 1 / Math.pow(c+1, 2); });
      var sum = weights.reduce(function(a,b){ return a+b; }, 0);
      var r = Math.random() * sum;
      for(var i=0;i<list.length;i++){ r -= weights[i]; if(r <= 0) return list[i]; }
      return list[list.length-1];
    }
    function draw(){
      if(spinning || !names.length) return;
      spinning = true;
      var list = pool();
      var winner = weightedPick(list);
      var t0 = Date.now(), dur = 2200;
      stage.classList.remove('wd-hit');
      (function spin(){
        var p = (Date.now()-t0)/dur;
        if(p >= 1){
          nameEl.textContent = winner.displayName;
          stage.classList.add('wd-hit');
          playGong();
          counts[winner.uid] = (counts[winner.uid] || 0) + 1;
          setDranCounts(counts);
          paintList();
          spinning = false;
          return;
        }
        nameEl.textContent = names[Math.floor(Math.random()*names.length)].displayName;
        playBlip();
        // gegen Ende immer langsamer — Slot-Machine-Effekt
        spinTimer = setTimeout(spin, 40 + 320 * p * p * p);
      })();
    }

    stage.querySelector('#wdDraw').addEventListener('click', draw);
    stage.querySelector('#wdFair').addEventListener('change', function(e){
      fair = e.target.checked; lsSet(LIB_PREFIX+'dran_fair', fair ? '1' : '0');
    });
    stage.querySelector('#wdReset').addEventListener('click', function(){
      uiConfirm('Zähler zurücksetzen?', 'Alle Ziehungs-Zähler gehen auf null.', 'Zurücksetzen', function(){
        counts = {}; setDranCounts(counts); paintList(); toast('Zähler zurückgesetzt.');
      }, true);
    });
    beamer.cleanups.push(function(){ clearTimeout(spinTimer); });
    paintList();
  }

  if(dranNames){ build(gaesteOptional(dranNames)); return; }
  loadStudentRoster().then(function(list){
    dranNames = list;
    if(beamer.tab === 'dran' && beamer.overlay) build(gaesteOptional(list));
  }).catch(function(err){
    console.error(err);
    stage.innerHTML = '<div class="wd-wrap"><div class="wd-name">Klassenliste konnte nicht geladen werden.</div></div>';
  });
}

/* ---------- 🎲 Würfel ----------
   1–6 Würfel gleichzeitig. W6 mit Augen, grössere Würfel als Zahl.
   Einstellungen bleiben lokal auf dem Gerät der Lehrperson (hl_-Präfix). */

var WUERFEL_SEITEN = [6, 10, 12, 20, 100];
// Augen-Positionen im 3×3-Raster, zeilenweise nummeriert 1–9
var WUERFEL_PIPS = {1:[5], 2:[3,7], 3:[3,5,7], 4:[1,3,7,9], 5:[1,3,5,7,9], 6:[1,3,4,6,7,9]};

function zufallInt(n){
  try{
    if(window.crypto && crypto.getRandomValues){
      var a = new Uint32Array(1); crypto.getRandomValues(a);
      return a[0] % n;
    }
  }catch(e){}
  return Math.floor(Math.random() * n);
}
function reduzierteBewegung(){
  try{ return window.matchMedia('(prefers-reduced-motion: reduce)').matches; }catch(e){ return false; }
}

// Leertaste startet Würfel/Rad. Auch auf einem fokussierten Knopf — dort wird
// die native Knopf-Aktion beim Loslassen unterdrückt, sonst löste die Taste
// zusätzlich den zuletzt geklickten Knopf (z. B. „Anzahl 3") aus.
function beamerSpaceKey(action){
  function isSpace(e){ return e.key === ' ' || e.code === 'Space'; }
  function skip(e){
    if(modalEl.classList.contains('show')) return true;
    var tag = (e.target && e.target.tagName) || '';
    return /^(INPUT|TEXTAREA|SELECT)$/.test(tag);
  }
  function down(e){
    if(!isSpace(e) || skip(e)) return;
    e.preventDefault();
    if(!e.repeat) action();
  }
  function up(e){ if(isSpace(e) && !skip(e)) e.preventDefault(); }
  document.addEventListener('keydown', down);
  document.addEventListener('keyup', up);
  beamer.cleanups.push(function(){
    document.removeEventListener('keydown', down);
    document.removeEventListener('keyup', up);
  });
}

function wuerfelFaceHtml(val, seiten){
  if(seiten !== 6) return '<span class="wu-num">'+val+'</span>';
  return WUERFEL_PIPS[val].map(function(p){
    var r = Math.floor((p-1)/3) + 1, c = (p-1) % 3 + 1;
    return '<span class="wu-pip" style="grid-row:'+r+';grid-column:'+c+'"></span>';
  }).join('');
}

function mountWuerfel(stage){
  var anzahl = parseInt(lsGet(LIB_PREFIX+'wuerfel_n') || '1', 10);
  if(!(anzahl >= 1 && anzahl <= 6)) anzahl = 1;
  var seiten = parseInt(lsGet(LIB_PREFIX+'wuerfel_seiten') || '6', 10);
  if(WUERFEL_SEITEN.indexOf(seiten) < 0) seiten = 6;
  var werte = [], verlauf = [], rolling = false, timer = null;

  function zufallsWerte(){
    werte = [];
    for(var i=0;i<anzahl;i++) werte.push(zufallInt(seiten) + 1);
  }

  var html = '<div class="wu-wrap" id="wuWrap">';
  html += '<div class="wu-dice" id="wuDice"></div>';
  html += '<div class="wu-sum" id="wuSum"></div>';
  html += '<button class="btn btn-primary tm-big" id="wuRoll" type="button">🎲 Würfeln</button>';
  html += '<div class="wu-settings">';
  html += '<span>Anzahl</span><span class="wu-seg">';
  for(var n=1;n<=6;n++) html += '<button class="wu-opt" data-n="'+n+'" type="button">'+n+'</button>';
  html += '</span>';
  html += '<span>Würfel</span><span class="wu-seg">';
  WUERFEL_SEITEN.forEach(function(s){ html += '<button class="wu-opt" data-s="'+s+'" type="button">W'+s+'</button>'; });
  html += '</span>';
  html += '</div>';
  html += '<div class="wu-history" id="wuHist"></div>';
  html += '<div class="wu-hint">Leertaste oder Klick auf einen Würfel würfelt ebenfalls.</div>';
  html += '</div>';
  stage.innerHTML = html;

  var wrapEl = stage.querySelector('#wuWrap');
  var diceEl = stage.querySelector('#wuDice');
  var sumEl = stage.querySelector('#wuSum');
  var histEl = stage.querySelector('#wuHist');
  var rollBtn = stage.querySelector('#wuRoll');

  function summe(){ return werte.reduce(function(a,b){ return a+b; }, 0); }
  function paintDice(){
    diceEl.innerHTML = werte.map(function(v){
      return '<button class="wu-die" type="button" aria-label="Würfel zeigt '+v+'">'+wuerfelFaceHtml(v, seiten)+'</button>';
    }).join('');
  }
  function paintInfo(){
    sumEl.textContent = (!rolling && anzahl > 1) ? 'Summe: ' + summe() : '';
    histEl.textContent = verlauf.length ? 'Zuletzt: ' + verlauf.join(' · ') : '';
    rollBtn.disabled = rolling;
    Array.prototype.forEach.call(stage.querySelectorAll('[data-n]'), function(b){
      b.classList.toggle('wu-opt-on', parseInt(b.getAttribute('data-n'),10) === anzahl);
    });
    Array.prototype.forEach.call(stage.querySelectorAll('[data-s]'), function(b){
      b.classList.toggle('wu-opt-on', parseInt(b.getAttribute('data-s'),10) === seiten);
    });
  }
  function roll(){
    if(rolling) return;
    rolling = true;
    wrapEl.classList.remove('wu-hit');
    wrapEl.classList.add('wu-rolling');
    paintInfo();
    var t0 = Date.now(), dur = reduzierteBewegung() ? 250 : 950, step = 0;
    timer = setInterval(function(){
      zufallsWerte(); paintDice();
      if(step++ % 2 === 0) playBlip();
      if(Date.now() - t0 < dur) return;
      clearInterval(timer); timer = null;
      rolling = false;
      wrapEl.classList.remove('wu-rolling');
      wrapEl.classList.add('wu-hit');
      playTone(660, 0.3, 'triangle', 0.22);
      verlauf.unshift(anzahl > 1 ? String(summe()) : String(werte[0]));
      if(verlauf.length > 10) verlauf.length = 10;
      paintInfo();
    }, 70);
  }

  diceEl.addEventListener('click', function(e){ if(e.target.closest('.wu-die')) roll(); });
  rollBtn.addEventListener('click', roll);
  Array.prototype.forEach.call(stage.querySelectorAll('[data-n]'), function(b){
    b.addEventListener('click', function(){
      if(rolling) return;
      anzahl = parseInt(b.getAttribute('data-n'),10);
      lsSet(LIB_PREFIX+'wuerfel_n', String(anzahl));
      verlauf = []; wrapEl.classList.remove('wu-hit');
      zufallsWerte(); paintDice(); paintInfo();
    });
  });
  Array.prototype.forEach.call(stage.querySelectorAll('[data-s]'), function(b){
    b.addEventListener('click', function(){
      if(rolling) return;
      seiten = parseInt(b.getAttribute('data-s'),10);
      lsSet(LIB_PREFIX+'wuerfel_seiten', String(seiten));
      verlauf = []; wrapEl.classList.remove('wu-hit');
      zufallsWerte(); paintDice(); paintInfo();
    });
  });
  beamerSpaceKey(roll);
  beamer.cleanups.push(function(){ if(timer) clearInterval(timer); timer = null; });

  zufallsWerte(); paintDice(); paintInfo();
}

/* ---------- 🎡 Glücksrad ----------
   Quelle ist entweder die Klasse (ohne die im Sitzplan als abwesend
   markierten Kinder) oder eine eigene Liste (lokal, hl_rad_eigene).
   „Gezogene rausnehmen" nimmt den Treffer erst beim NÄCHSTEN Drehen vom Rad —
   so bleibt er stehen, solange er am Beamer besprochen wird. Was schon
   gezogen wurde, merkt sich nur die laufende Sitzung. */

var GLUECK_FARBEN = [
  ['#3A3F73','#FFFFFF'], ['#E63950','#FFFFFF'], ['#2E9E5B','#FFFFFF'], ['#E8B72C','#1C2033'],
  ['#4A7FD9','#FFFFFF'], ['#8E5BC8','#FFFFFF'], ['#F08A3C','#1C2033'], ['#1FA3A3','#FFFFFF']
];
var GLUECK_EIGENE_DEFAULT = ['Aufgabe 1', 'Aufgabe 2', 'Aufgabe 3', 'Aufgabe 4'];
var glueck = { quelle:null, weg:{}, rot:0, klasse:null, abwesend:{}, letzter:null };

function glueckEigene(){
  try{
    var a = JSON.parse(lsGet(LIB_PREFIX+'rad_eigene') || 'null');
    if(Array.isArray(a)){
      a = a.filter(function(x){ return typeof x === 'string' && x.trim(); });
      if(a.length) return a;
    }
  }catch(e){}
  return GLUECK_EIGENE_DEFAULT.slice();
}

// null = Klassenliste noch nicht geladen
function glueckAlle(){
  if(glueck.quelle === 'eigene'){
    return glueckEigene().map(function(t, i){ return { key:'e'+i+'|'+t, label:t }; });
  }
  if(!glueck.klasse) return null;
  var list = gaesteOptional(glueck.klasse).filter(function(s){ return !glueck.abwesend[s.uid]; });
  var vornamen = {};
  function voll(s){ return s.displayName || s.username || '?'; }
  list.forEach(function(s){ var f = voll(s).split(' ')[0]; vornamen[f] = (vornamen[f] || 0) + 1; });
  return list.map(function(s){
    var f = voll(s).split(' ')[0];
    return { key:s.uid, label: vornamen[f] > 1 ? voll(s) : f };
  });
}

function glueckFarbe(i, n){
  var idx = i % GLUECK_FARBEN.length;
  // Letztes Feld darf nicht gleich aussehen wie das erste (Nachbarn im Kreis)
  if(n > 1 && i === n-1 && idx === 0){
    idx = 1;
    if((n-2) % GLUECK_FARBEN.length === 1) idx = 2;
  }
  return GLUECK_FARBEN[idx];
}

function glueckMod(a, m){ return ((a % m) + m) % m; }

function mountGlueck(stage){
  var TAU = Math.PI * 2;
  if(!glueck.quelle) glueck.quelle = lsGet(LIB_PREFIX+'rad_quelle') === 'eigene' ? 'eigene' : 'klasse';
  var wegNehmen = lsGet(LIB_PREFIX+'rad_weg') === '1';
  var spinning = false, raf = null, stopped = false, wheel = null;

  var html = '<div class="gl-wrap" id="glWrap">';
  html += '<div class="gl-wheel-box"><div class="gl-pointer"></div><canvas id="glCanvas"></canvas>';
  html += '<button class="gl-hub" id="glHub" type="button" aria-label="Drehen">Los!</button></div>';
  html += '<div class="gl-side">';
  html += '<div class="gl-result" id="glResult">&nbsp;</div>';
  html += '<button class="btn btn-primary tm-big" id="glSpin" type="button">🎡 Drehen</button>';
  html += '<span class="wu-seg"><button class="wu-opt" data-q="klasse" type="button">👥 Klasse</button>';
  html += '<button class="wu-opt" data-q="eigene" type="button">✏️ Eigene Liste</button></span>';
  html += '<button class="btn btn-ghost btn-sm" id="glEdit" type="button" style="display:none">Liste bearbeiten</button>';
  html += '<label class="wd-check"><input type="checkbox" id="glWeg"'+(wegNehmen?' checked':'')+'> Gezogene rausnehmen</label>';
  html += '<div class="gl-info" id="glInfo"></div>';
  html += '<button class="btn btn-ghost btn-sm" id="glBack" type="button" style="display:none">Alle wieder aufs Rad</button>';
  html += '</div></div>';
  stage.innerHTML = html;

  var wrapEl = stage.querySelector('#glWrap');
  var canvas = stage.querySelector('#glCanvas');
  var resultEl = stage.querySelector('#glResult');
  var infoEl = stage.querySelector('#glInfo');
  var spinBtn = stage.querySelector('#glSpin');
  var hubBtn = stage.querySelector('#glHub');
  var editBtn = stage.querySelector('#glEdit');
  var backBtn = stage.querySelector('#glBack');

  function draw(){
    var size = canvas.parentNode.clientWidth;
    if(!size) return;
    var dpr = window.devicePixelRatio || 1;
    var px = Math.round(size * dpr);
    if(canvas.width !== px){ canvas.width = px; canvas.height = px; }
    var ctx = canvas.getContext('2d');
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    ctx.clearRect(0, 0, size, size);
    var css = getComputedStyle(document.documentElement);
    var surface = css.getPropertyValue('--surface').trim() || '#FFFFFF';
    var ring = css.getPropertyValue('--text').trim() || '#1C2033';
    var c = size / 2, r = c - 6;
    var list = wheel || [];
    if(!list.length){
      ctx.beginPath(); ctx.arc(c, c, r, 0, TAU);
      ctx.fillStyle = css.getPropertyValue('--surface-2').trim() || '#EEF0F8'; ctx.fill();
    } else {
      var n = list.length, seg = TAU / n;
      var fontPx = Math.max(11, Math.min(34, r * 0.13, r * seg * 0.45));
      var maxW = r * 0.8 - 26;   // Platz bis zur Nabe (20 % des Durchmessers)
      for(var i=0;i<n;i++){
        var start = glueck.rot - Math.PI/2 + i*seg;
        var farbe = glueckFarbe(i, n);
        ctx.beginPath(); ctx.moveTo(c, c); ctx.arc(c, c, r, start, start + seg); ctx.closePath();
        ctx.fillStyle = farbe[0]; ctx.fill();
        if(n > 1){ ctx.lineWidth = 2; ctx.strokeStyle = surface; ctx.stroke(); }
        ctx.save();
        ctx.translate(c, c); ctx.rotate(start + seg/2);
        ctx.fillStyle = farbe[1];
        ctx.font = '700 ' + fontPx + "px 'Baloo 2', system-ui, sans-serif";
        ctx.textAlign = 'right'; ctx.textBaseline = 'middle';
        var t = list[i].label;
        if(ctx.measureText(t).width > maxW){
          while(t.length > 1 && ctx.measureText(t + '…').width > maxW) t = t.slice(0, -1);
          t += '…';
        }
        ctx.fillText(t, r - 16, 0);
        ctx.restore();
      }
    }
    ctx.beginPath(); ctx.arc(c, c, r, 0, TAU);
    ctx.lineWidth = 5; ctx.strokeStyle = ring; ctx.stroke();
  }

  function paint(){
    var alle = glueckAlle();
    Array.prototype.forEach.call(stage.querySelectorAll('[data-q]'), function(b){
      b.classList.toggle('wu-opt-on', b.getAttribute('data-q') === glueck.quelle);
      b.disabled = spinning;
    });
    editBtn.style.display = glueck.quelle === 'eigene' ? '' : 'none';
    editBtn.disabled = spinning;
    if(!alle){
      wheel = null;
      infoEl.textContent = 'Klassenliste wird geladen …';
      backBtn.style.display = 'none';
      spinBtn.disabled = hubBtn.disabled = true;
      draw();
      return;
    }
    wheel = alle.filter(function(e){ return !glueck.weg[e.key]; });
    var gezogen = alle.length - wheel.length;
    var info = wheel.length + (wheel.length === 1 ? ' Eintrag' : ' Einträge') + ' auf dem Rad';
    if(gezogen) info += ' · ' + gezogen + ' schon gezogen';
    if(glueck.quelle === 'klasse'){
      var ab = gaesteOptional(glueck.klasse).filter(function(s){ return glueck.abwesend[s.uid]; }).length;
      if(ab) info += ' · ' + ab + ' abwesend (laut Sitzplan)';
    }
    infoEl.textContent = info;
    backBtn.style.display = gezogen ? '' : 'none';
    backBtn.disabled = spinning;
    if(!wheel.length && !spinning){ resultEl.textContent = 'Alle gezogen 🎉'; wrapEl.classList.remove('gl-hit'); }
    spinBtn.disabled = hubBtn.disabled = spinning || !wheel.length;
    draw();
  }

  function spin(){
    if(spinning) return;
    if(wegNehmen && glueck.letzter) glueck.weg[glueck.letzter] = true;
    glueck.letzter = null;
    paint();
    if(!wheel || !wheel.length) return;
    var list = wheel, n = list.length, seg = TAU / n;
    function idxAt(rot){ return Math.floor(glueckMod(-rot, TAU) / seg) % n; }
    var w = zufallInt(n);
    // Zielwinkel irgendwo im inneren Bereich des Gewinnerfelds, nie auf der Kante
    var a = (w + 0.15 + Math.random() * 0.7) * seg;
    var start = glueck.rot;
    var reduce = reduzierteBewegung();
    var end = start + (reduce ? 0 : (5 + zufallInt(3)) * TAU) + glueckMod(-a - start, TAU);
    var dur = reduce ? 600 : 5200 + Math.random() * 1200;
    var t0 = performance.now(), lastIdx = idxAt(start), lastTick = 0;
    spinning = true;
    wrapEl.classList.remove('gl-hit');
    resultEl.textContent = '…';
    paint();

    function frame(now){
      if(stopped) return;
      var p = Math.min(1, (now - t0) / dur);
      glueck.rot = start + (end - start) * (1 - Math.pow(1 - p, 4));
      draw();
      var idx = idxAt(glueck.rot);
      if(idx !== lastIdx && now - lastTick > 45){ playBlip(); lastTick = now; }
      lastIdx = idx;
      if(p < 1){ raf = requestAnimationFrame(frame); return; }
      raf = null;
      glueck.rot = glueckMod(end, TAU);
      spinning = false;
      glueck.letzter = list[w].key;
      resultEl.textContent = list[w].label;
      wrapEl.classList.add('gl-hit');
      playGong();
      paint();
    }
    raf = requestAnimationFrame(frame);
  }

  function ladeKlasse(){
    Promise.all([
      klasseRosterLoad(),
      getDoc(kdoc('klassenzimmer', 'sitzplan')).catch(function(){ return null; })
    ]).then(function(r){
      glueck.klasse = r[0];
      glueck.abwesend = {};
      var sitz = (r[1] && r[1].exists()) ? r[1].data() : {};
      (sitz.absent || []).forEach(function(uid){ glueck.abwesend[uid] = true; });
      if(!stopped) paint();
    }).catch(function(err){
      console.error(err);
      if(!stopped) infoEl.textContent = 'Klassenliste konnte nicht geladen werden.';
    });
  }

  function bearbeiten(){
    openModal(
      '<h3>Eigene Liste</h3>'+
      '<p>Ein Eintrag pro Zeile (höchstens 60 Einträge).</p>'+
      '<textarea id="glListe" rows="10">'+esc(glueckEigene().join('\n'))+'</textarea>'+
      '<div class="modal-actions">'+
        '<button class="btn btn-ghost btn-sm" id="modalCancel" type="button">Abbrechen</button>'+
        '<button class="btn btn-primary btn-sm" id="modalOk" type="button">Speichern</button>'+
      '</div>'
    );
    var ta = document.getElementById('glListe');
    ta.focus();
    document.getElementById('modalCancel').addEventListener('click', closeModal);
    document.getElementById('modalOk').addEventListener('click', function(){
      var zeilen = ta.value.split('\n')
        .map(function(s){ return s.trim().slice(0, 40); })
        .filter(Boolean)
        .slice(0, 60);
      if(!zeilen.length){ toast('Mindestens ein Eintrag.'); ta.focus(); return; }
      lsSet(LIB_PREFIX+'rad_eigene', JSON.stringify(zeilen));
      closeModal();
      glueck.letzter = null;
      resultEl.innerHTML = '&nbsp;'; wrapEl.classList.remove('gl-hit');
      paint();
    });
  }

  spinBtn.addEventListener('click', spin);
  hubBtn.addEventListener('click', spin);
  editBtn.addEventListener('click', bearbeiten);
  Array.prototype.forEach.call(stage.querySelectorAll('[data-q]'), function(b){
    b.addEventListener('click', function(){
      if(spinning) return;
      var q = b.getAttribute('data-q');
      if(q === glueck.quelle) return;
      glueck.quelle = q;
      lsSet(LIB_PREFIX+'rad_quelle', q);
      glueck.letzter = null;
      resultEl.innerHTML = '&nbsp;'; wrapEl.classList.remove('gl-hit');
      paint();
    });
  });
  stage.querySelector('#glWeg').addEventListener('change', function(e){
    wegNehmen = e.target.checked;
    lsSet(LIB_PREFIX+'rad_weg', wegNehmen ? '1' : '0');
  });
  backBtn.addEventListener('click', function(){
    glueck.weg = {}; glueck.letzter = null;
    resultEl.innerHTML = '&nbsp;'; wrapEl.classList.remove('gl-hit');
    paint();
  });

  function onResize(){ if(!spinning) draw(); }
  window.addEventListener('resize', onResize);
  document.addEventListener('fullscreenchange', onResize);
  beamerSpaceKey(spin);
  beamer.cleanups.push(function(){
    stopped = true;
    if(raf) cancelAnimationFrame(raf);
    raf = null; spinning = false;
    window.removeEventListener('resize', onResize);
    document.removeEventListener('fullscreenchange', onResize);
  });

  paint();
  // Abwesenheiten bei jedem Öffnen frisch holen — sie ändern sich täglich.
  ladeKlasse();
  // Das Overlay ist evtl. noch nicht fertig ausgelegt — einmal nachzeichnen.
  requestAnimationFrame(function(){ if(!stopped && !spinning) draw(); });
}

/* ---------- 🌍 Stadt Land Fluss ----------
   Stadt und Land stehen immer vorne, drei weitere Kategorien sind entweder
   zufällig (aus SLF_KATEGORIEN) oder selbst festgelegt. Die Buchstaben-
   Drehscheibe kennt alle Buchstaben ausser X und Y; gezogene verschwinden bis
   „Alle Buchstaben zurück". Die Sanduhr läuft 1–3 Minuten, „STOPP!" beendet
   die Runde sofort (wenn jemand fertig ist). */

var SLF_BUCHSTABEN = 'ABCDEFGHIJKLMNOPQRSTUVWZ'.split('');
var SLF_KATEGORIEN = [
  'Fluss oder See', 'Tier', 'Pflanze', 'Beruf', 'Vorname',
  'Berühmte Person', 'Sportart', 'Marke', 'Essen', 'Getränk',
  'Musiker:in / Band', 'Film oder Serie', 'Videospiel', 'Fahrzeug', 'Kleidungsstück',
  'Körperteil', 'Farbe', 'Hobby', 'Etwas im Schulzimmer', 'Musikinstrument',
  'Obst oder Gemüse', 'Süssigkeit', 'App oder Website', 'Superheld:in / Comicfigur', 'Zeichentrickfigur',
  'Gefühl', 'Eigenschaft (Adjektiv)', 'Verb', 'Gegenstand im Haushalt', 'Werkzeug',
  'Ausrede fürs Zuspätkommen', 'Etwas für die Ferien', 'Etwas, das stinkt', 'Etwas, das Lärm macht', 'Etwas im Kühlschrank',
  'Sehenswürdigkeit', 'Sprache', 'Märchen- oder Fantasyfigur', 'Spiel', 'Kompliment',
  'Fussballclub', 'Wort mit 8+ Buchstaben', 'Englisches Wort', 'Schweizerdeutsches Wort', 'Etwas Rundes',
  'Berg oder Gebirge', 'Haustiername', 'Pizzabelag', 'Etwas zum Anziehen im Winter', 'Etwas, das man verlieren kann'
];
var SLF_ZEITEN = [60, 90, 120, 150, 180];
var slf = { rot:0, letzter:null };

function slfJson(key, fallback){
  try{ var v = JSON.parse(lsGet(LIB_PREFIX+key) || 'null'); return v == null ? fallback : v; }catch(e){ return fallback; }
}
function slfWeg(){
  var a = slfJson('slf_weg', []);
  return Array.isArray(a) ? a.filter(function(b){ return SLF_BUCHSTABEN.indexOf(b) >= 0; }) : [];
}
function slfZufallZiehen(alt){
  var pool = SLF_KATEGORIEN.slice(), out = [];
  // möglichst nicht dieselben wie eben
  var ohneAlt = pool.filter(function(k){ return (alt || []).indexOf(k) < 0; });
  if(ohneAlt.length >= 3) pool = ohneAlt;
  while(out.length < 3){ out.push(pool.splice(zufallInt(pool.length), 1)[0]); }
  return out;
}
function slfKategorien(){
  if(lsGet(LIB_PREFIX+'slf_modus') === 'eigene'){
    var e = slfJson('slf_eigene', []);
    if(Array.isArray(e) && e.filter(Boolean).length === 3) return e;
  }
  var z = slfJson('slf_zufall', null);
  if(!Array.isArray(z) || z.length !== 3){
    z = slfZufallZiehen();
    lsSet(LIB_PREFIX+'slf_zufall', JSON.stringify(z));
  }
  return z;
}

function slfSanduhrSvg(){
  var top = 'M12,14 H108 C108,58 66,78 62,96 H58 C54,78 12,58 12,14 Z';
  var bot = 'M58,104 H62 C66,122 108,142 108,186 H12 C12,142 54,122 58,104 Z';
  return '<svg class="slf-glass" viewBox="0 0 120 200" aria-hidden="true">'
    + '<defs><clipPath id="slfClipTop"><path d="'+top+'"/></clipPath><clipPath id="slfClipBot"><path d="'+bot+'"/></clipPath></defs>'
    + '<path class="slf-glass-bulb" d="'+top+'"/><path class="slf-glass-bulb" d="'+bot+'"/>'

    + '<rect id="slfSandBot" class="slf-sand" clip-path="url(#slfClipBot)" x="0" y="186" width="120" height="0"/>'

    + '<rect class="slf-glass-frame" x="4" y="186" width="112" height="10" rx="4"/>'
    + '</svg>';
}

function mountStadtLandFluss(stage){
  var TAU = Math.PI * 2;
  var spinning = false, raf = null, stopped = false, wheel = [];
  var sek = parseInt(lsGet(LIB_PREFIX+'slf_sek') || '120', 10);
  if(SLF_ZEITEN.indexOf(sek) < 0) sek = 120;
  var autoStart = lsGet(LIB_PREFIX+'slf_auto') !== '0';
  var uhr = { laeuft:false, ende:0, rest:sek*1000, tick:null, fertig:null, lastBeep:-1 };

  var html = '<div class="slf-wrap" id="slfWrap">';
  html += '<div class="gl-wheel-box slf-wheel-box"><div class="gl-pointer"></div><canvas id="slfCanvas"></canvas>';
  html += '<button class="gl-hub" id="slfHub" type="button" aria-label="Drehen">Los!</button></div>';
  html += '<div class="slf-mid">';
  html += '<div class="slf-letter" id="slfLetter">?</div>';
  html += '<div class="slf-cats" id="slfCats"></div>';
  html += '<div class="slf-used" id="slfUsed"></div>';
  html += '</div>';
  html += '<div class="slf-side">';
  html += '<div class="slf-glass-box">'+slfSanduhrSvg()+'<div class="slf-clock" id="slfClock"></div></div>';
  html += '<div class="slf-status" id="slfStatus">&nbsp;</div>';
  html += '<button class="btn slf-stop" id="slfStop" type="button">✋ STOPP!</button>';
  html += '<div class="slf-btns"><button class="btn btn-primary" id="slfSpin" type="button">🎡 Drehen</button>';
  html += '<button class="btn btn-ghost" id="slfStart" type="button">⏳ Start</button></div>';
  html += '<span class="wu-seg" id="slfZeiten">';
  SLF_ZEITEN.forEach(function(s){ html += '<button class="wu-opt" data-sek="'+s+'" type="button">'+fmtClock(s)+'</button>'; });
  html += '</span>';
  html += '<label class="wd-check"><input type="checkbox" id="slfAuto"'+(autoStart?' checked':'')+'> Sanduhr startet nach dem Drehen</label>';
  html += '<span class="wu-seg"><button class="wu-opt" data-modus="zufall" type="button">🎲 Zufällige Kategorien</button>';
  html += '<button class="wu-opt" data-modus="eigene" type="button">✏️ Eigene</button></span>';
  html += '<button class="btn btn-ghost btn-sm" id="slfKat" type="button"></button>';
  html += '<button class="btn btn-ghost btn-sm" id="slfReset" type="button">Alle Buchstaben zurück</button>';
  html += '</div></div>';
  stage.innerHTML = html;

  var wrapEl = stage.querySelector('#slfWrap');
  var canvas = stage.querySelector('#slfCanvas');
  var letterEl = stage.querySelector('#slfLetter');
  var catsEl = stage.querySelector('#slfCats');
  var usedEl = stage.querySelector('#slfUsed');
  var clockEl = stage.querySelector('#slfClock');
  var statusEl = stage.querySelector('#slfStatus');
  var spinBtn = stage.querySelector('#slfSpin');
  var hubBtn = stage.querySelector('#slfHub');
  var startBtn = stage.querySelector('#slfStart');
  var stopBtn = stage.querySelector('#slfStop');
  var katBtn = stage.querySelector('#slfKat');
  var resetBtn = stage.querySelector('#slfReset');
  var sandTop = stage.querySelector('#slfSandTop');
  var sandBot = stage.querySelector('#slfSandBot');
  var streamEl = stage.querySelector('#slfStream');

  function modus(){ return lsGet(LIB_PREFIX+'slf_modus') === 'eigene' ? 'eigene' : 'zufall'; }

  function draw(){
    var size = canvas.parentNode.clientWidth;
    if(!size) return;
    var dpr = window.devicePixelRatio || 1;
    var px = Math.round(size * dpr);
    if(canvas.width !== px){ canvas.width = px; canvas.height = px; }
    var ctx = canvas.getContext('2d');
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    ctx.clearRect(0, 0, size, size);
    var css = getComputedStyle(document.documentElement);
    var surface = css.getPropertyValue('--surface').trim() || '#FFFFFF';
    var ring = css.getPropertyValue('--text').trim() || '#1C2033';
    var c = size / 2, r = c - 6;
    if(!wheel.length){
      ctx.beginPath(); ctx.arc(c, c, r, 0, TAU);
      ctx.fillStyle = css.getPropertyValue('--surface-2').trim() || '#EEF0F8'; ctx.fill();
    } else {
      var n = wheel.length, seg = TAU / n;
      var fontPx = Math.max(12, Math.min(38, r * 0.14, r * seg * 0.7));
      for(var i=0;i<n;i++){
        var start = slf.rot - Math.PI/2 + i*seg;
        var farbe = glueckFarbe(i, n);
        ctx.beginPath(); ctx.moveTo(c, c); ctx.arc(c, c, r, start, start + seg); ctx.closePath();
        ctx.fillStyle = farbe[0]; ctx.fill();
        if(n > 1){ ctx.lineWidth = 2; ctx.strokeStyle = surface; ctx.stroke(); }
        ctx.save();
        ctx.translate(c, c); ctx.rotate(start + seg/2);
        ctx.translate(r - fontPx * 0.9, 0); ctx.rotate(Math.PI/2);
        ctx.fillStyle = farbe[1];
        ctx.font = '800 ' + fontPx + "px 'Baloo 2', system-ui, sans-serif";
        ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
        ctx.fillText(wheel[i], 0, 0);
        ctx.restore();
      }
    }
    ctx.beginPath(); ctx.arc(c, c, r, 0, TAU);
    ctx.lineWidth = 5; ctx.strokeStyle = ring; ctx.stroke();
  }

  function paintUhr(){
    var rest = uhr.laeuft ? Math.max(0, uhr.ende - Date.now()) : uhr.rest;
    var frac = sek ? rest / (sek*1000) : 0;
    clockEl.textContent = fmtClock(Math.ceil(rest/1000));
    // Sand oben sitzt am Hals (unten im oberen Kolben), unten wächst er vom Boden auf.
    var hTop = 82 * Math.sqrt(frac), hBot = 82 * Math.sqrt(1 - frac);
    sandTop.setAttribute('y', String(96 - hTop)); sandTop.setAttribute('height', String(hTop));
    sandBot.setAttribute('y', String(186 - hBot)); sandBot.setAttribute('height', String(hBot));
    streamEl.style.opacity = (uhr.laeuft && rest > 0) ? '1' : '0';
    wrapEl.classList.toggle('slf-warn', uhr.laeuft && rest <= 10000);
    startBtn.textContent = uhr.laeuft ? '❚❚ Pause' : uhr.fertig ? '⏳ Nochmals' : (uhr.rest < sek*1000 && uhr.rest > 0 ? '▶︎ Weiter' : '⏳ Start');
    stopBtn.disabled = !uhr.laeuft;
  }
  function uhrStop(){ clearInterval(uhr.tick); uhr.tick = null; if(uhr.laeuft){ uhr.rest = Math.max(0, uhr.ende - Date.now()); } uhr.laeuft = false; }
  function uhrReset(){ uhrStop(); uhr.rest = sek*1000; uhr.lastBeep = -1; uhr.fertig = null; wrapEl.classList.remove('slf-over'); paintUhr(); }
  function rundeEnde(text){
    uhrStop();
    uhr.fertig = text;
    statusEl.textContent = text;
    wrapEl.classList.add('slf-over');
    playGong();
    paintUhr();
    paint();
  }
  function uhrStart(){
    if(uhr.laeuft) return;
    if(uhr.rest <= 0 || uhr.fertig) uhrReset();
    ensureAudio();
    uhr.laeuft = true;
    uhr.ende = Date.now() + uhr.rest;
    statusEl.textContent = 'Los geht’s — schreibt!';
    uhr.tick = setInterval(function(){
      var rest = uhr.ende - Date.now();
      var s = Math.ceil(rest/1000);
      if(s <= 5 && s > 0 && s !== uhr.lastBeep){ uhr.lastBeep = s; playBlip(); }
      if(rest <= 0){ uhr.rest = 0; rundeEnde('⌛ Zeit um!'); return; }
      paintUhr();
    }, 200);
    paintUhr();
    paint();
  }

  function paint(){
    var weg = slfWeg();
    wheel = SLF_BUCHSTABEN.filter(function(b){ return weg.indexOf(b) < 0 || b === slf.letzter; });
    var kats = ['Stadt', 'Land'].concat(slfKategorien());
    catsEl.innerHTML = kats.map(function(k, i){
      return '<div class="slf-cat'+(i < 2 ? ' slf-cat-fix' : '')+'">'+esc(k)+'</div>';
    }).join('') + '<div class="slf-cat slf-cat-pkt">Punkte</div>';
    var uebrig = SLF_BUCHSTABEN.length - weg.length;
    usedEl.innerHTML = '<b>'+uebrig+'</b> von '+SLF_BUCHSTABEN.length+' Buchstaben übrig'
      + (weg.length ? ' · schon gespielt: <span class="slf-used-list">'+esc(weg.join(' '))+'</span>' : '');
    Array.prototype.forEach.call(stage.querySelectorAll('[data-sek]'), function(b){
      b.classList.toggle('wu-opt-on', parseInt(b.getAttribute('data-sek'),10) === sek);
      b.disabled = uhr.laeuft;
    });
    Array.prototype.forEach.call(stage.querySelectorAll('[data-modus]'), function(b){
      b.classList.toggle('wu-opt-on', b.getAttribute('data-modus') === modus());
    });
    katBtn.textContent = modus() === 'eigene' ? '✏️ Kategorien bearbeiten' : '🔀 Neue Kategorien';
    var nochWas = SLF_BUCHSTABEN.some(function(b){ return weg.indexOf(b) < 0; });
    spinBtn.disabled = hubBtn.disabled = spinning || !nochWas;
    if(!nochWas && !spinning && !uhr.laeuft && !uhr.fertig) statusEl.textContent = 'Alle Buchstaben gespielt 🎉';
    resetBtn.disabled = spinning || !weg.length;
    startBtn.disabled = spinning || !slf.letzter;
    draw();
  }

  function spin(){
    if(spinning) return;
    slf.letzter = null;
    uhrReset();
    statusEl.innerHTML = '&nbsp;';
    paint();
    if(!wheel.length) return;
    var list = wheel.slice(), n = list.length, seg = TAU / n;
    function idxAt(rot){ return Math.floor(glueckMod(-rot, TAU) / seg) % n; }
    var w = zufallInt(n);
    var a = (w + 0.15 + Math.random() * 0.7) * seg;
    var start = slf.rot;
    var reduce = reduzierteBewegung();
    var end = start + (reduce ? 0 : (5 + zufallInt(3)) * TAU) + glueckMod(-a - start, TAU);
    var dur = reduce ? 600 : 4600 + Math.random() * 1000;
    var t0 = performance.now(), lastIdx = idxAt(start), lastTick = 0;
    spinning = true;
    ensureAudio();
    wrapEl.classList.remove('slf-hit');
    letterEl.textContent = '…';
    paint();

    function frame(now){
      if(stopped) return;
      var p = Math.min(1, (now - t0) / dur);
      slf.rot = start + (end - start) * (1 - Math.pow(1 - p, 4));
      draw();
      var idx = idxAt(slf.rot);
      if(idx !== lastIdx && now - lastTick > 45){ playBlip(); lastTick = now; }
      lastIdx = idx;
      if(p < 1){ raf = requestAnimationFrame(frame); return; }
      raf = null;
      slf.rot = glueckMod(end, TAU);
      spinning = false;
      var b = list[w];
      slf.letzter = b;
      var weg = slfWeg();
      if(weg.indexOf(b) < 0){ weg.push(b); weg.sort(); lsSet(LIB_PREFIX+'slf_weg', JSON.stringify(weg)); }
      letterEl.textContent = b;
      wrapEl.classList.add('slf-hit');
      paint();
      if(autoStart) uhrStart(); else playGong();
    }
    raf = requestAnimationFrame(frame);
  }

  function eigeneBearbeiten(){
    var akt = slfJson('slf_eigene', []);
    if(!Array.isArray(akt) || akt.length !== 3) akt = slfKategorien();
    var h = '<h3>Eigene Kategorien</h3><p>Stadt und Land stehen immer vorne — dazu kommen diese drei:</p>';
    for(var i=0;i<3;i++){
      h += '<input type="text" id="slfK'+i+'" maxlength="40" list="slfKatListe" placeholder="Kategorie '+(i+3)+'" value="'+esc(akt[i]||'')+'">';
    }
    h += '<datalist id="slfKatListe">'+SLF_KATEGORIEN.map(function(k){ return '<option value="'+esc(k)+'">'; }).join('')+'</datalist>';
    h += '<div class="modal-actions">'
      + '<button class="btn btn-ghost btn-sm" id="modalCancel" type="button">Abbrechen</button>'
      + '<button class="btn btn-primary btn-sm" id="modalOk" type="button">Speichern</button></div>';
    openModal(h);
    document.getElementById('slfK0').focus();
    document.getElementById('modalCancel').addEventListener('click', closeModal);
    document.getElementById('modalOk').addEventListener('click', function(){
      var werte = [0,1,2].map(function(i){ return document.getElementById('slfK'+i).value.trim(); });
      var leer = werte.indexOf('');
      if(leer >= 0){ toast('Bitte alle drei Kategorien ausfüllen.'); document.getElementById('slfK'+leer).focus(); return; }
      lsSet(LIB_PREFIX+'slf_eigene', JSON.stringify(werte));
      lsSet(LIB_PREFIX+'slf_modus', 'eigene');
      closeModal();
      paint();
    });
  }

  spinBtn.addEventListener('click', spin);
  hubBtn.addEventListener('click', spin);
  startBtn.addEventListener('click', function(){
    if(uhr.laeuft){ uhrStop(); statusEl.textContent = 'Pause'; paintUhr(); paint(); }
    else uhrStart();
  });
  stopBtn.addEventListener('click', function(){ if(uhr.laeuft) rundeEnde('✋ STOPP!'); });
  Array.prototype.forEach.call(stage.querySelectorAll('[data-sek]'), function(b){
    b.addEventListener('click', function(){
      if(uhr.laeuft) return;
      sek = parseInt(b.getAttribute('data-sek'), 10);
      lsSet(LIB_PREFIX+'slf_sek', String(sek));
      uhrReset(); paint();
    });
  });
  stage.querySelector('#slfAuto').addEventListener('change', function(e){
    autoStart = e.target.checked;
    lsSet(LIB_PREFIX+'slf_auto', autoStart ? '1' : '0');
  });
  Array.prototype.forEach.call(stage.querySelectorAll('[data-modus]'), function(b){
    b.addEventListener('click', function(){
      var m = b.getAttribute('data-modus');
      if(m === 'eigene'){
        var e = slfJson('slf_eigene', []);
        if(!Array.isArray(e) || e.length !== 3){ eigeneBearbeiten(); return; }
      }
      lsSet(LIB_PREFIX+'slf_modus', m);
      paint();
    });
  });
  katBtn.addEventListener('click', function(){
    if(modus() === 'eigene'){ eigeneBearbeiten(); return; }
    lsSet(LIB_PREFIX+'slf_zufall', JSON.stringify(slfZufallZiehen(slfKategorien())));
    paint();
  });
  resetBtn.addEventListener('click', function(){
    uiConfirm('Alle Buchstaben zurück?', 'Die schon gespielten Buchstaben kommen wieder auf die Drehscheibe.', 'Zurücksetzen', function(){
      lsSet(LIB_PREFIX+'slf_weg', '[]');
      slf.letzter = null;
      letterEl.textContent = '?';
      wrapEl.classList.remove('slf-hit');
      uhrReset();
      statusEl.innerHTML = '&nbsp;';
      paint();
    });
  });

  function onResize(){ if(!spinning) draw(); }
  window.addEventListener('resize', onResize);
  document.addEventListener('fullscreenchange', onResize);
  beamerSpaceKey(spin);
  beamer.cleanups.push(function(){
    stopped = true;
    if(raf) cancelAnimationFrame(raf);
    raf = null; spinning = false;
    uhrStop();
    window.removeEventListener('resize', onResize);
    document.removeEventListener('fullscreenchange', onResize);
  });

  if(slf.letzter){ letterEl.textContent = slf.letzter; wrapEl.classList.add('slf-hit'); }
  uhrReset();
  paint();
  requestAnimationFrame(function(){ if(!stopped && !spinning) draw(); });
}

/* ===================== 🪴 PFLANZEN-ERINNERUNG (nur Lehrperson) =====================
   Liegt in klassenzimmer/pflanzen (teacher-only, keine neue Regel nötig):
   {plants:[{id, name, sommer, winter, last:'YYYY-MM-DD', next?:'YYYY-MM-DD'}], seedVersion, updatedAt}.
   Fällig = `next`, falls fix gesetzt (Starttermine / von Hand), sonst zuletzt
   gegossen + Abstand (Sommer Apr–Sep, Winter Okt–Mär, je nach Monat des
   letzten Giessens). „Gegossen" setzt last = heute und löscht `next`. Solange eine Pflanze fällig ist, steht
   oben auf JEDER Seite ein rotes Band — es verschwindet erst mit „Gegossen". */

// Abstände in Tagen nach Pflegeangaben (feey, Plantura, pflanzen-verstehen,
// palmenstadl) — fürs geheizte Schulzimmer im Winter nicht ganz auf null.
var PFLANZEN_START = [
  { id:'elefantenfuss', name:'Elefantenfuss',             sommer:14, winter:28, last:'', next:'2026-10-26' },
  { id:'peperomie',     name:'Rundblättrige Peperomie',   sommer:7,  winter:14, last:'', next:'2026-09-25' },
  { id:'palmlilie',     name:'Riesenpalmlilie',           sommer:10, winter:21, last:'', next:'2026-09-25' },
  { id:'gluecksfeder',  name:'Glücksfeder',               sommer:14, winter:21, last:'', next:'2026-09-25' },
  { id:'efeutute',      name:'Efeutute',                  sommer:7,  winter:12, last:'', next:'2026-09-25' }
];
var PFLANZEN_SEED_VERSION = 2;
var pflanzen = { list:[], loaded:false, unsub:null, timer:null, seeding:false };

function pflanzenRef(){ return kdoc('klassenzimmer', 'pflanzen'); }

function pflanzeAbstand(p){
  var m = parseInt((p.last || '').split('-')[1], 10);
  return (m >= 4 && m <= 9) ? p.sommer : p.winter;
}
function pflanzeNaechste(p){
  if(/^\d{4}-\d{2}-\d{2}$/.test(p.next || '')) return p.next;
  var t = (p.last || '').split('-').map(Number);
  if(t.length !== 3 || !t[0]) return todayStr();
  return localDateStr(new Date(t[0], t[1]-1, t[2] + pflanzeAbstand(p)));
}
function pflanzeTageBis(dateStr){
  var t = dateStr.split('-').map(Number);
  var n = new Date(); n.setHours(0,0,0,0);
  return Math.round((new Date(t[0], t[1]-1, t[2]) - n) / 86400000);
}

/* Ferien & Wochenenden: Jan kann nur an Schultagen giessen (in den Ferien
   höchstens mal vorbeikommen). pflanzePlan() verschiebt darum die Erinnerung:
   - fällig an einem Nicht-Schultag, aber der nächste Schultag liegt noch in
     der Toleranz (40 % des Abstands) → Erinnerung am nächsten Schultag;
   - sonst → schon am letzten Schultag davor („vor den Herbstferien giessen");
   - geht auch das nicht (dann wäre gerade erst gegossen worden) → die
     Pflanze braucht einen Besuch in den Ferien, Erinnerung am Fälligkeitstag.
   pflanzeFerienBesuche() spielt die kommenden Ferien durch und nennt die Tage,
   an denen trotz Vorab-Giessen jemand vorbeikommen muss. */
function pfPlus(dateStr, n){
  var t = dateStr.split('-').map(Number);
  return localDateStr(new Date(t[0], t[1]-1, t[2] + n));
}
function pfTage(a, b){
  var x = a.split('-').map(Number), y = b.split('-').map(Number);
  return Math.round((new Date(y[0], y[1]-1, y[2]) - new Date(x[0], x[1]-1, x[2])) / 86400000);
}
function pfFerienAm(dateStr){
  return FERIEN_TG.filter(function(f){ return f.start <= dateStr && f.end >= dateStr; })[0] || null;
}
function pfSchultag(dateStr){
  var t = dateStr.split('-').map(Number);
  var wd = new Date(t[0], t[1]-1, t[2]).getDay();
  return wd >= 1 && wd <= 5 && !pfFerienAm(dateStr);
}
function pfSchultagNach(dateStr){
  var d = dateStr;
  for(var i=0;i<60;i++){ d = pfPlus(d, 1); if(pfSchultag(d)) return d; }
  return d;
}
function pfSchultagVor(dateStr){
  var d = dateStr;
  for(var i=0;i<60;i++){ d = pfPlus(d, -1); if(pfSchultag(d)) return d; }
  return d;
}
function pflanzeAbstandAb(p, dateStr){
  return pflanzeAbstand({ last:dateStr, sommer:p.sommer, winter:p.winter });
}
function pflanzeToleranz(abstand){ return Math.max(1, Math.floor(abstand * 0.4)); }

// Nächster Giesstermin ab „gegossen am" (bzw. dem festen Termin), angepasst an
// Schultage. Liefert {due, remind, grund, besuch}.
function pflanzePlanAb(p, due, zuletzt){
  var r = { due:due, remind:due, grund:'', besuch:false };
  if(pfSchultag(due)) return r;
  var fer = pfFerienAm(due);
  var nach = pfSchultagNach(due);
  if(pfTage(due, nach) <= pflanzeToleranz(pflanzeAbstandAb(p, due))){
    r.remind = nach;
    r.grund = 'hält bis '+(fer ? 'nach den '+fer.label : 'nach dem Wochenende')+' durch';
    return r;
  }
  var vor = pfSchultagVor(due);
  if(!zuletzt || vor > zuletzt){
    r.remind = vor;
    r.grund = fer ? 'vor den '+fer.label+' noch giessen' : 'vor dem Wochenende giessen';
    return r;
  }
  r.besuch = true;
  r.grund = fer ? 'in den '+fer.label+' vorbeikommen' : 'am Wochenende vorbeikommen';
  return r;
}
function pflanzePlan(p){ return pflanzePlanAb(p, pflanzeNaechste(p), p.last || ''); }

// Tage in den nächsten (oder laufenden) Ferien, an denen die Pflanze trotz
// Giessen am letzten Schultag Wasser braucht.
function pflanzeFerienBesuche(p){
  var heute = todayStr();
  var F = FERIEN_TG.filter(function(f){ return f.end >= heute; })[0];
  if(!F) return { ferien:null, tage:[] };
  var out = [];
  var plan = pflanzePlan(p), datum = plan.remind;
  if(datum >= F.start && datum <= F.end) out.push(datum);
  for(var i=0;i<40 && datum <= F.end;i++){
    var due = pfPlus(datum, pflanzeAbstandAb(p, datum));
    if(due > F.end) break;
    var n = pflanzePlanAb(p, due, datum);
    if(n.besuch && due >= F.start) out.push(due);
    datum = n.remind;
  }
  return { ferien:F, tage:out };
}
function pfTageListe(tage){
  return tage.map(function(d){ return weekdayLabel(d).slice(0,2)+' '+fmtDueDate(d).slice(0,6); }).join(', ');
}

function pflanzenFaellig(){
  var heute = todayStr();
  return pflanzen.list.filter(function(p){ return pflanzePlan(p).remind <= heute; });
}

function ensurePflanzenWatcher(){
  if(pflanzen.unsub) return;
  pflanzen.unsub = onSnapshot(pflanzenRef(), function(snap){
    if(!snap.exists()){
      // Jans Pflanzenliste gibt es nur in der G3b; andere Klassen starten leer,
      // ohne dass dafür etwas geschrieben wird.
      if(state.klasse !== 'G3b' || isFremdeKlasse()){
        pflanzen.list = []; pflanzen.loaded = true; updatePflanzenAnzeige();
        return;
      }
      if(pflanzen.seeding) return;
      pflanzen.seeding = true;
      setDoc(pflanzenRef(), { plants: PFLANZEN_START, seedVersion: PFLANZEN_SEED_VERSION, updatedAt: serverTimestamp() })
        .catch(function(err){ console.error(err); })
        .finally(function(){ pflanzen.seeding = false; });
      return;
    }
    var d = snap.data();
    // Erste Fassung hat Jans Termine als „zuletzt gegossen 2025" gespeichert —
    // gemeint waren die NÄCHSTEN Giesstermine. Einmalig ersetzen, solange
    // noch nichts daran geändert wurde.
    if(!d.seedVersion && !pflanzen.seeding && !isFremdeKlasse() && Array.isArray(d.plants) && d.plants.length === 5
       && d.plants.every(function(p){ return /^2025-(10-26|09-25)$/.test(p.last || ''); })){
      pflanzen.seeding = true;
      updateDoc(pflanzenRef(), { plants: PFLANZEN_START, seedVersion: PFLANZEN_SEED_VERSION, updatedAt: serverTimestamp() })
        .catch(function(err){ console.error(err); })
        .finally(function(){ pflanzen.seeding = false; });
      return;
    }
    pflanzen.list = Array.isArray(d.plants) ? d.plants : [];
    pflanzen.loaded = true;
    updatePflanzenAnzeige();
  }, function(err){ console.error(err); });
  // Das Datum wechselt auch ohne neuen Snapshot — regelmässig nachprüfen.
  pflanzen.timer = setInterval(updatePflanzenAnzeige, 10*60*1000);
}
function stopPflanzenWatcher(){
  if(pflanzen.unsub){ try{ pflanzen.unsub(); }catch(e){} pflanzen.unsub = null; }
  if(pflanzen.timer){ clearInterval(pflanzen.timer); pflanzen.timer = null; }
  pflanzen.list = []; pflanzen.loaded = false;
}

function pflanzenSpeichern(list, okText){
  return setDoc(pflanzenRef(), { plants: list, updatedAt: serverTimestamp() }, {merge:true})
    .then(function(){ if(okText) toast(okText); })
    .catch(function(err){ console.error(err); toast('Konnte nicht gespeichert werden.'); });
}
function pflanzeGegossen(id){
  var name = '';
  var list = pflanzen.list.map(function(p){
    if(p.id !== id) return p;
    name = p.name;
    var neu = Object.assign({}, p, { last: todayStr() });
    delete neu.next;
    return neu;
  });
  pflanzenSpeichern(list, '💧 '+name+' gegossen.');
}

function pflanzenBannerHtml(){
  var f = pflanzenFaellig();
  var h = '';
  if(f.length){
    h += '<div class="pf-banner"><div class="pf-banner-title">🪴 Giessen nicht vergessen!</div><div class="pf-banner-list">';
    f.forEach(function(p){
      var plan = pflanzePlan(p);
      var tage = -pflanzeTageBis(plan.due);
      var wann;
      if(tage < 0) wann = plan.grund + ' (eigentlich erst am '+fmtDueDate(plan.due)+' fällig)';
      else if(tage === 0) wann = 'heute fällig';
      else wann = 'seit '+tage+' Tag'+(tage===1?'':'en')+' fällig';
      if(tage >= 0 && plan.grund && plan.remind !== plan.due) wann += ' — ' + plan.grund;
      h += '<div class="pf-banner-item"><span><b>'+esc(p.name)+'</b> <span class="pf-banner-when">'+esc(wann)+'</span></span>';
      h += '<button class="btn btn-sm pf-done" data-pf-done="'+esc(p.id)+'" type="button">💧 Gegossen</button></div>';
    });
    h += '</div></div>';
  }
  // Ferienhinweis ab 10 Tage vor Ferienbeginn: wer die Ferien nicht durchhält.
  var heute = todayStr(), hinweise = [], ferien = null;
  pflanzen.list.forEach(function(p){
    var b = pflanzeFerienBesuche(p);
    if(!b.ferien || !b.tage.length || pfTage(heute, b.ferien.start) > 10) return;
    ferien = b.ferien;
    var rest = b.tage.filter(function(d){ return d > heute; });
    if(rest.length) hinweise.push('<b>'+esc(p.name)+'</b>: '+esc(pfTageListe(rest)));
  });
  if(hinweise.length){
    h += '<div class="pf-banner pf-banner-info"><div class="pf-banner-title">🧳 '+esc(ferien.label)+': Diese Pflanzen halten nicht durch</div>'
      + '<div class="pf-banner-sub">Vorher kräftig giessen und an diesen Tagen vorbeikommen (oder mit nach Hause nehmen):</div>'
      + '<div class="pf-banner-list">'+hinweise.map(function(x){ return '<div>'+x+'</div>'; }).join('')+'</div></div>';
  }
  return h;
}

function updatePflanzenAnzeige(){
  var box = document.getElementById('pflanzenBanner');
  if(box){
    box.innerHTML = pflanzenBannerHtml();
    bindPflanzenDone(box);
  }
  var btn = document.getElementById('pflanzenBtn');
  if(btn){
    var n = pflanzenFaellig().length;
    btn.classList.toggle('pf-btn-due', n > 0);
    btn.title = n ? n+' Pflanze'+(n===1?'':'n')+' giessen!' : 'Pflanzen';
    var badge = btn.querySelector('.topbar-todo-badge');
    if(badge){ badge.hidden = !n; badge.textContent = String(n); }
  }
  if(modalEl.classList.contains('show') && document.getElementById('pfListe')) renderPflanzenListe();
}
function bindPflanzenDone(root){
  Array.prototype.forEach.call(root.querySelectorAll('[data-pf-done]'), function(b){
    b.addEventListener('click', function(){ b.disabled = true; pflanzeGegossen(b.getAttribute('data-pf-done')); });
  });
}

function openPflanzen(){
  openModal('<h3>🪴 Pflanzen im Schulzimmer</h3>'
    + '<p class="pf-hint">Abstände: Sommer = April bis September, Winter = Oktober bis März. Gegossen wird nur an Schultagen: Fällt ein Termin aufs Wochenende oder in die Ferien, kommt die Erinnerung am Schultag danach (wenn die Pflanze so lange durchhält, ca. 40 % des Abstands) — sonst schon am Schultag davor. Solange eine Pflanze fällig ist, bleibt das rote Band oben sichtbar.</p>'
    + '<div id="pfListe"></div>'
    + '<div class="modal-actions">'
    + '<button class="btn btn-ghost btn-sm" id="pfAdd" type="button">+ Pflanze</button>'
    + '<button class="btn btn-primary btn-sm" id="modalCancel" type="button">Schliessen</button></div>', 'pf-modal');
  document.getElementById('modalCancel').addEventListener('click', closeModal);
  document.getElementById('pfAdd').addEventListener('click', function(){ pflanzeBearbeiten(null); });
  renderPflanzenListe();
}

function renderPflanzenListe(){
  var el = document.getElementById('pfListe');
  if(!el) return;
  if(!pflanzen.loaded){ el.innerHTML = '<div class="todo-empty">Wird geladen …</div>'; return; }
  if(!pflanzen.list.length){ el.innerHTML = '<div class="todo-empty">Noch keine Pflanzen.</div>'; return; }
  var list = pflanzen.list.slice().sort(function(a,b){ return pflanzePlan(a).remind.localeCompare(pflanzePlan(b).remind); });
  var h = '<div class="pf-list">';
  list.forEach(function(p){
    var plan = pflanzePlan(p), next = plan.remind, tage = pflanzeTageBis(next);
    var wann = tage < 0 ? 'seit '+(-tage)+' Tag'+(tage===-1?'':'en')+' überfällig' : tage === 0 ? 'heute' : tage === 1 ? 'morgen' : 'in '+tage+' Tagen';
    var extra = '';
    if(plan.remind !== plan.due) extra += '<br>↳ '+esc(plan.grund)+' (eigentlich '+esc(fmtDueDate(plan.due))+')';
    else if(plan.besuch) extra += '<br>↳ '+esc(plan.grund);
    var fb = pflanzeFerienBesuche(p);
    if(fb.tage.length) extra += '<br>🧳 <b>'+esc(fb.ferien.label)+'</b>: vorbeikommen am '+esc(pfTageListe(fb.tage));
    else if(fb.ferien && pfTage(todayStr(), fb.ferien.start) <= 30) extra += '<br>🧳 hält die '+esc(fb.ferien.label)+' durch';
    h += '<div class="pf-item'+(tage <= 0 ? ' pf-item-due' : '')+'">';
    h += '<div class="pf-body"><div class="pf-name">'+esc(p.name)+'</div>';
    h += '<div class="pf-meta">'+(p.last ? 'Zuletzt '+esc(fmtDueDate(p.last))+' · ' : '')+'nächstes Mal '+esc(fmtDueDate(next))+' (<b>'+esc(wann)+'</b>)'+extra+'<br>alle '+p.sommer+' Tage im Sommer, '+p.winter+' im Winter</div></div>';
    h += '<div class="pf-actions"><button class="btn btn-sm '+(tage <= 0 ? 'pf-done' : 'btn-ghost')+'" data-pf-done="'+esc(p.id)+'" type="button">💧 Gegossen</button>';
    h += '<button class="btn btn-ghost btn-sm" data-pf-edit="'+esc(p.id)+'" type="button" title="Bearbeiten">✏️</button></div></div>';
  });
  el.innerHTML = h + '</div>';
  bindPflanzenDone(el);
  Array.prototype.forEach.call(el.querySelectorAll('[data-pf-edit]'), function(b){
    b.addEventListener('click', function(){
      var id = b.getAttribute('data-pf-edit');
      pflanzeBearbeiten(pflanzen.list.filter(function(p){ return p.id === id; })[0] || null);
    });
  });
}

function pflanzeBearbeiten(p){
  var neu = !p;
  var v = p || { name:'', sommer:7, winter:14, last:todayStr() };
  var nextAlt = p ? pflanzeNaechste(p) : '';
  openModal('<h3>'+(neu ? 'Neue Pflanze' : esc(v.name))+'</h3>'
    + '<label class="pf-label">Name</label><input type="text" id="pfName" maxlength="40" value="'+esc(v.name)+'">'
    + '<label class="pf-label">Zuletzt gegossen am'+(neu ? '' : ' (leer = unbekannt)')+'</label><input type="date" id="pfLast" value="'+esc(v.last || '')+'" max="'+todayStr()+'">'
    + (neu ? '' : '<label class="pf-label">Nächstes Mal giessen am</label><input type="date" id="pfNext" value="'+esc(nextAlt)+'">')
    + '<div class="pf-row"><div><label class="pf-label">Alle … Tage (Sommer)</label><input type="number" id="pfSommer" min="1" max="90" value="'+v.sommer+'"></div>'
    + '<div><label class="pf-label">Alle … Tage (Winter)</label><input type="number" id="pfWinter" min="1" max="90" value="'+v.winter+'"></div></div>'
    + '<div class="modal-actions">'
    + (neu ? '' : '<button class="btn btn-danger btn-sm" id="pfDel" type="button" style="margin-right:auto">Löschen</button>')
    + '<button class="btn btn-ghost btn-sm" id="modalCancel" type="button">Abbrechen</button>'
    + '<button class="btn btn-primary btn-sm" id="modalOk" type="button">Speichern</button></div>');
  document.getElementById('pfName').focus();
  document.getElementById('modalCancel').addEventListener('click', openPflanzen);
