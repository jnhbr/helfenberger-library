  return (h >>> 0) || 1;
}

/* ---------- Schüler:in: Wächter während der Prüfung ---------- */

function pruefWaechterAn(){
  var s = pruef.sess; if(!s) return;
  s.fsWasOn = !!(document.fullscreenElement || document.webkitFullscreenElement);
  document.addEventListener('visibilitychange', pruefOnVis);
  document.addEventListener('fullscreenchange', pruefOnFs);
  document.addEventListener('webkitfullscreenchange', pruefOnFs);
  window.addEventListener('pagehide', pruefOnHide);
  s.poll = setInterval(function(){
    if(pruef.sess !== s) return;
    // hasFocus() ist auch true, solange der Fokus im Prüfungs-iframe liegt.
    if(document.hasFocus()){ s.missed = 0; return; }
    if(++s.missed >= 2) pruefVerstoss('Anderes Fenster oder Programm geöffnet');
  }, 500);
  s.beat = setInterval(function(){
    if(pruef.sess === s) updateDoc(teilRef(s.pid, state.user.uid), {lebt:serverTimestamp()}).catch(function(){});
  }, 30000);
}
function pruefWaechterAus(){
  var s = pruef.sess;
  document.removeEventListener('visibilitychange', pruefOnVis);
  document.removeEventListener('fullscreenchange', pruefOnFs);
  document.removeEventListener('webkitfullscreenchange', pruefOnFs);
  window.removeEventListener('pagehide', pruefOnHide);
  if(s){ clearInterval(s.poll); clearInterval(s.beat); clearTimeout(s.saveTimer); }
}
function pruefOnVis(){ if(document.visibilityState === 'hidden') pruefVerstoss('Tab oder Fenster gewechselt'); }
function pruefOnFs(){
  var s = pruef.sess; if(!s) return;
  if(document.fullscreenElement || document.webkitFullscreenElement){ s.fsWasOn = true; return; }
  if(s.fsWasOn) pruefVerstoss('Vollbild verlassen');
}
function pruefOnHide(){ pruefVerstoss('Seite verlassen oder neu geladen'); }

function pruefSessionStopp(){
  pruefWaechterAus();
  var s = pruef.sess;
  if(s && s.frame){ try{ s.frame.srcdoc = ''; }catch(e){} }
  if(s) clearInterval(s.uhr);
  pruef.sess = null;
}

function pruefVerstoss(grund){
  var s = pruef.sess;
  if(!s || s.ending || s.vorschau) return;
  s.ending = true;
  var t = pruef.mine[s.pid] || {};
  var upd = {status:'gesperrt', aktiv:false, gesperrtAm:serverTimestamp(),
    verstoesse:(t.verstoesse || []).concat([{at:Date.now(), grund:grund}]).slice(-30)};
  if(s.antworten){ upd.antworten = s.antworten; upd.beantwortet = s.beantwortet; }
  var pid = s.pid;
  pruefSessionStopp();
  pruefLokal(pid, {status:'gesperrt', aktiv:false, verstoesse:upd.verstoesse});
  updateDoc(teilRef(pid, state.user.uid), upd).catch(function(err){ console.error('Sperre speichern', err); });
  pruefFullscreenAus();
  pruefZeigeGesperrt(pruefById(pid), grund);
}

// Nachrichten der Prüfungsseite (Stand, Abgabe)
window.addEventListener('message', function(e){
  var s = pruef.sess, d = e.data;
  if(!s || !s.frame || e.source !== s.frame.contentWindow || !d || d.type !== 'geoPruefung') return;
  var p = pruefById(s.pid);
  if(d.action === 'bereit'){
    s.bereit = true;
    if(p && p.status === 'beendet' || s.zeitUm) pruefErzwingeAbgabe();
    return;
  }
  if(d.action === 'stand'){ pruefStand(s, d.antworten, d.beantwortet); return; }
  if(d.action === 'abgabe') pruefAbgabe(s, d);
});
// Laufender Stand: gebündelt speichern (höchstens alle 1.2 s).
function pruefStand(s, antworten, beantwortet){
  s.antworten = antworten || {}; s.beantwortet = beantwortet || 0;
  if(s.vorschau) return;
  clearTimeout(s.saveTimer);
  s.saveTimer = setTimeout(function(){
    if(pruef.sess !== s || s.ending) return;
    updateDoc(teilRef(s.pid, state.user.uid), {antworten:s.antworten, beantwortet:s.beantwortet, lebt:serverTimestamp()}).catch(function(err){ console.error('Prüfungsstand speichern', err); });
  }, 1200);
}
// Abgabe. d = {antworten, punkte?, max?, details?} — Punkte/Details bringt nur
// eine Seite mit eigenem Prüfungsmodus mit; Bank-Prüfungen korrigiert die Lehrperson.
function pruefAbgabe(s, d){
  if(s.ending) return;
  s.ending = true;
  var pid = s.pid, vorschau = s.vorschau, p = pruefById(pid);
  pruefSessionStopp();
  pruefFullscreenAus();
  pruefLockHide();
  if(vorschau){
    var r = typeof d.punkte === 'number' ? Promise.resolve({punkte:d.punkte, max:d.max}) : pruefLoesungLaden(pid).then(function(loes){ return pruefBankBewerten(p, loes, d.antworten || {}, {}); });
    r.then(function(x){
      uiInfo('Vorschau abgegeben', (p && p.diktat ? (x.max - x.punkte)+' Fehler' : x.punkte+' von '+x.max+' Punkten')+(p ? ' · Note '+pruefNoteText(pruefNote(p, x.punkte, x.max)) : '')+'. Gespeichert wurde nichts.');
    }).catch(pruefFehler);
    return;
  }
  pruefLokal(pid, {status:'abgegeben', aktiv:false});
  var upd = {status:'abgegeben', aktiv:false, antworten:d.antworten || {}, beantwortet:Object.keys(d.antworten || {}).length, abgegebenAm:serverTimestamp()};
  if(typeof d.punkte === 'number'){ upd.punkte = +d.punkte || 0; upd.max = +d.max || 0; upd.details = Array.isArray(d.details) ? d.details.slice(0, 100) : []; }
  updateDoc(teilRef(pid, state.user.uid), upd).then(function(){
    uiInfo('✉️ Abgegeben', 'Deine Prüfung ist bei der Lehrperson. Das Resultat siehst du, sobald sie es freigibt.');
  }).catch(function(err){
    console.error('Abgabe speichern', err);
    uiInfo('Abgabe nicht gespeichert', 'Bitte sofort der Lehrperson Bescheid geben. ('+(err.code || err.message)+')');
  });
}
function pruefErzwingeAbgabe(){
  var s = pruef.sess;
  if(s && s.bank && !s.abgebenGesendet){ s.abgebenGesendet = true; pruefBankAbgeben(true); return; }
  // Erst senden, wenn die Seite «bereit» gemeldet hat — sonst ginge die Nachricht verloren.
  if(!s || !s.frame || !s.bereit || s.abgebenGesendet) return;
  s.abgebenGesendet = true;
  try{ s.frame.contentWindow.postMessage({type:'geoPruefung', action:'abgeben'}, '*'); }catch(e){}
}

/* ---------- Schüler:in: Sperrbildschirm ---------- */

function pruefStudentUpdate(){
  if(pruefIstLehrer() || !state.user) return;
  var aktiv = null;
  pruef.list.some(function(p){
    var t = pruef.mine[p.id];
    if(t && (t.status === 'laeuft' || t.status === 'gesperrt')){ aktiv = {p:p, t:t}; return true; }
    return false;
  });
  var s = pruef.sess;
  if(s && !s.vorschau){
    var t0 = pruef.mine[s.pid], p0 = pruefById(s.pid);
    if(t0) s.gesehen = true;
    // Lehrperson hat die Teilnahme zurückgesetzt oder die Prüfung gelöscht
    if(!p0 || (s.gesehen && !t0)){ pruefSessionStopp(); pruefFullscreenAus(); pruefLockHide(); return; }
    if(!t0) return;
    if(p0.status === 'beendet') pruefErzwingeAbgabe();
    return;
  }
  if(s && s.vorschau) return;
  if(!aktiv){ if(pruef.lockSig) pruefLockHide(); return; }
  var p = aktiv.p, t = aktiv.t;
  if(t.status === 'laeuft' && t.aktiv){
    // Teilnahme ist aktiv, aber hier läuft keine Sitzung: die Seite wurde
    // neu geladen/geschlossen oder die Prüfung in einem zweiten Tab geöffnet.
    var vs = (t.verstoesse || []).concat([{at:Date.now(), grund:'Seite neu geladen oder verlassen'}]).slice(-30);
    pruefLokal(p.id, {status:'gesperrt', aktiv:false, verstoesse:vs});
    updateDoc(teilRef(p.id, state.user.uid), {status:'gesperrt', aktiv:false, gesperrtAm:serverTimestamp(), verstoesse:vs}).catch(function(err){ console.error('Sperre speichern', err); });
    pruefZeigeGesperrt(p, 'Seite neu geladen oder verlassen');
    return;
  }
  if(t.status === 'gesperrt'){
    var v = (t.verstoesse || []).slice(-1)[0];
    pruefZeigeGesperrt(p, v ? v.grund : '');
    return;
  }
  pruefZeigeEntsperrt(p);
}
function pruefZeigeGesperrt(p, grund){
  var sig = 'gesperrt:' + (p ? p.id : '') + ':' + grund;
  if(pruef.lockSig === sig) return;
  pruef.lockSig = sig;
  closeModal();
  var ov = pruefOverlay();
  ov.innerHTML = '<div class="pr-lock-msg"><div class="pr-lock-icon">🔒</div><h2>Prüfung gesperrt</h2>'+
    '<p>Du hast die Prüfung verlassen'+(grund ? ' <span class="pr-grund">('+esc(grund)+')</span>' : '')+'.</p>'+
    '<p><b>Melde dich bei der Lehrperson.</b> Sobald sie dich entsperrt, kannst du weiterschreiben. Deine bisherigen Antworten sind gespeichert.</p></div>';
}
function pruefZeigeEntsperrt(p){
  var zeitUm = pruefZeitUm(p, pruef.mine[p.id]);
  var sig = 'frei:' + p.id + ':' + p.status + ':' + zeitUm;
  if(pruef.lockSig === sig) return;
  pruef.lockSig = sig;
  closeModal();
  var ov = pruefOverlay();
  var beendet = p.status === 'beendet' || zeitUm;
  ov.innerHTML = '<div class="pr-lock-msg"><div class="pr-lock-icon">🔓</div><h2>'+(zeitUm ? 'Die Zeit ist um' : beendet ? 'Die Prüfung ist beendet' : 'Du bist entsperrt')+'</h2>'+
    '<p>'+(beendet ? 'Deine gespeicherten Antworten werden jetzt abgegeben.' : 'Deine Antworten sind noch da. Nicht mehr verlassen, sonst wirst du wieder gesperrt!')+'</p>'+
    '<button class="btn btn-primary" id="pruefWeiterBtn" type="button">'+(beendet ? '✉️ Abgeben' : '📝 Weiterschreiben')+'</button></div>';
  document.getElementById('pruefWeiterBtn').addEventListener('click', function(){ pruef.lockSig = ''; pruefStarten(p, true); });
}

function pruefDetailsHtml(details, editierbar){
  if(!details.length) return '<p class="kz-intro">Keine Einzelheiten gespeichert.</p>';
  var h = '<div class="pr-details">';
  details.forEach(function(d, i){
    if(d.info){
      h += '<div class="pr-det info"><span class="pr-det-ok">✍️</span><div><div class="pr-det-f">'+esc(d.f || '')+'</div>'+(d.a ? '<div class="pr-det-a">'+esc(d.a)+'</div>' : '')+'</div></div>';
      return;
    }
    var icon = d.ok ? '✅' : d.teil ? '🟡' : '❌';
    var pk = '';
    if(d.max > 0){
      pk = editierbar
        ? ' <span class="pr-det-pk"><input type="number" class="pr-det-pkt" data-p="'+i+'" min="0" max="'+d.max+'" step="0.5" value="'+d.pkt+'" aria-label="Punkte"> / '+pruefZahlText(d.max)+' P.</span>'
        : ' <small>('+pruefZahlText(d.pkt)+' / '+pruefZahlText(d.max)+' P.)</small>';
    }
    var richtig = d.typ === 'offen' ? '<div class="pr-det-a">Musterlösung: <i>'+esc(d.r || '')+'</i></div>'
      : (d.ok ? '' : ' · richtig: <b>'+esc(d.r || '')+'</b>');
    h += '<div class="pr-det '+(d.ok ? 'ok' : d.teil ? 'teil' : 'bad')+'">'+
      (editierbar ? '<button class="pr-det-ok" data-i="'+i+'" type="button" title="Volle / keine Punkte">'+icon+'</button>' : '<span class="pr-det-ok">'+icon+'</span>')+
      '<div><div class="pr-det-f">'+(d.nr ? '' : (i+1)+'. ')+esc(d.f || '')+' <small>'+esc(d.kat || '')+'</small>'+pk+(d.hand ? ' <small title="von Hand gewertet">✋</small>' : '')+'</div>'+
      (d.typ === 'offen'
        ? '<div class="pr-det-a">Antwort: <b>'+esc(d.a || '–')+'</b></div>'+richtig
        : '<div class="pr-det-a">Antwort: <b>'+esc(d.a || '–')+'</b>'+richtig+'</div>')+
      (d.hinweis ? '<div class="pr-det-a"><small>'+esc(d.hinweis)+'</small></div>' : '')+
      '</div></div>';
  });
  return h + '</div>';
}

/* ---------- Übung befragen: welche Bereiche/Fragen hat sie? ---------- */

// Läuft IN der abgeschotteten Übungsseite (per toString eingespritzt) und
// wandelt deren Fragen in ein einheitliches Format um — inklusive Lösungen.
// Die Übungsseiten legen ihre Daten in einer Closure ab; pruefProbe biegt
// darum vorher «var Q/TOPICS/THEMES = …» auf window.__lib… um.
function pruefExtractImpl(){
  function plain(h){
    if(h == null) return '';
    var d = document.createElement('div');
    d.innerHTML = String(h).replace(/<br\s*\/?>/gi, ' ');
    return (d.textContent || '').replace(/\s+/g, ' ').trim();
  }
  function bild(x){
    var s = typeof x === 'string' ? x : (x && typeof x.svg === 'string' ? x.svg : '');
    return s && s.length < 80000 ? s : '';
  }
  var out = {art:'bank', kategorien:[], fragen:[]};
  function kat(id, name){ if(!out.kategorien.some(function(k){ return k.id === id; })) out.kategorien.push({id:id, name:name, anzahl:0}); }
  function add(k, f){ f.kat = k; out.fragen.push(f); out.kategorien.forEach(function(x){ if(x.id === k) x.anzahl++; }); }
  var Q = window.__libQ, T = window.__libTOPICS || {}, TH = window.__libTHEMES;
  // Karteikarte -> offene Frage (Vorderseite = Frage bzw. Begriff, Rückseite = Musterlösung)
  var kartenGesehen = {};
  function karte(cd){
    if(!cd) return null;
    var f, b;
    if(Array.isArray(cd)){ f = cd[0]; b = cd[1]; }
    else if(typeof cd === 'object'){
      f = cd.front || cd.q || cd.question || cd.frage || cd.term || cd.begriff || cd.vorne || cd.title;
      b = cd.back || cd.a || cd.answer || cd.antwort || cd.def || cd.definition || cd.erklaerung || cd.explanation || cd.hinten || cd.text;
    }
    f = plain(f); b = plain(b);
    if(!f || !b || b.length < 3 || kartenGesehen[f.toLowerCase()]) return null;
    kartenGesehen[f.toLowerCase()] = 1;
    var istFrage = /\?\s*$/.test(f) || /^(was|wie|wo|wer|wann|warum|weshalb|wieso|welche|nenne|erkläre|erklaere|beschreibe|begründe|begruende|vergleiche|zähle|zaehle|gib)\s/i.test(f);
    return {typ:'offen', frage:istFrage ? f : 'Erkläre den Begriff «' + f + '».', loesung:b, begriff:istFrage ? '' : f};
  }
  if(Q && Q.length){
    Object.keys(T).forEach(function(k){ kat(k, plain(T[k] && T[k].name) || k); });
    Q.forEach(function(q){
      if(!q) return;
      var k = q.topic || 'alle', n0 = out.fragen.length;
      if(!T[k]) kat(k, k === 'alle' ? 'Alle Fragen' : k);
      if(q.type === 'card'){ var kc = karte(q); if(kc) add(k, kc); }
      if(q.type === 'mc' && q.options) add(k, {typ:'mc', frage:plain(q.q), optionen:q.options.map(plain), loesung:+q.correct});
      else if(q.type === 'tf') add(k, {typ:'tf', frage:plain(q.statement || q.q), loesung:!!q.correct});
      else if(q.type === 'fill' && q.accept) add(k, {typ:'text', frage:plain(q.q), loesung:q.accept.map(String)});
      else if(q.type === 'calc' && typeof q.answer === 'number') add(k, {typ:'zahl', frage:plain(q.q), einheit:plain(q.unit), loesung:{wert:q.answer, tol:q.tolerance || 0.001}});
      else if(q.type === 'match' && q.pairs) add(k, {typ:'zuordnen', frage:plain(q.title || q.q), links:q.pairs.map(function(p){ return plain(p[0]); }), rechts:q.pairs.map(function(p){ return plain(p[1]); })});
      else if(q.type === 'order' && q.items) add(k, {typ:'reihenfolge', frage:plain(q.title || q.q), items:q.items.map(plain)});
      var bl = q.bloom || q.level || q.stufe;
      if(bl) for(var z=n0; z<out.fragen.length; z++) out.fragen[z].bloom = String(bl);
    });
    var CA = window.__libCARDS;
    if(CA && CA.length) CA.forEach(function(cd){
      var kc = karte(cd); if(!kc) return;
      var kk = cd && cd.topic && T[cd.topic] ? cd.topic : 'begriffe';
      if(kk === 'begriffe') kat('begriffe', '🗂️ Begriffe (Karteikarten)');
      add(kk, kc);
    });
  } else if(TH && TH.length){
    var tol = function(a){ return Math.max(0.15, Math.abs(a) * 0.02); };
    // Wie shortAsk() der Mathe-Engine: «c = √(…) = ?» → «Berechne c.» (verrät den Rechenweg nicht)
    var frage = function(c){
      if(c.ask) return plain(c.ask);
      var g = plain(c.given || ''), l = g.split('=')[0].trim();
      return l && l !== g ? 'Berechne ' + l + '.' : 'Berechne das Resultat.';
    };
    var lab = function(c){ return c.label ? plain(c.label) + ' — ' : ''; };
    TH.forEach(function(th){
      if(!th) return;
      var k = String(th.key || th.title);
      kat(k, plain((th.icon ? th.icon + ' ' : '') + (th.title || k)));
      (th.steps || []).forEach(function(s){
        if(!s) return;
        var ctx = plain(s.title) + (s.text ? ': ' + plain(s.text) : ''), b = bild(s.diagram);
        if(s.type === 'truefalse') (s.items || []).forEach(function(it){ add(k, {typ:'tf', kontext:ctx, bild:b, frage:plain(it.text), loesung:!!it.answer}); });
        else if(s.type === 'classify') (s.items || []).forEach(function(it){ add(k, {typ:'mc', kontext:ctx, bild:bild(it.diagram), frage:plain(s.title), optionen:(it.options || []).map(plain), loesung:+it.correct}); });
        else if(s.type === 'calc' || s.type === 'table'){
          (s.cases || []).forEach(function(c){
            if(!c || c.reflect) return;
            if(c.mcOptions) add(k, {typ:'mc', kontext:ctx, bild:bild(c.diagram) || b, frage:lab(c) + plain(c.given), optionen:c.mcOptions.map(plain), loesung:+c.mcCorrect});
            else if(typeof c.answer === 'number') add(k, {typ:'zahl', kontext:ctx, bild:bild(c.diagram) || b, frage:lab(c) + frage(c), einheit:plain(c.unit), loesung:{wert:c.answer, tol:tol(c.answer)}});
          });
          var tb = s.type === 'table' ? s : s.extraTable;
          if(tb && tb.rows) tb.rows.forEach(function(r){
            if(typeof r.answer !== 'number') return;
            var h = tb.colHead || [];
            add(k, {typ:'zahl', kontext:ctx + (tb.title ? ' (' + plain(tb.title) + ')' : ''), bild:b,
              frage:(h[0] ? plain(h[0]) + ' = ' : '') + plain(r.a) + (r.b != null ? ', ' + (h[1] ? plain(h[1]) + ' = ' : '') + plain(r.b) : '') + ' → ' + (h[2] ? plain(h[2]) : 'Resultat') + ' = ?',
              einheit:plain(r.unit), loesung:{wert:r.answer, tol:tol(r.answer)}});
          });
        }
        else if(s.type === 'verify') (s.cases || []).forEach(function(c){
          [[c.given1, c.answer1], [c.given2, c.answer2]].forEach(function(g){
            if(typeof g[1] === 'number') add(k, {typ:'zahl', kontext:ctx, bild:bild(c.diagram) || b, frage:lab(c) + frage({given:g[0]}), einheit:plain(c.unit), loesung:{wert:g[1], tol:tol(g[1])}});
          });
        });
        else if(s.type === 'multitable') (s.rows || []).forEach(function(r){
          var gv = Object.keys(r.given || {}).map(function(x){ return x + ' = ' + plain(r.given[x]); }).join(', ');
          (r.solve || []).forEach(function(sv){
            if(typeof sv[1] === 'number') add(k, {typ:'zahl', kontext:ctx, bild:b, frage:'Gegeben: ' + gv + '. Berechne ' + plain(sv[0]) + '.', einheit:plain(sv[2]), loesung:{wert:sv[1], tol:Math.max(0.2, Math.abs(sv[1]) * 0.03)}});
          });
        });
      });
    });
  } else if(window.__libDiktatText && window.__libDiktatText.length){
    // Diktat-Übung: TEXT_PARAGRAPHS (+ ACCEPTED_ALTERNATES). Firestore kennt
    // keine verschachtelten Arrays, darum Varianten als «a|b».
    var text = window.__libDiktatText.map(function(t){ return String(t); }).filter(Boolean);
    var A = window.__libDiktatAlt, alt = [];
    var grp = function(arr){ arr = arr.filter(function(x){ return typeof x === 'string' && x.trim() && x.indexOf('|') < 0; }); if(arr.length > 1) alt.push(arr.join('|')); };
    var werte = function(v){ return typeof v === 'string' ? [v] : Array.isArray(v) ? v : (v && typeof v === 'object' ? Object.keys(v).map(function(x){ return v[x]; }) : []); };
    if(Array.isArray(A)) A.forEach(function(el){ grp(werte(el).reduce(function(a, x){ return a.concat(werte(x)); }, [])); });
    else if(A && typeof A === 'object') Object.keys(A).forEach(function(k){ grp([k].concat(werte(A[k]))); });
    var woerter = text.join(' ').split(/\s+/).filter(function(w){ return /[\p{L}\p{N}]/u.test(w); }).length;
    out.diktat = true;
    kat('diktat', '✍️ Diktat');
    add('diktat', {typ:'diktat', frage:'Diktat', text:text, alt:alt, woerter:woerter});
  } else {
    return {art:'keine'};
  }
  out.kategorien = out.kategorien.filter(function(k){ return k.anzahl > 0; });
  return out.fragen.length ? out : {art:'keine'};
}

// Schneller Vorab-Test für die Übungsauswahl: sucht nur die Daten, die
// pruefProbe auswerten kann. Chunk für Chunk, bricht beim ersten Treffer ab
// (die Daten stehen vorne, vor Bildern/Audio). Ergebnis pro contentId im
// Browser gemerkt — ein Inhalt ändert sich nie (Bearbeiten = neue contentId).
var PRUEF_SCAN_RE = /\b(?:var|let|const)\s+(?:Q|THEMES|TEXT_PARAGRAPHS)\s*=\s*\[|__GEO_PRUEFUNG/;
function pruefScanKey(contentId){ return 'libPruefScan_' + contentId; }
async function pruefScan(contentId){
  try{ var c = localStorage.getItem(pruefScanKey(contentId)); if(c === '1' || c === '0') return c === '1'; }catch(e){}
  var ok = false;
  try{
    var snap = await getDoc(doc(db,'resourceContent', contentId));
    if(snap.exists()){
      var n = snap.data().chunkCount || 0, rest = '';
      for(var i=0;i<n && !ok;i++){
        var cs = await getDoc(doc(db,'resourceContent', contentId, 'chunks', String(i)));
        var h = (cs.exists() && cs.data().html) || '';
        ok = PRUEF_SCAN_RE.test(rest + h);
        rest = h.slice(-60);
      }
    }
  }catch(err){ console.error('Prüfungs-Schnelltest', err); return true; }   // im Zweifel anbieten
  try{ localStorage.setItem(pruefScanKey(contentId), ok ? '1' : '0'); }catch(e){}
  return ok;
}
async function pruefScanAlle(list, onFortschritt){
  var res = {}, i = 0, fertig = 0;
  async function worker(){
    while(i < list.length){
      var r = list[i++];
      res[r.id] = await pruefScan(resourceContentId(r));
      fertig++; if(onFortschritt) onFortschritt(fertig, list.length);
    }
  }
  var w = [];
  for(var k=0;k<Math.min(6, list.length);k++) w.push(worker());
  await Promise.all(w);
  return res;
}

var pruefProbeCache = {};
function pruefProbe(contentId){
  if(pruefProbeCache[contentId]) return Promise.resolve(pruefProbeCache[contentId]);
  return loadResourceHtml(contentId).then(function(html){
    // Daten aus der Closure der Übung auf window legen (auch const/let).
    var pat = html
      .replace(/\b(?:var|let|const)\s+Q\s*=\s*\[/, 'var Q = window.__libQ = [')
      .replace(/\b(?:var|let|const)\s+TOPICS\s*=\s*\{/, 'var TOPICS = window.__libTOPICS = {')
      .replace(/\b(?:var|let|const)\s+THEMES\s*=\s*\[/, 'var THEMES = window.__libTHEMES = [')
      .replace(/\b(?:var|let|const)\s+CARDS\s*=\s*\[/, 'var CARDS = window.__libCARDS = [')
      .replace(/\b(?:var|let|const)\s+TEXT_PARAGRAPHS\s*=\s*\[/, 'var TEXT_PARAGRAPHS = window.__libDiktatText = [')
      .replace(/\b(?:var|let|const)\s+ACCEPTED_ALTERNATES\s*=\s*/, 'var ACCEPTED_ALTERNATES = window.__libDiktatAlt = ');
    var inject = '<script>window.__LIB_PRUEFUNG_PROBE = true;' +
      'window.addEventListener("load", function(){ setTimeout(function(){' +
      ' if(window.__libPruefInfoGesendet) return; var r;' +
      ' try{ r = (' + pruefExtractImpl.toString() + ')(); }catch(e){ r = {art:"keine", fehler:String(e)}; }' +
      ' r.type = "libPruefung"; r.action = "info"; parent.postMessage(r, "*");' +
      ' }, 50); });<\/script>';
    var headRe = /<head(\s[^>]*)?>/i;
    pat = headRe.test(pat) ? pat.replace(headRe, function(m){ return m + inject; }) : inject + pat;
    return new Promise(function(resolve){
      var fr = document.createElement('iframe');
      // Nur Skripte, kein gleicher Ursprung: die Seite kann weder localStorage
      // noch die Library anfassen, nur ihre Antwort schicken.
      fr.setAttribute('sandbox', 'allow-scripts');
      fr.setAttribute('aria-hidden', 'true');
      fr.style.cssText = 'position:absolute;left:-9999px;top:0;width:800px;height:600px;border:0;visibility:hidden;';
      var fertig = false;
      function ende(r){
        if(fertig) return; fertig = true;
        window.removeEventListener('message', onMsg); clearTimeout(timer);
        try{ fr.remove(); }catch(e){}
        // Ältere Pöstlergeografie: kennt den Prüfungsmodus, antwortet aber noch nicht.
        if((!r || r.art === 'keine') && html.indexOf('__GEO_PRUEFUNG') >= 0) r = PRUEF_GEO_INFO;
        r = r || {art:'keine'};
        if(r.art !== 'keine') pruefProbeCache[contentId] = r;
        resolve(r);
      }
      function onMsg(e){
        var d = e.data;
        if(e.source === fr.contentWindow && d && d.type === 'libPruefung' && d.action === 'info') ende(d);
      }
      window.addEventListener('message', onMsg);
      var timer = setTimeout(function(){ ende(null); }, 20000);
      document.body.appendChild(fr);
      fr.srcdoc = pat;
    });
  });
}

/* ---------- Zufall mit Seed (gleiche Prüfung für alle) ---------- */

function pruefRng(seed){
  var a = seed >>> 0;
  return function(){ a = (a + 0x6D2B79F5) >>> 0; var t = a; t = Math.imul(t ^ (t >>> 15), t | 1); t ^= t + Math.imul(t ^ (t >>> 7), t | 61); return ((t ^ (t >>> 14)) >>> 0) / 4294967296; };
}
function pruefMischen(arr, rnd){
  var a = arr.slice();
  for(var i=a.length-1;i>0;i--){ var j = Math.floor(rnd() * (i+1)); var t = a[i]; a[i] = a[j]; a[j] = t; }
  return a;
}
// SVG aus der eigenen Übung, aber sicherheitshalber ohne Skripte/Event-Handler.
function pruefBildSauber(s){
  return String(s || '').replace(/<script[\s\S]*?<\/script>/gi, '').replace(/\son[a-z]+\s*=\s*("[^"]*"|'[^']*'|[^\s>]+)/gi, '');
}

// Zieht aus der Bank die Prüfungsfragen. Pro Bloom-Stufe (Anteile bloomPct)
// reihum aus Töpfen «Bereich × Aufgabentyp» — so mischen sich Bereiche und
// Typen gleichmässig. Reicht eine Stufe nicht, wird mit dem Rest aufgefüllt.
// Sortiert: Erinnern → Verstehen → Anwenden, darin nach Bereich und Original.
// Liefert die öffentlichen Fragen (ohne Lösung), die Lösungen und die Bilder getrennt.
function pruefBankZiehen(info, kats, anzahl, seed, bloomPct){
  var rnd = pruefRng(seed), katIdx = {}, lvIdx = {erinnern:0, verstehen:1, anwenden:2};
  kats.forEach(function(k, i){ katIdx[k] = i; });
  var pool = info.fragen.map(function(f, i){ return {f:f, i:i, lv:f.typ === 'diktat' ? 'erinnern' : pruefBloom(f)}; })
    .filter(function(x){ return katIdx.hasOwnProperty(x.f.kat); });
  var pct = bloomPct && bloomPct.length === 3 ? bloomPct.map(Number) : [34, 33, 33];
  var summe = (pct[0] + pct[1] + pct[2]) || 1;
  var ziel = [Math.round(anzahl * pct[0] / summe), Math.round(anzahl * pct[1] / summe)];
  ziel.push(Math.max(0, anzahl - ziel[0] - ziel[1]));
  function toepfe(schluessel){
    var t = {};
    pool.forEach(function(x){ if(x.weg) return; var k = schluessel(x); if(k == null) return; (t[k] = t[k] || []).push(x); });
    return pruefMischen(Object.keys(t).sort(), rnd).map(function(k){ return pruefMischen(t[k], rnd); });
  }
  var gezogen = [];
  function ziehe(tp, n){
    var z = 0;
    while(n > 0 && tp.some(function(t){ return t.length; })){
      var t = tp[z++ % tp.length];
      if(t.length){ var x = t.shift(); x.weg = true; gezogen.push(x); n--; }
    }
    return n;
  }
  var rest = 0;
  ['erinnern', 'verstehen', 'anwenden'].forEach(function(lv, i){
    rest += ziehe(toepfe(function(x){ return x.lv === lv ? x.f.kat + '|' + x.f.typ : null; }), ziel[i]);
  });
  if(rest > 0) ziehe(toepfe(function(x){ return x.lv + '|' + x.f.kat + '|' + x.f.typ; }), rest);
  gezogen.sort(function(a, b){ return (lvIdx[a.lv] - lvIdx[b.lv]) || (katIdx[a.f.kat] - katIdx[b.f.kat]) || (a.i - b.i); });
  var katName = {};
  info.kategorien.forEach(function(k){ katName[k.id] = k.name; });
  var bilder = [], bildNr = {}, fragen = [], loesungen = {};
  gezogen.forEach(function(x, i){
    var f = x.f, id = 'q' + i;
    var q = {id:id, typ:f.typ, kat:katName[f.kat] || f.kat, frage:f.frage || ''};
    if(f.typ !== 'diktat') q.bloom = x.lv;
    if(f.kontext) q.kontext = f.kontext;
    if(f.bild){
      if(!bildNr.hasOwnProperty(f.bild)){ bildNr[f.bild] = bilder.length; bilder.push(pruefBildSauber(f.bild)); }
      q.bild = bildNr[f.bild];
    }
    var L = {punkte:pruefPunkteVorschlag(f)};
    if(f.typ === 'mc'){ q.optionen = f.optionen; L.loesung = f.loesung; L.anzeige = f.optionen[f.loesung] || ''; }
    else if(f.typ === 'tf'){ L.loesung = f.loesung; L.anzeige = f.loesung ? 'Wahr' : 'Falsch'; }
    else if(f.typ === 'text'){ L.loesung = f.loesung; L.anzeige = f.loesung[0] || ''; }
    else if(f.typ === 'offen'){ L.loesung = f.loesung; L.stichworte = pruefStichworte(f.loesung, f.begriff); L.anzeige = f.loesung; }
    else if(f.typ === 'diktat'){ L.text = f.text; L.alt = f.alt || []; L.punkte = pruefDiktatTokens(f.text.join(' ')).length || 1; L.anzeige = ''; }
    else if(f.typ === 'zahl'){ q.einheit = f.einheit || ''; L.loesung = f.loesung; L.anzeige = String(f.loesung.wert).replace('.', ',') + (f.einheit ? ' ' + f.einheit : ''); }
    else if(f.typ === 'zuordnen'){
      var perm = pruefMischen(f.rechts.map(function(r, j){ return j; }), rnd);
      q.links = f.links; q.rechts = perm.map(function(j){ return f.rechts[j]; });
      L.loesung = f.links.map(function(l, li){ return perm.indexOf(li); });
      L.anzeige = f.links.map(function(l, li){ return l + ' → ' + f.rechts[li]; }).join('; ');
    }
    else if(f.typ === 'reihenfolge'){
      var pm = pruefMischen(f.items.map(function(r, j){ return j; }), rnd);
      q.items = pm.map(function(j){ return f.items[j]; });
      L.loesung = f.items.map(function(it, j){ return pm.indexOf(j); });
      L.anzeige = f.items.join(' → ');
    }
    L.typ = f.typ;
    if(f.typ !== 'diktat') q.punkte = L.punkte;
    fragen.push(q); loesungen[id] = L;
  });
  return {fragen:fragen, loesungen:loesungen, bilder:bilder};
}

/* ---------- Bank-Prüfung korrigieren (Gerät der Lehrperson) ---------- */

function pruefLoesungLaden(pid){
  if(pruef.loes[pid]) return Promise.resolve(pruef.loes[pid]);
  return getDoc(loesRef(pid)).then(function(snap){
    var l = snap.exists() ? (snap.data().loesungen || {}) : {};
    pruef.loes[pid] = l;
    return l;
  });
}
function pruefNorm(s){
  return (s || '').toString().trim().toLowerCase()
    .replace(/ä/g,'ae').replace(/ö/g,'oe').replace(/ü/g,'ue').replace(/ß/g,'ss')
    .replace(/[.,!?;:]/g,'').replace(/\s+/g,' ');
}
function pruefZahl(s){
  var m = String(s == null ? '' : s).replace(/[’'\s]/g, '').replace(',', '.').match(/-?\d+(\.\d+)?/);
  return m ? parseFloat(m[0]) : NaN;
}
// Punkte pro Frage: q.punkte (änderbar unter «Aufgaben & Punkte»), sonst aus
// der Lösung. Handkorrektur: korrektur[frageId] = Punkte (ältere: true/false).
function pruefBankBewerten(p, loes, antworten, korrektur){
  antworten = antworten || {}; korrektur = korrektur || {};
  var details = [];
  (p.fragen || []).forEach(function(q){
    var L = loes[q.id]; if(!L) return;
    if(q.typ === 'diktat'){ details = details.concat(pruefDiktatDetails(q, L, antworten[q.id], korrektur)); return; }
    var v = antworten[q.id], max = +q.punkte > 0 ? +q.punkte : (L.punkte || 1), pkt = 0, a = '–', hinweis = '';
    if(q.typ === 'mc'){ if(v != null && q.optionen[v] != null) a = q.optionen[v]; pkt = v === L.loesung ? max : 0; }
    else if(q.typ === 'tf'){ a = v === true ? 'Wahr' : v === false ? 'Falsch' : '–'; pkt = v === L.loesung ? max : 0; }
    else if(q.typ === 'text'){ if(v) a = v; var nv = pruefNorm(v); pkt = nv && (L.loesung || []).some(function(x){ return pruefNorm(x) === nv; }) ? max : 0; }
    else if(q.typ === 'zahl'){ if(v) a = v + (q.einheit ? ' ' + q.einheit : ''); var z = pruefZahl(v); pkt = !isNaN(z) && Math.abs(z - L.loesung.wert) <= L.loesung.tol + 1e-9 ? max : 0; }
    else if(q.typ === 'offen'){ if(v) a = v; var o = pruefOffenBewerten(v, L, max); pkt = o.pkt; hinweis = o.hinweis; }
    else if(q.typ === 'zuordnen'){
      var arr = Array.isArray(v) ? v : [], n = L.loesung.length || 1;
      var ri = L.loesung.filter(function(r, i){ return arr[i] === r; }).length;
      pkt = ri === n ? max : pruefHalb(max * ri / n);
      if(arr.some(function(x){ return x != null; })) a = q.links.map(function(l, i){ return l + ' → ' + (arr[i] != null ? q.rechts[arr[i]] : '–'); }).join('; ');
    }
    else if(q.typ === 'reihenfolge'){
      if(Array.isArray(v)){
        a = v.map(function(i){ return q.items[i]; }).join(' → ');
        var rp = v.filter(function(x, i){ return x === L.loesung[i]; }).length, m = L.loesung.length || 1;
        pkt = rp === m ? max : pruefHalb(max * rp / m);
      }
    }
    var hand = pruefKorr(korrektur, q.id, max);
    if(hand != null) pkt = hand;
    details.push({id:q.id, typ:q.typ, f:q.frage, kat:q.kat, a:a, r:L.anzeige || '', ok:pkt >= max, teil:pkt > 0 && pkt < max,
      pkt:pkt, max:max, hinweis:hinweis, bloom:q.bloom || '', hand:hand != null});
  });
  var punkte = 0, total = 0;
  details.forEach(function(d){ punkte += d.pkt; total += d.max; });
  return {punkte:Math.round(punkte * 100) / 100, max:Math.round(total * 100) / 100, details:details};
}

/* ---------- Diktat korrigieren ----------
   Wort für Wort (LCS) gegen den Originaltext. Satzzeichen am Wortrand zählen
   nicht, Gross/Klein schon, ß = ss. Erlaubte Varianten (ACCEPTED_ALTERNATES,
   z.B. «so dass»/«sodass») werden vorher auf die Schreibweise im Text gebracht.
   Jeder Fehler ist eine eigene Zeile, die die Lehrperson streichen kann
   (korrektur[id] = true); fehlende oder überzählige Wörter am Stück sind eine
   Zeile und zählen pro Wort. */
function pruefDiktatTokens(t){
  // Wörter und Satzzeichen getrennt: jedes Satzzeichen ist ein eigenes Token
  // (fehlendes Komma = 1 Fehler, das Wort davor bleibt richtig).
  var out = [];
  String(t || '').replace(/[„“”«»‹›"]/g, '"').replace(/[‘’‚`´]/g, "'").replace(/\.\.\./g, '…').replace(/—/g, '–')
    .split(/\s+/).forEach(function(w){
      var m = w.match(/^([^\p{L}\p{N}]*)([\s\S]*?)([^\p{L}\p{N}]*)$/u);
      if(!m) return;
      var zeichen = function(g){ Array.from(g).forEach(function(c){ if(c === '-') c = '–'; out.push({roh:c, k:c, z:true}); }); };
      zeichen(m[1]);
      if(m[2]) out.push({roh:m[2], k:m[2].replace(/ß/g, 'ss')});
      zeichen(m[3]);
    });
  return out;
}
function pruefDiktatDetails(q, L, v, korrektur){
  var orig = (L.text || []).join(' '), ein = String(v || '');
  (L.alt || []).forEach(function(g){
    var vs = String(g).split('|'), kanon = vs.filter(function(x){ return orig.indexOf(x) >= 0; })[0] || vs[0];
    vs.forEach(function(x){
      if(x === kanon) return;
      var re = new RegExp('(^|[^\\p{L}])' + x.replace(/[.*+?^${}()|[\]\\]/g, '\\$&') + '(?=$|[^\\p{L}])', 'gu');
      ein = ein.replace(re, function(m, vor){ return vor + kanon; });
    });
  });
  var A = pruefDiktatTokens(orig), B = pruefDiktatTokens(ein), n = A.length, m = B.length;
  // LCS-Tabelle von hinten, dann vorwärts ablaufen
  var T = [];
  for(var i=0;i<=n;i++) T.push(new Uint16Array(m+1));
  for(i=n-1;i>=0;i--) for(var j=m-1;j>=0;j--) T[i][j] = A[i].k === B[j].k ? T[i+1][j+1] + 1 : Math.max(T[i+1][j], T[i][j+1]);
  var fehler = [], del = [], ins = [];
  // Innerhalb einer Lücke nur Wort mit Wort und Zeichen mit Zeichen paaren.
  function paaren(dl, il, pos){
    var k = Math.min(dl.length, il.length);
    for(var x=0;x<k;x++) fehler.push({id:q.id + '~' + dl[x], pos:dl[x], n:1, a:B[il[x]].roh, r:A[dl[x]].roh, art:'falsch'});
    if(dl.length > k) fehler.push({id:q.id + '~' + dl[k], pos:dl[k], n:dl.length - k, a:'–', r:dl.slice(k).map(function(x){ return A[x].roh; }).join(' '), art:'fehlt'});
    if(il.length > k) fehler.push({id:q.id + '~+' + il[k], pos:pos, n:il.length - k, a:il.slice(k).map(function(x){ return B[x].roh; }).join(' '), r:'(nichts)', art:'zuviel'});
  }
  function lueckeAbschliessen(){
    var wortD = function(x){ return !A[x].z; }, wortI = function(x){ return !B[x].z; };
    paaren(del.filter(wortD), ins.filter(wortI), i);
    paaren(del.filter(function(x){ return !wortD(x); }), ins.filter(function(x){ return !wortI(x); }), i);
    del = []; ins = [];
  }
  i = 0; j = 0;
  while(i < n || j < m){
    if(i < n && j < m && A[i].k === B[j].k){ lueckeAbschliessen(); i++; j++; }
    else if(j < m && (i >= n || T[i][j+1] >= T[i+1][j])) ins.push(j++);
    else del.push(i++);
  }
  lueckeAbschliessen();
  fehler.sort(function(x, y){ return x.pos - y.pos; });
  var zaehlt = 0;
  var rows = fehler.map(function(f){
    var ok = !!korrektur[f.id];
    if(!ok) zaehlt += f.n;
    var was = f.art === 'fehlt' ? (f.n > 1 ? 'fehlt (' + f.n + ' Wörter/Zeichen)' : 'fehlt') : f.art === 'zuviel' ? (f.n > 1 ? 'zu viel (' + f.n + ' Wörter/Zeichen)' : 'zu viel') : 'falsch';
    return {id:f.id, nr:true, f:'«' + (f.art === 'zuviel' ? f.a : f.r) + '» — ' + was, kat:f.n > 1 ? f.n + ' Fehler' : '', a:f.a, r:f.r, ok:ok, pkt:0, max:0};
  });
  var max = n || 1, pkt = Math.max(0, max - zaehlt);
  var nw = A.filter(function(x){ return !x.z; }).length, mw = B.filter(function(x){ return !x.z; }).length;
  var info = {id:q.id, info:true, f:'Diktat: ' + zaehlt + ' Fehler · ' + mw + ' von ' + nw + ' Wörtern geschrieben', a:'', ok:zaehlt === 0, pkt:pkt, max:max};
  return [info].concat(rows);
}
function pruefDiktatWoerter(t){ return pruefDiktatTokens(t).filter(function(x){ return !x.z; }).length; }

function pruefBankSetze(v){
  var s = pruef.sess, b = s.bank, q = b.fragen[b.i];
  b.ans[q.id] = v;
  pruefStand(s, Object.assign({}, b.ans), q.typ === 'diktat' ? pruefDiktatWoerter(v) : pruefBankBeantwortet(b));
}
function pruefBankKlick(e){
  var s = pruef.sess; if(!s || !s.bank || s.ending) return;
  var b = s.bank, q = b.fragen[b.i], t = e.target.closest('button'); if(!t) return;
  if(t.hasAttribute('data-v')){
    var raw = t.getAttribute('data-v');
    pruefBankSetze(q.typ === 'tf' ? raw === 'true' : +raw);
    pruefBankZeichnen(); return;
  }
  if(t.hasAttribute('data-up') || t.hasAttribute('data-down')){
    var ord = Array.isArray(b.ans[q.id]) ? b.ans[q.id].slice() : q.items.map(function(x, i){ return i; });
    var pos = +(t.getAttribute('data-up') || t.getAttribute('data-down')), ziel = t.hasAttribute('data-up') ? pos - 1 : pos + 1;
    if(ziel < 0 || ziel >= ord.length) return;
    var tmp = ord[pos]; ord[pos] = ord[ziel]; ord[ziel] = tmp;
    pruefBankSetze(ord); pruefBankZeichnen(); return;
  }
  if(t.hasAttribute('data-nav')){ b.i = Math.max(0, Math.min(b.fragen.length-1, b.i + (+t.getAttribute('data-nav')))); pruefBankZeichnen(); return; }
  if(t.hasAttribute('data-go')){ b.i = +t.getAttribute('data-go'); pruefBankZeichnen(); return; }
  if(t.hasAttribute('data-abgeben')){ pruefBankAbgeben(false); return; }
  if(t.hasAttribute('data-ok')){ pruefBankAbgeben(true); return; }
  if(t.hasAttribute('data-nein')){ document.getElementById('prBankConfirm').innerHTML = ''; }
}
function pruefBankEingabe(e){
  var s = pruef.sess; if(!s || !s.bank || s.ending) return;
  var b = s.bank, q = b.fragen[b.i], t = e.target;
  if(t.id === 'prDiktatIn'){
    if(e.type !== 'input') return;
    pruefBankSetze(t.value);
    var z = document.getElementById('prDiktatZahl');
    if(z) z.textContent = pruefDiktatWoerter(t.value) + ' Wörter';
    return;
  }
  if(t.id === 'prBankIn'){
    if(e.type !== 'input') return;
    pruefBankSetze(t.value.trim() ? t.value : '');
    // Nur Zähler/Punkte nachführen, nicht neu zeichnen (sonst springt der Cursor).
    var kopf = document.querySelector('.pr-q-kopf span:last-child');
    if(kopf) kopf.textContent = 'Frage '+(b.i+1)+' von '+b.fragen.length+' · '+pruefBankBeantwortet(b)+' beantwortet';
    var dot = document.querySelector('.pr-q-dots [data-go="'+b.i+'"]');
    if(dot) dot.classList.toggle('done', pruefBankHat(b.ans[q.id]));
    return;

    var arr = Array.isArray(b.ans[q.id]) ? b.ans[q.id].slice() : q.links.map(function(){ return null; });

}

function pruefBankAbgeben(sofort){
  var s = pruef.sess; if(!s || !s.bank || s.ending) return;

          data.maxPunkte = Object.keys(zug.loesungen).reduce(function(s, k){ return s + (zug.loesungen[k].punkte || 1); }, 0);

  });

/* ---------- Lehrperson: Aufgaben & Punkte ----------
   Punkte (halbe erlaubt) und Bloom-Stufe jeder gezogenen Frage von Hand
   anpassen. Geht auch nach der Freigabe; bereits eingetragene Noten werden
   nachgeführt. */
async function pruefAufgabenPunkte(p){
  var loes = {};
  try{ loes = await pruefLoesungLaden(p.id); }catch(err){ console.error(err); }
  var fr = (p.fragen || []).map(function(q){
    return Object.assign({}, q, {punkte:+q.punkte > 0 ? +q.punkte : ((loes[q.id] || {}).punkte || 1), bloom:pruefBloomNorm(q.bloom) || pruefBloom(q)});
  });
  function summe(){ return Math.round(fr.reduce(function(s, q){ return s + q.punkte; }, 0) * 100) / 100; }
  function kopf(){
    var z = {erinnern:0, verstehen:0, anwenden:0}, n = fr.length || 1;
    fr.forEach(function(q){ z[q.bloom]++; });
    return 'Total <b>'+pruefZahlText(summe())+'</b> Punkte · ' + PRUEF_BLOOM.map(function(x){ return x.icon+' '+x.name+' '+Math.round(z[x.id] / n * 100)+' %'; }).join(' · ');
  }
  var h = '<h3>🧮 Aufgaben & Punkte</h3><p class="pr-hinweis" id="prApKopf">'+kopf()+'</p>';
  h += '<p class="pr-hinweis">Punkte sind ein Vorschlag nach Aufgabentyp (Auswahl/Wahr-Falsch/Lücke 1, Zuordnen ½ pro Paar, Reihenfolge und Rechnen 2, offen 2–3). Halbe Punkte gehen.</p>';
  h += '<div class="pr-ap">' + fr.map(function(q, i){
    return '<div class="pr-ap-row"><span class="pr-ap-nr">'+(i+1)+'.</span><div class="pr-ap-f"><div class="pr-ap-meta"><span class="pr-badge">'+esc(PRUEF_TYPEN[q.typ] || q.typ)+'</span>'+
      '<select class="modal-input pr-ap-bloom" data-b="'+i+'">' + PRUEF_BLOOM.map(function(x){ return '<option value="'+x.id+'"'+(q.bloom === x.id ? ' selected' : '')+'>'+x.icon+' '+x.name+'</option>'; }).join('') + '</select>'+
      '<small>'+esc(q.kat || '')+'</small></div><div>'+esc(q.frage || '')+'</div></div>'+
      '<label class="pr-ap-p"><input type="number" class="modal-input" data-p="'+i+'" min="0.5" max="50" step="0.5" value="'+q.punkte+'"><span>P.</span></label></div>';
  }).join('') + '</div>';
  h += '<div class="modal-actions"><button class="btn btn-ghost btn-sm" id="modalCancel" type="button">Abbrechen</button><button class="btn btn-primary btn-sm" id="modalOk" type="button">Speichern</button></div>';
  openModal(h, 'pr-modal');
  var host = document.querySelector('.pr-modal');
  host.addEventListener('input', function(e){
    var i = e.target.getAttribute('data-p');
    if(i == null) return;
    var v = Math.round(parseFloat(String(e.target.value).replace(',', '.')) * 2) / 2;
    if(v > 0) fr[+i].punkte = v;
    document.getElementById('prApKopf').innerHTML = kopf();
  });
  host.addEventListener('change', function(e){
    var i = e.target.getAttribute('data-b');
    if(i == null) return;
    fr[+i].bloom = e.target.value;
    document.getElementById('prApKopf').innerHTML = kopf();
  });
  document.getElementById('modalCancel').addEventListener('click', closeModal);
  document.getElementById('modalOk').addEventListener('click', async function(){
    this.disabled = true;
    try{
      var upd = {fragen:fr, maxPunkte:summe()};
      await updateDoc(pruefRef(p.id), upd);
      closeModal();
      toast('Punkte gespeichert.');
      if(p.resultateFrei) pruefNotenEintragen(Object.assign({}, p, upd)).catch(pruefFehler);
    }catch(err){ this.disabled = false; pruefFehler(err); }
  });
}

  clearSubjectWatchers(); clearOverviewWatchers();

function pruefTeilStatus(t){
  if(!t) return {cls:'nix', txt:'⚪ nicht gestartet'};
  if(t.status === 'abgegeben') return {cls:'ab', txt:'✅ abgegeben'};
  if(t.status === 'gesperrt'){ var v = (t.verstoesse || []).slice(-1)[0]; return {cls:'gesperrt', txt:'🔒 gesperrt'+(v ? ' – '+v.grund : '')}; }
  if(!t.aktiv) return {cls:'frei', txt:'🔓 entsperrt, noch nicht weiter'};
  var lebt = pruefMs(t.lebt);
  if(lebt && Date.now() - lebt > PRUEF_STALE_MS) return {cls:'weg', txt:'🟠 keine Verbindung seit '+Math.round((Date.now() - lebt)/60000)+' Min.'};
  return {cls:'laeuft', txt:'🟢 schreibt'};
}
// Resultat einer abgegebenen Teilnahme: bei Bank-Prüfungen hier korrigiert
// (braucht die Lösungen), sonst das, was die Übungsseite mitgeschickt hat.
function pruefErgebnis(p, t){
  if(!t || t.status !== 'abgegeben') return null;

  return typeof t.punkte === 'number' ? {punkte:t.punkte, max:t.max, details:t.details || []} : null;
}

  if(p.status !== 'offen') h += '<button class="btn btn-ghost btn-sm" data-a="loeschen" type="button">🗑 Löschen</button>';
  h += '</div>';
  if(!teil || !roster){ el.innerHTML = h + '<div class="empty-state">Klasse wird geladen …</div>'; pruefMonitorVerdrahten(p); return; }
  var rows = roster.map(function(s){ return {uid:s.uid, name:s.displayName || s.username || s.uid, t:teil[s.uid] || null}; });
  Object.keys(teil).forEach(function(uid){ if(!rows.some(function(r){ return r.uid === uid; })) rows.push({uid:uid, name:teil[uid].name || uid, t:teil[uid]}); });
  var z = {ab:0, gesperrt:0, laeuft:0, nix:0}, notenListe = [];
  rows.forEach(function(r){
    var st = pruefTeilStatus(r.t);
    r.st = st; r.erg = pruefErgebnis(p, r.t);
    if(st.cls === 'ab'){ z.ab++; if(r.erg){ var n = pruefNote(p, r.erg.punkte, r.erg.max); if(n != null) notenListe.push(n); } }
    else if(st.cls === 'gesperrt') z.gesperrt++;
    else if(st.cls === 'nix') z.nix++;
    else z.laeuft++;
  });
  if(p.resultateFrei && (pruefArt(p) !== 'bank' || pruef.loes[p.id])){
    pruef.notiertVersucht = pruef.notiertVersucht || {};
    var spaet = rows.filter(function(r){ return r.t && r.t.status === 'abgegeben' && !r.t.notiertAm && !pruef.notiertVersucht[p.id + '/' + r.uid]; }).map(function(r){ return r.uid; });
    if(spaet.length){
      spaet.forEach(function(u){ pruef.notiertVersucht[p.id + '/' + u] = true; });
      pruefNotenEintragen(p, spaet).catch(pruefFehler);
    }
  }
  var schnitt = notenListe.length ? notenListe.reduce(function(a,b){ return a+b; }, 0) / notenListe.length : null;
  h += '<div class="pr-zahlen"><div><b>'+z.laeuft+'</b><span>schreiben</span></div><div class="'+(z.gesperrt ? 'alarm' : '')+'"><b>'+z.gesperrt+'</b><span>gesperrt</span></div>'+
    '<div><b>'+z.ab+'</b><span>abgegeben</span></div><div><b>'+z.nix+'</b><span>nicht gestartet</span></div><div><b>'+(schnitt == null ? '–' : schnitt.toFixed(2))+'</b><span>Schnitt</span></div></div>';
  if(z.gesperrt > 1) h += '<div class="back-row"><button class="btn btn-primary btn-sm" data-a="alleEntsperren" type="button">🔓 Alle '+z.gesperrt+' entsperren</button></div>';
  var rang = {gesperrt:0, weg:1, frei:2, laeuft:3, ab:4, nix:5};
  rows.sort(function(a,b){ return (rang[a.st.cls] - rang[b.st.cls]) || a.name.localeCompare(b.name, 'de'); });
  h += '<div class="pr-tabelle">';
  rows.forEach(function(r){
    var t = r.t, st = r.st;
    var fort = !t ? '' : t.status === 'abgegeben'
      ? (r.erg ? (p.diktat ? (r.erg.max - r.erg.punkte)+' Fehler' : pruefZahlText(r.erg.punkte)+' / '+pruefZahlText(r.erg.max)+' Pkt')+' · Note <b>'+pruefNoteText(pruefNote(p, r.erg.punkte, r.erg.max))+'</b>' : 'wird korrigiert …')
      : (p.diktat ? (t.beantwortet || 0)+' Wörter geschrieben' : (t.beantwortet || 0)+' / '+anzahl+' beantwortet') + (pruefFrist(p, t) ? ' · ⏱ ' + (pruefZeitUm(p, t) ? 'Zeit um' : Math.ceil((pruefFrist(p, t) - Date.now()) / 60000) + ' Min. übrig') : '');
    var vs = t && t.verstoesse && t.verstoesse.length ? ' · <span class="pr-vs" title="'+esc(t.verstoesse.map(function(v){ return new Date(v.at).toLocaleTimeString('de-CH',{hour:'2-digit',minute:'2-digit'})+' '+v.grund; }).join('\n'))+'">⚠️ '+t.verstoesse.length+'× verlassen</span>' : '';
    h += '<div class="pr-zeile '+st.cls+'"><div class="pr-name">'+esc(r.name)+'</div><div class="pr-st">'+esc(st.txt)+'</div><div class="pr-fort">'+fort+vs+'</div><div class="pr-akt">';
    if(t && t.status === 'gesperrt') h += '<button class="btn btn-primary btn-sm" data-e="'+esc(r.uid)+'" type="button">🔓 Entsperren</button>';
    if(t && t.status === 'abgegeben' && r.erg) h += '<button class="btn btn-ghost btn-sm" data-d="'+esc(r.uid)+'" type="button">Details</button>';
    if(t) h += '<button class="btn btn-ghost btn-sm" data-r="'+esc(r.uid)+'" type="button" title="Teilnahme löschen — die Person kann neu beginnen">↺</button>';
    h += '</div></div>';
  });
  h += '</div>';
  el.innerHTML = h;
  pruefMonitorVerdrahten(p);
}
function pruefMonitorVerdrahten(p){
  var el = document.getElementById('prMon');
  el.onclick = function(e){
    var b = e.target.closest('button'); if(!b) return;
    var a = b.getAttribute('data-a'), eu = b.getAttribute('data-e'), du = b.getAttribute('data-d'), ru = b.getAttribute('data-r');
    var teil = pruef.teil[p.id] || {};
    if(eu){ updateDoc(teilRef(p.id, eu), {status:'laeuft', aktiv:false, entsperrtAm:serverTimestamp()}).then(function(){ toast('Entsperrt.'); }).catch(pruefFehler); return; }
    if(du){ pruefDetailsLehrer(p, du); return; }
    if(ru){
      uiConfirm('Teilnahme zurücksetzen?', (teil[ru] && teil[ru].name || 'Die Person')+' verliert alle Antworten und kann die Prüfung neu beginnen.', 'Zurücksetzen', function(){
        writeBatch().delete(teilRef(p.id, ru)).delete(pruefNoteRef(ru, p.id)).commit().then(function(){ toast('Zurückgesetzt.'); }).catch(pruefFehler);
      }, true);
      return;
    }
    if(a === 'freigeben') pruefFreigeben(p);
    else if(a === 'beenden') uiConfirm('Prüfung beenden?', 'Wer noch schreibt, gibt automatisch mit dem aktuellen Stand ab. Gesperrte geben ab, sobald du sie entsperrst und sie auf «Abgeben» klicken.', 'Beenden', function(){ updateDoc(pruefRef(p.id), {status:'beendet', beendetAm:serverTimestamp()}).catch(pruefFehler); }, true);
    else if(a === 'oeffnen') updateDoc(pruefRef(p.id), {status:'offen'}).catch(pruefFehler);
    else if(a === 'resultate') pruefResultateUmschalten(p);
    else if(a === 'vorschau') pruefStarten(p, false, true);
    else if(a === 'bearbeiten') pruefEditor(p);
    else if(a === 'punkte') pruefAufgabenPunkte(p);
    else if(a === 'alleEntsperren'){
      var batch = writeBatch();
      Object.keys(teil).forEach(function(uid){ if(teil[uid].status === 'gesperrt') batch.update(teilRef(p.id, uid), {status:'laeuft', aktiv:false, entsperrtAm:serverTimestamp()}); });
      batch.commit().then(function(){ toast('Alle entsperrt.'); }).catch(pruefFehler);
    }
    else if(a === 'loeschen') uiConfirm('Prüfung löschen?', 'Die Prüfung und alle Abgaben werden gelöscht — auch die Noten im Notenrechner der Schüler:innen.', 'Löschen', async function(){
      try{
        var snap = await getDocs(teilCol(p.id));
        var batch = writeBatch();
        snap.forEach(function(d){ batch.delete(d.ref); batch.delete(pruefNoteRef(d.id, p.id)); });
        batch.delete(loesRef(p.id));
        batch.delete(pruefRef(p.id));
        await batch.commit();
        state.route = {name:'pruefungen'}; render();
      }catch(err){ pruefFehler(err); }
    }, true);
  };
}
// Resultate freigeben: Punkte + Details in jede abgegebene Teilnahme schreiben
// (bei Bank-Prüfungen dürfen die Schüler:innen die Lösungen nicht lesen und
// sehen nur, was hier hineingeschrieben wird) und die Note im Notenrechner
// eintragen. Verbergen nimmt die Noten wieder heraus.
async function pruefResultateUmschalten(p){
  try{
    if(!p.resultateFrei){
      await pruefNotenEintragen(p);
      await updateDoc(pruefRef(p.id), {resultateFrei:true});
      toast('Resultate frei — Noten sind im Notenrechner eingetragen.');
    } else {
      await updateDoc(pruefRef(p.id), {resultateFrei:false});
      await pruefNotenEntfernen(p);
      toast('Resultate verborgen — Noten aus dem Notenrechner entfernt.');
    }
  }catch(err){ pruefFehler(err); }
}

/* ---------- Noten im Notenrechner der Schüler:innen ----------
   progress/{uid}/pruefungsnoten/{klasse}_{pruefungId} -> {fach, name, note, gewicht}
   Schreibt nur die Lehrperson; der Notenrechner zeigt diese Einträge fest
   (nicht änderbar) neben den selbst eingetragenen Noten. */
function pruefNoteRef(uid, pid){ return doc(db, 'progress', uid, 'pruefungsnoten', state.klasse + '_' + pid); }
async function pruefNotenEintragen(p, nurUids){
  var teil = pruef.teil[p.id] || {};
  var loes = pruefArt(p) === 'bank' ? await pruefLoesungLaden(p.id) : null;
  var batch = writeBatch(), n = 0;
  Object.keys(teil).forEach(function(uid){
    if(nurUids && nurUids.indexOf(uid) < 0) return;
    var t = teil[uid]; if(t.status !== 'abgegeben') return;
    var r = loes ? pruefBankBewerten(p, loes, t.antworten, t.korrektur)
                 : (typeof t.punkte === 'number' ? {punkte:t.punkte, max:t.max} : null);
    if(!r || !r.max) return;
    var upd = {notiertAm:serverTimestamp()};
    if(loes){ upd.punkte = r.punkte; upd.max = r.max; upd.details = r.details; }
    batch.update(teilRef(p.id, uid), upd);
    pruefNoteSetzen(batch, p, uid, r);
    n++;
  });
  if(n) await batch.commit();
}
function pruefNoteSetzen(batch, p, uid, r){
  batch.set(pruefNoteRef(uid, p.id), {fach:p.fach || '', name:p.titel || 'Prüfung', note:pruefNote(p, r.punkte, r.max),
    gewicht:+p.gewicht > 0 ? +p.gewicht : 1, pruefungId:p.id, klasse:state.klasse, datum:serverTimestamp()});
}
async function pruefNotenEntfernen(p){
  var teil = pruef.teil[p.id] || {}, batch = writeBatch(), n = 0;
  Object.keys(teil).forEach(function(uid){
    batch.delete(pruefNoteRef(uid, p.id));
    if(teil[uid].notiertAm) batch.update(teilRef(p.id, uid), {notiertAm:null});
    n++;
  });
  if(n) await batch.commit();
}
function pruefFehler(err){
  console.error(err);
  if(err && err.code === 'klasse/abgebrochen') return;
  toast('Hat nicht geklappt'+(err && err.code ? ' ('+err.code+')' : '')+'.');
}
async function pruefFreigeben(p){
  try{
    // Ältere Prüfungen ohne «art»: nur freigeben, wenn die Übung den
    // Prüfungsmodus kennt — sonst landeten die Schüler:innen gesperrt in einer
    // normalen Übungsseite. Neue Prüfungen wurden beim Anlegen schon befragt.
    if(!p.art){
      toast('Übung wird geprüft …');
      var html = await loadResourceHtml(p.contentId);
      if(html.indexOf('__GEO_PRUEFUNG') < 0){
        uiInfo('Diese Übung hat noch keinen Prüfungsmodus', 'Ersetze die Übung «'+(p.resourceTitel || '')+'» zuerst mit der neuen Fassung, dann nochmals freigeben.');
        return;
      }
    }
    await updateDoc(pruefRef(p.id), {status:'offen', freigegebenAm:serverTimestamp()});
    toast('Freigegeben — bei der Klasse erscheint «Prüfung verfügbar».');
  }catch(err){ pruefFehler(err); }
}
function pruefDetailsLehrer(p, uid){
  var t = (pruef.teil[p.id] || {})[uid];
  if(!t) return;
  var bank = pruefArt(p) === 'bank';
  // Bank: Handkorrektur als {frageId: true|false}; sonst die mitgeschickten Details direkt umschalten.
  var korrektur = Object.assign({}, t.korrektur || {});
  var details = bank ? null : (t.details || []).map(function(d){ return Object.assign({}, d); });
  function erg(){
    if(bank) return pruefBankBewerten(p, pruef.loes[p.id] || {}, t.antworten, korrektur);
    var pk = details.filter(function(d){ return d.ok; }).length;
    return {punkte:pk, max:t.max, details:details};
  }
  function zeichne(){
    var r = erg();
    var h = '<h3>'+esc(t.name || '')+' — '+esc(p.titel)+'</h3>';
    h += '<div class="pr-resultat"><div><span>Note</span><b>'+pruefNoteText(pruefNote(p, r.punkte, r.max))+'</b></div><div><span>'+pruefPunkteLabel(p)+'</span><b>'+esc(pruefPunkteWert(p, r.punkte, r.max))+'</b></div></div>';
    if(t.verstoesse && t.verstoesse.length) h += '<p class="pr-hinweis">⚠️ '+t.verstoesse.length+'× verlassen: '+esc(t.verstoesse.map(function(v){ return new Date(v.at).toLocaleTimeString('de-CH',{hour:'2-digit',minute:'2-digit'})+' '+v.grund; }).join(' · '))+'</p>';
    h += '<p class="pr-hinweis">'+(p.diktat ? 'Tippe auf ❌, um einen Fehler nicht zu zählen (✅ = gestrichen).' : bank ? 'Tippe auf ✅/🟡/❌ für volle oder keine Punkte, oder trag Teilpunkte direkt ein (halbe gehen). ✋ = von Hand gewertet.' : 'Tippe auf ✅/❌, um eine Antwort von Hand anders zu werten.')+'</p>';
    h += pruefDetailsHtml(bank ? r.details : r.details.map(function(d){ return Object.assign({}, d, {max:0}); }), true);
    h += '<div class="modal-actions"><button class="btn btn-ghost btn-sm" id="modalCancel" type="button">Schliessen</button><button class="btn btn-primary btn-sm" id="modalOk" type="button">Korrektur speichern</button></div>';
    openModal(h, 'pr-modal');
    document.getElementById('modalCancel').addEventListener('click', closeModal);
    document.getElementById('modalOk').addEventListener('click', function(){
      var r2 = erg(), upd = {korrigiertAm:serverTimestamp()};
      if(bank){
        upd.korrektur = korrektur;
        // Sind die Resultate schon frei, auch das nachführen, was die Person sieht.
        if(p.resultateFrei){ upd.punkte = r2.punkte; upd.max = r2.max; upd.details = r2.details; }
      } else { upd.details = details; upd.punkte = r2.punkte; }
      // In einem Rutsch: Teilnahme und (falls schon frei) die Note im Notenrechner.
      var batch = writeBatch().update(teilRef(p.id, uid), upd);
      if(p.resultateFrei) pruefNoteSetzen(batch, p, uid, r2);
      batch.commit().then(function(){ closeModal(); toast('Korrektur gespeichert.'); }).catch(pruefFehler);
    });
    Array.prototype.forEach.call(document.querySelectorAll('.pr-det-ok[data-i]'), function(b){
      b.addEventListener('click', function(){
        var i = +b.getAttribute('data-i');
        if(bank){ var d = r.details[i]; korrektur[d.id] = d.max > 0 ? (d.ok ? 0 : d.max) : !d.ok; }
        else details[i].ok = !details[i].ok;
        zeichne();
      });
    });
    Array.prototype.forEach.call(document.querySelectorAll('.pr-det-pkt[data-p]'), function(inp){
      inp.addEventListener('change', function(){
        var d = r.details[+inp.getAttribute('data-p')], v = parseFloat(String(inp.value).replace(',', '.'));
        if(isNaN(v)) return;
        if(bank) korrektur[d.id] = Math.max(0, Math.min(d.max, Math.round(v * 2) / 2));
        zeichne();
      });
    });
  }
  zeichne();
}

/* ===================== 📶 OFFLINE-ANZEIGE =====================
   Der Service Worker (sw-push.js) legt die App-Hülle in einen Cache, und die
   Firestore-Persistenz oben hält die bereits geöffneten Übungen vor. Hier geht
   es nur darum, dass man den Zustand auch SIEHT — sonst wirkt eine Übung, die
   offline aus dem Cache kommt, wie ein Fehler. */

function updateOnlineBadge(){
  var el = document.getElementById('offlineBadge');
  if(!el) return;
  el.hidden = navigator.onLine !== false;
}
window.addEventListener('online', function(){ updateOnlineBadge(); toast('Wieder online — dein Stand wird synchronisiert.'); });
window.addEventListener('offline', function(){ updateOnlineBadge(); toast('Offline — geöffnete Übungen laufen weiter.'); });

function registerAppServiceWorker(){
  if(!('serviceWorker' in navigator) || !window.isSecureContext) return;
  navigator.serviceWorker.register('sw-push.js').catch(function(err){
    console.error('Service Worker konnte nicht registriert werden', err);
  });
}

/* ===================== MAIN RENDER ===================== */

function render(){
  clearOverviewWatchers();
  // Übung verlassen: Stand und Lernzeit ein letztes Mal sichern, Beobachtung stoppen.
  if(state.route.name !== 'resource' && syncState.resourceId){
    stopResourceSync();
    currentViewerResourceId = null;
  }
  if(state.route.name !== 'resource' && timeTrack.resourceId){
    stopTimeTracking();
  }
  if(state.route.name === 'loading'){
    app.innerHTML = '<div class="spinner-wrap">Lädt …</div>';
    return;
  }
  if(state.route.name === 'login'){ renderLogin(); return; }
  if(!state.profile){ app.innerHTML = '<div class="spinner-wrap">Lädt …</div>'; return; }
  if(state.route.name === 'home'){ renderHome(); return; }
  if(state.route.name === 'subject'){ renderSubject(state.route.subject, state.route.folderId || null); return; }
  if(state.route.name === 'resource'){ renderResource(state.route.resource); return; }
  if(state.route.name === 'diktatauswertung'){ renderDiktatAuswertung(); return; }
  if(state.route.name === 'lernstand'){ renderLernstandUebersicht(); return; }
  if(state.route.name === 'kalender'){ renderKalender(); return; }
  if(state.route.name === 'klassenzimmer'){ renderKlassenzimmer(); return; }
  if(state.route.name === 'sitzplan'){ renderSitzplan(); return; }
  if(state.route.name === 'quiz'){ renderQuizVerwaltung(); return; }
  if(state.route.name === 'quizplay'){ renderQuizPlay(); return; }
  if(state.route.name === 'aemtliplan'){ renderAemtliplan(); return; }
  if(state.route.name === 'vergessen'){ renderVergessen(); return; }
  if(state.route.name === 'neu'){ renderNeuigkeiten(); return; }
  if(state.route.name === 'pruefungen'){ renderPruefungen(); return; }
  if(state.route.name === 'pruefung'){ renderPruefungMonitor(); return; }
}

// App-Hülle offline verfügbar machen (siehe sw-push.js).
if(IS_TEST_SITE){ document.title = '🧪 TEST · ' + document.title; }
registerAppServiceWorker();
</script>
