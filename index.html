/* ===================== 🔥 LERN-STREAK (Schüler:innen) =====================
   Zählt pro Tag die tatsächlich geübte Zeit (dieselbe Messung wie beim
   Lernzeit-Tracking oben) und macht daraus Serie, Wochenziel und Abzeichen.
   Gespeichert in streaks/{uid} als Map Tag -> Sekunden; Serie und Rekord
   werden beim Anzeigen aus dieser Map gerechnet, damit ein verpasster Tag
   nicht von einem hängengebliebenen Zähler abhängt. */

var STREAK_MIN_SEC = 120;        // unter 2 Minuten zählt ein Tag nicht als geübt
var STREAK_KEEP_DAYS = 180;
var streakState = { days:null, goalMin:60, loaded:false, lastBump:0 };

function streakDayList(days){
  return Object.keys(days || {}).filter(function(k){ return (days[k]||0) >= STREAK_MIN_SEC; }).sort();
}
function streakCurrent(days){
  var set = {};
  streakDayList(days).forEach(function(d){ set[d] = true; });
  var n = 0, d = new Date();
  // Heute noch nicht geübt? Dann zählt die Serie bis gestern weiter.
  if(!set[localDateStr(d)]) d.setDate(d.getDate()-1);
  while(set[localDateStr(d)]){ n++; d.setDate(d.getDate()-1); }
  return n;
}
function streakBest(days){
  var list = streakDayList(days);
  var best = 0, run = 0, prev = null;
  list.forEach(function(ds){
    if(prev){
      var p = new Date(prev+'T00:00:00'), c = new Date(ds+'T00:00:00');
      run = Math.round((c-p)/86400000) === 1 ? run+1 : 1;
    } else { run = 1; }
    if(run > best) best = run;
    prev = ds;
  });
  return best;
}
function streakWeekSec(days){
  var sum = 0;
  for(var i=0;i<7;i++){
    var d = new Date(); d.setDate(d.getDate()-i);
    sum += (days && days[localDateStr(d)]) || 0;
  }
  return sum;
}
function streakTotalSec(days){
  var sum = 0;
  Object.keys(days||{}).forEach(function(k){ sum += days[k]||0; });
  return sum;
}
function streakBadges(days){
  var cur = streakCurrent(days), best = streakBest(days), total = streakTotalSec(days);
  var out = [];
  out.push({ icon:'🌱', name:'Erster Tag',        got: best >= 1 });
  out.push({ icon:'🔥', name:'3 Tage am Stück',   got: best >= 3 });
  out.push({ icon:'⚡️', name:'1 Woche am Stück',  got: best >= 7 });
  out.push({ icon:'🏆', name:'30 Tage am Stück',  got: best >= 30 });
  out.push({ icon:'⏳', name:'5 Stunden geübt',   got: total >= 5*3600 });
  out.push({ icon:'💎', name:'20 Stunden geübt',  got: total >= 20*3600 });
  out.push({ icon:'📅', name:'Wochenziel erreicht', got: streakWeekSec(days) >= streakState.goalMin*60 });
  out.push({ icon:'🚀', name:'Serie läuft ('+cur+')', got: cur >= 2 });
  return out;
}

async function loadStreak(){
  if(!state.user || state.profile.role === 'teacher') return null;
  try{
    var snap = await getDoc(doc(db,'streaks', state.user.uid));
    var d = snap.exists() ? snap.data() : {};
    streakState.days = d.days || {};
    streakState.goalMin = typeof d.goalMin === 'number' ? d.goalMin : 60;
    streakState.loaded = true;
    // Alte Tage wegräumen. Ein verschachteltes Feld lässt sich nur mit
    // updateDoc komplett ersetzen — setDoc(...,{merge:true}) würde die alten
    // Schlüssel stehen lassen.
    var keys = Object.keys(streakState.days);
    if(keys.length > STREAK_KEEP_DAYS + 40){
      var keep = {};
      keys.sort().slice(-STREAK_KEEP_DAYS).forEach(function(k){ keep[k] = streakState.days[k]; });
      streakState.days = keep;
      updateDoc(doc(db,'streaks', state.user.uid), { days: keep }).catch(function(){});
    }
    return streakState.days;
  }catch(err){
    console.error('Streak konnte nicht geladen werden', err);
    return null;
  }
}

// Wird vom Lernzeit-Tracking aufgerufen, sobald echte Übungszeit gemeldet wird.
function bumpStreak(seconds){
  if(!state.user || !state.profile || state.profile.role === 'teacher') return;
  if(!(seconds > 0)) return;
  var today = todayStr();
  // Ein einziger Schreibvorgang: merge:true fasst nur days[heute] an und legt
  // das Dokument bei Bedarf an (spart Firestore-Schreibkontingent im Spark-Plan).
  var days = {};
  days[today] = increment(seconds);
  setDoc(doc(db,'streaks', state.user.uid), { days: days }, {merge:true})
    .then(function(){
      if(!streakState.days) streakState.days = {};
      streakState.days[today] = (streakState.days[today] || 0) + seconds;
      updateStreakButton();
    })
    .catch(function(err){ console.error('Streak konnte nicht geschrieben werden', err); });
}

function updateStreakButton(){
  var btn = document.getElementById('streakBtn');
  if(!btn) return;
  var cur = streakCurrent(streakState.days || {});
  btn.innerHTML = '🔥 <b>'+cur+'</b>';
  btn.classList.toggle('streak-off', cur === 0);
  btn.title = cur ? ('Lern-Serie: '+cur+' Tage in Folge') : 'Noch keine Lern-Serie — heute üben startet sie!';
}

function openStreakModal(){
  var days = streakState.days || {};
  var cur = streakCurrent(days), best = streakBest(days);
  var weekSec = streakWeekSec(days), goalSec = streakState.goalMin*60;
  var pct = goalSec ? Math.min(100, Math.round(weekSec/goalSec*100)) : 0;

  var h = '';
  h += '<h3>🔥 Dein Lernpfad</h3>';
  h += '<div class="st-top"><div class="st-big"><b>'+cur+'</b><span>Tage in Folge</span></div>'
     + '<div class="st-big"><b>'+best+'</b><span>Rekord</span></div>'
     + '<div class="st-big"><b>'+(Math.round(streakTotalSec(days)/360)/10).toString().replace('.',',')+'</b><span>Stunden total</span></div></div>';

  h += '<div class="section-label">Diese Woche</div>';
  h += '<div class="st-goal"><div class="st-goal-bar"><span style="width:'+pct+'%"></span></div>'
     + '<div class="st-goal-txt">'+Math.round(weekSec/60)+' von '+streakState.goalMin+' Minuten · '+pct+'%</div></div>';
  h += '<div class="st-goal-set"><label>Wochenziel <select class="sp-select" id="stGoal">'
     + [30,60,90,120,180,240].map(function(m){ return '<option value="'+m+'"'+(streakState.goalMin===m?' selected':'')+'>'+m+' min</option>'; }).join('')
     + '</select></label></div>';

  h += '<div class="section-label">Letzte 14 Tage</div>';
  h += '<div class="st-days">';
  for(var i=13;i>=0;i--){
    var d = new Date(); d.setDate(d.getDate()-i);
    var ds = localDateStr(d);
    var sec = days[ds] || 0;
    var lvl = sec >= 1800 ? 3 : (sec >= 600 ? 2 : (sec >= STREAK_MIN_SEC ? 1 : 0));
    h += '<div class="st-day st-lvl-'+lvl+'" title="'+esc(ds+': '+Math.round(sec/60)+' min')+'">'
       + '<span>'+['So','Mo','Di','Mi','Do','Fr','Sa'][d.getDay()].charAt(0)+'</span></div>';
  }
  h += '</div>';

  h += '<div class="section-label">Abzeichen</div>';
  h += '<div class="st-badges">'+streakBadges(days).map(function(b){
    return '<div class="st-badge'+(b.got?' st-badge-on':'')+'"><span>'+b.icon+'</span>'+esc(b.name)+'</div>';
  }).join('')+'</div>';

  h += '<div class="modal-actions"><button class="btn btn-primary btn-sm" id="stClose" type="button">Weiter üben</button></div>';
  openModal(h, 'modal-wide');
  document.getElementById('stClose').addEventListener('click', closeModal);
  document.getElementById('stGoal').addEventListener('change', function(e){
    streakState.goalMin = parseInt(e.target.value,10);
    setDoc(doc(db,'streaks', state.user.uid), { goalMin: streakState.goalMin }, {merge:true}).catch(function(){});
    closeModal(); openStreakModal();
  });
}

/* ===================== 🎮 KLASSEN-QUIZ (live, auf den Geräten der Klasse) =====================
   Ablauf: Lehrperson startet ein Quiz -> quizSessions/aktiv wird beschrieben.
   Alle angemeldeten Geräte beobachten genau dieses eine Dokument (fester
   Dokumentname statt einer Abfrage nach der "laufenden" Sitzung — es läuft
   ohnehin immer nur ein Quiz, und so braucht es weder Query noch Index).

   Wichtig fürs Schummeln: die Fragen mit den richtigen Antworten liegen in
   quizzes/{id} und sind laut Regeln NUR für die Lehrperson lesbar. In die
   Session wandert pro Frage nur der Text plus die Antwortmöglichkeiten; der
   Index der richtigen Antwort erst beim Auflösen. Die Punkte rechnet das Gerät
   der Lehrperson und schreibt sie in quizSessions/aktiv/spieler/{uid} — die
   Kinder können ihren eigenen Punktestand nicht selbst setzen. */

var QUIZ_SESSION = ['quizSessions', 'aktiv'];
var quizLive = { session:null, unsub:null, overlay:null, unsubAnswers:null, unsubPlayers:null, tick:null, answered:{}, players:[], sig:null, busy:{} };

/* Kurzer Klickschutz fuer die Knoepfe am Beamer: er ueberbrueckt nur den Moment,
   bis Firestore die Aenderung zurueckspiegelt. Bewusst zeitbasiert und nicht an
   ein Promise gehaengt - ein Schreibvorgang, der offline haengen bleibt, wuerde
   den Knopf sonst dauerhaft totlegen. */
function quizBusy(key){
  var now = Date.now();
  if(quizLive.busy[key] && now - quizLive.busy[key] < 1200) return true;
  quizLive.busy[key] = now;
  return false;
}

function quizSessionRef(){ return kdoc(QUIZ_SESSION[0], QUIZ_SESSION[1]); }
function quizAnswersCol(){ return kcol(QUIZ_SESSION[0], QUIZ_SESSION[1], 'antworten'); }
function quizPlayersCol(){ return kcol(QUIZ_SESSION[0], QUIZ_SESSION[1], 'spieler'); }
function quizIsRunning(s){ return !!(s && s.state && s.state !== 'idle'); }

/* Der Countdown darf NICHT aus s.startedAt minus der eigenen Uhr gerechnet
   werden: startedAt kommt vom Lehrergerät, und die Uhren der Schulgeräte gehen
   regelmässig ein paar Sekunden daneben. Dann stand beim Kind 0, während am
   Beamer noch 18 lief (oder umgekehrt). Darum misst jedes Gerät ab dem Moment
   selbst mit, in dem es die Frage zum ersten Mal sieht - übrig bleibt nur die
   Netzwerk-Latenz von ein paar Zehntelsekunden. */
var quizClock = { key:'', start:0 };
function quizSecondsLeft(s){
  if(!s || s.state !== 'frage') return 0;
  // Gestoppt: überall bleibt die Zahl stehen, die der Beamer beim Drücken zeigte.
  if(s.stopped) return Math.max(1, s.stopLeft||1);
  var key = String(s.qIndex)+'|'+String(s.startedAt||0);
  if(quizClock.key !== key){
    quizClock.key = key;
    // Wenn die Uhr dieses Geräts halbwegs stimmt, ist das hier die echte
    // bisherige Laufzeit - dann stimmt der Countdown auch für jemanden, der
    // mitten in der Frage dazukommt. Kommt etwas Unmögliches heraus (negativ
    // oder länger als die Frage dauert), geht die Uhr falsch: ab dann misst
    // das Gerät selbst, lieber etwas zu lang als sofort auf 0.
    var elapsed = Date.now() - (s.startedAt||0);
    quizClock.start = (elapsed >= 0 && elapsed <= (s.sec||0)*1000) ? Date.now() - elapsed : Date.now();
  }
  return Math.max(0, Math.ceil((s.sec||0) - (Date.now() - quizClock.start)/1000));
}
// Wie lange das eigene Gerät seit dem Auftauchen der Frage gemessen hat - das
// wandert mit der Antwort mit, damit der Tempo-Bonus nicht von fremden Uhren abhängt.
function quizElapsedMs(){ return Math.max(0, Date.now() - (quizClock.start || Date.now())); }

// Läuft für alle Angemeldeten ab dem Login: sobald ein Quiz startet, erscheint
// oben der Mitmachen-Knopf.
function startQuizWatcher(){
  if(quizLive.unsub) return;
  quizLive.unsub = onSnapshot(quizSessionRef(), function(snap){
    quizLive.session = snap.exists() ? snap.data() : null;
    updateQuizBanner();
    if(state.route.name === 'quizplay') renderQuizPlay();
  }, function(err){ console.error('Quiz-Listener', err); });
}
function stopQuizWatcher(){
  if(quizLive.unsub){ quizLive.unsub(); quizLive.unsub = null; }
  // Die beiden hier hingen früher weiter an Firestore, auch nach dem Abmelden.
  if(quizLive.unsubPlayers){ quizLive.unsubPlayers(); quizLive.unsubPlayers = null; }
  if(quizLive.unsubAnswers){ quizLive.unsubAnswers(); quizLive.unsubAnswers = null; }
  clearInterval(quizLive.tick); quizLive.tick = null;
  clearTimeout(quizPlay.tick);
  quizLive.session = null;
  quizLive.players = [];
  quizLive.answered = {};
  quizLive.sig = null;
  quizPlay.sig = null;
  quizClock.key = '';
}

function updateQuizBanner(){
  var btn = document.getElementById('quizJoinBtn');
  if(!btn || !state.profile) return;
  var running = quizIsRunning(quizLive.session);
  btn.hidden = !running || state.profile.role === 'teacher' || state.route.name === 'quizplay';
  if(running) btn.innerHTML = '🎮 Quiz läuft — mitmachen';
}

/* ---------- Lehrer: Quiz-Verwaltung ---------- */

function renderQuizVerwaltung(){
  clearSubjectWatchers(); clearOverviewWatchers();
  var html = '';
  html += '<div class="back-row"><button class="btn btn-ghost btn-sm" id="backBtn" type="button">&larr; Klassenzimmer</button></div>';
  html += '<h2 class="page-welcome" style="margin-bottom:10px;">🎮 Klassen-Quiz</h2>';
  html += '<div class="back-row"><button class="btn btn-primary btn-sm" id="qzNew" type="button">➕ Neues Quiz</button>'
        + '<button class="btn btn-ghost btn-sm" id="qzImport" type="button">📋 Aus Text erstellen</button></div>';
  html += '<div id="qzList"><div class="empty-state">Wird geladen …</div></div>';
  renderChrome(html);
  document.getElementById('backBtn').addEventListener('click', function(){ state.route = {name:'klassenzimmer'}; render(); });
  document.getElementById('qzNew').addEventListener('click', function(){ openQuizEditor(null); });
  document.getElementById('qzImport').addEventListener('click', openQuizImport);
  loadQuizList();
}

function loadQuizList(){
  getDocs(kcol('quizzes')).then(function(snap){
    var host = document.getElementById('qzList');
    if(!host) return;
    var list = [];
    snap.forEach(function(d){ list.push(Object.assign({id:d.id}, d.data())); });
    list.sort(function(a,b){ return (b.createdAt && b.createdAt.toMillis ? b.createdAt.toMillis() : 0) - (a.createdAt && a.createdAt.toMillis ? a.createdAt.toMillis() : 0); });
    if(!list.length){ host.innerHTML = '<div class="empty-state">Noch kein Quiz angelegt.</div>'; return; }
    host.innerHTML = list.map(function(q){
      var s = subjectById(q.subject);
      var n = (q.questions||[]).length;
      return '<div class="card qz-row"><div class="qz-row-body"><h3>'+esc(q.title)+'</h3>'
        + '<div class="qz-row-meta">'+n+' Frage'+(n===1?'':'n')+(s?' · '+esc(s.name):'')+'</div></div>'
        + '<div class="qz-row-actions">'
        + '<button class="btn btn-primary btn-sm" data-start="'+esc(q.id)+'" type="button">▶︎ Starten</button>'
        + '<button class="btn btn-ghost btn-sm" data-edit="'+esc(q.id)+'" type="button">Bearbeiten</button>'
        + '<button class="btn btn-danger btn-sm" data-del="'+esc(q.id)+'" type="button">Löschen</button>'
        + '</div></div>';
    }).join('');
    Array.prototype.forEach.call(host.querySelectorAll('[data-start]'), function(b){
      b.addEventListener('click', function(){
        var q = list.filter(function(x){ return x.id === b.getAttribute('data-start'); })[0];
        if(q) startQuizSession(q);
      });
    });
    Array.prototype.forEach.call(host.querySelectorAll('[data-edit]'), function(b){
      b.addEventListener('click', function(){
        var q = list.filter(function(x){ return x.id === b.getAttribute('data-edit'); })[0];
        if(q) openQuizEditor(q);
      });
    });
    Array.prototype.forEach.call(host.querySelectorAll('[data-del]'), function(b){
      b.addEventListener('click', function(){
        var id = b.getAttribute('data-del');
        uiConfirm('Quiz löschen?', 'Das Quiz wird endgültig entfernt.', 'Löschen', function(){
          deleteDoc(kdoc('quizzes',id)).then(loadQuizList)
            .catch(function(err){ console.error(err); toast('Konnte nicht gelöscht werden.'); });
        }, true);
      });
    });
  }).catch(function(err){
    console.error(err);
    var host = document.getElementById('qzList');
    if(host) host.innerHTML = '<div class="empty-state">Quiz-Liste konnte nicht geladen werden.</div>';
  });
}

function quizEmptyQuestion(){ return { q:'', a:['','','',''], c:0, sec:25 }; }

function openQuizEditor(existing){
  var data = existing
    ? { id:existing.id, title:existing.title||'', subject:existing.subject||'', questions:(existing.questions||[]).map(function(x){ return {q:x.q||'', a:(x.a||['','','','']).slice(), c:x.c||0, sec:x.sec||25}; }) }
    : { id:null, title:'', subject:'', questions:[quizEmptyQuestion()] };

  function build(){
    var h = '';
    h += '<h3>'+(data.id ? 'Quiz bearbeiten' : 'Neues Quiz')+'</h3>';
    h += '<input type="text" id="qzTitle" maxlength="80" placeholder="Titel des Quiz" value="'+esc(data.title)+'">';
    h += '<select class="sp-select" id="qzSubject" style="width:100%;margin-top:8px;"><option value="">Fach (optional)</option>'
       + SUBJECTS.filter(function(s){ return !s.teacherOnly; }).map(function(s){ return '<option value="'+s.id+'"'+(data.subject===s.id?' selected':'')+'>'+esc(s.name)+'</option>'; }).join('')
       + '</select>';
    h += '<div class="qz-q-list">';
    data.questions.forEach(function(q, i){
      h += '<div class="qz-q"><div class="qz-q-head"><b>Frage '+(i+1)+'</b>'
         + '<span class="qz-q-head-actions">'
         + '<button class="move-btn" type="button" data-up="'+i+'"'+(i===0?' disabled':'')+'>↑</button>'
         + '<button class="move-btn" type="button" data-down="'+i+'"'+(i===data.questions.length-1?' disabled':'')+'>↓</button>'
         + '<button class="btn btn-danger btn-sm" type="button" data-qdel="'+i+'">✕</button>'
         + '</span></div>';
      h += '<textarea class="fb-textarea" data-q="'+i+'" maxlength="300" placeholder="Fragetext">'+esc(q.q)+'</textarea>';
      q.a.forEach(function(ans, j){
        h += '<label class="qz-ans"><input type="radio" name="qzc'+i+'" data-c="'+i+'_'+j+'"'+(q.c===j?' checked':'')+'>'
           + '<input type="text" data-a="'+i+'_'+j+'" maxlength="120" placeholder="Antwort '+(j+1)+'" value="'+esc(ans)+'"></label>';
      });
      h += '<label class="qz-sec">Zeit <input type="number" data-sec="'+i+'" min="5" max="180" value="'+q.sec+'"> Sekunden</label>';
      h += '</div>';
    });
    h += '</div>';
    h += '<button class="btn btn-ghost btn-sm" id="qzAddQ" type="button">➕ Frage</button>';
    h += '<div class="modal-actions"><button class="btn btn-ghost btn-sm" id="qzCancel" type="button">Abbrechen</button>'
       + '<button class="btn btn-primary btn-sm" id="qzSave" type="button">Speichern</button></div>';
    openModal(h, 'modal-wide');
    wire();
  }

  function readBack(){
    data.title = (document.getElementById('qzTitle').value || '').trim();
    data.subject = document.getElementById('qzSubject').value || '';
    Array.prototype.forEach.call(document.querySelectorAll('[data-q]'), function(el){
      data.questions[parseInt(el.getAttribute('data-q'),10)].q = el.value;
    });
    Array.prototype.forEach.call(document.querySelectorAll('[data-a]'), function(el){
      var p = el.getAttribute('data-a').split('_');
      data.questions[parseInt(p[0],10)].a[parseInt(p[1],10)] = el.value;
    });
    Array.prototype.forEach.call(document.querySelectorAll('[data-c]'), function(el){
      if(!el.checked) return;
      var p = el.getAttribute('data-c').split('_');
      data.questions[parseInt(p[0],10)].c = parseInt(p[1],10);
    });
    Array.prototype.forEach.call(document.querySelectorAll('[data-sec]'), function(el){
      var v = parseInt(el.value,10);
      data.questions[parseInt(el.getAttribute('data-sec'),10)].sec = (v>=5 && v<=180) ? v : 25;
    });
  }

  function wire(){
    document.getElementById('qzAddQ').addEventListener('click', function(){ readBack(); data.questions.push(quizEmptyQuestion()); build(); });
    document.getElementById('qzCancel').addEventListener('click', closeModal);
    Array.prototype.forEach.call(document.querySelectorAll('[data-qdel]'), function(b){
      b.addEventListener('click', function(){
        readBack();
        if(data.questions.length <= 1){ toast('Mindestens eine Frage.'); return; }
        data.questions.splice(parseInt(b.getAttribute('data-qdel'),10),1); build();
      });
    });
    Array.prototype.forEach.call(document.querySelectorAll('[data-up]'), function(b){
      b.addEventListener('click', function(){
        readBack();
        var i = parseInt(b.getAttribute('data-up'),10);
        var t = data.questions[i-1]; data.questions[i-1] = data.questions[i]; data.questions[i] = t; build();
      });
    });
    Array.prototype.forEach.call(document.querySelectorAll('[data-down]'), function(b){
      b.addEventListener('click', function(){
        readBack();
        var i = parseInt(b.getAttribute('data-down'),10);
        var t = data.questions[i+1]; data.questions[i+1] = data.questions[i]; data.questions[i] = t; build();
      });
    });
    document.getElementById('qzSave').addEventListener('click', function(){
      readBack();
      if(!data.title){ toast('Bitte einen Titel eingeben.'); return; }
      var bad = data.questions.filter(function(q){
        return !q.q.trim() || q.a.filter(function(x){ return x.trim(); }).length < 2;
      });
      if(bad.length){ toast('Jede Frage braucht einen Text und mindestens zwei Antworten.'); return; }
      var payload = {
        title: data.title, subject: data.subject,
        questions: data.questions.map(function(q){
          return { q:q.q.trim(), a:q.a.map(function(x){ return x.trim(); }), c:q.c, sec:q.sec };
        }),
        createdBy: state.profile.displayName
      };
      var p;
      if(data.id){ p = updateDoc(kdoc('quizzes',data.id), payload); }
      else { payload.createdAt = serverTimestamp(); p = setDoc(doc(kcol('quizzes')), payload); }
      p.then(function(){ closeModal(); toast('Quiz gespeichert.'); loadQuizList(); })
       .catch(function(err){ console.error(err); toast('Quiz konnte nicht gespeichert werden.'); });
    });
  }

  build();
}

// Schnellerfassung: Frage, darunter die Antworten, die richtige mit * davor;
// Leerzeile trennt die Fragen. Spart bei 15 Fragen sehr viel Klickerei.
function openQuizImport(){
  var beispiel = 'Wie heisst die Hauptstadt der Schweiz?\n*Bern\nZürich\nGenf\nBasel\n\n2 + 2 = ?\n*4\n3\n5';
  var h = '<h3>📋 Quiz aus Text</h3>';
  h += '<p>Pro Block: erst die Frage, dann die Antworten — die richtige mit einem <b>*</b> davor. Leerzeile zwischen den Fragen.</p>';
  h += '<input type="text" id="qzImpTitle" maxlength="80" placeholder="Titel des Quiz">';
  h += '<textarea id="qzImpText" class="fb-textarea" style="min-height:220px;font-family:ui-monospace,Menlo,Consolas,monospace;" placeholder="'+esc(beispiel)+'"></textarea>';
  h += '<div class="modal-actions"><button class="btn btn-ghost btn-sm" id="qzImpCancel" type="button">Abbrechen</button>'
     + '<button class="btn btn-primary btn-sm" id="qzImpOk" type="button">Erstellen</button></div>';
  openModal(h, 'modal-wide');
  document.getElementById('qzImpCancel').addEventListener('click', closeModal);
  document.getElementById('qzImpOk').addEventListener('click', function(){
    var title = (document.getElementById('qzImpTitle').value||'').trim();
    var raw = document.getElementById('qzImpText').value || '';
    if(!title){ toast('Bitte einen Titel eingeben.'); return; }
    var blocks = raw.split(/\n\s*\n/).map(function(b){ return b.trim(); }).filter(Boolean);
    var questions = [];
    blocks.forEach(function(b){
      var lines = b.split('\n').map(function(l){ return l.trim(); }).filter(Boolean);
      if(lines.length < 3) return;
      var qText = lines.shift();
      var correct = 0;
      var answers = lines.slice(0,4).map(function(l, i){
        if(l.charAt(0) === '*'){ correct = i; return l.slice(1).trim(); }
        return l;
      });
      while(answers.length < 2) answers.push('');
      questions.push({ q:qText, a:answers, c:correct, sec:25 });
    });
    if(!questions.length){ toast('Kein gültiger Frageblock erkannt.'); return; }
    setDoc(doc(kcol('quizzes')), {
      title: title, subject: '', questions: questions,
      createdBy: state.profile.displayName, createdAt: serverTimestamp()
    }).then(function(){ closeModal(); toast(questions.length+' Fragen erstellt.'); loadQuizList(); })
      .catch(function(err){ console.error(err); toast('Quiz konnte nicht erstellt werden.'); });
  });
}

/* ---------- Lehrer: Live-Steuerung ---------- */

function startQuizSession(quiz){
  quizLive.busy = {}; quizLive.sig = null; quizClock.key = '';
  /* Reihenfolge ist wichtig: ZUERST die Spieler und Antworten der letzten Runde
     wegräumen, ERST DANN die Lobby öffnen. Früher war es umgekehrt - wer schnell
     auf «mitmachen» tippte, fand noch den alten Eintrag vom letzten Quiz, schrieb
     darum keinen neuen, und Sekunden später löschte das Aufräumen genau diesen
     Eintrag. Auf dem Schülergerät stand «Du bist dabei!», am Beamer fehlte die
     Person (z.B. nur 9 von 15). */
  setDoc(quizSessionRef(), { state:'idle', question:null, updatedAt: serverTimestamp() }, {merge:true}).then(function(){
    return Promise.all([
      getDocs(quizPlayersCol()).then(function(s){ var b = writeBatch(db); s.forEach(function(d){ b.delete(d.ref); }); return b.commit(); }),
      getDocs(quizAnswersCol()).then(function(s){ var b = writeBatch(db); s.forEach(function(d){ b.delete(d.ref); }); return b.commit(); })
    ]);
  }).then(function(){
    return setDoc(quizSessionRef(), {
      quizId: quiz.id, title: quiz.title, state:'lobby', qIndex:-1,
      totalQ: (quiz.questions||[]).length, question:null, sec:0, startedAt:0,
      correctIndex:-1, stats:[], updatedAt: serverTimestamp()
    });
  }).then(function(){ openQuizHost(quiz); })
    .catch(function(err){ console.error(err); toast('Quiz konnte nicht gestartet werden.'); });
}

function openQuizHost(quiz){
  if(quizLive.overlay) return;
  var html = '';
  html += '<div class="kz-bar"><div class="kz-bar-title">🎮 '+esc(quiz.title)+'</div><div class="kz-bar-spacer"></div>'
        + '<button class="kz-close" id="qhClose" type="button" title="Quiz beenden">✕</button></div>';
  html += '<div class="qh-stage" id="qhStage"></div>';
  quizLive.overlay = openOverlay(html, function(){
    if(quizLive.unsubAnswers){ quizLive.unsubAnswers(); quizLive.unsubAnswers = null; }
    if(quizLive.unsubPlayers){ quizLive.unsubPlayers(); quizLive.unsubPlayers = null; }
    clearInterval(quizLive.tick);
    quizLive.tick = null;
    quizLive.sig = null;
    quizLive.busy = {};
    quizLive.overlay = null;
    setDoc(quizSessionRef(), { state:'idle', question:null, updatedAt: serverTimestamp() }, {merge:true}).catch(function(){});
  }, 'kz-overlay-quiz');

  quizLive.overlay.el.querySelector('#qhClose').addEventListener('click', function(){
    uiConfirm('Quiz beenden?', 'Die Klasse sieht danach wieder die normale Ansicht.', 'Beenden', function(){
      if(quizLive.overlay) quizLive.overlay.close();
    }, true);
  });

  quizLive.answered = {};
  quizLive.unsubAnswers = onSnapshot(quizAnswersCol(), function(snap){
    quizLive.answered = {};
    snap.forEach(function(d){ quizLive.answered[d.id] = d.data(); });
    paintQuizHost(quiz);
  });
  quizLive.unsubPlayers = onSnapshot(quizPlayersCol(), function(snap){
    quizLive.players = [];
    snap.forEach(function(d){ quizLive.players.push(Object.assign({uid:d.id}, d.data())); });
    paintQuizHost(quiz);
  });
  // Die Knoepfe haengen NICHT mehr einzeln am Listener, sondern an der Buehne:
  // ein Neuzeichnen (z.B. weil gerade jemand geantwortet hat) hat die Knopf-
  // Elemente zwischen Drücken und Loslassen ersetzt - dann kam gar kein Klick
  // an, und man musste ein zweites Mal drücken.
  var stageEl = quizLive.overlay.el.querySelector('#qhStage');
  stageEl.addEventListener('click', function(e){
    var btn = e.target && e.target.closest ? e.target.closest('button') : null;
    if(!btn) return;
    if(btn.id === 'qhNext') quizNextStep(quiz);
    else if(btn.id === 'qhReveal') quizReveal(quiz);
    else if(btn.id === 'qhStop') quizStopTime();
    else if(btn.id === 'qhRankNext') quizRevealNextRank();
    else if(btn.id === 'qhFinish'){ if(quizLive.overlay) quizLive.overlay.close(); }
  });

  quizLive.sig = null;
  quizLive.tick = setInterval(function(){ paintQuizHost(quiz); }, 250);
  paintQuizHost(quiz);
}

function quizLeaderboard(){
  return quizLive.players.slice().sort(function(a,b){ return (b.score||0)-(a.score||0) || (a.name||'').localeCompare(b.name||'', 'de'); });
}

/* Die Schlussrangliste wird beim Umschalten auf 'ende' einmal eingefroren und
   in der Session abgelegt - so sehen Beamer und alle Geraete garantiert
   dieselbe Reihenfolge, auch wenn ein Punkte-Update spaeter noch eintrudelt. */
function quizFinalList(s){
  if(s && s.final && s.final.length) return s.final;
  return quizLeaderboard();
}
// Welcher Platz ist gerade an der Reihe? topN+1 = noch nichts verkuendet,
// 1 = Sieger:in ist raus (ab dann sehen die Schueler:innen ihren Rang).
function quizRevealRank(s){
  var n = (s && typeof s.revealRank === 'number') ? s.revealRank : 1;
  return Math.max(1, n);
}
function quizTopCount(lb){ return Math.min(5, lb.length); }
function quizMedal(rank){ return ['🥇','🥈','🥉'][rank-1] || '🏅'; }

function quizAnsweredCount(s){
  return Object.keys(quizLive.answered).filter(function(uid){
    return quizLive.answered[uid].qIndex === s.qIndex;
  }).length;
}

// Alles, was ein echtes Neuzeichnen rechtfertigt. Countdown und Antwortzaehler
// stehen bewusst NICHT drin: waehrend einer Frage wird die Buehne dadurch gar
// nicht mehr neu gebaut (kein Flackern, keine verlorenen Klicks) - beide Werte
// zieht quizHostTick punktuell nach.
function quizHostSig(s){
  if(s.state === 'frage') return 'frage|'+s.qIndex+'|'+(s.stopped?1:0);
  if(s.state === 'ende') return 'ende|'+quizRevealRank(s)+'|'+((s.final||[]).length);
  return [s.state, s.qIndex, s.correctIndex, (s.stats||[]).join(','),
          quizLive.players.map(function(p){ return p.uid+':'+(p.score||0)+':'+(p.name||''); }).join(',')].join('|');
}

function paintQuizHost(quiz){
  if(!quizLive.overlay) return;
  var stage = quizLive.overlay.el.querySelector('#qhStage');
  if(!stage) return;
  var s = quizLive.session || {};

  // Von selbst auflösen, sobald die Frage durch ist: entweder ist die Zeit um
  // (vorher passierte da gar nichts, die Klasse sass vor einer 0) oder alle
  // Mitspielenden haben geantwortet - dann muss niemand auf den Rest warten.
  if(s.state === 'frage'){
    var alleDa = quizLive.players.length > 0 && quizAnsweredCount(s) >= quizLive.players.length;
    if((!s.stopped && quizSecondsLeft(s) <= 0) || alleDa) quizAutoReveal(quiz);
  }

  var sig = quizHostSig(s);
  if(sig !== quizLive.sig || !stage.firstChild){
    quizLive.sig = sig;
    paintQuizHostFull(quiz, stage, s);
  }
  quizHostTick(s);
}

// Zwischen zwei Neuzeichnungen wandern nur Timer und Antwortzaehler.
function quizHostTick(s){
  if(s.state !== 'frage') return;
  var t = document.querySelector('.qh-timer');
  if(t && !s.stopped){
    var left = quizSecondsLeft(s);
    t.textContent = left;
    t.classList.toggle('qh-timer-hot', left <= 5);
  }
  var c = document.querySelector('.qh-q .qh-count');
  if(c) c.textContent = quizAnsweredCount(s)+' von '+quizLive.players.length+' geantwortet';
}

function paintQuizHostFull(quiz, stage, s){
  var h = '';

  if(s.state === 'lobby'){
    h += '<div class="qh-lobby"><div class="qh-big">Bereit?</div>';
    h += '<p class="qh-sub">Die Klasse tippt in der Library oben auf <b>„Quiz läuft — mitmachen"</b>.</p>';
    h += '<div class="qh-players">'+quizLive.players.map(function(p){ return '<span class="qh-chip">'+esc(p.name||'?')+'</span>'; }).join('')+'</div>';
    h += '<div class="qh-count">'+quizLive.players.length+' dabei</div>';
    h += '<button class="btn btn-primary tm-big" id="qhNext" type="button">Erste Frage ▶︎</button></div>';
  } else if(s.state === 'frage'){
    var left = quizSecondsLeft(s);
    var count = quizAnsweredCount(s);
    h += '<div class="qh-q"><div class="qh-qnum">Frage '+((s.qIndex||0)+1)+' / '+(s.totalQ||0)+'</div>';
    h += '<div class="qh-qtext">'+esc(s.question ? s.question.text : '')+'</div>';
    h += '<div class="qh-answers">'+((s.question && s.question.answers)||[]).map(function(a, i){
      return a ? '<div class="qh-a qh-a-'+i+'"><b>'+['▲','◆','●','■'][i]+'</b>'+esc(a)+'</div>' : '';
    }).join('')+'</div>';
    h += s.stopped
      ? '<div class="qh-timer qh-timer-stopped">⏸ '+left+'</div><div class="qh-sub">Zeit gestoppt — auflösen, sobald alle so weit sind.</div>'
      : '<div class="qh-timer'+(left<=5?' qh-timer-hot':'')+'">'+left+'</div>';
    h += '<div class="qh-count">'+count+' von '+quizLive.players.length+' geantwortet</div>';
    h += '<div class="qh-btns">'
       + (s.stopped ? '' : '<button class="btn btn-ghost tm-big" id="qhStop" type="button">⏸ Zeit stoppen</button>')
       + '<button class="btn btn-primary tm-big" id="qhReveal" type="button">Auflösen</button></div></div>';
  } else if(s.state === 'aufloesung'){
    var total = (s.stats||[]).reduce(function(a,b){ return a+b; }, 0) || 1;
    h += '<div class="qh-q"><div class="qh-qnum">Auflösung</div>';
    h += '<div class="qh-qtext">'+esc(s.question ? s.question.text : '')+'</div>';
    h += '<div class="qh-answers">'+((s.question && s.question.answers)||[]).map(function(a, i){
      if(!a) return '';
      var n = (s.stats && s.stats[i]) || 0;
      return '<div class="qh-a qh-a-'+i+(i===s.correctIndex?' qh-a-right':' qh-a-wrong')+'">'
           + '<b>'+['▲','◆','●','■'][i]+'</b>'+esc(a)
           + '<span class="qh-a-bar"><i style="width:'+Math.round(n/total*100)+'%"></i></span><span class="qh-a-n">'+n+'</span></div>';
    }).join('')+'</div>';
    h += '<div class="qh-lead">'+quizLeaderboard().slice(0,5).map(function(p, i){
      return '<span class="qh-chip">'+(i+1)+'. '+esc(p.name||'?')+' <b>'+(p.score||0)+'</b></span>';
    }).join('')+'</div>';
    h += '<button class="btn btn-primary tm-big" id="qhNext" type="button">'
       + (((s.qIndex||0)+1) < (s.totalQ||0) ? 'Nächste Frage ▶︎' : 'Schlussrangliste 🏆') + '</button></div>';
  } else if(s.state === 'ende'){
    var lb = quizFinalList(s);
    var topN = quizTopCount(lb);
    var rr = quizRevealRank(s);
    h += '<div class="qh-end"><div class="qh-big">🏆 Rangverkündigung</div>';
    if(!lb.length){
      h += '<p class="qh-sub">Diesmal hat niemand mitgespielt.</p>';
      h += '<button class="btn btn-ghost tm-big" id="qhFinish" type="button">Fertig</button></div>';
    } else {
      if(rr > topN){
        h += '<p class="qh-sub">Die besten '+topN+' — einer nach dem anderen. Trommelwirbel …</p>';
      } else {
        var cur = lb[rr-1] || {};
        h += '<div class="qh-reveal qh-reveal-'+rr+'">'
           + '<div class="qh-reveal-rank">'+quizMedal(rr)+' Platz '+rr+'</div>'
           + '<div class="qh-reveal-name">'+esc(cur.name||'?')+'</div>'
           + '<div class="qh-reveal-score">'+(cur.score||0)+' Punkte</div></div>';
        var done = '';
        for(var r = rr+1; r <= topN; r++){
          var e = lb[r-1] || {};
          done += '<li><span>'+quizMedal(r)+' Platz '+r+' · '+esc(e.name||'?')+'</span><b>'+(e.score||0)+'</b></li>';
        }
        if(done) h += '<ol class="qh-done">'+done+'</ol>';
      }
      if(rr > 1){
        h += '<button class="btn btn-primary tm-big" id="qhRankNext" type="button">Platz '
           + (Math.min(rr, topN+1) - 1) + ' zeigen ▶︎</button></div>';
      } else {
        h += '<button class="btn btn-ghost tm-big" id="qhFinish" type="button">Fertig</button></div>';
      }
    }
  } else {
    h += '<div class="qh-lobby"><div class="qh-big">…</div></div>';
  }

  stage.innerHTML = h;   // Klicks laufen ueber die Delegation in openQuizHost

  // Der Sieger-Moment: Konfetti faellt von oben in die Buehne (Nachfahre des
  // Vollbild-Elements, sonst waere es im nativen Vollbild gar nicht sichtbar).
  if(s.state === 'ende' && quizRevealRank(s) === 1 && quizFinalList(s).length) quizConfetti(stage);
}

/* Konfetti: ein paar Dutzend Schnipsel, die einmal durchs Bild fallen und sich
   danach selbst aufraeumen. Kein Canvas, keine Bibliothek - reines CSS. */
function quizConfetti(host, fixed){
  if(!host || host.querySelector('.qz-confetti')) return;
  var wrap = document.createElement('div');
  wrap.className = 'qz-confetti' + (fixed ? ' qz-confetti-fixed' : '');
  var colors = ['#E63950','#1E96C8','#E8952C','#2E9E5B','#FFD76A','#8E5BD6'];
  var pieces = '';
  for(var i = 0; i < 70; i++){
    var dur = (2.6 + Math.random()*2.2).toFixed(2);
    var del = (Math.random()*1.8).toFixed(2);
    var dx  = Math.round(-90 + Math.random()*180);
    var rot = Math.round(360 + Math.random()*900);
    pieces += '<i style="left:'+Math.round(Math.random()*100)+'%;'
            + 'background:'+colors[i % colors.length]+';'
            + 'width:'+(6 + Math.round(Math.random()*7))+'px;'
            + 'height:'+(10 + Math.round(Math.random()*12))+'px;'
            + 'animation-duration:'+dur+'s;animation-delay:'+del+'s;'
            + '--dx:'+dx+'px;--rot:'+rot+'deg;"></i>';
  }
  wrap.innerHTML = pieces;
  host.appendChild(wrap);
  setTimeout(function(){ if(wrap.parentNode) wrap.parentNode.removeChild(wrap); }, 9000);
}

function quizNextStep(quiz){
  // Ohne diese Sperre sprang ein zweiter Klick (oder ein Doppeltipp am Beamer)
  // eine Frage weiter, bevor die erste Antwort von Firestore zurück war.
  if(quizBusy('step')) return;
  var s = quizLive.session || {};
  var nextIndex = (typeof s.qIndex === 'number' ? s.qIndex : -1) + 1;
  var questions = quiz.questions || [];
  if(nextIndex >= questions.length){
    var lb = quizLeaderboard();
    setDoc(quizSessionRef(), {
      state:'ende', question:null,
      final: lb.map(function(p){ return { uid:p.uid, name:p.name||'?', score:p.score||0 }; }),
      revealRank: quizTopCount(lb) + 1,   // noch ist nichts verkuendet
      updatedAt: serverTimestamp()
    }, {merge:true}).catch(function(err){ console.error(err); });
    return;
  }
  var q = questions[nextIndex];
  quizLive.busy.reveal = 0;   // fuer die neue Frage darf sofort wieder aufgeloest werden
  setDoc(quizSessionRef(), {
    state:'frage', qIndex: nextIndex,
    question: { text: q.q, answers: q.a },
    sec: q.sec || 25, startedAt: Date.now(), stopped:false, stopLeft:0,
    correctIndex: -1, stats: [], updatedAt: serverTimestamp()
  }, {merge:true}).catch(function(err){ console.error(err); toast('Frage konnte nicht gestartet werden.'); });
}

// Zeit anhalten, wenn die Sekunden nicht reichen: der Countdown friert überall
// ein, niemand wird gesperrt und aufgelöst wird erst per Knopf. Antworten nach
// Ablauf der eigentlichen Zeit geben weiterhin die Grundpunkte, nur keinen Tempo-Bonus.
function quizStopTime(){
  if(quizBusy('stop')) return;
  var s = quizLive.session || {};
  if(s.state !== 'frage' || s.stopped) return;
  setDoc(quizSessionRef(), { stopped:true, stopLeft: quizSecondsLeft(s), updatedAt: serverTimestamp() }, {merge:true})
    .catch(function(err){ console.error(err); toast('Zeit konnte nicht gestoppt werden.'); });
}

// Einen Platz weiter nach oben verkuenden. Die Sperre verhindert, dass ein
// Doppeltipp am Beamer gleich zwei Plaetze auf einmal aufdeckt.
function quizRevealNextRank(){
  if(quizBusy('rank')) return;
  var s = quizLive.session || {};
  if(s.state !== 'ende') return;
  var rr = quizRevealRank(s);
  if(rr <= 1) return;
  setDoc(quizSessionRef(), { revealRank: rr - 1, updatedAt: serverTimestamp() }, {merge:true})
    .catch(function(err){ console.error(err); toast('Der nächste Platz konnte nicht angezeigt werden.'); });
}

// Auflösen wird von zwei Seiten ausgelöst (Knopf und Zeitablauf) - die Sperre
// sorgt dafür, dass daraus nicht zweimal gepunktet wird.
function quizAutoReveal(quiz){
  quizReveal(quiz);
}

function quizReveal(quiz){
  var s = quizLive.session || {};
  if(s.state !== 'frage') return;
  var qIndex = (typeof s.qIndex === 'number') ? s.qIndex : 0;
  var q = (quiz.questions || [])[qIndex];
  if(!q) return;
  if(quizBusy('reveal')) return;
  var sec = q.sec || 25;

  // ZUERST nur umschalten, sonst nichts. Vorher lief erst ein getDocs und dann
  // ein ganzer writeBatch, bevor die Session überhaupt auf 'aufloesung' ging -
  // die Klasse starrte solange auf die Frage. Für "richtig oder falsch" braucht
  // ein Schülergerät ohnehin nur correctIndex; Balken und Punkte kommen gleich
  // danach nach.
  setDoc(quizSessionRef(), {
    state:'aufloesung', correctIndex: q.c, stats: [0,0,0,0], updatedAt: serverTimestamp()
  }, {merge:true}).catch(function(err){ console.error(err); toast('Auflösen fehlgeschlagen.'); });

  getDocs(quizAnswersCol()).then(function(snap){
    var stats = [0,0,0,0];
    var updates = [];
    var byUid = {};
    quizLive.players.forEach(function(p){ byUid[p.uid] = p; });

    snap.forEach(function(d){
      var a = d.data();
      if(a.qIndex !== qIndex) return;
      if(typeof a.choice === 'number' && a.choice >= 0 && a.choice < 4) stats[a.choice]++;
      var player = byUid[d.id];
      var gained = 0;
      if(a.choice === q.c){
        // Grundpunkte plus Tempo-Bonus — schnell und richtig lohnt sich.
        // a.ms ist die auf dem Schülergerät selbst gemessene Zeit; die alte
        // Rechnung a.at - s.startedAt verglich zwei verschiedene Uhren und hat
        // je nach Geräteuhr den Bonus verschenkt oder voll ausgeschüttet.
        var usedSec = (typeof a.ms === 'number')
          ? Math.max(0, Math.min(sec, a.ms/1000))
          : Math.max(0, Math.min(sec, ((a.at||0) - (s.startedAt||a.at||0))/1000));
        gained = 500 + Math.round(500 * (1 - usedSec/sec));
      }
      updates.push({
        uid: d.id,
        name: (player && player.name) || a.name || '?',
        score: ((player && player.score) || 0) + gained,
        correct: ((player && player.correct) || 0) + (gained > 0 ? 1 : 0),
        gained: gained
      });
    });

    var batch = writeBatch(db);
    updates.forEach(function(u){
      batch.set(doc(quizPlayersCol(), u.uid), { name:u.name, score:u.score, correct:u.correct, lastGain:u.gained, lastQ:qIndex }, {merge:true});
    });
    return batch.commit().then(function(){
      return setDoc(quizSessionRef(), { stats: stats, updatedAt: serverTimestamp() }, {merge:true});
    });
  }).catch(function(err){ console.error(err); toast('Punkte konnten nicht verrechnet werden.'); });
}

/* ---------- Schüler:innen: mitspielen ---------- */

var quizPlay = { choice:null, lastQIndex:-1, sig:null, tick:null };

// Nur diese Dinge rechtfertigen ein komplettes Neuzeichnen. Der Countdown gehört
// bewusst nicht dazu: renderQuizPlay() ruft renderChrome(), und das baute früher
// zweimal pro Sekunde die ganze Kopfzeile neu - inklusive eines weiteren
// document-Klicklisteners pro Durchgang und neu startender Animationen.
function quizPlaySig(s){
  // Waehrend einer Frage bleibt die Seite stehen: die eigene Auswahl, die
  // Sperre und der Timer werden punktuell nachgezogen. Sonst hat ein
  // Neuzeichnen (jemand anders tritt bei oder antwortet) den Knopf zwischen
  // Antippen und Loslassen ersetzt - der Tipp ging verloren.
  if(s.state === 'frage') return 'frage|'+s.qIndex;
  var uid = (state.user||{}).uid;
  var me = quizLive.players.filter(function(p){ return p.uid === uid; })[0];
  return [s.state, s.qIndex, s.correctIndex, quizPlay.choice,
          me ? (me.score||0) : -1, me ? (me.lastQ+':'+me.lastGain) : '', quizLive.players.length, (s.stats||[]).join(','),
          quizRevealRank(s)].join('|');
}

function renderQuizPlay(){
  var s = quizLive.session;
  if(!quizIsRunning(s)){
    clearTimeout(quizPlay.tick);
    quizPlay.sig = null;
    state.route = {name:'home'};
    render();
    return;
  }
  if(s.qIndex !== quizPlay.lastQIndex){ quizPlay.lastQIndex = s.qIndex; quizPlay.choice = null; }

  var sig = quizPlaySig(s);
  if(sig !== quizPlay.sig || !document.querySelector('.qp-wrap')){
    quizPlay.sig = sig;
    quizPlayFullRender(s);
  }
  quizPlayTick(s);

  // Den Countdown weiterlaufen lassen, ohne auf ein Firestore-Update zu warten.
  clearTimeout(quizPlay.tick);
  if(s.state === 'frage'){
    quizPlay.tick = setTimeout(function(){ if(state.route.name==='quizplay') renderQuizPlay(); }, 250);
  }
}

// Zwischen zwei Neuzeichnungen wird nur die Zahl im Timer nachgezogen - und ab
// 0 werden die Antwortknöpfe gesperrt. Vorher konnte man nach Ablauf der Zeit
// noch in Ruhe antworten und dafür sogar volle Punkte kassieren.
function quizPlayTick(s){
  if(s.state !== 'frage') return;
  var left = quizSecondsLeft(s);
  var t = document.querySelector('.qp-timer');
  if(t){ t.textContent = (s.stopped ? '⏸ ' : '')+left; t.classList.toggle('qp-timer-hot', !s.stopped && left <= 5); }
  var over = !s.stopped && left <= 0;
  Array.prototype.forEach.call(document.querySelectorAll('[data-choice]'), function(b){
    b.disabled = over || quizPlay.choice !== null;
    b.classList.toggle('qp-a-picked', quizPlay.choice === parseInt(b.getAttribute('data-choice'),10));
  });
  var note = document.getElementById('qpNote');
  if(note){
    note.textContent = quizPlay.choice !== null ? 'Antwort abgeschickt ✓'
                     : (over ? 'Zeit abgelaufen — die Auflösung kommt gleich.'
                     : (s.stopped ? 'Zeit gestoppt — nimm dir die Zeit, die du brauchst.' : ''));
    note.classList.toggle('qp-note-late', quizPlay.choice === null && over);
  }
}

function quizPlayFullRender(s){
  var html = '';
  html += '<div class="qp-wrap">';
  html += '<div class="qp-head"><b>🎮 '+esc(s.title||'Quiz')+'</b>'
        + '<button class="btn btn-ghost btn-sm" id="qpLeave" type="button">Verlassen</button></div>';

  if(s.state === 'lobby'){
    var inLobby = quizLive.players.some(function(p){ return p.uid === state.user.uid; });
    html += inLobby
      ? '<div class="qp-mid"><div class="qp-big">Du bist dabei!</div><p>Gleich geht es los …</p></div>'
      : '<div class="qp-mid"><div class="qp-wait">⏳</div><div class="qp-big">Einen Moment …</div><p>Du wirst gerade angemeldet.</p></div>';
  } else if(s.state === 'frage'){
    var left = quizSecondsLeft(s);
    html += '<div class="qp-timer'+(left<=5?' qp-timer-hot':'')+'">'+left+'</div>';
    html += '<div class="qp-q">'+esc(s.question ? s.question.text : '')+'</div>';
    html += '<div class="qp-answers">'+((s.question && s.question.answers)||[]).map(function(a, i){
      if(!a) return '';
      return '<button class="qp-a qh-a-'+i+(quizPlay.choice===i?' qp-a-picked':'')+'" type="button" data-choice="'+i+'">'
           + '<b>'+['▲','◆','●','■'][i]+'</b>'+esc(a)+'</button>';
    }).join('')+'</div>';
    html += '<div class="qp-note" id="qpNote"></div>';
  } else if(s.state === 'aufloesung'){
    var right = quizPlay.choice === s.correctIndex;
    var me = quizLive.players.filter(function(p){ return p.uid === state.user.uid; })[0];
    html += '<div class="qp-mid '+(right?'qp-right':'qp-wrong')+'">';
    html += '<div class="qp-big">'+(quizPlay.choice === null ? '⏳ Keine Antwort' : (right ? '✅ Richtig!' : '❌ Leider falsch'))+'</div>';
    html += '<p>Richtig war: <b>'+esc((s.question && s.question.answers && s.question.answers[s.correctIndex]) || '')+'</b></p>';
    if(me){
      // Punkte dieser Frage: bei falsch/keiner Antwort sofort +0; bei richtig
      // erst, wenn das Lehrergerät die Punkte verrechnet hat (lastQ = diese Frage).
      if(me.lastQ === s.qIndex) html += '<div class="qp-gain'+((me.lastGain||0)>0?'':' qp-gain-0')+'">+'+(me.lastGain||0)+' Punkte</div>';
      else if(!right) html += '<div class="qp-gain qp-gain-0">+0 Punkte</div>';
      else html += '<div class="qp-gain qp-gain-0">Punkte werden gezählt …</div>';
      html += '<div class="qp-score">Total: '+(me.score||0)+' Punkte</div>';
    }
    html += '</div>';
  } else if(s.state === 'ende'){
    // Solange die Verkuendung laeuft, verraet das eigene Geraet nichts - erst
    // wenn Platz 1 am Beamer steht, sieht jede:r den eigenen Rang.
    var lb = quizFinalList(s);
    var rank = lb.map(function(p){ return p.uid; }).indexOf(state.user.uid);
    var rr = quizRevealRank(s);
    if(rr > 1){
      html += '<div class="qp-mid"><div class="qp-wait">🥁</div>';
      html += '<div class="qp-big">Rangverkündigung</div>';
      html += '<p>Schau nach vorne — die besten '+quizTopCount(lb)+' werden gerade verkündet.</p>';
      if(rank >= 0) html += '<div class="qp-score">'+(lb[rank].score||0)+' Punkte</div>';
      html += '</div>';
    } else {
      html += '<div class="qp-mid">';
      if(rank === 0) html += '<div class="qp-rank qp-rank-1">🥇 Platz 1 — das bist du!</div>';
      else if(rank > 0) html += '<div class="qp-rank">'+quizMedal(rank+1)+' Platz '+(rank+1)+'</div>'
                              + '<p>von '+lb.length+' Mitspielenden</p>';
      else html += '<div class="qp-big">🏆 Rangliste</div>';
      if(rank >= 0) html += '<div class="qp-score">'+(lb[rank].score||0)+' Punkte</div>';
      html += '<ol class="qh-podium">'+lb.slice(0,10).map(function(p){
        return '<li'+(p.uid===state.user.uid?' class="qp-me"':'')+'><span>'+esc(p.name||'?')+'</span><b>'+(p.score||0)+'</b></li>';
      }).join('')+'</ol></div>';
    }
  }
  html += '</div>';

  renderChrome(html);
  ensureQuizPlayDelegation();

  if(s.state === 'ende' && quizRevealRank(s) === 1){
    var fl = quizFinalList(s);
    if(fl.length && fl[0].uid === state.user.uid) quizConfetti(document.body, true);
  }
}

/* Die Antwortknoepfe haengen an #app statt an sich selbst: renderChrome ersetzt
   den Inhalt von #app, nicht das Element - ein Neuzeichnen kann den Listener
   also nicht mehr mitreissen. */
var quizPlayDelegated = false;
function ensureQuizPlayDelegation(){
  if(quizPlayDelegated || !app) return;
  quizPlayDelegated = true;
  app.addEventListener('click', function(e){
    if(state.route.name !== 'quizplay') return;
    var t = e.target;
    if(!t || !t.closest) return;
    if(t.closest('#qpLeave')){
      clearTimeout(quizPlay.tick);
      quizPlay.sig = null;
      state.route = {name:'home'};
      render();
      return;
    }
    var btn = t.closest('[data-choice]');
    if(!btn) return;
    if(quizPlay.choice !== null) return;                 // eine Antwort pro Frage
    var s = quizLive.session;
    if(!s || s.state !== 'frage') return;
    if(!s.stopped && quizSecondsLeft(s) <= 0) return;   // nach Ablauf zählt nichts mehr
    var c = parseInt(btn.getAttribute('data-choice'),10);
    quizPlay.choice = c;
    playBlip();
    setDoc(doc(quizAnswersCol(), state.user.uid), {
      qIndex: s.qIndex, choice: c, at: Date.now(), ms: quizElapsedMs(), name: state.profile.displayName
    }).catch(function(err){ console.error(err); toast('Antwort kam nicht an.'); });
    quizPlayTick(s);
  });
}

/* Selbstheilendes Beitreten: solange man im Quiz ist und der eigene Eintrag in
   spieler/ fehlt (Schreiben fehlgeschlagen, WLAN-Aussetzer, ...), wird es alle
   paar Sekunden erneut versucht - statt wie früher still in der Konsole zu
   scheitern, während das Gerät trotzdem «Du bist dabei!» anzeigte. */
var quizJoin = { pending:false, lastTry:0, retry:null };
function quizEnsureJoined(viaGet){
  clearTimeout(quizJoin.retry);
  if(!state.user || state.route.name !== 'quizplay' || !quizIsRunning(quizLive.session)) return;
  if(quizLive.unsubPlayers && quizLive.players.some(function(p){ return p.uid === state.user.uid; }) && !viaGet) return;
  if(quizJoin.pending || Date.now() - quizJoin.lastTry < 2500){
    quizJoin.retry = setTimeout(function(){ quizEnsureJoined(true); }, 3000);
    return;
  }
  quizJoin.pending = true;
  quizJoin.lastTry = Date.now();
  var playerRef = doc(quizPlayersCol(), state.user.uid);
  var name = (state.profile && state.profile.displayName) || '?';
  // Den Eintrag nur anlegen, wenn er fehlt: beim erneuten Beitreten während
  // derselben Runde würde ein Neuschreiben den Punktestand auf 0 setzen (und
  // die Regel, die genau das verhindert, den Schreibvorgang ablehnen).
  getDoc(playerRef).then(function(snap){
    if(snap.exists()) return null;
    return setDoc(playerRef, { name: name, score: 0, correct: 0 });
  }).then(function(){
    quizJoin.pending = false;
  }, function(err){
    console.error('Quiz beitreten', err);
    quizJoin.pending = false;
    quizJoin.retry = setTimeout(function(){ quizEnsureJoined(true); }, 3000);
  });
}

function joinQuiz(){
  if(!quizIsRunning(quizLive.session)) return;
  // Eigener Spieler-Eintrag mit 0 Punkten; die Punkte setzt danach nur noch
  // das Lehrer-Gerät (siehe firestore.rules). Beim erneuten Beitreten während
  // derselben Runde darf der Eintrag NICHT neu geschrieben werden - das würde
  // den bereits erspielten Punktestand auf 0 zurücksetzen (und die Regel, die
  // genau das verhindert, den Schreibvorgang ablehnen).
  quizJoin.lastTry = 0;
  quizEnsureJoined(true);
  if(!quizLive.unsubPlayers){
    quizLive.unsubPlayers = onSnapshot(quizPlayersCol(), function(snap){
      quizLive.players = [];
      snap.forEach(function(d){ quizLive.players.push(Object.assign({uid:d.id}, d.data())); });
      // Nur eine Antwort vom Server (nicht aus dem Gerätespeicher) zählt als
      // Beweis, dass der eigene Eintrag fehlt - dann gleich nochmals eintragen.
      if(!snap.metadata.fromCache) quizEnsureJoined(false);
      if(state.route.name === 'quizplay') renderQuizPlay();
    }, function(err){ console.error(err); });
  }
  quizPlay.lastQIndex = -1;
  quizPlay.choice = null;
  quizPlay.sig = null;
  state.route = {name:'quizplay'};
  render();
}




/* ===================== KLASSENINFO (Werkzeug-Daten, die auch die Klasse sieht) =====================
   klassenzimmer/{toolId} ist absichtlich teacher-only lesbar (dort stehen Notizen
   zur Klasse). Alles, was die Schüler:innen ebenfalls sehen sollen — zurzeit der
   Ämtliplan — liegt darum in klasseninfo/{toolId}: lesbar für alle Angemeldeten,
   geschrieben nur von der Lehrperson (siehe firestore.rules). */

function klasseninfoRef(id){ return kdoc('klasseninfo', id); }

// Die Klassenliste braucht inzwischen ein halbes Dutzend Werkzeuge. Einmal
// laden und behalten, statt bei jedem Öffnen erneut abzufragen.
var klasseRoster = { list:[], loaded:false };
function klasseRosterLoad(force){
  if(klasseRoster.loaded && !force) return Promise.resolve(klasseRoster.list);
  return loadStudentRoster().then(function(list){
    klasseRoster.list = list; klasseRoster.loaded = true;
    return list;
  });
}

/* ===================== 🧹 ÄMTLIPLAN =====================
   Der Plan wird NICHT Woche für Woche gespeichert, sondern aus vier Angaben
   gerechnet: Startdatum, Wochentage, Team-Reihenfolge und ein Versatz pro Ämtli.
   Damit zieht er von allein bis zu den Sommerferien weiter, ohne dass jemand
   eine Tabelle nachführen muss.

   Ferienwochen fallen automatisch raus (FERIEN_TG), einzelne Wochen (Lager,
   Sporttag, Projektwoche) lassen sich von Hand streichen — skipWeeks. Wichtig:
   eine ausgelassene Woche VERBRAUCHT KEIN TEAM. Die Reihenfolge läuft danach
   genau dort weiter, wo sie aufgehört hat — so steht es auch im Worddokument,
   aus dem der Plan übernommen wurde (25.08. und 29.09. fehlen dort, die
   Reihenfolge der Teams läuft trotzdem ununterbrochen durch). */

// Die Paare aus Aemtliplan_Klasse_G3b.docx, in genau dieser Reihenfolge.
// Dient nur als Vorbelegung beim allerersten Öffnen — danach gilt, was in
// klasseninfo/aemtli steht.
var AEMTLI_DEFAULT_TEAMS = [
  ['Matteo','Alajdin'], ['Julia','Feyza'], ['Matilda','Marie-Lou'],
  ['Severin','Jan'], ['Ilario','Moritz'], ['Alisia','Naima'], ['Tamara','Giulia']
];
var AEMTLI_DEFAULTS = {
  startDate: '2026-08-11',          // erster Diensttag nach den Sommerferien
  weekdays: [2, 5],                 // Dienstag + Freitag (0 = Sonntag)
  zeiten: { 2:'08:15', 5:'11:00' }, // feste Uhrzeit je Diensttag
  stuhl: { 2:true, 5:false },       // true = «AUFSTUHLEN», sonst «NICHT aufstuhlen»
  aemtli: [
    { icon:'🧹', name:'Boden wischen',    offset:0 },
    { icon:'🧽', name:'Wandtafel putzen', offset:4 }
  ],
  skipWeeks: ['2026-08-24', '2026-09-28']   // Montag der Woche, die ausfällt
};

var aemtliState = { cfg:null, roster:[], loaded:false, exists:false, inflight:null };
// scrollTo: 'now' heisst "beim nächsten Zeichnen zur laufenden Woche springen".
// Sonst bleibt die Scrollposition stehen — sonst würde der Blick bei jedem
// Streichen/Zurückholen zurückspringen und man sähe die eigene Änderung nicht.
var aemtliUi = { view:'plan', alle:false, scrollTo:'now' };

function aemtliParse(s){ var p = s.split('-').map(Number); return new Date(p[0], p[1]-1, p[2]); }
function aemtliAddDays(dateStr, n){ var d = aemtliParse(dateStr); d.setDate(d.getDate()+n); return localDateStr(d); }
// Montag der Woche, in der dateStr liegt — der Wochenschlüssel des ganzen Moduls.
function aemtliMonday(dateStr){
  var d = aemtliParse(dateStr), wd = d.getDay();
  d.setDate(d.getDate() + (wd === 0 ? -6 : 1 - wd));
  return localDateStr(d);
}
function nowHHMM(){ var d = new Date(); return pad2(d.getHours())+':'+pad2(d.getMinutes()); }
// Uhrzeit des Ämtlis an diesem Datum ('' wenn für den Wochentag keine gesetzt ist).
function aemtliZeit(cfg, dateStr){
  var wd = aemtliParse(dateStr).getDay();
  var z = cfg.zeiten || {};
  return z[wd] || z[String(wd)] || '';
}
// "Dienstag 08:15 · Freitag 11:00" — steht über dem Plan und in der Schüler-Sicht.
function aemtliZeitenText(cfg){
  return (cfg.weekdays||[]).slice().sort(function(a,b){ return a-b; }).map(function(wd){
    var name = ['Sonntag','Montag','Dienstag','Mittwoch','Donnerstag','Freitag','Samstag'][wd];
    var z = (cfg.zeiten||{})[wd] || (cfg.zeiten||{})[String(wd)] || '';
    return name + (z ? ' ' + z + ' Uhr' : '');
  }).join(' · ');
}
function aemtliStuhl(cfg, wd){
  var st = (cfg && cfg.stuhl) || {};
  return !!(st.hasOwnProperty(wd) ? st[wd] : st[String(wd)]);
}
function aemtliInFerien(dateStr){
  return FERIEN_TG.some(function(f){ return f.start <= dateStr && f.end >= dateStr; });
}

/* Alle Wochen vom Start bis zu den nächsten Sommerferien. Ausgelassene Wochen
   bleiben in der Liste stehen (damit die Lehrperson sie in der Tabelle sieht und
   wieder aktivieren kann), bekommen aber idx = -1 und zählen für die Rotation
   nicht mit. */
function aemtliWeeks(cfg){
  var weekdays = (cfg.weekdays && cfg.weekdays.length) ? cfg.weekdays : AEMTLI_DEFAULTS.weekdays;
  var skip = cfg.skipWeeks || [];
  var sommer = FERIEN_TG.filter(function(f){ return f.label === 'Sommerferien' && f.start > cfg.startDate; })[0];
  var endDate = sommer ? aemtliAddDays(sommer.start, -1) : aemtliAddDays(cfg.startDate, 330);
  var mon = aemtliMonday(cfg.startDate), weeks = [], idx = 0, guard = 0;
  while(mon <= endDate && guard++ < 70){
    var all = weekdays.map(function(wd){ return aemtliAddDays(mon, (wd === 0 ? 7 : wd) - 1); })
                      .filter(function(d){ return d >= cfg.startDate && d <= endDate; });
    if(all.length){
      var offen = all.filter(function(d){ return !aemtliInFerien(d); });
      var reason = !offen.length ? 'ferien' : (skip.indexOf(mon) >= 0 ? 'manuell' : '');
      weeks.push({ monday:mon, days:(offen.length ? offen : all), skipped:reason, idx:(reason ? -1 : idx++) });
    }
    mon = aemtliAddDays(mon, 7);
  }
  return weeks;
}

// "11. + 14.08." wie im Worddokument; über einen Monatswechsel hinweg
// ausgeschrieben ("29.09. + 02.10.").
function aemtliWeekLabel(w){
  var months = w.days.map(function(d){ return d.slice(5,7); });
  if(months.length && months.every(function(m){ return m === months[0]; })){
    return w.days.map(function(d){ return d.slice(8,10)+'.'; }).join(' + ') + months[0] + '.';
  }
  return w.days.map(function(d){ return d.slice(8,10)+'.'+d.slice(5,7)+'.'; }).join(' + ');
}

function aemtliTeamFor(cfg, w, a){
  var teams = cfg.teams || [];
  if(!teams.length || w.idx < 0) return null;
  var n = teams.length;
  return teams[(((w.idx + (a.offset||0)) % n) + n) % n];
}
function aemtliNames(uids){
  return (uids||[]).map(function(uid){
    var s = aemtliState.roster.filter(function(x){ return x.uid === uid; })[0];
    return s ? (s.displayName||s.username) : '?';
  });
}
function aemtliShortNames(uids){
  return aemtliNames(uids).map(function(n){ return n.split(' ')[0]; });
}

/* Vorbelegung: die Vornamen aus dem Worddokument auf die echten Konten
   abbilden. Wer dort nicht vorkommt (neu in der Klasse), hängt hinten als
   eigenes Team an, statt still zu verschwinden. */
function aemtliSeedTeams(roster){
  var byName = {};
  roster.forEach(function(s){
    var parts = (s.displayName||'').trim().split(/\s+/);
    var first = spNormName(parts[0]||''), full = spNormName(s.displayName||'');
    if(first && !byName[first]) byName[first] = s.uid;
    if(full && !byName[full]) byName[full] = s.uid;
  });
  var used = {};
  var teams = (state.klasse === 'G3b' ? AEMTLI_DEFAULT_TEAMS : []).map(function(pair){
    return pair.map(function(n){
      var uid = byName[spNormName(n)];
      if(uid) used[uid] = true;
      return uid || null;
    }).filter(Boolean);
  }).filter(function(t){ return t.length; });
  var rest = roster.filter(function(s){ return !used[s.uid]; }).map(function(s){ return s.uid; });
  for(var i=0; i<rest.length; i+=2) teams.push(rest.slice(i, i+2));
  return teams;
}

function aemtliLoad(force){
  if(aemtliState.loaded && !force) return Promise.resolve(aemtliState);
  // Einfach-Ladung: klickt man schnell hintereinander (oder laeuft noch der
  // Aufruf vom Startseiten-Banner), wird DIESELBE Anfrage weiterverwendet
  // statt einer zweiten. Vorher konnten sich zwei Ladevorgaenge ueberholen.
  if(aemtliState.inflight && !force) return aemtliState.inflight;

  // Beide Teilabfragen duerfen ausfallen, ohne das Ganze zu kippen: der Plan
  // ist deterministisch und laesst sich auch ohne gespeichertes Dokument
  // rechnen, und ohne Klassenliste zeigt er statt Namen eben "?". Damit kann
  // aemtliLoad NICHT mehr ablehnen - genau daran scheiterte das Zeichnen
  // vorher stillschweigend.
  var doc_ = getDoc(klasseninfoRef('aemtli')).catch(function(err){
    console.error('Ämtliplan-Dokument nicht lesbar', err);
    return { exists: function(){ return false; }, data: function(){ return {}; } };
  });
  var roster_ = klasseRosterLoad().catch(function(err){
    console.error('Klassenliste nicht lesbar', err);
    return [];
  });

  aemtliState.inflight = Promise.all([doc_, roster_]).then(function(r){
    var snap = r[0], roster = ohneGaeste(r[1] || []);   // Fach-Gäste haben keine Ämtli
    // Tiefe Kopie der Vorgaben: sonst würden Bearbeitungen (Teams, Zeiten,
    // gestrichene Wochen) direkt in AEMTLI_DEFAULTS landen und dort hängen bleiben.
    var cfg = Object.assign(JSON.parse(JSON.stringify(AEMTLI_DEFAULTS)), snap.exists() ? snap.data() : {});
    // Gespeicherte Felder gegen Unsinn absichern: ein einziges fehlendes oder
    // kaputtes Feld (z.B. startDate) hat beim Zeichnen sonst eine Ausnahme
    // geworfen, und die Seite blieb leer.
    if(!/^\d{4}-\d{2}-\d{2}$/.test(cfg.startDate || '')) cfg.startDate = AEMTLI_DEFAULTS.startDate;
    cfg.teams = aemtliTeamsAusSpeicher(cfg.teams) || [];
    // Ohne gespeicherten Plan bekommen Schüler:innen neuer Klassen keine
    // Ämtli zugeteilt, bis ihre Lehrperson den Plan einmal geöffnet hat.
    if(!cfg.teams.length && (state.klasse === 'G3b' || (state.profile && state.profile.role === 'teacher'))) cfg.teams = aemtliSeedTeams(roster);
    if(!Array.isArray(cfg.aemtli) || !cfg.aemtli.length) cfg.aemtli = JSON.parse(JSON.stringify(AEMTLI_DEFAULTS.aemtli));
    cfg.aemtli = cfg.aemtli.filter(function(a){ return a && typeof a === 'object'; })
                           .map(function(a){ return { icon: a.icon || '🧹', name: a.name || 'Ämtli', offset: parseInt(a.offset, 10) || 0 }; });
    if(!cfg.aemtli.length) cfg.aemtli = JSON.parse(JSON.stringify(AEMTLI_DEFAULTS.aemtli));
    if(!Array.isArray(cfg.weekdays) || !cfg.weekdays.length) cfg.weekdays = AEMTLI_DEFAULTS.weekdays.slice();
    cfg.weekdays = cfg.weekdays.map(Number).filter(function(n){ return n >= 0 && n <= 6; });
    if(!cfg.weekdays.length) cfg.weekdays = AEMTLI_DEFAULTS.weekdays.slice();
    if(!cfg.zeiten || typeof cfg.zeiten !== 'object') cfg.zeiten = Object.assign({}, AEMTLI_DEFAULTS.zeiten);
    if(!cfg.stuhl || typeof cfg.stuhl !== 'object') cfg.stuhl = Object.assign({}, AEMTLI_DEFAULTS.stuhl);
    cfg.skipWeeks = Array.isArray(cfg.skipWeeks) ? cfg.skipWeeks : [];
    aemtliState.cfg = cfg;
    aemtliState.roster = roster;
    aemtliState.exists = snap.exists();
    aemtliState.loaded = true;
    aemtliState.inflight = null;
    return aemtliState;
  });
  return aemtliState.inflight;
}

/* Beim Tippen wird NICHT neu gezeichnet. Frueher lief bei jedem change ein
   voller Neuaufbau des Editors - und weil change erst beim Verlassen des Feldes
   feuert, wurde der Klick, der das Feld verlassen hat (z.B. auf "Plan"), vom
   Neuaufbau verschluckt: der Knopf war zwischen mousedown und mouseup weg, das
   click-Ereignis kam nie an. Man musste alles zweimal klicken. Jetzt wandert
   der Wert bei jedem Tastendruck nach cfg, gespeichert wird entprellt, und
   neugezeichnet nur, wenn sich die Struktur aendert (hinzufuegen/loeschen). */
var aemtliSaveTimer = null;
function aemtliSaveSoon(){
  clearTimeout(aemtliSaveTimer);
  aemtliSaveTimer = setTimeout(function(){ aemtliSaveTimer = null; aemtliSave(); }, 500);
}
function aemtliSaveFlush(){
  if(!aemtliSaveTimer) return;
  clearTimeout(aemtliSaveTimer); aemtliSaveTimer = null;
  aemtliSave();
}

/* Firestore kann KEINE verschachtelten Arrays speichern. teams ist aber genau
   das — eine Liste von Zweierteams. Frueher ging der Wert unveraendert an
   setDoc, und das SDK warf daraufhin SYNCHRON eine Ausnahme (nicht als
   abgelehntes Promise, der .catch() lief also ins Leere). Die Ausnahme flog aus
   aemtliSave() heraus und riss alles mit, was danach kam — insbesondere das
   Neuzeichnen. Deshalb wirkte ein Streichen folgenlos und der Plan blieb beim
   ersten Oeffnen im Ladezustand haengen. Gespeichert wird jetzt als Liste von
   Maps: [{m:[uid,uid]}, ...]. Arrays INNERHALB einer Map sind erlaubt. */
function aemtliTeamsSpeicherform(teams){
  return (teams || []).map(function(t){ return { m: (t || []).slice() }; });
}
function aemtliTeamsAusSpeicher(roh){
  if(!Array.isArray(roh)) return null;
  return roh.map(function(t){
    if(Array.isArray(t)) return t;                       // alte Form, falls doch mal eine ankommt
    return (t && Array.isArray(t.m)) ? t.m : [];
  }).filter(function(t){ return t.length; });
}

function aemtliSave(){
  var c = aemtliState.cfg;
  if(!c) return Promise.resolve();
  aemtliState.exists = true;
  // Zusaetzlich in try/catch: eine synchrone Ausnahme aus setDoc darf NIE mehr
  // den Aufrufer mitreissen — das Zeichnen haengt nicht vom Speichern ab.
  try{
    return setDoc(klasseninfoRef('aemtli'), {
      startDate: c.startDate, weekdays: c.weekdays, zeiten: c.zeiten, stuhl: c.stuhl || {}, aemtli: c.aemtli,
      teams: aemtliTeamsSpeicherform(c.teams), skipWeeks: c.skipWeeks, updatedAt: serverTimestamp()
    }).catch(function(err){ console.error('Ämtliplan nicht gespeichert', err); toast('Ämtliplan nicht gespeichert.'); });
  }catch(err){
    console.error('Ämtliplan nicht gespeichert', err);
    toast('Ämtliplan nicht gespeichert.');
    return Promise.resolve();
  }
}

// Wer heute dran ist — null, wenn heute kein Diensttag ist.
function aemtliHeute(cfg, dateStr){
  var today = dateStr || todayStr();
  var w = aemtliWeeks(cfg).filter(function(x){ return !x.skipped && x.days.indexOf(today) >= 0; })[0];
  if(!w) return null;
  return { week:w, datum:today, zeit: aemtliZeit(cfg, today),
           jobs: cfg.aemtli.map(function(a){ return { a:a, team: aemtliTeamFor(cfg, w, a) || [] }; }) };
}

/* Alle eigenen Ämtli-Termine ab heute, chronologisch. Grundlage fuer den Besen
   in der Kopfzeile, die Terminliste und den Tageshinweis. Ein Termin, dessen
   Uhrzeit heute schon vorbei ist, faellt raus — er ist erledigt. */
function aemtliMeineTermine_(cfg, uid){
  var today = todayStr(), jetzt = nowHHMM(), out = [];
  aemtliWeeks(cfg).forEach(function(w){
    if(w.skipped) return;
    cfg.aemtli.forEach(function(a){
      var team = aemtliTeamFor(cfg, w, a) || [];
      if(team.indexOf(uid) < 0) return;
      w.days.forEach(function(d){
        if(d < today) return;
        var zeit = aemtliZeit(cfg, d);
        if(d === today && zeit && jetzt >= zeit) return;   // heute schon vorbei
        out.push({ datum:d, zeit:zeit, aemtli:a, woche:w.monday,
                   partner: aemtliShortNames(team.filter(function(u){ return u !== uid; })) });
      });
    });
  });
  out.sort(function(x,y){ return x.datum.localeCompare(y.datum) || (x.zeit||'').localeCompare(y.zeit||''); });
  return out;
}

const NEU_TAGE = 3;
const NEU_GESEHEN_KEY = 'libNeu_gesehen';
var neuState = { klasse:null, seen:null, loading:null };

function neuSichtbar(){
  var isTeacher = state.profile && state.profile.role === 'teacher';
  return NEUIGKEITEN.filter(function(n){ return isTeacher || n.fuer === 'alle'; });
}
function neuLoadSeen(force){
  if(!force && neuState.klasse === state.klasse && neuState.seen) return Promise.resolve(neuState.seen);
  if(!force && neuState.klasse === state.klasse && neuState.loading) return neuState.loading;
  var klasse = state.klasse;
  neuState.klasse = klasse;
  neuState.loading = getDoc(kdoc('appMeta', 'neuigkeiten')).then(function(snap){
    var seen = (snap.exists() && snap.data().seen) || {};
    if(neuState.klasse === klasse){ neuState.seen = seen; neuState.loading = null; }
    return seen;
  }).catch(function(err){
    console.error('Neuigkeiten', err);
    neuState.loading = null;
    return neuState.seen || {};
  });
  return neuState.loading;
}
function neuIstNeu(n, seen){
  var t = seen && seen[n.id];
  return !t || (Date.now() - t) < NEU_TAGE * 86400000;
}
function neuGesehenLesen(){
  try { return JSON.parse(localStorage.getItem(NEU_GESEHEN_KEY) || '[]') || []; } catch(e){ return []; }
}
function neuGesehenSchreiben(ids){
  try { localStorage.setItem(NEU_GESEHEN_KEY, JSON.stringify(ids)); } catch(e){}
}

function updateNeuButton(){
  if(!document.getElementById('neuBtn') || !state.profile) return;
  neuLoadSeen().then(function(seen){
    var btn = document.getElementById('neuBtn');
    if(!btn) return;
    var gesehen = neuGesehenLesen();
    var offen = neuSichtbar().filter(function(n){ return neuIstNeu(n, seen) && gesehen.indexOf(n.id) < 0; });
    btn.classList.toggle('topbar-neu-an', offen.length > 0);
    btn.title = offen.length ? ('Neuigkeiten: ' + offen.length + ' neu') : 'Neuigkeiten';
  });
}

function renderNeuigkeiten(){
  clearSubjectWatchers(); clearOverviewWatchers();
  var html = '<div class="back-row"><button class="btn btn-ghost btn-sm" id="backBtn" type="button">&larr; Zurück</button></div>';
  html += '<h2 class="page-welcome" style="margin-bottom:6px;">🆕 Neuigkeiten</h2>';
  html += '<div id="neuBody"><div class="empty-state">Wird geladen …</div></div>';
  renderChrome(html);
  document.getElementById('backBtn').addEventListener('click', goHome);
  var isTeacher = state.profile.role === 'teacher';
  neuLoadSeen(true).then(function(seen){
    var liste = neuSichtbar();
    var vorher = neuGesehenLesen();
    // Lehrperson in der eigenen Klasse: Uhr für noch nicht gestartete Einträge starten.
    if(isTeacher && !isFremdeKlasse()){
      var patch = {}, jetzt = Date.now(), neuGestartet = false;
      NEUIGKEITEN.forEach(function(n){ if(!seen[n.id]){ patch[n.id] = jetzt; neuGestartet = true; } });
      if(neuGestartet){
        setDoc(kdoc('appMeta', 'neuigkeiten'), { seen: patch }, {merge:true})
          .catch(function(err){ console.error('Neuigkeiten speichern', err); });
        Object.keys(patch).forEach(function(id){ seen[id] = patch[id]; });
      }
    }
    paintNeuigkeiten(liste, seen, vorher, isTeacher);
    var ids = vorher.slice();
    liste.forEach(function(n){ if(ids.indexOf(n.id) < 0) ids.push(n.id); });
    neuGesehenSchreiben(ids);
    updateNeuButton();
  });
}

function paintNeuigkeiten(liste, seen, vorher, isTeacher){
  var host = document.getElementById('neuBody');
  if(!host) return;
  var neu = liste.filter(function(n){ return neuIstNeu(n, seen); });
  var alt = liste.filter(function(n){ return !neuIstNeu(n, seen); });
  alt.sort(function(a, b){ return b.datum.localeCompare(a.datum); });
  function itemHtml(n, markUnseen){
    var h = '<div class="neu-item'+(markUnseen && vorher.indexOf(n.id) < 0 ? ' neu-unseen' : '')+'">';
    h += '<div class="neu-date">'+esc(fmtDueDate(n.datum))+'</div>';
    h += '<div class="neu-text">'+esc(n.text);
    if(isTeacher && n.fuer === 'lehrer') h += '<span class="neu-tag">nur LP</span>';
    h += '</div></div>';
    return h;
  }
  var h = '<div class="card">';
  h += neu.length
    ? '<div class="neu-list">'+neu.map(function(n){ return itemHtml(n, true); }).join('')+'</div>'
    : '<div class="empty-state">Gerade nichts Neues.</div>';
  if(alt.length){
    h += '<details class="neu-old-details"><summary>Nüme so neu ('+alt.length+')</summary>';
    h += '<div class="neu-list">'+alt.map(function(n){ return itemHtml(n, false); }).join('')+'</div>';
    h += '</details>';
  }
  h += '</div>';
  host.innerHTML = h;
}

function updateAemtliButton(){
  var btn = document.getElementById('aemtliBtn');
  if(!btn || !state.profile || state.profile.role === 'teacher') return;

    btn = document.getElementById('aemtliBtn');
    if(!btn) return;
    var termine = aemtliMeineTermine_(st.cfg, state.user.uid);
    var naechster = termine[0];
