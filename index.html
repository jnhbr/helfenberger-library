/* ===================== ORDNER-AKTIONEN (nur Lehrperson) ===================== */

function createFolder(subjectId, parentId, name){
  var siblings = foldersIn(parentId);
  var id = subjectId+'_f_'+Date.now();
  setDoc(doc(db,'folders', id), {
    subject: subjectId,
    parentId: parentId || null,
    name: name.slice(0,60),
    order: siblings.length,
    createdAt: serverTimestamp(),
    createdBy: state.user.uid
  }).then(function(){ toast('Ordner «'+name+'» angelegt.'); })
    .catch(function(err){ console.error(err); toast('Ordner konnte nicht angelegt werden.'); });
}

function renameFolder(f, name){
  setDoc(doc(db,'folders', f.id), {name: name.slice(0,60)}, {merge:true})
    .catch(function(err){ console.error(err); toast('Umbenennen fehlgeschlagen.'); });
}

// Reihenfolge der Ordner innerhalb desselben Elternordners (gleiches Muster wie
// bei den Übungen: nach dem Tausch bekommt JEDER Ordner der Liste eine frische
// 0..n-1-Nummer, damit auch nie manuell sortierte Ordner konsistent bleiben).
function reorderFolder(folders, index, direction){
  var newIndex = index + direction;
  if(newIndex < 0 || newIndex >= folders.length) return;
  var reordered = folders.slice();
  var tmp = reordered[index]; reordered[index] = reordered[newIndex]; reordered[newIndex] = tmp;
  var batch = writeBatch(db);
  reordered.forEach(function(f, i){ batch.update(doc(db,'folders', f.id), {order: i}); });
  batch.commit().catch(function(err){ console.error(err); toast('Verschieben fehlgeschlagen.'); });
}

function askMoveFolder(f){
  // Ein Ordner darf weder in sich selbst noch in einen seiner eigenen
  // Unterordner wandern — sonst hinge der Teilbaum in einem Zyklus fest.
  var blocked = subtreeIds(f.id);
  uiPickFolder('«'+f.name+'» verschieben', 'Wohin soll der Ordner mit seinem ganzen Inhalt?', f.parentId || null, blocked, function(targetId){
    var ownHeight = maxDepthBelow(f.id);
    if(folderDepth(targetId) + 1 + ownHeight > MAX_FOLDER_DEPTH){
      uiInfo('Zu tief verschachtelt', 'Dort würden mehr als '+MAX_FOLDER_DEPTH+' Ordner-Ebenen entstehen. Wähle einen Ort weiter oben.');
      return;
    }
    var siblings = foldersIn(targetId);
    setDoc(doc(db,'folders', f.id), {parentId: targetId || null, order: siblings.length}, {merge:true})
      .then(function(){ toast('«'+f.name+'» verschoben.'); })
      .catch(function(err){ console.error(err); toast('Verschieben fehlgeschlagen.'); });
  });
}

// Wie viele Ebenen hängen unter diesem Ordner noch dran? (0 = keine Unterordner)
function maxDepthBelow(folderId){
  var kids = state.folders.filter(function(f){ return (f.parentId||null) === folderId; });
  if(!kids.length) return 0;
  return 1 + Math.max.apply(null, kids.map(function(k){ return maxDepthBelow(k.id); }));
}

// Löschen bewusst nur, wenn wirklich nichts mehr drin ist — so kann nie
// versehentlich eine ganze Übungssammlung mitverschwinden.
function askDeleteFolder(f){
  var c = subtreeCounts(f.id);
  if(c.folders || c.resources){
    var was = [];
    if(c.folders) was.push(c.folders+' Unterordner');
    if(c.resources) was.push(c.resources+' Übung'+(c.resources===1?'':'en'));
    uiInfo('Ordner ist nicht leer',
      '«'+f.name+'» enthält noch '+was.join(' und ')+'. Verschiebe den Inhalt zuerst woandershin (Knopf «Verschieben»), dann lässt sich der Ordner löschen.');
    return;
  }
  uiConfirm('Ordner löschen?', '«'+f.name+'» ist leer und wird entfernt.', 'Löschen', function(){
    deleteDoc(doc(db,'folders', f.id))
      .then(function(){ toast('Ordner gelöscht.'); })
      .catch(function(err){ console.error(err); toast('Löschen fehlgeschlagen.'); });
  }, true);
}

/* ===================== ÜBUNGEN: SORTIEREN, VERSCHIEBEN, MARKIEREN ===================== */

// Übungen mit ausdrücklicher `order` (gesetzt, sobald die Pfeile benutzt wurden)
// kommen zuerst; alles nie manuell Sortierte fällt auf "neuste zuoberst" zurück.
function sortResources(resources){
  resources.sort(function(a, b){
    var oa = typeof a.order === 'number' ? a.order : null;
    var ob = typeof b.order === 'number' ? b.order : null;
    if(oa !== null && ob !== null) return oa - ob;
    if(oa !== null) return -1;
    if(ob !== null) return 1;
    var ta = a.uploadedAt && a.uploadedAt.toDate ? a.uploadedAt.toDate().getTime() : 0;
    var tb = b.uploadedAt && b.uploadedAt.toDate ? b.uploadedAt.toDate().getTime() : 0;
    return tb - ta;
  });
}

// Verschiebt die Übung an `index` innerhalb des GERADE ANGEZEIGTEN Containers
// (Fach-Hauptebene oder ein Ordner) und schreibt danach für jede Übung dieses
// Containers eine frische 0..n-1-Nummer.
function moveResource(resources, index, direction){
  var newIndex = index + direction;
  if(newIndex < 0 || newIndex >= resources.length) return;
  var reordered = resources.slice();
  var tmp = reordered[index]; reordered[index] = reordered[newIndex]; reordered[newIndex] = tmp;
  var batch = writeBatch(db);
  reordered.forEach(function(r, i){ batch.update(doc(db,'resources', r.id), {order: i}); });
  batch.commit().catch(function(err){ console.error(err); toast('Verschieben fehlgeschlagen.'); });
}

// Übung in einen anderen Ordner desselben Fachs legen. Sie landet am Ende des
// Zielcontainers; im Herkunftscontainer werden die Nummern wieder lückenlos
// durchgezählt, damit die Pfeile dort weiter sauber funktionieren.
function askMoveResource(r){
  var title = r.title || r.fileName;
  uiPickFolder('«'+title+'» verschieben', 'In welchen Ordner soll diese Übung?', r.folderId || null, [], function(targetId){
    var targetList = resourcesIn(targetId);
    var sourceList = resourcesIn(r.folderId || null).filter(function(x){ return x.id !== r.id; });
    var batch = writeBatch(db);
    batch.update(doc(db,'resources', r.id), {folderId: targetId || null, order: targetList.length, prevOrder: null});
    sourceList.forEach(function(x, i){ batch.update(doc(db,'resources', x.id), {order: i}); });
    batch.commit()
      .then(function(){ toast('«'+title+'» verschoben.'); })
      .catch(function(err){ console.error(err); toast('Verschieben fehlgeschlagen.'); });
  });
}

// Markiert genau EINE Übung pro Fach als "aktuell" (rot hervorgehoben, auch für
// die Klasse sichtbar). Beim Markieren rutscht sie zusätzlich an den Anfang
// ihres eigenen Ordners; beim Entfernen der Markierung wieder genau dorthin
// zurück, wo sie vorher stand (prevOrder). Ordner, in denen das aktuelle Thema
// liegt, werden im Kärtchen ebenfalls rot markiert, damit man es findet.
function toggleCurrent(resources, r){
  var makeCurrent = !r.current;
  var batch = writeBatch(db);

  if(makeCurrent){
    var prevIndex = resources.findIndex(function(x){ return x.id === r.id; });
    var reordered = [r].concat(resources.filter(function(x){ return x.id !== r.id; }));
    reordered.forEach(function(item, i){
      var patch = { order: i };
      if(item.id === r.id){ patch.current = true; patch.prevOrder = prevIndex; }
      batch.update(doc(db,'resources', item.id), patch);
    });
    // jede andere im Fach als "aktuell" markierte Übung entmarkieren — auch in
    // anderen Ordnern, deshalb über state.resources statt nur die Liste hier
    state.resources.forEach(function(x){
      if(x.id !== r.id && x.current){ batch.update(doc(db,'resources', x.id), {current: false}); }
    });
  } else {
    var others = resources.filter(function(x){ return x.id !== r.id; });
    var restoreAt = typeof r.prevOrder === 'number' ? Math.max(0, Math.min(r.prevOrder, others.length)) : others.length;
    var back = others.slice(0, restoreAt).concat([r]).concat(others.slice(restoreAt));
    back.forEach(function(item, i){
      var patch = { order: i };
      if(item.id === r.id){ patch.current = false; patch.prevOrder = null; }
      batch.update(doc(db,'resources', item.id), patch);
    });
  }

  batch.commit().catch(function(err){ console.error(err); toast('Aktualisieren fehlgeschlagen.'); });
}

  if(isTeacher){

    html += '<button class="move-btn" id="down-'+r.id+'" type="button" title="Nach unten"'+(index===total-1?' disabled':'')+'><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9l6 6 6-6"/></svg></button>';

function updateResourceBar(resourceId, p){
  var bar = document.getElementById('pbar-'+resourceId);
  var meta = document.getElementById('pmeta-'+resourceId);
  if(!bar || !meta) return;
  if(!p || p.attempted===0){ bar.style.width='0%'; meta.textContent = meta.textContent.indexOf('hinzugefügt')>=0 ? meta.textContent : 'Noch nicht geübt'; return; }
  var pct = p.coveragePct!==null ? p.coveragePct : p.correctPct;
  bar.style.width = pct+'%';
  var parts = [];
  if(p.total){ parts.push(p.attempted+' / '+p.total+' geübt'); } else { parts.push(p.attempted+' bearbeitet'); }
  if(p.correctPct!==null){ parts.push(p.correctPct+'% richtig'); }
  meta.textContent = parts.join(' · ');
}

function renameResource(r, title){
  setDoc(doc(db,'resources', r.id), {title: title.slice(0,120)}, {merge:true})
    .catch(function(err){ console.error(err); toast('Umbenennen fehlgeschlagen.'); });
}

function askDeleteResource(r){
  uiConfirm('Übung löschen?',
    '«'+(r.title||r.fileName)+'» wird endgültig entfernt. Das kann nicht rückgängig gemacht werden.',
    'Löschen', function(){ deleteResource(r); }, true);
}

async function deleteResource(r){
  try{
    var contentSnap = await getDoc(doc(db,'resourceContent', r.id));
    var chunkCount = (contentSnap.exists() && contentSnap.data().chunkCount) || 0;
    var batch = writeBatch(db);
    batch.delete(doc(db,'resources', r.id));
    batch.delete(doc(db,'resourceContent', r.id));
    for(var i=0;i<chunkCount;i++){
      batch.delete(doc(db,'resourceContent', r.id, 'chunks', String(i)));
    }
    await batch.commit();
    toast('Übung gelöscht.');
  }catch(err){
    console.error(err);
    toast('Löschen fehlgeschlagen.');
  }
}

/* ===================== TEACHER UPLOAD ===================== */

// Die Dropzone lädt immer in den GERADE OFFENEN Ordner (state.route.folderId).
// Sie wird nur einmal pro Fachseite verdrahtet und liest das Ziel erst beim
// Ablegen aus — so stimmt es auch nach einem Wechsel in einen Unterordner.
function wireDropzone(subjectId){
  var dz = document.getElementById('dropzone');
  var input = document.getElementById('fileInput');
  ['dragenter','dragover'].forEach(function(evt){
    dz.addEventListener(evt, function(e){ e.preventDefault(); dz.classList.add('drag'); });
  });
  ['dragleave','drop'].forEach(function(evt){
    dz.addEventListener(evt, function(e){ e.preventDefault(); dz.classList.remove('drag'); });
  });
  dz.addEventListener('drop', function(e){
    var files = e.dataTransfer.files;
    if(files && files.length){ handleUpload(subjectId, state.route.folderId || null, files[0]); }
  });
  input.addEventListener('change', function(){
    if(input.files && input.files.length){ handleUpload(subjectId, state.route.folderId || null, input.files[0]); input.value=''; }
  });
}

function readFileAsText(file){
  return new Promise(function(resolve, reject){
    var reader = new FileReader();
    reader.onload = function(){ resolve(reader.result); };
    reader.onerror = function(){ reject(reader.error); };
    reader.readAsText(file, 'utf-8');
  });
}

function handleUpload(subjectId, folderId, file){
  if(!/\.html?$/i.test(file.name) && file.type !== 'text/html'){
    toast('Bitte eine HTML-Datei hochladen (.html).');
    return;
  }
  if(file.size > MAX_RESOURCE_BYTES){
    toast('Datei ist zu gross (max. '+Math.round(MAX_RESOURCE_BYTES/1024/1024)+' MB).');
    return;
  }
  var suggested = file.name.replace(/\.html?$/i,'').replace(/[_-]+/g,' ');
  var where_ = folderId ? ('Ordner «'+(folderById(folderId) ? folderById(folderId).name : '')+'»') : 'Fach-Hauptebene';
  uiPrompt('Titel für diese Übung', 'Die Datei wird in der '+where_+' abgelegt.', suggested, 'Hochladen', function(title){
    doUpload(subjectId, folderId, file, title);
  });
}

async function doUpload(subjectId, folderId, file, title){
  var progEl = document.getElementById('uploadProgress');
  if(!progEl) return;
  progEl.textContent = 'Lade «'+file.name+'» hoch …';
  progEl.classList.add('show');
  try{
    var htmlText = await readFileAsText(file);
    if(new Blob([htmlText]).size > MAX_RESOURCE_BYTES){
      toast('Datei ist zu gross (max. '+Math.round(MAX_RESOURCE_BYTES/1024/1024)+' MB).');
      return;
    }
    var chunks = chunkStringByBytes(htmlText, MAX_CHUNK_BYTES);
    var resId = subjectId+'_'+Date.now();
    var batch = writeBatch(db);
    batch.set(doc(db,'resources', resId), {
      subject: subjectId,
      folderId: folderId || null,
      title: title,
      fileName: file.name,
      uploadedAt: serverTimestamp(),
      uploadedBy: state.user.uid
    });
    batch.set(doc(db,'resourceContent', resId), { chunkCount: chunks.length });
    chunks.forEach(function(chunk, i){
      batch.set(doc(db,'resourceContent', resId, 'chunks', String(i)), { html: chunk });
    });
    await batch.commit();
    toast('«'+title+'» wurde veröffentlicht.');
  }catch(err){
    console.error(err);
    toast('Hochladen fehlgeschlagen: '+(err && err.message ? err.message : 'unbekannter Fehler'));
  }finally{
    progEl.classList.remove('show');
  }
}

/* ===================== ÜBUNGSSTAND GERÄTEÜBERGREIFEND SYNCHRONISIEREN =====

   Problem: die Übungsseiten speichern ihren Detailstand (beantwortete Fragen,
   Karteikarten, Diktat-Eingaben) in `localStorage` — also pro Gerät/Browser.
   Wer am Laptop übt und am Handy weitermacht, fing bisher wieder bei null an,
   und der leere Handy-Stand überschrieb sogar die angezeigten Prozentzahlen.

   Lösung ohne Änderung an den Übungsseiten selbst: die Seiten laufen in einem
   `srcdoc`-iframe und teilen deshalb denselben Origin — und damit denselben
   `localStorage` — mit der Library-Shell. Die Shell kann den Stand also direkt
   lesen und schreiben:

     - Beim Öffnen einer Übung wird der in Firestore gesicherte Stand geladen
       und (falls neuer als der lokale) in `localStorage` geschrieben, BEVOR
       das iframe geladen wird.
     - Während die Übung offen ist, wird `localStorage` beobachtet; alles, was
       sich ändert, gehört zu dieser Übung und wird gebündelt nach Firestore
       geschrieben (`progress/{uid}/resources/{rid}`, Feld `storeJson`).

   Konfliktregel (bewusst so gewählt): NEUESTER STAND GEWINNT, ohne Nachfrage.
   Dafür trägt jeder Stand eine Revisionsnummer (`storeRev`, aus `Date.now()`),
   die lokal unter `hl_rev_<rid>` mitgeführt wird. Nur wenn die Revision in
   Firestore grösser ist als die lokale, wird der entfernte Stand angewendet.

   Warum `storeJson` (String) statt einer Firestore-Map: `setDoc(..., {merge:true})`
   führt Maps FELDWEISE zusammen — ein gelöschter Schlüssel (z.B. nach „Alles
   zurücksetzen") bliebe dann für immer stehen. Ein String wird komplett ersetzt.
============================================================================ */

var LIB_PREFIX = 'hl_';        // eigene Schlüssel der Shell — werden nie synchronisiert
var SYNC_MAX_BYTES = 600000;   // Sicherheitsabstand zum 1-MiB-Limit eines Firestore-Dokuments
var SYNC_POLL_MS = 1500;
var SYNC_DEBOUNCE_MS = 800;

var syncState = {
  resourceId: null,   // Übung, die gerade offen ist
  tracked: {},        // Schlüssel, die zu dieser Übung gehören (Objekt als Set)
  baseline: {},       // localStorage-Stand beim Öffnen — Vergleichsbasis
  lastWritten: null,  // zuletzt geschriebenes JSON (spart unnötige Schreibvorgänge)
  pollTimer: null,
  writeTimer: null
};

function lsGet(k){ try{ return localStorage.getItem(k); }catch(e){ return null; } }
function lsSet(k,v){ try{ localStorage.setItem(k,v); }catch(e){} }
function lsDel(k){ try{ localStorage.removeItem(k); }catch(e){} }

// Alle Schlüssel ausser den eigenen der Shell.
function lsSnapshot(){
  var out = {};
  try{
    for(var i=0;i<localStorage.length;i++){
      var k = localStorage.key(i);
      if(k && k.indexOf(LIB_PREFIX) !== 0) out[k] = localStorage.getItem(k);
    }
  }catch(e){}
  return out;
}

function localRev(rid){ return parseInt(lsGet(LIB_PREFIX+'rev_'+rid) || '0', 10) || 0; }
function setLocalRev(rid, rev){ lsSet(LIB_PREFIX+'rev_'+rid, String(rev)); }

// Welche Schlüssel gehören zu dieser Übung? Lokal gemerkt, damit die Zuordnung
// einen Reload überlebt; beim Öffnen mit der Liste aus Firestore vereinigt.
function loadTrackedKeys(rid){
  var out = {};
  try{
    var raw = lsGet(LIB_PREFIX+'keys_'+rid);
    if(raw) JSON.parse(raw).forEach(function(k){ out[k] = true; });
  }catch(e){}
  return out;
}
function saveTrackedKeys(rid, tracked){
  try{ lsSet(LIB_PREFIX+'keys_'+rid, JSON.stringify(Object.keys(tracked))); }catch(e){}
}

// Entfernten Stand anwenden: gesetzte Schlüssel schreiben, fehlende entfernen
// (so wandert auch ein „Alles zurücksetzen" auf das andere Gerät).
function applyRemoteStore(keys, store){
  keys.forEach(function(k){
    if(k.indexOf(LIB_PREFIX) === 0) return;
    if(Object.prototype.hasOwnProperty.call(store, k)) lsSet(k, store[k]);
    else lsDel(k);
  });
}

// Vor dem Laden des iframes aufrufen. Läuft nie in einen Fehler, der das
// Öffnen der Übung verhindern würde — im Zweifel wird ohne Sync geöffnet.
async function prepareResourceSync(rid){
  stopResourceSync();          // evtl. vorherige Übung sauber abschliessen
  syncState.resourceId = rid;
  syncState.tracked = loadTrackedKeys(rid);
  syncState.lastWritten = null;
  if(!state.user){ syncState.baseline = lsSnapshot(); return; }
  try{
    var snap = await getDoc(doc(db,'progress', state.user.uid, 'resources', rid));
    var data = snap.exists() ? snap.data() : null;
    var remoteRev = (data && typeof data.storeRev === 'number') ? data.storeRev : 0;
    var keys = (data && Array.isArray(data.storeKeys)) ? data.storeKeys : [];
    keys.forEach(function(k){ syncState.tracked[k] = true; });
    if(data && data.storeJson && remoteRev > localRev(rid)){
      var store = {};
      try{ store = JSON.parse(data.storeJson) || {}; }catch(e){ store = {}; }
      applyRemoteStore(keys, store);
      setLocalRev(rid, remoteRev);
      saveTrackedKeys(rid, syncState.tracked);
    }
  }catch(err){
    console.error('Stand konnte nicht geladen werden', err);
  }
  syncState.baseline = lsSnapshot();
  syncState.pollTimer = setInterval(function(){ checkLocalChanges(rid); }, SYNC_POLL_MS);
}

// Jeder Schlüssel, der sich seit dem Öffnen geändert hat oder neu ist, gehört
// zu dieser Übung. Einmal erfasste Schlüssel bleiben erfasst (auch wenn ihr
// Wert später wieder dem Ausgangswert entspricht oder sie gelöscht werden).
function checkLocalChanges(rid){
  if(syncState.resourceId !== rid) return;
  var now = lsSnapshot(), changed = false;
  Object.keys(now).forEach(function(k){
    if(now[k] !== syncState.baseline[k] && !syncState.tracked[k]){ syncState.tracked[k] = true; changed = true; }
  });
  Object.keys(syncState.baseline).forEach(function(k){
    if(!(k in now) && !syncState.tracked[k]){ syncState.tracked[k] = true; changed = true; }
  });
  var payload = buildStorePayload();
  if(changed || payload.json !== syncState.lastWritten) scheduleStoreWrite(rid);
}

function buildStorePayload(){
  var keys = Object.keys(syncState.tracked).sort(), store = {};
  keys.forEach(function(k){ var v = lsGet(k); if(v !== null) store[k] = v; });
  return { keys: keys, json: JSON.stringify(store) };
}

function scheduleStoreWrite(rid){
  clearTimeout(syncState.writeTimer);
  syncState.writeTimer = setTimeout(function(){ writeStore(rid); }, SYNC_DEBOUNCE_MS);
}

/* ===================== LERNSTAND-HISTORIE (überlebt "Zurücksetzen") =====

   Wunsch von Jan: auch wenn ein Kind seinen Übungsstand zurücksetzt, soll
   sichtbar bleiben, OB und WIE VIEL vorher gelernt wurde - für alle
   Übungen, nicht nur Diktate. Die Übungsseiten selbst sollen dafür NICHT
   angepasst werden müssen (unterschiedliche Formate: die Quiz-Lernpakete
   melden stats/total per postMessage, die Diktate ihren Stand über den
   generischen localStorage-Sync/storeJson - siehe oben).

   Lösung: an der einzigen Stelle, an der progress/{uid}/resources/{rid}
   tatsächlich geschrieben wird (writeProgressWithHistory, von beiden
   Schreibpfaden benutzt), wird VOR jedem Schreiben zuerst der bisherige
   Stand gelesen und in einen normalisierten "Lernstand" umgerechnet
   (learnedSummary). Fällt dieser Wert von "etwas" auf "nichts" (= ein
   Reset-Knopf wurde gedrückt), wird der alte Stand zuerst in ein
   history-Array gehängt, bevor die neuen (leeren) Werte geschrieben
   werden. Nur ab jetzt - bereits vor diesem Update erfolgte Resets sind
   nicht mehr rekonstruierbar. */

var PROGRESS_HISTORY_MAX = 50;

// Rechnet die auf progress/{uid}/resources/{rid} gespeicherten Rohdaten in
// einen einzigen, vergleichbaren "Lernstand" um - unabhängig davon, ob die
// Übung über stats/total (Quiz-Lernpakete) oder storeJson (Diktate, über
// den generischen Sync) meldet. null = noch kein auswertbarer Lernstand.
function learnedSummary(data){
  if(!data) return null;
  if(data.stats && typeof data.total === 'number'){
    var attempted=0, correct=0;
    Object.keys(data.stats).forEach(function(k){
      if(data.stats[k] && data.stats[k].status){ attempted++; if(data.stats[k].status==='correct') correct++; }
    });
    if(attempted>0){
      return { kind:'quiz', attempted:attempted, correct:correct, total:data.total,
        pct: data.total ? Math.round(correct/data.total*100) : null };
    }
  }
  if(data.storeJson){
    try{
      var store = JSON.parse(data.storeJson);
      var attemptsKey = Object.keys(store).filter(function(k){ return /_attempts$/.test(k); })[0];
      if(attemptsKey){
        var attempts = JSON.parse(store[attemptsKey]);
        if(Array.isArray(attempts) && attempts.length){
          var last = attempts[attempts.length-1];
          return { kind:'diktat', attemptCount:attempts.length, pct:last.pct, correct:last.correct, total:last.total, lastDate:last.date };
        }
      }
    }catch(e){}
  }
  return null;
}
function summaryAmount(s){
  if(!s) return 0;
  return s.kind==='quiz' ? s.attempted : s.attemptCount;
}

// Einziger Schreibweg nach progress/{uid}/resources/{rid}. Liest zuerst den
// aktuellen Stand, erkennt einen Reset (Lernstand fällt auf 0) und sichert
// ihn dann als history-Eintrag, bevor die neuen Felder geschrieben werden.
async function writeProgressWithHistory(uid, rid, newFields){
  var ref_ = doc(db, 'progress', uid, 'resources', rid);
  var before = null;
  try{
    var snap = await getDoc(ref_);
    before = snap.exists() ? snap.data() : null;
  }catch(e){
    console.error('Lernstand konnte vor dem Schreiben nicht gelesen werden', e);
  }

  var merged = Object.assign({}, before||{}, newFields);
  var oldSummary = learnedSummary(before);
  var newSummary = learnedSummary(merged);
  var payload = Object.assign({}, newFields);

  if(oldSummary && summaryAmount(oldSummary) > 0 && summaryAmount(newSummary) === 0){
    var history = (before && Array.isArray(before.history)) ? before.history.slice() : [];
    history.push({ archivedAt: new Date().toISOString(), summary: oldSummary });
    if(history.length > PROGRESS_HISTORY_MAX) history = history.slice(history.length - PROGRESS_HISTORY_MAX);
    payload.history = history;
  }

  return setDoc(ref_, payload, {merge:true});
}

function writeStore(rid){
  if(!state.user || syncState.resourceId !== rid) return;
  var payload = buildStorePayload();
  if(!payload.keys.length || payload.json === syncState.lastWritten) return;
  if(payload.json.length > SYNC_MAX_BYTES){
    console.warn('Übungsstand zu gross für die Synchronisierung ('+payload.json.length+' Zeichen) — bleibt nur auf diesem Gerät.');
    return;
  }
  // Revision optimistisch hochzählen: so gewinnt auch dann das zuletzt
  // benutzte Gerät, wenn der Schreibvorgang gerade offline scheitert.
  var rev = Math.max(Date.now(), localRev(rid) + 1);
  setLocalRev(rid, rev);
  saveTrackedKeys(rid, syncState.tracked);
  syncState.lastWritten = payload.json;
  writeProgressWithHistory(state.user.uid, rid, {
    storeJson: payload.json,
    storeKeys: payload.keys,
    storeRev: rev,
    storeAt: serverTimestamp()
  }).catch(function(err){
    console.error('Stand konnte nicht gespeichert werden', err);
    syncState.lastWritten = null;   // beim nächsten Versuch erneut schreiben
  });
}

// Beim Verlassen der Übung (oder der Seite) noch einmal alles sichern.
function flushResourceSync(){
  var rid = syncState.resourceId;
  if(!rid) return;
  clearTimeout(syncState.writeTimer);
  checkLocalChanges(rid);
  writeStore(rid);
}

function stopResourceSync(){
  flushResourceSync();
  clearInterval(syncState.pollTimer);
  clearTimeout(syncState.writeTimer);
  syncState.pollTimer = null;
  syncState.writeTimer = null;
  syncState.resourceId = null;
  syncState.tracked = {};
  syncState.baseline = {};
  syncState.lastWritten = null;
}

window.addEventListener('pagehide', flushResourceSync);
document.addEventListener('visibilitychange', function(){
  if(document.visibilityState === 'hidden') flushResourceSync();
});

/* ===================== LERNZEIT (Stunden pro Schüler:in und Übung) =====================
   Wunsch von Jan: in der Lernstand-Übersicht sehen, wie lange ein Kind an einer
   Übung schon gearbeitet hat. Wie beim Stand-Sync oben: keine Änderung an den
   Übungsseiten nötig — die Shell misst einfach, wie lange das iframe einer
   Übung sichtbar und aktiv offen ist (Hintergrund-Tab zählt nicht mit), und
   schreibt das kumulativ in Sekunden auf progress/{uid}/resources/{rid}.timeSpentSec.
   increment() statt eines gelesenen+addierten Werts, damit gleichzeitige
   Schreibvorgänge von mehreren Geräten sich addieren statt sich gegenseitig
   zu überschreiben. */

var timeTrack = { resourceId:null, startedAt:null, flushTimer:null };
var TIME_FLUSH_MS = 60000;      // bei langen Sitzungen zwischendurch sichern, nicht erst beim Verlassen
var TIME_MIN_FLUSH_SEC = 3;     // Mini-Blips (versehentlich geöffnet, sofort wieder zu) nicht mitzählen

function startTimeTracking(rid){
  stopTimeTracking();
  timeTrack.resourceId = rid;
  if(document.visibilityState !== 'hidden') timeTrack.startedAt = Date.now();
  timeTrack.flushTimer = setInterval(flushTimeTracking, TIME_FLUSH_MS);
}

function flushTimeTracking(){
  if(!timeTrack.resourceId || !timeTrack.startedAt || !state.user) return;
  var elapsedSec = Math.round((Date.now() - timeTrack.startedAt) / 1000);
  timeTrack.startedAt = Date.now();
  if(elapsedSec < TIME_MIN_FLUSH_SEC) return;
  setDoc(doc(db,'progress', state.user.uid, 'resources', timeTrack.resourceId),
    { timeSpentSec: increment(elapsedSec) }, {merge:true}
  ).catch(function(err){ console.error('Lernzeit konnte nicht gespeichert werden', err); });
  bumpStreak(elapsedSec);   // dieselbe gemessene Zeit zählt auch für die Lern-Serie
}

function stopTimeTracking(){
  flushTimeTracking();
  clearInterval(timeTrack.flushTimer);
  timeTrack.flushTimer = null;
  timeTrack.resourceId = null;
  timeTrack.startedAt = null;
}

document.addEventListener('visibilitychange', function(){
  if(!timeTrack.resourceId) return;
  if(document.visibilityState === 'hidden'){
    flushTimeTracking();
    timeTrack.startedAt = null;
  } else if(document.visibilityState === 'visible'){
    timeTrack.startedAt = Date.now();
  }
});
window.addEventListener('pagehide', flushTimeTracking);

/* ===================== RENDER: RESOURCE VIEWER ===================== */

var currentViewerResourceId = null;
var progressWriteTimers = {};

function renderResource(r){
  clearOverviewWatchers();
  clearSubjectWatchers();
  unwatchAllProgress();
  currentViewerResourceId = r.id;
  startTimeTracking(r.id);
  var s = subjectById(r.subject);

  var html = '<div class="viewer-wrap">';
  html += '<div class="back-row"><button class="btn btn-ghost btn-sm" id="backBtn">&larr; '+esc(s ? s.name : 'Fach')+'</button></div>';
  html += '<div class="viewer-head"><h2>'+esc(r.title || r.fileName)+'</h2><span class="viewer-progress" id="viewerProgress"></span>';
  if(state.profile.role === 'teacher'){ html += '<button class="btn btn-ghost btn-sm" id="liveBtn" type="button" title="Live sehen, wo die Klasse steht">📡 Live</button>'; }
  html += '<button class="btn btn-ghost btn-sm btn-fs" id="fsBtn" type="button"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M8 3H5a2 2 0 0 0-2 2v3M16 3h3a2 2 0 0 1 2 2v3M8 21H5a2 2 0 0 1-2-2v-3M16 21h3a2 2 0 0 0 2-2v-3"/></svg> Vollbild</button>';
  html += '</div>';
  html += '<div class="viewer-frame-wrap" id="frameWrap">';
  html += '<button class="btn-fs-overlay-exit" id="fsExitBtn" type="button" title="Vollbild verlassen" aria-label="Vollbild verlassen"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 3v3a2 2 0 0 1-2 2H4M15 3v3a2 2 0 0 0 2 2h3M9 21v-3a2 2 0 0 0-2-2H4M15 21v-3a2 2 0 0 1 2-2h3"/></svg></button>';
  html += '<iframe id="resourceFrame" title="'+esc(r.title||r.fileName)+'" allow="clipboard-read; clipboard-write"></iframe>';
  html += '</div>';
  html += '</div>';

  renderChrome(html);
  document.getElementById('backBtn').addEventListener('click', function(){ goSubject(r.subject, r.folderId || null); });
  wireFullscreen();
  var liveBtn = document.getElementById('liveBtn');
  if(liveBtn){ liveBtn.addEventListener('click', function(){ openLiveKlasse(r); }); }

  watchProgress(r.id, function(p){ updateViewerProgress(p); });

  var contentPromise = getDoc(doc(db,'resourceContent', r.id)).then(function(snap){
    if(!snap.exists()){ throw new Error('no content'); }
    var chunkCount = snap.data().chunkCount || 0;
    var chunkIndexes = [];
    for(var i=0;i<chunkCount;i++){ chunkIndexes.push(i); }
    return Promise.all(chunkIndexes.map(function(i){
      return getDoc(doc(db,'resourceContent', r.id, 'chunks', String(i)));
    }));
  });

  // Der gesicherte Übungsstand muss in localStorage stehen, BEVOR das iframe
  // lädt — die Übungsseite liest ihn direkt beim Start. Beides läuft parallel,
  // damit das Öffnen nicht langsamer wird.
  Promise.all([contentPromise, prepareResourceSync(r.id)]).then(function(res){
    var chunkSnaps = res[0];
    var html = chunkSnaps.map(function(s){ return (s.exists() && s.data().html) || ''; }).join('');
    document.getElementById('resourceFrame').srcdoc = html;
  }).catch(function(err){
    console.error(err);
    var wrap = document.querySelector('.viewer-frame-wrap');
    if(wrap) wrap.innerHTML = '<div class="empty-state">Diese Übung konnte nicht geladen werden.</div>';
  });
}

var FS_ICON_ENTER = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M8 3H5a2 2 0 0 0-2 2v3M16 3h3a2 2 0 0 1 2 2v3M8 21H5a2 2 0 0 1-2-2v-3M16 21h3a2 2 0 0 0 2-2v-3"/></svg> Vollbild';
var FS_ICON_EXIT = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 3v3a2 2 0 0 1-2 2H4M15 3v3a2 2 0 0 0 2 2h3M9 21v-3a2 2 0 0 0-2-2H4M15 21v-3a2 2 0 0 1 2-2h3"/></svg> Vollbild verlassen';
var fullscreenListenerAttached = false;

// Fullscreens the viewer's frame wrapper (not the iframe itself) so it works
// consistently across browsers. Looks elements up by id on every call/event
// rather than closing over them, so this is safe to call again on every
// resource-viewer render without leaking stale references or duplicate
// document-level listeners.
function isPseudoFsActive(){
  var wrap = document.getElementById('frameWrap');
  return !!(wrap && wrap.classList.contains('pseudo-fullscreen'));
}

function enterPseudoFullscreen(){
  var wrap = document.getElementById('frameWrap');
  if(!wrap) return;
  wrap.classList.add('pseudo-fullscreen');
  document.body.classList.add('pseudo-fs-active');
  updateFsButtonLabel();
}

function exitPseudoFullscreen(){
  var wrap = document.getElementById('frameWrap');
  if(!wrap) return;
  wrap.classList.remove('pseudo-fullscreen');
  document.body.classList.remove('pseudo-fs-active');
  updateFsButtonLabel();
}

function updateFsButtonLabel(){
  var wrap = document.getElementById('frameWrap');
  var btn = document.getElementById('fsBtn');
  if(!wrap || !btn) return;
  var isFs = (document.fullscreenElement || document.webkitFullscreenElement) === wrap || isPseudoFsActive();
  btn.innerHTML = isFs ? FS_ICON_EXIT : FS_ICON_ENTER;
}

function exitFullscreenNow(){
  if(isPseudoFsActive()){ exitPseudoFullscreen(); return; }
  if(document.fullscreenElement || document.webkitFullscreenElement){
    var action = (document.exitFullscreen || document.webkitExitFullscreen).call(document);
    if(action && action.catch){ action.catch(function(){}); }
  }
}

function wireFullscreen(){
  var wrap = document.getElementById('frameWrap');
  var btn = document.getElementById('fsBtn');
  var exitBtn = document.getElementById('fsExitBtn');
  if(!wrap || !btn) return;
  // Safari on iOS (incl. installed Home-Screen apps) has no Fullscreen API for
  // arbitrary elements at all — requestFullscreen/webkitRequestFullscreen are
  // simply undefined there. Rather than hiding the buttons (old behaviour),
  // fall back to the CSS-only pseudo-fullscreen so the app version gets the
  // same enter/exit button pair as desktop.
  var nativeSupported = !!(wrap.requestFullscreen || wrap.webkitRequestFullscreen);
  btn.addEventListener('click', function(){
    var w = document.getElementById('frameWrap');
    if(!w) return;
    if(!nativeSupported){
      if(isPseudoFsActive()){ exitPseudoFullscreen(); } else { enterPseudoFullscreen(); }
      return;
    }
    var isFs = (document.fullscreenElement || document.webkitFullscreenElement) === w;
    if(isFs){ exitFullscreenNow(); return; }
    var action = (w.requestFullscreen || w.webkitRequestFullscreen).call(w);
    if(action && action.catch){
      action.catch(function(){
        // Native request refused at runtime (rare) — fall back to the CSS
        // version instead of leaving the user with a dead button.
        enterPseudoFullscreen();
      });
    }
  });
  // #fsBtn sits in .viewer-head, OUTSIDE #frameWrap — once #frameWrap is the
  // fullscreen element (native or pseudo), #fsBtn is no longer on screen at all
  // (only the fullscreen element and its descendants render), so it can't be
  // clicked to get back out. #fsExitBtn lives inside #frameWrap instead (see
  // CSS: shown while :fullscreen or .pseudo-fullscreen) so there's always a
  // visible, clickable way out besides Esc (and Esc doesn't even apply to the
  // CSS fallback, since that isn't the real Fullscreen API).
  if(exitBtn){ exitBtn.addEventListener('click', exitFullscreenNow); }
  updateFsButtonLabel();
  if(!fullscreenListenerAttached){
    document.addEventListener('fullscreenchange', updateFsButtonLabel);
    document.addEventListener('webkitfullscreenchange', updateFsButtonLabel);
    document.addEventListener('keydown', function(e){
      if(e.key === 'Escape' && isPseudoFsActive()){ exitPseudoFullscreen(); }
    });
    fullscreenListenerAttached = true;
  }
}

function updateViewerProgress(p){
  var el = document.getElementById('viewerProgress');
  if(!el) return;
  if(!p || p.attempted===0){ el.textContent = 'Noch nicht geübt'; return; }
  var parts = [];
  if(p.total){ parts.push(p.attempted+' / '+p.total+' geübt'); } else { parts.push(p.attempted+' bearbeitet'); }
  if(p.correctPct!==null){ parts.push(p.correctPct+'% richtig'); }
  el.textContent = parts.join(' · ');
}

window.addEventListener('message', function(e){
  var data = e.data;
  if(!data || !data.__libProgress || !currentViewerResourceId || !state.user) return;
  var resourceId = currentViewerResourceId;
  // Eine Fortschrittsmeldung heisst: in der Übung ist gerade etwas passiert —
  // guter Moment, auch den localStorage-Stand einzusammeln.
  checkLocalChanges(resourceId);
  clearTimeout(progressWriteTimers[resourceId]);
  progressWriteTimers[resourceId] = setTimeout(function(){
    writeProgressWithHistory(state.user.uid, resourceId, {
      stats: data.stats || {},
      total: typeof data.total === 'number' ? data.total : null,
      updatedAt: serverTimestamp()
    }).catch(function(err){ console.error('progress write failed', err); });
  }, 500);
});


/* =====================================================================
   KLASSENZIMMER-WERKZEUGE
   =====================================================================
   Alles, was unten folgt, hängt am Lehrerbereich bzw. an der Startseite:
   Beamer-Werkzeuge (Ruhephase, Wer ist dran), Live-Klassenraum,
   Sitzplan, anonyme Fragebox, Lern-Streak und Klassen-Quiz.

   Gemeinsame Regeln in diesem Block:
   - Overlays hängen an document.body, NICHT in #app — render() baut #app
     komplett neu auf und würde sie sonst mitten im Betrieb wegräumen.
   - Das Overlay selbst geht in den nativen Vollbildmodus; alle Knöpfe sind
     darum Nachfahren davon (Geschwister werden im Vollbild nicht gerendert).
     Ohne Fullscreen-API (iOS-Safari im Homescreen-Modus) ist das
     position:fixed;inset:0 des Overlays bereits das Pseudo-Vollbild.
   - Keine nativen Dialoge (confirm/alert/prompt) — nur openModal & Co.
   - Firestore-Queries mit höchstens einem where() und ohne orderBy(),
     sortiert wird client-seitig (keine Composite Indexes).
   ===================================================================== */

var overlayStack = [];

// Legt ein Vollbild-Overlay an. onClose wird beim Schliessen aufgerufen, damit
// laufende Timer/Mikrofon-Streams/Listener sauber abgeräumt werden können.
function openOverlay(innerHtml, onClose, extraClass){
  var el = document.createElement('div');
  el.className = 'kz-overlay' + (extraClass ? ' ' + extraClass : '');
  el.innerHTML = innerHtml;
  document.body.appendChild(el);
  var entry = { el: el, onClose: onClose || null };
  overlayStack.push(entry);
  // Dialoge und Toasts mit ins Overlay nehmen. Im nativen Vollbild wird NUR
  // das Vollbild-Element samt Nachfahren gerendert — als Geschwister von
  // #app blieben Dialog und Toast unsichtbar (genau der Fehler, der die
  // Übungsseiten schon einmal weiss gerendert hat).
  adoptOverlayChrome(el);
  try{ if(el.requestFullscreen) el.requestFullscreen().catch(function(){}); }catch(e){}
  document.addEventListener('keydown', overlayEscHandler);
  return {
    el: el,
    close: function(){ closeOverlay(entry); }
  };
}

function closeOverlay(entry){
  var i = overlayStack.indexOf(entry);
  if(i < 0) return;
  overlayStack.splice(i, 1);
  try{ if(entry.onClose) entry.onClose(); }catch(e){ console.error(e); }
  adoptOverlayChrome(overlayStack.length ? overlayStack[overlayStack.length-1].el : document.body);
  if(entry.el && entry.el.parentNode) entry.el.parentNode.removeChild(entry.el);
  if(!overlayStack.length){
    document.removeEventListener('keydown', overlayEscHandler);
    try{ if(document.fullscreenElement) document.exitFullscreen(); }catch(e){}
  }
}

// Hängt Dialog-Overlay und Toast unter das angegebene Element. Beide sind
// position:fixed, die Darstellung ändert sich dadurch nicht — nur, ob sie im
// nativen Vollbild überhaupt gezeichnet werden.
function adoptOverlayChrome(target){
  if(!target) target = document.body;
  if(modalEl && modalEl.parentNode !== target) target.appendChild(modalEl);
  if(toastEl && toastEl.parentNode !== target) target.appendChild(toastEl);
}

function overlayEscHandler(e){
  if(e.key !== 'Escape' || !overlayStack.length) return;
  // Läuft ein Dialog über dem Overlay, schliesst Escape zuerst den Dialog.
  if(modalEl.classList.contains('show')) return;
  closeOverlay(overlayStack[overlayStack.length-1]);
}

/* ---------- Töne ohne Audiodatei (WebAudio) ---------- */
// Gong/Piepser werden synthetisiert statt als Datei ausgeliefert: kein
// zusätzlicher Download, funktioniert auch offline.
var audioCtx = null;
function ensureAudio(){
  try{
    if(!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    if(audioCtx.state === 'suspended') audioCtx.resume();
    return audioCtx;
  }catch(e){ return null; }
}
function playTone(freq, seconds, type, gainPeak){
  var ctx = ensureAudio();
  if(!ctx) return;
  var osc = ctx.createOscillator(), gain = ctx.createGain();
  osc.type = type || 'sine';
  osc.frequency.value = freq;
  gain.gain.setValueAtTime(0.0001, ctx.currentTime);
  gain.gain.exponentialRampToValueAtTime(gainPeak || 0.25, ctx.currentTime + 0.02);
  gain.gain.exponentialRampToValueAtTime(0.0001, ctx.currentTime + seconds);
  osc.connect(gain); gain.connect(ctx.destination);
  osc.start(); osc.stop(ctx.currentTime + seconds + 0.05);
}
function playGong(){
  playTone(523.25, 1.6, 'sine', 0.3);
  setTimeout(function(){ playTone(392.00, 2.0, 'sine', 0.25); }, 90);
  setTimeout(function(){ playTone(261.63, 2.6, 'sine', 0.22); }, 180);
}
function playBlip(){ playTone(880, 0.12, 'triangle', 0.18); }

/* ===================== BEAMER-WERKZEUGE (Ruhephase · Wer ist dran) =====================
   Zwei Werkzeuge in einem Vollbild-Overlay. "Ruhephase" fasst Countdown,
   Lärmampel und die Liste der Kinder, die gerade sprechen dürfen, in EIN Bild
   zusammen — genau das steht im Unterricht gleichzeitig am Beamer. */

var beamer = { tab:'ruhe', overlay:null, cleanups:[] };

function openBeamerTools(initialTab){
  if(beamer.overlay) return;
  beamer.tab = initialTab || 'ruhe';
  var html = '';
  html += '<div class="kz-bar">';
  html += '<button class="kz-tab" data-tab="ruhe" type="button">⏱ Ruhephase</button>';
  html += '<button class="kz-tab" data-tab="dran" type="button">🎲 Wer ist dran?</button>';
  html += '<div class="kz-bar-spacer"></div>';
  html += '<button class="kz-close" id="kzClose" type="button" title="Schliessen (Esc)">✕</button>';
  html += '</div>';
  html += '<div class="kz-stage" id="kzStage"></div>';

  beamer.overlay = openOverlay(html, function(){
    runBeamerCleanups();
    beamer.overlay = null;
  }, 'kz-overlay-beamer');

  var root = beamer.overlay.el;
  root.querySelector('#kzClose').addEventListener('click', function(){ beamer.overlay.close(); });
  Array.prototype.forEach.call(root.querySelectorAll('.kz-tab'), function(btn){
    btn.addEventListener('click', function(){ switchBeamerTab(btn.getAttribute('data-tab')); });
  });
  switchBeamerTab(beamer.tab);
}

function runBeamerCleanups(){
  beamer.cleanups.forEach(function(fn){ try{ fn(); }catch(e){} });
  beamer.cleanups = [];
}

function switchBeamerTab(tab){
  if(!beamer.overlay) return;
  // Beim Wechsel alles abräumen, was das vorherige Werkzeug laufen liess
  // (Intervalle, Mikrofon-Stream) — sonst läuft die Lärmampel im Hintergrund
  // weiter und hält das Mikrofon offen.
  runBeamerCleanups();
  beamer.tab = tab;
  var root = beamer.overlay.el;
  Array.prototype.forEach.call(root.querySelectorAll('.kz-tab'), function(b){
    b.classList.toggle('kz-tab-on', b.getAttribute('data-tab') === tab);
  });
  var stage = root.querySelector('#kzStage');
  if(tab === 'dran'){ mountWerIstDran(stage); return; }

  stage.innerHTML = '<div class="rp-grid">'
    + '<div class="rp-col rp-col-timer" id="rpTimer"></div>'
    + '<div class="rp-col rp-col-ampel" id="rpAmpel"></div>'
    + '<div class="rp-col rp-col-speak" id="rpSpeak"></div>'
    + '</div>';
  mountTimer(stage.querySelector('#rpTimer'));
  mountAmpel(stage.querySelector('#rpAmpel'));
  mountSprecher(stage.querySelector('#rpSpeak'));
}

/* ---------- ⏱ Timer ---------- */

var TIMER_PRESETS = [1, 2, 3, 5, 10, 15, 20];

function fmtClock(sec){
  if(sec < 0) sec = 0;
  var m = Math.floor(sec/60), s = sec%60;
  return m + ':' + pad2(s);
}

function mountTimer(host){
  var t = { total: 5*60, left: 5*60, running:false, tick:null, done:false };
  var saved = parseInt(lsGet(LIB_PREFIX+'timer_min') || '5', 10);
  if(saved > 0 && saved <= 180){ t.total = saved*60; t.left = t.total; }

  var html = '';
  html += '<div class="tm-wrap">';
  html += '<div class="tm-ring-wrap"><svg class="tm-ring" viewBox="0 0 200 200" aria-hidden="true">';
  html += '<circle class="tm-ring-bg" cx="100" cy="100" r="90"></circle>';
  html += '<circle class="tm-ring-fg" id="tmRing" cx="100" cy="100" r="90"></circle>';
  html += '</svg><div class="tm-clock" id="tmClock">'+fmtClock(t.left)+'</div></div>';
  html += '<div class="tm-presets">';
  TIMER_PRESETS.forEach(function(m){ html += '<button class="btn btn-ghost tm-preset" data-min="'+m+'" type="button">'+m+'</button>'; });
  html += '<button class="btn btn-ghost tm-preset" id="tmCustom" type="button">…</button>';
  html += '</div>';
  html += '<div class="tm-actions">';
  html += '<button class="btn btn-primary tm-big" id="tmStart" type="button">▶︎ Start</button>';
  html += '<button class="btn btn-ghost tm-big" id="tmPlus" type="button">+1 min</button>';
  html += '<button class="btn btn-ghost tm-big" id="tmReset" type="button">↺</button>';
  html += '</div>';
  html += '</div>';
  host.innerHTML = html;

  var ringEl = host.querySelector('#tmRing');
  var clockEl = host.querySelector('#tmClock');
  var startBtn = host.querySelector('#tmStart');
  var CIRC = 2 * Math.PI * 90;
  ringEl.style.strokeDasharray = CIRC + ' ' + CIRC;

  function paint(){
    clockEl.textContent = fmtClock(t.left);
    var frac = t.total ? (t.left / t.total) : 0;
    ringEl.style.strokeDashoffset = String(CIRC * (1 - frac));
    host.classList.toggle('tm-warn', !t.done && t.left <= 10 && t.left > 0 && t.running);
    host.classList.toggle('tm-done', t.done);
    startBtn.textContent = t.running ? '❚❚ Pause' : '▶︎ Start';
  }
  function stop(){ clearInterval(t.tick); t.tick = null; t.running = false; }
  function start(){
    if(t.left <= 0) return;
    t.done = false;
    t.running = true;
    t.tick = setInterval(function(){
      t.left--;
      if(t.left <= 5 && t.left > 0) playBlip();
      if(t.left <= 0){ t.left = 0; stop(); t.done = true; playGong(); }
      paint();
    }, 1000);
    paint();
  }
  function setMinutes(m){
    stop(); t.done = false; t.total = m*60; t.left = t.total;
    lsSet(LIB_PREFIX+'timer_min', String(m));
    paint();
  }

  Array.prototype.forEach.call(host.querySelectorAll('.tm-preset[data-min]'), function(b){
    b.addEventListener('click', function(){ setMinutes(parseInt(b.getAttribute('data-min'),10)); });
  });
  host.querySelector('#tmCustom').addEventListener('click', function(){
    uiPrompt('Eigene Dauer', 'Minuten (1–180)', String(Math.round(t.total/60)), 'Setzen', function(v){
      var m = parseInt(v, 10);
      if(!(m >= 1 && m <= 180)){ toast('Bitte eine Zahl zwischen 1 und 180.'); return; }
      setMinutes(m);
    });
  });
  startBtn.addEventListener('click', function(){ if(t.running) { stop(); paint(); } else start(); });
  host.querySelector('#tmPlus').addEventListener('click', function(){
    t.left += 60; t.total = Math.max(t.total, t.left); t.done = false; paint();
  });
  host.querySelector('#tmReset').addEventListener('click', function(){ stop(); t.left = t.total; t.done = false; paint(); });

  paint();
  beamer.cleanups.push(stop);
}

/* ---------- 🔊 Lärmampel ----------
   Misst nur den Pegel über das Mikrofon (AnalyserNode) — es wird nichts
   aufgezeichnet, gespeichert oder übertragen. Bei verweigerter Freigabe
   erscheint eine Erklärung statt eines Fehlers. */

function mountAmpel(host){
  var thrGreen = parseInt(lsGet(LIB_PREFIX+'ampel_green') || '35', 10);
  var thrRed   = parseInt(lsGet(LIB_PREFIX+'ampel_red')   || '60', 10);
  var html = '';
  html += '<div class="am-wrap">';
  html += '<div class="am-lights" id="amLights">';
  html += '<div class="am-light am-red"><span></span></div>';
  html += '<div class="am-light am-yellow"><span></span></div>';
  html += '<div class="am-light am-green"><span></span></div>';
  html += '</div>';
  html += '<div class="am-level-wrap"><div class="am-level" id="amLevel"></div>'
        + '<div class="am-mark am-mark-g" id="amMarkG"></div><div class="am-mark am-mark-r" id="amMarkR"></div></div>';
  html += '</div>';
  html += '<div class="am-points" id="amPoints">Ruhe-Punkte: 0</div>';
  html += '<div class="am-status" id="amStatus">Mikrofon wird gefragt …</div>';
  html += '<div class="am-sliders">';
  html += '<label>grün/gelb <input type="range" id="amG" min="5" max="90" value="'+thrGreen+'"></label>';
  html += '<label>gelb/rot <input type="range" id="amR" min="10" max="99" value="'+thrRed+'"></label>';
  html += '<button class="btn btn-ghost btn-sm" id="amResetPts" type="button">Punkte zurücksetzen</button>';
  html += '</div>';
  host.innerHTML = html;

  var lightsEl = host.querySelector('#amLights');
  var levelEl  = host.querySelector('#amLevel');
  var statusEl = host.querySelector('#amStatus');
  var pointsEl = host.querySelector('#amPoints');
  var gEl = host.querySelector('#amG'), rEl = host.querySelector('#amR');
  var markG = host.querySelector('#amMarkG'), markR = host.querySelector('#amMarkR');
  var points = 0, stream = null, raf = null, ctx = null, stopped = false;
  var smooth = 0, lastPointAt = Date.now();

  function paintMarks(){
    markG.style.bottom = thrGreen + '%';
    markR.style.bottom = thrRed + '%';
  }
  gEl.addEventListener('input', function(){
    thrGreen = Math.min(parseInt(gEl.value,10), thrRed-5);
    gEl.value = thrGreen; lsSet(LIB_PREFIX+'ampel_green', String(thrGreen)); paintMarks();
  });
  rEl.addEventListener('input', function(){
    thrRed = Math.max(parseInt(rEl.value,10), thrGreen+5);
    rEl.value = thrRed; lsSet(LIB_PREFIX+'ampel_red', String(thrRed)); paintMarks();
  });
  host.querySelector('#amResetPts').addEventListener('click', function(){ points = 0; pointsEl.textContent = 'Ruhe-Punkte: 0'; });
  paintMarks();

  function cleanup(){
    stopped = true;
    if(raf) cancelAnimationFrame(raf);
    if(stream){ stream.getTracks().forEach(function(tr){ try{ tr.stop(); }catch(e){} }); stream = null; }
    if(ctx){ try{ ctx.close(); }catch(e){} ctx = null; }
  }
  beamer.cleanups.push(cleanup);

  if(!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia){
    statusEl.textContent = 'Dieses Gerät stellt kein Mikrofon zur Verfügung.';
    return;
  }
  navigator.mediaDevices.getUserMedia({audio:{echoCancellation:false, noiseSuppression:false, autoGainControl:false}}).then(function(s){
    if(stopped){ s.getTracks().forEach(function(tr){ tr.stop(); }); return; }
    stream = s;
    ctx = new (window.AudioContext || window.webkitAudioContext)();
    var src = ctx.createMediaStreamSource(s);
    var analyser = ctx.createAnalyser();
    analyser.fftSize = 1024;
    src.connect(analyser);
    var buf = new Float32Array(analyser.fftSize);
    statusEl.textContent = 'Läuft — es wird nichts aufgezeichnet.';

    function loop(){
      if(stopped) return;
      analyser.getFloatTimeDomainData(buf);
      var sum = 0;
      for(var i=0;i<buf.length;i++){ sum += buf[i]*buf[i]; }
      var rms = Math.sqrt(sum / buf.length);
      // dBFS grob auf 0–100 abbilden: -60 dB = still, -10 dB = sehr laut.
      var db = 20 * Math.log10(rms || 1e-7);
      var lvl = Math.max(0, Math.min(100, (db + 60) / 50 * 100));
      smooth = smooth * 0.82 + lvl * 0.18;
      var v = Math.round(smooth);
      levelEl.style.height = v + '%';
      var color = v < thrGreen ? 'green' : (v < thrRed ? 'yellow' : 'red');
      lightsEl.setAttribute('data-on', color);
      levelEl.setAttribute('data-on', color);
      if(color === 'green' && Date.now() - lastPointAt > 3000){
        lastPointAt = Date.now();
        points++;
        pointsEl.textContent = 'Ruhe-Punkte: ' + points;
      }
      if(color !== 'green') lastPointAt = Date.now();
      raf = requestAnimationFrame(loop);
    }
    loop();
  }).catch(function(){
    statusEl.textContent = 'Kein Zugriff aufs Mikrofon. In den Browser-Einstellungen für diese Seite erlauben und das Werkzeug neu öffnen.';
  });
}

/* ---------- 🗣 Wer darf sprechen ----------
   Während einer Ruhephase gibt es fast immer ein paar Kinder, die reden
   dürfen (Gruppenauftrag, Helferrolle, Vortragsvorbereitung). Die Liste steht
   gross am Beamer, damit nicht nachgefragt werden muss. Sie liegt lokal auf
   dem Gerät der Lehrperson (hl_-Präfix, wird darum nie in den Übungs-Sync
   gezogen) — es ist eine Momentaufnahme der Lektion, kein Datenbestand. */

var sprecherState = { uids:null, roster:null };

function loadSprecher(){
  if(sprecherState.uids) return sprecherState.uids;
  try{ sprecherState.uids = JSON.parse(lsGet(LIB_PREFIX+'speakers') || '[]') || []; }
  catch(e){ sprecherState.uids = []; }
  return sprecherState.uids;
}
function saveSprecher(){
  lsSet(LIB_PREFIX+'speakers', JSON.stringify(sprecherState.uids || []));
}

function mountSprecher(host){
  loadSprecher();
  function paint(){
    var roster = sprecherState.roster || [];
    var byUid = {};
    roster.forEach(function(s){ byUid[s.uid] = s; });
    var chosen = sprecherState.uids.filter(function(u){ return byUid[u]; });
    var rest = roster.filter(function(s){ return sprecherState.uids.indexOf(s.uid) < 0; });

    var h = '';
    h += '<div class="sk-head">🗣 Dürfen sprechen</div>';
    h += '<div class="sk-chosen">';
    if(!chosen.length){
      h += '<div class="sk-none">'+(roster.length ? 'Niemand — es ist still.' : 'Klassenliste wird geladen …')+'</div>';
    } else {
      h += chosen.map(function(u){
        return '<button class="sk-chip" type="button" data-remove="'+esc(u)+'" title="Entfernen">'+esc(byUid[u].displayName)+'<span>✕</span></button>';
      }).join('');
    }
    h += '</div>';
    if(roster.length){
      h += '<div class="sk-add-label">Hinzufügen</div>';
      h += '<div class="sk-pool">'+rest.map(function(s){
        return '<button class="sk-pool-item" type="button" data-add="'+esc(s.uid)+'">'+esc(s.displayName)+'</button>';
      }).join('')+'</div>';
      if(chosen.length) h += '<button class="btn btn-ghost btn-sm sk-clear" id="skClear" type="button">Alle entfernen</button>';
    }
    host.innerHTML = h;

    Array.prototype.forEach.call(host.querySelectorAll('[data-add]'), function(b){
      b.addEventListener('click', function(){
        sprecherState.uids.push(b.getAttribute('data-add'));
        saveSprecher(); paint();
      });
    });
    Array.prototype.forEach.call(host.querySelectorAll('[data-remove]'), function(b){
      b.addEventListener('click', function(){
        var uid = b.getAttribute('data-remove');
        sprecherState.uids = sprecherState.uids.filter(function(u){ return u !== uid; });
        saveSprecher(); paint();
      });
    });
    var clearBtn = host.querySelector('#skClear');
    if(clearBtn) clearBtn.addEventListener('click', function(){
      sprecherState.uids = []; saveSprecher(); paint();
    });
  }

  paint();
  if(sprecherState.roster) return;
  loadStudentRoster().then(function(list){
    sprecherState.roster = list;
    if(beamer.overlay && beamer.tab === 'ruhe' && host.isConnected) paint();
  }).catch(function(err){ console.error(err); });
}

/* ---------- 🎲 Wer ist dran? ----------
   Gewichtete Ziehung: wer schon oft dran war, kommt seltener. Die Zählung
   liegt lokal (hl_-Präfix) und gehört zum Gerät der Lehrperson. */

var dranNames = null;

function dranCounts(){
  try{ return JSON.parse(lsGet(LIB_PREFIX+'dran_counts') || '{}') || {}; }catch(e){ return {}; }
}
function setDranCounts(c){ lsSet(LIB_PREFIX+'dran_counts', JSON.stringify(c)); }

function mountWerIstDran(stage){
  stage.innerHTML = '<div class="wd-wrap"><div class="wd-name" id="wdName">wird geladen …</div></div>';
  var fair = lsGet(LIB_PREFIX+'dran_fair') !== '0';

  function build(names){
    var counts = dranCounts();
    var html = '';
    html += '<div class="wd-wrap">';
    html += '<div class="wd-name" id="wdName">Bereit</div>';
    html += '<div class="wd-actions">';
    html += '<button class="btn btn-primary tm-big" id="wdDraw" type="button">🎲 Ziehen</button>';
    html += '<label class="wd-check"><input type="checkbox" id="wdFair"'+(fair?' checked':'')+'> Jede:r zuerst einmal</label>';
    html += '<button class="btn btn-ghost btn-sm" id="wdReset" type="button">Zähler zurücksetzen</button>';
    html += '</div>';
    html += '<div class="wd-list" id="wdList"></div>';
    html += '</div>';
    stage.innerHTML = html;

    var nameEl = stage.querySelector('#wdName');
    var listEl = stage.querySelector('#wdList');
    var spinning = false, spinTimer = null;

    function paintList(){
      listEl.innerHTML = names.map(function(n){
        var c = counts[n.uid] || 0;
        return '<span class="wd-chip'+(c?'':' wd-chip-new')+'">'+esc(n.displayName)+'<b>'+c+'</b></span>';
      }).join('');
    }
    function pool(){
      if(!fair) return names.slice();
      var min = Math.min.apply(null, names.map(function(n){ return counts[n.uid] || 0; }));
      return names.filter(function(n){ return (counts[n.uid] || 0) === min; });
    }
    function weightedPick(list){
      var weights = list.map(function(n){ var c = counts[n.uid] || 0; return 1 / Math.pow(c+1, 2); });
      var sum = weights.reduce(function(a,b){ return a+b; }, 0);
      var r = Math.random() * sum;
      for(var i=0;i<list.length;i++){ r -= weights[i]; if(r <= 0) return list[i]; }
      return list[list.length-1];
    }
    function draw(){
      if(spinning || !names.length) return;
      spinning = true;
      var list = pool();
      var winner = weightedPick(list);
      var t0 = Date.now(), dur = 2200;
      stage.classList.remove('wd-hit');
      (function spin(){
        var p = (Date.now()-t0)/dur;
        if(p >= 1){
          nameEl.textContent = winner.displayName;
          stage.classList.add('wd-hit');
          playGong();
          counts[winner.uid] = (counts[winner.uid] || 0) + 1;
          setDranCounts(counts);
          paintList();
          spinning = false;
          return;
        }
        nameEl.textContent = names[Math.floor(Math.random()*names.length)].displayName;
        playBlip();
        // gegen Ende immer langsamer — Slot-Machine-Effekt
        spinTimer = setTimeout(spin, 40 + 320 * p * p * p);
      })();
    }

    stage.querySelector('#wdDraw').addEventListener('click', draw);
    stage.querySelector('#wdFair').addEventListener('change', function(e){
      fair = e.target.checked; lsSet(LIB_PREFIX+'dran_fair', fair ? '1' : '0');
    });
    stage.querySelector('#wdReset').addEventListener('click', function(){
      uiConfirm('Zähler zurücksetzen?', 'Alle Ziehungs-Zähler gehen auf null.', 'Zurücksetzen', function(){
        counts = {}; setDranCounts(counts); paintList(); toast('Zähler zurückgesetzt.');
      }, true);
    });
    beamer.cleanups.push(function(){ clearTimeout(spinTimer); });
    paintList();
  }

  if(dranNames){ build(dranNames); return; }
  loadStudentRoster().then(function(list){
    dranNames = list;
    if(beamer.tab === 'dran' && beamer.overlay) build(list);
  }).catch(function(err){
    console.error(err);
    stage.innerHTML = '<div class="wd-wrap"><div class="wd-name">Klassenliste konnte nicht geladen werden.</div></div>';
  });
}

/* ===================== 📡 LIVE-KLASSENRAUM (nur Lehrperson) =====================
   Zeigt beim Beamen in Echtzeit, wo die Klasse in EINER Übung gerade steht.
   Es wird nichts Neues geschrieben: die Übungsseiten melden ihren Stand ohnehin
   schon nach progress/{uid}/resources/{rid} (siehe postMessage-Handler und
   Lernzeit-Tracking) — hier wird pro Kind genau dieses eine Dokument
   beobachtet. Bewusst ein Listener pro Kind statt einer collectionGroup-
   Abfrage: das käme mit der gleichnamigen Top-Level-Collection `resources` ins
   Gehege und bräuchte einen zusätzlichen Index. */

var liveKlasse = { unsubs:[], overlay:null, data:{}, roster:[], hideNames:false, resource:null, repaint:null };

function liveRelTime(ts){
  if(!ts) return null;
  var ms = ts.toMillis ? ts.toMillis() : (ts.seconds ? ts.seconds*1000 : null);
  if(!ms) return null;
  var diff = Math.round((Date.now() - ms)/1000);
  if(diff < 15) return 'gerade eben';
  if(diff < 90) return 'vor '+diff+' s';
  if(diff < 3600) return 'vor '+Math.round(diff/60)+' min';
  if(diff < 86400) return 'vor '+Math.round(diff/3600)+' Std.';
  return 'vor '+Math.round(diff/86400)+' Tagen';
}
function liveIsActive(ts){
  if(!ts) return false;
  var ms = ts.toMillis ? ts.toMillis() : (ts.seconds ? ts.seconds*1000 : 0);
  return (Date.now() - ms) < 3*60*1000;   // in den letzten 3 Minuten etwas gemeldet
}

function openLiveKlasse(resource){
  if(liveKlasse.overlay) return;
  liveKlasse.resource = resource;
  liveKlasse.data = {};
  liveKlasse.hideNames = lsGet(LIB_PREFIX+'live_hidenames') === '1';

  var html = '';
  html += '<div class="kz-bar">';
  html += '<div class="kz-bar-title">📡 Live · '+esc(resource.title || resource.fileName)+'</div>';
  html += '<div class="kz-bar-spacer"></div>';
  html += '<button class="kz-tab" id="lkNames" type="button"></button>';
  html += '<button class="kz-close" id="lkClose" type="button" title="Schliessen (Esc)">✕</button>';
  html += '</div>';
  html += '<div class="lk-summary" id="lkSummary">wird geladen …</div>';
  html += '<div class="lk-grid" id="lkGrid"></div>';
  html += '<div class="lk-hard" id="lkHard"></div>';

  liveKlasse.overlay = openOverlay(html, function(){
    liveKlasse.unsubs.forEach(function(u){ try{ u(); }catch(e){} });
    liveKlasse.unsubs = [];
    liveKlasse.overlay = null;
    liveKlasse.repaint = null;
    clearInterval(liveKlasse.ticker);
  }, 'kz-overlay-live');

  var root = liveKlasse.overlay.el;
  root.querySelector('#lkClose').addEventListener('click', function(){ liveKlasse.overlay.close(); });
  var namesBtn = root.querySelector('#lkNames');
  function paintNamesBtn(){ namesBtn.textContent = liveKlasse.hideNames ? '🙈 Namen aus' : '👀 Namen an'; }
  namesBtn.addEventListener('click', function(){
    liveKlasse.hideNames = !liveKlasse.hideNames;
    lsSet(LIB_PREFIX+'live_hidenames', liveKlasse.hideNames ? '1' : '0');
    paintNamesBtn();
    if(liveKlasse.repaint) liveKlasse.repaint();
  });
  paintNamesBtn();

  loadStudentRoster().then(function(roster){
    if(!liveKlasse.overlay) return;
    liveKlasse.roster = roster;
    roster.forEach(function(stu, idx){
      var ref_ = doc(db, 'progress', stu.uid, 'resources', resource.id);
      liveKlasse.unsubs.push(onSnapshot(ref_, function(snap){
        liveKlasse.data[stu.uid] = snap.exists() ? snap.data() : null;
        if(liveKlasse.repaint) liveKlasse.repaint();
      }, function(err){ console.error('Live-Klasse: Listener-Fehler', err); }));
      stu.__idx = idx + 1;
    });
    liveKlasse.repaint = function(){ paintLiveKlasse(root); };
    liveKlasse.repaint();
    // Die relativen Zeitangaben ("vor 2 min") sollen auch ohne neue Daten altern.
    liveKlasse.ticker = setInterval(function(){ if(liveKlasse.repaint) liveKlasse.repaint(); }, 20000);
  }).catch(function(err){
    console.error(err);
    root.querySelector('#lkSummary').textContent = 'Klassenliste konnte nicht geladen werden.';
  });
}

function paintLiveKlasse(root){
  var gridEl = root.querySelector('#lkGrid');
  var sumEl = root.querySelector('#lkSummary');
  var hardEl = root.querySelector('#lkHard');
  if(!gridEl) return;

  var wrongByKey = {}, attemptedByKey = {};
  var pctSum = 0, pctCount = 0, activeCount = 0, startedCount = 0;

  var cards = liveKlasse.roster.map(function(stu){
    var d = liveKlasse.data[stu.uid];
    var s = learnedSummary(d);
    var label = liveKlasse.hideNames ? ('Kind '+stu.__idx) : stu.displayName;
    var pct = null, doneLabel = 'noch nicht gestartet', frac = 0, tone = 'idle';

    if(d && d.stats){
      Object.keys(d.stats).forEach(function(k){
        var st = d.stats[k] && d.stats[k].status;
        if(!st) return;
        attemptedByKey[k] = (attemptedByKey[k]||0) + 1;
        if(st !== 'correct') wrongByKey[k] = (wrongByKey[k]||0) + 1;
      });
    }
    if(s && s.kind === 'quiz'){
      frac = s.total ? Math.min(1, s.attempted / s.total) : 0;
      pct = s.pct;
      doneLabel = s.attempted + ' / ' + s.total + ' bearbeitet';
    } else if(s && s.kind === 'diktat'){
      frac = 1;
      pct = s.pct;
      doneLabel = 'Versuch ' + s.attemptCount;
    }
    if(s) startedCount++;
    if(pct !== null && pct !== undefined){ pctSum += pct; pctCount++; }
    var active = liveIsActive(d && (d.updatedAt || d.storeAt));
    if(active) activeCount++;

    if(!s) tone = 'idle';
    else if(frac >= 0.999) tone = (pct !== null && pct < 50) ? 'bad' : 'done';
    else tone = (pct !== null && pct < 40) ? 'bad' : 'work';

    var hours = fmtHours(d && d.timeSpentSec);
    var rel = liveRelTime(d && (d.updatedAt || d.storeAt));

    var h = '<div class="lk-card lk-'+tone+(active?' lk-active':'')+'">';
    h += '<div class="lk-name">'+esc(label)+(active?'<span class="lk-dot" title="arbeitet gerade"></span>':'')+'</div>';
    h += '<div class="lk-bar"><span style="width:'+Math.round(frac*100)+'%"></span></div>';
    h += '<div class="lk-meta">'+esc(doneLabel)+(pct!==null&&pct!==undefined ? ' · '+pct+'%' : '')+'</div>';
    h += '<div class="lk-sub">'+[rel, hours].filter(Boolean).map(esc).join(' · ')+'</div>';
    h += '</div>';
    return h;
  });

  gridEl.innerHTML = cards.join('');

  var avg = pctCount ? Math.round(pctSum/pctCount) : null;
  var parts = [];
  parts.push('<b>'+activeCount+'</b> von '+liveKlasse.roster.length+' arbeiten gerade');
  parts.push('<b>'+startedCount+'</b> haben begonnen');
  if(avg !== null) parts.push('Ø <b>'+avg+'%</b> richtig');
  sumEl.innerHTML = parts.join(' &nbsp;·&nbsp; ');

  // Wo hakt es? Aufgaben, die quer durch die Klasse am häufigsten falsch sind.
  var hard = Object.keys(wrongByKey).map(function(k){
    return { key:k, wrong:wrongByKey[k], tried:attemptedByKey[k]||0 };
  }).filter(function(r){ return r.tried >= 2; })
    .sort(function(a,b){ return (b.wrong/b.tried) - (a.wrong/a.tried) || b.wrong - a.wrong; })
    .slice(0, 6);
  if(hard.length){
    hardEl.innerHTML = '<div class="lk-hard-title">Am häufigsten falsch</div>' +
      hard.map(function(r){
        return '<span class="lk-hard-chip">'+esc(r.key)+' <b>'+r.wrong+'/'+r.tried+'</b></span>';
      }).join('');
  } else {
    hardEl.innerHTML = '';
  }
}

/* ===================== 🪑 SITZPLAN (nur Lehrperson) =====================
   Klassenzimmer 9 m (Breite) x 8 m (Tiefe), Wandtafel vorne mittig an der
   9-m-Wand. Drei Möbelarten: Zweiertisch (zwei Plätze), Lehrerpult und eine
   gesperrte Fläche in Dunkelgrün (gleiche Masse wie ein Tisch, aber niemand
   sitzt dort). Alles frei verschiebbar und drehbar; Sitzordnungen lassen sich
   benannt speichern und wieder laden.

   Die Möbel sind bewusst NICHT massstabsgetreu: ein Zweiertisch ist real
   1,0 x 0,5 m, wird hier aber mit 1,5 x 0,75 m gezeichnet, damit die Namen auf
   dem Beamer lesbar bleiben. Das Lehrerpult wird gleich gross gezeichnet wie
   ein Zweiertisch. Das Zimmerraster bleibt bei 1 m. Die Tischordnungs-Vorlagen
   rechnen mit TABLE_W/TABLE_H und passen sich an, wenn man die Masse ändert.

   Links am Fenster läuft ein durchgehendes Fenstersims von 0,5 m Tiefe — dort
   stellen die Vorlagen keine Tische hin, und auch von Hand lässt sich dort
   nichts hinschieben (spClampTable). Die Tür liegt hinten an der rechten Wand,
   20 cm von der Ecke entfernt.

   Der Arbeitsstand liegt in EINEM Firestore-Dokument (klassenzimmer/sitzplan),
   die gespeicherten Varianten in klassenzimmer/sitzplaene. Beide sind klein,
   werden nur von der Lehrperson geschrieben und brauchen so weder Query noch
   Index. Geschlecht und Regeln stehen bewusst hier und nicht in students/{uid}
   — diese Collection wird ausschliesslich vom Admin-Skript geschrieben. */

var ROOM_W = 9, ROOM_D = 8;          // Meter
var TABLE_W = 1.5, TABLE_H = 0.75;   // Zweiertisch (vergrössert gezeichnet)
var PULT_W = 1.5, PULT_H = 0.75;     // Lehrerpult — gleich gross wie ein Tisch
var SILL_W = 0.5;                    // Fenstersims links, durchgehend
var DOOR_W = 0.9, DOOR_D = 0.08;     // Türbreite und Strichstärke in der Wand
var DOOR_GAP = 0.2;                  // Abstand zur hinteren Ecke, rechte Wand
var SP_DEFAULT_TABLES = 11;          // so viele Zweiertische stehen im Zimmer
var SNAP = 0.1;

// Vornamen der Mädchen dieser Klasse. Dient nur als Vorbelegung: sobald über
// die J/M-Knöpfe etwas eingestellt wird, gilt der gespeicherte Wert.
var SP_MAEDCHEN = ['feyza','matilda','marielou','tamara','giulia','naima','julia','alisia'];

var sp = {
  doc:null, roster:[], picked:null, selected:null, saveTimer:null, loaded:false,
  saved:[], labelMap:{}
};

function spEmptyPlan(){
  return { tables:[], seats:{}, meta:{}, rules:[], absent:[], genderMode:'egal', mirror:false };
}
function spNewTableId(){
  return 't' + Date.now().toString(36) + Math.floor(Math.random()*46656).toString(36);
}
function spSeatId(tableId, slot){ return tableId + '#' + slot; }
function spClamp(v, lo, hi){ return Math.max(lo, Math.min(hi, v)); }
function spSnap(v){ return Math.round(v / SNAP) * SNAP; }
function spKind(t){ return t.kind || 'tisch'; }
// Tische stehen nur waagrecht oder senkrecht. Ältere Stände (und gespeicherte
// Varianten) können noch 45-Grad-Winkel enthalten — die werden beim Laden auf
// das nächste Vielfache von 90 Grad gerundet.
function spNormRot(r){ return ((Math.round((r||0)/90)*90) % 360 + 360) % 360; }
function spNormTables(tables){
  (tables||[]).forEach(function(t){ t.rot = spNormRot(t.rot); spClampTable(t); });
  return tables;
}
// Grundriss im Zimmer: um 90/270 Grad gedreht tauschen Länge und Tiefe die Achsen.
function spFootprint(t){
  var size = spTableSize(t);
  return (spNormRot(t.rot) % 180 === 90) ? {w:size.h, h:size.w} : {w:size.w, h:size.h};
}
// Kein Möbel steht auf dem Fenstersims oder ragt aus dem Zimmer. Erst snappen,
// dann begrenzen — sonst könnte das Raster ein Möbel wieder aufs Sims schieben.
function spClampTable(t){
  var f = spFootprint(t);
  t.x = spClamp(spSnap(t.x), SILL_W + f.w/2, ROOM_W - f.w/2);
  t.y = spClamp(spSnap(t.y), f.h/2, ROOM_D - f.h/2);
  return t;
}
function spHasSeats(t){ return spKind(t) === 'tisch'; }
function spTableSize(t){
  return spKind(t) === 'pult' ? {w:PULT_W, h:PULT_H} : {w:TABLE_W, h:TABLE_H};
}

/* ---------- Vollbild der Pultdarstellung ----------
   Siehe CSS-Kommentar bei #spHost:fullscreen: es wird bewusst #spHost
   gefullscreent und nicht der Raum selbst, damit die Werkzeugleiste und die
   Klassenliste bedienbar bleiben und das Vollbild ein Neuzeichnen übersteht. */
var spFsWired = false;

function spIsFs(){
  var host = document.getElementById('spHost');
  if(!host) return false;
  return (document.fullscreenElement || document.webkitFullscreenElement) === host
      || host.classList.contains('sp-fs');
}
function spSyncFsBtn(){
  var btn = document.getElementById('spFs');
  if(btn) btn.innerHTML = spIsFs() ? '✕ Vollbild beenden' : '⛶ Vollbild';
}
function spPseudoFsOn(host){
  host.classList.add('sp-fs');
  document.body.classList.add('pseudo-fs-active');
  spSyncFsBtn();
}
function spPseudoFsOff(host){
  host.classList.remove('sp-fs');
  document.body.classList.remove('pseudo-fs-active');
  spSyncFsBtn();
}
function spExitFs(){
  var host = document.getElementById('spHost');
  if(host && host.classList.contains('sp-fs')){ spPseudoFsOff(host); return; }
  if(document.fullscreenElement || document.webkitFullscreenElement){
    var action = (document.exitFullscreen || document.webkitExitFullscreen).call(document);
    if(action && action.catch){ action.catch(function(){}); }
  }
}
function spToggleFs(){
  var host = document.getElementById('spHost');
  if(!host) return;
  if(spIsFs()){ spExitFs(); return; }
  var native = host.requestFullscreen || host.webkitRequestFullscreen;
  if(!native){ spPseudoFsOn(host); return; }   // iOS-Safari / Homescreen-App
  var action = native.call(host);
  if(action && action.catch){
    action.catch(function(){ spPseudoFsOn(host); });
  }
}
function spWireFsOnce(){
  if(spFsWired) return;
  spFsWired = true;
  document.addEventListener('fullscreenchange', spSyncFsBtn);
  document.addEventListener('webkitfullscreenchange', spSyncFsBtn);
  document.addEventListener('keydown', function(e){
    var host = document.getElementById('spHost');
    if(e.key === 'Escape' && host && host.classList.contains('sp-fs')) spPseudoFsOff(host);
  });
}

function spStudentById(uid){
  for(var i=0;i<sp.roster.length;i++){ if(sp.roster[i].uid === uid) return sp.roster[i]; }
  return null;
}
function spNormName(s){ return (s||'').toLowerCase().replace(/[^a-zà-ÿ]/g, ''); }
function spDefaultGender(stu){
  var parts = (stu.displayName || '').trim().split(/\s+/);
  var one = spNormName(parts[0] || '');
  var two = spNormName((parts[0] || '') + (parts[1] || ''));
  return (SP_MAEDCHEN.indexOf(one) >= 0 || SP_MAEDCHEN.indexOf(two) >= 0) ? 'w' : 'm';
}
function spGender(uid){
  var m = sp.doc.meta[uid];
  if(m && typeof m.g === 'string') return m.g;   // von Hand gesetzt (auch "keins")
  var stu = spStudentById(uid);
  return stu ? spDefaultGender(stu) : '';
}

// Auf dem Platz steht der Vorname; nur wenn er in der Klasse doppelt vorkommt,
// kommt der Anfangsbuchstabe des Nachnamens dazu. Der volle Name steht im
// title-Attribut.
function spBuildLabelMap(){
  var counts = {};
  sp.roster.forEach(function(s){
    var first = (s.displayName||'').trim().split(/\s+/)[0] || '?';
    counts[first] = (counts[first]||0) + 1;
  });
  sp.labelMap = {};
  sp.roster.forEach(function(s){
    var parts = (s.displayName||'').trim().split(/\s+/);
    var first = parts[0] || '?';
    sp.labelMap[s.uid] = (counts[first] > 1 && parts[1]) ? (first + ' ' + parts[1].charAt(0) + '.') : first;
  });
}
function spSeatLabel(uid){ return sp.labelMap[uid] || '?'; }
function spFullName(uid){ var s = spStudentById(uid); return s ? s.displayName : ''; }

function spIsAbsent(uid){ return sp.doc.absent.indexOf(uid) >= 0; }
function spActiveStudents(){
  return sp.roster.filter(function(s){ return !spIsAbsent(s.uid); });
}
function spSeatedUid(seatId){ return sp.doc.seats[seatId] || null; }
function spSeatOf(uid){
  var keys = Object.keys(sp.doc.seats);
  for(var i=0;i<keys.length;i++){ if(sp.doc.seats[keys[i]] === uid) return keys[i]; }
  return null;
}
function spSeatTables(){ return sp.doc.tables.filter(spHasSeats); }
function spAllSeatIds(){
  var out = [];
  spSeatTables().forEach(function(t){ out.push(spSeatId(t.id,0)); out.push(spSeatId(t.id,1)); });
  return out;
}
function spTableById(id){
  for(var i=0;i<sp.doc.tables.length;i++){ if(sp.doc.tables[i].id === id) return sp.doc.tables[i]; }
  return null;
}

/* ---------- Speichern (entprellt) ---------- */
function spSave(){
  clearTimeout(sp.saveTimer);
  sp.saveTimer = setTimeout(function(){
    // Sitzplätze verwaister Tische aufräumen, damit das Dokument nicht wächst.
    var valid = {};
    spAllSeatIds().forEach(function(id){ valid[id] = true; });
    Object.keys(sp.doc.seats).forEach(function(id){ if(!valid[id]) delete sp.doc.seats[id]; });
    setDoc(doc(db,'klassenzimmer','sitzplan'), {
      tables: sp.doc.tables, seats: sp.doc.seats, meta: sp.doc.meta,
      rules: sp.doc.rules, absent: sp.doc.absent,
      genderMode: sp.doc.genderMode, mirror: !!sp.doc.mirror,
      updatedAt: serverTimestamp()
    }).catch(function(err){ console.error('Sitzplan konnte nicht gespeichert werden', err); toast('Sitzplan nicht gespeichert.'); });
  }, 700);
}

function spSaveVarianten(){
  return setDoc(doc(db,'klassenzimmer','sitzplaene'), {
    plans: sp.saved, updatedAt: serverTimestamp()
  }).catch(function(err){ console.error(err); toast('Variante konnte nicht gespeichert werden.'); });
}

/* ---------- Seite ---------- */

function renderSitzplan(){
  clearSubjectWatchers();
  clearOverviewWatchers();
  var html = '';
  html += '<div class="back-row"><button class="btn btn-ghost btn-sm" id="backBtn" type="button">&larr; Klassenzimmer</button></div>';
  html += '<h2 class="page-welcome" style="margin-bottom:10px;">🪑 Sitzplan</h2>';
  html += '<div id="spHost"><div class="empty-state">Wird geladen …</div></div>';
  renderChrome(html);
  document.getElementById('backBtn').addEventListener('click', function(){
    spExitFs();   // sonst bliebe body.pseudo-fs-active hängen
    state.route = {name:'klassenzimmer'}; render();
  });

  Promise.all([
    loadStudentRoster(),
    getDoc(doc(db,'klassenzimmer','sitzplan')),
    getDoc(doc(db,'klassenzimmer','sitzplaene'))
  ]).then(function(res){
    if(state.route.name !== 'sitzplan') return;
    sp.roster = res[0];
    spBuildLabelMap();
    var d = res[1].exists() ? res[1].data() : null;
    var base = spEmptyPlan();
    sp.doc = {
      tables: spNormTables((d && Array.isArray(d.tables)) ? d.tables : base.tables),
      seats:  (d && d.seats) ? Object.assign({}, d.seats) : base.seats,
      meta:   (d && d.meta) ? Object.assign({}, d.meta) : base.meta,
      rules:  (d && Array.isArray(d.rules)) ? d.rules : base.rules,
      absent: (d && Array.isArray(d.absent)) ? d.absent : base.absent,
      genderMode: (d && d.genderMode) || base.genderMode,
      mirror: !!(d && d.mirror)
    };
    var v = res[2].exists() ? res[2].data() : null;
    sp.saved = (v && Array.isArray(v.plans)) ? v.plans : [];
    sp.loaded = true;
    // Leeres Zimmer: gleich die 11 Zweiertische in Reihen hinstellen.
    if(!sp.doc.tables.length){ spAutoLayout('reihen', true); return; }
    paintSitzplan();
  }).catch(function(err){
    console.error(err);
    var host = document.getElementById('spHost');
    if(host) host.innerHTML = '<div class="empty-state">Sitzplan konnte nicht geladen werden.</div>';
  });
}

function paintSitzplan(){
  var host = document.getElementById('spHost');
  if(!host || !sp.doc) return;

  var seated = {};
  Object.keys(sp.doc.seats).forEach(function(k){ if(sp.doc.seats[k]) seated[sp.doc.seats[k]] = true; });
  var free = spActiveStudents().filter(function(s){ return !seated[s.uid]; });

  var html = '';

  /* Werkzeugleiste */
  html += '<div class="sp-tools">';
  html += '<span class="sp-tool-group">';
  html += '<span class="sp-tool-label">Möbel</span>';
  html += '<button class="btn btn-primary btn-sm" data-add-kind="tisch" type="button">➕ Zweiertisch</button>';
  html += '<button class="btn btn-ghost btn-sm" data-add-kind="pult" type="button">➕ Lehrerpult</button>';
  html += '<button class="btn btn-ghost btn-sm" data-add-kind="block" type="button">➕ Gesperrt</button>';
  html += '</span>';
  html += '<span class="sp-tool-group">';
  html += '<span class="sp-tool-label">Tischordnung</span>';
  html += '<button class="btn btn-ghost btn-sm" data-layout="reihen" type="button">Reihen</button>';
  html += '<button class="btn btn-ghost btn-sm" data-layout="gruppen" type="button">4er-Gruppen</button>';
  html += '<button class="btn btn-ghost btn-sm" data-layout="u" type="button">U-Form</button>';
  html += '<button class="btn btn-ghost btn-sm" data-layout="zufall" type="button">🎲 Zufall</button>';
  html += '</span>';
  html += '<span class="sp-tool-group">';
  html += '<span class="sp-tool-label">Sitzordnung</span>';
  html += '<select class="sp-select" id="spGenderMode">';
  [['egal','Geschlecht egal'],['gemischt','Tischpaare gemischt'],['gleich','Tischpaare gleich']].forEach(function(o){
    html += '<option value="'+o[0]+'"'+(sp.doc.genderMode===o[0]?' selected':'')+'>'+o[1]+'</option>';
  });
  html += '</select>';
  html += '<button class="btn btn-primary btn-sm" id="spShuffle" type="button">🎲 Zufällig setzen</button>';
  html += '<button class="btn btn-ghost btn-sm" id="spRules" type="button">⚖️ Regeln <b>'+sp.doc.rules.length+'</b></button>';
  html += '<button class="btn btn-ghost btn-sm" id="spClearSeats" type="button">Plätze leeren</button>';
  html += '</span>';
  html += '<span class="sp-tool-group">';
  html += '<span class="sp-tool-label">Gespeichert</span>';
