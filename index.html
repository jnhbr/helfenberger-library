/* ===================== HOVER-PANELS (To-dos & Schulden) =====================
   Die beiden Topbar-Fenster (To-do-Panel, Schulden-Fenster) gehen schon beim
   Drüberfahren mit der Maus auf und wieder zu, sobald der Zeiger Knopf und
   Fenster verlassen hat. Erst ein Klick "pinnt" das Fenster - dann bleibt es
   offen, bis man es bewusst schliesst (x, Klick daneben, Esc, erneuter Klick
   auf den Knopf).

   Warum Zeiger-Koordinaten statt mouseenter/mouseleave: Das Schulden-Fenster
   ist ein Modal, dessen abgedunkeltes Overlay den Topbar-Knopf im selben
   Moment überdeckt, in dem es aufgeht - mit enter/leave würde es sich sofort
   wieder schliessen. Die Rechteck-Prüfung kennt dieses Problem nicht. Der
   mousemove-Handler hängt nur so lange am Dokument, wie tatsächlich ein per
   Hover geöffnetes Fenster offen ist. */
var HOVER_OPEN_MS = 140;   // kurze Absicht-Verzögerung: blosses Vorbeifahren öffnet nichts
var HOVER_CLOSE_MS = 500;  // Karenz, um mit der Maus vom Knopf ins Fenster zu wechseln

function pointInEl(x, y, el, pad){
  if(!el || el.hidden) return false;
  var r = el.getBoundingClientRect();
  if(!r.width && !r.height) return false;
  pad = pad || 0;
  return x >= r.left - pad && x <= r.right + pad && y >= r.top - pad && y <= r.bottom + pad;
}

// cfg: { open(byClick), close(), isOpen(), isOver(x,y), trigger(), keepOpen() }
function makeHoverPanel(cfg){
  var openTimer = null, closeTimer = null, pinned = false, tracking = false, byHover = false;

  function clearTimers(){
    if(openTimer){ clearTimeout(openTimer); openTimer = null; }
    if(closeTimer){ clearTimeout(closeTimer); closeTimer = null; }
  }
  function startTracking(){
    if(tracking) return;
    tracking = true;
    document.addEventListener('mousemove', onMove);
    document.addEventListener('mousedown', onDocDown, true);
  }
  function stopTracking(){
    if(!tracking) return;
    tracking = false;
    document.removeEventListener('mousemove', onMove);
    document.removeEventListener('mousedown', onDocDown, true);
  }
  function onDocDown(e){
    if(pinned || !cfg.isOpen()) return;
    // Der Topbar-Knopf hat seine eigene Klick-Logik (pinnen bzw. schliessen).
    var trg = cfg.trigger && cfg.trigger();
    if(trg && trg.contains(e.target)) return;
    if(!cfg.isOver(e.clientX, e.clientY)) return;
    pinned = true;
    byHover = false;
    clearTimers();
    stopTracking();
  }
  function onMove(e){
    if(pinned){ clearTimers(); stopTracking(); return; }
    if(!cfg.isOpen()){ clearTimers(); stopTracking(); return; }
    if(cfg.isOver(e.clientX, e.clientY)){
      if(closeTimer){ clearTimeout(closeTimer); closeTimer = null; }
      return;
    }
    if(closeTimer) return;
    closeTimer = setTimeout(function(){
      closeTimer = null;
      if(pinned || !cfg.isOpen()) return;
      if(cfg.keepOpen && cfg.keepOpen()) return;
      api.close();
    }, HOVER_CLOSE_MS);
  }

  var api = {
    hoverIn: function(){
      clearTimers();
      if(pinned || cfg.isOpen()) return;
      openTimer = setTimeout(function(){
        openTimer = null;
        cfg.open(false);
        byHover = true;
        startTracking();
      }, HOVER_OPEN_MS);
    },
    hoverOut: function(){
      if(openTimer){ clearTimeout(openTimer); openTimer = null; }
      // Das Zumachen erledigt onMove anhand der Zeiger-Position.
      if(byHover && !pinned && cfg.isOpen()) startTracking();
    },
    click: function(){
      clearTimers();
      if(pinned && cfg.isOpen()){ api.close(); return; }
      cfg.open(true);
      pinned = true;
      byHover = false;
      stopTracking();
    },
    close: function(){ cfg.close(); },
    isPinned: function(){ return pinned; },
    // Aufräumen, wenn das Fenster (auch von aussen) geschlossen wurde.
    reset: function(){ pinned = false; byHover = false; clearTimers(); stopTracking(); }
  };
  return api;
}

/* ===================== SCHULDEN ("Geld-Symbol" oben links) =====================
   Kleine Beträge, die Schüler:innen Herrn Helfenberger schulden (Schoggibrötli
   & Co.). Datenmodell: debts/{uid} -> {entries:[{id, amount, what, createdAt}],
   updatedAt}. Laut firestore.rules liest jede:r nur das eigene Dokument, die
   Lehrperson liest/schreibt alle - so sieht jede Schüler:in ausschliesslich die
   eigenen Schulden. Das Dokument wird bei jeder Änderung komplett neu
   geschrieben (setDoc ohne merge), damit gelöschte Einträge wirklich
   verschwinden. Für Schüler:innen erscheint das Symbol nur bei offenen Schulden
   und öffnet die Sprechblase von selbst; die Lehrperson sieht sie immer (mit
   Badge = Anzahl Schuldner:innen) und muss sie anklicken, um die Verwaltung zu
   öffnen. */
var myDebt = { entries:[], total:0 };
var myDebtUnsub = null;
var teacherDebtCount = 0;
var coinAutoShownSig = '';
// Ist gerade das Schulden-Fenster der Lehrperson offen? (Für die Hover-Logik:
// nur dann zählt das Modal zum Geld-Symbol und darf per Maus zugehen.)
var debtHoverActive = false;
// Gegen ein Wettrennen: Das Fenster lädt asynchron. Wird es in der Zwischenzeit
// per Maus wieder geschlossen, darf das nachgeladene Ergebnis es nicht erneut
// aufreissen.
var debtLoadToken = 0;

function coinIsTeacher(){ return !!(state.profile && state.profile.role === 'teacher'); }

var coinHover = makeHoverPanel({
  trigger: function(){ return document.getElementById('coinBtn'); },
  isOpen: function(){
    if(coinIsTeacher()) return debtHoverActive && modalEl.classList.contains('show');
    return !!document.getElementById('coinBubble');
  },
  isOver: function(x, y){
    if(pointInEl(x, y, document.getElementById('coinBtn'), 14)) return true;
    if(pointInEl(x, y, document.getElementById('coinBubble'), 14)) return true;
    if(debtHoverActive && pointInEl(x, y, modalEl.querySelector('.modal'), 10)) return true;
    return false;
  },
  open: function(){
    if(coinIsTeacher()){
      if(!(debtHoverActive && modalEl.classList.contains('show'))) openDebtManager();
    } else if(!document.getElementById('coinBubble')){
      openCoinBubble();
    }
  },
  close: function(){
    if(debtHoverActive) closeModal();
    else closeCoinBubble();
  }
});

function fmtChf(n){ return 'CHF ' + (Math.round(Number(n)*100)/100).toFixed(2); }
function debtSum(entries){
  return (entries||[]).reduce(function(s,e){ var v = Number(e.amount); return s + (isFinite(v) ? v : 0); }, 0);
}
function normalizeDebtEntries(data){
  var arr = (data && Array.isArray(data.entries)) ? data.entries : [];
  return arr.filter(function(e){ return e && isFinite(Number(e.amount)); }).map(function(e){
    return {
      id: e.id || ('d_'+Date.now()+'_'+Math.random().toString(36).slice(2,8)),
      amount: Number(e.amount),
      what: (e.what||'').toString(),
      createdAt: Number(e.createdAt) || 0
    };
  });
}
function fmtDebtDate(ms){
  if(!ms) return '';
  var d = new Date(ms);
  return pad2(d.getDate())+'.'+pad2(d.getMonth()+1)+'.'+d.getFullYear();
}
function startDebtWatch(){
  stopDebtWatch();
  if(!state.user) return;
  if(state.profile && state.profile.role === 'teacher'){ loadTeacherDebtCount(); return; }
  myDebtUnsub = onSnapshot(kdoc('debts', state.user.uid), function(snap){
    myDebt.entries = snap.exists() ? normalizeDebtEntries(snap.data()) : [];
    myDebt.total = debtSum(myDebt.entries);
    refreshMyDebtUi();
  }, function(err){ console.error(err); });
}
function stopDebtWatch(){
  if(myDebtUnsub){ myDebtUnsub(); myDebtUnsub = null; }
  myDebt = { entries:[], total:0 };
  teacherDebtCount = 0;
  coinAutoShownSig = '';
  closeCoinBubble();
}
function loadTeacherDebtCount(){
  // Bewusst ohne where()/orderBy(): die Collection ist winzig, und so wird kein
  // Composite Index nötig.
  getDocs(kcol('debts')).then(function(snap){
    var n = 0;
    snap.forEach(function(d){ if(debtSum(normalizeDebtEntries(d.data())) > 0) n++; });
    teacherDebtCount = n;
    updateCoinButton();
  }).catch(function(err){ console.error(err); });
}
function updateCoinButton(){
  var btn = document.getElementById('coinBtn');
  if(!btn) return;
  var badge = document.getElementById('coinBadge');
  var isTeacher = state.profile && state.profile.role === 'teacher';
  if(isTeacher){
    btn.hidden = false;
    btn.title = teacherDebtCount ? teacherDebtCount+' mit offenen Schulden' : 'Schulden verwalten';
    if(badge){ badge.hidden = !teacherDebtCount; badge.textContent = teacherDebtCount ? String(teacherDebtCount) : ''; }
  } else {
    btn.hidden = !(myDebt.total > 0);
    btn.title = 'Offene Schulden: '+fmtChf(myDebt.total);
    if(badge){ badge.hidden = true; badge.textContent = ''; }
  }
}
function refreshMyDebtUi(){
  updateCoinButton();
  if(myDebt.total <= 0){ coinAutoShownSig = ''; closeCoinBubble(); return; }
  // Die Sprechblase geht von selbst auf - beim Anmelden und jedes Mal, wenn ein
  // Eintrag dazukommt oder sich ändert. Wer sie wegklickt, hat Ruhe, bis sich
  // wieder etwas an den eigenen Schulden ändert.
  var sig = myDebt.entries.map(function(e){ return e.id+':'+e.amount+':'+e.what; }).join('|');
  if(sig !== coinAutoShownSig){ coinAutoShownSig = sig; openCoinBubble(); return; }
  if(document.getElementById('coinBubble')) openCoinBubble();
}
function onCoinClick(){ coinHover.click(); }
function openCoinBubble(){
  closeCoinBubble();
  var items = myDebt.entries.slice().sort(function(a,b){ return (b.createdAt||0)-(a.createdAt||0); }).map(function(e){
    return '<li><span>'+esc(e.what || 'Ohne Angabe')+'</span><b>'+esc(fmtChf(e.amount))+'</b></li>';
  }).join('');
  document.body.insertAdjacentHTML('beforeend',
    '<div class="coin-bubble" id="coinBubble">'+
      '<button type="button" class="coin-bubble-close" id="coinBubbleClose" aria-label="Schliessen">×</button>'+
      '<h4>Du schuldest '+esc(lpDativ())+'</h4>'+
      '<div class="coin-bubble-total">'+esc(fmtChf(myDebt.total))+'</div>'+
      '<ul class="coin-list">'+items+'</ul>'+
    '</div>');
  document.getElementById('coinBubbleClose').addEventListener('click', closeCoinBubble);
  setTimeout(function(){ document.addEventListener('click', onOutsideCoinClick); }, 0);
}
function closeCoinBubble(){
  var el = document.getElementById('coinBubble');
  if(el) el.remove();
  document.removeEventListener('click', onOutsideCoinClick);
  coinHover.reset();
}
function onOutsideCoinClick(e){
  var el = document.getElementById('coinBubble');
  if(!el) return;
  var btn = document.getElementById('coinBtn');
  if(el.contains(e.target) || (btn && btn.contains(e.target))) return;
  closeCoinBubble();
}

async function openDebtManager(){
  openModal('<h3>Schulden</h3><p>Wird geladen …</p>', 'modal-wide');
  debtHoverActive = true;
  var token = ++debtLoadToken;
  var rows;
  try{
    var roster = ohneGaeste(await loadStudentRoster());
    var byUid = {};
    var snap = await getDocs(kcol('debts'));
    snap.forEach(function(d){ byUid[d.id] = normalizeDebtEntries(d.data()); });
    rows = roster.map(function(s){
      var entries = byUid[s.uid] || [];
      return { stu:s, entries:entries, total:debtSum(entries) };
    });
  }catch(err){
    console.error(err);
    // "permission-denied" heisst hier praktisch immer: die firestore.rules mit
    // dem debts-Block sind noch nicht deployt (firebase deploy --only firestore:rules).
    var denied = err && (err.code === 'permission-denied' || /permission/i.test(err.message||''));
    if(token !== debtLoadToken) return;
    openModal('<h3>Schulden</h3><p>'+(denied
        ? 'Zugriff verweigert – die Firestore-Regeln für „debts“ sind noch nicht deployt. Einmal <b>firebase deploy --only firestore:rules</b> ausführen.'
        : 'Konnte nicht geladen werden.')+'</p>'+
      '<div class="modal-actions"><button class="btn btn-primary btn-sm" id="modalOk" type="button">Ok</button></div>');
    document.getElementById('modalOk').addEventListener('click', closeModal);
    return;
  }
  if(token !== debtLoadToken) return;
  renderDebtOverview(rows);
}
function debtRowHtml(r){
  return '<div class="debt-row">'+
    '<span class="debt-row-name">'+esc(r.stu.displayName||r.stu.username)+'</span>'+
    '<span class="debt-row-sum'+(r.total>0?' has-debt':'')+'">'+esc(fmtChf(r.total))+'</span>'+
    '<button class="btn btn-ghost btn-sm debt-open" type="button" data-uid="'+esc(r.stu.uid)+'">'+(r.total>0?'Bearbeiten':'Eintragen')+'</button>'+
    '</div>';
}
function renderDebtOverview(rows){
  var debtors = rows.filter(function(r){ return r.total > 0; });
  var rest = rows.filter(function(r){ return r.total <= 0; });
  var gesamt = debtors.reduce(function(s,r){ return s + r.total; }, 0);
  openModal(
    '<h3>Schulden</h3>'+
    '<p>'+(debtors.length
      ? esc(debtors.length+' Schüler:in'+(debtors.length===1?'':'nen')+' mit offenen Schulden · total '+fmtChf(gesamt))
      : 'Momentan hat niemand offene Schulden.')+'</p>'+
    '<div class="debt-list">'+
      debtors.map(debtRowHtml).join('')+
      (rest.length ? '<div class="debt-divider">Ohne Schulden</div>'+rest.map(debtRowHtml).join('') : '')+
    '</div>'+
    '<div class="modal-actions"><button class="btn btn-primary btn-sm" id="modalOk" type="button">Fertig</button></div>',
    'modal-wide'
  );
  document.getElementById('modalOk').addEventListener('click', closeModal);
  Array.prototype.forEach.call(document.querySelectorAll('.debt-open'), function(b){
    b.addEventListener('click', function(){
      var uid = b.getAttribute('data-uid');
      var row = rows.filter(function(x){ return x.stu.uid === uid; })[0];
      if(row) renderDebtDetail(row, rows);
    });
  });
}
function renderDebtDetail(row, rows){
  var sorted = row.entries.slice().sort(function(a,b){ return (b.createdAt||0)-(a.createdAt||0); });
  var list = sorted.length ? sorted.map(function(e){
    return '<div class="debt-entry">'+
      '<span class="debt-entry-what">'+esc(e.what||'Ohne Angabe')+
        (e.createdAt ? '<span class="debt-entry-date"> · '+esc(fmtDebtDate(e.createdAt))+'</span>' : '')+'</span>'+
      '<span class="debt-row-sum has-debt">'+esc(fmtChf(e.amount))+'</span>'+
      '<button class="btn btn-ghost btn-sm debt-del" type="button" data-id="'+esc(e.id)+'" title="Beglichen – Eintrag löschen">🗑</button>'+
      '</div>';
  }).join('') : '<div class="empty-state">Keine offenen Schulden.</div>';
  openModal(
    '<h3>'+esc(row.stu.displayName||row.stu.username)+'</h3>'+
    '<p>Offen: <b>'+esc(fmtChf(row.total))+'</b></p>'+
    '<div class="debt-list">'+list+'</div>'+
    '<div class="debt-form">'+
      '<div class="debt-form-amount"><label class="modal-label" for="debtAmount">Betrag (CHF)</label>'+
        '<input type="number" id="debtAmount" step="0.05" min="0" placeholder="2.00"></div>'+
      '<div class="debt-form-what"><label class="modal-label" for="debtWhat">Wofür?</label>'+
        '<input type="text" id="debtWhat" maxlength="80" placeholder="z.B. Schoggibrötli"></div>'+
      '<button class="btn btn-primary btn-sm" id="debtAddBtn" type="button">Hinzufügen</button>'+
    '</div>'+
    '<div class="login-err" id="debtErr"></div>'+
    '<div class="modal-actions">'+
      (row.total>0 ? '<button class="btn btn-danger btn-sm" id="debtClearBtn" type="button">Alles beglichen</button>' : '')+
      '<button class="btn btn-ghost btn-sm" id="debtBackBtn" type="button">Zurück</button>'+
    '</div>',
    'modal-wide'
  );
  var errEl = document.getElementById('debtErr');
  var amountEl = document.getElementById('debtAmount');
  var whatEl = document.getElementById('debtWhat');

  function addEntry(){
    errEl.classList.remove('show');
    var amount = Math.round(parseFloat((amountEl.value||'').replace(',','.'))*100)/100;
    var what = whatEl.value.trim().slice(0,80);
    if(!isFinite(amount) || amount <= 0){
      errEl.textContent = 'Bitte einen Betrag grösser als 0 eingeben.'; errEl.classList.add('show'); amountEl.focus(); return;
    }
    if(!what){
      errEl.textContent = 'Bitte eintragen, wofür.'; errEl.classList.add('show'); whatEl.focus(); return;
    }
    saveDebtEntries(row, rows, row.entries.concat([{
      id: 'd_'+Date.now()+'_'+Math.random().toString(36).slice(2,8),
      amount: amount,
      what: what,
      createdAt: Date.now()
    }]));
  }
  document.getElementById('debtAddBtn').addEventListener('click', addEntry);
  whatEl.addEventListener('keydown', function(e){ if(e.key === 'Enter') addEntry(); });
  amountEl.addEventListener('keydown', function(e){ if(e.key === 'Enter') whatEl.focus(); });
  document.getElementById('debtBackBtn').addEventListener('click', function(){ renderDebtOverview(rows); });
  var clearBtn = document.getElementById('debtClearBtn');
  if(clearBtn){
    clearBtn.addEventListener('click', function(){
      uiConfirm('Alles beglichen?', (row.stu.displayName||row.stu.username)+' hat '+fmtChf(row.total)+' bezahlt. Alle Einträge werden gelöscht.', 'Ja, beglichen', function(){
        saveDebtEntries(row, rows, []);
      }, true);
    });
  }
  Array.prototype.forEach.call(document.querySelectorAll('.debt-del'), function(b){
    b.addEventListener('click', function(){
      var id = b.getAttribute('data-id');
      saveDebtEntries(row, rows, row.entries.filter(function(e){ return e.id !== id; }));
    });
  });
}
function saveDebtEntries(row, rows, entries){
  // Ganzes Dokument ersetzen (kein merge): nur so verschwinden gelöschte
  // Einträge auch wirklich aus dem Array.
  setDoc(kdoc('debts', row.stu.uid), { entries: entries, updatedAt: serverTimestamp() }).then(function(){
    row.entries = entries;
    row.total = debtSum(entries);
    teacherDebtCount = rows.filter(function(r){ return r.total > 0; }).length;
    updateCoinButton();
    toast('Gespeichert.');
    renderDebtDetail(row, rows);
  }).catch(function(err){
    console.error(err);
    toast('Konnte nicht gespeichert werden.');
  });
}

function csvField(v){
  var s = v==null ? '' : String(v);
  if(/[",\n]/.test(s)) s = '"'+s.replace(/"/g,'""')+'"';
  return s;
}
function downloadTextFile(filename, text, mime){
  var blob = new Blob(['﻿'+text], {type:(mime||'text/plain')+';charset=utf-8'});
  var url = URL.createObjectURL(blob);
  var a = document.createElement('a');
  a.href = url; a.download = filename;
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  setTimeout(function(){ URL.revokeObjectURL(url); }, 1000);
}

/* ===================== DARSTELLUNG (Dark/Light Mode) ===================== */

function currentEffectiveTheme(){
  var explicit = document.documentElement.getAttribute('data-theme');
  if(explicit === 'dark' || explicit === 'light') return explicit;
  return (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches) ? 'dark' : 'light';
}
function toggleTheme(){
  var next = currentEffectiveTheme() === 'dark' ? 'light' : 'dark';
  document.documentElement.setAttribute('data-theme', next);
  try{ localStorage.setItem('hl_theme', next); }catch(e){}
  var btn = document.getElementById('themeToggleBtn');
  if(btn) btn.textContent = next === 'dark' ? '☀️' : '🌙';
}

/* ===================== AUTH ===================== */

function slugName(name){
  return name.trim().toLowerCase()
    .replace(/ä/g,'ae').replace(/ö/g,'oe').replace(/ü/g,'ue').replace(/ß/g,'ss')
    .replace(/[^a-z0-9-]/g,'');
}

async function doLogin(rawName, password){
  var slug = slugName(rawName);
  if(!slug){ throw new Error('leer'); }
  // Nach jedem Login landet die Lehrperson wieder in der eigenen Klasse.
  try{ sessionStorage.removeItem(KLASSE_ANSICHT_KEY); sessionStorage.removeItem(LEITUNG_ANSICHT_KEY); }catch(e){}
  await setPersistence(auth, browserLocalPersistence);
  var kandidaten = LOGIN_ALIASES[slug] || [slug];
  var lastErr = null;
  for(var i=0; i<kandidaten.length; i++){
    try{
      await signInWithEmailAndPassword(auth, kandidaten[i] + '@' + EMAIL_DOMAIN, password);
      return;
    }catch(err){
      lastErr = err;
      if(err && err.code === 'auth/too-many-requests') break;
    }
  }
  throw lastErr;
}

function doLogout(){
  stopResourceSync();   // offenen Übungsstand noch sichern, solange die Rechte da sind
  stopTimeTracking();   // dito für die Lernzeit
  Object.values(state.progressUnsubs).forEach(function(fn){ try{fn();}catch(e){} });
  state.progressUnsubs = {};
  clearSubjectWatchers();
  stopTeacherTodoWatcher();
  stopPflanzenWatcher();
  stopQuizWatcher();
  stopUmfrageWatcher();
  erledigt = { ids:{}, loaded:false, uid:null };
  // Auch den Ämtliplan vergessen: sonst sieht die naechste Person auf demselben
  // Geraet noch den zwischengespeicherten Stand der vorherigen Sitzung.
  aemtliState = { cfg:null, roster:[], loaded:false, exists:false, inflight:null };
  try{ sessionStorage.removeItem(KLASSE_ANSICHT_KEY); sessionStorage.removeItem(LEITUNG_ANSICHT_KEY); }catch(e){}
  // Nach dem Abmelden neu laden: Klassenliste, Werkzeuge und Zwischenspeicher
  // gehören zur Klasse der bisherigen Person und dürfen nicht stehen bleiben,
  // wenn sich auf demselben Gerät jemand aus einer anderen Klasse anmeldet.
  signOut(auth).then(function(){ location.reload(); }, function(){ location.reload(); });
}

var lastAuthedUid = null;
onAuthStateChanged(auth, async function(user){
  // onAuthStateChanged feuert nicht nur bei An-/Abmeldung, sondern z.B. auch
  // nach stillem Token-Refresh erneut für dieselbe Person - ohne diese Sperre
  // hat das mitten in einem offenen Dialog (z.B. Hausaufgabe eintragen) auf
  // "Start" zurückgesetzt und so unbemerkt den bereits getippten Text riskiert.
  if(user && lastAuthedUid && user.uid === lastAuthedUid){ state.user = user; return; }
  state.user = user;
  if(!user){
    lastAuthedUid = null;
    state.profile = null;
    state.klasse = null;
    state.route = {name:'login'};
    closePencilBubble();
    stopDebtWatch();
    stopQuizWatcher();
    stopUmfrageWatcher();
    stopPruefungWatcher();
    applyPencilEggVisibility();
    render();
    return;
  }
  try{
    var snap = await getDoc(doc(db, 'students', user.uid));
    if(!snap.exists()){
      toast('Kein Profil gefunden – bitte Lehrperson kontaktieren.');
      await signOut(auth);
      return;
    }
    lastAuthedUid = user.uid;
    state.profile = snap.data();
    if(!state.profile.klasse) state.profile.klasse = 'G3b';
    state.klasse = state.profile.klasse;
    if(state.profile.role === 'leitung'){
      var ansicht = null;
      try{ ansicht = sessionStorage.getItem(LEITUNG_ANSICHT_KEY); }catch(e){}
      state.profile.leitung = true;
      state.profile.role = ansicht === 'schueler' ? 'student' : 'teacher';
    }
    if(state.profile.role === 'teacher' || isLeitung()){
      var gewaehlt = null;
      try{ gewaehlt = sessionStorage.getItem(KLASSE_ANSICHT_KEY); }catch(e){}
      if(gewaehlt && KLASSEN.some(function(k){ return k.id === gewaehlt; })) state.klasse = gewaehlt;
    }
    state.route = {name:'home'};
    render();
    loadPencilEgg();
    startDebtWatch();
    startQuizWatcher();
    startUmfrageWatcher();
    startPruefungWatcher();
    // Ämtliplan gleich nach dem Anmelden im Hintergrund holen. Er ist winzig,
    // wird von Startseiten-Hinweis, Besen und Plan gleichermassen gebraucht —
    // und ohne dieses Vorladen sah man beim ersten Öffnen des Plans erst ein
    // paar Sekunden "Wird geladen ...", weil zwei Firestore-Abfragen nacheinander
    // ueber die Leitung mussten.
    aemtliLoad();
    if(state.profile.role === 'teacher'){
      if(!isLeitung()) aemtliGrossStart();
      refreshFrageboxBadge();
    } else {
      loadStreak().then(updateStreakButton);
      erledigtLoad();
    }
  }catch(err){
    console.error(err);
    toast('Fehler beim Laden des Profils.');
  }
});

function goSubject(id, folderId){

  state.route = {name:'resource', resource:res}; render();
}

      btn.disabled = false;

  });

function progressFor(resourceId){ return state.progressCache[resourceId] || null; }

function watchProgress(resourceId, onChange){
  if(state.progressUnsubs[resourceId]) return;
  var ref_ = doc(db, 'progress', state.user.uid, 'resources', resourceId);
  state.progressUnsubs[resourceId] = onSnapshot(ref_, function(snap){
    var data = snap.exists() ? snap.data() : null;
    var stats = (data && data.stats) || {};
    var total = data && typeof data.total === 'number' ? data.total : null;
    var attempted = 0, correct = 0;
    Object.keys(stats).forEach(function(k){
      if(stats[k] && stats[k].status){ attempted++; if(stats[k].status==='correct') correct++; }
    });
    state.progressCache[resourceId] = {
      attempted:attempted, correct:correct, total:total,
      coveragePct: total ? Math.round(attempted/total*100) : null,
      // "% richtig" muss mit der Formel in den Übungsseiten selbst übereinstimmen
      // (naehrstoffe_training.html / industrialisierung_training.html:
      // richtig / ALLE Aufgaben insgesamt, sinkt nie mehr) — vorher stand hier
      // richtig/bereits-bearbeitet, was bei wenigen Versuchen fälschlich hoch
      // wirkte und nicht zur Anzeige in der Übung selbst passte.
      correctPct: total ? Math.round(correct/total*100) : (attempted ? Math.round(correct/attempted*100) : null)
    };
    if(onChange) onChange(state.progressCache[resourceId]);
  }, function(err){ console.error(err); });
}

function unwatchAllProgress(){
  Object.values(state.progressUnsubs).forEach(function(fn){ try{fn();}catch(e){} });
  state.progressUnsubs = {};
}

/* ===================== ORDNER: Datenmodell & Helfer =====================

   Firestore-Collection `folders`:
     folders/{folderId} -> {subject, parentId, name, order, createdAt, createdBy}
       parentId === null  ->  Ordner liegt direkt im Fach
       parentId === '<id>' -> Ordner liegt in diesem Ordner (beliebig tief)

   Eine Übung (resources/{id}) liegt in genau einem Container:
     folderId fehlt/null   ->  direkt im Fach  (so liegen alle Altbestände)
     folderId === '<id>'   ->  in diesem Ordner

   Beide Queries filtern NUR nach `subject` (reine Gleichheitsbedingung, kein
   orderBy) — damit braucht es weiterhin KEINEN Firestore-Composite-Index.
   Sortiert und verschachtelt wird alles im Client; pro Fach sind es nur ein
   paar Dutzend Dokumente.
   ===================================================================== */

var MAX_FOLDER_DEPTH = 6;   // Sicherheitsnetz gegen versehentlich tiefe Bäume

function clearSubjectWatchers(){
  if(state.resourceUnsub){ try{ state.resourceUnsub(); }catch(e){} state.resourceUnsub = null; }
  if(state.folderUnsub){ try{ state.folderUnsub(); }catch(e){} state.folderUnsub = null; }
}

function folderById(id){
  if(!id) return null;
  for(var i=0;i<state.folders.length;i++){ if(state.folders[i].id === id) return state.folders[i]; }
  return null;
}

// Kette vom obersten Ordner bis zum angegebenen (für die Brotkrumen-Navigation).
// Der Zähler bricht ab, falls je ein Zyklus in den Daten landen sollte.
function folderChain(folderId){
  var chain = [], guard = 0, cur = folderById(folderId);
  while(cur && guard++ < 50){ chain.unshift(cur); cur = folderById(cur.parentId); }
  return chain;
}

function foldersIn(parentId){
  var list = state.folders.filter(function(f){ return (f.parentId || null) === (parentId || null); });
  sortByOrder(list, 'name');
  return list;
}

function resourcesIn(folderId){
  var list = state.resources.filter(function(r){ return (r.folderId || null) === (folderId || null); });
  sortResources(list);
  return list;
}

// Alle Nachfahren-Ordner-Ids (inkl. des Ordners selbst) — für die Zählung im
// Ordner-Kärtchen und um zu verhindern, dass ein Ordner in sich selbst wandert.
function subtreeIds(folderId){
  var ids = [folderId], queue = [folderId], guard = 0;
  while(queue.length && guard++ < 500){
    var cur = queue.shift();
    state.folders.forEach(function(f){
      if((f.parentId || null) === cur && ids.indexOf(f.id) < 0){ ids.push(f.id); queue.push(f.id); }
    });
  }
  return ids;
}

function subtreeCounts(folderId){
  var ids = subtreeIds(folderId);
  var res = state.resources.filter(function(r){ return ids.indexOf(r.folderId || null) >= 0; });
  return { folders: ids.length - 1, resources: res.length, hasCurrent: res.some(function(r){ return !!r.current; }) };
}

function folderDepth(folderId){ return folderChain(folderId).length; }

function sortByOrder(list, fallbackField){
  list.sort(function(a,b){
    var oa = typeof a.order === 'number' ? a.order : null;
    var ob = typeof b.order === 'number' ? b.order : null;
    if(oa !== null && ob !== null && oa !== ob) return oa - ob;
    if(oa !== null && ob === null) return -1;
    if(oa === null && ob !== null) return 1;
    return String(a[fallbackField]||'').localeCompare(String(b[fallbackField]||''), 'de');
  });
  return list;
}

/* ===================== 📐 LMVZ-Lehrmittel in Mathe (virtuelle Ordner) =====================
   Die Online-Übungen von «Mathematik 1–3 Sekundarstufe I» (003.lmvz.ch) stehen
   als statischer Katalog in assets/lmvz-mathe.json (einmal von den LMVZ-Seiten
   ausgelesen). Daraus entstehen im Fach Mathe Ordner und Übungen, die NICHT in
   Firestore liegen: Lehrmittel › Kapitel › Unterkapitel › Onlineübungen › I/II/III
   (+ «Extras» nur für Lehrpersonen). Grund: ~1200 Einträge pro Klasse als
   Firestore-Dokumente würden bei jedem Öffnen von Mathe gelesen.
   Virtuelle Einträge haben `virtual:true` und Ids mit Präfix `lmvz_`; echte
   Übungen/Ordner dürfen trotzdem darin liegen (folderId/parentId = lmvz_...).
   HTML-Übungen öffnen im normalen Viewer (iframe direkt von lmvz.ch, `linkUrl`),
   alles andere (PDF/Word/Excel, fremde Seiten) über `externalUrl` im neuen Tab.
   Kopieren wäre sinnlos: die Seiten laden Skripte/GeoGebra relativ vom LMVZ-Server. */
var LMVZ_SUBJECT = 'mathe';
var LMVZ_CATALOG_VERSION = 2;   // bei jeder Änderung an assets/lmvz-mathe.json erhöhen (Browser-Cache)
var LMVZ_PYTHAGORAS_FOLDER = 'lmvz_m2_2a';
var lmvzCatalogPromise = null;
function lmvzLoadCatalog(){
  if(!lmvzCatalogPromise){
    lmvzCatalogPromise = fetch('assets/lmvz-mathe.json?v='+LMVZ_CATALOG_VERSION).then(function(r){
      if(!r.ok) throw new Error('HTTP '+r.status);
      return r.json();
    }).catch(function(err){ lmvzCatalogPromise = null; throw err; });
  }
  return lmvzCatalogPromise;
}
function lmvzBuild(cat, isTeacher){
  var folders = [], resources = [];
  function fold(id, parentId, name, order, extra){
    folders.push(Object.assign({id:id, subject:LMVZ_SUBJECT, parentId:parentId, name:name, order:order, virtual:true}, extra || {}));
  }
  function items(list, folderId){
    list.forEach(function(it, i){
      var url = /^https?:/.test(it[2]) ? it[2] : cat.base + it[2];
      var nr = String(it[0] || '').replace(/^Aufgabe\s+/i, '');
      var r = {id:folderId+'_'+i, subject:LMVZ_SUBJECT, folderId:folderId, order:i, virtual:true,
               title:(nr ? nr+' · ' : '')+it[1]};
      // Nur LMVZ-HTML läuft im Viewer; Dokumente und fremde Seiten im neuen Tab.
      if(url.indexOf(cat.base) === 0 && /\.html?$/i.test(url)) r.linkUrl = url; else r.externalUrl = url;
      resources.push(r);
    });
  }
  (cat.lm || []).forEach(function(lm, li){
    var lmId = 'lmvz_'+lm.id;
    fold(lmId, null, lm.name, -1000 + li);
    lm.kap.forEach(function(k, ki){
      var kId = lmId+'_k'+k.nr;
      fold(kId, lmId, k.nr+'. Kapitel'+(k.name ? ': '+k.name : ''), ki);
      k.subs.forEach(function(s, si){
        var sId = lmId+'_'+s.id, onId = sId+'_on';
        fold(sId, kId, s.name, si);
        fold(onId, sId, 'Onlineübungen', -1000);
        ['1','2','3'].forEach(function(n, ni){
          fold(onId+'_n'+n, onId, ['I','II','III'][ni], ni, {lmvzLeaf:true});
          items(s[n] || [], onId+'_n'+n);
        });
        if(s.tb && s.tb.length){ fold(onId+'_tb', onId, 'Themenbuch', 3, {lmvzLeaf:true}); items(s.tb, onId+'_tb'); }
        if(isTeacher && s.x && s.x.length){ fold(sId+'_x', sId, 'Extras (nur Lehrperson)', -999, {lmvzLeaf:true}); items(s.x, sId+'_x'); }
      });
    });
  });
  return {folders:folders, resources:resources};
}
// Hängt die virtuellen Einträge an state.folders/state.resources an (nach jedem
// Firestore-Snapshot erneut, weil der die Listen komplett neu aufbaut).
function lmvzMerge(){
  var v = state.lmvzV;
  state.folders = state.folders.filter(function(f){ return !f.virtual; });
  state.resources = state.resources.filter(function(r){ return !r.virtual; });
  if(!v || state.route.subject !== LMVZ_SUBJECT) return;
  state.folders = state.folders.concat(v.folders);
  state.resources = state.resources.concat(v.resources);
}
// Einmalig pro Klasse (nur eigene Klasse der Lehrperson): die bisherige
// Pythagoras/Thales-Übung in «Mathematik 2 › 2a» einsortieren.
function lmvzMovePythagoras(){
  if(!state.profile || state.profile.role !== 'teacher' || isFremdeKlasse()) return;
  var key = LIB_PREFIX + 'lmvzPyth_' + state.klasse;
  if(lsGet(key)) return;
  var hits = state.resources.filter(function(r){
    return !r.virtual && /pythagoras|thales/i.test(r.title || r.fileName || '') && r.folderId !== LMVZ_PYTHAGORAS_FOLDER;
  });
  lsSet(key, '1');
  if(!hits.length) return;
  var target = resourcesIn(LMVZ_PYTHAGORAS_FOLDER).length;
  var batch = writeBatch(db);
  hits.forEach(function(r, i){ batch.update(kdoc('resources', r.id), {folderId: LMVZ_PYTHAGORAS_FOLDER, order: target + i, prevOrder: null}); });
  batch.commit().then(function(){ toast('Pythagoras/Thales liegt jetzt in Mathematik 2 › 2a.'); })
    .catch(function(err){ console.error(err); lsSet(key, ''); });
}

   Bewusst KEIN window.confirm/alert/prompt: native Dialoge erzwingen einen
   Fullscreen-Exit und können die im Viewer eingebettete Übungsseite in einen
   kaputten, leeren Zustand bringen (siehe Projekt-Notiz zum Reset-Bug).
   ========================================================= */

var modalEl = document.getElementById('modalOverlay');

function closeModal(){
  modalEl.classList.remove('show'); modalEl.innerHTML = '';
  if(debtHoverActive){ debtHoverActive = false; debtLoadToken++; coinHover.reset(); }
}

function openModal(innerHtml, extraClass){
  modalEl.innerHTML = '<div class="modal'+(extraClass?' '+extraClass:'')+'" role="dialog" aria-modal="true">'+innerHtml+'</div>';
  modalEl.classList.add('show');
  // Klick auf den abgedunkelten Rand schliesst den Dialog - aber nur wenn
  // Mousedown UND Mouseup beide auf dem Rand liegen. Sonst schliesst sich der
  // Dialog fälschlich, sobald man beim Tippen Text in einem Feld markiert und
  // die Maus dabei über den Rand hinaus zieht (Mouseup landet dann auf
  // modalEl statt im Feld) - dabei ging bisher der bereits getippte Text
  // verloren.
  var mouseDownOnOverlay = false;
  modalEl.onmousedown = function(e){ mouseDownOnOverlay = (e.target === modalEl); };
  modalEl.onclick = function(e){
    if(mouseDownOnOverlay && e.target === modalEl) closeModal();
    mouseDownOnOverlay = false;
  };
  document.addEventListener('keydown', modalEscHandler);
}
function modalEscHandler(e){
  if(e.key === 'Escape' && modalEl.classList.contains('show')){
    closeModal();
    document.removeEventListener('keydown', modalEscHandler);
  }
}

function uiPrompt(title, description, defaultValue, okLabel, onOk){
  openModal(

/* ===================== KLASSE WECHSELN (Lehrperson) =====================
   Der Wechsel lädt die Seite neu: so beginnen alle Listener, Zwischenspeicher
   und Werkzeuge sauber in der neuen Klasse, statt dass irgendwo noch Daten der
   alten Klasse hängen bleiben. Die Wahl gilt nur für diesen Tab
   (sessionStorage) — nach einem neuen Login oder App-Start landet man wieder
   in der eigenen Klasse. */
function openKlassenWahl(){
  var h = '<h3>🏫 Klasse wechseln</h3><div class="klassen-wahl">';
  KLASSEN.forEach(function(k){
    var aktiv = k.id === state.klasse;
    var eigene = k.id === state.profile.klasse && !isLeitung();
    h += '<button class="btn '+(aktiv?'btn-primary':'btn-ghost')+'" type="button" data-klasse="'+esc(k.id)+'">'+
         '<span><b>'+esc(k.id)+'</b> · '+esc(k.lp)+(eigene?' (deine Klasse)':'')+(aktiv?' ✓':'')+'</span></button>';
  });
  h += '</div><div class="modal-actions"><button class="btn btn-ghost btn-sm" id="modalCancel" type="button">Schliessen</button></div>';
  openModal(h);
  document.getElementById('modalCancel').addEventListener('click', closeModal);
  modalEl.querySelectorAll('[data-klasse]').forEach(function(btn){
    btn.addEventListener('click', function(){ wechsleKlasse(btn.getAttribute('data-klasse')); });
  });
}
function wechsleKlasse(id){
  if(!state.profile || (state.profile.role !== 'teacher' && !isLeitung())) return;
  if(id === state.klasse){ closeModal(); return; }
  try{
    if(id === state.profile.klasse && !isLeitung()) sessionStorage.removeItem(KLASSE_ANSICHT_KEY);
    else sessionStorage.setItem(KLASSE_ANSICHT_KEY, id);
  }catch(e){
    toast('Klassenwechsel ist in diesem Browser nicht möglich.');
    return;
  }
  stopResourceSync();
  stopTimeTracking();
  app.innerHTML = '<div class="spinner-wrap">Wechsle zur Klasse '+esc(id)+' …</div>';
  closeModal();
  location.reload();
}

/* ===================== ⚙️ EINSTELLUNGEN =====================
   Für alle: Passwort ändern, Abmelden. Für Lehrpersonen zusätzlich:
   - Vorschläge: Übungen, die eine andere Lehrperson in IHRER Klasse neu
     hochgeladen hat (Originale ohne originKlasse) und die es in der offenen
     Klasse noch nicht gibt. "Aktivieren" legt eine Kopie an: gleiche ID,
     gleicher Inhalt (contentId), originKlasse/originVersion merken die Herkunft.
   - Aktualisierungen: Kopien, deren Original inzwischen ersetzt wurde
     (version > originVersion). "Übernehmen" hängt die Kopie an den neuen
     Inhalt, "Ignorieren" merkt sich nur die Version.
   Ausgeblendete Vorschläge: klassen/{klasse}/appMeta/vorschlaege.hidden. */
var settingsCache = { at:0, klasse:null, data:null };

async function loadKlassenAbgleich(force){
  if(!force && settingsCache.data && settingsCache.klasse === state.klasse && Date.now() - settingsCache.at < 60000){
    return settingsCache.data;
  }
  var klasse = state.klasse;
  var snaps = await Promise.all(KLASSEN.map(function(k){ return getDocs(kcolFor(k.id, 'resources')); }));
  var hiddenSnap = await getDoc(kdoc('appMeta', 'vorschlaege')).catch(function(){ return null; });
  var hidden = (hiddenSnap && hiddenSnap.exists() && hiddenSnap.data().hidden) || {};
  var byKlasse = {};
  KLASSEN.forEach(function(k, i){
    var map = {};
    snaps[i].forEach(function(d){ map[d.id] = Object.assign({id:d.id}, d.data()); });
    byKlasse[k.id] = map;
  });
  var own = byKlasse[klasse] || {};
  var vorschlaege = [], seen = {};
  KLASSEN.forEach(function(k){
    if(k.id === klasse) return;
    Object.keys(byKlasse[k.id]).forEach(function(id){
      var r = byKlasse[k.id][id];
      if(r.originKlasse || own[id] || hidden[id] || seen[id]) return;
      seen[id] = true;
      vorschlaege.push(Object.assign({quelle:k.id}, r));
    });
  });
  var updates = [];
  Object.keys(own).forEach(function(id){
    var c = own[id];
    if(!c.originKlasse || !byKlasse[c.originKlasse]) return;
    var o = byKlasse[c.originKlasse][id];
    if(o && (o.version || 0) > (c.originVersion || 0)) updates.push({copy:c, origin:o});
  });
  function ts(r){ var t = r.replacedAt || r.uploadedAt; return t && t.toDate ? t.toDate().getTime() : 0; }
  vorschlaege.sort(function(a,b){ return ts(b) - ts(a); });
  var data = { vorschlaege:vorschlaege, updates:updates };
  settingsCache = { at:Date.now(), klasse:klasse, data:data };
  return data;
}

function refreshSettingsBadge(force){
  if(!state.profile || state.profile.role !== 'teacher') return;

function paintSettingsAbgleich(force){
  loadKlassenAbgleich(force).then(function(d){
    setSettingsBadge(d);
    var upEl = document.getElementById('setUpdates');
    var vEl = document.getElementById('setVorschlaege');
    if(!upEl || !vEl) return;
    upEl.innerHTML = d.updates.length ? d.updates.map(function(u, i){
      return '<div class="settings-row"><div class="grow"><b>'+esc(u.copy.title || u.copy.fileName)+'</b>'+
        '<small>'+esc(subjectName(u.copy.subject))+' · '+esc(klasseInfo(u.copy.originKlasse).lp)+' ('+esc(u.copy.originKlasse)+') hat die Datei geändert</small></div>'+
        '<button class="btn btn-ghost btn-sm" type="button" data-up-ignore="'+i+'">Ignorieren</button>'+
        '<button class="btn btn-primary btn-sm" type="button" data-up-take="'+i+'">Übernehmen</button></div>';
    }).join('') : '<div class="empty-state" style="padding:10px;">Alle Kopien sind aktuell.</div>';
    vEl.innerHTML = d.vorschlaege.length ? d.vorschlaege.map(function(r, i){
      return '<div class="settings-row"><div class="grow"><b>'+esc(r.title || r.fileName)+'</b>'+
        '<small>'+esc(subjectName(r.subject))+' · von '+esc(klasseInfo(r.quelle).lp)+' ('+esc(r.quelle)+')</small></div>'+
        '<button class="btn btn-ghost btn-sm" type="button" data-v-open="'+i+'" title="Ansehen">👁️</button>'+
        '<button class="btn btn-ghost btn-sm" type="button" data-v-hide="'+i+'">Ausblenden</button>'+
        '<button class="btn btn-primary btn-sm" type="button" data-v-add="'+i+'">Aktivieren</button></div>';
    }).join('') : '<div class="empty-state" style="padding:10px;">Keine neuen Übungen.</div>';

    function wire(sel, fn){
      modalEl.querySelectorAll('['+sel+']').forEach(function(btn){
        btn.addEventListener('click', function(){
          btn.disabled = true;
          Promise.resolve(fn(parseInt(btn.getAttribute(sel), 10))).then(function(){
            paintSettingsAbgleich(true);
          }, function(err){
            console.error(err);
            btn.disabled = false;
            if(!err || err.code !== 'klasse/abgebrochen') toast('Hat nicht geklappt.');
          });
        });
      });
    }
    wire('data-up-take', function(i){
      var u = d.updates[i];
      var alt = resourceContentId(u.copy);
      return updateDoc(kdoc('resources', u.copy.id), {
        contentId: resourceContentId(u.origin),
        fileName: u.origin.fileName || u.copy.fileName || '',
        originVersion: u.origin.version || 0,
        replacedAt: serverTimestamp()
      }).then(function(){
        toast('Neue Fassung übernommen.');
        deleteContentIfUnused(alt);
      });
    });
    wire('data-up-ignore', function(i){
      var u = d.updates[i];
      return updateDoc(kdoc('resources', u.copy.id), { originVersion: u.origin.version || 0 });
    });
    wire('data-v-hide', function(i){
      var patch = {}; patch[d.vorschlaege[i].id] = true;
      return setDoc(kdoc('appMeta', 'vorschlaege'), { hidden: patch }, {merge:true});
    });
    wire('data-v-add', function(i){
      var r = d.vorschlaege[i];
      var copy = {
        subject: r.subject,
        folderId: null,
        title: r.title || r.fileName || 'Übung',
        fileName: r.fileName || '',
        uploadedAt: serverTimestamp(),
        uploadedBy: r.uploadedBy || null,
        contentId: resourceContentId(r),
        originKlasse: r.quelle,
        originVersion: r.version || 0
      };
      if(r.externalUrl) copy.externalUrl = r.externalUrl;
      return setDoc(kdoc('resources', r.id), copy).then(function(){
        toast('«'+copy.title+'» ist jetzt in '+subjectName(r.subject)+' ('+state.klasse+').');
      });
    });
    modalEl.querySelectorAll('[data-v-open]').forEach(function(btn){
      btn.addEventListener('click', function(){
        var r = d.vorschlaege[parseInt(btn.getAttribute('data-v-open'), 10)];
        closeModal();
        goResource(Object.assign({}, r, {vorschau:true, folderId:null}));
      });
    });
  }).catch(function(err){
    console.error(err);
    var upEl = document.getElementById('setUpdates');
    if(upEl) upEl.innerHTML = '<div class="empty-state" style="padding:10px;">Konnte nicht geladen werden.</div>';
    var vEl = document.getElementById('setVorschlaege');
    if(vEl) vEl.innerHTML = '';
  });
}

/* ===================== TESTSEITE: SOFORT LIVE =====================
   Nur auf der Testseite (IS_TEST_SITE) für die Lehrperson. Startet im Live-Repo
   den Workflow "Testseite live schalten" (sonst läuft er nachts um 00:00).
   Braucht einen fein begrenzten GitHub-Token (nur Repo helfenberger-library,
   nur "Actions: Read and write"), der nur in diesem Browser liegt - nie im Code.
   Key bewusst ohne hl_-Präfix (gehört der Shell-Logik nicht). */

const GO_LIVE_TOKEN_KEY = 'libtest_ghToken';
const GO_LIVE_DISPATCH_URL = 'https://api.github.com/repos/jnhbr/helfenberger-library/actions/workflows/nightly-release.yml/dispatches';

function goLiveToken(){
  try{ return localStorage.getItem(GO_LIVE_TOKEN_KEY) || ''; }catch(e){ return ''; }
}

// Solange die Klassen-Umstellung aussteht, würde "Jetzt live" den neuen Code
// vor den neuen Passwörtern/Regeln veröffentlichen. Nach der Umstellung auf
// false setzen (admin/klassen-accounts.js umstellen).
const KLASSEN_UMSTELLUNG_AUSSTEHEND = false;
function confirmGoLive(){
  if(KLASSEN_UMSTELLUNG_AUSSTEHEND){
    uiInfo('Noch nicht live schalten', 'Die Klassen-Umstellung (neue Logins, G3a/E1c) ist noch nicht abgeschlossen. Sie wird zusammen mit den neuen Passwörtern und Regeln live geschaltet.');
    return;
  }
  if(!goLiveToken()){ askGoLiveToken(); return; }
  uiConfirm('🚀 Jetzt live schalten?',
    'Der zuletzt gepushte Stand der Testseite wird sofort auf die Live-Seite übernommen. Nach ca. 1–2 Minuten sehen ihn die Schüler:innen (nach dem Neuladen).',
    'Live schalten', runGoLive);
}

function askGoLiveToken(message){
  openModal(
    '<h3>🔑 GitHub-Zugang für „Jetzt live"</h3>'+
    (message ? '<p><b>'+esc(message)+'</b></p>' : '')+
    '<p>Einmalig nötig, wird nur in diesem Browser gespeichert. So erstellst du ihn:</p>'+
    '<ol style="margin:0 0 12px 18px;padding:0;line-height:1.5">'+
      '<li><a href="https://github.com/settings/personal-access-tokens/new" target="_blank" rel="noopener">Neuen fein begrenzten Token erstellen</a> (Name z. B. „Library live schalten", Ablauf nach Wunsch)</li>'+
      '<li><i>Repository access</i>: <b>Only select repositories</b> → <b>helfenberger-library</b></li>'+
      '<li><i>Permissions → Actions</i>: <b>Read and write</b> (sonst nichts)</li>'+
      '<li>Token kopieren und hier einfügen</li>'+
    '</ol>'+
    '<input type="password" id="goLiveTokenInput" autocomplete="off" placeholder="github_pat_…">'+
    '<div class="modal-actions">'+
      '<button class="btn btn-ghost btn-sm" id="modalCancel" type="button">Abbrechen</button>'+
      '<button class="btn btn-primary btn-sm" id="modalOk" type="button">Speichern & live schalten</button>'+
    '</div>'
  );
  var input = document.getElementById('goLiveTokenInput');
  input.focus();
  function submit(){
    var v = input.value.trim();
    if(!v){ input.focus(); return; }
    try{ localStorage.setItem(GO_LIVE_TOKEN_KEY, v); }catch(e){}
    closeModal();
    runGoLive();
  }
  document.getElementById('modalOk').addEventListener('click', submit);
  document.getElementById('modalCancel').addEventListener('click', closeModal);
  input.addEventListener('keydown', function(e){ if(e.key === 'Enter') submit(); });
}

async function runGoLive(){
  var token = goLiveToken();
  if(!token){ askGoLiveToken(); return; }
  var btn = document.getElementById('goLiveBtn');
  if(btn) btn.disabled = true;
  try{
    var res = await fetch(GO_LIVE_DISPATCH_URL, {
      method: 'POST',
      headers: {
        'Authorization': 'Bearer ' + token,
        'Accept': 'application/vnd.github+json',
        'X-GitHub-Api-Version': '2022-11-28'
      },
      body: JSON.stringify({ref: 'main'})
    });
    if(res.status === 204){
      toast('🚀 Freigabe gestartet — in ca. 1–2 Minuten ist die Live-Seite aktuell.');
    } else if(res.status === 401 || res.status === 403 || res.status === 404){
      var ghMsg = '';
      try{ ghMsg = (await res.json()).message || ''; }catch(e){}
      try{ localStorage.removeItem(GO_LIVE_TOKEN_KEY); }catch(e){}
      var hint = res.status === 403
        ? 'Der Token hat nicht genug Rechte — unter Permissions muss bei „Actions" „Read and write" stehen (nicht Read-only).'
        : res.status === 404
          ? 'Der Token hat keinen Zugriff auf das Repo helfenberger-library (unter Repository access auswählen) oder bei „Actions" fehlt „Read and write".'
          : 'Der Token ist ungültig oder abgelaufen — bitte neu kopieren (ganzer Wert, beginnt mit github_pat_).';
      askGoLiveToken(hint + ' (GitHub: ' + res.status + (ghMsg ? ' – ' + ghMsg : '') + ')');
    } else {
      uiInfo('Live schalten fehlgeschlagen', 'GitHub antwortete mit Status ' + res.status + '. Alternativ im Live-Repo unter Actions → „Testseite live schalten" → Run workflow.');
    }
  }catch(err){
    console.error(err);
    uiInfo('Live schalten fehlgeschlagen', 'GitHub war nicht erreichbar. Bitte Internetverbindung prüfen und nochmals versuchen.');
  }finally{
    if(btn) btn.disabled = false;
  }
}

/* ===================== NOTENRECHNER (Schüler:innen) =====================
   Privater Rechner hinter dem 🎶-Knopf oben. Alles in EINEM Dokument
   progress/{uid}/noten/liste -> {faecher:{fachId:[{id,name,note,gewicht}]}}.
   Nur die Person selbst liest/schreibt es (siehe firestore.rules).
   Gespeichert wird immer das ganze Dokument per setDoc OHNE merge - mit
   merge:true würde ein gelöschtes Fach/eine gelöschte Note stehen bleiben.
   Dazu kommen die Noten aus Online-Prüfungen (progress/{uid}/pruefungsnoten/*,
   schreibt nur die Lehrperson beim «Resultate freigeben», siehe
   pruefNotenEintragen): fest angezeigt, zählen im Schnitt mit. */

var NOTEN_EXTRA_FAECHER = [
  {id:'englisch', name:'Englisch', color:'#2B59C3'},
  {id:'franzoesisch', name:'Französisch', color:'#3867D6'},
  {id:'textiles-werken', name:'Textiles Werken', color:'#C2507A'},
  {id:'zeichnen', name:'Zeichnen', color:'#E0A800'}
];
function notenFaecher(){
  return SUBJECTS.filter(function(s){ return !s.teacherOnly && s.id !== 'berufswahl'; })
    .map(function(s){ return {id:s.id, name:s.name, color:s.color}; })
    .concat(NOTEN_EXTRA_FAECHER)
    .sort(function(a,b){ return a.name.localeCompare(b.name, 'de'); });
}
function notenFachById(id){
  return notenFaecher().find(function(f){ return f.id === id; }) || {id:id, name:id, color:'#556270'};
}

var noten = { faecher:{}, uid:null, offen:{}, pruef:[] };

function notenRef(){ return doc(db, 'progress', state.user.uid, 'noten', 'liste'); }

function notenLoad(){
  var eigene = noten.uid === state.user.uid ? Promise.resolve() : getDoc(notenRef()).then(function(snap){
    noten.faecher = (snap.exists() && snap.data().faecher) || {};
    noten.uid = state.user.uid;
  });
  // Prüfungsnoten jedes Mal frisch: die Lehrperson kann sie inzwischen eingetragen oder entfernt haben.
  var pruefNoten = getDocs(collection(db, 'progress', state.user.uid, 'pruefungsnoten')).then(function(snap){
    var l = [];
    snap.forEach(function(d){ var x = d.data(); if(x && typeof x.note === 'number' && x.fach) l.push(Object.assign({id:d.id}, x)); });
    noten.pruef = l;
  }).catch(function(err){ console.error('Prüfungsnoten', err); });
  return Promise.all([eigene, pruefNoten]).then(function(){ return noten.faecher; });
}
function notenPruefVon(fach){ return (noten.pruef || []).filter(function(n){ return n.fach === fach; }); }
function notenSave(){
  return setDoc(notenRef(), { faecher: noten.faecher, updatedAt: serverTimestamp() })
    .catch(function(err){ console.error(err); toast('Noten konnten nicht gespeichert werden.'); });
}
function parseNote(v){
  var n = parseFloat(String(v||'').replace(',', '.'));
  return isFinite(n) ? n : NaN;
}
function notenSchnitt(liste){
  var sum = 0, w = 0;
  liste.forEach(function(n){
    var g = Number(n.gewicht), v = Number(n.note);
    if(!(g > 0) || !isFinite(v)) return;
    sum += v * g; w += g;
  });
  return w > 0 ? sum / w : null;
}
function fmtNote(n){ return String(Math.round(n * 100) / 100); }

function openNotenrechner(){
  openModal('<h3>🎶 Notenrechner</h3><div id="notenBody"><div class="noten-empty">Wird geladen …</div></div>', 'modal-wide');
  notenLoad().then(paintNotenrechner).catch(function(err){
    console.error(err);
    var b = document.getElementById('notenBody');
    if(b) b.innerHTML = '<div class="noten-empty">Noten konnten nicht geladen werden.</div>';
  });
}

function paintNotenrechner(){
  var body = document.getElementById('notenBody');
  if(!body) return;
  var faecher = notenFaecher();
  var h = '<div class="noten-add">'+
    '<div class="noten-add-wide"><label class="modal-label">Fach</label><select id="notenFach">'+
      faecher.map(function(f){ return '<option value="'+esc(f.id)+'">'+esc(f.name)+'</option>'; }).join('')+
    '</select></div>'+
    '<div class="noten-add-wide"><label class="modal-label">Prüfung</label><input type="text" id="notenName" maxlength="60" placeholder="z.B. Prüfung Bruchrechnen"></div>'+
    '<div><label class="modal-label">Note</label><input type="number" id="notenWert" min="1" max="6" step="0.25" placeholder="z.B. 4.5"></div>'+
    '<div><label class="modal-label">Gewichtung</label><input type="number" id="notenGewicht" min="0" max="10" step="0.5" value="1"></div>'+
    '<div class="login-err noten-add-wide" id="notenErr"></div>'+
    '<button class="btn btn-primary btn-sm" id="notenAddBtn" type="button">+ Note hinzufügen</button>'+
  '</div>';

  var ids = Object.keys(noten.faecher).filter(function(id){ return (noten.faecher[id]||[]).length; });
  (noten.pruef || []).forEach(function(n){ if(ids.indexOf(n.fach) < 0) ids.push(n.fach); });
  ids.sort(function(a,b){ return notenFachById(a).name.localeCompare(notenFachById(b).name, 'de'); });
  if(!ids.length){
    h += '<div class="noten-empty">Noch keine Noten eingetragen.</div>';
  }
  ids.forEach(function(id){
    var f = notenFachById(id), liste = noten.faecher[id] || [], fix = notenPruefVon(id);
    var avg = notenSchnitt(liste.concat(fix));
    h += '<details class="noten-fach" data-fach="'+esc(id)+'" style="--nf-c:'+esc(f.color)+'"'+(noten.offen[id] === false ? '' : ' open')+'>'+
      '<summary><span class="noten-fach-name">'+esc(f.name)+' <span class="noten-fach-count">('+(liste.length + fix.length)+')</span></span>'+
      '<span class="noten-schnitt">Ø '+(avg === null ? '–' : esc(fmtNote(avg))+'<small>≈ '+esc((Math.round(avg*2)/2).toFixed(1))+'</small>')+'</span></summary>'+
      '<div class="noten-rows">'+
      '<div class="noten-row noten-row-head"><span>Prüfung</span><span>Note</span><span>Gewicht</span><span></span></div>'+
      fix.map(function(n){
        return '<div class="noten-row noten-row-fix" title="Von der Lehrperson aus der Online-Prüfung eingetragen">'+
          '<span>📝 '+esc(n.name || 'Prüfung')+'</span><span>'+esc(fmtNote(n.note))+'</span><span>'+esc(String(n.gewicht))+'</span><span>🔒</span></div>';
      }).join('')+
      liste.map(function(n){
        return '<div class="noten-row" data-id="'+esc(n.id)+'">'+
          '<input type="text" class="noten-in" data-k="name" maxlength="60" value="'+esc(n.name||'')+'" placeholder="Prüfung">'+
          '<input type="number" class="noten-in" data-k="note" min="1" max="6" step="0.25" value="'+esc(String(n.note))+'">'+
          '<input type="number" class="noten-in" data-k="gewicht" min="0" max="10" step="0.5" value="'+esc(String(n.gewicht))+'">'+
          '<button class="btn btn-ghost btn-sm noten-del" type="button" title="Note entfernen">✕</button>'+
        '</div>';
      }).join('')+
      '</div></details>';
  });
  h += '<p class="noten-hint">ℹ️ Das ist nur eine Hilfe für dich. Deine Lehrperson kann bei der Zeugnisnote auch dein Verhalten und deine Mitarbeit im Unterricht einbeziehen – die hier berechnete Note ist also nicht verbindlich.</p>';
  h += '<div class="modal-actions"><button class="btn btn-primary btn-sm" id="notenClose" type="button">Schliessen</button></div>';
  body.innerHTML = h;

  document.getElementById('notenClose').addEventListener('click', closeModal);
  var nameEl = document.getElementById('notenName');
  var wertEl = document.getElementById('notenWert');
  var gewEl = document.getElementById('notenGewicht');
  function add(){
    var errEl = document.getElementById('notenErr');
    errEl.classList.remove('show');
    var fach = document.getElementById('notenFach').value;
    var note = parseNote(wertEl.value), gewicht = parseNote(gewEl.value);
    if(!(note >= 1 && note <= 6)){ errEl.textContent = 'Bitte eine Note zwischen 1 und 6 eingeben.'; errEl.classList.add('show'); wertEl.focus(); return; }
    if(!(gewicht > 0 && gewicht <= 10)){ errEl.textContent = 'Bitte eine Gewichtung grösser als 0 eingeben.'; errEl.classList.add('show'); gewEl.focus(); return; }
    if(!noten.faecher[fach]) noten.faecher[fach] = [];
    noten.faecher[fach].push({ id:'n_'+Date.now()+'_'+Math.random().toString(36).slice(2,6), name:nameEl.value.trim().slice(0,60), note:note, gewicht:gewicht });
    noten.offen[fach] = true;
    notenSave();
    var keepFach = fach;
    paintNotenrechner();
    var sel = document.getElementById('notenFach');
    if(sel) sel.value = keepFach;
  }
  document.getElementById('notenAddBtn').addEventListener('click', add);
  [nameEl, wertEl, gewEl].forEach(function(el){ el.addEventListener('keydown', function(e){ if(e.key === 'Enter') add(); }); });

  Array.prototype.forEach.call(body.querySelectorAll('.noten-fach'), function(det){
    var fach = det.getAttribute('data-fach');
    det.addEventListener('toggle', function(){ noten.offen[fach] = det.open; });
    Array.prototype.forEach.call(det.querySelectorAll('.noten-row[data-id]'), function(row){
      var id = row.getAttribute('data-id');
      function item(){ return (noten.faecher[fach]||[]).find(function(n){ return n.id === id; }); }
      Array.prototype.forEach.call(row.querySelectorAll('.noten-in'), function(inp){
        inp.addEventListener('change', function(){
          var n = item(); if(!n) return;
          var k = inp.getAttribute('data-k');
          if(k === 'name'){ n.name = inp.value.trim().slice(0,60); notenSave(); return; }
          var v = parseNote(inp.value);
          var ok = k === 'note' ? (v >= 1 && v <= 6) : (v > 0 && v <= 10);
          if(!ok){ inp.value = String(n[k]); toast(k === 'note' ? 'Note muss zwischen 1 und 6 liegen.' : 'Gewichtung muss grösser als 0 sein.'); return; }
          n[k] = v;
          notenSave();
          var avg = notenSchnitt((noten.faecher[fach] || []).concat(notenPruefVon(fach)));
          var el = det.querySelector('.noten-schnitt');
          if(el) el.innerHTML = 'Ø '+(avg === null ? '–' : esc(fmtNote(avg))+'<small>≈ '+esc((Math.round(avg*2)/2).toFixed(1))+'</small>');
        });
      });
      row.querySelector('.noten-del').addEventListener('click', function(){
        noten.faecher[fach] = (noten.faecher[fach]||[]).filter(function(n){ return n.id !== id; });
        if(!noten.faecher[fach].length) delete noten.faecher[fach];
        notenSave();
        paintNotenrechner();
      });
    });
  });
}
