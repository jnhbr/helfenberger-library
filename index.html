  .sp-table-sel{outline:2px solid var(--brand);outline-offset:2px;z-index:3;}
  .sp-seat{flex:1;min-width:0;border:none;background:transparent;font:inherit;font-size:11px;font-weight:700;color:#3A2A18;display:flex;align-items:center;justify-content:center;cursor:pointer;padding:0 2px;border-right:1px dashed rgba(0,0,0,.25);}
  .sp-seat:last-child{border-right:none;}
  .sp-seat span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%;}
  .sp-seat span.sp-seat-shared{white-space:normal;line-height:1.05;font-size:.85em;text-align:center;}
  .sp-seat-shared i{font-style:normal;font-weight:600;color:#7A4E12;}
  .sp-people-gast-head{font-size:12px;font-weight:700;color:var(--text-muted);margin:10px 0 4px;}
  .sp-seat-on{background:#FFF3DF;}
  .sp-seat.sp-g-m{background:#DCE9FB;}
  .sp-seat.sp-g-w{background:#FBE0EE;}
  .sp-mini{position:absolute;width:22px;height:22px;border-radius:50%;border:none;font-size:12px;line-height:1;cursor:pointer;background:var(--brand);color:var(--brand-contrast);z-index:4;}
  .sp-mini-rot{top:-11px;left:-11px;}
  .sp-mini-del{top:-11px;right:-11px;background:var(--bad);color:#fff;}
  .sp-side{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:14px;}
  .sp-side-head{display:flex;justify-content:space-between;align-items:baseline;font-weight:700;margin-bottom:8px;}
  .sp-side-head span{font-size:12px;font-weight:500;color:var(--text-muted);}
  .sp-hint{font-size:12px;color:var(--text-muted);margin-bottom:10px;line-height:1.45;}
  .sp-people{display:flex;flex-direction:column;gap:5px;max-height:52vh;overflow:auto;}
  .sp-person{display:flex;align-items:center;gap:6px;}
  .sp-person-name{flex:1;min-width:0;text-align:left;border:1px solid var(--border);background:var(--surface-2);border-radius:8px;padding:6px 9px;font:inherit;font-size:13px;color:var(--text);cursor:pointer;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .sp-person-seated .sp-person-name{opacity:.5;}
  .sp-person-picked .sp-person-name{border-color:var(--brand);background:var(--brand);color:var(--brand-contrast);opacity:1;}
  .sp-person-abs .sp-person-name{text-decoration:line-through;opacity:.4;}
  .sp-person-tags{display:flex;gap:3px;}
  .sp-tag{border:1px solid var(--border);background:var(--surface);color:var(--text-muted);border-radius:6px;font:inherit;font-size:10.5px;font-weight:700;padding:4px 6px;cursor:pointer;}
  .sp-tag-on{border-color:transparent;color:#1C2033;}
  .sp-tag.sp-g-m{background:#DCE9FB;}
  .sp-tag.sp-g-w{background:#FBE0EE;}
  .sp-tag-abs{background:var(--bad-soft);color:var(--bad);border-color:transparent;}
  .sp-side-foot{margin-top:10px;font-size:12px;color:var(--text-muted);}
  .sp-rule-list{display:flex;flex-direction:column;gap:6px;margin-bottom:14px;}
  .sp-rule{display:flex;align-items:center;gap:10px;justify-content:space-between;background:var(--surface-2);border-radius:10px;padding:8px 12px;font-size:13.5px;}
  .sp-rule-empty{color:var(--text-muted);font-size:13px;}
  .sp-rule-add{display:flex;flex-wrap:wrap;gap:7px;align-items:center;margin-bottom:16px;}
  .sp-rule-add .sp-select{flex:1;min-width:150px;}
  /* ---------- Sitzplan im Vollbild (Beamer) ----------
     Vollbild-Element ist #spHost: diese Node wird von paintSitzplan() NICHT
     ersetzt (nur ihr innerHTML), darum übersteht das Vollbild jedes
     Neuzeichnen beim Setzen/Verschieben. Der Verlassen-Knopf liegt deshalb
     auch innerhalb von #spHost — Geschwister-Elemente werden im nativen
     Vollbild gar nicht gerendert. Für iOS-Safari (kein Fullscreen-API) gibt
     es wie beim Übungs-Viewer den CSS-Pseudo-Vollbild-Fallback .sp-fs.

     Im Vollbild ist NUR der Raum zu sehen: Werkzeugleiste und Klassenliste
     werden ausgeblendet, damit der Plan an der Wand für sich steht. Bedient
     wird wieder ausserhalb des Vollbilds. */
  #spHost:fullscreen,#spHost:-webkit-full-screen,#spHost.sp-fs{background:var(--bg);padding:12px;overflow:hidden;display:flex;align-items:center;justify-content:center;}
  #spHost.sp-fs{position:fixed;inset:0;z-index:1000;width:100vw;height:100vh;height:100dvh;}
  #spHost:fullscreen .sp-tools,#spHost:-webkit-full-screen .sp-tools,#spHost.sp-fs .sp-tools,
  #spHost:fullscreen .sp-side,#spHost:-webkit-full-screen .sp-side,#spHost.sp-fs .sp-side{display:none !important;}
  #spHost:fullscreen .sp-layout,#spHost:-webkit-full-screen .sp-layout,#spHost.sp-fs .sp-layout{display:block;width:100%;}
  #spHost:fullscreen .sp-room-outer,#spHost:-webkit-full-screen .sp-room-outer,#spHost.sp-fs .sp-room-outer{border:none;background:none;padding:0;}
  #spHost:fullscreen .sp-room-wrap,#spHost:-webkit-full-screen .sp-room-wrap,#spHost.sp-fs .sp-room-wrap{max-width:calc(95vh * 9 / 8 + 52px);padding:0 26px;}
  /* Schriftgrössen im Vollbild an der Raumgrösse statt an festen Pixeln: der
     Raum ist entweder höhen- (95vh) oder breitenbegrenzt, darum das min() aus
     beidem — sonst werden lange Namen wie "Giulia B." abgeschnitten. */
  #spHost:fullscreen .sp-seat,#spHost:-webkit-full-screen .sp-seat,#spHost.sp-fs .sp-seat{font-size:min(1.8vh,1.5vw);}
  #spHost:fullscreen .sp-table-label,#spHost:-webkit-full-screen .sp-table-label,#spHost.sp-fs .sp-table-label{font-size:min(1.7vh,1.45vw);}
  #spHost:fullscreen .sp-board,#spHost:-webkit-full-screen .sp-board,#spHost.sp-fs .sp-board{font-size:min(1.9vh,1.6vw);}
  #spHost:fullscreen .sp-edge-label,#spHost:-webkit-full-screen .sp-edge-label,#spHost.sp-fs .sp-edge-label{width:26px;font-size:min(1.5vh,1.3vw);}
  #spHost:fullscreen .sp-sill-label,#spHost:-webkit-full-screen .sp-sill-label,#spHost.sp-fs .sp-sill-label{font-size:min(1.5vh,1.3vw);}
  #spHost:fullscreen .sp-room-size,#spHost:-webkit-full-screen .sp-room-size,#spHost.sp-fs .sp-room-size{font-size:min(1.4vh,1.2vw);}
  .sp-fs-exit{display:none;position:fixed;top:14px;right:16px;z-index:1001;align-items:center;justify-content:center;gap:6px;border:none;border-radius:999px;padding:9px 16px;background:rgba(20,20,32,.6);color:#fff;font:inherit;font-weight:700;font-size:13px;cursor:pointer;}
  .sp-fs-exit:hover{background:rgba(20,20,32,.82);}
  #spHost:fullscreen .sp-fs-exit,#spHost:-webkit-full-screen .sp-fs-exit,#spHost.sp-fs .sp-fs-exit{display:flex;}
  body.sp-printing .topbar,body.sp-printing .sp-tools,body.sp-printing .sp-side,body.sp-printing .back-row,body.sp-printing .desk-prop{display:none !important;}
  @media print{
    .topbar,.sp-tools,.sp-side,.back-row,.desk-prop,.toast{display:none !important;}
    .sp-layout{grid-template-columns:1fr;}
    .sp-room-outer{border:none;padding:0;}
    .sp-table{box-shadow:none;}
    /* Ohne das druckt Chrome/Safari Hintergründe gar nicht: Tische, Wandtafel,
       Fenstersims und die Geschlechterfarben kämen weiss heraus. */
    .sp-room,.sp-room *{-webkit-print-color-adjust:exact !important;print-color-adjust:exact !important;}
  }

  /* ---------- Fragebox ---------- */
  .fb-textarea{width:100%;min-height:90px;resize:vertical;border:1px solid var(--border);border-radius:12px;background:var(--surface-2);color:var(--text);font:inherit;font-size:14px;padding:10px 12px;margin-bottom:10px;}
  .fb-wall{display:flex;flex-direction:column;gap:10px;max-height:46vh;overflow:auto;}
  .fb-item{border:1px solid var(--border);border-radius:12px;padding:10px 12px;background:var(--surface-2);}
  .fb-item-done{opacity:.72;}
  .fb-q{font-weight:600;font-size:14px;line-height:1.45;display:flex;flex-wrap:wrap;gap:6px;align-items:baseline;}
  .fb-a{font-size:13.5px;color:var(--text-muted);margin-top:6px;line-height:1.5;white-space:pre-wrap;}
  .fb-tag{background:var(--brand);color:var(--brand-contrast);border-radius:999px;font-size:10.5px;font-weight:700;padding:2px 8px;}
  .fb-date{margin-left:auto;font-size:11px;color:var(--text-muted);font-weight:400;}
  .fb-who{background:var(--surface);border:1px solid var(--border);border-radius:999px;font-size:10.5px;font-weight:700;padding:2px 8px;color:var(--text-muted);}
  .fb-anon{font-style:italic;font-weight:500;}
  .fb-who-choice{display:flex;flex-direction:column;gap:6px;margin:0 0 12px;font-size:13.5px;}
  .fb-who-choice label{display:flex;align-items:center;gap:8px;cursor:pointer;}
  .fb-actions{display:flex;gap:8px;flex-wrap:wrap;}
  .fb-empty{color:var(--text-muted);font-size:13px;padding:8px 2px;}

  /* ---------- Streak ---------- */
  .streak-off{opacity:.55;}
  .st-top{display:flex;gap:10px;flex-wrap:wrap;margin:6px 0 16px;}
  .st-big{flex:1;min-width:92px;background:var(--surface-2);border-radius:14px;padding:12px;text-align:center;}
  .st-big b{display:block;font-family:'Baloo 2',system-ui,sans-serif;font-size:26px;line-height:1.1;}
  .st-big span{font-size:11.5px;color:var(--text-muted);}
  .st-goal{margin:8px 0 6px;}
  .st-goal-bar{height:12px;border-radius:999px;background:var(--surface-2);overflow:hidden;}
  .st-goal-bar span{display:block;height:100%;background:var(--good);border-radius:999px;transition:width .5s;}
  .st-goal-txt{font-size:12.5px;color:var(--text-muted);margin-top:5px;}
  .st-goal-set{font-size:13px;color:var(--text-muted);margin-bottom:14px;display:flex;gap:8px;align-items:center;}
  .st-days{display:flex;gap:4px;margin:8px 0 16px;}
  .st-day{flex:1;aspect-ratio:1;border-radius:7px;background:var(--surface-2);display:flex;align-items:flex-end;justify-content:center;font-size:9px;color:var(--text-muted);padding-bottom:2px;}
  .st-lvl-1{background:color-mix(in srgb, var(--good) 28%, var(--surface-2));}
  .st-lvl-2{background:color-mix(in srgb, var(--good) 58%, var(--surface-2));color:#fff;}
  .st-lvl-3{background:var(--good);color:#fff;}
  .st-badges{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:8px;}
  .st-badge{display:flex;align-items:center;gap:7px;background:var(--surface-2);border-radius:10px;padding:8px 10px;font-size:12px;color:var(--text-muted);opacity:.5;}
  .st-badge span{font-size:18px;filter:grayscale(1);}
  .st-badge-on{opacity:1;color:var(--text);font-weight:600;}
  .st-badge-on span{filter:none;}

  /* ---------- Quiz: Verwaltung ---------- */
  .qz-row{display:flex;gap:14px;align-items:center;flex-wrap:wrap;}
  .qz-row-body{flex:1;min-width:180px;}
  .qz-row-body h3{margin:0 0 3px;font-size:16px;}
  .qz-row-meta{font-size:12.5px;color:var(--text-muted);}
  .qz-row-actions{display:flex;gap:7px;flex-wrap:wrap;}
  .qz-q-list{display:flex;flex-direction:column;gap:12px;margin:14px 0;}
  .qz-q{border:1px solid var(--border);border-radius:12px;padding:12px;background:var(--surface-2);}
  .qz-q-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;}
  .qz-q-head-actions{display:flex;gap:5px;align-items:center;}
  .qz-ans{display:flex;gap:8px;align-items:center;margin-bottom:6px;}
  .qz-ans input[type="text"]{flex:1;min-width:0;}
  .qz-sec{font-size:12.5px;color:var(--text-muted);display:flex;gap:7px;align-items:center;}
  .qz-sec input{width:72px;}

  /* ---------- Quiz: Beamer (Lehrperson) ---------- */
  .qh-stage{flex:1;display:flex;align-items:center;justify-content:center;padding:20px;position:relative;}
  .qh-lobby,.qh-q,.qh-end{display:flex;flex-direction:column;align-items:center;gap:16px;width:100%;max-width:1000px;}
  .qh-big{font-family:'Baloo 2',system-ui,sans-serif;font-weight:800;font-size:clamp(34px,7vw,72px);}
  .qh-sub{color:var(--text-muted);margin:0;text-align:center;}
  .qh-players{display:flex;flex-wrap:wrap;gap:7px;justify-content:center;}
  .qh-chip{background:var(--surface-2);border-radius:999px;padding:6px 14px;font-size:14px;font-weight:600;}
  .qh-count{color:var(--text-muted);font-size:15px;}
  .qh-qnum{font-size:13px;letter-spacing:.08em;text-transform:uppercase;color:var(--text-muted);font-weight:700;}
  .qh-qtext{font-family:'Baloo 2',system-ui,sans-serif;font-weight:700;font-size:clamp(22px,3.6vw,42px);text-align:center;line-height:1.25;}
  .qh-answers{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;width:100%;}
  @media (max-width:620px){ .qh-answers{grid-template-columns:1fr;} }
  .qh-a{display:flex;align-items:center;gap:12px;padding:16px 20px;border-radius:14px;color:#fff;font-size:clamp(15px,2vw,22px);font-weight:700;position:relative;overflow:hidden;}
  .qh-a b{font-size:1.2em;}
  .qh-a-0{background:#E63950;} .qh-a-1{background:#1E96C8;} .qh-a-2{background:#E8952C;} .qh-a-3{background:#2E9E5B;}
  .qh-a-wrong{opacity:.35;}
  .qh-a-right{box-shadow:0 0 0 4px #fff inset, 0 0 26px rgba(46,158,91,.55);}
  .qh-a-bar{position:absolute;left:0;bottom:0;height:5px;width:100%;background:rgba(255,255,255,.25);}
  .qh-a-bar i{display:block;height:100%;background:#fff;}
  .qh-a-n{margin-left:auto;font-size:.85em;opacity:.9;}
  .qh-timer{font-family:'Baloo 2',system-ui,sans-serif;font-weight:800;font-size:clamp(40px,8vh,80px);font-variant-numeric:tabular-nums;}
  .qh-timer-hot{color:var(--bad);animation:tmPulse .8s ease-in-out infinite;}
  .qh-timer-stopped{color:var(--text-muted);}
  .qh-btns{display:flex;gap:12px;justify-content:center;flex-wrap:wrap;}
  .qh-lead{display:flex;flex-wrap:wrap;gap:7px;justify-content:center;}
  /* Nummerierung per Counter: ein li mit display:flex zeigt den normalen
     Listenmarker nicht an. */
  .qh-podium{list-style:none;counter-reset:pod;margin:0;padding:0;display:flex;flex-direction:column;gap:6px;width:100%;max-width:460px;font-size:17px;}
  .qh-podium li{counter-increment:pod;display:flex;justify-content:space-between;gap:12px;background:var(--surface-2);border-radius:10px;padding:8px 14px;}
  .qh-podium li span::before{content:counter(pod) ". ";color:var(--text-muted);font-weight:700;}

  /* ---------- Quiz: Rangverkuendigung am Beamer ---------- */
  .qh-reveal{display:flex;flex-direction:column;align-items:center;gap:6px;text-align:center;
    background:var(--surface-2);border-radius:20px;padding:24px 34px;min-width:min(560px,90%);
    animation:qzReveal .55s cubic-bezier(.2,1.5,.4,1) both;}
  .qh-reveal-rank{font-size:clamp(15px,2.2vw,22px);font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:var(--text-muted);}
  .qh-reveal-name{font-family:'Baloo 2',system-ui,sans-serif;font-weight:800;font-size:clamp(30px,6vw,64px);line-height:1.1;}
  .qh-reveal-score{font-size:clamp(16px,2.4vw,26px);font-weight:700;color:var(--text-muted);}
  .qh-reveal-1{background:linear-gradient(160deg,#FFD76A,#E8952C);color:#3a2503;}
  .qh-reveal-1 .qh-reveal-rank,.qh-reveal-1 .qh-reveal-score{color:#5a3a06;}
  .qh-done{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px;width:100%;max-width:460px;font-size:16px;}
  .qh-done li{display:flex;justify-content:space-between;gap:12px;background:var(--surface-2);border-radius:10px;padding:7px 14px;opacity:.75;}
  @keyframes qzReveal{0%{opacity:0;transform:translateY(26px) scale(.9);}100%{opacity:1;transform:none;}}

  /* Konfetti faellt von oben; der Behaelter ist immer ein Nachfahre des
     Vollbild-Elements (bzw. fix am Fenster auf dem Schuelergeraet). */
  .qz-confetti{position:absolute;inset:0;overflow:hidden;pointer-events:none;z-index:5;}
  .qz-confetti-fixed{position:fixed;z-index:200;}
  .qz-confetti i{position:absolute;top:-14vh;width:10px;height:16px;border-radius:2px;animation:qzFall linear forwards;}
  @keyframes qzFall{0%{transform:translate3d(0,0,0) rotate(0deg);opacity:1;}
                   100%{transform:translate3d(var(--dx,0px),120vh,0) rotate(var(--rot,720deg));opacity:.9;}}
  @media (prefers-reduced-motion: reduce){
    .qz-confetti{display:none;}
    .qh-reveal{animation:none;}
  }

  /* ---------- Quiz: Rangverkuendigung auf dem Schuelergeraet ---------- */
  .qp-rank{font-family:'Baloo 2',system-ui,sans-serif;font-weight:800;font-size:clamp(34px,9vw,60px);}
  .qp-rank-1{color:#E8952C;}
  .qp-wait{font-size:44px;animation:qzDrum 1.1s ease-in-out infinite;}
  @keyframes qzDrum{0%,100%{transform:rotate(-8deg);}50%{transform:rotate(8deg);}}
  @media (prefers-reduced-motion: reduce){ .qp-wait{animation:none;} }

  /* ---------- Quiz: Gerät der Schüler:innen ---------- */
  .qp-wrap{display:flex;flex-direction:column;gap:16px;align-items:center;}
  .qp-head{display:flex;width:100%;justify-content:space-between;align-items:center;gap:10px;font-size:17px;}
  .qp-timer{font-family:'Baloo 2',system-ui,sans-serif;font-weight:800;font-size:54px;font-variant-numeric:tabular-nums;}
  .qp-q{font-family:'Baloo 2',system-ui,sans-serif;font-weight:700;font-size:clamp(20px,4vw,30px);text-align:center;line-height:1.3;}
  .qp-answers{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;width:100%;}
  @media (max-width:560px){ .qp-answers{grid-template-columns:1fr;} }
  .qp-a{display:flex;align-items:center;gap:12px;padding:20px;border:none;border-radius:16px;color:#fff;font:inherit;font-size:17px;font-weight:700;cursor:pointer;text-align:left;min-height:84px;}
  .qp-a-picked{outline:4px solid var(--text);transform:scale(.97);}
  /* Eigener Hot-Zustand statt .qh-timer-hot: auf dem Handy soll die Zahl nur
     rot werden, nicht auch noch springen. */
  .qp-timer-hot{color:var(--bad);}
  .qp-a[disabled]{cursor:default;}
  .qp-a[disabled]:not(.qp-a-picked){opacity:.4;}
  .qp-note{color:var(--good);font-weight:700;min-height:21px;}
  .qp-note-late{color:var(--text-muted);}
  .qp-mid{display:flex;flex-direction:column;align-items:center;gap:10px;text-align:center;padding:24px 0;width:100%;}
  .qp-big{font-family:'Baloo 2',system-ui,sans-serif;font-weight:800;font-size:clamp(28px,6vw,52px);}
  .qp-right .qp-big{color:var(--good);}
  .qp-wrong .qp-big{color:var(--bad);}
  .qp-score{font-size:22px;font-weight:700;}
  .qp-gain{font-family:'Baloo 2',system-ui,sans-serif;font-weight:800;font-size:clamp(30px,7vw,56px);color:var(--good);animation:qpGainPop .45s ease-out;}
  .qp-gain-0{color:var(--text-muted);font-size:clamp(20px,4vw,30px);}
  @keyframes qpGainPop{0%{transform:scale(.6);opacity:0;}70%{transform:scale(1.12);opacity:1;}100%{transform:scale(1);}}
  @media (prefers-reduced-motion: reduce){ .qp-gain{animation:none;} }
  .qp-me{outline:2px solid var(--brand);}

  /* ---------- Kopfzeile: neue Knöpfe ---------- */
  .topbar-badge[hidden]{display:none;}
  .topbar-klasse{font-weight:700;}
  .topbar-klasse.fremd{background:#F59E0B;color:#1a1a1a;border-color:#F59E0B;}
  .klasse-fremd-banner{display:flex;align-items:center;gap:10px;flex-wrap:wrap;background:#FEF3C7;color:#78350F;border:1px solid #F59E0B;border-radius:12px;padding:10px 14px;margin:0 0 14px;font-size:14px;}
  .klasse-fremd-banner .btn{margin-left:auto;}
  .settings-section{margin:14px 0 0;}
  .settings-section h4{margin:0 0 8px;font-size:14px;}
  .settings-actions{display:flex;gap:8px;flex-wrap:wrap;}
  .settings-row{display:flex;align-items:center;gap:8px;padding:8px 0;border-top:1px solid var(--border, rgba(127,127,127,.2));font-size:14px;}
  .settings-row .grow{flex:1;min-width:0;}
  .settings-row small{display:block;color:var(--text-muted);}
  .settings-list{max-height:45vh;overflow:auto;}
  .klassen-wahl{display:flex;flex-direction:column;gap:8px;}
  .klassen-wahl .btn{justify-content:flex-start;text-align:left;}
  .topbar-badge{position:absolute;top:-3px;right:-3px;min-width:17px;height:17px;border-radius:999px;background:var(--bad);color:#fff;font-size:10px;font-weight:700;display:flex;align-items:center;justify-content:center;padding:0 4px;}
  .topbar-offline{background:var(--bad-soft);color:var(--bad);border-radius:999px;padding:5px 12px;font-size:12px;font-weight:700;flex-shrink:0;}
  /* Kein transform:scale hier: der Knopf sitzt in einer umbrechenden Flex-Zeile,
     und ein pulsierendes Element wirkt dort wie ein hüpfendes Symbol. Der Ring
     aus box-shadow fällt genauso auf, verändert aber nichts an der Grösse. */
  .topbar-quiz{background:#E8752C;color:#fff;border-radius:999px;padding:8px 16px;font-size:13.5px;font-weight:700;border:none;cursor:pointer;animation:qzGlow 2.2s ease-in-out infinite;flex-shrink:0;}
  @keyframes qzGlow{0%,100%{box-shadow:0 0 0 0 rgba(232,117,44,.55);}50%{box-shadow:0 0 0 8px rgba(232,117,44,0);}}
  @media (prefers-reduced-motion: reduce){ .topbar-quiz{animation:none;} }

  /* Eingabefelder ausserhalb eines Dialogs (die Editoren der neuen Werkzeuge
     laufen als eigene Seite, nicht im .modal) - gleiche Optik wie im Dialog. */
  .modal-input{width:100%;padding:11px 13px;border:1px solid var(--border);border-radius:10px;font:inherit;background:var(--surface-2);color:var(--text);resize:vertical;}
  .modal-input:focus{outline:2px solid var(--brand);outline-offset:1px;}
  .modal .modal-input{margin-bottom:16px;}

  /* ---------- 🧹 Ämtliplan ---------- */
  .ae-banner{display:flex;align-items:flex-start;gap:14px;background:var(--surface);border:1px solid var(--border);border-left:5px solid #2E9E5B;border-radius:var(--radius);padding:14px 18px;margin-bottom:16px;}
  .ae-banner-icon{font-size:26px;line-height:1.1;flex-shrink:0;}
  .ae-banner h3{margin:0 0 3px;font-size:16px;}
  .ae-banner p{margin:0;font-size:14px;color:var(--text-muted);line-height:1.5;}
  .ae-banner-body{flex:1;min-width:0;}
  .ae-banner-actions{margin-top:8px;display:flex;gap:8px;flex-wrap:wrap;}
  .ae-job{display:inline-flex;align-items:center;gap:6px;background:var(--surface-2);border-radius:999px;padding:4px 12px;font-size:13.5px;font-weight:600;margin:3px 6px 0 0;}
  .ae-wrap{overflow-x:auto;max-width:100%;border:1px solid var(--border);border-radius:var(--radius);background:var(--surface);}
  .ae-table{border-collapse:collapse;font-size:13.5px;min-width:100%;}
  .ae-table th,.ae-table td{padding:8px 12px;border-bottom:1px solid var(--border);border-right:1px solid var(--border);white-space:nowrap;text-align:center;}
  .ae-table tr:last-child td{border-bottom:none;}
  .ae-table th:first-child,.ae-table td:first-child{position:sticky;left:0;z-index:1;text-align:left;font-weight:700;background:var(--surface);box-shadow:1px 0 0 var(--border);}
  .ae-table thead th{background:var(--surface-2);font-size:12px;color:var(--text-muted);font-weight:700;}
  .ae-table thead th:first-child{z-index:2;background:var(--surface-2);}
  .ae-col-now{background:var(--good-soft) !important;}
  .ae-col-now td,.ae-col-now th{background:var(--good-soft) !important;}
  .ae-cell-now{background:var(--good-soft);}
  .ae-skip td,.ae-skip th{color:var(--text-muted);}
  .ae-skipped{background:repeating-linear-gradient(135deg,transparent,transparent 5px,var(--surface-2) 5px,var(--surface-2) 10px);color:var(--text-muted);}
  .ae-wk-btn{border:none;background:transparent;color:var(--text-muted);font:inherit;font-size:11px;cursor:pointer;padding:2px 5px;border-radius:6px;}
  .ae-wk-btn:hover{background:var(--bad-soft);color:var(--bad);}
  .ae-wk-head{display:flex;flex-direction:column;align-items:center;gap:2px;}
  .ae-team-row{display:flex;align-items:center;gap:8px;background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-sm);padding:9px 12px;margin-bottom:8px;flex-wrap:wrap;}
  .ae-team-nr{font-weight:800;color:var(--text-muted);min-width:26px;}
  .ae-chip{display:inline-flex;align-items:center;gap:5px;background:var(--surface-2);border-radius:999px;padding:4px 10px;font-size:13px;font-weight:600;}
  .ae-chip button{border:none;background:transparent;color:var(--text-muted);cursor:pointer;font:inherit;line-height:1;padding:0;}
  .ae-chip button:hover{color:var(--bad);}
  .ae-team-spacer{flex:1;}
  .ae-row-grid{display:grid;grid-template-columns:70px 1fr 110px auto;gap:8px;align-items:center;margin-bottom:8px;}
  @media (max-width:620px){ .ae-row-grid{grid-template-columns:60px 1fr;} }

  /* ---------- ⚡ Blitzumfrage ---------- */
  .uf-setup-modi{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px;}
  .uf-opt-row{display:flex;align-items:center;gap:8px;margin-bottom:8px;}
  .uf-opt-row .modal-input{margin-bottom:0;}
  .uf-opt-nr{width:22px;flex-shrink:0;text-align:center;font-weight:800;color:var(--text-muted);font-size:13px;}
  .uf-opt-row .btn[disabled]{opacity:.3;cursor:default;}
  .uf-stage{display:flex;flex-direction:column;align-items:center;gap:18px;width:100%;max-width:900px;}
  .uf-frage{font-family:'Baloo 2',system-ui,sans-serif;font-weight:700;font-size:clamp(22px,3.8vw,44px);text-align:center;line-height:1.25;}
  .uf-meta{color:var(--text-muted);font-size:15px;font-weight:600;}
  .uf-bars{display:flex;flex-direction:column;gap:10px;width:100%;}
  .uf-bar{background:var(--surface-2);border-radius:12px;padding:10px 14px;position:relative;overflow:hidden;}
  .uf-bar-fill{position:absolute;inset:0 auto 0 0;background:var(--brand);opacity:.22;transition:width .35s ease;}
  .uf-bar-fill-2{position:absolute;left:0;bottom:0;height:46%;background:var(--brand);opacity:.5;transition:width .35s ease;}
  .uf-bar-row{position:relative;display:flex;align-items:center;gap:12px;font-size:clamp(15px,2vw,22px);font-weight:700;}
  .uf-bar-n{margin-left:auto;font-variant-numeric:tabular-nums;}
  .uf-legend{display:flex;gap:16px;color:var(--text-muted);font-size:13px;font-weight:600;}
  .uf-legend i{display:inline-block;width:14px;height:10px;border-radius:3px;background:var(--brand);margin-right:5px;}
  .uf-legend .uf-l1{opacity:.22;}
  .uf-dots{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;}
  .uf-dot{width:14px;height:14px;border-radius:50%;background:var(--surface-2);border:1px solid var(--border);}
  .uf-dot-on{background:var(--good);border-color:transparent;}
  .uf-vote{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px;margin:14px 0;}
  .uf-vote button{padding:18px 14px;border:2px solid var(--border);border-radius:16px;background:var(--surface-2);color:var(--text);font:inherit;font-size:16px;font-weight:700;cursor:pointer;min-height:70px;}
  .uf-vote button:hover{border-color:var(--brand);}
  .uf-vote button.uf-picked{border-color:var(--brand);background:var(--brand);color:var(--brand-contrast);}
  .topbar-umfrage{background:#6D4AC8;}

  /* ---------- 🎲 Gruppen & Partner ---------- */
  .gr-panel{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:center;margin-bottom:6px;}
  .gr-opt{display:inline-flex;align-items:center;gap:6px;background:var(--surface-2);border-radius:999px;padding:6px 13px;font-size:13.5px;font-weight:600;cursor:pointer;}
  .gr-kids{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;max-width:900px;}
  .gr-kid{border:1px solid var(--border);background:var(--surface-2);color:var(--text);border-radius:999px;padding:5px 12px;font:inherit;font-size:13px;font-weight:600;cursor:pointer;}
  .gr-kid-off{opacity:.38;text-decoration:line-through;}
  .gr-regel-row{display:flex;align-items:center;gap:10px;justify-content:space-between;background:var(--surface-2);border-radius:var(--radius-sm);padding:9px 13px;margin-bottom:7px;font-size:14px;}
  .gr-regel-add{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:12px;}
  .gr-regel-add .sp-select{flex:1;min-width:140px;}
  .gr-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:14px;width:100%;max-width:1100px;}
  .gr-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:14px 16px;animation:grPop .32s ease both;}
  .gr-card h4{margin:0 0 8px;font-size:14px;color:var(--text-muted);letter-spacing:.06em;text-transform:uppercase;}
  .gr-card ul{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:5px;}
  .gr-card li{font-family:'Baloo 2',system-ui,sans-serif;font-weight:700;font-size:clamp(17px,2vw,24px);display:flex;align-items:baseline;gap:8px;}
  .gr-role{font-family:system-ui,sans-serif;font-size:12px;font-weight:600;color:var(--text-muted);}
  @keyframes grPop{from{opacity:0;transform:translateY(10px) scale(.96);}to{opacity:1;transform:none;}}
  @media (prefers-reduced-motion: reduce){ .gr-card{animation:none;} }

  /* ---------- 🧹 Besen in der Kopfzeile ---------- */
  /* Leuchtet rot, sobald in DIESER Woche noch ein eigenes Ämtli ansteht.
     Wie beim Quiz-Knopf bewusst ein Ring aus box-shadow statt transform:scale —
     ein huepfendes Symbol in einer umbrechenden Flex-Zeile wirkt unruhig. */
  .topbar-besen-an{background:var(--bad-soft);color:var(--bad);animation:besenGlow 2.2s ease-in-out infinite;}
  @keyframes besenGlow{0%,100%{box-shadow:0 0 0 0 rgba(230,57,80,.5);}50%{box-shadow:0 0 0 7px rgba(230,57,80,0);}}
  @media (prefers-reduced-motion: reduce){ .topbar-besen-an{animation:none;} }
  /* ---------- 🆕 Neuigkeiten ---------- */
  .topbar-neu-an{background:var(--bad-soft);color:var(--bad);animation:besenGlow 2.2s ease-in-out infinite;}
  @media (prefers-reduced-motion: reduce){ .topbar-neu-an{animation:none;} }
  .neu-list{display:flex;flex-direction:column;gap:8px;}
  .neu-item{display:flex;gap:12px;align-items:flex-start;background:var(--surface-2);border-radius:var(--radius-sm);padding:10px 14px;line-height:1.5;}
  .neu-date{flex:0 0 auto;font-size:13px;color:var(--text-muted);min-width:78px;padding-top:2px;}
  .neu-text{flex:1;min-width:0;}
  .neu-tag{display:inline-block;font-size:11.5px;font-weight:700;border-radius:999px;padding:1px 8px;margin-left:6px;background:var(--brand);color:var(--brand-contrast);vertical-align:1px;}
  .neu-unseen{box-shadow:inset 3px 0 0 var(--bad);}
  .neu-old-details{margin-top:18px;}
  .neu-old-details summary{cursor:pointer;font-weight:700;font-size:15px;padding:8px 0;list-style:none;}
  .neu-old-details summary::-webkit-details-marker{display:none;}
  .neu-old-details summary::before{content:'▸ ';}
  .neu-old-details[open] summary::before{content:'▾ ';}
  .ae-pop{text-align:center;}
  .ae-pop-icon{font-size:44px;line-height:1;}
  .ae-pop h3{margin:8px 0 12px;}
  .ae-pop-job{background:var(--surface-2);border-radius:var(--radius-sm);padding:11px 14px;margin-bottom:8px;font-size:15px;line-height:1.5;}
  .ae-pop-job span{color:var(--text-muted);font-size:13.5px;}
  /* 5 Minuten vor der Ämtli-Zeit: gross über allem (nur Lehrperson), Klick = weg. */
  .ae-gross{position:fixed;inset:0;z-index:2147483000;display:flex;align-items:center;justify-content:center;padding:24px;background:rgba(20,10,12,.55);cursor:pointer;}
  .ae-gross-box{background:var(--surface);color:var(--text);border:6px solid var(--bad);border-radius:28px;padding:clamp(20px,4vw,48px);max-width:min(1100px,96vw);text-align:center;animation:aeGrossPuls 1.1s ease-in-out infinite;}
  .ae-gross-icon{font-size:clamp(60px,12vw,140px);line-height:1;}
  .ae-gross h2{font-family:'Baloo 2',system-ui,sans-serif;font-size:clamp(30px,6vw,76px);line-height:1.1;margin:10px 0 18px;color:var(--bad);}
  .ae-gross-jobs{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;}
  .ae-gross-jobs .ae-job{font-size:clamp(17px,2.6vw,30px);padding:8px 20px;}
  .ae-gross-stuhl{margin-top:20px;font-family:'Baloo 2',system-ui,sans-serif;font-size:clamp(28px,5.5vw,68px);font-weight:800;line-height:1.1;color:var(--bad);}
  .ae-stuhl{display:inline-flex;align-items:center;gap:10px;margin:8px 0 6px 2px;cursor:pointer;user-select:none;font-size:14px;font-weight:600;}
  .ae-stuhl input{position:absolute;opacity:0;width:1px;height:1px;}
  .ae-stuhl-sw{position:relative;width:44px;height:24px;border-radius:999px;background:var(--border);transition:background .15s;flex:none;}
  .ae-stuhl-sw::after{content:'';position:absolute;top:3px;left:3px;width:18px;height:18px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.25);transition:transform .15s;}
  .ae-stuhl input:checked + .ae-stuhl-sw{background:var(--good);}
  .ae-stuhl input:checked + .ae-stuhl-sw::after{transform:translateX(20px);}
  .ae-stuhl input:focus-visible + .ae-stuhl-sw{outline:2px solid var(--primary, #3B82F6);outline-offset:2px;}
  .ae-gross-hint{margin-top:18px;color:var(--text-muted);font-size:14px;}
  @keyframes aeGrossPuls{0%,100%{transform:scale(1);box-shadow:0 0 0 0 rgba(230,57,80,.6);}50%{transform:scale(1.04);box-shadow:0 0 0 26px rgba(230,57,80,0);}}
  @media (prefers-reduced-motion: reduce){ .ae-gross-box{animation:none;} }

  /* ---------- Eigenes Häkchen an einem Kalendereintrag ---------- */
  .cal-done{display:inline-flex;align-items:center;gap:7px;margin-top:8px;background:var(--surface-2);border:1px solid var(--border);border-radius:999px;padding:5px 13px 5px 10px;font-size:13px;font-weight:600;color:var(--text-muted);cursor:pointer;user-select:none;}
  .cal-done:hover{border-color:var(--good);}
  .cal-done input{width:17px;height:17px;cursor:pointer;accent-color:var(--good);}
  .cal-done-on{background:var(--good-soft);border-color:transparent;color:var(--good);}

  /* ---------- 📋 Vergessen-Zähler ---------- */
  .vg-row{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-sm);margin-bottom:8px;overflow:hidden;}
  .vg-row > summary{list-style:none;cursor:pointer;display:flex;align-items:center;gap:12px;padding:12px 15px;}
  .vg-row > summary::-webkit-details-marker{display:none;}
  .vg-row > summary:hover{background:var(--surface-2);}
  .vg-name{font-weight:600;font-size:15px;}
  .vg-count{margin-left:auto;font-weight:800;font-size:15px;border-radius:999px;padding:2px 12px;background:var(--surface-2);color:var(--text-muted);}
  .vg-count-hot{background:var(--bad-soft);color:var(--bad);}
  .vg-count-zero{background:var(--good-soft);color:var(--good);}
  .vg-body{padding:0 15px 13px;}
  .vg-item{display:flex;align-items:center;gap:10px;font-size:13.5px;padding:6px 0;border-top:1px dashed var(--border);flex-wrap:wrap;}
  .vg-item-spacer{flex:1;}
  .vg-hint{color:var(--text-muted);font-size:13px;line-height:1.55;margin:0 2px 14px;}

  /* ===== 📝 Prüfungsmodus ===== */
  .topbar-pruefung{background:#E63950;}
  .topbar-pruefung-alarm{background:#B3122B;animation:prAlarm 1s ease-in-out infinite;}
  @keyframes prAlarm{0%,100%{box-shadow:0 0 0 0 rgba(230,57,80,.6);}50%{box-shadow:0 0 0 8px rgba(230,57,80,0);}}
  body.pr-lock-open{overflow:hidden;}
  .pr-lock{position:fixed;inset:0;z-index:3000;background:var(--bg);display:flex;flex-direction:column;}
  .pr-lock[hidden]{display:none;}
  .pr-lock-bar{display:flex;align-items:center;gap:14px;flex-wrap:wrap;padding:8px 14px;background:var(--brand);color:var(--brand-contrast);font-size:14px;}
  .pr-lock-bar .pr-lock-hint{margin-left:auto;opacity:.85;font-size:13px;}
  .pr-uhr{font-variant-numeric:tabular-nums;font-weight:700;background:rgba(255,255,255,.18);border-radius:999px;padding:2px 10px;}
  .pr-uhr.knapp{background:#E63950;animation:prAlarm 1s ease-in-out infinite;}
  .pr-lock iframe{flex:1;width:100%;border:0;background:#fff;}
  .pr-lock-msg{margin:auto;max-width:520px;padding:32px 24px;text-align:center;}
  .pr-lock-msg h2{margin:8px 0 12px;}
  .pr-lock-msg p{color:var(--text-muted);line-height:1.5;}
  .pr-lock-icon{font-size:64px;}
  .pr-grund{font-size:13px;}
  .modal.pr-modal{max-width:640px;}
  .pr-regeln{display:flex;flex-direction:column;gap:8px;background:var(--surface-2);border-radius:var(--radius-sm);padding:12px 14px;margin:0 0 16px;font-size:14px;line-height:1.45;}
  .pr-hinweis{font-size:13px;color:var(--text-muted);}
  .pr-kats{display:flex;flex-wrap:wrap;gap:6px 14px;margin:0 0 12px;font-size:14px;}
  .pr-grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:0 12px;}
  .pr-grid2 .modal-input,#prTitel,#prUebung{margin-bottom:12px;}
  .pr-check{display:flex;gap:8px;align-items:flex-start;font-size:14px;margin:0 0 12px;}
  .pr-badge{display:inline-block;vertical-align:middle;font-size:12px;font-weight:700;padding:3px 10px;border-radius:999px;background:var(--surface-2);color:var(--text-muted);}
  .pr-badge.offen{background:var(--bad-soft);color:var(--bad);}
  .pr-badge.beendet{background:var(--good-soft);color:var(--good);}
  .pr-liste{display:flex;flex-direction:column;gap:10px;}
  .pr-karte{text-align:left;background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-sm);padding:14px 16px;cursor:pointer;font:inherit;color:var(--text);display:flex;flex-direction:column;gap:4px;}
  .pr-karte small{color:var(--text-muted);}
  .pr-zahlen{display:flex;gap:10px;flex-wrap:wrap;margin:6px 0 14px;}
  .pr-zahlen div{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-sm);padding:10px 16px;min-width:96px;text-align:center;}
  .pr-zahlen b{display:block;font-size:22px;}
  .pr-zahlen span{font-size:12px;color:var(--text-muted);}
  .pr-zahlen .alarm{background:var(--bad-soft);border-color:var(--bad);color:var(--bad);}
  .pr-tabelle{display:flex;flex-direction:column;gap:6px;}
  .pr-zeile{display:grid;grid-template-columns:minmax(120px,1.2fr) minmax(150px,1.6fr) minmax(140px,1.6fr) auto;gap:10px;align-items:center;background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-sm);padding:8px 12px;font-size:14px;}
  .pr-zeile.gesperrt{background:var(--bad-soft);border-color:var(--bad);}
  .pr-zeile.weg{border-color:#E8752C;}
  .pr-zeile.nix{opacity:.65;}
  .pr-name{font-weight:700;}
  .pr-fort{color:var(--text-muted);}
  .pr-vs{color:var(--bad);font-weight:600;cursor:help;}
  .pr-akt{display:flex;gap:6px;justify-content:flex-end;}
  @media (max-width:700px){ .pr-zeile{grid-template-columns:1fr auto;} .pr-st,.pr-fort{grid-column:1 / -1;} .pr-akt{grid-row:1;grid-column:2;} }
  .pr-resultat{display:flex;gap:12px;margin:4px 0 14px;}
  .pr-resultat div{flex:1;background:var(--surface-2);border-radius:var(--radius-sm);padding:10px;text-align:center;}
  .pr-resultat span{display:block;font-size:12px;color:var(--text-muted);}
  .pr-resultat b{font-size:26px;}
  .pr-details{display:flex;flex-direction:column;gap:6px;margin-bottom:14px;}
  .pr-det{display:flex;gap:10px;align-items:flex-start;padding:8px 10px;border-radius:10px;background:var(--surface-2);font-size:14px;}
  .pr-det.bad{background:var(--bad-soft);}
  .pr-det-ok{border:0;background:none;font-size:18px;padding:0;cursor:pointer;line-height:1.2;}
  span.pr-det-ok{cursor:default;}
  .pr-diktat-in{width:100%;min-height:52vh;font-size:18px;line-height:1.6;resize:vertical;font-family:inherit;}
  .pr-det.teil{border-color:#E9B949;}
  .pr-det-pk{white-space:nowrap;font-size:13px;}
  .pr-det-pkt{width:62px;padding:3px 6px;border:1px solid var(--border);border-radius:8px;font:inherit;background:var(--surface);color:var(--text);}
  .pr-q-pkt{font-size:13px;font-weight:700;color:var(--text-muted);}
  .pr-q-offen{width:100%;min-height:160px;resize:vertical;font-family:inherit;line-height:1.5;}
  .pr-h4{margin:18px 0 4px;}
  .pr-bloom{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;}
  .pr-bloom label{display:flex;flex-direction:column;gap:4px;font-size:13px;font-weight:600;}
  .pr-tab{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:6px 12px;}
  .pr-tab label{display:flex;align-items:center;gap:6px;font-size:13.5px;}
  .pr-tab label span:first-child{min-width:78px;}

// Splits a string into pieces that each stay under maxBytes when UTF-8 encoded,
// without ever cutting a multi-byte character (or a surrogate pair) in half —
// so plain string concatenation on read always reproduces the original text exactly.
// Uses a binary search per chunk boundary (not a linear character-by-character
// shrink) so it stays fast even on heavily multi-byte text (umlauts, emoji).
function chunkStringByBytes(str, maxBytes){
  var encoder = new TextEncoder();
  var chunks = [];
  var start = 0;
  var n = str.length;
  while(start < n){
    if(encoder.encode(str.slice(start)).length <= maxBytes){
      chunks.push(str.slice(start));
      break;
    }
    var lo = start + 1, hi = n;
    while(lo < hi){
      var mid = Math.ceil((lo + hi) / 2);
      var len = encoder.encode(str.slice(start, mid)).length;
      if(len <= maxBytes){ lo = mid; } else { hi = mid - 1; }
    }
    var end = lo;
    // never split a surrogate pair (emoji etc.)
    if(end < n){
      var code = str.charCodeAt(end - 1);
      if(code >= 0xD800 && code <= 0xDBFF){ end--; }
    }
    if(end <= start){ end = start + 1; } // pathological fallback, avoids an infinite loop
    chunks.push(str.slice(start, end));
    start = end;
  }
  return chunks.length ? chunks : [''];
}

/* ===================== SCHULLEITUNG (nur Ansicht) =====================

  return refs.some(function(r){

/* Schreibschutz-Nachfrage für Lehrpersonen in einer fremden Klasse. Alle
   Schreibzugriffe laufen über die Wrapper setDoc/updateDoc/deleteDoc/writeBatch
   unten; betrifft ein Zugriff klassen/..., während eine fremde Klasse offen ist,
   kommt zuerst eine Rückfrage (eigene Ebene über allen Dialogen, damit ein
   offener Bearbeiten-Dialog stehen bleibt). Nach einem "Ja" gilt die Freigabe
   ein paar Sekunden — eine einzelne Aktion schreibt oft mehrere Dokumente. */
var klasseGuard = { okUntil:0, pending:null };
function refInKlasse(ref){ return !!(ref && typeof ref.path === 'string' && ref.path.indexOf('klassen/') === 0); }
function klasseWriteGuard(refs){
  if(!isFremdeKlasse() || !refs.some(refInKlasse)) return Promise.resolve();
  if(Date.now() < klasseGuard.okUntil) return Promise.resolve();
  if(klasseGuard.pending) return klasseGuard.pending;
  klasseGuard.pending = new Promise(function(resolve, reject){
    var ov = document.createElement('div');
    ov.className = 'modal-overlay show';
    ov.style.zIndex = '4000';
    ov.innerHTML = '<div class="modal" role="dialog" aria-modal="true">'+
      '<h3>⚠️ Richtige Klasse?</h3>'+
      '<p>Du bist gerade in der Klasse <b>'+esc(state.klasse)+'</b>, nicht in deiner eigenen Klasse ('+esc(state.profile.klasse)+'). '+
      'Soll die Änderung wirklich in der <b>'+esc(state.klasse)+'</b> gespeichert werden?</p>'+
      '<div class="modal-actions">'+
        '<button class="btn btn-ghost btn-sm" data-a="no" type="button">Abbrechen</button>'+
        '<button class="btn btn-primary btn-sm" data-a="yes" type="button">Ja, in '+esc(state.klasse)+' speichern</button>'+
      '</div></div>';
    (document.fullscreenElement || document.body).appendChild(ov);
    function done(ok){
      ov.remove();
      klasseGuard.pending = null;
      if(ok){ klasseGuard.okUntil = Date.now() + 5000; resolve(); }
      else {
        toast('Nicht gespeichert.');
        var e = new Error('Abgebrochen: falsche Klasse'); e.code = 'klasse/abgebrochen';
        reject(e);
      }
    }
    ov.querySelector('[data-a="yes"]').addEventListener('click', function(){ done(true); });
    ov.querySelector('[data-a="no"]').addEventListener('click', function(){ done(false); });
  });
  return klasseGuard.pending;
}
function setDoc(ref){ var a = arguments; if(leitungBlockiert([ref])) return leitungNurAnsicht(); return klasseWriteGuard([ref]).then(function(){ return fsSetDoc.apply(null, a); }); }
function updateDoc(ref){ var a = arguments; if(leitungBlockiert([ref])) return leitungNurAnsicht(); return klasseWriteGuard([ref]).then(function(){ return fsUpdateDoc.apply(null, a); }); }

    update: function(r){ refs.push(r); b.update.apply(b, arguments); return w; },

    commit: function(){ if(leitungBlockiert(refs)) return leitungNurAnsicht(); return klasseWriteGuard(refs).then(function(){ return b.commit(); }); }
  };
  return w;

function ferienDaysUntil(dateStr){
  var p = dateStr.split('-').map(Number);
  var target = new Date(p[0], p[1]-1, p[2]);
  var now = new Date();
  var startOfToday = new Date(now.getFullYear(), now.getMonth(), now.getDate());
  return Math.round((target - startOfToday) / 86400000);
}
function upcomingFerien(n){
  var today = todayStr();
  return FERIEN_TG.filter(function(f){ return f.end >= today; }).slice(0, n || 2);
}
// Ferien des aktuellen Schuljahres (Herbst bis Sommer) - eingerahmt von den
// beiden Sommerferien, zwischen denen "heute" liegt. Zeigt nur noch nicht
// vergangene davon, unabhaengig davon wie viele Jahre FERIEN_TG im Voraus hat.
function currentSchoolYearFerien(){
  var today = todayStr();
  var sommerIdx = [];
  FERIEN_TG.forEach(function(f, i){ if(f.label === 'Sommerferien') sommerIdx.push(i); });
  var endIdx = sommerIdx.find(function(i){ return FERIEN_TG[i].end >= today; });
  if(endIdx === undefined) return [];
  var pos = sommerIdx.indexOf(endIdx);
  var startIdx = pos > 0 ? sommerIdx[pos - 1] : -1;
  return FERIEN_TG.slice(startIdx + 1, endIdx + 1).filter(function(f){ return f.end >= today; });
}
// Dezente Zeile für eine Ferienperiode, eingestreut zwischen den echten
// Kalender-Einträgen (siehe calendarWithFerienHtml) - bewusst schlichter als
// .cal-entry, damit die Ferien nicht mit Aufgaben/Prüfungen konkurrieren.
function ferienEntryLineHtml(f){
  var today = todayStr();
  var ongoing = f.start <= today && f.end >= today;
  return '<div class="cal-ferien-item">'+f.icon+' <b>'+esc(f.label)+'</b> <span>'+esc(fmtDueDate(f.start))+'–'+esc(fmtDueDate(f.end))+'</span>'+
    (ongoing ? ' <span class="cal-ferien-tag">laufen gerade</span>' : '')+
    '</div>';
}

// Mischt echte Kalender-Einträge und Ferienperioden chronologisch sortiert in
// eine gemeinsame Liste (jeweils nach Ferien-Start bzw. Eintrags-Fälligkeit).
// reversed=true für den "Vergangen"-Block (neueste zuerst, wie bisher).
function calendarWithFerienHtml(entries, ferienList, isTeacher, roster, reversed){
  var items = entries.map(function(e){
    return {date:e.dueDate, order:1, html:calendarEntryLineHtml(e, isTeacher, roster)};
  }).concat(ferienList.map(function(f){
    return {date:f.start, order:0, html:ferienEntryLineHtml(f)};
  }));
  items.sort(function(a,b){
    if(a.date !== b.date) return a.date.localeCompare(b.date);
    return a.order - b.order;
  });
  if(reversed) items.reverse();
  return items.map(function(it){ return it.html; }).join('');
}
function topbarFerienCountdownHtml(){
  var next = upcomingFerien(1)[0];
  if(!next) return '';
  var today = todayStr();
  if(next.start <= today) return ''; // Ferien laufen bereits - kein Countdown nötig
  var days = ferienDaysUntil(next.start);
  return '<div class="topbar-ferien" title="'+esc(next.label)+' ab '+esc(fmtDueDate(next.start))+'">🚨 <b>'+days+'</b> Tag'+(days===1?'':'e')+' bis '+esc(next.label)+'</div>';
}

function pad2(n){ return n<10 ? '0'+n : ''+n; }
function localDateStr(d){ return d.getFullYear()+'-'+pad2(d.getMonth()+1)+'-'+pad2(d.getDate()); }
function todayStr(){ return localDateStr(new Date()); }
function addDaysStr(days){ var d = new Date(); d.setDate(d.getDate()+days); return localDateStr(d); }
function fmtDueDate(dateStr){
  // "YYYY-MM-DD" ohne Zeitzonen-Umwege in ein lesbares CH-Datum umwandeln.
  var parts = (dateStr||'').split('-');
  if(parts.length!==3) return dateStr||'';
  return parts[2]+'.'+parts[1]+'.'+parts[0];
}
function weekdayLabel(dateStr){
  var parts = (dateStr||'').split('-').map(Number);
  if(parts.length!==3) return '';
  var d = new Date(parts[0], parts[1]-1, parts[2]);
  return d.toLocaleDateString('de-CH', {weekday:'long'});
}

async function loadCalendarEntries(){
  var snap = await getDocs(kcol('calendarEntries'));
  var out = [];
  snap.forEach(function(d){ out.push(Object.assign({id:d.id}, d.data())); });
  out.sort(function(a,b){
    if(a.dueDate !== b.dueDate) return (a.dueDate||'').localeCompare(b.dueDate||'');
    return (a.createdAt && a.createdAt.toMillis ? a.createdAt.toMillis() : 0) - (b.createdAt && b.createdAt.toMillis ? b.createdAt.toMillis() : 0);
  });
  return out;
}

/* ===================== EIGENE KALENDEREINTRÄGE (Schüler:innen) =====================
   Schüler:innen können sich selbst Hausaufgaben/Abgaben/... eintragen - im
   selben Formular wie die Lehrperson, aber gespeichert unter
   progress/{uid}/eigeneEintraege/{id}. Diese Einträge sieht nur die Person
   selbst (auch die Lehrperson nicht). Im Kalender werden sie mit den
   Klassen-Einträgen zusammengemischt und mit private:true markiert. */

function eigeneEintraegeCol(){ return collection(db, 'progress', state.user.uid, 'eigeneEintraege'); }

function calendarEntryRef(entry){
  return entry.private ? doc(eigeneEintraegeCol(), entry.id) : kdoc('calendarEntries', entry.id);
}

// Klassen-Einträge + (für Schüler:innen) die eigenen, gemeinsam sortiert.
async function loadMyCalendarEntries(){
  var jobs = [loadCalendarEntries()];
  if(state.profile.role !== 'teacher'){
    jobs.push(getDocs(eigeneEintraegeCol()).then(function(snap){
      var out = [];
      snap.forEach(function(d){ out.push(Object.assign({id:d.id}, d.data(), {private:true})); });
      return out;
    }).catch(function(err){ console.error('Eigene Einträge nicht lesbar', err); return []; }));
  }
  var res = await Promise.all(jobs);
  // Fach-Gäste (z.B. nur in Mathe dabei) sehen von der Klasse nur ihr Fach.
  var nurFach = state.profile.role !== 'teacher' && state.profile.nurFach;
  if(nurFach) res[0] = res[0].filter(function(e){ return e.subject === nurFach; });
  var all = res[0].concat(res[1] || []);
  all.sort(function(a,b){
    if(a.dueDate !== b.dueDate) return (a.dueDate||'').localeCompare(b.dueDate||'');
    return (a.createdAt && a.createdAt.toMillis ? a.createdAt.toMillis() : 0) - (b.createdAt && b.createdAt.toMillis ? b.createdAt.toMillis() : 0);
  });
  return all;
}

/* ===================== EIGENES ABHAKEN VON KALENDEREINTRÄGEN =====================
   Schüler:innen können Hausaufgaben/Abgaben/Unterschriften für SICH SELBST
   abhaken — nur damit sie sehen, was sie erledigt haben. Das ist strikt
   getrennt von der Abgabe-Checkliste der Lehrperson (submitted.{uid} auf dem
   Kalendereintrag): diese Häkchen setzt nur sie, und das eigene Häkchen ändert
   daran nichts. Prüfungen und Erinnerungen bekommen kein Kästchen — dort gibt
   es nichts abzugeben (hasSubmissionChecklist entscheidet das).

   Alles liegt in EINEM Dokument pro Person (progress/{uid}/erledigt/liste),
   nicht in einem Dokument pro Eintrag: ein Lesevorgang statt vierzig. */

var erledigt = { ids:{}, loaded:false, uid:null };

function erledigtRef(){ return doc(db, 'progress', state.user.uid, 'erledigt', 'liste'); }

function erledigtLoad(){
  if(!state.user || state.profile.role === 'teacher') return Promise.resolve({});
  if(erledigt.loaded && erledigt.uid === state.user.uid) return Promise.resolve(erledigt.ids);
  return getDoc(erledigtRef()).then(function(snap){
    erledigt.ids = (snap.exists() && snap.data().ids) || {};
    erledigt.loaded = true;
    erledigt.uid = state.user.uid;
    return erledigt.ids;
  }).catch(function(err){
    console.error('Eigene Häkchen nicht lesbar', err);
    erledigt.ids = {}; erledigt.loaded = true; erledigt.uid = state.user.uid;
    return erledigt.ids;
  });
}

function erledigtIst(entryId){ return !!erledigt.ids[entryId]; }

function erledigtSetzen(entryId, an){
  if(an) erledigt.ids[entryId] = true; else delete erledigt.ids[entryId];
  // Bewusst setDoc OHNE merge: mit merge:true bliebe ein abgewähltes Häkchen
  // in der verschachtelten Map für immer stehen.
  return setDoc(erledigtRef(), { ids: erledigt.ids, updatedAt: serverTimestamp() })
    .catch(function(err){ console.error(err); toast('Häkchen konnte nicht gespeichert werden.'); });
}

function calendarEntryLineHtml(e, isTeacher, roster){

  html += '<div class="cal-entry-date">'+fmtDueDate(e.dueDate)+'<span class="cal-entry-weekday">'+esc(weekdayLabel(e.dueDate))+'</span></div>';
  html += '<div class="cal-entry-body">';
  html += '<div class="cal-entry-title"><span class="cal-entry-type">'+meta.icon+' '+esc(meta.label)+'</span>'+(s?' · '+esc(s.name):'')+
    (e.private ? ' <span class="cal-private-tag" title="Diesen Eintrag siehst nur du">🔒 nur für dich</span>' : '')+'</div>';
  html += '<div class="cal-entry-text">'+esc(e.title)+'</div>';
  if(e.description){ html += '<div class="cal-entry-desc">'+esc(e.description)+'</div>'; }
  if(e.resourceId){
    html += '<button class="btn btn-ghost btn-sm cal-open-res-btn" type="button" data-resource-id="'+esc(e.resourceId)+'">▶ Zur Übung'+(e.resourceTitle?': '+esc(e.resourceTitle):'')+'</button>';
  }

    html += '<button class="btn btn-ghost btn-sm cal-sub-btn" type="button" data-id="'+esc(e.id)+'">☑ '+esc(submittedCountLabel(e, roster))+'</button>';
  }
  // Eigenes Häkchen der Schüler:innen — nur für sie sichtbar, ohne Einfluss auf
  // die Abgabe-Checkliste der Lehrperson.
  if(!isTeacher && hasSubmissionChecklist(e.type)){
    var an = erledigtIst(e.id);
    html += '<label class="cal-done'+(an ? ' cal-done-on' : '')+'">'
         +  '<input type="checkbox" class="cal-done-check" data-id="'+esc(e.id)+'"'+(an ? ' checked' : '')+'>'
         +  '<span>'+(an ? 'erledigt' : 'erledigt?')+'</span></label>';
  }
  html += '</div>';
  if(!isTeacher && e.private){
    html += '<div class="cal-entry-actions">'+
      '<button class="btn btn-ghost btn-sm cal-edit-btn" type="button" data-id="'+esc(e.id)+'">Bearbeiten</button>'+
      '<button class="btn btn-ghost btn-sm cal-del-btn" type="button" data-id="'+esc(e.id)+'">Löschen</button>'+
      '</div>';
  } else if(isTeacher){
    var isPast = e.dueDate < todayStr();
    html += '<div class="cal-entry-actions">'+
      '<button class="btn btn-ghost btn-sm cal-edit-btn" type="button" data-id="'+esc(e.id)+'">Bearbeiten</button>'+
      (isPast ? '<button class="btn btn-ghost btn-sm cal-reactivate-btn" type="button" data-id="'+esc(e.id)+'">↺ Reaktivieren</button>' : '')+
      '<button class="btn btn-ghost btn-sm cal-del-btn" type="button" data-id="'+esc(e.id)+'">Löschen</button>'+
      '</div>';
  }
  html += '</div>';
  return html;
}

// Setzt für einen vergangenen Eintrag ein neues (künftiges) Datum, damit er
// wieder unter "Anstehend" statt "Vergangen" erscheint. Bei Hausaufgaben wird
// die Abgabe-Checkliste dabei zurückgesetzt (updateDoc mit {} statt setDoc+
// merge, weil merge:true ein leeres Objekt niemals über bestehende Schlüssel
// mergen würde - siehe Firebase.md/Chunking-Hinweis oben zu diesem Bug).
function uiReactivateEntry(entry, onDone){
  openModal(
    '<h3>Reaktivieren: '+esc(entry.title)+'</h3>'+
    '<p>Setzt ein neues Datum für diesen Eintrag'+(hasSubmissionChecklist(entry.type) ? ' und setzt die Abgabe-Checkliste zurück.' : '.')+'</p>'+
    '<label class="modal-label">Neues Datum</label><input type="date" id="reactivateDate" value="'+esc(addDaysStr(1))+'">'+
    '<div class="login-err" id="reactivateErr"></div>'+
    '<div class="modal-actions">'+
      '<button class="btn btn-ghost btn-sm" id="modalCancel" type="button">Abbrechen</button>'+
      '<button class="btn btn-primary btn-sm" id="modalOk" type="button">Reaktivieren</button>'+
    '</div>'
  );
  var dateEl = document.getElementById('reactivateDate');
  dateEl.focus();
  document.getElementById('modalCancel').addEventListener('click', closeModal);
  document.getElementById('modalOk').addEventListener('click', async function(){
    var errEl = document.getElementById('reactivateErr');
    errEl.classList.remove('show');
    var newDate = dateEl.value;
    if(!newDate){ errEl.textContent='Bitte ein Datum wählen.'; errEl.classList.add('show'); return; }
    try{
      var updates = { dueDate: newDate };
      if(hasSubmissionChecklist(entry.type)){ updates.submitted = {}; }
      await updateDoc(kdoc('calendarEntries', entry.id), updates);
      entry.dueDate = newDate;
      if(hasSubmissionChecklist(entry.type)){ entry.submitted = {}; }
      closeModal();
      toast('Eintrag reaktiviert.');
      onDone();
    }catch(err){
      console.error(err);
      errEl.textContent = 'Konnte nicht gespeichert werden.'; errEl.classList.add('show');
    }
  });
}

        opts.push('<option value="'+esc(d.id)+'"'+(d.id===currentResourceId?' selected':'')+'>'+esc(label)+'</option>');
      });
      resourceEl.innerHTML = opts.join('');
      // Falls die verlinkte Übung inzwischen aus diesem Fach entfernt/verschoben wurde,

    try{
      if(existing){
        await setDoc(calendarEntryRef(existing), data, {merge:true});

        data.createdAt = serverTimestamp();
        data.createdBy = state.user.uid;
        var newId = (isPrivate ? 'mine_' : 'cal_')+Date.now()+'_'+Math.random().toString(36).slice(2,8);
        await setDoc(isPrivate ? doc(eigeneEintraegeCol(), newId) : kdoc('calendarEntries', newId), data);

    }catch(err){
      console.error(err);
      errEl.textContent = 'Konnte nicht gespeichert werden.'; errEl.classList.add('show');
    }
  });
}

  var stuSnap = await getDocs(query(collection(db,'students'), where('klasse','==',state.klasse)));

/* ===================== FACH-GÄSTE =====================
   Schüler:innen einer anderen Klasse, die nur für ein Fach dazukommen (z.B.
   Elena und Letizia in Mathe bei der G3b). Ihr Konto gehört zur Klasse, trägt

     als zweite Person auf einem besetzten Platz).
   loadStudentRoster() liefert sie mit; wer sie nicht will, filtert. */
function gastFach(stu){ return (stu && stu.nurFach) || ''; }
function ohneGaeste(list){ return (list||[]).filter(function(s){ return !gastFach(s); }); }
function hatGaeste(list){ return (list||[]).some(function(s){ return !!gastFach(s); }); }
// Wer gehört zu einem Kalender-Eintrag bzw. einer Übung dieses Fachs?
function rosterFuerFach(list, subject){
  return (list||[]).filter(function(s){ var f = gastFach(s); return !f || f === subject; });
}
function gaesteDabei(){ return lsGet(LIB_PREFIX+'gaeste_an') === '1'; }
function gaesteOptional(list){ return gaesteDabei() ? (list||[]) : ohneGaeste(list); }
function gaesteToggleHtml(id){
  var an = gaesteDabei();
  return '<button class="kz-tab'+(an?' kz-tab-on':'')+'" id="'+id+'" type="button" hidden title="Fach-Gäste (z.B. Mathe) in Namen-Spielen mitnehmen">👭 Gäste '+(an?'dabei':'aus')+'</button>';
}
// Knopf erst zeigen, wenn die Klasse überhaupt Gäste hat.
function wireGaesteToggle(btn, onChange){
  if(!btn) return;

  btn.addEventListener('click', function(){

    lsSet(LIB_PREFIX+'gaeste_an', an ? '1' : '0');
    btn.classList.toggle('kz-tab-on', an);

    onChange();
  });
}

function submittedCountLabel(entry, roster){
  roster = rosterFuerFach(roster, entry.subject);
  if(!roster || !roster.length) return '';
  var done = roster.filter(function(s){ return entry.submitted && entry.submitted[s.uid]; }).length;

      var unchecked = Array.prototype.slice.call(document.querySelectorAll('.sub-check')).filter(function(cb){ return !cb.checked; });

      try{

          batch.update(kdoc('calendarEntries', entry.id), 'submitted.'+cb.getAttribute('data-uid'), true);
        });
        await batch.commit();
        entry.submitted = entry.submitted || {};

      var checked = Array.prototype.slice.call(document.querySelectorAll('.sub-check')).filter(function(cb){ return cb.checked; });
      if(!checked.length) return;

          batch.update(kdoc('calendarEntries', entry.id), 'submitted.'+cb.getAttribute('data-uid'), false);
        });
        await batch.commit();
        entry.submitted = entry.submitted || {};
        checked.forEach(function(cb){
          cb.checked = false;
          entry.submitted[cb.getAttribute('data-uid')] = false;
        });
        onChanged();
      }catch(err){
        console.error(err);

/* ===================== PUSH-BENACHRICHTIGUNGEN (Erinnerung am Vortag, 18 Uhr) =====================
   Web-Push: der Client abonniert hier über den Service Worker (sw-push.js) einen
   Push-Endpunkt und speichert das Abo in Firestore. Ein täglicher GitHub-Actions-
   Cronjob (admin/send-reminders.js, ausserhalb dieser App) liest morgen fällige
   calendarEntries und verschickt darüber die eigentliche Benachrichtigung - diese
   Datei selbst verschickt nichts, sie verwaltet nur das Abonnement.
   Öffentlicher VAPID-Schlüssel (unbedenklich, im Client sichtbar - das Gegenstück,
   der private Schlüssel, existiert NUR als GitHub-Actions-Secret, niemals hier). */
var VAPID_PUBLIC_KEY = 'BLvslDoJ7RaXfa09e7SpnLg_JWDJKPPi_18NxHRr_NUvvEEtuTBGPUI2dj5oofL8dEECLkKZxXUMGcGbr29MaSQ';

function urlBase64ToUint8Array(base64String){
  var padding = '='.repeat((4 - base64String.length % 4) % 4);
  var base64 = (base64String + padding).replace(/-/g, '+').replace(/_/g, '/');
  var rawData = atob(base64);
  var outputArray = new Uint8Array(rawData.length);
  for(var i=0;i<rawData.length;i++){ outputArray[i] = rawData.charCodeAt(i); }
  return outputArray;
}

async function sha1Hex(str){
  var buf = await crypto.subtle.digest('SHA-1', new TextEncoder().encode(str));
  return Array.prototype.map.call(new Uint8Array(buf), function(b){ return b.toString(16).padStart(2,'0'); }).join('');
}

// Testseite (jnhbr/helfenberger-library-test): gleicher Code, wird jede Nacht live geschaltet.
const IS_TEST_SITE = /-test\//.test(location.pathname);

function pushSupported(){
  return typeof navigator !== 'undefined' && 'serviceWorker' in navigator && 'PushManager' in window && window.isSecureContext;
}
function isIos(){
  return /iphone|ipad|ipod/i.test(navigator.userAgent);
}
function isStandalonePwa(){
  return (window.matchMedia && window.matchMedia('(display-mode: standalone)').matches) || navigator.standalone === true;
}

async function getPushSubscription(){
  if(!pushSupported()) return null;
  var reg = await navigator.serviceWorker.getRegistration('./');
  if(!reg) return null;
  return reg.pushManager.getSubscription();
}

async function enablePushReminders(){
  var reg = await navigator.serviceWorker.register('sw-push.js');
  await navigator.serviceWorker.ready;
  var permission = await Notification.requestPermission();
  if(permission !== 'granted'){ throw new Error('denied'); }
  var sub = await reg.pushManager.subscribe({
    userVisibleOnly: true,
    applicationServerKey: urlBase64ToUint8Array(VAPID_PUBLIC_KEY)
  });
  var subJson = sub.toJSON();
  var subId = await sha1Hex(subJson.endpoint);
  await setDoc(doc(db, 'pushSubscriptions', state.user.uid, 'devices', subId), {
    endpoint: subJson.endpoint,
    keys: subJson.keys,
    userAgent: navigator.userAgent,
    createdAt: serverTimestamp()
  });
}

async function disablePushReminders(){
  var sub = await getPushSubscription();
  if(!sub) return;
  var subJson = sub.toJSON();
  var subId = await sha1Hex(subJson.endpoint);
  await sub.unsubscribe();
  try{ await deleteDoc(doc(db, 'pushSubscriptions', state.user.uid, 'devices', subId)); }
  catch(err){ console.error(err); }
}

function renderPushPopover(){
  var host = document.getElementById('pushPopover');
  if(!host) return;
  if(IS_TEST_SITE){
    host.innerHTML = '<h4>🔔 Erinnerungen</h4>'+
      '<div class="push-hint">Auf der Testseite sind Erinnerungen ausgeschaltet, damit sie nicht doppelt ankommen. Bitte auf der normalen Seite aktivieren.</div>';
    return;
  }
  if(!pushSupported()){
    host.innerHTML = '<h4>🔔 Erinnerungen</h4>'+
      '<div class="push-hint">Dieser Browser unterstützt keine Erinnerungen. Auf dem iPhone: Safari öffnen, dann über "Teilen" &rarr; "Zum Home-Bildschirm" hinzufügen und von dort erneut öffnen.</div>';
    return;
  }
  if(isIos() && !isStandalonePwa()){
    host.innerHTML = '<h4>🔔 Erinnerungen</h4>'+
      '<div class="push-hint">Auf dem iPhone funktionieren Erinnerungen nur, wenn diese Seite zuerst über "Teilen" &rarr; "Zum Home-Bildschirm" hinzugefügt und von dort geöffnet wird.</div>';
    return;
  }
  host.innerHTML = '<h4>🔔 Erinnerungen</h4>'+

    '<div id="pushStatus" class="push-hint">Wird geprüft …</div>'+
    '<button class="btn btn-primary btn-sm" id="pushToggleBtn" type="button" disabled>…</button>';
  var statusEl = document.getElementById('pushStatus');
  var btn = document.getElementById('pushToggleBtn');
  getPushSubscription().then(function(sub){
    var active = !!sub;
    statusEl.textContent = active ? 'Erinnerungen sind aktiviert.' : 'Erinnerungen sind noch nicht aktiviert.';
    btn.textContent = active ? 'Erinnerungen deaktivieren' : 'Erinnerungen aktivieren';
    btn.disabled = false;
    btn.onclick = async function(ev){
      if(ev) ev.stopPropagation();
      btn.disabled = true;
      try{
        if(active){ await disablePushReminders(); toast('Erinnerungen deaktiviert.'); }
        else { await enablePushReminders(); toast('Erinnerungen aktiviert.'); }
        renderPushPopover();
      }catch(err){
        console.error(err);
        if(err && err.message === 'denied'){ toast('Bitte Benachrichtigungen im Browser erlauben.'); }
        else { toast('Erinnerungen konnten nicht aktiviert werden.'); }
        btn.disabled = false;
      }
    };
  }).catch(function(err){ console.error(err); statusEl.textContent = 'Status konnte nicht geprüft werden.'; });
}

/* ===================== DIKTAT-FEHLERANALYSE (Lehrperson) =====================
   Jede Diktat-Übungsseite (Skill diktat-training-uebungsseite) speichert pro
   Versuch eine Fehlerzahl je Rechtschreib-Kategorie (`weakness` in ihrem
   localStorage-Schlüssel "..._attempts") - dank des bestehenden Übungsstand-
   Sync (siehe weiter unten) landet das automatisch, ohne jede Änderung an den
   Diktatseiten, in progress/{uid}/resources/{resourceId}.storeJson.
   Diese Ansicht liest das für alle Schüler:innen und alle Diktate aus und
   fasst es zusammen - kein neues Firestore-Feld, keine neue Regel nötig
   (progress/{uid}/resources/{resourceId} erlaubt der Lehrperson laut
   firestore.rules bereits "allow read: if isOwner(uid) || isTeacher()").
   Kategorie-IDs/Icons/Farben exakt aus dem Skill übernommen - bei Erweiterung
   um neue Kategorien dort UND hier nachführen. */
var DIKTAT_RULE_META = {
  vf:          {name:'V für den F-Laut', icon:'✌️', color:'#2d4a7c'},
  doppel:      {name:'Doppelkonsonanten', icon:'🔠', color:'#8a6314'},

  merkwoerter: {name:'Merkwörter', icon:'🎯', color:'#b8355c'},

  sonstige:    {name:'Sonstige Fehler', icon:'❓', color:'#6b5f4e'}

// Lädt für alle Diktat-Ressourcen des Fachs Deutsch und alle Schüler:innen
// den jeweils letzten Diktatversuch (aus progress/{uid}/resources/{rid}) und
// fasst die Fehlerkategorien pro Schüler:in zusammen. Einmaliger Ladevorgang
// (kein Live-Listener) - die Ansicht hat einen "Neu laden"-Knopf.
async function loadDiktatAuswertung(){
  var result = { resources: [], students: [], perStudent: {} };

  var resSnap = await getDocs(query(kcol('resources'), where('subject','==','deutsch')));
  var diktatResources = [];
  resSnap.forEach(function(d){
    var data = d.data();
    var title = data.title || data.fileName || '';
    if(/diktat/i.test(title)) diktatResources.push(Object.assign({id:d.id}, data));
  });
  diktatResources.sort(function(a,b){ return (a.title||'').localeCompare(b.title||'', 'de'); });
  result.resources = diktatResources;

  var students = ohneGaeste(await loadStudentRoster());
  result.students = students;

  // Jedes {Schüler:in x Diktat}-Paar einzeln lesen (Lehrperson-Leserecht laut
  // firestore.rules) - bei 14-16 Kindern x wenigen Diktaten unproblematisch
  // fürs kostenlose Firestore-Kontingent.
  var reads = [];
  students.forEach(function(stu){
    diktatResources.forEach(function(res){
      reads.push(
        getDoc(doc(db,'progress', stu.uid, 'resources', res.id)).then(function(snap){
          return {uid:stu.uid, resId:res.id, snap:snap};
        }).catch(function(){ return {uid:stu.uid, resId:res.id, snap:null}; })
      );
    });
  });
  var settled = await Promise.all(reads);

  students.forEach(function(stu){
    result.perStudent[stu.uid] = { byResource:{}, categoryTotals:{} };
  });

  settled.forEach(function(r){
    if(!r.snap || !r.snap.exists()) return;
    var data = r.snap.data();
    if(!data.storeJson) return;
    var store;
    try{ store = JSON.parse(data.storeJson); }catch(e){ return; }
    var attemptsKey = Object.keys(store).filter(function(k){ return /_attempts$/.test(k); })[0];
    if(!attemptsKey) return;
    var attempts;
    try{ attempts = JSON.parse(store[attemptsKey]); }catch(e){ return; }
    if(!Array.isArray(attempts) || !attempts.length) return;
    var last = attempts[attempts.length-1];
    var bucket = result.perStudent[r.uid];
    bucket.byResource[r.resId] = { pct: last.pct, date: last.date, attemptCount: attempts.length };
    Object.keys(last.weakness||{}).forEach(function(catId){
      var meta = DIKTAT_RULE_META[catId] ? catId : 'sonstige';
      bucket.categoryTotals[meta] = (bucket.categoryTotals[meta]||0) + last.weakness[catId];
    });
  });

  return result;
}

/* ===================== LERNSTAND-ÜBERSICHT (alle Fächer, Lehrperson) =====================
   Zeigt für jede Übung in jedem Fach, ob und wie viel jede/r Schüler:in
   gelernt hat - aktueller Stand plus die komplette Reset-Historie (siehe
   writeProgressWithHistory oben). Baut auf denselben Rohdaten wie die
   Diktat-Auswertung, aber fachübergreifend und mit sichtbarer Historie. */

function fmtLearnedSummary(s){
  if(!s) return '–';
  if(s.kind==='quiz') return s.attempted+' / '+s.total+(s.pct!==null ? ' ('+s.pct+'% richtig)' : '');
  return s.pct+'% richtig (Versuch '+s.attemptCount+')';
}
function fmtHistoryEntry(h){
  var d = new Date(h.archivedAt);
  var ds = isNaN(d) ? h.archivedAt : d.toLocaleDateString('de-CH', {day:'2-digit', month:'2-digit', year:'numeric'});
  return ds+': '+fmtLearnedSummary(h.summary);
}
// Sekunden (aus progress/{uid}/resources/{rid}.timeSpentSec, siehe Lernzeit-
// Tracking oben) in Stunden auf eine Nachkommastelle. Unter 6 Minuten wird
// nichts angezeigt — zu wenig aussagekräftig, meist nur kurz reingeschaut.
function fmtHours(sec){
  if(!sec) return null;
  var h = Math.round(sec/360)/10;
  if(h < 0.1) return null;
  return h.toString().replace('.',',')+' Std.';
}

// Fächer, die in der Lernstand-Übersicht nichts verloren haben: Berufswahl
// (keine "gelernt"-Metrik im klassischen Sinn) und Lehrerbereich (interne
// Tools, keine Schüler:innen-Übungen).
var LERNSTAND_EXCLUDED_SUBJECTS = ['berufswahl', 'lehrerbereich'];

async function loadLernstandUebersicht(){
  var resSnap = await getDocs(kcol('resources'));
  var resources = [];
  resSnap.forEach(function(d){
    var data = d.data();
    if(LERNSTAND_EXCLUDED_SUBJECTS.indexOf(data.subject) !== -1) return;
    resources.push(Object.assign({id:d.id}, data));
  });
  resources.sort(function(a,b){
    var sa = subjectById(a.subject), sb = subjectById(b.subject);
    var sn = (sa?sa.name:a.subject).localeCompare(sb?sb.name:b.subject, 'de');
    if(sn!==0) return sn;
    // Als "aktuelles Thema" markierte Übungen zuvorderst, sonst alphabetisch.
    var ac = a.current ? 0 : 1, bc = b.current ? 0 : 1;
    if(ac!==bc) return ac-bc;
    return (a.title||a.fileName||'').localeCompare(b.title||b.fileName||'', 'de');
  });

  var students = await loadStudentRoster();

  var reads = [];
  students.forEach(function(stu){
    resources.forEach(function(res){
      if(gastFach(stu) && res.subject !== gastFach(stu)) return;   // Fach-Gast
      reads.push(
        getDoc(doc(db,'progress', stu.uid, 'resources', res.id)).then(function(snap){
          return {uid:stu.uid, resId:res.id, data: snap.exists() ? snap.data() : null};
        }).catch(function(){ return {uid:stu.uid, resId:res.id, data:null}; })
      );
    });
  });
  var settled = await Promise.all(reads);

  var bySubject = {};
  resources.forEach(function(res){
    if(!bySubject[res.subject]) bySubject[res.subject] = {resources:[], cell:{}};
    bySubject[res.subject].resources.push(res);
  });
  settled.forEach(function(r){
    var subj = resources.find(function(x){ return x.id===r.resId; }).subject;
    bySubject[subj].cell[r.uid+'|'+r.resId] = {
      current: learnedSummary(r.data),
      history: (r.data && Array.isArray(r.data.history)) ? r.data.history : [],
      timeSpentSec: (r.data && typeof r.data.timeSpentSec === 'number') ? r.data.timeSpentSec : 0
    };
  });

  return {students:students, bySubject:bySubject};
}

// Offen/zu-Zustand der Fach-Klappboxen. Default: ZU — die Seite startet als
// kompakte Fächerliste, aufgeklappt wird, was gerade interessiert.
function lsFachOffen(subjId){
  try{ return localStorage.getItem('hl_lernstand_auf_'+subjId) === '1'; }
  catch(e){ return false; }
}
function lsFachSetzen(subjId, offen){
  try{
    if(offen) localStorage.setItem('hl_lernstand_auf_'+subjId, '1');
    else localStorage.removeItem('hl_lernstand_auf_'+subjId);
  }catch(e){}
}

      // Ausführliche Historie nur für Zellen mit mindestens einem Reset anzeigen.
