<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Helfenberger's Library</title>
<link rel="icon" href="assets/icon-192.png">
<link rel="apple-touch-icon" href="assets/icon-180.png">
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#3A3F73">
<!-- "Zum Home-Bildschirm hinzufügen" auf iOS ignoriert das Web-Manifest weitgehend und
     braucht diese eigenen Meta-Tags, um als eigenständige App (ohne Safari-Chrome) zu starten. -->
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Library">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Karla:ital,wght@0,400;0,500;0,600;0,700;1,400&display=swap">
<style>
  :root{
    --bg:#F4F5FA;
    --surface:#FFFFFF;
    --surface-2:#EEF0F8;
    --border:#DDE1EE;
    --text:#1C2033;
    --text-muted:#666C87;
    --brand:#3A3F73;
    --brand-ink:#22254A;
    --brand-contrast:#FFFFFF;
    --good:#2E9E5B; --good-soft:#DEF3E6;
    --bad:#E63950; --bad-soft:#FBDDE1;
    --radius:20px;
    --radius-sm:13px;
    --shadow:0 1px 2px rgba(20,20,40,.06), 0 14px 32px -16px rgba(20,20,40,.25);
    color-scheme: light;
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --bg:#14162200; --bg:#14161F; --surface:#1C1F2E; --surface-2:#242840; --border:#323752;
      --text:#EDEEF7; --text-muted:#A0A5C2;
      --brand:#8890E8; --brand-ink:#C4C9FA; --brand-contrast:#14161F;
      --good:#4FCB84; --good-soft:#173428;
      --bad:#F0748A; --bad-soft:#3A1B22;
      --shadow:0 1px 2px rgba(0,0,0,.5), 0 14px 32px -16px rgba(0,0,0,.6);
      color-scheme: dark;
    }
  }
  :root[data-theme="dark"]{
    --bg:#14161F; --surface:#1C1F2E; --surface-2:#242840; --border:#323752;
    --text:#EDEEF7; --text-muted:#A0A5C2;
    --brand:#8890E8; --brand-ink:#C4C9FA; --brand-contrast:#14161F;
    --good:#4FCB84; --good-soft:#173428;
    --bad:#F0748A; --bad-soft:#3A1B22;
    color-scheme: dark;
  }

  *{box-sizing:border-box;}
  html{margin:0;padding:0;background:var(--bg);}
  html,body{min-height:100%;overflow-x:hidden;}
  body{
    margin:0;padding:0;color:var(--text);
    font:15px/1.5 Karla,-apple-system,BlinkMacSystemFont,sans-serif;
    background-color:var(--bg);
    background-image:
      radial-gradient(ellipse at 12% 0%, color-mix(in srgb, var(--brand) 5%, transparent), transparent 45%),
      radial-gradient(ellipse at 100% 100%, color-mix(in srgb, #C98B1F 6%, transparent), transparent 50%),
      linear-gradient(color-mix(in srgb, var(--bg) 88%, transparent), color-mix(in srgb, var(--bg) 88%, transparent)),
      url('assets/background.jpg');
    background-size:auto,auto,cover,cover;
    background-position:center,center,center,center;
    background-repeat:no-repeat;
    background-attachment:fixed;
  }
  /* Mobile: "background-attachment:fixed" combined with a background-image on
     <body> is notoriously unreliable on phone browsers (especially iOS
     Safari) — the photo only paints inside the first viewport-height and then
     disappears while scrolling, since mobile browsers don't reliably repaint
     a fixed background against the dynamic viewport. Rather than fight that,
     the photo layer is simply dropped below this breakpoint (explicit user
     request: keep it on desktop, drop it on the phone/app version); the two
     subtle gradient accents stay so the background doesn't look flat. */
  @media (max-width:600px){
    body{
      background-image:
        radial-gradient(ellipse at 12% 0%, color-mix(in srgb, var(--brand) 5%, transparent), transparent 45%),
        radial-gradient(ellipse at 100% 100%, color-mix(in srgb, #C98B1F 6%, transparent), transparent 50%);
      background-size:auto,auto;
      background-position:center,center;
      background-attachment:scroll;
    }
  }
  .desk-prop{position:fixed;bottom:0;font-size:64px;line-height:1;opacity:.5;pointer-events:none;z-index:0;filter:saturate(.9);}
  .desk-prop-left{left:14px;}
  .desk-prop-right{right:14px;}
  @media (max-width:900px){ .desk-prop{display:none;} }
  #app{position:relative;z-index:1;}
  h1,h2,h3{font-family:'Baloo 2',Karla,sans-serif;margin:0 0 6px;}
  button{font:inherit;cursor:pointer;}
  input{font:inherit;}
  a{color:inherit;}

  #app{min-height:100vh;display:flex;flex-direction:column;}

  /* ---------- Login ---------- */
  .login-wrap{flex:1;display:flex;align-items:center;justify-content:center;padding:24px;}
  .login-card{width:100%;max-width:400px;background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);box-shadow:var(--shadow);padding:36px 32px;text-align:center;}
  .login-logo{width:100%;max-width:210px;margin:0 auto 14px;}
  .login-logo img{width:100%;height:auto;object-fit:contain;display:block;}
  .login-card h1{font-size:26px;color:var(--brand-ink);}
  .login-card p.sub{color:var(--text-muted);margin:0 0 22px;font-size:14px;}
  .login-card input{width:100%;padding:13px 14px;border:2px solid var(--border);border-radius:var(--radius-sm);background:var(--surface-2);color:var(--text);margin-bottom:12px;text-align:center;font-size:16px;}
  .login-card input:focus{outline:none;border-color:var(--brand);}
  .login-card .btn{width:100%;}
  .login-err{background:var(--bad-soft);color:var(--bad);border-radius:var(--radius-sm);padding:10px 12px;font-size:13px;margin-bottom:12px;display:none;}
  .login-err.show{display:block;}
  .login-hint{margin-top:18px;font-size:12px;color:var(--text-muted);}

  /* ---------- Buttons ---------- */
  .btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:12px 20px;border-radius:999px;border:none;font-weight:700;font-size:14px;transition:transform .12s ease, box-shadow .12s ease;}
  .btn:active{transform:scale(.97);}
  .btn-primary{background:var(--brand);color:var(--brand-contrast);box-shadow:0 8px 20px -8px color-mix(in srgb, var(--brand) 60%, transparent);}
  .btn-primary:hover{box-shadow:0 10px 24px -8px color-mix(in srgb, var(--brand) 70%, transparent);}
  .btn-ghost{background:var(--surface-2);color:var(--text);}
  .btn-ghost:hover{background:var(--border);}
  .btn-sm{padding:8px 14px;font-size:13px;}
  .btn-danger{background:var(--bad-soft);color:var(--bad);}

  /* ---------- Chrome / header ---------- */
  .topbar{display:flex;align-items:center;flex-wrap:wrap;row-gap:8px;gap:14px;padding:14px 22px;background:var(--surface);border-bottom:1px solid var(--border);position:sticky;top:0;z-index:20;}
  .topbar-logo{height:36px;width:auto;flex-shrink:0;cursor:pointer;display:flex;align-items:center;}
  .topbar-logo img{height:100%;width:auto;object-fit:contain;display:block;}
  .topbar-title{font-family:'Baloo 2';font-weight:800;font-size:17px;color:var(--brand-ink);cursor:pointer;}
  .topbar-spacer{flex:1;}
  /* margin-left:auto (not just the spacer) so this block still hugs the right edge
     even when it wraps onto its own row on a narrow screen — see the mobile
     breakpoint below, which is what keeps the topbar from overflowing sideways. */
  .topbar-user{display:flex;align-items:center;flex-wrap:wrap;gap:10px;margin-left:auto;font-size:14px;color:var(--text-muted);}
  .topbar-user b{color:var(--text);}
  @media (max-width:480px){
    .topbar{padding:12px 16px;gap:10px;}
    .topbar-user{font-size:12.5px;gap:7px;}
    .badge-teacher{padding:2px 8px;font-size:10px;}
    .topbar-user .btn-sm{padding:7px 12px;font-size:12px;}
  }
  .badge-teacher{background:var(--brand);color:var(--brand-contrast);border-radius:999px;padding:2px 10px;font-size:11px;font-weight:700;letter-spacing:.02em;}

  .content{flex:1;max-width:1100px;margin:0 auto;padding:28px 22px 60px;width:100%;}

  /* ---------- Home / subject grid ---------- */
  /* Wandtafel-Hero: Holzrahmen (aussen) + dunkle Tafel (innen) mit Kreide-Deko */
  .hero-frame{position:relative;background:linear-gradient(160deg,#C89865,#7A4F27);border-radius:20px;padding:9px;margin-bottom:32px;box-shadow:0 18px 40px -18px rgba(20,20,10,.4);}
  .hero{position:relative;overflow:hidden;
    background:radial-gradient(ellipse at 25% 10%, rgba(255,255,255,.07), transparent 55%), linear-gradient(135deg,#20402F 0%,#152A1E 100%);
    border-radius:13px;padding:34px 30px;color:#F4F1E6;}
  .hero h2{font-size:24px;color:#fff;position:relative;z-index:2;}
  .hero p{margin:0;opacity:.9;max-width:480px;color:#E5E2D4;position:relative;z-index:2;}
  .hero-chalk{position:absolute;color:rgba(255,255,255,.4);font-family:'Baloo 2',Karla,sans-serif;font-weight:700;pointer-events:none;user-select:none;z-index:1;}
  .hero-chalk-1{top:22px;right:132px;font-size:19px;transform:rotate(-4deg);}
  .hero-chalk-2{bottom:24px;right:76px;font-size:15px;transform:rotate(3deg);opacity:.85;}
  .hero-chalk-3{top:56px;right:48px;font-size:34px;opacity:.5;}
  .hero-chalk-4{bottom:18px;right:172px;font-size:28px;opacity:.4;}
  @media (max-width:700px){ .hero-chalk{display:none;} .hero p{max-width:100%;} }

  .subject-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:20px;}
  @media (max-width:840px){ .subject-grid{grid-template-columns:repeat(2,1fr);} }
  @media (max-width:560px){ .subject-grid{grid-template-columns:1fr;} }
  .subject-card{background:var(--surface);border:1px solid var(--border);border-radius:22px;padding:22px 20px;text-align:left;box-shadow:var(--shadow);transition:transform .15s ease, box-shadow .15s ease;display:flex;align-items:center;gap:18px;min-height:150px;}
  .subject-card:hover{transform:translateY(-3px);box-shadow:0 18px 34px -16px rgba(20,20,40,.32);}
  .subject-card-body{flex:1;min-width:0;display:flex;flex-direction:column;gap:9px;}
  .subject-visual{border-radius:18px;display:flex;align-items:center;justify-content:center;flex-shrink:0;overflow:hidden;}
  .subject-visual img{width:100%;height:100%;object-fit:contain;padding:11px;box-sizing:border-box;display:block;}
  .subject-card .subject-visual{width:84px;height:84px;}
  .subject-head .subject-visual{width:56px;height:56px;border-radius:16px;}
  .subject-card h3{font-size:18px;}
  .subject-meta{font-size:12.5px;color:var(--text-muted);}
  .subject-bar{height:7px;border-radius:99px;background:var(--surface-2);overflow:hidden;}
  .subject-bar span{display:block;height:100%;border-radius:99px;transition:width .4s ease;}

  /* ---------- Subject page ---------- */
  .back-row{display:flex;align-items:center;gap:10px;margin-bottom:18px;}
  .subject-head{display:flex;align-items:center;gap:14px;margin-bottom:22px;}
  .subject-head h2{font-size:24px;}

  .resource-list{display:flex;flex-direction:column;gap:12px;}
  .resource-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-sm);padding:16px 18px;box-shadow:var(--shadow);display:flex;align-items:center;gap:16px;flex-wrap:wrap;transition:border-color .15s ease, box-shadow .15s ease;}
  .resource-card.current{border-color:var(--bad);box-shadow:var(--shadow), inset 4px 0 0 var(--bad);}
  .resource-info{flex:1;min-width:200px;}
  .resource-info h4{margin:0 0 4px;font-size:15.5px;display:flex;align-items:center;gap:8px;flex-wrap:wrap;}
  .chip-current{background:var(--bad-soft);color:var(--bad);border-radius:999px;padding:2px 10px;font-size:11px;font-weight:700;letter-spacing:.02em;}
  .resource-bar{height:6px;border-radius:99px;background:var(--surface-2);overflow:hidden;width:100%;max-width:260px;margin-top:6px;}
  .resource-bar span{display:block;height:100%;border-radius:99px;}
  .resource-meta{font-size:12px;color:var(--text-muted);margin-top:4px;}
  .resource-actions{display:flex;align-items:center;gap:8px;flex-shrink:0;}
  .move-btns{display:flex;flex-direction:column;gap:2px;flex-shrink:0;}
  .move-btn{width:26px;height:22px;border-radius:7px;border:1px solid var(--border);background:var(--surface-2);color:var(--text-muted);display:flex;align-items:center;justify-content:center;cursor:pointer;padding:0;}
  .move-btn:hover:not(:disabled){background:var(--border);color:var(--text);}
  .move-btn:disabled{opacity:.35;cursor:default;}
  .move-btn svg{width:13px;height:13px;}
  .btn-current{background:var(--bad-soft);color:var(--bad);}
  .btn-current.active{background:var(--bad);color:#fff;}

  .empty-state{background:var(--surface);border:1px dashed var(--border);border-radius:var(--radius);padding:36px 20px;text-align:center;color:var(--text-muted);}


  /* ---------- Ordner (Unterordner pro Fach) ---------- */
  .crumbs{display:flex;align-items:center;gap:6px;flex-wrap:wrap;font-size:13.5px;color:var(--text-muted);margin-bottom:16px;}
  .crumbs button{background:none;border:0;padding:2px 4px;border-radius:6px;font:inherit;color:var(--brand-ink);cursor:pointer;}
  .crumbs button:hover{background:var(--surface-2);text-decoration:underline;}
  .crumbs .sep{opacity:.5;}
  .crumbs .here{color:var(--text);font-weight:700;}

  .folder-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-sm);padding:14px 18px;box-shadow:var(--shadow);display:flex;align-items:center;gap:16px;flex-wrap:wrap;}
  .folder-card.has-current{border-color:var(--bad);box-shadow:var(--shadow), inset 4px 0 0 var(--bad);}
  .folder-open{display:flex;align-items:center;gap:12px;flex:1;min-width:200px;background:none;border:0;padding:0;font:inherit;color:inherit;text-align:left;cursor:pointer;}
  .folder-glyph{width:40px;height:40px;border-radius:11px;display:flex;align-items:center;justify-content:center;flex-shrink:0;background:var(--surface-2);}
  .folder-glyph svg{width:22px;height:22px;}
  .folder-name{font-weight:700;font-size:15.5px;display:flex;align-items:center;gap:8px;flex-wrap:wrap;}
  .folder-count{font-size:12px;color:var(--text-muted);margin-top:2px;}
  .folder-actions{display:flex;align-items:center;gap:8px;flex-shrink:0;flex-wrap:wrap;}
  .section-label{font-size:12px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;color:var(--text-muted);margin:4px 2px -2px;}

  /* ---------- Eigener Dialog (nie window.confirm/prompt — siehe Vollbild-Hinweis) ---------- */
  .modal-overlay{position:fixed;inset:0;background:rgba(15,16,32,.55);display:none;align-items:center;justify-content:center;padding:20px;z-index:2000;}
  .modal-overlay.show{display:flex;}
  .modal{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);box-shadow:0 24px 60px rgba(0,0,0,.28);width:100%;max-width:440px;max-height:85vh;overflow:auto;padding:22px;}
  .modal h3{font-size:18px;margin:0 0 8px;}
  .modal p{font-size:14px;color:var(--text-muted);margin:0 0 16px;line-height:1.5;}
  .modal input[type=text]{width:100%;padding:11px 13px;border:1px solid var(--border);border-radius:10px;font:inherit;background:var(--surface-2);color:var(--text);margin-bottom:16px;}
  .modal input[type=text]:focus{outline:2px solid var(--brand);outline-offset:1px;}
  .modal-actions{display:flex;gap:10px;justify-content:flex-end;flex-wrap:wrap;}
  .pick-list{display:flex;flex-direction:column;gap:6px;margin-bottom:16px;}
  .pick-item{display:flex;align-items:center;gap:8px;width:100%;text-align:left;padding:10px 12px;border:1px solid var(--border);border-radius:10px;background:var(--surface-2);font:inherit;color:var(--text);cursor:pointer;}
  .pick-item:hover:not(:disabled){border-color:var(--brand);background:var(--surface);}
  .pick-item:disabled{opacity:.45;cursor:default;}
  .pick-item .pick-here{margin-left:auto;font-size:11px;font-weight:700;color:var(--text-muted);text-transform:uppercase;letter-spacing:.05em;}

  /* ---------- Teacher upload zone ---------- */
  .dropzone{border:2.5px dashed var(--border);border-radius:var(--radius);padding:28px 20px;text-align:center;color:var(--text-muted);margin-bottom:22px;background:var(--surface);transition:border-color .15s ease, background .15s ease;}
  .dropzone.drag{border-color:var(--brand);background:var(--surface-2);color:var(--text);}
  .dropzone input[type=file]{display:none;}
  .dropzone .dz-title{font-weight:700;color:var(--text);margin-bottom:4px;}
  .upload-progress{margin-top:14px;font-size:13px;color:var(--brand-ink);display:none;}
  .upload-progress.show{display:block;}

  /* ---------- Resource viewer ---------- */
  .viewer-wrap{display:flex;flex-direction:column;gap:14px;}
  .viewer-head{display:flex;align-items:center;gap:12px;flex-wrap:wrap;}
  .viewer-head h2{font-size:19px;flex:1;}
  .viewer-progress{font-size:13px;color:var(--text-muted);}
  .viewer-frame-wrap{position:relative;background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);box-shadow:var(--shadow);overflow:hidden;height:calc(100vh - 210px);min-height:420px;}
  .viewer-frame-wrap iframe{width:100%;height:100%;border:0;display:block;background:#fff;}
  .viewer-frame-wrap:fullscreen,
  .viewer-frame-wrap:-webkit-full-screen{border-radius:0;border:0;height:100vh;}
  .viewer-frame-wrap:fullscreen iframe,
  .viewer-frame-wrap:-webkit-full-screen iframe{height:100%;}
  /* Safari on iOS (incl. installed "Zum Home-Bildschirm"-Apps) has no Fullscreen
     API at all for arbitrary elements — requestFullscreen is simply undefined
     there, so the native path above never applies. For that case we fake it with
     plain CSS: cover the whole viewport with position:fixed instead. Same visual
     result, works everywhere, and uses the same enter/exit button pair. */
  .viewer-frame-wrap.pseudo-fullscreen{position:fixed;inset:0;z-index:1000;width:100vw;height:100vh;height:100dvh;border-radius:0;border:0;box-shadow:none;}
  .viewer-frame-wrap.pseudo-fullscreen iframe{height:100%;}
  body.pseudo-fs-active{overflow:hidden;}
  /* #fsBtn (in .viewer-head) sits OUTSIDE #frameWrap, so once #frameWrap is the
     Fullscreen-API element (or, in the CSS fallback above, position:fixed over
     everything), #fsBtn is no longer part of what's on screen and can't be
     clicked — Esc was the only way out for native fullscreen, and there was no
     way out at all for the CSS fallback. This overlay button lives INSIDE
     #frameWrap instead, so it stays visible/clickable in both fullscreen modes,
     and is hidden the rest of the time via the selectors below. */
  .btn-fs-overlay-exit{position:absolute;top:14px;right:14px;z-index:5;display:none;align-items:center;justify-content:center;width:40px;height:40px;border-radius:999px;border:none;background:rgba(20,20,32,.55);color:#fff;cursor:pointer;backdrop-filter:blur(2px);transition:background .15s ease;}
  .btn-fs-overlay-exit:hover{background:rgba(20,20,32,.78);}
  .btn-fs-overlay-exit svg{width:18px;height:18px;}
  .viewer-frame-wrap:fullscreen .btn-fs-overlay-exit,
  .viewer-frame-wrap:-webkit-full-screen .btn-fs-overlay-exit,
  .viewer-frame-wrap.pseudo-fullscreen .btn-fs-overlay-exit{display:flex;}
  .btn-fs svg{width:15px;height:15px;}

  .toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);background:var(--brand-ink);color:#fff;padding:11px 20px;border-radius:999px;font-size:13.5px;box-shadow:var(--shadow);z-index:99;opacity:0;pointer-events:none;transition:opacity .25s ease, transform .25s ease;}
  .toast.show{opacity:1;transform:translateX(-50%) translateY(-6px);}

  .spinner-wrap{flex:1;display:flex;align-items:center;justify-content:center;color:var(--text-muted);font-size:14px;}

  @media (max-width:560px){
    .content{padding:20px 14px 50px;}
  }
</style>
</head>
<body>
<div class="desk-prop desk-prop-left" aria-hidden="true">📚</div>
<div class="desk-prop desk-prop-right" aria-hidden="true">☕✏️</div>
<div id="app"><div class="spinner-wrap">Lädt …</div></div>
<div class="toast" id="toast"></div>
<div class="modal-overlay" id="modalOverlay"></div>

<script type="module">
import {
  initializeApp
} from "https://www.gstatic.com/firebasejs/10.13.0/firebase-app.js";
import {
  getAuth, signInWithEmailAndPassword, onAuthStateChanged, signOut, setPersistence, browserLocalPersistence
} from "https://www.gstatic.com/firebasejs/10.13.0/firebase-auth.js";
import {
  getFirestore, doc, getDoc, setDoc, deleteDoc, collection, query, where, onSnapshot, serverTimestamp, writeBatch
} from "https://www.gstatic.com/firebasejs/10.13.0/firebase-firestore.js";

/* =====================================================================
   FIREBASE CONFIG — replace with your own project's web config.
   Firebase Console -> Project settings -> "Your apps" -> Web app -> SDK setup.
   This object is NOT a secret; access is controlled by the security rules
   (firestore.rules) and by Firebase Authentication, not by hiding this
   config. See README.md.

   NOTE: this build deliberately does NOT use Firebase Storage (Cloud
   Storage now requires the paid "Blaze" plan / a credit card on file even
   though usage itself stays free for a class this size). Instead, uploaded
   exercise pages are stored as text inside Firestore documents — Firestore's
   free "Spark" plan needs no billing account at all. Since a single Firestore
   document is capped at ~1 MiB, a larger file is automatically split into
   several ~900 KB chunk documents on upload (see chunkStringByBytes below)
   and reassembled on read; MAX_RESOURCE_BYTES below is the overall cap per
   uploaded resource, spread across as many chunks as needed.
   ===================================================================== */
const firebaseConfig = {
  apiKey: "AIzaSyBOWbHJY14UXUy3sTQa2bfh8PW9CgvVADA",
  authDomain: "helfenberger-s-library.firebaseapp.com",
  projectId: "helfenberger-s-library",
  messagingSenderId: "622245734842",
  appId: "1:622245734842:web:793d29f2c229aa01d2d583"

const MAX_CHUNK_BYTES = 900 * 1024; // safety margin under Firestore's 1 MiB per-document limit
const MAX_RESOURCE_BYTES = 8 * 1024 * 1024; // overall cap per uploaded resource (spread across chunks if needed)

// Splits a string into pieces that each stay under maxBytes when UTF-8 encoded,
// without ever cutting a multi-byte character (or a surrogate pair) in half —
// so plain string concatenation on read always reproduces the original text exactly.
// Uses a binary search per chunk boundary (not a linear character-by-character
// shrink) so it stays fast even on heavily multi-byte text (umlauts, emoji).
function chunkStringByBytes(str, maxBytes){
  var encoder = new TextEncoder();
  var chunks = [];
  var start = 0;
  var n = str.length;
  while(start < n){
    if(encoder.encode(str.slice(start)).length <= maxBytes){
      chunks.push(str.slice(start));
      break;
    }
    var lo = start + 1, hi = n;
    while(lo < hi){
      var mid = Math.ceil((lo + hi) / 2);
      var len = encoder.encode(str.slice(start, mid)).length;
      if(len <= maxBytes){ lo = mid; } else { hi = mid - 1; }
    }
    var end = lo;
    // never split a surrogate pair (emoji etc.)
    if(end < n){
      var code = str.charCodeAt(end - 1);
      if(code >= 0xD800 && code <= 0xDBFF){ end--; }
    }
    if(end <= start){ end = start + 1; } // pathological fallback, avoids an infinite loop
    chunks.push(str.slice(start, end));
    start = end;
  }
  return chunks.length ? chunks : [''];
}

function slugName(name){
  return name.trim().toLowerCase()
    .replace(/ä/g,'ae').replace(/ö/g,'oe').replace(/ü/g,'ue').replace(/ß/g,'ss')
    .replace(/[^a-z0-9-]/g,'');
}

async function doLogin(rawName){
  var slug = slugName(rawName);
  if(!slug){ throw new Error('leer'); }
  var email = slug + '@' + EMAIL_DOMAIN;
  var password = slug + PASSWORD_SUFFIX;
  await setPersistence(auth, browserLocalPersistence);
  await signInWithEmailAndPassword(auth, email, password);
}

function doLogout(){
  Object.values(state.progressUnsubs).forEach(function(fn){ try{fn();}catch(e){} });
  state.progressUnsubs = {};
  clearSubjectWatchers();
  signOut(auth);
}

onAuthStateChanged(auth, async function(user){
  state.user = user;
  if(!user){
    state.profile = null;
    state.route = {name:'login'};
    render();
    return;
  }
  try{
    var snap = await getDoc(doc(db, 'students', user.uid));
    if(!snap.exists()){
      toast('Kein Profil gefunden – bitte Lehrperson kontaktieren.');
      await signOut(auth);
      return;
    }
    state.profile = snap.data();
    state.route = {name:'home'};
    render();
  }catch(err){
    console.error(err);
    toast('Fehler beim Laden des Profils.');
  }
});

function progressFor(resourceId){ return state.progressCache[resourceId] || null; }

function watchProgress(resourceId, onChange){
  if(state.progressUnsubs[resourceId]) return;
  var ref_ = doc(db, 'progress', state.user.uid, 'resources', resourceId);
  state.progressUnsubs[resourceId] = onSnapshot(ref_, function(snap){
    var data = snap.exists() ? snap.data() : null;
    var stats = (data && data.stats) || {};
    var total = data && typeof data.total === 'number' ? data.total : null;
    var attempted = 0, correct = 0;
    Object.keys(stats).forEach(function(k){
      if(stats[k] && stats[k].status){ attempted++; if(stats[k].status==='correct') correct++; }
    });
    state.progressCache[resourceId] = {
      attempted:attempted, correct:correct, total:total,
      coveragePct: total ? Math.round(attempted/total*100) : null,
      // "% richtig" muss mit der Formel in den Übungsseiten selbst übereinstimmen
      // (naehrstoffe_training.html / industrialisierung_training.html:
      // richtig / ALLE Aufgaben insgesamt, sinkt nie mehr) — vorher stand hier
      // richtig/bereits-bearbeitet, was bei wenigen Versuchen fälschlich hoch
      // wirkte und nicht zur Anzeige in der Übung selbst passte.
      correctPct: total ? Math.round(correct/total*100) : (attempted ? Math.round(correct/attempted*100) : null)
    };
    if(onChange) onChange(state.progressCache[resourceId]);
  }, function(err){ console.error(err); });
}

function unwatchAllProgress(){
  Object.values(state.progressUnsubs).forEach(function(fn){ try{fn();}catch(e){} });
  state.progressUnsubs = {};
}

/* ===================== ORDNER: Datenmodell & Helfer =====================

   Firestore-Collection `folders`:
     folders/{folderId} -> {subject, parentId, name, order, createdAt, createdBy}
       parentId === null  ->  Ordner liegt direkt im Fach
       parentId === '<id>' -> Ordner liegt in diesem Ordner (beliebig tief)

   Eine Übung (resources/{id}) liegt in genau einem Container:
     folderId fehlt/null   ->  direkt im Fach  (so liegen alle Altbestände)
     folderId === '<id>'   ->  in diesem Ordner

   Beide Queries filtern NUR nach `subject` (reine Gleichheitsbedingung, kein
   orderBy) — damit braucht es weiterhin KEINEN Firestore-Composite-Index.
   Sortiert und verschachtelt wird alles im Client; pro Fach sind es nur ein
   paar Dutzend Dokumente.
   ===================================================================== */

var MAX_FOLDER_DEPTH = 6;   // Sicherheitsnetz gegen versehentlich tiefe Bäume

function clearSubjectWatchers(){
  if(state.resourceUnsub){ try{ state.resourceUnsub(); }catch(e){} state.resourceUnsub = null; }
  if(state.folderUnsub){ try{ state.folderUnsub(); }catch(e){} state.folderUnsub = null; }
}

function folderById(id){
  if(!id) return null;
  for(var i=0;i<state.folders.length;i++){ if(state.folders[i].id === id) return state.folders[i]; }
  return null;
}

// Kette vom obersten Ordner bis zum angegebenen (für die Brotkrumen-Navigation).
// Der Zähler bricht ab, falls je ein Zyklus in den Daten landen sollte.
function folderChain(folderId){
  var chain = [], guard = 0, cur = folderById(folderId);
  while(cur && guard++ < 50){ chain.unshift(cur); cur = folderById(cur.parentId); }
  return chain;
}

function foldersIn(parentId){
  var list = state.folders.filter(function(f){ return (f.parentId || null) === (parentId || null); });
  sortByOrder(list, 'name');
  return list;
}

function resourcesIn(folderId){
  var list = state.resources.filter(function(r){ return (r.folderId || null) === (folderId || null); });
  sortResources(list);
  return list;
}

// Alle Nachfahren-Ordner-Ids (inkl. des Ordners selbst) — für die Zählung im
// Ordner-Kärtchen und um zu verhindern, dass ein Ordner in sich selbst wandert.
function subtreeIds(folderId){
  var ids = [folderId], queue = [folderId], guard = 0;
  while(queue.length && guard++ < 500){
    var cur = queue.shift();
    state.folders.forEach(function(f){
      if((f.parentId || null) === cur && ids.indexOf(f.id) < 0){ ids.push(f.id); queue.push(f.id); }
    });
  }
  return ids;
}

function subtreeCounts(folderId){
  var ids = subtreeIds(folderId);
  var res = state.resources.filter(function(r){ return ids.indexOf(r.folderId || null) >= 0; });
  return { folders: ids.length - 1, resources: res.length, hasCurrent: res.some(function(r){ return !!r.current; }) };
}

function folderDepth(folderId){ return folderChain(folderId).length; }

function sortByOrder(list, fallbackField){
  list.sort(function(a,b){
    var oa = typeof a.order === 'number' ? a.order : null;
    var ob = typeof b.order === 'number' ? b.order : null;
    if(oa !== null && ob !== null && oa !== ob) return oa - ob;
    if(oa !== null && ob === null) return -1;
    if(oa === null && ob !== null) return 1;
    return String(a[fallbackField]||'').localeCompare(String(b[fallbackField]||''), 'de');
  });
  return list;
}

}

// Zielauswahl für "Verschieben": zeigt die Fach-Hauptebene und darunter den
// eingerückten Ordnerbaum des GLEICHEN Fachs. `blockedIds` schliesst Ordner aus
// (ein Ordner darf nie in sich selbst oder einen seiner Unterordner wandern),
// `currentId` markiert den jetzigen Ort und ist nicht anklickbar.
function uiPickFolder(title, description, currentId, blockedIds, onPick){
  var rows = '';
  function row(id, label, depth, disabled, reason){
    rows += '<button class="pick-item" type="button" data-target="'+(id===null?'__root__':esc(id))+'"'+(disabled?' disabled':'')+
      ' style="padding-left:'+(12 + depth*18)+'px">'+
      '<svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/></svg>'+
      '<span>'+esc(label)+'</span>'+
      (reason ? '<span class="pick-here">'+esc(reason)+'</span>' : '')+
      '</button>';
  }
  row(null, 'Fach-Hauptebene', 0, (currentId||null) === null, (currentId||null) === null ? 'hier' : '');
  (function walk(parentId, depth){
    foldersIn(parentId).forEach(function(f){
      var blocked = blockedIds.indexOf(f.id) >= 0;
      var isHere = f.id === currentId;
      row(f.id, f.name, depth + 1, blocked || isHere, isHere ? 'hier' : '');
      if(depth + 1 < MAX_FOLDER_DEPTH) walk(f.id, depth + 1);
    });
  })(null, 0);

  openModal(
    '<h3>'+esc(title)+'</h3>'+
    (description ? '<p>'+esc(description)+'</p>' : '')+
    '<div class="pick-list">'+rows+'</div>'+
    '<div class="modal-actions"><button class="btn btn-ghost btn-sm" id="modalCancel" type="button">Abbrechen</button></div>'
  );
  document.getElementById('modalCancel').addEventListener('click', closeModal);
  Array.prototype.forEach.call(modalEl.querySelectorAll('.pick-item'), function(btn){
    btn.addEventListener('click', function(){
      var t = btn.getAttribute('data-target');
      closeModal();
      onPick(t === '__root__' ? null : t);
    });
  });
}

    document.getElementById('newFolderBtn').addEventListener('click', function(){
      var here = state.route.folderId || null;
      if(folderDepth(here) >= MAX_FOLDER_DEPTH){
        uiInfo('Zu tief verschachtelt', 'Mehr als '+MAX_FOLDER_DEPTH+' Ordner-Ebenen sind nicht vorgesehen — sonst wird das Zurechtfinden für die Klasse mühsam.');
        return;
      }
      uiPrompt('Neuer Ordner', 'Wie soll der Ordner heissen? (z.B. «Diktate»)', '', 'Anlegen', function(name){
        createFolder(subjectId, here, name);
      });
    });
  }

  var loaded = {res:false, fold:false};
  function maybeRender(){ if(loaded.res && loaded.fold) renderFolderContents(); }

  var qf = query(collection(db,'folders'), where('subject','==',subjectId));
  state.folderUnsub = onSnapshot(qf, function(snap){
    state.folders = [];
    snap.forEach(function(d){ state.folders.push(Object.assign({id:d.id}, d.data())); });
    loaded.fold = true;
    maybeRender();
  }, function(err){ console.error(err); loaded.fold = true; maybeRender(); });

  var qr = query(collection(db,'resources'), where('subject','==',subjectId));
  state.resourceUnsub = onSnapshot(qr, function(snap){
    state.resources = [];
    snap.forEach(function(d){ state.resources.push(Object.assign({id:d.id}, d.data())); });
    loaded.res = true;
    maybeRender();
  }, function(err){
    console.error(err);
    var listEl = document.getElementById('resourceList');
    if(listEl) listEl.innerHTML = '<div class="empty-state">Übungen konnten nicht geladen werden.</div>';
  });
}

// Zeichnet Brotkrumen + den Inhalt des gerade offenen Containers neu. Wird bei
// jeder Snapshot-Änderung und nach jeder Navigation in einen Unterordner
// aufgerufen — die Firestore-Listener bleiben dabei bestehen (sie hängen am
// ganzen Fach, nicht am einzelnen Ordner).
function renderFolderContents(){
  var listEl = document.getElementById('resourceList');
  if(!listEl) return;
  var subjectId = state.route.subject;
  var here = state.route.folderId || null;
  var isTeacher = state.profile.role === 'teacher';
  var s = subjectById(subjectId);

  // Ordner könnte inzwischen (z.B. auf einem anderen Gerät) gelöscht worden sein
  if(here && !folderById(here)){ state.route.folderId = null; here = null; }

  var chain = folderChain(here);
  var crumbHtml = '<button type="button" data-crumb="__root__">'+esc(s.name)+'</button>';
  chain.forEach(function(f, i){
    crumbHtml += '<span class="sep">/</span>';
    crumbHtml += (i === chain.length-1)
      ? '<span class="here">'+esc(f.name)+'</span>'
      : '<button type="button" data-crumb="'+esc(f.id)+'">'+esc(f.name)+'</button>';
  });
  var crumbEl = document.getElementById('crumbs');
  if(crumbEl){
    // Auf der Fach-Hauptebene wäre die Brotkrume nur eine Wiederholung der
    // Überschrift — erst ab dem ersten Ordner ist sie eine echte Navigation.
    crumbEl.style.display = chain.length ? 'flex' : 'none';
    crumbEl.innerHTML = crumbHtml;
    Array.prototype.forEach.call(crumbEl.querySelectorAll('button'), function(b){
      b.addEventListener('click', function(){
        var t = b.getAttribute('data-crumb');
        goSubject(subjectId, t === '__root__' ? null : t);
      });
    });
  }
  var dzTarget = document.getElementById('dzTarget');
  if(dzTarget){
    dzTarget.innerHTML = here
      ? 'Die Datei landet im Ordner <b>'+esc(folderById(here).name)+'</b>.'
      : 'Die Datei landet direkt im Fach <b>'+esc(s.name)+'</b>.';
  }

  var folders = foldersIn(here);
  var resources = resourcesIn(here);

  if(!folders.length && !resources.length){
    listEl.innerHTML = '<div class="empty-state">'+
      (here ? 'Dieser Ordner ist noch leer.' : 'Für dieses Fach gibt es noch keine Übung.')+
      (isTeacher ? ' Lade oben eine Datei hoch oder lege einen Ordner an.' : ' Schau später wieder vorbei!')+
      '</div>';
    return;
  }

  var html = '';
  if(folders.length){
    html += '<div class="section-label">Ordner</div>';
    html += folders.map(function(f, i){ return folderCardHtml(f, i, folders.length, isTeacher); }).join('');
  }
  if(resources.length){
    if(folders.length) html += '<div class="section-label">Übungen</div>';
    html += resources.map(function(r, i){ return resourceCardHtml(r, i, resources.length, isTeacher); }).join('');
  }
  listEl.innerHTML = html;

  folders.forEach(function(f, i){
    document.getElementById('fopen-'+f.id).addEventListener('click', function(){ goSubject(subjectId, f.id); });
    if(!isTeacher) return;
    document.getElementById('fup-'+f.id).addEventListener('click', function(){ reorderFolder(folders, i, -1); });
    document.getElementById('fdown-'+f.id).addEventListener('click', function(){ reorderFolder(folders, i, 1); });
    document.getElementById('frename-'+f.id).addEventListener('click', function(){
      uiPrompt('Ordner umbenennen', null, f.name, 'Speichern', function(name){ renameFolder(f, name); });
    });
    document.getElementById('fmove-'+f.id).addEventListener('click', function(){ askMoveFolder(f); });
    document.getElementById('fdel-'+f.id).addEventListener('click', function(){ askDeleteFolder(f); });
  });

  resources.forEach(function(r, i){
    watchProgress(r.id, function(p){ updateResourceBar(r.id, p); });
    var openBtn = document.getElementById('open-'+r.id);
    if(openBtn) openBtn.addEventListener('click', function(){ goResource(r); });
    if(!isTeacher) return;
    document.getElementById('del-'+r.id).addEventListener('click', function(){ askDeleteResource(r); });
    document.getElementById('up-'+r.id).addEventListener('click', function(){ moveResource(resources, i, -1); });
    document.getElementById('down-'+r.id).addEventListener('click', function(){ moveResource(resources, i, 1); });
    document.getElementById('cur-'+r.id).addEventListener('click', function(){ toggleCurrent(resources, r); });
    document.getElementById('mv-'+r.id).addEventListener('click', function(){ askMoveResource(r); });
  });
}

function folderCardHtml(f, index, total, isTeacher){
  var c = subtreeCounts(f.id);
  var parts = [];
  if(c.folders) parts.push(c.folders+' Ordner');
  parts.push(c.resources+' Übung'+(c.resources===1?'':'en'));

  var html = '<div class="folder-card'+(c.hasCurrent?' has-current':'')+'" id="fcard-'+f.id+'">';
  if(isTeacher){
    html += '<div class="move-btns">';
    html += '<button class="move-btn" id="fup-'+f.id+'" type="button" title="Nach oben"'+(index===0?' disabled':'')+'><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M6 15l6-6 6 6"/></svg></button>';
    html += '<button class="move-btn" id="fdown-'+f.id+'" type="button" title="Nach unten"'+(index===total-1?' disabled':'')+'><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9l6 6 6-6"/></svg></button>';
    html += '</div>';
  }
  html += '<button class="folder-open" id="fopen-'+f.id+'" type="button">';
  html += '<span class="folder-glyph"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/></svg></span>';
  html += '<span><span class="folder-name">'+esc(f.name)+(c.hasCurrent?' <span class="chip-current">Aktuelles Thema</span>':'')+'</span>';
  html += '<span class="folder-count">'+parts.join(' · ')+'</span></span>';
  html += '</button>';
  if(isTeacher){
    html += '<div class="folder-actions">';
    html += '<button class="btn btn-ghost btn-sm" id="frename-'+f.id+'" type="button">Umbenennen</button>';
    html += '<button class="btn btn-ghost btn-sm" id="fmove-'+f.id+'" type="button">Verschieben</button>';
    html += '<button class="btn btn-danger btn-sm" id="fdel-'+f.id+'" type="button">Löschen</button>';
    html += '</div>';
  }
  html += '</div>';
  return html;
}

/* ===================== ORDNER-AKTIONEN (nur Lehrperson) ===================== */

function createFolder(subjectId, parentId, name){
  var siblings = foldersIn(parentId);
  var id = subjectId+'_f_'+Date.now();
  setDoc(doc(db,'folders', id), {
    subject: subjectId,
    parentId: parentId || null,
    name: name.slice(0,60),
    order: siblings.length,
    createdAt: serverTimestamp(),
    createdBy: state.user.uid
  }).then(function(){ toast('Ordner «'+name+'» angelegt.'); })
    .catch(function(err){ console.error(err); toast('Ordner konnte nicht angelegt werden.'); });
}

function renameFolder(f, name){
  setDoc(doc(db,'folders', f.id), {name: name.slice(0,60)}, {merge:true})
    .catch(function(err){ console.error(err); toast('Umbenennen fehlgeschlagen.'); });
}

// Reihenfolge der Ordner innerhalb desselben Elternordners (gleiches Muster wie
// bei den Übungen: nach dem Tausch bekommt JEDER Ordner der Liste eine frische
// 0..n-1-Nummer, damit auch nie manuell sortierte Ordner konsistent bleiben).
function reorderFolder(folders, index, direction){
  var newIndex = index + direction;
  if(newIndex < 0 || newIndex >= folders.length) return;
  var reordered = folders.slice();
  var tmp = reordered[index]; reordered[index] = reordered[newIndex]; reordered[newIndex] = tmp;
  var batch = writeBatch(db);
  reordered.forEach(function(f, i){ batch.update(doc(db,'folders', f.id), {order: i}); });
  batch.commit().catch(function(err){ console.error(err); toast('Verschieben fehlgeschlagen.'); });
}

function askMoveFolder(f){
  // Ein Ordner darf weder in sich selbst noch in einen seiner eigenen
  // Unterordner wandern — sonst hinge der Teilbaum in einem Zyklus fest.
  var blocked = subtreeIds(f.id);
  uiPickFolder('«'+f.name+'» verschieben', 'Wohin soll der Ordner mit seinem ganzen Inhalt?', f.parentId || null, blocked, function(targetId){
    var ownHeight = maxDepthBelow(f.id);
    if(folderDepth(targetId) + 1 + ownHeight > MAX_FOLDER_DEPTH){
      uiInfo('Zu tief verschachtelt', 'Dort würden mehr als '+MAX_FOLDER_DEPTH+' Ordner-Ebenen entstehen. Wähle einen Ort weiter oben.');
      return;
    }
    var siblings = foldersIn(targetId);
    setDoc(doc(db,'folders', f.id), {parentId: targetId || null, order: siblings.length}, {merge:true})
      .then(function(){ toast('«'+f.name+'» verschoben.'); })
      .catch(function(err){ console.error(err); toast('Verschieben fehlgeschlagen.'); });
  });
}

// Wie viele Ebenen hängen unter diesem Ordner noch dran? (0 = keine Unterordner)
function maxDepthBelow(folderId){
  var kids = state.folders.filter(function(f){ return (f.parentId||null) === folderId; });
  if(!kids.length) return 0;
  return 1 + Math.max.apply(null, kids.map(function(k){ return maxDepthBelow(k.id); }));
}

// Löschen bewusst nur, wenn wirklich nichts mehr drin ist — so kann nie
// versehentlich eine ganze Übungssammlung mitverschwinden.
function askDeleteFolder(f){
  var c = subtreeCounts(f.id);
  if(c.folders || c.resources){
    var was = [];
    if(c.folders) was.push(c.folders+' Unterordner');
    if(c.resources) was.push(c.resources+' Übung'+(c.resources===1?'':'en'));
    uiInfo('Ordner ist nicht leer',
      '«'+f.name+'» enthält noch '+was.join(' und ')+'. Verschiebe den Inhalt zuerst woandershin (Knopf «Verschieben»), dann lässt sich der Ordner löschen.');
    return;
  }
  uiConfirm('Ordner löschen?', '«'+f.name+'» ist leer und wird entfernt.', 'Löschen', function(){
    deleteDoc(doc(db,'folders', f.id))
      .then(function(){ toast('Ordner gelöscht.'); })
      .catch(function(err){ console.error(err); toast('Löschen fehlgeschlagen.'); });
  }, true);
}

/* ===================== ÜBUNGEN: SORTIEREN, VERSCHIEBEN, MARKIEREN ===================== */

// Übungen mit ausdrücklicher `order` (gesetzt, sobald die Pfeile benutzt wurden)
// kommen zuerst; alles nie manuell Sortierte fällt auf "neuste zuoberst" zurück.
function sortResources(resources){
  resources.sort(function(a, b){
    var oa = typeof a.order === 'number' ? a.order : null;
    var ob = typeof b.order === 'number' ? b.order : null;
    if(oa !== null && ob !== null) return oa - ob;
    if(oa !== null) return -1;
    if(ob !== null) return 1;
    var ta = a.uploadedAt && a.uploadedAt.toDate ? a.uploadedAt.toDate().getTime() : 0;
    var tb = b.uploadedAt && b.uploadedAt.toDate ? b.uploadedAt.toDate().getTime() : 0;
    return tb - ta;
  });
}

// Verschiebt die Übung an `index` innerhalb des GERADE ANGEZEIGTEN Containers
// (Fach-Hauptebene oder ein Ordner) und schreibt danach für jede Übung dieses
// Containers eine frische 0..n-1-Nummer.
function moveResource(resources, index, direction){
  var newIndex = index + direction;
  if(newIndex < 0 || newIndex >= resources.length) return;
  var reordered = resources.slice();
  var tmp = reordered[index]; reordered[index] = reordered[newIndex]; reordered[newIndex] = tmp;
  var batch = writeBatch(db);
  reordered.forEach(function(r, i){ batch.update(doc(db,'resources', r.id), {order: i}); });
  batch.commit().catch(function(err){ console.error(err); toast('Verschieben fehlgeschlagen.'); });
}

// Übung in einen anderen Ordner desselben Fachs legen. Sie landet am Ende des
// Zielcontainers; im Herkunftscontainer werden die Nummern wieder lückenlos
// durchgezählt, damit die Pfeile dort weiter sauber funktionieren.
function askMoveResource(r){
  var title = r.title || r.fileName;
  uiPickFolder('«'+title+'» verschieben', 'In welchen Ordner soll diese Übung?', r.folderId || null, [], function(targetId){
    var targetList = resourcesIn(targetId);
    var sourceList = resourcesIn(r.folderId || null).filter(function(x){ return x.id !== r.id; });
    var batch = writeBatch(db);
    batch.update(doc(db,'resources', r.id), {folderId: targetId || null, order: targetList.length, prevOrder: null});
    sourceList.forEach(function(x, i){ batch.update(doc(db,'resources', x.id), {order: i}); });
    batch.commit()
      .then(function(){ toast('«'+title+'» verschoben.'); })
      .catch(function(err){ console.error(err); toast('Verschieben fehlgeschlagen.'); });
  });
}

// Markiert genau EINE Übung pro Fach als "aktuell" (rot hervorgehoben, auch für
// die Klasse sichtbar). Beim Markieren rutscht sie zusätzlich an den Anfang
// ihres eigenen Ordners; beim Entfernen der Markierung wieder genau dorthin
// zurück, wo sie vorher stand (prevOrder). Ordner, in denen das aktuelle Thema
// liegt, werden im Kärtchen ebenfalls rot markiert, damit man es findet.
function toggleCurrent(resources, r){
  var makeCurrent = !r.current;
  var batch = writeBatch(db);

  if(makeCurrent){
    var prevIndex = resources.findIndex(function(x){ return x.id === r.id; });
    var reordered = [r].concat(resources.filter(function(x){ return x.id !== r.id; }));
    reordered.forEach(function(item, i){
      var patch = { order: i };
      if(item.id === r.id){ patch.current = true; patch.prevOrder = prevIndex; }
      batch.update(doc(db,'resources', item.id), patch);
    });
    // jede andere im Fach als "aktuell" markierte Übung entmarkieren — auch in
    // anderen Ordnern, deshalb über state.resources statt nur die Liste hier
    state.resources.forEach(function(x){
      if(x.id !== r.id && x.current){ batch.update(doc(db,'resources', x.id), {current: false}); }
    });
  } else {
    var others = resources.filter(function(x){ return x.id !== r.id; });
    var restoreAt = typeof r.prevOrder === 'number' ? Math.max(0, Math.min(r.prevOrder, others.length)) : others.length;
    var back = others.slice(0, restoreAt).concat([r]).concat(others.slice(restoreAt));
    back.forEach(function(item, i){
      var patch = { order: i };
      if(item.id === r.id){ patch.current = false; patch.prevOrder = null; }
      batch.update(doc(db,'resources', item.id), patch);
    });
  }

  batch.commit().catch(function(err){ console.error(err); toast('Aktualisieren fehlgeschlagen.'); });
}

function resourceCardHtml(r, index, total, isTeacher){
  var uploaded = r.uploadedAt && r.uploadedAt.toDate ? r.uploadedAt.toDate().toLocaleDateString('de-CH') : '';
  var html = '<div class="resource-card'+(r.current?' current':'')+'" id="card-'+r.id+'">';
  if(isTeacher){
    html += '<div class="move-btns">';
    html += '<button class="move-btn" id="up-'+r.id+'" type="button" title="Nach oben"'+(index===0?' disabled':'')+'><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M6 15l6-6 6 6"/></svg></button>';
    html += '<button class="move-btn" id="down-'+r.id+'" type="button" title="Nach unten"'+(index===total-1?' disabled':'')+'><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9l6 6 6-6"/></svg></button>';
    html += '</div>';
  }
  html += '<div class="resource-info"><h4>'+esc(r.title || r.fileName)+(r.current?' <span class="chip-current">Aktuell</span>':'')+'</h4>';
  html += '<div class="resource-bar"><span id="pbar-'+r.id+'" style="width:0%;background:var(--brand)"></span></div>';
  html += '<div class="resource-meta" id="pmeta-'+r.id+'">Noch nicht geübt'+(uploaded?' · hinzugefügt am '+uploaded:'')+'</div>';
  html += '</div>';
  html += '<div class="resource-actions">';
  html += '<button class="btn btn-primary btn-sm" id="open-'+r.id+'">Öffnen</button>';
  if(isTeacher){
    html += '<button class="btn btn-sm btn-current'+(r.current?' active':'')+'" id="cur-'+r.id+'">'+(r.current?'Nicht mehr aktuell':'Als aktuell markieren')+'</button>';
    html += '<button class="btn btn-ghost btn-sm" id="mv-'+r.id+'" type="button">Verschieben</button>';
    html += '<button class="btn btn-danger btn-sm" id="del-'+r.id+'">Löschen</button>';
  }
  html += '</div></div>';
  return html;
}

function updateResourceBar(resourceId, p){
  var bar = document.getElementById('pbar-'+resourceId);
  var meta = document.getElementById('pmeta-'+resourceId);
  if(!bar || !meta) return;
  if(!p || p.attempted===0){ bar.style.width='0%'; meta.textContent = meta.textContent.indexOf('hinzugefügt')>=0 ? meta.textContent : 'Noch nicht geübt'; return; }
  var pct = p.coveragePct!==null ? p.coveragePct : p.correctPct;
  bar.style.width = pct+'%';
  var parts = [];
  if(p.total){ parts.push(p.attempted+' / '+p.total+' geübt'); } else { parts.push(p.attempted+' bearbeitet'); }
  if(p.correctPct!==null){ parts.push(p.correctPct+'% richtig'); }
  meta.textContent = parts.join(' · ');
}

function askDeleteResource(r){
  uiConfirm('Übung löschen?',
    '«'+(r.title||r.fileName)+'» wird endgültig entfernt. Das kann nicht rückgängig gemacht werden.',
    'Löschen', function(){ deleteResource(r); }, true);
}

async function deleteResource(r){
  try{
    var contentSnap = await getDoc(doc(db,'resourceContent', r.id));
    var chunkCount = (contentSnap.exists() && contentSnap.data().chunkCount) || 0;
    var batch = writeBatch(db);
    batch.delete(doc(db,'resources', r.id));
    batch.delete(doc(db,'resourceContent', r.id));
    for(var i=0;i<chunkCount;i++){
      batch.delete(doc(db,'resourceContent', r.id, 'chunks', String(i)));
    }
    await batch.commit();
    toast('Übung gelöscht.');
  }catch(err){
    console.error(err);
    toast('Löschen fehlgeschlagen.');
  }
}

/* ===================== TEACHER UPLOAD ===================== */

// Die Dropzone lädt immer in den GERADE OFFENEN Ordner (state.route.folderId).
// Sie wird nur einmal pro Fachseite verdrahtet und liest das Ziel erst beim
// Ablegen aus — so stimmt es auch nach einem Wechsel in einen Unterordner.
function wireDropzone(subjectId){
  var dz = document.getElementById('dropzone');
  var input = document.getElementById('fileInput');
  ['dragenter','dragover'].forEach(function(evt){
    dz.addEventListener(evt, function(e){ e.preventDefault(); dz.classList.add('drag'); });
  });
  ['dragleave','drop'].forEach(function(evt){
    dz.addEventListener(evt, function(e){ e.preventDefault(); dz.classList.remove('drag'); });
  });
  dz.addEventListener('drop', function(e){
    var files = e.dataTransfer.files;
    if(files && files.length){ handleUpload(subjectId, state.route.folderId || null, files[0]); }
  });
  input.addEventListener('change', function(){
    if(input.files && input.files.length){ handleUpload(subjectId, state.route.folderId || null, input.files[0]); input.value=''; }
  });
}

function readFileAsText(file){
  return new Promise(function(resolve, reject){
    var reader = new FileReader();
    reader.onload = function(){ resolve(reader.result); };
    reader.onerror = function(){ reject(reader.error); };
    reader.readAsText(file, 'utf-8');
  });
}

function handleUpload(subjectId, folderId, file){
  if(!/\.html?$/i.test(file.name) && file.type !== 'text/html'){
    toast('Bitte eine HTML-Datei hochladen (.html).');
    return;
  }
  if(file.size > MAX_RESOURCE_BYTES){
    toast('Datei ist zu gross (max. '+Math.round(MAX_RESOURCE_BYTES/1024/1024)+' MB).');
    return;
  }
  var suggested = file.name.replace(/\.html?$/i,'').replace(/[_-]+/g,' ');
  var where_ = folderId ? ('Ordner «'+(folderById(folderId) ? folderById(folderId).name : '')+'»') : 'Fach-Hauptebene';
  uiPrompt('Titel für diese Übung', 'Die Datei wird in der '+where_+' abgelegt.', suggested, 'Hochladen', function(title){
    doUpload(subjectId, folderId, file, title);
  });
}

async function doUpload(subjectId, folderId, file, title){
  var progEl = document.getElementById('uploadProgress');
  if(!progEl) return;
  progEl.textContent = 'Lade «'+file.name+'» hoch …';
  progEl.classList.add('show');
  try{
    var htmlText = await readFileAsText(file);
    if(new Blob([htmlText]).size > MAX_RESOURCE_BYTES){
      toast('Datei ist zu gross (max. '+Math.round(MAX_RESOURCE_BYTES/1024/1024)+' MB).');
      return;
    }
    var chunks = chunkStringByBytes(htmlText, MAX_CHUNK_BYTES);
    var resId = subjectId+'_'+Date.now();
    var batch = writeBatch(db);
    batch.set(doc(db,'resources', resId), {
      subject: subjectId,
      folderId: folderId || null,
      title: title,
      fileName: file.name,
      uploadedAt: serverTimestamp(),
      uploadedBy: state.user.uid
    });
    batch.set(doc(db,'resourceContent', resId), { chunkCount: chunks.length });
    chunks.forEach(function(chunk, i){
      batch.set(doc(db,'resourceContent', resId, 'chunks', String(i)), { html: chunk });
    });
    await batch.commit();
    toast('«'+title+'» wurde veröffentlicht.');
  }catch(err){
    console.error(err);
    toast('Hochladen fehlgeschlagen: '+(err && err.message ? err.message : 'unbekannter Fehler'));
  }finally{
    progEl.classList.remove('show');
  }
}

/* ===================== RENDER: RESOURCE VIEWER ===================== */

var currentViewerResourceId = null;
var progressWriteTimers = {};

function renderResource(r){
  clearOverviewWatchers();
  clearSubjectWatchers();
  unwatchAllProgress();
  currentViewerResourceId = r.id;
  var s = subjectById(r.subject);

  var html = '<div class="viewer-wrap">';
  html += '<div class="back-row"><button class="btn btn-ghost btn-sm" id="backBtn">&larr; '+esc(s ? s.name : 'Fach')+'</button></div>';
  html += '<div class="viewer-head"><h2>'+esc(r.title || r.fileName)+'</h2><span class="viewer-progress" id="viewerProgress"></span>';
  html += '<button class="btn btn-ghost btn-sm btn-fs" id="fsBtn" type="button"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M8 3H5a2 2 0 0 0-2 2v3M16 3h3a2 2 0 0 1 2 2v3M8 21H5a2 2 0 0 1-2-2v-3M16 21h3a2 2 0 0 0 2-2v-3"/></svg> Vollbild</button>';
  html += '</div>';
  html += '<div class="viewer-frame-wrap" id="frameWrap">';
  html += '<button class="btn-fs-overlay-exit" id="fsExitBtn" type="button" title="Vollbild verlassen" aria-label="Vollbild verlassen"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 3v3a2 2 0 0 1-2 2H4M15 3v3a2 2 0 0 0 2 2h3M9 21v-3a2 2 0 0 0-2-2H4M15 21v-3a2 2 0 0 1 2-2h3"/></svg></button>';
  html += '<iframe id="resourceFrame" title="'+esc(r.title||r.fileName)+'"></iframe>';
  html += '</div>';
  html += '</div>';

  renderChrome(html);
  document.getElementById('backBtn').addEventListener('click', function(){ goSubject(r.subject, r.folderId || null); });
  wireFullscreen();

  watchProgress(r.id, function(p){ updateViewerProgress(p); });

  getDoc(doc(db,'resourceContent', r.id)).then(function(snap){
    if(!snap.exists()){ throw new Error('no content'); }
    var chunkCount = snap.data().chunkCount || 0;
    var chunkIndexes = [];
    for(var i=0;i<chunkCount;i++){ chunkIndexes.push(i); }
    return Promise.all(chunkIndexes.map(function(i){
      return getDoc(doc(db,'resourceContent', r.id, 'chunks', String(i)));
    }));
  }).then(function(chunkSnaps){
    var html = chunkSnaps.map(function(s){ return (s.exists() && s.data().html) || ''; }).join('');
    document.getElementById('resourceFrame').srcdoc = html;
  }).catch(function(err){
    console.error(err);
    var wrap = document.querySelector('.viewer-frame-wrap');
    if(wrap) wrap.innerHTML = '<div class="empty-state">Diese Übung konnte nicht geladen werden.</div>';
  });
}

var FS_ICON_ENTER = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M8 3H5a2 2 0 0 0-2 2v3M16 3h3a2 2 0 0 1 2 2v3M8 21H5a2 2 0 0 1-2-2v-3M16 21h3a2 2 0 0 0 2-2v-3"/></svg> Vollbild';
var FS_ICON_EXIT = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 3v3a2 2 0 0 1-2 2H4M15 3v3a2 2 0 0 0 2 2h3M9 21v-3a2 2 0 0 0-2-2H4M15 21v-3a2 2 0 0 1 2-2h3"/></svg> Vollbild verlassen';
var fullscreenListenerAttached = false;

// Fullscreens the viewer's frame wrapper (not the iframe itself) so it works
// consistently across browsers. Looks elements up by id on every call/event
// rather than closing over them, so this is safe to call again on every
// resource-viewer render without leaking stale references or duplicate
// document-level listeners.
function isPseudoFsActive(){
  var wrap = document.getElementById('frameWrap');
  return !!(wrap && wrap.classList.contains('pseudo-fullscreen'));
}

function enterPseudoFullscreen(){
  var wrap = document.getElementById('frameWrap');
  if(!wrap) return;
  wrap.classList.add('pseudo-fullscreen');
  document.body.classList.add('pseudo-fs-active');
  updateFsButtonLabel();
}

function exitPseudoFullscreen(){
  var wrap = document.getElementById('frameWrap');
  if(!wrap) return;
  wrap.classList.remove('pseudo-fullscreen');
  document.body.classList.remove('pseudo-fs-active');
  updateFsButtonLabel();
}

function updateFsButtonLabel(){
  var wrap = document.getElementById('frameWrap');
  var btn = document.getElementById('fsBtn');
  if(!wrap || !btn) return;
  var isFs = (document.fullscreenElement || document.webkitFullscreenElement) === wrap || isPseudoFsActive();
  btn.innerHTML = isFs ? FS_ICON_EXIT : FS_ICON_ENTER;
}

function exitFullscreenNow(){
  if(isPseudoFsActive()){ exitPseudoFullscreen(); return; }
  if(document.fullscreenElement || document.webkitFullscreenElement){
    var action = (document.exitFullscreen || document.webkitExitFullscreen).call(document);
    if(action && action.catch){ action.catch(function(){}); }
  }
}

function wireFullscreen(){
  var wrap = document.getElementById('frameWrap');
  var btn = document.getElementById('fsBtn');
  var exitBtn = document.getElementById('fsExitBtn');
  if(!wrap || !btn) return;
  // Safari on iOS (incl. installed Home-Screen apps) has no Fullscreen API for
  // arbitrary elements at all — requestFullscreen/webkitRequestFullscreen are
  // simply undefined there. Rather than hiding the buttons (old behaviour),
  // fall back to the CSS-only pseudo-fullscreen so the app version gets the
  // same enter/exit button pair as desktop.
  var nativeSupported = !!(wrap.requestFullscreen || wrap.webkitRequestFullscreen);
  btn.addEventListener('click', function(){
    var w = document.getElementById('frameWrap');
    if(!w) return;
    if(!nativeSupported){
      if(isPseudoFsActive()){ exitPseudoFullscreen(); } else { enterPseudoFullscreen(); }
      return;
    }
    var isFs = (document.fullscreenElement || document.webkitFullscreenElement) === w;
    if(isFs){ exitFullscreenNow(); return; }
    var action = (w.requestFullscreen || w.webkitRequestFullscreen).call(w);
    if(action && action.catch){
      action.catch(function(){
        // Native request refused at runtime (rare) — fall back to the CSS
        // version instead of leaving the user with a dead button.
        enterPseudoFullscreen();
      });
    }
  });
  // #fsBtn sits in .viewer-head, OUTSIDE #frameWrap — once #frameWrap is the
  // fullscreen element (native or pseudo), #fsBtn is no longer on screen at all
  // (only the fullscreen element and its descendants render), so it can't be
  // clicked to get back out. #fsExitBtn lives inside #frameWrap instead (see
  // CSS: shown while :fullscreen or .pseudo-fullscreen) so there's always a
  // visible, clickable way out besides Esc (and Esc doesn't even apply to the
  // CSS fallback, since that isn't the real Fullscreen API).
  if(exitBtn){ exitBtn.addEventListener('click', exitFullscreenNow); }
  updateFsButtonLabel();
  if(!fullscreenListenerAttached){
    document.addEventListener('fullscreenchange', updateFsButtonLabel);
    document.addEventListener('webkitfullscreenchange', updateFsButtonLabel);
    document.addEventListener('keydown', function(e){
      if(e.key === 'Escape' && isPseudoFsActive()){ exitPseudoFullscreen(); }
    });
    fullscreenListenerAttached = true;
  }
}

function updateViewerProgress(p){
  var el = document.getElementById('viewerProgress');
  if(!el) return;
  if(!p || p.attempted===0){ el.textContent = 'Noch nicht geübt'; return; }
  var parts = [];
  if(p.total){ parts.push(p.attempted+' / '+p.total+' geübt'); } else { parts.push(p.attempted+' bearbeitet'); }
  if(p.correctPct!==null){ parts.push(p.correctPct+'% richtig'); }
  el.textContent = parts.join(' · ');
}

window.addEventListener('message', function(e){
  var data = e.data;
  if(!data || !data.__libProgress || !currentViewerResourceId || !state.user) return;
  var resourceId = currentViewerResourceId;
  clearTimeout(progressWriteTimers[resourceId]);
  progressWriteTimers[resourceId] = setTimeout(function(){
    setDoc(doc(db,'progress', state.user.uid, 'resources', resourceId), {
      stats: data.stats || {},
      total: typeof data.total === 'number' ? data.total : null,
      updatedAt: serverTimestamp()
    }, {merge:true}).catch(function(err){ console.error('progress write failed', err); });
  }, 500);
});

/* ===================== MAIN RENDER ===================== */

function render(){
  clearOverviewWatchers();
  if(state.route.name === 'loading'){
    app.innerHTML = '<div class="spinner-wrap">Lädt …</div>';
    return;
  }
  if(state.route.name === 'login'){ renderLogin(); return; }
  if(!state.profile){ app.innerHTML = '<div class="spinner-wrap">Lädt …</div>'; return; }
  if(state.route.name === 'home'){ renderHome(); return; }
  if(state.route.name === 'subject'){ renderSubject(state.route.subject, state.route.folderId || null); return; }
  if(state.route.name === 'resource'){ renderResource(state.route.resource); return; }
}
</script>
</body>
</html>
