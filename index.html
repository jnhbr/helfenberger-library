<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Helfenberger's Library</title>
<link rel="icon" href="assets/icon-192.png">
<link rel="apple-touch-icon" href="assets/icon-180.png">
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#3A3F73">
<!-- "Zum Home-Bildschirm hinzufügen" auf iOS ignoriert das Web-Manifest weitgehend und
     braucht diese eigenen Meta-Tags, um als eigenständige App (ohne Safari-Chrome) zu starten. -->
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Library">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Karla:ital,wght@0,400;0,500;0,600;0,700;1,400&display=swap">
<style>
  :root{
    --bg:#F4F5FA;
    --surface:#FFFFFF;
    --surface-2:#EEF0F8;
    --border:#DDE1EE;
    --text:#1C2033;
    --text-muted:#666C87;
    --brand:#3A3F73;
    --brand-ink:#22254A;
    --brand-contrast:#FFFFFF;
    --good:#2E9E5B; --good-soft:#DEF3E6;
    --bad:#E63950; --bad-soft:#FBDDE1;
    --radius:20px;
    --radius-sm:13px;
    --shadow:0 1px 2px rgba(20,20,40,.06), 0 14px 32px -16px rgba(20,20,40,.25);
    color-scheme: light;
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --bg:#14162200; --bg:#14161F; --surface:#1C1F2E; --surface-2:#242840; --border:#323752;
      --text:#EDEEF7; --text-muted:#A0A5C2;
      --brand:#8890E8; --brand-ink:#C4C9FA; --brand-contrast:#14161F;
      --good:#4FCB84; --good-soft:#173428;
      --bad:#F0748A; --bad-soft:#3A1B22;
      --shadow:0 1px 2px rgba(0,0,0,.5), 0 14px 32px -16px rgba(0,0,0,.6);
      color-scheme: dark;
    }
  }
  :root[data-theme="dark"]{
    --bg:#14161F; --surface:#1C1F2E; --surface-2:#242840; --border:#323752;
    --text:#EDEEF7; --text-muted:#A0A5C2;
    --brand:#8890E8; --brand-ink:#C4C9FA; --brand-contrast:#14161F;
    --good:#4FCB84; --good-soft:#173428;
    --bad:#F0748A; --bad-soft:#3A1B22;
    color-scheme: dark;
  }

  *{box-sizing:border-box;}
  html{margin:0;padding:0;background:var(--bg);}
  html,body{min-height:100%;overflow-x:hidden;}
  body{
    margin:0;padding:0;color:var(--text);
    font:15px/1.5 Karla,-apple-system,BlinkMacSystemFont,sans-serif;
    background-color:var(--bg);
    background-image:
      radial-gradient(ellipse at 12% 0%, color-mix(in srgb, var(--brand) 5%, transparent), transparent 45%),
      radial-gradient(ellipse at 100% 100%, color-mix(in srgb, #C98B1F 6%, transparent), transparent 50%),
      linear-gradient(color-mix(in srgb, var(--bg) 88%, transparent), color-mix(in srgb, var(--bg) 88%, transparent)),
      url('assets/background.jpg');
    background-size:auto,auto,cover,cover;
    background-position:center,center,center,center;
    background-repeat:no-repeat;
    background-attachment:fixed;
  }
  /* Mobile: "background-attachment:fixed" combined with a background-image on
     <body> is notoriously unreliable on phone browsers (especially iOS
     Safari) — the photo only paints inside the first viewport-height and then
     disappears while scrolling, since mobile browsers don't reliably repaint
     a fixed background against the dynamic viewport. Rather than fight that,
     the photo layer is simply dropped below this breakpoint (explicit user
     request: keep it on desktop, drop it on the phone/app version); the two
     subtle gradient accents stay so the background doesn't look flat. */
  @media (max-width:600px){
    body{
      background-image:
        radial-gradient(ellipse at 12% 0%, color-mix(in srgb, var(--brand) 5%, transparent), transparent 45%),
        radial-gradient(ellipse at 100% 100%, color-mix(in srgb, #C98B1F 6%, transparent), transparent 50%);
      background-size:auto,auto;
      background-position:center,center;
      background-attachment:scroll;
    }
  }
  .desk-prop{position:fixed;bottom:0;font-size:64px;line-height:1;opacity:.5;pointer-events:none;z-index:0;filter:saturate(.9);}
  .desk-prop-left{left:14px;}
  .desk-prop-right{right:14px;}
  @media (max-width:900px){ .desk-prop{display:none;} }
  #app{position:relative;z-index:1;}
  h1,h2,h3{font-family:'Baloo 2',Karla,sans-serif;margin:0 0 6px;}
  button{font:inherit;cursor:pointer;}
  input{font:inherit;}
  a{color:inherit;}

  #app{min-height:100vh;display:flex;flex-direction:column;}

  /* ---------- Login ---------- */
  .login-wrap{flex:1;display:flex;align-items:center;justify-content:center;padding:24px;}
  .login-card{width:100%;max-width:400px;background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);box-shadow:var(--shadow);padding:36px 32px;text-align:center;}
  .login-logo{width:100%;max-width:210px;margin:0 auto 14px;}
  .login-logo img{width:100%;height:auto;object-fit:contain;display:block;}
  .login-card h1{font-size:26px;color:var(--brand-ink);}
  .login-card p.sub{color:var(--text-muted);margin:0 0 22px;font-size:14px;}
  .login-card input{width:100%;padding:13px 14px;border:2px solid var(--border);border-radius:var(--radius-sm);background:var(--surface-2);color:var(--text);margin-bottom:12px;text-align:center;font-size:16px;}
  .login-card input:focus{outline:none;border-color:var(--brand);}
  .login-card .btn{width:100%;}
  .login-err{background:var(--bad-soft);color:var(--bad);border-radius:var(--radius-sm);padding:10px 12px;font-size:13px;margin-bottom:12px;display:none;}
  .login-err.show{display:block;}
  .login-hint{margin-top:18px;font-size:12px;color:var(--text-muted);}

  /* ---------- Buttons ---------- */
  .btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:12px 20px;border-radius:999px;border:none;font-weight:700;font-size:14px;transition:transform .12s ease, box-shadow .12s ease;}
  .btn:active{transform:scale(.97);}
  .btn-primary{background:var(--brand);color:var(--brand-contrast);box-shadow:0 8px 20px -8px color-mix(in srgb, var(--brand) 60%, transparent);}
  .btn-primary:hover{box-shadow:0 10px 24px -8px color-mix(in srgb, var(--brand) 70%, transparent);}
  .btn-ghost{background:var(--surface-2);color:var(--text);}
  .btn-ghost:hover{background:var(--border);}
  .btn-sm{padding:8px 14px;font-size:13px;}
  .btn-danger{background:var(--bad-soft);color:var(--bad);}

  /* ---------- Chrome / header ---------- */
  .topbar{display:flex;align-items:center;flex-wrap:wrap;row-gap:8px;gap:14px;padding:14px 22px;background:var(--surface);border-bottom:1px solid var(--border);position:sticky;top:0;z-index:20;}
  .topbar-logo{height:36px;width:auto;flex-shrink:0;cursor:pointer;display:flex;align-items:center;}
  .topbar-logo img{height:100%;width:auto;object-fit:contain;display:block;}
  .topbar-title{font-family:'Baloo 2';font-weight:800;font-size:17px;color:var(--brand-ink);cursor:pointer;}
  .topbar-spacer{flex:1;}
  /* margin-left:auto (not just the spacer) so this block still hugs the right edge
     even when it wraps onto its own row on a narrow screen — see the mobile
     breakpoint below, which is what keeps the topbar from overflowing sideways. */
  .topbar-user{display:flex;align-items:center;flex-wrap:wrap;gap:10px;margin-left:auto;font-size:14px;color:var(--text-muted);}
  .topbar-user b{color:var(--text);}
  .topbar-bell{position:relative;font-size:17px;line-height:1;padding:7px 10px;}
  .push-popover{position:fixed;top:60px;right:18px;z-index:60;background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);box-shadow:0 10px 30px rgba(0,0,0,.18);padding:14px 16px;width:270px;}
  .push-popover h4{margin:0 0 6px;font-size:14.5px;}
  .push-popover .push-hint{font-size:12.5px;color:var(--text-muted);margin:4px 0 10px;}
  @media (max-width:480px){
    .topbar{padding:12px 16px;gap:10px;}
    .topbar-user{font-size:12.5px;gap:7px;}
    .badge-teacher{padding:2px 8px;font-size:10px;}
    .topbar-user .btn-sm{padding:7px 12px;font-size:12px;}
  }
  .badge-teacher{background:var(--brand);color:var(--brand-contrast);border-radius:999px;padding:2px 10px;font-size:11px;font-weight:700;letter-spacing:.02em;}

  .content{flex:1;max-width:1100px;margin:0 auto;padding:28px 22px 60px;width:100%;}

  /* ---------- Home / subject grid ---------- */
  /* Wandtafel-Hero: Holzrahmen (aussen) + dunkle Tafel (innen) mit Kreide-Deko */
  .hero-frame{position:relative;background:linear-gradient(160deg,#C89865,#7A4F27);border-radius:20px;padding:9px;margin-bottom:32px;box-shadow:0 18px 40px -18px rgba(20,20,10,.4);}
  .hero{position:relative;overflow:hidden;
    background:radial-gradient(ellipse at 25% 10%, rgba(255,255,255,.07), transparent 55%), linear-gradient(135deg,#20402F 0%,#152A1E 100%);
    border-radius:13px;padding:34px 30px;color:#F4F1E6;}
  .hero h2{font-size:24px;color:#fff;position:relative;z-index:2;}
  .hero p{margin:0;opacity:.9;max-width:480px;color:#E5E2D4;position:relative;z-index:2;}
  .hero-chalk{position:absolute;color:rgba(255,255,255,.4);font-family:'Baloo 2',Karla,sans-serif;font-weight:700;pointer-events:none;user-select:none;z-index:1;}
  .hero-chalk-1{top:22px;right:132px;font-size:19px;transform:rotate(-4deg);}
  .hero-chalk-2{bottom:24px;right:76px;font-size:15px;transform:rotate(3deg);opacity:.85;}
  .hero-chalk-3{top:56px;right:48px;font-size:34px;opacity:.5;}
  .hero-chalk-4{bottom:18px;right:172px;font-size:28px;opacity:.4;}
  @media (max-width:700px){ .hero-chalk{display:none;} .hero p{max-width:100%;} }

  .subject-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:20px;}
  @media (max-width:840px){ .subject-grid{grid-template-columns:repeat(2,1fr);} }
  @media (max-width:560px){ .subject-grid{grid-template-columns:1fr;} }
  .subject-card{background:var(--surface);border:1px solid var(--border);border-radius:22px;padding:22px 20px;text-align:left;box-shadow:var(--shadow);transition:transform .15s ease, box-shadow .15s ease;display:flex;align-items:center;gap:18px;min-height:150px;}
  .subject-card-wide{grid-column:1/-1;}
  .subject-card:hover{transform:translateY(-3px);box-shadow:0 18px 34px -16px rgba(20,20,40,.32);}
  .subject-card-body{flex:1;min-width:0;display:flex;flex-direction:column;gap:9px;}
  .subject-visual{border-radius:18px;display:flex;align-items:center;justify-content:center;flex-shrink:0;overflow:hidden;}
  .subject-visual img{width:100%;height:100%;object-fit:contain;padding:11px;box-sizing:border-box;display:block;}
  .subject-card .subject-visual{width:84px;height:84px;}
  .subject-head .subject-visual{width:56px;height:56px;border-radius:16px;}
  .subject-card h3{font-size:18px;}
  .subject-meta{font-size:12.5px;color:var(--text-muted);}
  .subject-bar{height:7px;border-radius:99px;background:var(--surface-2);overflow:hidden;}
  .subject-bar span{display:block;height:100%;border-radius:99px;transition:width .4s ease;}

  /* ---------- Subject page ---------- */
  .back-row{display:flex;align-items:center;gap:10px;margin-bottom:18px;}
  .subject-head{display:flex;align-items:center;gap:14px;margin-bottom:22px;}
  .subject-head h2{font-size:24px;}

  .resource-list{display:flex;flex-direction:column;gap:12px;}
  .resource-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-sm);padding:16px 18px;box-shadow:var(--shadow);display:flex;align-items:center;gap:16px;flex-wrap:wrap;transition:border-color .15s ease, box-shadow .15s ease;}
  .resource-card.current{border-color:var(--bad);box-shadow:var(--shadow), inset 4px 0 0 var(--bad);}
  .resource-info{flex:1;min-width:200px;}
  .resource-info h4{margin:0 0 4px;font-size:15.5px;display:flex;align-items:center;gap:8px;flex-wrap:wrap;}
  .chip-current{background:var(--bad-soft);color:var(--bad);border-radius:999px;padding:2px 10px;font-size:11px;font-weight:700;letter-spacing:.02em;}
  .resource-bar{height:6px;border-radius:99px;background:var(--surface-2);overflow:hidden;width:100%;max-width:260px;margin-top:6px;}
  .resource-bar span{display:block;height:100%;border-radius:99px;}
  .resource-meta{font-size:12px;color:var(--text-muted);margin-top:4px;}
  .resource-actions{display:flex;align-items:center;gap:8px;flex-shrink:0;}
  .move-btns{display:flex;flex-direction:column;gap:2px;flex-shrink:0;}
  .move-btn{width:26px;height:22px;border-radius:7px;border:1px solid var(--border);background:var(--surface-2);color:var(--text-muted);display:flex;align-items:center;justify-content:center;cursor:pointer;padding:0;}
  .move-btn:hover:not(:disabled){background:var(--border);color:var(--text);}
  .move-btn:disabled{opacity:.35;cursor:default;}
  .move-btn svg{width:13px;height:13px;}
  .btn-current{background:var(--bad-soft);color:var(--bad);}
  .btn-current.active{background:var(--bad);color:#fff;}

  .empty-state{background:var(--surface);border:1px dashed var(--border);border-radius:var(--radius);padding:36px 20px;text-align:center;color:var(--text-muted);}

  /* Fehleranalyse Diktate (Lehrperson) */
  .da-toolbar{display:flex;justify-content:flex-end;margin-bottom:10px;}
  .da-table{width:100%;border-collapse:collapse;background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);overflow:hidden;font-size:13.5px;}
  .da-table th,.da-table td{text-align:left;padding:8px 12px;border-bottom:1px solid var(--border);white-space:nowrap;}
  .da-table th{background:var(--surface-2);font-weight:600;font-size:12.5px;color:var(--text-muted);}
  .da-table tr:last-child td{border-bottom:none;}
  /* Namensspalte bleibt beim horizontalen Scrollen sichtbar (v.a. Deutsch mit vielen Diktaten). */
  .da-table th:first-child,.da-table td:first-child{position:sticky;left:0;z-index:1;box-shadow:1px 0 0 var(--border);}
  .da-table td:first-child{background:var(--surface);}
  .da-table th:first-child{background:var(--surface-2);z-index:2;}
  .da-student-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:16px 18px;margin-bottom:14px;}
  .da-student-card h4{margin:0 0 10px;}
  .weak-bar-row{display:flex;align-items:center;gap:10px;margin:8px 0;}
  .weak-bar-label{width:220px;flex:none;font-size:13px;display:flex;align-items:center;gap:6px;}
  .weak-bar-track{flex:1;height:9px;background:var(--surface-2);border-radius:6px;overflow:hidden;}
  .weak-bar-fill{height:100%;border-radius:6px;}
  .weak-bar-count{width:24px;text-align:right;font-size:12.5px;color:var(--text-muted);}
  .table-scroll{overflow-x:auto;}
  .da-reset-badge{display:inline-block;background:var(--bad-soft);color:var(--bad);border-radius:999px;padding:1px 7px;font-size:11px;font-weight:700;margin-left:4px;cursor:help;white-space:nowrap;}


  /* ---------- Ordner (Unterordner pro Fach) ---------- */
  .crumbs{display:flex;align-items:center;gap:6px;flex-wrap:wrap;font-size:13.5px;color:var(--text-muted);margin-bottom:16px;}
  .crumbs button{background:none;border:0;padding:2px 4px;border-radius:6px;font:inherit;color:var(--brand-ink);cursor:pointer;}
  .crumbs button:hover{background:var(--surface-2);text-decoration:underline;}
  .crumbs .sep{opacity:.5;}
  .crumbs .here{color:var(--text);font-weight:700;}

  .folder-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-sm);padding:14px 18px;box-shadow:var(--shadow);display:flex;align-items:center;gap:16px;flex-wrap:wrap;}
  .folder-card.has-current{border-color:var(--bad);box-shadow:var(--shadow), inset 4px 0 0 var(--bad);}
  .folder-open{display:flex;align-items:center;gap:12px;flex:1;min-width:200px;background:none;border:0;padding:0;font:inherit;color:inherit;text-align:left;cursor:pointer;}
  .folder-glyph{width:40px;height:40px;border-radius:11px;display:flex;align-items:center;justify-content:center;flex-shrink:0;background:var(--surface-2);}
  .folder-glyph svg{width:22px;height:22px;}
  .folder-name{font-weight:700;font-size:15.5px;display:flex;align-items:center;gap:8px;flex-wrap:wrap;}
  .folder-count{font-size:12px;color:var(--text-muted);margin-top:2px;}
  .folder-actions{display:flex;align-items:center;gap:8px;flex-shrink:0;flex-wrap:wrap;}
  .section-label{font-size:12px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;color:var(--text-muted);margin:4px 2px -2px;}

  /* ---------- Eigener Dialog (nie window.confirm/prompt — siehe Vollbild-Hinweis) ---------- */
  .modal-overlay{position:fixed;inset:0;background:rgba(15,16,32,.55);display:none;align-items:center;justify-content:center;padding:20px;z-index:2000;}
  .modal-overlay.show{display:flex;}
  .modal{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);box-shadow:0 24px 60px rgba(0,0,0,.28);width:100%;max-width:440px;max-height:85vh;overflow:auto;padding:22px;}
  .modal h3{font-size:18px;margin:0 0 8px;}
  .modal p{font-size:14px;color:var(--text-muted);margin:0 0 16px;line-height:1.5;}
  .modal input[type=text],.modal input[type=password]{width:100%;padding:11px 13px;border:1px solid var(--border);border-radius:10px;font:inherit;background:var(--surface-2);color:var(--text);margin-bottom:16px;}
  .modal input[type=text]:focus,.modal input[type=password]:focus{outline:2px solid var(--brand);outline-offset:1px;}
  .modal select,.modal input[type=date],.modal textarea{width:100%;padding:11px 13px;border:1px solid var(--border);border-radius:10px;font:inherit;background:var(--surface-2);color:var(--text);margin-bottom:16px;resize:vertical;}
  .modal select:focus,.modal input[type=date]:focus,.modal textarea:focus{outline:2px solid var(--brand);outline-offset:1px;}
  .modal-label{display:block;font-size:12.5px;font-weight:600;color:var(--text-muted);margin:0 0 6px;}
  .modal-actions{display:flex;gap:10px;justify-content:flex-end;flex-wrap:wrap;}

  /* Kalender */
  .cal-list{display:flex;flex-direction:column;gap:10px;}
  .cal-entry{display:flex;gap:14px;background:var(--surface);border:1px solid var(--border);border-left:5px solid var(--cal-c,var(--brand));border-radius:var(--radius-sm);padding:12px 14px;align-items:flex-start;}
  .cal-entry-date{flex:none;width:64px;font-weight:700;font-size:14px;line-height:1.3;}
  .cal-entry-weekday{display:block;font-weight:500;font-size:11px;color:var(--text-muted);}
  .cal-entry-body{flex:1;min-width:0;}
  .cal-entry-type{font-weight:600;font-size:12.5px;color:var(--cal-c,var(--brand));}
  .cal-entry-title{margin-bottom:2px;}
  .cal-entry-text{font-size:14.5px;font-weight:600;}
  .cal-entry-desc{font-size:13px;color:var(--text-muted);margin-top:2px;white-space:pre-wrap;}
  .cal-open-res-btn{margin-top:6px;padding-left:0;}
  .cal-sub-btn{margin-top:6px;margin-left:8px;}
  .submission-list{max-height:320px;overflow-y:auto;display:flex;flex-direction:column;gap:6px;margin:10px 0;}
  .submission-row{display:flex;align-items:center;gap:8px;font-size:14.5px;padding:4px 2px;}
  .cal-entry-actions{flex:none;display:flex;flex-direction:column;gap:4px;}
  .cal-list-past{opacity:.6;}
  .card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:16px 18px;margin-bottom:16px;}
  .homework-card{border-left:5px solid #4361EE;}
  .push-card{border-left:5px solid #8B5CF6;}
  .push-hint{font-size:13px;color:var(--text-muted);margin:4px 0 10px;}
  .pick-list{display:flex;flex-direction:column;gap:6px;margin-bottom:16px;}
  .pick-item{display:flex;align-items:center;gap:8px;width:100%;text-align:left;padding:10px 12px;border:1px solid var(--border);border-radius:10px;background:var(--surface-2);font:inherit;color:var(--text);cursor:pointer;}
  .pick-item:hover:not(:disabled){border-color:var(--brand);background:var(--surface);}
  .pick-item:disabled{opacity:.45;cursor:default;}
  .pick-item .pick-here{margin-left:auto;font-size:11px;font-weight:700;color:var(--text-muted);text-transform:uppercase;letter-spacing:.05em;}

  /* ---------- Teacher upload zone ---------- */
  .dropzone{border:2.5px dashed var(--border);border-radius:var(--radius);padding:28px 20px;text-align:center;color:var(--text-muted);margin-bottom:22px;background:var(--surface);transition:border-color .15s ease, background .15s ease;}
  .dropzone.drag{border-color:var(--brand);background:var(--surface-2);color:var(--text);}
  .dropzone input[type=file]{display:none;}
  .dropzone .dz-title{font-weight:700;color:var(--text);margin-bottom:4px;}
  .upload-progress{margin-top:14px;font-size:13px;color:var(--brand-ink);display:none;}
  .upload-progress.show{display:block;}

  /* ---------- Resource viewer ---------- */
  .viewer-wrap{display:flex;flex-direction:column;gap:14px;}
  .viewer-head{display:flex;align-items:center;gap:12px;flex-wrap:wrap;}
  .viewer-head h2{font-size:19px;flex:1;}
  .viewer-progress{font-size:13px;color:var(--text-muted);}

// Splits a string into pieces that each stay under maxBytes when UTF-8 encoded,
// without ever cutting a multi-byte character (or a surrogate pair) in half —
// so plain string concatenation on read always reproduces the original text exactly.
// Uses a binary search per chunk boundary (not a linear character-by-character
// shrink) so it stays fast even on heavily multi-byte text (umlauts, emoji).
function chunkStringByBytes(str, maxBytes){
  var encoder = new TextEncoder();
  var chunks = [];
  var start = 0;
  var n = str.length;
  while(start < n){
    if(encoder.encode(str.slice(start)).length <= maxBytes){
      chunks.push(str.slice(start));
      break;
    }
    var lo = start + 1, hi = n;
    while(lo < hi){
      var mid = Math.ceil((lo + hi) / 2);
      var len = encoder.encode(str.slice(start, mid)).length;
      if(len <= maxBytes){ lo = mid; } else { hi = mid - 1; }
    }
    var end = lo;
    // never split a surrogate pair (emoji etc.)
    if(end < n){
      var code = str.charCodeAt(end - 1);
      if(code >= 0xD800 && code <= 0xDBFF){ end--; }
    }
    if(end <= start){ end = start + 1; } // pathological fallback, avoids an infinite loop
    chunks.push(str.slice(start, end));
    start = end;
  }
  return chunks.length ? chunks : [''];
}

   (siehe Firebase.md, "Betriebs-Fixes"). Stattdessen: ganze (kleine) Collection laden, Filtern/
   Sortieren client-seitig. */

var CALENDAR_TYPES = {
  hausaufgabe: {label:'Hausaufgabe', icon:'📘', color:'#4361EE'},
  abgabe:      {label:'Abgabe',      icon:'📤', color:'#E8752C'},

function pad2(n){ return n<10 ? '0'+n : ''+n; }
function localDateStr(d){ return d.getFullYear()+'-'+pad2(d.getMonth()+1)+'-'+pad2(d.getDate()); }
function todayStr(){ return localDateStr(new Date()); }
function addDaysStr(days){ var d = new Date(); d.setDate(d.getDate()+days); return localDateStr(d); }
function fmtDueDate(dateStr){
  // "YYYY-MM-DD" ohne Zeitzonen-Umwege in ein lesbares CH-Datum umwandeln.
  var parts = (dateStr||'').split('-');
  if(parts.length!==3) return dateStr||'';
  return parts[2]+'.'+parts[1]+'.'+parts[0];
}
function weekdayLabel(dateStr){
  var parts = (dateStr||'').split('-').map(Number);
  if(parts.length!==3) return '';
  var d = new Date(parts[0], parts[1]-1, parts[2]);
  return d.toLocaleDateString('de-CH', {weekday:'long'});
}

async function loadCalendarEntries(){
  var snap = await getDocs(collection(db,'calendarEntries'));
  var out = [];
  snap.forEach(function(d){ out.push(Object.assign({id:d.id}, d.data())); });

    if(a.dueDate !== b.dueDate) return (a.dueDate||'').localeCompare(b.dueDate||'');

  });
  return out;
}

// submitted.{uid}=true/false, per updateDoc mit Dot-Notation - das ändert
// gezielt nur das eine Feld des verschachtelten Objekts, ohne die Abgaben
// anderer Schüler:innen zu überschreiben.
function submittedCountLabel(entry, roster){
  if(!roster || !roster.length) return '';
  var done = roster.filter(function(s){ return entry.submitted && entry.submitted[s.uid]; }).length;
  return done+' / '+roster.length+' abgegeben';
}

function uiSubmissionChecklist(entry, roster, onChanged){
  var rows = roster.map(function(stu){
    var checked = entry.submitted && entry.submitted[stu.uid];
    return '<label class="submission-row"><input type="checkbox" class="sub-check" data-uid="'+esc(stu.uid)+'"'+(checked?' checked':'')+'> '+esc(stu.displayName||stu.username)+'</label>';
  }).join('');
  openModal(
    '<h3>Abgegeben: '+esc(entry.title)+'</h3>'+

  );
  Array.prototype.forEach.call(document.querySelectorAll('.sub-check'), function(cb){
    cb.addEventListener('change', async function(){
      var uid = cb.getAttribute('data-uid');
      var val = cb.checked;
      try{
        await updateDoc(doc(db,'calendarEntries', entry.id), 'submitted.'+uid, val);
        entry.submitted = entry.submitted || {};
        entry.submitted[uid] = val;
        onChanged();
      }catch(err){
        console.error(err);
        cb.checked = !val;
        toast('Konnte nicht gespeichert werden.');
      }
    });
  });

}

function urlBase64ToUint8Array(base64String){
  var padding = '='.repeat((4 - base64String.length % 4) % 4);
  var base64 = (base64String + padding).replace(/-/g, '+').replace(/_/g, '/');
  var rawData = atob(base64);
  var outputArray = new Uint8Array(rawData.length);
  for(var i=0;i<rawData.length;i++){ outputArray[i] = rawData.charCodeAt(i); }
  return outputArray;
}

async function sha1Hex(str){
  var buf = await crypto.subtle.digest('SHA-1', new TextEncoder().encode(str));
  return Array.prototype.map.call(new Uint8Array(buf), function(b){ return b.toString(16).padStart(2,'0'); }).join('');
}

function pushSupported(){
  return typeof navigator !== 'undefined' && 'serviceWorker' in navigator && 'PushManager' in window && window.isSecureContext;
}
function isIos(){
  return /iphone|ipad|ipod/i.test(navigator.userAgent);
}
function isStandalonePwa(){
  return (window.matchMedia && window.matchMedia('(display-mode: standalone)').matches) || navigator.standalone === true;
}

async function getPushSubscription(){
  if(!pushSupported()) return null;
  var reg = await navigator.serviceWorker.getRegistration('./');
  if(!reg) return null;
  return reg.pushManager.getSubscription();
}

async function enablePushReminders(){
  var reg = await navigator.serviceWorker.register('sw-push.js');
  await navigator.serviceWorker.ready;
  var permission = await Notification.requestPermission();
  if(permission !== 'granted'){ throw new Error('denied'); }
  var sub = await reg.pushManager.subscribe({
    userVisibleOnly: true,
    applicationServerKey: urlBase64ToUint8Array(VAPID_PUBLIC_KEY)
  });
  var subJson = sub.toJSON();
  var subId = await sha1Hex(subJson.endpoint);
  await setDoc(doc(db, 'pushSubscriptions', state.user.uid, 'devices', subId), {
    endpoint: subJson.endpoint,
    keys: subJson.keys,
    userAgent: navigator.userAgent,
    createdAt: serverTimestamp()
  });
}

async function disablePushReminders(){
  var sub = await getPushSubscription();
  if(!sub) return;
  var subJson = sub.toJSON();
  var subId = await sha1Hex(subJson.endpoint);
  await sub.unsubscribe();
  try{ await deleteDoc(doc(db, 'pushSubscriptions', state.user.uid, 'devices', subId)); }
  catch(err){ console.error(err); }
}

function renderPushPopover(){
  var host = document.getElementById('pushPopover');
  if(!host) return;
  if(!pushSupported()){
    host.innerHTML = '<h4>🔔 Erinnerungen</h4>'+
      '<div class="push-hint">Dieser Browser unterstützt keine Erinnerungen. Auf dem iPhone: Safari öffnen, dann über "Teilen" &rarr; "Zum Home-Bildschirm" hinzufügen und von dort erneut öffnen.</div>';
    return;
  }
  if(isIos() && !isStandalonePwa()){
    host.innerHTML = '<h4>🔔 Erinnerungen</h4>'+
      '<div class="push-hint">Auf dem iPhone funktionieren Erinnerungen nur, wenn diese Seite zuerst über "Teilen" &rarr; "Zum Home-Bildschirm" hinzugefügt und von dort geöffnet wird.</div>';
    return;
  }
  host.innerHTML = '<h4>🔔 Erinnerungen</h4>'+
    '<div class="push-hint">Erhalte am Vortag um 18 Uhr eine Erinnerung an fällige Hausaufgaben, Abgaben, Prüfungen und Erinnerungen.</div>'+
    '<div id="pushStatus" class="push-hint">Wird geprüft …</div>'+
    '<button class="btn btn-primary btn-sm" id="pushToggleBtn" type="button" disabled>…</button>';
  var statusEl = document.getElementById('pushStatus');
  var btn = document.getElementById('pushToggleBtn');
  getPushSubscription().then(function(sub){
    var active = !!sub;
    statusEl.textContent = active ? 'Erinnerungen sind aktiviert.' : 'Erinnerungen sind noch nicht aktiviert.';
    btn.textContent = active ? 'Erinnerungen deaktivieren' : 'Erinnerungen aktivieren';
    btn.disabled = false;
    btn.onclick = async function(ev){
      if(ev) ev.stopPropagation();
      btn.disabled = true;
      try{
        if(active){ await disablePushReminders(); toast('Erinnerungen deaktiviert.'); }
        else { await enablePushReminders(); toast('Erinnerungen aktiviert.'); }
        renderPushPopover();
      }catch(err){
        console.error(err);
        if(err && err.message === 'denied'){ toast('Bitte Benachrichtigungen im Browser erlauben.'); }
        else { toast('Erinnerungen konnten nicht aktiviert werden.'); }
        btn.disabled = false;
      }
    };
  }).catch(function(err){ console.error(err); statusEl.textContent = 'Status konnte nicht geprüft werden.'; });
}

/* ===================== DIKTAT-FEHLERANALYSE (Lehrperson) =====================
   Jede Diktat-Übungsseite (Skill diktat-training-uebungsseite) speichert pro
   Versuch eine Fehlerzahl je Rechtschreib-Kategorie (`weakness` in ihrem
   localStorage-Schlüssel "..._attempts") - dank des bestehenden Übungsstand-
   Sync (siehe weiter unten) landet das automatisch, ohne jede Änderung an den
   Diktatseiten, in progress/{uid}/resources/{resourceId}.storeJson.
   Diese Ansicht liest das für alle Schüler:innen und alle Diktate aus und
   fasst es zusammen - kein neues Firestore-Feld, keine neue Regel nötig
   (progress/{uid}/resources/{resourceId} erlaubt der Lehrperson laut
   firestore.rules bereits "allow read: if isOwner(uid) || isTeacher()").
   Kategorie-IDs/Icons/Farben exakt aus dem Skill übernommen - bei Erweiterung
   um neue Kategorien dort UND hier nachführen. */
var DIKTAT_RULE_META = {
  vf:          {name:'V für den F-Laut', icon:'✌️', color:'#2d4a7c'},
  doppel:      {name:'Doppelkonsonanten', icon:'🔠', color:'#8a6314'},
  grossklein:  {name:'Gross- oder Kleinschreibung', icon:'🅰️', color:'#6b3f8f'},
  zusgetrennt: {name:'Getrennt- oder Zusammenschreibung', icon:'🔗', color:'#31684a'},
  fremd:       {name:'Fremdwörter', icon:'🌍', color:'#a13a2c'},
  ieei:        {name:'„ie" oder „ei"', icon:'👂', color:'#1f7a6c'},
  eu_aeu:      {name:'„eu" oder „äu"', icon:'🔊', color:'#b8562e'},
  dehnung_h:   {name:'Dehnungs-h', icon:'🧩', color:'#0f7a99'},
  stummesh:    {name:'Stummes h', icon:'🎩', color:'#4d6b2f'},
  ck_k:        {name:'„ck" oder „k"', icon:'🦎', color:'#5c7a1e'},
  tz_z:        {name:'„tz" oder „z"', icon:'🚂', color:'#8c2f4a'},
  s_ss:        {name:'„s", „ss" (o. „ß")', icon:'🐍', color:'#4a3f8a'},
  auslaut:     {name:'Auslautverhärtung', icon:'🔉', color:'#8a5a1f'},
  ableiten:    {name:'Ableiten/Stammprinzip', icon:'🔄', color:'#7a4a5a'},
  merkwoerter: {name:'Merkwörter', icon:'🎯', color:'#b8355c'},
  endungen:    {name:'Endungen', icon:'📝', color:'#556270'},
  sonstige:    {name:'Sonstige Fehler', icon:'❓', color:'#6b5f4e'}
};

// Lädt für alle Diktat-Ressourcen des Fachs Deutsch und alle Schüler:innen
// den jeweils letzten Diktatversuch (aus progress/{uid}/resources/{rid}) und
// fasst die Fehlerkategorien pro Schüler:in zusammen. Einmaliger Ladevorgang
// (kein Live-Listener) - die Ansicht hat einen "Neu laden"-Knopf.
async function loadDiktatAuswertung(){
  var result = { resources: [], students: [], perStudent: {} };

  var resSnap = await getDocs(query(collection(db,'resources'), where('subject','==','deutsch')));
  var diktatResources = [];
  resSnap.forEach(function(d){
    var data = d.data();
    var title = data.title || data.fileName || '';
    if(/diktat/i.test(title)) diktatResources.push(Object.assign({id:d.id}, data));
  });
  diktatResources.sort(function(a,b){ return (a.title||'').localeCompare(b.title||'', 'de'); });
  result.resources = diktatResources;

  var students = await loadStudentRoster();
  result.students = students;

  // Jedes {Schüler:in x Diktat}-Paar einzeln lesen (Lehrperson-Leserecht laut
  // firestore.rules) - bei 14-16 Kindern x wenigen Diktaten unproblematisch
  // fürs kostenlose Firestore-Kontingent.
  var reads = [];
  students.forEach(function(stu){
    diktatResources.forEach(function(res){
      reads.push(
        getDoc(doc(db,'progress', stu.uid, 'resources', res.id)).then(function(snap){
          return {uid:stu.uid, resId:res.id, snap:snap};
        }).catch(function(){ return {uid:stu.uid, resId:res.id, snap:null}; })
      );
    });
  });
  var settled = await Promise.all(reads);

  students.forEach(function(stu){
    result.perStudent[stu.uid] = { byResource:{}, categoryTotals:{} };
  });

  settled.forEach(function(r){
    if(!r.snap || !r.snap.exists()) return;
    var data = r.snap.data();
    if(!data.storeJson) return;
    var store;
    try{ store = JSON.parse(data.storeJson); }catch(e){ return; }
    var attemptsKey = Object.keys(store).filter(function(k){ return /_attempts$/.test(k); })[0];
    if(!attemptsKey) return;
    var attempts;
    try{ attempts = JSON.parse(store[attemptsKey]); }catch(e){ return; }
    if(!Array.isArray(attempts) || !attempts.length) return;
    var last = attempts[attempts.length-1];
    var bucket = result.perStudent[r.uid];
    bucket.byResource[r.resId] = { pct: last.pct, date: last.date, attemptCount: attempts.length };
    Object.keys(last.weakness||{}).forEach(function(catId){
      var meta = DIKTAT_RULE_META[catId] ? catId : 'sonstige';
      bucket.categoryTotals[meta] = (bucket.categoryTotals[meta]||0) + last.weakness[catId];
    });
  });

  return result;
}

  clearSubjectWatchers(); clearOverviewWatchers(); unwatchAllProgress();

        });
      }
      h += '</div>';

    body.innerHTML = h;

    console.error(err);
    var body = document.getElementById('diktatAuswertungBody');

/* ===================== LERNSTAND-ÜBERSICHT (alle Fächer, Lehrperson) =====================
   Zeigt für jede Übung in jedem Fach, ob und wie viel jede/r Schüler:in
   gelernt hat - aktueller Stand plus die komplette Reset-Historie (siehe
   writeProgressWithHistory oben). Baut auf denselben Rohdaten wie die
   Diktat-Auswertung, aber fachübergreifend und mit sichtbarer Historie. */

function fmtLearnedSummary(s){
  if(!s) return '–';
  if(s.kind==='quiz') return s.attempted+' / '+s.total+(s.pct!==null ? ' ('+s.pct+'% richtig)' : '');
  return s.pct+'% richtig (Versuch '+s.attemptCount+')';
}
function fmtHistoryEntry(h){
  var d = new Date(h.archivedAt);
  var ds = isNaN(d) ? h.archivedAt : d.toLocaleDateString('de-CH', {day:'2-digit', month:'2-digit', year:'numeric'});
  return ds+': '+fmtLearnedSummary(h.summary);
}

// Fächer, die in der Lernstand-Übersicht nichts verloren haben: Berufswahl
// (keine "gelernt"-Metrik im klassischen Sinn) und Lehrerbereich (interne
// Tools, keine Schüler:innen-Übungen).
var LERNSTAND_EXCLUDED_SUBJECTS = ['berufswahl', 'lehrerbereich'];

async function loadLernstandUebersicht(){
  var resSnap = await getDocs(collection(db,'resources'));
  var resources = [];
  resSnap.forEach(function(d){
    var data = d.data();
    if(LERNSTAND_EXCLUDED_SUBJECTS.indexOf(data.subject) !== -1) return;
    resources.push(Object.assign({id:d.id}, data));
  });
  resources.sort(function(a,b){
    var sa = subjectById(a.subject), sb = subjectById(b.subject);
    var sn = (sa?sa.name:a.subject).localeCompare(sb?sb.name:b.subject, 'de');
    if(sn!==0) return sn;
    // Als "aktuelles Thema" markierte Übungen zuvorderst, sonst alphabetisch.
    var ac = a.current ? 0 : 1, bc = b.current ? 0 : 1;
    if(ac!==bc) return ac-bc;
    return (a.title||a.fileName||'').localeCompare(b.title||b.fileName||'', 'de');
  });

  var students = await loadStudentRoster();

  var reads = [];
  students.forEach(function(stu){
    resources.forEach(function(res){
      reads.push(
        getDoc(doc(db,'progress', stu.uid, 'resources', res.id)).then(function(snap){
          return {uid:stu.uid, resId:res.id, data: snap.exists() ? snap.data() : null};
        }).catch(function(){ return {uid:stu.uid, resId:res.id, data:null}; })
      );
    });
  });
  var settled = await Promise.all(reads);

  var bySubject = {};
  resources.forEach(function(res){
    if(!bySubject[res.subject]) bySubject[res.subject] = {resources:[], cell:{}};
    bySubject[res.subject].resources.push(res);
  });
  settled.forEach(function(r){
    var subj = resources.find(function(x){ return x.id===r.resId; }).subject;
    bySubject[subj].cell[r.uid+'|'+r.resId] = {
      current: learnedSummary(r.data),
      history: (r.data && Array.isArray(r.data.history)) ? r.data.history : []
    };
  });

  return {students:students, bySubject:bySubject};
}

function renderLernstandUebersicht(){
  clearSubjectWatchers(); clearOverviewWatchers(); unwatchAllProgress();
  var html = '<div class="back-row"><button class="btn btn-ghost btn-sm" id="backBtn">&larr; Start</button></div>';
  html += '<h2>📈 Lernstand-Übersicht</h2>';
  html += '<p class="muted" style="margin:-6px 0 14px;">Aktueller Stand pro Schüler:in und Übung, über alle Fächer. „↺" = wie oft zurückgesetzt, mit dem jeweiligen Stand unmittelbar davor. Nur für dich sichtbar.</p>';
  html += '<div id="lernstandBody"><div class="empty-state">Wird geladen …</div></div>';
  renderChrome(html);
  document.getElementById('backBtn').addEventListener('click', goHome);

  loadLernstandUebersicht().then(function(result){
    var body = document.getElementById('lernstandBody');
    if(!body) return;
    var subjectIds = Object.keys(result.bySubject).filter(function(id){ return result.bySubject[id].resources.length>0; });
    subjectIds.sort(function(a,b){
      var sa = subjectById(a), sb = subjectById(b);
      return (sa?sa.name:a).localeCompare(sb?sb.name:b, 'de');
    });
    if(!subjectIds.length){ body.innerHTML = '<div class="empty-state">Noch keine Übungen vorhanden.</div>'; return; }

    var h = '<div class="da-toolbar"><button class="btn btn-ghost btn-sm" id="lsReloadBtn" type="button">↻ Neu laden</button></div>';
    subjectIds.forEach(function(subjId){
      var sub = result.bySubject[subjId];
      var s = subjectById(subjId);
      h += '<h3 style="margin-top:22px;">'+(s?s.name:subjId)+'</h3>';
      h += '<div class="table-scroll"><table class="da-table"><thead><tr><th>Schüler:in</th>';
      sub.resources.forEach(function(res){ h += '<th>'+esc(res.title||res.fileName)+'</th>'; });
      h += '</tr></thead><tbody>';
      result.students.forEach(function(stu){
        h += '<tr><td>'+esc(stu.displayName)+'</td>';
        sub.resources.forEach(function(res){
          var cell = sub.cell[stu.uid+'|'+res.id];
          var current = cell ? cell.current : null;
          var histCount = cell ? cell.history.length : 0;
          h += '<td>'+esc(fmtLearnedSummary(current)) + (histCount ? ' <span class="da-reset-badge" title="'+esc(cell.history.map(fmtHistoryEntry).join(' · '))+'">↺'+histCount+'</span>' : '') + '</td>';
        });
        h += '</tr>';
      });
      h += '</tbody></table></div>';

      // Ausführliche Historie nur für Zellen mit mindestens einem Reset anzeigen.
      var histLines = [];
      result.students.forEach(function(stu){
        sub.resources.forEach(function(res){
          var cell = sub.cell[stu.uid+'|'+res.id];
          if(cell && cell.history.length){
            histLines.push({stu:stu, res:res, cell:cell});
          }
        });
      });
      if(histLines.length){
        h += '<div class="da-student-card"><h4 style="margin-top:0;">Reset-Verlauf</h4>';
        histLines.forEach(function(l){
          h += '<p class="small" style="margin:6px 0;"><strong>'+esc(l.stu.displayName)+'</strong> · '+esc(l.res.title||l.res.fileName)+':<br>'+
            l.cell.history.map(fmtHistoryEntry).map(esc).join('<br>')+'</p>';
        });
        h += '</div>';
      }
    });

    body.innerHTML = h;
    document.getElementById('lsReloadBtn').addEventListener('click', renderLernstandUebersicht);
  }).catch(function(err){
    console.error(err);
    var body = document.getElementById('lernstandBody');
    if(body) body.innerHTML = '<div class="empty-state">Übersicht konnte nicht geladen werden.</div>';
  });
}

function toast(msg){

function esc(s){ return (s||'').toString().replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }

function slugName(name){
  return name.trim().toLowerCase()
    .replace(/ä/g,'ae').replace(/ö/g,'oe').replace(/ü/g,'ue').replace(/ß/g,'ss')
    .replace(/[^a-z0-9-]/g,'');
}

async function doLogin(rawName, customPassword){
  var slug = slugName(rawName);
  if(!slug){ throw new Error('leer'); }
  var email = slug + '@' + EMAIL_DOMAIN;
  var password = customPassword ? customPassword : (slug + PASSWORD_SUFFIX);
  await setPersistence(auth, browserLocalPersistence);
  await signInWithEmailAndPassword(auth, email, password);
}

// true, wenn fuer diesen Namen ein eigenes Passwort verlangt wird (Lehrperson).
function needsOwnPassword(rawName){
  return PASSWORD_LOGIN_SLUGS.indexOf(slugName(rawName)) !== -1;
}

function doLogout(){
  stopResourceSync();   // offenen Übungsstand noch sichern, solange die Rechte da sind
  Object.values(state.progressUnsubs).forEach(function(fn){ try{fn();}catch(e){} });
  state.progressUnsubs = {};
  clearSubjectWatchers();
  signOut(auth);
}

onAuthStateChanged(auth, async function(user){
  state.user = user;
  if(!user){
    state.profile = null;
    state.route = {name:'login'};
    render();
    return;
  }
  try{
    var snap = await getDoc(doc(db, 'students', user.uid));
    if(!snap.exists()){
      toast('Kein Profil gefunden – bitte Lehrperson kontaktieren.');
      await signOut(auth);
      return;
    }
    state.profile = snap.data();
    state.route = {name:'home'};
    render();
  }catch(err){
    console.error(err);
    toast('Fehler beim Laden des Profils.');
  }
});

function renderLogin(){
  app.innerHTML =
    '<div class="login-wrap"><div class="login-card">'+
    '<div class="login-logo"><img src="assets/logo.png" alt="" onerror="this.style.display=\'none\'"></div>'+
    '<h1>Helfenberger\'s Library</h1>'+
    '<p class="sub">Gib deinen Namen ein, um loszulegen.</p>'+
    '<div class="login-err" id="loginErr"></div>'+
    '<form id="loginForm">'+
    '<input type="text" id="loginName" placeholder="Dein Name" autocomplete="username" autofocus>'+
    '<input type="password" id="loginPass" placeholder="Passwort" autocomplete="current-password" style="display:none">'+
    '<button type="submit" class="btn btn-primary">Anmelden</button>'+
    '</form>'+
    '<p class="login-hint">Frag deine Lehrperson, falls dein Login nicht funktioniert.</p>'+
    '</div></div>';

  var form = document.getElementById('loginForm');
  var errEl = document.getElementById('loginErr');
  var nameEl = document.getElementById('loginName');
  var passEl = document.getElementById('loginPass');

  function passVisible(){ return passEl.style.display !== 'none'; }
  function hidePass(){ passEl.style.display = 'none'; passEl.value = ''; }

  // Wird ein anderer Name eingetippt, verschwindet das Passwortfeld wieder.
  nameEl.addEventListener('input', function(){
    if(passVisible() && !needsOwnPassword(nameEl.value)){ hidePass(); }
  });

  form.addEventListener('submit', async function(e){
    e.preventDefault();
    errEl.classList.remove('show');
    var name = nameEl.value;

    // Lehrpersonen-Zugang: kein automatisches Passwort senden, sondern danach fragen.
    if(needsOwnPassword(name) && !passVisible()){
      passEl.style.display = '';
      passEl.focus();
      errEl.textContent = 'Für diesen Zugang ist ein Passwort nötig.';
      errEl.classList.add('show');
      return;
    }

    var btn = form.querySelector('button');
    btn.disabled = true;
    try{
      await doLogin(name, passVisible() ? passEl.value : null);
    }catch(err){
      var msg = 'Login fehlgeschlagen. Prüfe die Schreibweise deines Namens.';
      if(err && err.code === 'auth/too-many-requests'){ msg = 'Zu viele Versuche. Bitte warte kurz und versuch es erneut.'; }
      else if(passVisible()){ msg = 'Passwort stimmt nicht.'; }
      errEl.textContent = msg;
      errEl.classList.add('show');
    }finally{
      btn.disabled = false;
    }
  });
}

function progressFor(resourceId){ return state.progressCache[resourceId] || null; }

function watchProgress(resourceId, onChange){
  if(state.progressUnsubs[resourceId]) return;
  var ref_ = doc(db, 'progress', state.user.uid, 'resources', resourceId);
  state.progressUnsubs[resourceId] = onSnapshot(ref_, function(snap){
    var data = snap.exists() ? snap.data() : null;
    var stats = (data && data.stats) || {};
    var total = data && typeof data.total === 'number' ? data.total : null;
    var attempted = 0, correct = 0;
    Object.keys(stats).forEach(function(k){
      if(stats[k] && stats[k].status){ attempted++; if(stats[k].status==='correct') correct++; }
    });
    state.progressCache[resourceId] = {
      attempted:attempted, correct:correct, total:total,
      coveragePct: total ? Math.round(attempted/total*100) : null,
      // "% richtig" muss mit der Formel in den Übungsseiten selbst übereinstimmen
      // (naehrstoffe_training.html / industrialisierung_training.html:
      // richtig / ALLE Aufgaben insgesamt, sinkt nie mehr) — vorher stand hier
      // richtig/bereits-bearbeitet, was bei wenigen Versuchen fälschlich hoch
      // wirkte und nicht zur Anzeige in der Übung selbst passte.
      correctPct: total ? Math.round(correct/total*100) : (attempted ? Math.round(correct/attempted*100) : null)
    };
    if(onChange) onChange(state.progressCache[resourceId]);
  }, function(err){ console.error(err); });
}

/* ===================== ORDNER: Datenmodell & Helfer =====================

   Firestore-Collection `folders`:
     folders/{folderId} -> {subject, parentId, name, order, createdAt, createdBy}
       parentId === null  ->  Ordner liegt direkt im Fach
       parentId === '<id>' -> Ordner liegt in diesem Ordner (beliebig tief)

   Eine Übung (resources/{id}) liegt in genau einem Container:
     folderId fehlt/null   ->  direkt im Fach  (so liegen alle Altbestände)
     folderId === '<id>'   ->  in diesem Ordner

   Beide Queries filtern NUR nach `subject` (reine Gleichheitsbedingung, kein
   orderBy) — damit braucht es weiterhin KEINEN Firestore-Composite-Index.
   Sortiert und verschachtelt wird alles im Client; pro Fach sind es nur ein
   paar Dutzend Dokumente.
   ===================================================================== */

var MAX_FOLDER_DEPTH = 6;   // Sicherheitsnetz gegen versehentlich tiefe Bäume

function clearSubjectWatchers(){
  if(state.resourceUnsub){ try{ state.resourceUnsub(); }catch(e){} state.resourceUnsub = null; }
  if(state.folderUnsub){ try{ state.folderUnsub(); }catch(e){} state.folderUnsub = null; }
}

function folderById(id){
  if(!id) return null;
  for(var i=0;i<state.folders.length;i++){ if(state.folders[i].id === id) return state.folders[i]; }
  return null;
}

// Kette vom obersten Ordner bis zum angegebenen (für die Brotkrumen-Navigation).
// Der Zähler bricht ab, falls je ein Zyklus in den Daten landen sollte.
function folderChain(folderId){
  var chain = [], guard = 0, cur = folderById(folderId);
  while(cur && guard++ < 50){ chain.unshift(cur); cur = folderById(cur.parentId); }
  return chain;
}

function foldersIn(parentId){
  var list = state.folders.filter(function(f){ return (f.parentId || null) === (parentId || null); });
  sortByOrder(list, 'name');
  return list;
}

function resourcesIn(folderId){
  var list = state.resources.filter(function(r){ return (r.folderId || null) === (folderId || null); });
  sortResources(list);
  return list;
}

// Alle Nachfahren-Ordner-Ids (inkl. des Ordners selbst) — für die Zählung im
// Ordner-Kärtchen und um zu verhindern, dass ein Ordner in sich selbst wandert.
function subtreeIds(folderId){
  var ids = [folderId], queue = [folderId], guard = 0;
  while(queue.length && guard++ < 500){
    var cur = queue.shift();
    state.folders.forEach(function(f){
      if((f.parentId || null) === cur && ids.indexOf(f.id) < 0){ ids.push(f.id); queue.push(f.id); }
    });
  }
  return ids;
}

function subtreeCounts(folderId){
  var ids = subtreeIds(folderId);
  var res = state.resources.filter(function(r){ return ids.indexOf(r.folderId || null) >= 0; });
  return { folders: ids.length - 1, resources: res.length, hasCurrent: res.some(function(r){ return !!r.current; }) };
}

function folderDepth(folderId){ return folderChain(folderId).length; }

function sortByOrder(list, fallbackField){
  list.sort(function(a,b){
    var oa = typeof a.order === 'number' ? a.order : null;
    var ob = typeof b.order === 'number' ? b.order : null;
    if(oa !== null && ob !== null && oa !== ob) return oa - ob;
    if(oa !== null && ob === null) return -1;
    if(oa === null && ob !== null) return 1;
    return String(a[fallbackField]||'').localeCompare(String(b[fallbackField]||''), 'de');
  });
  return list;
}

}

// Eigenes Passwort setzen (nur fuer das gerade angemeldete Konto). Firebase
// verlangt fuer updatePassword eine "frische" Anmeldung, deshalb wird mit dem
// aktuellen Passwort zuerst re-authentifiziert. Danach ist der Zugang nicht mehr
// ueber die <name>2024-Konvention erratbar - Voraussetzung dafuer ist, dass der
// Name in PASSWORD_LOGIN_SLUGS steht (sonst wuerde der Login weiterhin das
// automatische Passwort senden).
function uiChangePassword(){
  openModal(
    '<h3>Passwort ändern</h3>'+
    '<p>Gilt nur für dieses Konto. Das neue Passwort braucht mindestens 6 Zeichen. Notiere es dir gut – es lässt sich nur über diesen Weg wieder ändern.</p>'+
    '<div class="login-err" id="pwErr"></div>'+
    '<input type="password" id="pwOld" placeholder="Aktuelles Passwort" autocomplete="current-password">'+
    '<input type="password" id="pwNew" placeholder="Neues Passwort" autocomplete="new-password">'+
    '<input type="password" id="pwNew2" placeholder="Neues Passwort wiederholen" autocomplete="new-password">'+
    '<div class="modal-actions">'+
      '<button class="btn btn-ghost btn-sm" id="modalCancel" type="button">Abbrechen</button>'+
      '<button class="btn btn-primary btn-sm" id="modalOk" type="button">Speichern</button>'+
    '</div>'
  );
  var errEl = document.getElementById('pwErr');
  var oldEl = document.getElementById('pwOld');
  var newEl = document.getElementById('pwNew');
  var new2El = document.getElementById('pwNew2');
  var okBtn = document.getElementById('modalOk');
  oldEl.focus();

  function showErr(m){ errEl.textContent = m; errEl.classList.add('show'); }

  async function submit(){
    errEl.classList.remove('show');
    var oldPw = oldEl.value;
    var a = newEl.value;
    var b = new2El.value;
    if(!oldPw){ showErr('Bitte das aktuelle Passwort eingeben.'); oldEl.focus(); return; }
    if(a.length < 6){ showErr('Das neue Passwort braucht mindestens 6 Zeichen.'); newEl.focus(); return; }
    if(a !== b){ showErr('Die beiden neuen Passwörter stimmen nicht überein.'); new2El.focus(); return; }
    var user = auth.currentUser;
    if(!user){ showErr('Nicht angemeldet.'); return; }
    okBtn.disabled = true;
    try{
      await reauthenticateWithCredential(user, EmailAuthProvider.credential(user.email, oldPw));
      await updatePassword(user, a);
      closeModal();
      toast('Passwort geändert.');
    }catch(err){
      console.error(err);
      var m = 'Konnte nicht geändert werden. Bitte nochmals versuchen.';
      if(err && (err.code === 'auth/wrong-password' || err.code === 'auth/invalid-credential')){ m = 'Das aktuelle Passwort stimmt nicht.'; }
      else if(err && err.code === 'auth/weak-password'){ m = 'Das neue Passwort ist zu schwach (mind. 6 Zeichen).'; }
      else if(err && err.code === 'auth/too-many-requests'){ m = 'Zu viele Versuche. Bitte kurz warten.'; }
      showErr(m);
    }finally{
      okBtn.disabled = false;
    }
  }

  okBtn.addEventListener('click', submit);
  document.getElementById('modalCancel').addEventListener('click', closeModal);
  [oldEl, newEl, new2El].forEach(function(el){
    el.addEventListener('keydown', function(e){ if(e.key === 'Enter'){ e.preventDefault(); submit(); } });
  });
}

// Zielauswahl für "Verschieben": zeigt die Fach-Hauptebene und darunter den
// eingerückten Ordnerbaum des GLEICHEN Fachs. `blockedIds` schliesst Ordner aus
// (ein Ordner darf nie in sich selbst oder einen seiner Unterordner wandern),
// `currentId` markiert den jetzigen Ort und ist nicht anklickbar.
function uiPickFolder(title, description, currentId, blockedIds, onPick){
  var rows = '';
  function row(id, label, depth, disabled, reason){
    rows += '<button class="pick-item" type="button" data-target="'+(id===null?'__root__':esc(id))+'"'+(disabled?' disabled':'')+
      ' style="padding-left:'+(12 + depth*18)+'px">'+
      '<svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/></svg>'+
      '<span>'+esc(label)+'</span>'+
      (reason ? '<span class="pick-here">'+esc(reason)+'</span>' : '')+
      '</button>';
  }
  row(null, 'Fach-Hauptebene', 0, (currentId||null) === null, (currentId||null) === null ? 'hier' : '');
  (function walk(parentId, depth){
    foldersIn(parentId).forEach(function(f){
      var blocked = blockedIds.indexOf(f.id) >= 0;
      var isHere = f.id === currentId;
      row(f.id, f.name, depth + 1, blocked || isHere, isHere ? 'hier' : '');
      if(depth + 1 < MAX_FOLDER_DEPTH) walk(f.id, depth + 1);
    });
  })(null, 0);

  openModal(
    '<h3>'+esc(title)+'</h3>'+
    (description ? '<p>'+esc(description)+'</p>' : '')+
    '<div class="pick-list">'+rows+'</div>'+
    '<div class="modal-actions"><button class="btn btn-ghost btn-sm" id="modalCancel" type="button">Abbrechen</button></div>'
  );
  document.getElementById('modalCancel').addEventListener('click', closeModal);
  Array.prototype.forEach.call(modalEl.querySelectorAll('.pick-item'), function(btn){
    btn.addEventListener('click', function(){
      var t = btn.getAttribute('data-target');
      closeModal();
      onPick(t === '__root__' ? null : t);
    });
  });
}

/* ===================== RENDER: FACH / ORDNER ===================== */

function renderSubject(subjectId, folderId){
  clearOverviewWatchers();
  clearSubjectWatchers();
  unwatchAllProgress();
  state.folders = [];
  state.resources = [];

  var s = subjectById(subjectId);
  var isTeacher = state.profile.role === 'teacher';

  var html = '';
  html += '<div class="back-row"><button class="btn btn-ghost btn-sm" id="backBtn">&larr; Alle Fächer</button></div>';
  html += '<div class="subject-head"><div class="subject-visual" style="background:'+s.soft+';">'+s.icon+'</div><h2>'+s.name+'</h2></div>';
  html += '<div class="crumbs" id="crumbs"></div>';

  if(isTeacher && subjectId==='deutsch'){
    html += '<div class="back-row"><button class="btn btn-ghost btn-sm" id="diktatAnalyseBtn" type="button">📊 Fehleranalyse Diktate</button></div>';
  }

  if(isTeacher){
    html += '<div class="dropzone" id="dropzone">';
    html += '<div class="dz-title">Neue Übungsseite hinzufügen</div>';
    html += '<div>HTML-Datei hierher ziehen oder <label for="fileInput" style="color:var(--brand);text-decoration:underline;cursor:pointer;">Datei auswählen</label></div>';
    html += '<div id="dzTarget" style="font-size:12.5px;margin-top:8px;"></div>';
    html += '<input type="file" id="fileInput" accept=".html,text/html">';
    html += '<div class="upload-progress" id="uploadProgress"></div>';
    html += '</div>';
    html += '<div class="back-row"><button class="btn btn-ghost btn-sm" id="newFolderBtn" type="button">+ Neuer Ordner</button></div>';
  }

  html += '<div id="resourceList" class="resource-list"><div class="empty-state">Wird geladen …</div></div>';

  renderChrome(html);
  document.getElementById('backBtn').addEventListener('click', goHome);
  var diktatAnalyseBtn = document.getElementById('diktatAnalyseBtn');
  if(diktatAnalyseBtn){
    diktatAnalyseBtn.addEventListener('click', function(){
      state.route = {name:'diktatauswertung'};
      render();
    });
  }
  if(isTeacher){
    wireDropzone(subjectId);
    document.getElementById('newFolderBtn').addEventListener('click', function(){
      var here = state.route.folderId || null;
      if(folderDepth(here) >= MAX_FOLDER_DEPTH){
        uiInfo('Zu tief verschachtelt', 'Mehr als '+MAX_FOLDER_DEPTH+' Ordner-Ebenen sind nicht vorgesehen — sonst wird das Zurechtfinden für die Klasse mühsam.');
        return;
      }
      uiPrompt('Neuer Ordner', 'Wie soll der Ordner heissen? (z.B. «Diktate»)', '', 'Anlegen', function(name){
        createFolder(subjectId, here, name);
      });
    });
  }

  var loaded = {res:false, fold:false};
  function maybeRender(){ if(loaded.res && loaded.fold) renderFolderContents(); }

  var qf = query(collection(db,'folders'), where('subject','==',subjectId));
  state.folderUnsub = onSnapshot(qf, function(snap){
    state.folders = [];
    snap.forEach(function(d){ state.folders.push(Object.assign({id:d.id}, d.data())); });
    loaded.fold = true;
    maybeRender();
  }, function(err){ console.error(err); loaded.fold = true; maybeRender(); });

  var qr = query(collection(db,'resources'), where('subject','==',subjectId));
  state.resourceUnsub = onSnapshot(qr, function(snap){
    state.resources = [];
    snap.forEach(function(d){ state.resources.push(Object.assign({id:d.id}, d.data())); });
    loaded.res = true;
    maybeRender();
  }, function(err){
    console.error(err);
    var listEl = document.getElementById('resourceList');
    if(listEl) listEl.innerHTML = '<div class="empty-state">Übungen konnten nicht geladen werden.</div>';
  });
}

// Zeichnet Brotkrumen + den Inhalt des gerade offenen Containers neu. Wird bei
// jeder Snapshot-Änderung und nach jeder Navigation in einen Unterordner
// aufgerufen — die Firestore-Listener bleiben dabei bestehen (sie hängen am
// ganzen Fach, nicht am einzelnen Ordner).
function renderFolderContents(){
  var listEl = document.getElementById('resourceList');
  if(!listEl) return;
  var subjectId = state.route.subject;
  var here = state.route.folderId || null;
  var isTeacher = state.profile.role === 'teacher';
  var s = subjectById(subjectId);

  // Ordner könnte inzwischen (z.B. auf einem anderen Gerät) gelöscht worden sein
  if(here && !folderById(here)){ state.route.folderId = null; here = null; }

  var chain = folderChain(here);
  var crumbHtml = '<button type="button" data-crumb="__root__">'+esc(s.name)+'</button>';
  chain.forEach(function(f, i){
    crumbHtml += '<span class="sep">/</span>';
    crumbHtml += (i === chain.length-1)
      ? '<span class="here">'+esc(f.name)+'</span>'
      : '<button type="button" data-crumb="'+esc(f.id)+'">'+esc(f.name)+'</button>';
  });
  var crumbEl = document.getElementById('crumbs');
  if(crumbEl){
    // Auf der Fach-Hauptebene wäre die Brotkrume nur eine Wiederholung der
    // Überschrift — erst ab dem ersten Ordner ist sie eine echte Navigation.
    crumbEl.style.display = chain.length ? 'flex' : 'none';
    crumbEl.innerHTML = crumbHtml;
    Array.prototype.forEach.call(crumbEl.querySelectorAll('button'), function(b){
      b.addEventListener('click', function(){
        var t = b.getAttribute('data-crumb');
        goSubject(subjectId, t === '__root__' ? null : t);
      });
    });
  }
  var dzTarget = document.getElementById('dzTarget');
  if(dzTarget){
    dzTarget.innerHTML = here
      ? 'Die Datei landet im Ordner <b>'+esc(folderById(here).name)+'</b>.'
      : 'Die Datei landet direkt im Fach <b>'+esc(s.name)+'</b>.';
  }

  var folders = foldersIn(here);
  var resources = resourcesIn(here);

  if(!folders.length && !resources.length){
    listEl.innerHTML = '<div class="empty-state">'+
      (here ? 'Dieser Ordner ist noch leer.' : 'Für dieses Fach gibt es noch keine Übung.')+
      (isTeacher ? ' Lade oben eine Datei hoch oder lege einen Ordner an.' : ' Schau später wieder vorbei!')+
      '</div>';
    return;
  }

  var html = '';
  if(folders.length){
    html += '<div class="section-label">Ordner</div>';
    html += folders.map(function(f, i){ return folderCardHtml(f, i, folders.length, isTeacher); }).join('');
  }
  if(resources.length){
    if(folders.length) html += '<div class="section-label">Übungen</div>';
    html += resources.map(function(r, i){ return resourceCardHtml(r, i, resources.length, isTeacher); }).join('');
  }
  listEl.innerHTML = html;

  folders.forEach(function(f, i){
    document.getElementById('fopen-'+f.id).addEventListener('click', function(){ goSubject(subjectId, f.id); });
    if(!isTeacher) return;
    document.getElementById('fup-'+f.id).addEventListener('click', function(){ reorderFolder(folders, i, -1); });
    document.getElementById('fdown-'+f.id).addEventListener('click', function(){ reorderFolder(folders, i, 1); });
    document.getElementById('frename-'+f.id).addEventListener('click', function(){
      uiPrompt('Ordner umbenennen', null, f.name, 'Speichern', function(name){ renameFolder(f, name); });
    });
    document.getElementById('fmove-'+f.id).addEventListener('click', function(){ askMoveFolder(f); });
    document.getElementById('fdel-'+f.id).addEventListener('click', function(){ askDeleteFolder(f); });
  });

  resources.forEach(function(r, i){
    watchProgress(r.id, function(p){ updateResourceBar(r.id, p); });
    var openBtn = document.getElementById('open-'+r.id);
    if(openBtn) openBtn.addEventListener('click', function(){ goResource(r); });
    if(!isTeacher) return;
    document.getElementById('del-'+r.id).addEventListener('click', function(){ askDeleteResource(r); });
    document.getElementById('up-'+r.id).addEventListener('click', function(){ moveResource(resources, i, -1); });
    document.getElementById('down-'+r.id).addEventListener('click', function(){ moveResource(resources, i, 1); });
    document.getElementById('cur-'+r.id).addEventListener('click', function(){ toggleCurrent(resources, r); });
    document.getElementById('mv-'+r.id).addEventListener('click', function(){ askMoveResource(r); });
  });
}

function folderCardHtml(f, index, total, isTeacher){
  var c = subtreeCounts(f.id);

  if(c.folders) parts.push(c.folders+' Ordner');
  parts.push(c.resources+' Übung'+(c.resources===1?'':'en'));

  var html = '<div class="folder-card'+(c.hasCurrent?' has-current':'')+'" id="fcard-'+f.id+'">';
  if(isTeacher){
    html += '<div class="move-btns">';
    html += '<button class="move-btn" id="fup-'+f.id+'" type="button" title="Nach oben"'+(index===0?' disabled':'')+'><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M6 15l6-6 6 6"/></svg></button>';
    html += '<button class="move-btn" id="fdown-'+f.id+'" type="button" title="Nach unten"'+(index===total-1?' disabled':'')+'><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9l6 6 6-6"/></svg></button>';
    html += '</div>';
  }
  html += '<button class="folder-open" id="fopen-'+f.id+'" type="button">';
  html += '<span class="folder-glyph"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/></svg></span>';
  html += '<span><span class="folder-name">'+esc(f.name)+(c.hasCurrent?' <span class="chip-current">Aktuelles Thema</span>':'')+'</span>';
  html += '<span class="folder-count">'+parts.join(' · ')+'</span></span>';
  html += '</button>';
  if(isTeacher){
    html += '<div class="folder-actions">';
    html += '<button class="btn btn-ghost btn-sm" id="frename-'+f.id+'" type="button">Umbenennen</button>';

    html += '</div>';
  }
  html += '</div>';
  return html;
