    var dieseWoche = naechster && naechster.woche === aemtliMonday(todayStr());
    btn.classList.toggle('topbar-besen-an', !!dieseWoche);
    btn.title = naechster
      ? ('Nächstes Ämtli: ' + naechster.aemtli.name + ' am ' + fmtDueDate(naechster.datum) + (naechster.zeit ? ', ' + naechster.zeit + ' Uhr' : ''))
      : 'Bis zu den Sommerferien kein Ämtli mehr';
    aemtliTagesHinweis(st.cfg);
  }).catch(function(err){ console.error('Ämtli-Besen', err); });
}

/* Am Ämtli-Tag selbst geht der Hinweis einmal von allein auf — bis zur Uhrzeit
   des Ämtlis. Danach nicht mehr, und pro Tag nur einmal, damit er beim
   Herumklicken nicht dauernd wieder aufspringt. */
function aemtliTagesHinweis(cfg){
  if(!state.profile || state.profile.role === 'teacher') return;
  var today = todayStr();
  var heute = aemtliMeineTermine_(cfg, state.user.uid).filter(function(t){ return t.datum === today; });
  if(!heute.length) return;
  if(lsGet(LIB_PREFIX + 'aemtli_hinweis') === today) return;
  lsSet(LIB_PREFIX + 'aemtli_hinweis', today);
  var zeile = heute.map(function(t){
    return '<div class="ae-pop-job">' + (t.aemtli.icon || '🧹') + ' <b>' + esc(t.aemtli.name) + '</b>'
         + (t.zeit ? ' <span>um ' + esc(t.zeit) + ' Uhr</span>' : '')
         + (t.partner.length ? '<br><span>zusammen mit ' + esc(t.partner.join(' + ')) + '</span>' : '')
         + '</div>';
  }).join('');
  openModal(
    '<div class="ae-pop"><div class="ae-pop-icon">🧹</div>'
    + '<h3>Heute bist du mit dem Ämtli dran</h3>' + zeile + '</div>'
    + '<div class="modal-actions"><button class="btn btn-primary btn-sm" id="modalOk" type="button">Alles klar</button></div>'
  );
  document.getElementById('modalOk').addEventListener('click', closeModal);
}

/* ---------- Hinweis auf der Startseite ----------
   Schüler:innen sehen den Hinweis nur an dem Tag, an dem sie selbst dran sind;
   die Lehrperson sieht an jedem Diensttag alle Ämtli auf einen Blick. */
function renderAemtliBanner(){
  var host = document.getElementById('aemtliBanner');
  if(!host) return;
  aemtliLoad().then(function(st){
    host = document.getElementById('aemtliBanner');
    if(!host) return;   // Seite inzwischen gewechselt
    var info = aemtliHeute(st.cfg);
    if(!info){ host.innerHTML = ''; return; }
    // Der Hinweis ist eine Erinnerung VOR dem Ämtli: nach der Uhrzeit des Tages
    // (Di 08:15, Fr 11:00) verschwindet er — bei der Klasse und bei der
    // Lehrperson gleichermassen. Der Unterschied ist nur, WAS drinsteht: die
    // Lehrperson sieht alle Ämtli, die Klasse nur das eigene.
    if(info.zeit && nowHHMM() >= info.zeit){ host.innerHTML = ''; return; }
    aemtliScheduleHide(info.zeit);
    var isTeacher = state.profile.role === 'teacher';
    var h = '';
    if(isTeacher){
      var jobs = info.jobs.map(function(j){
        return '<span class="ae-job">'+(j.a.icon||'🧹')+' '+esc(j.a.name)+': <b>'+esc(aemtliShortNames(j.team).join(' + ') || '—')+'</b></span>';
      }).join('');
      h += '<div class="ae-banner"><div class="ae-banner-icon">🧹</div><div class="ae-banner-body">';
      h += '<h3>Heute ist Ämtli-Tag'+(info.zeit ? ' – um '+esc(info.zeit)+' Uhr' : '')+'</h3><div>'+jobs+'</div>';
      h += '<div class="ae-banner-actions"><button class="btn btn-ghost btn-sm" id="amOpenPlan" type="button">Ganzer Plan</button></div>';
      h += '</div></div>';
    } else {
      var mine = info.jobs.filter(function(j){ return j.team.indexOf(state.user.uid) >= 0; });
      if(!mine.length){ host.innerHTML = ''; return; }
      var lines = mine.map(function(j){
        var others = aemtliShortNames(j.team.filter(function(u){ return u !== state.user.uid; }));
        return '<span class="ae-job">'+(j.a.icon||'🧹')+' <b>'+esc(j.a.name)+'</b>'+(others.length ? ' – zusammen mit '+esc(others.join(' + ')) : '')+'</span>';
      }).join('');
      h += '<div class="ae-banner"><div class="ae-banner-icon">🧹</div><div class="ae-banner-body">';
      h += '<h3>Heute bist du mit dem Ämtli dran'+(info.zeit ? ' – um '+esc(info.zeit)+' Uhr' : '')+'</h3><div>'+lines+'</div>';
      h += '<div class="ae-banner-actions"><button class="btn btn-ghost btn-sm" id="amOpenPlan" type="button">Meine nächsten Ämtli</button></div>';
      h += '</div></div>';
    }
    host.innerHTML = h;
    var btn = document.getElementById('amOpenPlan');
    if(btn){
      btn.addEventListener('click', function(){
        if(isTeacher){ state.route = {name:'aemtliplan'}; render(); }
        else aemtliMeineTermine();
      });
    }
  }).catch(function(err){ console.error('Ämtliplan', err); });
}

/* Wer die Seite über die Ämtli-Zeit hinweg offen liegen lässt, soll den
   Hinweis trotzdem verschwinden sehen — ohne dafür neu laden zu müssen.
   Ein einziger Timer, der beim Neuzeichnen jeweils ersetzt wird. */
var aemtliHideTimer = null;
function aemtliScheduleHide(zeit){
  clearTimeout(aemtliHideTimer);
  if(!zeit) return;
  var p = zeit.split(':').map(Number);
  var ziel = new Date(); ziel.setHours(p[0], p[1], 0, 0);
  var ms = ziel - Date.now();
  if(ms <= 0 || ms > 12*3600*1000) return;
  aemtliHideTimer = setTimeout(function(){
    var host = document.getElementById('aemtliBanner');
    if(host) host.innerHTML = '';
  }, ms + 500);
}

/* 5 Minuten vor jeder Ämtli-Zeit poppt bei der Lehrperson ein grosser,
   pulsierender Hinweis über allem auf (auch über Übungen im Vollbild). Ein
   Klick macht ihn weg (merkt sich der Browser pro Tag+Uhrzeit), zur Ämtli-Zeit
   verschwindet er ohnehin. Ein Timer für die ganze Sitzung, egal welche Seite. */
var AEMTLI_GROSS_MIN = 5;
var aemtliGrossTimer = null;
function aemtliGrossStart(){
  if(aemtliGrossTimer) return;
  aemtliGrossTimer = setInterval(aemtliGrossCheck, 15000);
  aemtliGrossCheck();
}
function aemtliGrossWeg(){
  var el = document.getElementById('aeGross');
  if(el) el.remove();
}
function aemtliGrossCheck(){
  if(!state.profile || state.profile.role !== 'teacher' || !aemtliState.loaded){ aemtliGrossWeg(); return; }
  var info = null;
  try{ info = aemtliHeute(aemtliState.cfg); }catch(e){ info = null; }
  if(!info || !info.zeit){ aemtliGrossWeg(); return; }
  var p = info.zeit.split(':').map(Number);
  var ziel = new Date(); ziel.setHours(p[0], p[1], 0, 0);
  var ms = ziel - Date.now();
  var key = info.datum + ' ' + info.zeit;
  if(ms <= 0 || ms > AEMTLI_GROSS_MIN*60000 || lsGet(LIB_PREFIX + 'aemtli_gross') === key){ aemtliGrossWeg(); return; }
  // Im nativen Vollbild wird nur das Vollbild-Element gezeichnet - also dort hinein.
  var host = document.fullscreenElement || document.webkitFullscreenElement || document.body;
  var el = document.getElementById('aeGross');
  if(el && el.parentNode === host) return;
  if(el) el.remove();
  var jobs = info.jobs.map(function(j){
    return '<span class="ae-job">'+(j.a.icon||'🧹')+' '+esc(j.a.name)+': <b>'+esc(aemtliShortNames(j.team).join(' + ') || '—')+'</b></span>';
  }).join('');
  // Stühle: pro Diensttag im Ämtliplan eingestellt (Schieber unter dem Tag).
  var stuhl = aemtliStuhl(aemtliState.cfg, aemtliParse(info.datum).getDay()) ? '🪑 AUFSTUHLEN' : '🚫 NICHT aufstuhlen';
  el = document.createElement('div');
  el.id = 'aeGross';
  el.className = 'ae-gross';
  el.innerHTML = '<div class="ae-gross-box"><div class="ae-gross-icon">🧹</div>'
    + '<h2>Ämtli um '+esc(info.zeit)+' Uhr!</h2>'
    + '<div class="ae-gross-jobs">'+jobs+'</div>'
    + (stuhl ? '<div class="ae-gross-stuhl">'+esc(stuhl)+'</div>' : '')
    + '<div class="ae-gross-hint">Antippen zum Schliessen</div></div>';
  el.addEventListener('click', function(){
    lsSet(LIB_PREFIX + 'aemtli_gross', key);
    aemtliGrossWeg();
  });
  host.appendChild(el);
}
document.addEventListener('fullscreenchange', function(){ if(aemtliGrossTimer) aemtliGrossCheck(); });
document.addEventListener('webkitfullscreenchange', function(){ if(aemtliGrossTimer) aemtliGrossCheck(); });

// Schüler-Sicht: die eigenen kommenden Ämtli-Tage.
function aemtliMeineTermine(){
  aemtliLoad().then(function(st){
    // Bewusst nur die naechsten zwei: alles weitere ist fuer die Klasse Ballast
    // und der Plan verschiebt sich ohnehin, sobald eine Woche gestrichen wird.
    var termine = aemtliMeineTermine_(st.cfg, state.user.uid).slice(0, 2);
    var rows = termine.map(function(t){
      return '<div class="vg-item"><b>' + esc(fmtDueDate(t.datum)) + '</b> '
           + '<span>' + esc(weekdayLabel(t.datum)) + (t.zeit ? ', ' + esc(t.zeit) + ' Uhr' : '') + '</span> '
           + '<span>' + (t.aemtli.icon || '🧹') + ' ' + esc(t.aemtli.name) + '</span>'
           + (t.partner.length ? '<span class="vg-item-spacer"></span><span style="color:var(--text-muted);">mit ' + esc(t.partner.join(' + ')) + '</span>' : '')
           + '</div>';
    }).join('');
    openModal(
      '<h3>🧹 Meine nächsten Ämtli</h3>'
      + '<p style="margin:0 0 12px;color:var(--text-muted);font-size:13px;">' + esc(aemtliZeitenText(st.cfg)) + '</p>'
      + (rows ? '<div>' + rows + '</div>'
              : '<div class="empty-state">Bis zu den Sommerferien steht nichts an.</div>')
      + '<div class="modal-actions"><button class="btn btn-primary btn-sm" id="modalOk" type="button">Schliessen</button></div>'
    );
    document.getElementById('modalOk').addEventListener('click', closeModal);
  }).catch(function(err){ console.error(err); toast('Ämtliplan konnte nicht geladen werden.'); });
}

/* ---------- Lehrer-Seite ---------- */

function renderAemtliplan(){
  clearSubjectWatchers(); clearOverviewWatchers();
  var html = '';
  html += '<div class="back-row"><button class="btn btn-ghost btn-sm" id="backBtn" type="button">&larr; Klassenzimmer</button></div>';
  html += '<h2 class="page-welcome" style="margin-bottom:6px;">🧹 Ämtliplan</h2>';
  html += '<div id="amBody"><div class="empty-state">🧹 Ämtliplan wird geladen …</div></div>';
  renderChrome(html);
  document.getElementById('backBtn').addEventListener('click', function(){
    aemtliSaveFlush();
    if(aemtliUi.view !== 'plan'){ aemtliUi.view = 'plan'; paintAemtliplan(); return; }
    state.route = {name:'klassenzimmer'}; render();
  });

  // Liegt der Plan schon vor, wird SOFORT gezeichnet statt ueber ein Promise.
  // Sonst blieb beim Oeffnen kurz - und bei einem Fehler dauerhaft - nur
  // "Wird geladen ..." stehen.
  // Erst zeichnen, dann speichern. Vorher stand das Speichern davor — schlug es
  // fehl, wurde nie gezeichnet.
  if(aemtliState.loaded){
    paintAemtliplan();
    if(!aemtliState.exists && !isFremdeKlasse()) aemtliSave();
    return;
  }
  aemtliLoad().then(function(){
    if(!document.getElementById('amBody')) return;   // Seite inzwischen gewechselt
    paintAemtliplan();
    if(!aemtliState.exists && !isFremdeKlasse()) aemtliSave();
  });
}

/* Jede Ausnahme beim Zeichnen wird sichtbar gemacht statt verschluckt. Vorher
   blieb bei einem Fehler der Ladehinweis stehen, und ein Streichen sah
   wirkungslos aus, obwohl es laengst gespeichert war. */
function aemtliFehlerbox(host, err){
  console.error('Ämtliplan', err);
  host.innerHTML = '<div class="empty-state">Der Ämtliplan konnte nicht gezeichnet werden.'
    + '<br><small style="opacity:.75;">' + esc(String((err && err.message) || err)) + '</small>'
    + '<br><br><button class="btn btn-primary btn-sm" id="amRetry" type="button">Neu laden</button></div>';
  var b = document.getElementById('amRetry');
  if(b) b.addEventListener('click', function(){
    aemtliState.loaded = false; aemtliState.inflight = null;
    aemtliLoad(true).then(function(){ paintAemtliplan(); });
  });
}

function paintAemtliplan(){
  var host = document.getElementById('amBody');
  if(!host) return;
  if(!aemtliState.cfg){ aemtliLoad().then(function(){ paintAemtliplan(); }); return; }
  try{
    paintAemtliplanInner(host);
  }catch(err){
    aemtliFehlerbox(host, err);
  }
}

function paintAemtliplanInner(host){
  if(aemtliUi.view === 'teams'){ paintAemtliTeams(host); return; }
  if(aemtliUi.view === 'jobs'){ paintAemtliJobs(host); return; }

  var cfg = aemtliState.cfg;
  var weeks = aemtliWeeks(cfg);
  var nowMon = aemtliMonday(todayStr());
  var shown = aemtliUi.alle ? weeks : weeks.filter(function(w){ return w.monday >= nowMon; });
  if(!shown.length) shown = weeks.slice(-8);

  var h = '';
  h += '<p class="kz-intro"><b>'+esc(aemtliZeitenText(cfg))+'</b><br>Läuft von allein weiter bis zu den Sommerferien. Ferienwochen fallen automatisch raus; '
     + 'einzelne Wochen (Lager, Sporttag) kannst du streichen — die Reihenfolge der Teams läuft danach unverändert weiter.</p>';
  h += '<div class="back-row" style="flex-wrap:wrap;">';
  h += '<button class="btn btn-ghost btn-sm" id="amTeamsBtn" type="button">👥 Teams ('+cfg.teams.length+')</button>';
  h += '<button class="btn btn-ghost btn-sm" id="amJobsBtn" type="button">🧽 Ämtli ('+cfg.aemtli.length+')</button>';
  h += '<button class="btn btn-ghost btn-sm" id="amStartBtn" type="button">📅 Start: '+esc(fmtDueDate(cfg.startDate))+'</button>';
  h += '<button class="btn btn-ghost btn-sm" id="amAlleBtn" type="button">'+(aemtliUi.alle ? '⏩ Nur ab heute' : '🗓 Ganzes Schuljahr')+'</button>';
  h += '<button class="btn btn-ghost btn-sm" id="amCsvBtn" type="button">⬇️ CSV</button>';
  h += '</div>';

  h += '<div class="ae-wrap"><table class="ae-table"><thead><tr><th>Ämtli</th>';
  shown.forEach(function(w){
    var now = w.monday === nowMon ? ' ae-cell-now' : '';
    var cls = w.skipped ? ' ae-skipped' : now;
    h += '<th class="'+cls.trim()+'"><div class="ae-wk-head"><span>'+esc(aemtliWeekLabel(w))+'</span>';
    if(w.skipped === 'ferien') h += '<span style="font-size:10px;">Ferien</span>';
    else h += '<button class="ae-wk-btn" data-skip="'+esc(w.monday)+'" type="button">'+(w.skipped ? '↺ zurückholen' : '✕ streichen')+'</button>';
    h += '</div></th>';
  });
  h += '</tr></thead><tbody>';
  cfg.aemtli.forEach(function(a){
    h += '<tr><td>'+(a.icon||'🧹')+' '+esc(a.name)+'</td>';
    shown.forEach(function(w){
      var now = w.monday === nowMon ? ' ae-cell-now' : '';
      if(w.skipped){ h += '<td class="ae-skipped">—</td>'; return; }
      h += '<td class="'+now.trim()+'">'+esc(aemtliShortNames(aemtliTeamFor(cfg, w, a) || []).join(' + ') || '—')+'</td>';
    });
    h += '</tr>';
  });
  h += '</tbody></table></div>';
  var alterScroll = vorherigerScroll(host);
  host.innerHTML = h;
  if(aemtliUi.scrollTo === 'now'){ aemtliScrollToNow(host); aemtliUi.scrollTo = null; }
  else if(alterScroll !== null){
    var w = host.querySelector('.ae-wrap');
    if(w) w.scrollLeft = alterScroll;
  }

  document.getElementById('amTeamsBtn').addEventListener('click', function(){ aemtliUi.view = 'teams'; paintAemtliplan(); });
  document.getElementById('amJobsBtn').addEventListener('click', function(){ aemtliUi.view = 'jobs'; paintAemtliplan(); });
  document.getElementById('amAlleBtn').addEventListener('click', function(){ aemtliUi.alle = !aemtliUi.alle; aemtliUi.scrollTo = 'now'; paintAemtliplan(); });
  document.getElementById('amCsvBtn').addEventListener('click', function(){ aemtliCsv(weeks); });
  document.getElementById('amStartBtn').addEventListener('click', function(){
    uiPrompt('Erster Ämtli-Tag', 'Format JJJJ-MM-TT. Ab hier läuft die Rotation los.', cfg.startDate, 'Übernehmen', function(v){
      if(!/^\d{4}-\d{2}-\d{2}$/.test(v)){ toast('Bitte als JJJJ-MM-TT eingeben.'); return; }
      cfg.startDate = v; aemtliSave(); paintAemtliplan();
    });
  });
  Array.prototype.forEach.call(host.querySelectorAll('[data-skip]'), function(btn){
    btn.addEventListener('click', function(){
      var mon = btn.getAttribute('data-skip');
      var i = cfg.skipWeeks.indexOf(mon);
      if(i >= 0) cfg.skipWeeks.splice(i, 1); else cfg.skipWeeks.push(mon);
      aemtliSave(); paintAemtliplan();
    });
  });
}

/* Die laufende Woche in den sichtbaren Bereich holen. Nötig, sobald "Ganzes
   Schuljahr" aktiv ist — dann stehen bis zu 43 Spalten nebeneinander und die
   aktuelle läge sonst irgendwo ausserhalb. Die erste Spalte klebt (sticky),
   darum wird ihre Breite abgezogen. */
function vorherigerScroll(host){
  var w = host.querySelector('.ae-wrap');
  return w ? w.scrollLeft : null;
}

function aemtliScrollToNow(host){
  var wrap = host.querySelector('.ae-wrap');
  var jetzt = host.querySelector('.ae-cell-now');
  if(!wrap || !jetzt) return;
  var sticky = wrap.querySelector('th:first-child');
  var links = jetzt.offsetLeft - (sticky ? sticky.offsetWidth : 0) - 12;
  wrap.scrollLeft = Math.max(0, links);
}

function aemtliCsv(weeks){
  var cfg = aemtliState.cfg;
  var aktiv = weeks.filter(function(w){ return !w.skipped; });
  var lines = [['Ämtli'].concat(aktiv.map(aemtliWeekLabel)).map(csvField).join(';')];
  cfg.aemtli.forEach(function(a){
    lines.push([a.name].concat(aktiv.map(function(w){
      return aemtliShortNames(aemtliTeamFor(cfg, w, a) || []).join(' + ');
    })).map(csvField).join(';'));
  });
  downloadTextFile('aemtliplan.csv', '﻿'+lines.join('\r\n'), 'text/csv');
}

/* ===================== ⚡ BLITZUMFRAGE =====================
   Eine Frage, sofort am Beamer ausgewertet — ohne vorbereitetes Quiz.
   Der Peer-Instruction-Modus stellt dieselbe Frage zweimal: erst allein
   abstimmen, dann mit dem Banknachbarn reden, dann noch einmal. Am Schluss
   stehen beide Runden nebeneinander — daran sieht man, ob das Gespräch etwas
   gebracht hat.

   Liegt bewusst unter quizSessions/umfrage: die bestehenden Regeln für
   quizSessions/{sessionId}/antworten/{uid} passen genau (jede:r schreibt nur
   die eigene Stimme, die Lehrperson liest alle) — so braucht es dafür keine
   neue Collection und keine neue Regel. */

var UMFRAGE_MODI = {
  janein: { label:'Ja / Nein',   optionen:['Ja','Nein'] },
  ampel:  { label:'Ampel',       optionen:['🟢 Verstanden','🟡 Unsicher','🔴 Nicht verstanden'] },
  abcd:   { label:'4 leere Felder', optionen:['','','',''] },
  skala:  { label:'Skala 1 – 5', optionen:['1','2','3','4','5'] }
};

var umfrage = { session:null, unsub:null, unsubAnswers:null, answers:[], overlay:null, sig:null, voteOpen:false, myChoice:null };

function umfrageRef(){ return kdoc('quizSessions', 'umfrage'); }
function umfrageAnswersCol(){ return kcol('quizSessions', 'umfrage', 'antworten'); }
function umfrageLaeuft(s){ return !!(s && s.aktiv); }

function startUmfrageWatcher(){
  if(umfrage.unsub) return;
  umfrage.unsub = onSnapshot(umfrageRef(), function(snap){
    var prev = umfrage.session;
    umfrage.session = snap.exists() ? snap.data() : null;
    // Neue Runde: die eigene Stimme gilt nicht mehr.
    if(!prev || !umfrage.session || prev.runde !== umfrage.session.runde || prev.startedAt !== umfrage.session.startedAt){
      umfrage.myChoice = null;
    }
    updateUmfrageBanner();
    if(umfrage.voteOpen) paintUmfrageVote();
    if(umfrage.overlay) paintUmfrageHost();
  }, function(err){ console.error('Umfrage-Listener', err); });
}
function stopUmfrageWatcher(){
  if(umfrage.unsub){ umfrage.unsub(); umfrage.unsub = null; }
  if(umfrage.unsubAnswers){ umfrage.unsubAnswers(); umfrage.unsubAnswers = null; }
  umfrage.session = null; umfrage.answers = []; umfrage.myChoice = null; umfrage.sig = null;
}

function updateUmfrageBanner(){
  var btn = document.getElementById('umfrageJoinBtn');
  if(!btn || !state.profile) return;
  btn.hidden = !umfrageLaeuft(umfrage.session) || state.profile.role === 'teacher';
}

/* ---------- Schülergerät: abstimmen ---------- */

function openUmfrageVote(){
  if(!umfrageLaeuft(umfrage.session)) return;
  umfrage.voteOpen = true;
  paintUmfrageVote();
}

function paintUmfrageVote(){
  var s = umfrage.session;
  if(!s || !s.aktiv){
    if(umfrage.voteOpen){ umfrage.voteOpen = false; closeModal(); }
    return;
  }
  var h = '<h3>⚡ '+esc(s.frage)+'</h3>';
  if(s.peer) h += '<p style="margin:0 0 6px;color:var(--text-muted);">Runde '+(s.runde||1)+' von 2'+((s.runde||1) === 2 ? ' — jetzt nach dem Gespräch' : '')+'</p>';
  h += '<div class="uf-vote">';
  (s.optionen||[]).forEach(function(o, i){
    h += '<button type="button" data-vote="'+i+'"'+(umfrage.myChoice === i ? ' class="uf-picked"' : '')+'>'+esc(o)+'</button>';
  });
  h += '</div>';
  h += '<p style="margin:0;color:var(--good);font-weight:700;min-height:22px;">'+(umfrage.myChoice === null ? '' : '✔ Antwort gespeichert – du kannst sie noch ändern.')+'</p>';
  h += '<div class="modal-actions"><button class="btn btn-ghost btn-sm" id="ufVoteClose" type="button">Schliessen</button></div>';
  openModal(h, 'modal-wide');
  document.getElementById('ufVoteClose').addEventListener('click', function(){ umfrage.voteOpen = false; closeModal(); });
  Array.prototype.forEach.call(document.querySelectorAll('[data-vote]'), function(b){
    b.addEventListener('click', function(){
      var i = +b.getAttribute('data-vote');
      umfrage.myChoice = i;
      setDoc(doc(umfrageAnswersCol(), state.user.uid), {
        runde: s.runde || 1, choice: i, name: state.profile.displayName, at: Date.now()
      }).catch(function(err){ console.error(err); toast('Stimme konnte nicht gesendet werden.'); });
      paintUmfrageVote();
    });
  });
}

/* ---------- Lehrergerät: einrichten und am Beamer zeigen ---------- */

function openUmfrageSetup(){
  // Die Antwortmöglichkeiten sind immer einzeln editierbar; die Vorlagen füllen
  // die Felder nur vor. Vier leere Felder als Ausgangslage, mit "+" kommen
  // weitere dazu (bis 8), mit "✕" fällt eines weg (mindestens 2 bleiben).
  var entwurf = { frage:'', optionen:['','','',''], peer:false };

  function build(){
    var h = '';
    h += '<h3>⚡ Blitzumfrage</h3>';
    h += '<label class="modal-label">Frage</label>';
    h += '<textarea class="modal-input" id="ufFrage" rows="2" placeholder="z.B. Ist der Winkel bei C ein rechter Winkel?">'+esc(entwurf.frage)+'</textarea>';
    h += '<label class="modal-label" style="margin-top:12px;">Vorlage übernehmen</label>';
    h += '<div class="uf-setup-modi">';
    Object.keys(UMFRAGE_MODI).forEach(function(k){
      h += '<button class="kz-tab" data-modus="'+k+'" type="button">'+esc(UMFRAGE_MODI[k].label)+'</button>';
    });
    h += '</div>';
    h += '<label class="modal-label" style="margin-top:14px;">Antwortmöglichkeiten</label>';
    h += '<div id="ufOptList">';
    entwurf.optionen.forEach(function(o, i){
      h += '<div class="uf-opt-row">';
      h += '<span class="uf-opt-nr">'+String.fromCharCode(65+i)+'</span>';
      h += '<input class="modal-input" data-opt="'+i+'" value="'+esc(o)+'" placeholder="Antwort '+String.fromCharCode(65+i)+'">';
      h += '<button class="btn btn-ghost btn-sm" data-optdel="'+i+'" type="button" title="Entfernen"'+(entwurf.optionen.length <= 2 ? ' disabled' : '')+'>✕</button>';
      h += '</div>';
    });
    h += '</div>';
    h += '<div class="back-row" style="margin:8px 0 0;">';
    h += '<button class="btn btn-ghost btn-sm" id="ufOptAdd" type="button"'+(entwurf.optionen.length >= 8 ? ' disabled' : '')+'>+ Möglichkeit</button>';
    h += '</div>';
    h += '<label class="gr-opt" style="margin-top:14px;"><input type="checkbox" id="ufPeer"'+(entwurf.peer ? ' checked' : '')+'> Peer Instruction: zweimal abstimmen, dazwischen besprechen</label>';
    h += '<div class="modal-actions"><button class="btn btn-ghost btn-sm" id="ufCancel" type="button">Abbrechen</button>'
       + '<button class="btn btn-primary btn-sm" id="ufStart" type="button">Starten</button></div>';
    openModal(h, 'modal-wide');
    wire();
  }

  // Tippstand einsammeln, bevor neu gezeichnet wird — sonst ginge die bereits
  // geschriebene Frage beim Klick auf "+" verloren.
  function readBack(){
    var f = document.getElementById('ufFrage');
    if(f) entwurf.frage = f.value;
    var p = document.getElementById('ufPeer');
    if(p) entwurf.peer = p.checked;
    Array.prototype.forEach.call(document.querySelectorAll('[data-opt]'), function(inp){
      entwurf.optionen[+inp.getAttribute('data-opt')] = inp.value;
    });
  }

  function wire(){
    Array.prototype.forEach.call(document.querySelectorAll('[data-modus]'), function(b){
      b.addEventListener('click', function(){
        readBack();
        entwurf.optionen = UMFRAGE_MODI[b.getAttribute('data-modus')].optionen.slice();
        build();
      });
    });
    document.getElementById('ufOptAdd').addEventListener('click', function(){
      readBack();
      if(entwurf.optionen.length < 8) entwurf.optionen.push('');
      build();
    });
    Array.prototype.forEach.call(document.querySelectorAll('[data-optdel]'), function(b){
      b.addEventListener('click', function(){
        readBack();
        if(entwurf.optionen.length > 2) entwurf.optionen.splice(+b.getAttribute('data-optdel'), 1);
        build();
      });
    });
    document.getElementById('ufCancel').addEventListener('click', closeModal);
    document.getElementById('ufStart').addEventListener('click', function(){
      readBack();
      var frage = (entwurf.frage || '').trim();
      var opts = entwurf.optionen.map(function(o){ return (o||'').trim(); }).filter(Boolean);
      if(!frage){ toast('Bitte eine Frage eingeben.'); return; }
      if(opts.length < 2){ toast('Mindestens zwei Antwortmöglichkeiten ausfüllen.'); return; }
      closeModal();
      umfrageStart(frage, opts, entwurf.peer);
    });
  }

  build();
}

function umfrageStart(frage, optionen, peer){
  umfrageClearAnswers().then(function(){
    return setDoc(umfrageRef(), {
      aktiv:true, frage:frage, optionen:optionen, peer:!!peer,
      runde:1, ergebnis1:null, zeigen:false, startedAt:Date.now()
    });
  }).then(function(){
    openUmfrageHost();
  }).catch(function(err){ console.error(err); toast('Umfrage konnte nicht gestartet werden.'); });
}

function umfrageClearAnswers(){
  return getDocs(umfrageAnswersCol()).then(function(snap){
    if(snap.empty) return null;
    var batch = writeBatch(db);
    snap.forEach(function(d){ batch.delete(d.ref); });
    return batch.commit();
  });
}

function umfrageCounts(runde){
  var s = umfrage.session;
  if(!s) return [];
  var counts = (s.optionen||[]).map(function(){ return 0; });
  umfrage.answers.forEach(function(a){
    if((a.runde||1) !== runde) return;
    if(typeof a.choice === 'number' && counts[a.choice] !== undefined) counts[a.choice]++;
  });
  return counts;
}

function openUmfrageHost(){
  if(umfrage.overlay) return;
  var html = '';
  html += '<div class="kz-bar"><div class="kz-bar-title">⚡ Blitzumfrage</div><div class="kz-bar-spacer"></div>';
  html += '<button class="kz-close" id="ufClose" type="button" title="Schliessen (Esc)">✕</button></div>';
  html += '<div class="kz-stage" id="ufStage"></div>';
  umfrage.overlay = openOverlay(html, function(){
    if(umfrage.unsubAnswers){ umfrage.unsubAnswers(); umfrage.unsubAnswers = null; }
    umfrage.overlay = null;
    umfrage.sig = null;
    // Die Runde wird beim Schliessen beendet, damit auf den Schülergeräten
    // nicht der Abstimmen-Knopf stehen bleibt.
    updateDoc(umfrageRef(), { aktiv:false }).catch(function(){});
  }, 'kz-overlay-beamer');
  umfrage.overlay.el.querySelector('#ufClose').addEventListener('click', function(){ umfrage.overlay.close(); });

  klasseRosterLoad().then(function(){ umfrage.sig = null; paintUmfrageHost(); }).catch(function(){});
  if(!umfrage.unsubAnswers){
    umfrage.unsubAnswers = onSnapshot(umfrageAnswersCol(), function(snap){
      umfrage.answers = [];
      snap.forEach(function(d){ umfrage.answers.push(Object.assign({uid:d.id}, d.data())); });
      paintUmfrageHost();
    }, function(err){ console.error(err); });
  }
  paintUmfrageHost();
}

function paintUmfrageHost(){
  if(!umfrage.overlay) return;
  var s = umfrage.session;
  var stage = umfrage.overlay.el.querySelector('#ufStage');
  if(!s){ stage.innerHTML = '<div class="qh-sub">Keine Umfrage aktiv.</div>'; return; }
  var runde = s.runde || 1;
  var c2 = umfrageCounts(runde);
  var c1 = s.ergebnis1 || null;
  var total = c2.reduce(function(a,b){ return a+b; }, 0);
  var max = Math.max(1, Math.max.apply(null, c2.concat(c1 || [0])));
  var n = gaesteOptional(klasseRoster.list).length || 0;

  // Nur neu zeichnen, wenn sich wirklich etwas geändert hat — sonst flackert
  // die Anzeige bei jedem Snapshot.
  var sig = [s.frage, runde, s.zeigen, c2.join(','), (c1||[]).join(','), s.aktiv].join('|');
  if(sig === umfrage.sig) return;
  umfrage.sig = sig;

  var h = '<div class="uf-stage">';
  h += '<div class="uf-frage">'+esc(s.frage)+'</div>';
  h += '<div class="uf-meta">'+(s.peer ? 'Runde '+runde+' von 2 · ' : '')+total+(n ? ' von '+n : '')+' haben geantwortet</div>';
  h += '<div class="uf-dots">';
  for(var i=0; i<Math.max(n, total); i++) h += '<span class="uf-dot'+(i < total ? ' uf-dot-on' : '')+'"></span>';
  h += '</div>';

  if(s.zeigen){
    h += '<div class="uf-bars">';
    (s.optionen||[]).forEach(function(o, i){
      h += '<div class="uf-bar">';
      if(c1) h += '<span class="uf-bar-fill" style="width:'+Math.round((c1[i]||0)/max*100)+'%;"></span>';
      h += '<span class="'+(c1 ? 'uf-bar-fill-2' : 'uf-bar-fill')+'" style="width:'+Math.round(c2[i]/max*100)+'%;"></span>';
      h += '<div class="uf-bar-row"><span>'+esc(o)+'</span><span class="uf-bar-n">'+(c1 ? (c1[i]||0)+' → ' : '')+c2[i]+'</span></div>';
      h += '</div>';
    });
    h += '</div>';
    if(c1) h += '<div class="uf-legend"><span><i class="uf-l1"></i>Runde 1</span><span><i></i>Runde 2</span></div>';
  } else {
    h += '<div class="qh-sub" style="font-size:19px;">Ergebnis noch verdeckt – erst alle abstimmen lassen.</div>';
  }

  h += '<div class="back-row" style="margin:6px 0 0;flex-wrap:wrap;justify-content:center;">';
  h += '<button class="btn btn-primary btn-sm" id="ufToggle" type="button">'+(s.zeigen ? '🙈 Ergebnis verdecken' : '👁 Ergebnis zeigen')+'</button>';
  if(s.peer && runde === 1) h += '<button class="btn btn-ghost btn-sm" id="ufRunde2" type="button">🔁 Runde 2 starten</button>';
  h += '<button class="btn btn-ghost btn-sm" id="ufNeu" type="button">⚡ Neue Frage</button>';
  h += '<button class="btn btn-danger btn-sm" id="ufEnde" type="button">Beenden</button>';
  h += '</div></div>';
  stage.innerHTML = h;

  stage.querySelector('#ufToggle').addEventListener('click', function(){
    updateDoc(umfrageRef(), { zeigen: !s.zeigen }).catch(function(err){ console.error(err); });
  });
  var r2 = stage.querySelector('#ufRunde2');
  if(r2){
    r2.addEventListener('click', function(){
      // Runde 1 festhalten, bevor die Stimmen gelöscht werden — sonst wäre der
      // Vorher/Nachher-Vergleich weg.
      var keep = umfrageCounts(1);
      umfrageClearAnswers().then(function(){
        return updateDoc(umfrageRef(), { runde:2, ergebnis1:keep, zeigen:false, startedAt:Date.now() });
      }).catch(function(err){ console.error(err); toast('Runde 2 konnte nicht gestartet werden.'); });
    });
  }
  stage.querySelector('#ufNeu').addEventListener('click', function(){
    umfrage.overlay.close();
    setTimeout(openUmfrageSetup, 60);
  });
  stage.querySelector('#ufEnde').addEventListener('click', function(){ umfrage.overlay.close(); });
}

/* ===================== 🎲 GRUPPEN & PARTNER =====================
   Zufallspaare/-gruppen für Think-Pair-Share, Placemat und Gruppenarbeit.
   Zwei Dinge unterscheiden das von blossem Mischen:
   1. Es merkt sich, wer schon zusammen war (im localStorage dieses Geräts),
      und meidet Wiederholungen — sonst landen immer dieselben beieinander.
   2. Es kennt die Sitz-Regeln aus dem Sitzplan ("darf nicht neben"), damit man
      dieselben Absprachen nicht zweimal pflegen muss.
   Beides sind Strafpunkte, keine harten Verbote: lässt sich eine Vorgabe nicht
   erfüllen, kommt die Variante mit den wenigsten Verstössen — wie beim Sitzplan. */

// Ausgangsbelegung der Rollen. Die Lehrperson kann sie im Werkzeug ändern;
// gespeichert wird das in klassenzimmer/gruppen (teacher-only, kein neues Recht nötig).
var GRUPPEN_ROLLEN = ['⏱ Zeit', '✍️ Schreiben', '🗣 Vorstellen', '📦 Material'];
var gruppen = {
  overlay:null, roster:[], aus:{}, rules:[], meta:{}, rollenListe:GRUPPEN_ROLLEN.slice(),
  modus:'paare', groesse:3, rollen:false, vermeiden:true, regeln:true, mix:false,
  result:null
};

function gruppenHist(){
  try{ return JSON.parse(lsGet(LIB_PREFIX+'gruppen_hist') || '{}') || {}; }catch(e){ return {}; }
}
function gruppenHistSet(h){ lsSet(LIB_PREFIX+'gruppen_hist', JSON.stringify(h)); }
function gruppenPairKey(a, b){ return a < b ? a+'|'+b : b+'|'+a; }

function openGruppen(){
  if(gruppen.overlay) return;
  var html = '';
  html += '<div class="kz-bar"><div class="kz-bar-title">🎲 Gruppen & Partner</div><div class="kz-bar-spacer"></div>';
  html += gaesteToggleHtml('grGaeste');
  html += '<button class="kz-close" id="grClose" type="button" title="Schliessen (Esc)">✕</button></div>';
  html += '<div class="kz-stage" id="grStage"><div class="qh-sub">Wird geladen …</div></div>';
  gruppen.overlay = openOverlay(html, function(){ gruppen.overlay = null; }, 'kz-overlay-beamer');
  gruppen.overlay.el.querySelector('#grClose').addEventListener('click', function(){ gruppen.overlay.close(); });
  wireGaesteToggle(gruppen.overlay.el.querySelector('#grGaeste'), function(){
    if(!gruppen.rosterAll) return;
    gruppen.roster = gaesteOptional(gruppen.rosterAll);
    gruppen.result = null;
    paintGruppen();
  });

  Promise.all([
    klasseRosterLoad(),
    getDoc(kdoc('klassenzimmer', 'sitzplan')),
    getDoc(kdoc('klassenzimmer', 'gruppen')).catch(function(){ return { exists:function(){ return false; } }; })
  ]).then(function(r){
    if(!gruppen.overlay) return;
    gruppen.rosterAll = r[0];
    gruppen.roster = gaesteOptional(r[0]);
    var eig = r[2].exists() ? r[2].data() : {};
    gruppen.rollenListe = (eig.rollen && eig.rollen.length) ? eig.rollen.slice() : GRUPPEN_ROLLEN.slice();
    var sitz = r[1].exists() ? r[1].data() : {};
    gruppen.rules = sitz.rules || [];
    gruppen.meta = sitz.meta || {};
    // Wer im Sitzplan als abwesend markiert ist, ist es hier auch — einmal
    // abhaken reicht.
    gruppen.aus = {};
    (sitz.absent || []).forEach(function(uid){ gruppen.aus[uid] = true; });
    gruppen.result = null;
    paintGruppen();
  }).catch(function(err){ console.error(err); toast('Klassenliste konnte nicht geladen werden.'); });
}

function gruppenAnwesend(){
  return gruppen.roster.filter(function(s){ return !gruppen.aus[s.uid]; }).map(function(s){ return s.uid; });
}
function gruppenName(uid){
  var s = gruppen.roster.filter(function(x){ return x.uid === uid; })[0];
  return s ? (s.displayName||'').split(' ')[0] : '?';
}
function gruppenGender(uid){
  var m = gruppen.meta[uid];
  if(m && typeof m.g === 'string') return m.g;
  var s = gruppen.roster.filter(function(x){ return x.uid === uid; })[0];
  return s ? spDefaultGender(s) : '';
}

/* Gruppengrössen aufteilen. Wichtig: NIEMAND bleibt allein übrig. Bei 13
   anwesenden Kindern und Zielgrösse 2 gibt das 5 Paare und einen Dreier —
   nicht 6 Paare und ein Kind ohne Partner:in. Darum wird die Gruppenzahl so
   lange verkleinert, bis die kleinste Gruppe mindestens zu zweit ist. */
function gruppenSizes(n){
  var ziel = gruppen.modus === 'paare' ? 2 : Math.max(2, gruppen.groesse);
  if(n <= ziel) return n ? [n] : [];
  var anz = Math.max(1, Math.round(n / ziel));
  function verteilen(k){
    var out = [];
    for(var i=0; i<k; i++) out.push(Math.floor(n/k) + (i < (n % k) ? 1 : 0));
    return out;
  }
  var sizes = verteilen(anz);
  while(anz > 1 && Math.min.apply(null, sizes) < 2){ anz--; sizes = verteilen(anz); }
  // Grösste Gruppen zuerst, damit der Dreier oben steht statt irgendwo dazwischen.
  return sizes.sort(function(a,b){ return b-a; });
}

function gruppenScore(groups){
  var hist = gruppen.vermeiden ? gruppenHist() : {};
  var verboten = {}, zusammen = [];
  if(gruppen.regeln){
    gruppen.rules.forEach(function(r){
      if(r.t === 'nicht') verboten[gruppenPairKey(r.a, r.b)] = true;
      else if(r.t === 'zusammen') zusammen.push([r.a, r.b]);
    });
  }
  var pen = 0;
  // Wer zusammengehört, soll auch in dieselbe Gruppe — sonst Strafpunkte.
  zusammen.forEach(function(p){
    var beide = groups.some(function(g){ return g.indexOf(p[0]) >= 0 && g.indexOf(p[1]) >= 0; });
    if(!beide) pen += 100;
  });
  groups.forEach(function(g){
    for(var i=0; i<g.length; i++){
      for(var j=i+1; j<g.length; j++){
        var k = gruppenPairKey(g[i], g[j]);
        if(verboten[k]) pen += 200;
        pen += (hist[k] || 0) * 4;
      }
    }
    if(gruppen.mix){
      var w = g.filter(function(u){ return gruppenGender(u) === 'w'; }).length;
      var m = g.length - w;
      pen += Math.abs(w - m) * 3;
    }
  });
  return pen;
}

function gruppenBuild(order, sizes){
  var groups = [], k = 0;
  sizes.forEach(function(sz){ groups.push(order.slice(k, k+sz)); k += sz; });
  return groups;
}

function gruppenDraw(){
  var kids = gruppenAnwesend();
  if(kids.length < 2){ toast('Zu wenig anwesende Kinder.'); return; }
  var sizes = gruppenSizes(kids.length);
  var best = null, bestScore = Infinity;
  for(var r=0; r<500; r++){
    var order = kids.slice();
    for(var i=order.length-1; i>0; i--){ var j = Math.floor(Math.random()*(i+1)); var t = order[i]; order[i] = order[j]; order[j] = t; }
    var g = gruppenBuild(order, sizes);
    var sc = gruppenScore(g);
    if(sc < bestScore){ bestScore = sc; best = g; if(sc === 0) break; }
  }
  gruppen.result = best;
  // Ziehung merken, damit dieselben Paare beim nächsten Mal seltener kommen.
  if(gruppen.vermeiden){
    var hist = gruppenHist();
    best.forEach(function(g){
      for(var i=0; i<g.length; i++) for(var j=i+1; j<g.length; j++){
        var k = gruppenPairKey(g[i], g[j]);
        hist[k] = (hist[k] || 0) + 1;
      }
    });
    gruppenHistSet(hist);
  }
  playBlip();
  paintGruppen();
}

/* ---------- Rollen bearbeiten ---------- */
function gruppenRollenModal(){
  var liste = gruppen.rollenListe.slice();
  function build(){
    var h = '<h3>✎ Rollen</h3>';
    h += '<p style="margin:0 0 12px;color:var(--text-muted);font-size:13px;">Werden der Reihe nach an die Mitglieder jeder Gruppe verteilt. Sind es weniger Rollen als Kinder, beginnt die Liste wieder von vorn.</p>';
    liste.forEach(function(r, i){
      h += '<div class="uf-opt-row"><span class="uf-opt-nr">'+(i+1)+'</span>'
        +  '<input class="modal-input" data-rolle="'+i+'" value="'+esc(r)+'" placeholder="z.B. ⏱ Zeit">'
        +  '<button class="btn btn-ghost btn-sm" data-rolledel="'+i+'" type="button" title="Entfernen">✕</button></div>';
    });
    if(!liste.length) h += '<div class="empty-state" style="padding:18px;">Keine Rollen — dann werden auch keine verteilt.</div>';
    h += '<div class="back-row" style="margin:8px 0 0;"><button class="btn btn-ghost btn-sm" id="grRolleAdd" type="button">+ Rolle</button>'
      +  '<button class="btn btn-ghost btn-sm" id="grRolleReset" type="button">↺ Standard</button></div>';
    h += '<div class="modal-actions"><button class="btn btn-ghost btn-sm" id="grRolleCancel" type="button">Abbrechen</button>'
      +  '<button class="btn btn-primary btn-sm" id="grRolleOk" type="button">Speichern</button></div>';
    openModal(h, 'modal-wide');
    wire();
  }
  function readBack(){
    Array.prototype.forEach.call(document.querySelectorAll('[data-rolle]'), function(inp){
      liste[+inp.getAttribute('data-rolle')] = inp.value;
    });
  }
  function wire(){
    var add = document.getElementById('grRolleAdd');
    add.addEventListener('click', function(){ readBack(); liste.push(''); build(); });
    document.getElementById('grRolleReset').addEventListener('click', function(){ liste = GRUPPEN_ROLLEN.slice(); build(); });
    Array.prototype.forEach.call(document.querySelectorAll('[data-rolledel]'), function(b){
      b.addEventListener('click', function(){ readBack(); liste.splice(+b.getAttribute('data-rolledel'), 1); build(); });
    });
    document.getElementById('grRolleCancel').addEventListener('click', closeModal);
    document.getElementById('grRolleOk').addEventListener('click', function(){
      readBack();
      gruppen.rollenListe = liste.map(function(r){ return (r||'').trim(); }).filter(Boolean);
      setDoc(kdoc('klassenzimmer', 'gruppen'), { rollen: gruppen.rollenListe, updatedAt: serverTimestamp() }, {merge:true})
        .catch(function(err){ console.error(err); toast('Rollen nicht gespeichert.'); });
      closeModal();
      paintGruppen();
    });
  }
  build();
}

/* ---------- Regeln bearbeiten ----------
   Bearbeitet werden dieselben Regeln wie im Sitzplan (klassenzimmer/sitzplan),
   damit es nur EINE Liste gibt und man Absprachen nicht doppelt pflegt. Hier
   zählen nur "nicht zusammen" und "zusammen"; "sitzt allein"/"sitzt vorne"
   betreffen die Sitzordnung und bleiben unangetastet stehen. */
function gruppenRegelnModal(){
  var andere = gruppen.rules.filter(function(r){ return r.t !== 'nicht' && r.t !== 'zusammen'; });
  var liste = gruppen.rules.filter(function(r){ return r.t === 'nicht' || r.t === 'zusammen'; });
  function namen(sel){
    return gruppen.roster.map(function(s){
      return '<option value="'+esc(s.uid)+'"'+(sel === s.uid ? ' selected' : '')+'>'+esc(s.displayName)+'</option>';
    }).join('');
  }
  function build(){
    var h = '<h3>⚖️ Regeln für die Gruppenbildung</h3>';
    h += '<p style="margin:0 0 12px;color:var(--text-muted);font-size:13px;">Dieselben Regeln wie im Sitzplan. Lässt sich eine nicht erfüllen, wird die Variante mit den wenigsten Verstössen gezogen.</p>';
    if(!liste.length) h += '<div class="empty-state" style="padding:18px;">Noch keine Regeln.</div>';
    liste.forEach(function(r, i){
      var a = gruppen.roster.filter(function(x){ return x.uid === r.a; })[0];
      var b = gruppen.roster.filter(function(x){ return x.uid === r.b; })[0];
      h += '<div class="gr-regel-row"><span>'+esc(a ? a.displayName : '?')
        +  ' <b>'+(r.t === 'nicht' ? 'nicht mit' : 'zusammen mit')+'</b> '+esc(b ? b.displayName : '?')+'</span>'
        +  '<button class="btn btn-danger btn-sm" data-regeldel="'+i+'" type="button">Entfernen</button></div>';
    });
    h += '<div class="gr-regel-add">';
    h += '<select class="sp-select" id="grRegelA">'+namen(null)+'</select>';
    h += '<select class="sp-select" id="grRegelT"><option value="nicht">darf nicht mit</option><option value="zusammen">soll zusammen mit</option></select>';
    h += '<select class="sp-select" id="grRegelB">'+namen(null)+'</select>';
    h += '<button class="btn btn-primary btn-sm" id="grRegelAdd" type="button">Hinzufügen</button>';
    h += '</div>';
    h += '<div class="modal-actions"><button class="btn btn-ghost btn-sm" id="grRegelCancel" type="button">Abbrechen</button>'
      +  '<button class="btn btn-primary btn-sm" id="grRegelOk" type="button">Speichern</button></div>';
    openModal(h, 'modal-wide');
    wire();
  }
  function wire(){
    document.getElementById('grRegelAdd').addEventListener('click', function(){
      var a = document.getElementById('grRegelA').value;
      var b = document.getElementById('grRegelB').value;
      var t = document.getElementById('grRegelT').value;
      if(a === b){ toast('Bitte zwei verschiedene Kinder wählen.'); return; }
      var doppelt = liste.some(function(r){ return r.t === t && ((r.a === a && r.b === b) || (r.a === b && r.b === a)); });
      if(doppelt){ toast('Diese Regel gibt es schon.'); return; }
      liste.push({t:t, a:a, b:b});
      build();
    });
    Array.prototype.forEach.call(document.querySelectorAll('[data-regeldel]'), function(b){
      b.addEventListener('click', function(){ liste.splice(+b.getAttribute('data-regeldel'), 1); build(); });
    });
    document.getElementById('grRegelCancel').addEventListener('click', closeModal);
    document.getElementById('grRegelOk').addEventListener('click', function(){
      gruppen.rules = andere.concat(liste);
      // merge:true ist hier richtig: das Feld rules ist ein Array und wird dabei
      // komplett ersetzt, die übrigen Sitzplan-Felder bleiben unberührt.
      setDoc(kdoc('klassenzimmer', 'sitzplan'), { rules: gruppen.rules, updatedAt: serverTimestamp() }, {merge:true})
        .catch(function(err){ console.error(err); toast('Regeln nicht gespeichert.'); });
      closeModal();
      paintGruppen();
    });
  }
  build();
}

function paintGruppen(){
  if(!gruppen.overlay) return;
  var stage = gruppen.overlay.el.querySelector('#grStage');
  var anwesend = gruppenAnwesend().length;
  var h = '<div class="uf-stage">';

  if(gruppen.result){
    h += '<div class="gr-grid">';
    gruppen.result.forEach(function(g, i){
      h += '<div class="gr-card" style="animation-delay:'+(i*0.06).toFixed(2)+'s;"><h4>Gruppe '+(i+1)+'</h4><ul>';
      g.forEach(function(uid, j){
        var rl = gruppen.rollenListe;
        h += '<li>'+esc(gruppenName(uid))+((gruppen.rollen && rl.length) ? ' <span class="gr-role">'+esc(rl[j % rl.length])+'</span>' : '')+'</li>';
      });
      h += '</ul></div>';
    });
    h += '</div>';
    h += '<div class="back-row" style="margin:4px 0 0;justify-content:center;flex-wrap:wrap;">';
    h += '<button class="btn btn-primary btn-sm" id="grAgain" type="button">🎲 Nochmal ziehen</button>';
    h += '<button class="btn btn-ghost btn-sm" id="grBack" type="button">⚙️ Einstellungen</button>';
    h += '</div></div>';
    stage.innerHTML = h;
    stage.querySelector('#grAgain').addEventListener('click', gruppenDraw);
    stage.querySelector('#grBack').addEventListener('click', function(){ gruppen.result = null; paintGruppen(); });
    return;
  }

  h += '<div class="uf-frage">Wer arbeitet zusammen?</div>';
  h += '<div class="gr-panel">';
  h += '<button class="kz-tab'+(gruppen.modus === 'paare' ? ' kz-tab-on' : '')+'" data-modus="paare" type="button">👥 Paare</button>';
  h += '<button class="kz-tab'+(gruppen.modus === 'gruppen' ? ' kz-tab-on' : '')+'" data-modus="gruppen" type="button">👨‍👩‍👧 Gruppen à '+gruppen.groesse+'</button>';
  if(gruppen.modus === 'gruppen'){
    h += '<button class="btn btn-ghost btn-sm" id="grMinus" type="button">−</button>';
    h += '<button class="btn btn-ghost btn-sm" id="grPlus" type="button">+</button>';
  }
  h += '</div>';
  h += '<div class="gr-panel">';
  h += '<label class="gr-opt"><input type="checkbox" id="grVermeiden"'+(gruppen.vermeiden ? ' checked' : '')+'> Wiederholungen vermeiden</label>';
  h += '<label class="gr-opt"><input type="checkbox" id="grRegeln"'+(gruppen.regeln ? ' checked' : '')+'> Sitz-Regeln beachten</label>';
  h += '<label class="gr-opt"><input type="checkbox" id="grMix"'+(gruppen.mix ? ' checked' : '')+'> Durchmischt J/M</label>';
  h += '<label class="gr-opt"><input type="checkbox" id="grRollen"'+(gruppen.rollen ? ' checked' : '')+'> Rollen verteilen</label>';
  h += '</div>';
  h += '<div class="gr-panel">';
  h += '<button class="btn btn-ghost btn-sm" id="grEditRollen" type="button">✎ Rollen ('+gruppen.rollenListe.length+')</button>';
  h += '<button class="btn btn-ghost btn-sm" id="grEditRegeln" type="button">⚖️ Regeln ('+gruppen.rules.filter(function(r){ return r.t === 'nicht' || r.t === 'zusammen'; }).length+')</button>';
  h += '</div>';
  h += '<div class="uf-meta">'+anwesend+' von '+gruppen.roster.length+' anwesend — zum Abwählen antippen</div>';

/* ===================== 📋 VERGESSEN-ZÄHLER =====================
   Zählt aus, wer eine Abgabe nicht gemacht hat: Ab dem Tag NACH dem
   Abgabedatum gilt jede:r als "vergessen", die/der in der Abgabe-Checkliste
   nicht abgehakt ist.

   Es wird dafür nichts Zusätzliches gespeichert — die Zahl entsteht aus den
   Kalendereinträgen, die ohnehin da sind. Zwei Sicherungen gegen Fehlalarm:
   - Einträge, bei denen NIEMAND abgehakt ist, zählen nicht. Sonst würde eine
     Hausaufgabe, deren Checkliste man gar nie geöffnet hat, der halben Klasse
     einen Eintrag verpassen. (Lässt sich umschalten.)
   - Einzelne Kinder lassen sich pro Eintrag entschuldigen (excused.{uid}),
     und ein ganzer Eintrag lässt sich auf "nicht werten" stellen. */

var vergessen = { entries:[], roster:[], nurGewertet:true, loaded:false };

function vgRelevant(e, nurGewertet){
  if(!hasSubmissionChecklist(e.type)) return false;
  if(e.dueDate >= todayStr()) return false;      // erst ab dem Tag danach
  if(e.nichtWerten) return false;
  if(nurGewertet){
    var sub = e.submitted || {};
    if(!Object.keys(sub).some(function(k){ return sub[k]; })) return false;
  }
  return true;
}

function vgRows(){
  var rel = vergessen.entries.filter(function(e){ return vgRelevant(e, vergessen.nurGewertet); });
  rel.sort(function(a,b){ return b.dueDate.localeCompare(a.dueDate); });
  var rows = vergessen.roster.map(function(s){
    var items = rel.filter(function(e){
      if(gastFach(s) && e.subject !== gastFach(s)) return false;   // Fach-Gast
      if(e.submitted && e.submitted[s.uid]) return false;
      if(e.excused && e.excused[s.uid]) return false;
      return true;
    });
    return { stu:s, items:items };
  });
  rows.sort(function(a,b){
    if(a.items.length !== b.items.length) return b.items.length - a.items.length;
    return (a.stu.displayName||'').localeCompare(b.stu.displayName||'', 'de');
  });
  var ignoriert = vergessen.entries.filter(function(e){
    return hasSubmissionChecklist(e.type) && e.dueDate < todayStr() && !vgRelevant(e, vergessen.nurGewertet);
  }).length;
  return { rows:rows, gewertet:rel.length, ignoriert:ignoriert };
}

  document.getElementById('vgCsv').addEventListener('click', function(){ vgCsv(data.rows); });

  function entryById(id){ return vergessen.entries.filter(function(x){ return x.id === id; })[0]; }
  function patch(entryId, field, done){
    var e = entryById(entryId);
    if(!e) return;
    updateDoc(kdoc('calendarEntries', entryId), field).then(function(){
      done(e); paintVergessen();
    }).catch(function(err){ console.error(err); toast('Konnte nicht gespeichert werden.'); });
  }
  Array.prototype.forEach.call(host.querySelectorAll('[data-nach]'), function(b){
    b.addEventListener('click', function(){
      var p = b.getAttribute('data-nach').split(':');
      var f = {}; f['submitted.'+p[1]] = true;
      patch(p[0], f, function(e){ e.submitted = e.submitted || {}; e.submitted[p[1]] = true; });
    });
  });
  Array.prototype.forEach.call(host.querySelectorAll('[data-ent]'), function(b){
    b.addEventListener('click', function(){
      var p = b.getAttribute('data-ent').split(':');
      var f = {}; f['excused.'+p[1]] = true;
      patch(p[0], f, function(e){ e.excused = e.excused || {}; e.excused[p[1]] = true; });
    });
  });
  Array.prototype.forEach.call(host.querySelectorAll('[data-werten]'), function(b){
    b.addEventListener('click', function(){
      var id = b.getAttribute('data-werten'), e = entryById(id);
      if(!e) return;
      patch(id, { nichtWerten: !e.nichtWerten }, function(x){ x.nichtWerten = !x.nichtWerten; });
    });
  });
}

function vgCsv(rows){
  var lines = [['Name','Vergessen','Was'].map(csvField).join(';')];
  rows.forEach(function(r){
    lines.push([
      r.stu.displayName || r.stu.username,
      String(r.items.length),
      r.items.map(function(e){ return fmtDueDate(e.dueDate)+' '+e.title; }).join(' / ')
    ].map(csvField).join(';'));
  });
  downloadTextFile('vergessen.csv', '﻿'+lines.join('\r\n'), 'text/csv');
}

/* ===================== 📝 PRÜFUNGSMODUS =====================
   Die Lehrperson erstellt im Klassenzimmer eine Prüfung aus einer Übung. Beim
   Auswählen wird die Übung in einem unsichtbaren, abgeschotteten iframe
   geladen und «befragt» (pruefProbe), welche Bereiche sie hat:
   - art 'nativ': die Seite hat einen eigenen Prüfungsmodus und meldet ihre
     Bereiche/Einstellungen selbst (Pöstlergeografie: liest window.__GEO_PRUEFUNG,
     meldet Stand/Abgabe per postMessage {type:'geoPruefung'}).
   - art 'bank': die Library liest die Fragen aus der Seite aus (Quiz-
     Prüfungsvorbereitungen: TOPICS + Q; Mathe-Übungen: THEMES) und stellt die
     Prüfung selbst dar (pruefBank*). Bereiche = Themen der Übung. Die Fragen
     liegen ohne Lösungen im Prüfungsdokument, die Lösungen in
     pruefungen/{id}/intern/loesung (nur Lehrperson); korrigiert wird darum auf
     dem Gerät der Lehrperson, beim «Resultate freigeben» werden Punkte und
     Details in die Teilnahmen geschrieben.
   Gibt die Lehrperson die Prüfung frei, erscheint bei den Schüler:innen oben
   «📝 Prüfung verfügbar».

   Wer startet, schreibt die Prüfung im Vollbild über allem (#pruefLock hängt
   an <body>, nicht in #app, damit kein render() sie wegräumt). Verlässt man
   sie — Tab/Fenster wechseln, Vollbild beenden, neu laden, schliessen — ist
   man gesperrt und kommt erst wieder rein, wenn die Lehrperson entsperrt.
   Ein Neuladen wird erkannt, weil die Teilnahme dann noch «aktiv» ist, aber
   auf diesem Gerät keine Sitzung läuft. Selbst entsperren geht nicht: die
   Regeln lassen die Person nur schreiben, solange status == 'laeuft'.

   Daten: klassen/{k}/pruefungen/{id}                -> Einstellungen, status entwurf|offen|beendet
          klassen/{k}/pruefungen/{id}/teilnahmen/{uid} -> status laeuft|gesperrt|abgegeben, aktiv,
                                                        antworten, verstoesse, punkte, max, details
   Die Note wird nicht gespeichert, sondern aus Punkten + Notenskala der
   Prüfung berechnet — so wirkt eine geänderte Skala auch rückwirkend. */

// Fallback für eine Pöstlergeografie-Fassung, die den Prüfungsmodus schon
// kennt, aber noch nicht auf die Befragung antwortet.
var PRUEF_GEO_INFO = {art:'nativ', standardKats:['land','cap','flag'],
  kategorien:[{id:'cont',name:'🧭 Kontinente'},{id:'land',name:'🗺️ Länder'},{id:'cap',name:'🏛️ Hauptstädte'},{id:'flag',name:'🚩 Flaggen'},{id:'river',name:'🌊 Flüsse'}],
  optionen:[
    {id:'reg', name:'Gebiet', standard:'EU', werte:[['ALL','🌍 Welt'],['EU','Europa'],['AS','Asien'],['AF','Afrika'],['NA','Nord-/Mittelamerika'],['SA','Südamerika'],['OC','Ozeanien']]},
    {id:'lvl', name:'Umfang', standard:'1', werte:[['1','⭐ Grundwissen'],['2','⭐⭐ Erweitert'],['3','⭐⭐⭐ Alle Länder']]},
    {id:'diff', name:'Antwortart', standard:'1', werte:[['1','🟢 Auswahl (leicht)'],['2','🟡 Auswahl, Nachbarländer als Falle'],['3','🔴 Eintippen (kleine Tippfehler ok)'],['4','🟣 Eintippen (exakt)']]}
  ]};
var PRUEF_STALE_MS = 90000;   // so lange ohne Lebenszeichen = «keine Verbindung»

var pruef = {
  unsub:null, list:[],
  mineUnsubs:{}, mine:{},     // Schüler:in: eigene Teilnahme je Prüfung
  teilUnsubs:{}, teil:{},     // Lehrperson: alle Teilnahmen je Prüfung
  sess:null,                  // laufende Prüfung auf DIESEM Gerät
  monTimer:null, lockSig:'',
  loes:{}                     // Lehrperson: Lösungen je Bank-Prüfung (intern/loesung)
};

function pruefCol(){ return kcol('pruefungen'); }
function pruefRef(id){ return kdoc('pruefungen', id); }
function teilCol(pid){ return kcol('pruefungen', pid, 'teilnahmen'); }
function teilRef(pid, uid){ return kdoc('pruefungen', pid, 'teilnahmen', uid); }
function loesRef(pid){ return kdoc('pruefungen', pid, 'intern', 'loesung'); }
function pruefArt(p){ return p.art || 'nativ'; }
function pruefAnzahl(p){ return pruefArt(p) === 'bank' ? (p.fragen || []).length : ((p.cfg && p.cfg.anzahl) || 0); }
function pruefMs(ts){ return ts && ts.toMillis ? ts.toMillis() : (typeof ts === 'number' ? ts : 0); }
function pruefById(id){ return pruef.list.find(function(p){ return p.id === id; }) || null; }
// Eigene Teilnahme sofort lokal nachführen: die Prüfungsliste und die eigene
// Teilnahme sind zwei getrennte Listener — ohne das sähe ein dazwischen
// feuernder Listen-Snapshot noch den alten Stand («läuft, aktiv») und würde
// ein zweites Mal sperren.
function pruefLokal(pid, patch){ pruef.mine[pid] = Object.assign({}, pruef.mine[pid] || {}, patch); }
// Zeitlimit (optional, p.zeitMin): läuft pro Person ab ihrem Start (startMs),
// auch während einer Sperre weiter. Danach wird mit dem aktuellen Stand abgegeben.
function pruefFrist(p, t){ return p && +p.zeitMin > 0 && t && t.startMs ? t.startMs + p.zeitMin * 60000 : null; }
function pruefZeitUm(p, t){ var f = pruefFrist(p, t); return f != null && Date.now() >= f; }
function pruefZeitText(ms){ var s = Math.max(0, Math.ceil(ms / 1000)); return Math.floor(s / 60) + ':' + String(s % 60).padStart(2, '0'); }
function pruefIstLehrer(){ return !!(state.profile && state.profile.role === 'teacher'); }

/* ---------- Notenmassstab ----------
   p.skala = {typ, …}: dbk (Note = 5 × P ÷ Max + 1, Standard), dbk6 (6 schon ab
   p6 Punkten), knick (Note 4 bei prozent % der Punkte, darunter/darüber je
   linear), fehler (6 − (Fehler − frei) × abzug; Fehler = verlorene Punkte,
   beim Diktat die gezählten Fehler), tabelle (stufen [{note, ab}], ohne
   Rundung). Ältere Prüfungen ohne skala: punkteFuer6 / fehlerAbzug. */
var PRUEF_SKALEN = [
  ['dbk', 'DBK linear (Standard)'], ['dbk6', 'DBK mit reduzierter 6'], ['knick', 'Bestehensgrenze (Knick)'],
  ['fehler', 'Fehlerabzug'], ['tabelle', 'Eigene Punktetabelle']
];
var PRUEF_TAB_NOTEN = [6, 5.5, 5, 4.5, 4, 3.5, 3, 2.5, 2, 1.5];
function pruefSkala(p){
  var s = p && p.skala;
  if(s && s.typ) return s;
  if(p && p.diktat) return {typ:'fehler', abzug:+p.fehlerAbzug > 0 ? +p.fehlerAbzug : 0.25, frei:0};
  if(p && +p.punkteFuer6 > 0) return {typ:'dbk6', p6:+p.punkteFuer6};
  return {typ:'dbk'};
}
function pruefNoteRoh(sk, P, max){
  if(sk.typ === 'dbk6') return 1 + 5 * P / (+sk.p6 > 0 ? +sk.p6 : max);
  if(sk.typ === 'knick'){
    var g = max * Math.max(1, Math.min(99, +sk.prozent || 60)) / 100;
    return P >= g ? 4 + 2 * (P - g) / (max - g) : 1 + 3 * P / g;
  }
  if(sk.typ === 'fehler') return 6 - Math.max(0, (max - P) - (+sk.frei || 0)) * (+sk.abzug > 0 ? +sk.abzug : 0.25);
  if(sk.typ === 'tabelle'){
    var st = (sk.stufen || []).filter(function(r){ return r && typeof r.ab === 'number' && !isNaN(r.ab); }).sort(function(a, b){ return b.note - a.note; });
    for(var i=0;i<st.length;i++) if(P >= st[i].ab - 1e-9) return +st[i].note;
    return 1;
  }
  return 1 + 5 * P / max;
}
function pruefNote(p, punkte, max){
  if(typeof punkte !== 'number' || !max) return null;
  var sk = pruefSkala(p), n = pruefNoteRoh(sk, punkte, max);
  if(sk.typ !== 'tabelle'){ var r = +p.rundung || 0.1; n = Math.round(n / r) * r; }
  return Math.max(1, Math.min(6, n));
}
function pruefZahlText(x){ return String(Math.round(x * 100) / 100).replace('.', ','); }
function pruefSkalaText(p){
  var sk = pruefSkala(p);
  if(sk.typ === 'dbk6') return 'DBK, 6 ab ' + pruefZahlText(sk.p6) + ' P.';
  if(sk.typ === 'knick') return 'Note 4 bei ' + (sk.prozent || 60) + ' %';
  if(sk.typ === 'fehler') return '−' + pruefZahlText(+sk.abzug || 0.25) + ' pro Fehler' + (+sk.frei > 0 ? ', ' + pruefZahlText(sk.frei) + ' Fehler für eine 6' : '');
  if(sk.typ === 'tabelle') return 'eigene Punktetabelle';
  return 'DBK linear';
}

/* ---------- Bloom, Punkte, offene Fragen ----------
   Jede gezogene Frage bekommt eine Bloom-Stufe (die Übung kann sie mit
   bloom/level vorgeben, sonst schätzt pruefBloom nach Typ und Wortlaut) und
   einen Punktevorschlag. Beides lässt sich pro Prüfung unter «🧮 Aufgaben &
   Punkte» ändern; die Punkte stehen in den (öffentlichen) Fragen. */
var PRUEF_BLOOM = [
  {id:'erinnern', name:'Erinnern', icon:'🧠'}, {id:'verstehen', name:'Verstehen', icon:'💡'}, {id:'anwenden', name:'Anwenden', icon:'🛠️'}
];
var PRUEF_BLOOM_STD = {G:[50, 35, 15], E:[30, 40, 30]};
var PRUEF_TYPEN = {mc:'Auswahl', tf:'Wahr/Falsch', text:'Lücke', zahl:'Rechnen', zuordnen:'Zuordnen', reihenfolge:'Reihenfolge', offen:'Offen', diktat:'Diktat'};
function pruefBloomNorm(v){
  var s = String(v == null ? '' : v).toLowerCase();
  if(/^(1|k1|erinn|wissen|remember|reprod)/.test(s)) return 'erinnern';
  if(/^(2|k2|verst|understand)/.test(s)) return 'verstehen';
  if(/^([3-6]|k[3-6]|anw|apply|analy|transfer)/.test(s)) return 'anwenden';
  return '';
}
function pruefBloom(f){
  var b = pruefBloomNorm(f.bloom); if(b) return b;
  var t = (f.frage || '') + ' ' + (f.kontext || '');
  if(f.typ === 'zahl') return 'anwenden';
  if(/(berechne|bestimme|wende|löse |loese |konstruier|was passiert|was würde|was wuerde|beispiel|alltag|schätze|schaetze)/i.test(t)) return 'anwenden';
  if(f.typ === 'offen') return /^\s*(nenne|zähle|zaehle|was ist|wie heisst|wie heißt|definiere)/i.test(f.frage || '') ? 'erinnern' : 'verstehen';
  if(f.typ === 'zuordnen' || f.typ === 'reihenfolge') return 'verstehen';
  if(f.kontext && (f.typ === 'tf' || f.typ === 'mc')) return 'verstehen';   // Mathe: Aussagen prüfen, einordnen
  return /(warum|weshalb|wieso|erklär|erklaer|begründ|begruend|vergleich|unterschied|bedeut|ursache|folge|grund |zusammenhang|wozu|welche aussage)/i.test(t) ? 'verstehen' : 'erinnern';
}
function pruefPunkteVorschlag(f){
  if(f.typ === 'zahl' || f.typ === 'reihenfolge') return 2;
  if(f.typ === 'zuordnen') return Math.max(1, (f.links || []).length * 0.5);
  if(f.typ === 'offen') return String(f.loesung || '').split(/\s+/).length > 12 ? 3 : 2;
  return 1;
}
var PRUEF_STOPP = {};
('aber alle allem allen aller alles also andere anderen auch auf aus bei beim bereits bis dabei damit dann darauf darum dass dazu dem den denen denn der deren des dessen die dies diese diesem diesen dieser dieses doch dort durch eine einem einen einer eines etwa etwas fuer gegen gibt habe haben hatte hatten heute hier ihre ihrem ihren ihrer immer indem jede jedem jeden jeder jedes kann kein keine koennen konnte mehr meist meistens mit muss muessen nach neben nicht noch nur oder ohne sehr seine seinem seinen seiner sich sie sind sodass sollte sowie ueber unter usw viel viele vom von vor waehrend wann war waren warum weil welche welcher wenn werden wird wobei wurde wurden zum zur zwischen')
  .split(' ').forEach(function(w){ PRUEF_STOPP[w] = 1; });
function pruefStichworte(muster, ohne){
  var weg = {}, seen = {}, out = [];
  pruefNorm(ohne || '').split(' ').forEach(function(w){ weg[w] = 1; });
  pruefNorm(String(muster || '').replace(/[()"«»„“\/–-]/g, ' ')).split(' ').forEach(function(w){
    if(w.length < 4 || PRUEF_STOPP[w] || weg[w] || seen[w] || /^\d+$/.test(w)) return;
    seen[w] = 1; out.push(w);
  });
  return out.slice(0, 10);
}
// Vorkorrektur einer offenen Antwort: Anteil gefundener Stichwörter (Wortstamm),
// volle Punkte ab 60 %, sonst anteilig in halben Punkten.
function pruefOffenBewerten(antwort, L, max){
  var a = ' ' + pruefNorm(String(antwort || '').replace(/[()"«»„“\/–-]/g, ' ')) + ' ';
  var kw = L.stichworte || [], hit = [], miss = [];
  kw.forEach(function(w){
    var stamm = w.slice(0, Math.max(4, Math.ceil(w.length * 0.75)));
    (a.indexOf(' ' + stamm) >= 0 ? hit : miss).push(w);
  });
  var need = Math.max(1, Math.ceil(kw.length * 0.6));
  var pkt = kw.length && a.trim() ? pruefHalb(Math.min(1, hit.length / need) * max) : 0;
  return {pkt:pkt, hinweis:kw.length ? 'Stichwörter gefunden: ' + (hit.join(', ') || '–') + (miss.length ? ' · fehlen: ' + miss.join(', ') : '') : 'Keine Stichwörter — bitte selbst bewerten.'};
}
function pruefHalb(x){ return Math.floor(x * 2 + 1e-9) / 2; }
function pruefKorr(korrektur, id, max){
  if(!korrektur || !korrektur.hasOwnProperty(id)) return null;
  var k = korrektur[id];
  if(k === true) return max;
  if(k === false) return 0;
  var n = +k;
  return isNaN(n) ? null : Math.max(0, Math.min(max, n));
}
function pruefNoteText(n){ return n == null ? '–' : n.toFixed(2).replace(/0$/, ''); }
// «12 / 20 Punkte» bzw. beim Diktat «3 Fehler»
function pruefPunkteLabel(p){ return p && p.diktat ? 'Fehler' : 'Punkte'; }
function pruefPunkteWert(p, punkte, max){
  if(p && p.diktat) return typeof punkte === 'number' && max ? String(max - punkte) : '–';
  return (punkte == null ? '–' : punkte) + ' / ' + (max || '–');
}

/* ---------- Beobachter (ab dem Login) ---------- */

function startPruefungWatcher(){
  // Schulleitung nur in der Lehreransicht (lesen); in der Schüleransicht nie sperren.
  if(pruef.unsub || !state.profile || (isLeitung() && !pruefIstLehrer())) return;
  pruef.unsub = onSnapshot(pruefCol(), function(snap){
    var list = [];
    snap.forEach(function(d){ list.push(Object.assign({id:d.id}, d.data())); });
    list.sort(function(a,b){ return pruefMs(b.createdAt) - pruefMs(a.createdAt); });
    pruef.list = list;
    syncPruefTeilWatchers();
    updatePruefungBanner();
    if(pruefIstLehrer()) pruefRefreshTeacherView();
    else pruefStudentUpdate();
  }, function(err){ console.error('Prüfungs-Listener', err); });
}
function stopPruefungWatcher(){
  if(pruef.unsub){ pruef.unsub(); pruef.unsub = null; }
  Object.keys(pruef.mineUnsubs).forEach(function(k){ pruef.mineUnsubs[k](); });
  Object.keys(pruef.teilUnsubs).forEach(function(k){ pruef.teilUnsubs[k](); });
  pruef.mineUnsubs = {}; pruef.mine = {}; pruef.teilUnsubs = {}; pruef.teil = {}; pruef.list = [];
  pruefSessionStopp();
  pruefLockHide();
}

function syncPruefTeilWatchers(){
  var teacher = pruefIstLehrer();
  var want = {};
  pruef.list.forEach(function(p){
    if(teacher){
      // Lehrperson: laufende Prüfungen immer (für den Knopf oben), andere nur, solange sie offen angeschaut werden.
      if(p.status === 'offen' || (state.route.name === 'pruefung' && state.route.id === p.id)) want[p.id] = true;
    } else if(p.status === 'offen' || p.status === 'beendet'){
      want[p.id] = true;
    }
  });
  var unsubs = teacher ? pruef.teilUnsubs : pruef.mineUnsubs;
  Object.keys(unsubs).forEach(function(id){
    if(!want[id]){ unsubs[id](); delete unsubs[id]; if(teacher) delete pruef.teil[id]; else delete pruef.mine[id]; }
  });
  Object.keys(want).forEach(function(id){
    if(unsubs[id]) return;
    if(teacher){
      unsubs[id] = onSnapshot(teilCol(id), function(snap){
        var m = {};
        snap.forEach(function(d){ m[d.id] = Object.assign({uid:d.id}, d.data()); });
        pruef.teil[id] = m;
        updatePruefungBanner();
        pruefRefreshTeacherView();
      }, function(err){ console.error('Teilnahmen-Listener', err); });
    } else {
      unsubs[id] = onSnapshot(teilRef(id, state.user.uid), function(snap){
        pruef.mine[id] = snap.exists() ? snap.data() : null;
        updatePruefungBanner();
        pruefStudentUpdate();
      }, function(err){ console.error('Teilnahme-Listener', err); });
    }
  });
}

function updatePruefungBanner(){
  var btn = document.getElementById('pruefungBtn');
  if(!btn || !state.profile) return;
  btn.classList.remove('topbar-pruefung-alarm');
  if(isLeitung()){ btn.hidden = true; return; }
  if(pruefIstLehrer()){
    var laufend = pruef.list.filter(function(p){ return p.status === 'offen'; });
    if(!laufend.length){ btn.hidden = true; return; }
    var p = laufend[0], t = pruef.teil[p.id] || {}, ab = 0, gesperrt = 0;
    Object.keys(t).forEach(function(u){ if(t[u].status === 'abgegeben') ab++; if(t[u].status === 'gesperrt') gesperrt++; });
    btn.innerHTML = '📝 Prüfung läuft · ✅ ' + ab + (gesperrt ? ' · 🔒 ' + gesperrt : '');
    btn.classList.toggle('topbar-pruefung-alarm', gesperrt > 0);
    btn.hidden = state.route.name === 'pruefung' && state.route.id === p.id;
    btn.onclick = function(){ state.route = {name:'pruefung', id:p.id}; render(); };
    return;
  }
  var offen = pruef.list.find(function(p){ return p.status === 'offen' && pruef.mine.hasOwnProperty(p.id) && !pruef.mine[p.id]; });
  if(offen){
    btn.hidden = false;
    btn.innerHTML = '📝 Prüfung verfügbar';
    btn.onclick = function(){ pruefStartDialog(offen); };
    return;
  }
  var frei = pruef.list.find(function(p){ return p.resultateFrei && pruef.mine[p.id] && pruef.mine[p.id].status === 'abgegeben'; });
  if(frei){
    var neu = true;
    try{ neu = !localStorage.getItem(pruefGesehenKey(frei.id)); }catch(e){}
    btn.hidden = false;
    btn.innerHTML = '📝 Prüfungsresultat' + (neu ? ' ist da' : '');
    btn.onclick = function(){ pruefResultatZeigen(frei); };
    return;
  }
  btn.hidden = true;
}

// Muss direkt aus einem Klick heraus laufen (Vollbild braucht eine Nutzergeste).
async function pruefStarten(p, weiter, vorschau){

    antworten:null, beantwortet:0, saveTimer:null, poll:null, beat:null, abgebenGesendet:false,
    frist:vorschau && +p.zeitMin > 0 ? Date.now() + p.zeitMin * 60000 : null, uhr:null};
  sess.uhr = setInterval(pruefUhrTick, 1000);

      var startMs = weiter && pruef.mine[p.id] && pruef.mine[p.id].startMs ? pruef.mine[p.id].startMs : Date.now();
      pruefLokal(p.id, {status:'laeuft', aktiv:true, startMs:startMs});

          gestartetAm:serverTimestamp(), startMs:startMs, lebt:serverTimestamp(),
          antworten:{}, beantwortet:0, max:pruefAnzahl(p), verstoesse:[]
        });
      }
      docOk = true;
      sess.frist = pruefFrist(p, {startMs:startMs});
      // Wächter nach einer kurzen Schonfrist (Vollbild braucht einen Moment) — schon während die Seite lädt.
      setTimeout(function(){ if(pruef.sess === sess) pruefWaechterAn(); }, 1500);
    }
    var saved = (!vorschau && pruef.mine[p.id] && pruef.mine[p.id].antworten) || {};
    if(pruefArt(p) === 'bank'){ pruefBankStart(p, sess, ov, saved); return; }
    var html = await loadResourceHtml(p.contentId);
    if(pruef.sess !== sess) return;
    // Ältere Pöstlergeografie zeigte nach einem Karten-Klick den Namen des
    // angetippten Landes — damit liesse sich die Lösung erklicken. Auch wenn
    // noch diese Fassung hochgeladen ist: Namen hier herausnehmen.
    html = html.split("'Deine Wahl: <b>' + esc(exAnswerLabel(q, EX.ans[q.key])) + '</b>'").join("'✔️ <b>Auf der Karte markiert</b> – du kannst deine Wahl noch ändern.'");
    var cfg = Object.assign({}, p.cfg || {}, (p.cfg && p.cfg.optionen) || {}, {titel:p.titel, seed:p.seed, personSeed:pruefPersonSeed(uid), antworten:saved});
    var inject = '<script>window.__GEO_PRUEFUNG=' + JSON.stringify(cfg).replace(/</g, '\\u003c') + ';<\/script>';
    var headRe = /<head(\s[^>]*)?>/i;
    html = headRe.test(html) ? html.replace(headRe, function(m){ return m + inject; }) : inject + html;
    ov.innerHTML = pruefLockBar(p, vorschau) + '<iframe id="pruefFrame" title="'+esc(p.titel)+'" allow="clipboard-read; clipboard-write"></iframe>';

}

function pruefPersonSeed(uid){
  var h = 2166136261;
