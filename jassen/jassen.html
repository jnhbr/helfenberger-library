<!doctype html>
<html lang="de-CH">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Jasstisch</title>
<style>
:root{
  --felt-1:#1d3a2c; --felt-2:#12251c; --felt-3:#0a1510;
  --panel:#1c1712; --panel-2:#241d15; --line:#5b4526; --line-soft:#3a2d1a;
  --gold:#d9b25a; --gold-2:#a8782a; --gold-soft:#f0d79a;
  --ivory:#f6ecd3; --muted:#b9a98b; --ink:#17110b;
  --ok:#6fcf8d; --bad:#e8705f; --warn:#f0b650;
  --sq-l:#ecd9b0; --sq-d:#a56f3f;
  --serif:"Iowan Old Style","Palatino Linotype",Palatino,"Book Antiqua",Georgia,"Times New Roman",serif;
  --sans:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  --piece-font:"Segoe UI Symbol","Apple Symbols","Noto Sans Symbols 2","DejaVu Sans","Arial Unicode MS",sans-serif;
  --bs:min(calc(100vw - 56px), calc(100vh - 215px), 640px);
}
*{box-sizing:border-box;}
html,body{margin:0;min-height:100%;}
body{
  font-family:var(--sans); color:var(--ivory); font-size:16px; line-height:1.4;
  background:
    repeating-conic-gradient(rgba(255,255,255,.018) 0% 25%, transparent 0% 50%) 0 0/72px 72px,
    radial-gradient(1200px 700px at 50% -10%, var(--felt-1) 0%, var(--felt-2) 48%, var(--felt-3) 100%);
  background-attachment:fixed;
  -webkit-text-size-adjust:100%;
}
button{font:inherit; color:inherit; cursor:pointer;}
[hidden]{display:none !important;}
#app{max-width:1040px; margin:0 auto; padding:14px 16px 40px;}

/* ---------- Kopf ---------- */
.top{display:flex; align-items:center; gap:12px; margin-bottom:14px;}
.logo{width:44px; height:44px; border-radius:50%; display:grid; place-items:center; flex:none;
  background:radial-gradient(circle at 35% 30%, #f3dc9c, var(--gold) 55%, var(--gold-2)); color:var(--ink);
  font-size:26px; font-family:var(--piece-font); box-shadow:0 2px 0 #6b4a14, 0 6px 14px #0008;}
.brand{flex:1; min-width:0;}
.brand h1{margin:0; font-family:var(--serif); font-weight:700; font-size:24px; letter-spacing:.14em; text-transform:uppercase; color:var(--gold-soft); line-height:1.05;}
.brand small{display:block; color:var(--muted); font-size:12.5px; letter-spacing:.04em;}
.chip{display:inline-flex; align-items:center; gap:6px; padding:6px 12px; border-radius:999px; font-size:13px; font-weight:600; border:1px solid var(--line); background:#0006; white-space:nowrap;}
.chip i{width:9px; height:9px; border-radius:50%; background:var(--ok); box-shadow:0 0 8px var(--ok);}
.chip.zu i{background:var(--bad); box-shadow:0 0 8px var(--bad);}
.iconbtn{width:40px; height:40px; border-radius:50%; border:1px solid var(--line); background:#0006; font-size:18px; display:grid; place-items:center;}
.iconbtn:hover{border-color:var(--gold);}

/* ---------- Karten, Knöpfe ---------- */
.card{background:linear-gradient(180deg,var(--panel-2),var(--panel)); border:1px solid var(--line); border-radius:14px; padding:16px 18px; box-shadow:0 10px 26px #0006, inset 0 1px 0 #ffffff12;}
.card h2,.card h3{font-family:var(--serif); margin:0 0 8px; color:var(--gold-soft); letter-spacing:.04em;}
.card h2{font-size:20px;} .card h3{font-size:17px;}
.muted{color:var(--muted);}
.btn{border:1px solid #6b4a14; border-radius:10px; padding:10px 16px; font-weight:700; color:var(--ink);
  background:linear-gradient(180deg,#f0d28a,var(--gold) 50%,var(--gold-2)); box-shadow:0 2px 0 #5a3d0e, 0 6px 14px #0006;
  transition:transform .08s, filter .15s;}
.btn:hover{filter:brightness(1.07);} .btn:active{transform:translateY(1px);}
.btn.ghost{background:transparent; color:var(--ivory); border-color:var(--line); box-shadow:none;}
.btn.ghost:hover{border-color:var(--gold); color:var(--gold-soft);}
.btn.danger{background:linear-gradient(180deg,#ef9686,#d1503f 55%,#a63427); color:#fff; border-color:#6e1f15; box-shadow:0 2px 0 #5a160e, 0 6px 14px #0006;}
.btn.sm{padding:6px 12px; font-size:14px; border-radius:8px;}
.btn[disabled]{opacity:.45; cursor:not-allowed; filter:none;}
.row{display:flex; flex-wrap:wrap; gap:8px; align-items:center;}

/* ---------- Gesperrt ---------- */
.gate{text-align:center; padding:34px 22px 30px; max-width:560px; margin:24px auto;}
.gate .lock{position:relative; width:150px; height:150px; margin:0 auto 14px; display:grid; place-items:center;}
.gate .lock b{font-size:96px; font-family:var(--piece-font); color:#d9c7a0; opacity:.5; line-height:1;}
.gate .lock span{position:absolute; right:6px; bottom:6px; width:58px; height:58px; border-radius:50%; background:radial-gradient(circle at 35% 30%,#f3dc9c,var(--gold) 60%,var(--gold-2)); display:grid; place-items:center; font-size:30px; box-shadow:0 6px 16px #000a;}
.gate h2{font-size:24px;}
.gate .big{font-family:var(--serif); font-size:34px; color:var(--gold-soft); margin:6px 0 2px; font-variant-numeric:tabular-nums;}
.gate ul{list-style:none; padding:0; margin:16px auto 0; max-width:360px; text-align:left; color:var(--muted); font-size:14.5px;}
.gate li{padding:4px 0 4px 24px; position:relative;} .gate li::before{content:"♠︎"; position:absolute; left:0; color:var(--gold);}

/* ---------- Lehrerfeld ---------- */
.teacher{margin-bottom:16px; padding:0;}
.teacher summary{list-style:none; cursor:pointer; padding:12px 18px; display:flex; align-items:center; gap:10px; font-family:var(--serif); color:var(--gold-soft); letter-spacing:.04em; font-size:17px;}
.teacher summary::-webkit-details-marker{display:none;}
.teacher summary .sub{margin-left:auto; font-family:var(--sans); font-size:13px; color:var(--muted); letter-spacing:0;}
.teacher .body{padding:2px 18px 16px; border-top:1px solid var(--line-soft);}
.teacher .klassen{display:flex; flex-wrap:wrap; gap:6px 12px; margin:8px 0 2px; font-size:14px;}
.teacher label{display:inline-flex; align-items:center; gap:5px; color:var(--muted);}

/* ---------- Menü ---------- */
.modes{display:grid; grid-template-columns:repeat(auto-fit,minmax(220px,1fr)); gap:14px; margin-bottom:18px;}
.mode{text-align:left; padding:18px 18px 16px; border-radius:14px; border:1px solid var(--line); background:linear-gradient(180deg,var(--panel-2),var(--panel)); box-shadow:0 10px 26px #0006, inset 0 1px 0 #ffffff12; transition:transform .12s, border-color .15s;}
.mode:hover{transform:translateY(-3px); border-color:var(--gold);}
.mode .pc{display:block; font-family:var(--piece-font); font-size:44px; line-height:1; color:var(--gold); margin-bottom:6px; text-shadow:0 2px 0 #000a;}
.mode b{font-family:var(--serif); font-size:19px; color:var(--ivory); letter-spacing:.03em;}
.mode small{display:block; margin-top:3px; color:var(--muted); font-size:13.5px;}
.resume{display:flex; align-items:center; gap:12px; flex-wrap:wrap; margin-bottom:16px; border-color:var(--gold);}
.resume .grow{flex:1; min-width:180px;}
.two{display:grid; grid-template-columns:1fr 1fr; gap:14px;}
@media (max-width:760px){.two{grid-template-columns:1fr;}}
.tisch{display:flex; align-items:center; gap:10px; padding:10px 0; border-top:1px solid var(--line-soft);}
.tisch:first-of-type{border-top:0;}
.tisch .dot{width:30px; height:30px; border-radius:50%; flex:none; display:grid; place-items:center; font-family:var(--piece-font); font-size:20px;}
.tisch .info{flex:1; min-width:0;} .tisch .info b{display:block;} .tisch .info small{color:var(--muted);}
.dot.w{background:#f6ecd3; color:#2b1d12; border:1px solid #2b1d12;} .dot.b{background:#1a120c; color:#f6ecd3; border:1px solid #8a6a45;}
table.rang{width:100%; border-collapse:collapse; font-size:15px;}
table.rang th{font-size:12px; letter-spacing:.08em; text-transform:uppercase; color:var(--muted); text-align:right; padding:0 6px 6px;}
table.rang th:nth-child(2){text-align:left;}
table.rang td{padding:7px 6px; border-top:1px solid var(--line-soft); text-align:right; font-variant-numeric:tabular-nums;}
table.rang td:nth-child(1){text-align:left; width:30px; color:var(--gold);} table.rang td:nth-child(2){text-align:left;}
table.rang tr.me td{background:#d9b25a1c;} table.rang td.pt{font-weight:700; color:var(--gold-soft);}
.empty{color:var(--muted); padding:10px 0;}

.nav{display:flex; gap:6px; padding:6px 8px 8px; border-top:1px solid var(--line-soft);}
.nav button{flex:1; padding:6px 0; border-radius:8px; border:1px solid var(--line); background:#0005; font-size:15px;}
.nav button:hover{border-color:var(--gold);} .nav button[disabled]{opacity:.35;}
.acts{display:flex; flex-wrap:wrap; gap:8px;}
.acts .btn{flex:1 1 auto;}
.banner{padding:10px 12px; border-radius:10px; border:1px solid var(--warn); background:#f0b6501a; font-size:14px; color:#ffdca0;}
.banner .row{margin-top:8px;}

/* ---------- Dialog, Toast ---------- */
.modal{position:fixed; inset:0; z-index:100; background:rgba(4,8,6,.72); display:grid; place-items:center; padding:16px; overflow:auto; animation:fade .15s;}
.dlg{width:min(520px,100%); max-height:100%; overflow:auto;}
.dlg h2{font-size:22px;}
.dlg .field{margin:14px 0 4px;} .dlg .field>label.t{display:block; font-size:12.5px; letter-spacing:.08em; text-transform:uppercase; color:var(--muted); margin-bottom:6px;}
.seg{display:flex; flex-wrap:wrap; gap:6px; position:relative;}
.seg input{position:absolute; opacity:0; pointer-events:none;}
.seg label{padding:8px 13px; border-radius:9px; border:1px solid var(--line); background:#0005; cursor:pointer; font-size:14.5px;}
.seg input:checked + label{background:linear-gradient(180deg,#f0d28a,var(--gold)); color:var(--ink); border-color:#6b4a14; font-weight:700;}
.seg input:focus-visible + label{outline:2px solid var(--gold-soft); outline-offset:2px;}
.opt{display:flex; align-items:center; gap:10px; padding:8px 2px; border-top:1px solid var(--line-soft);}
.opt:first-of-type{border-top:0;} .opt .t{flex:1;} .opt .t small{display:block; color:var(--muted); font-size:12.5px;}
.sw{position:relative; width:46px; height:26px; flex:none;}
.sw input{position:absolute; inset:0; opacity:0; width:100%; height:100%; margin:0; cursor:pointer; z-index:1;}
.sw span{position:absolute; inset:0; border-radius:99px; background:#0008; border:1px solid var(--line); transition:.15s;}
.sw span::after{content:""; position:absolute; top:2px; left:2px; width:20px; height:20px; border-radius:50%; background:var(--muted); transition:.15s;}
.sw input:checked + span{background:var(--gold-2); border-color:var(--gold);} .sw input:checked + span::after{left:22px; background:var(--ivory);}
.sw input:focus-visible + span{outline:2px solid var(--gold-soft); outline-offset:2px;}
.subopts{margin:4px 0 6px 0; padding:2px 0 8px; display:none;} .subopts.show{display:block;}
.dlg .actions{display:flex; gap:8px; justify-content:flex-end; margin-top:18px; flex-wrap:wrap;}
.result{text-align:center;} .result .big{font-family:var(--piece-font); font-size:72px; color:var(--gold); line-height:1; text-shadow:0 3px 0 #000a;} .result h2{font-size:26px; margin-top:6px;}
#toast{position:fixed; left:50%; bottom:22px; transform:translateX(-50%) translateY(20px); background:#0c0905f0; border:1px solid var(--gold); color:var(--ivory); padding:10px 16px; border-radius:10px; opacity:0; pointer-events:none; transition:.2s; z-index:200; max-width:90vw; text-align:center;}
#toast.show{opacity:1; transform:translateX(-50%);}
@keyframes fade{from{opacity:0}to{opacity:1}}
@media (prefers-reduced-motion:reduce){*{animation:none !important; transition:none !important;}}
@media (max-width:560px){
  #app{padding:10px 10px 32px;}
  .top{gap:8px;} .logo{width:38px;height:38px;font-size:22px;}
  .brand h1{font-size:18px; letter-spacing:.1em;} .brand small{display:none;}
  .top{flex-wrap:wrap;} .chip{order:10; flex:1 1 100%; justify-content:center; font-size:12.5px; padding:5px 9px;}
  .iconbtn{width:36px;height:36px;}
  .card{padding:14px;}
}
button:focus-visible{outline:2px solid var(--gold-soft); outline-offset:2px;}

/* ---------- Jass: Tisch ---------- */
:root{ --cw:min(15.5vw,78px); --ch:calc(var(--cw)*1.56); --tafel:#232a26; --kreide:#eef0e8; }
.logo{font-family:var(--serif);}
.topnav{display:flex; gap:6px; flex-wrap:wrap; margin:0 0 14px;}
.topnav button{padding:7px 14px; border-radius:999px; border:1px solid var(--line); background:#0005; font-size:14px;}
.topnav button.on{background:linear-gradient(180deg,#f0d28a,var(--gold)); color:var(--ink); border-color:#6b4a14; font-weight:700;}
.topnav .sp{flex:1;}
.setbtn{display:inline-flex; gap:0; border:1px solid var(--line); border-radius:999px; overflow:hidden; background:#0005;}
.setbtn button{padding:7px 12px; border:0; background:transparent; font-size:13.5px;}
.setbtn button.on{background:linear-gradient(180deg,#f0d28a,var(--gold)); color:var(--ink); font-weight:700;}

.jc{display:block; width:var(--cw); height:calc(var(--cw)*1.56); flex:none; filter:drop-shadow(0 2px 3px #0008);}
.jc.sm{--cw:46px;} .jc.xs{--cw:34px;} .jc.lg{--cw:96px;}
.jc svg{display:block; width:100%; height:100%;}
.cardbtn{border:0; background:transparent; padding:0; border-radius:8px; position:relative; transition:transform .12s;}
.cardbtn.ok:hover{transform:translateY(-14px);}
.cardbtn.no{opacity:.4; filter:grayscale(.4);} .cardbtn.no .jc{filter:none;}
.cardbtn.hint .jc{filter:drop-shadow(0 0 7px #f0d79a) drop-shadow(0 0 3px #f0d79a);}
.cardbtn.ok{cursor:pointer;}

.jtable{position:relative; display:grid; grid-template-columns:minmax(0,1fr) minmax(0,2.2fr) minmax(0,1fr); grid-template-rows:auto minmax(220px,auto) auto;
  gap:8px; padding:16px 12px 14px; border-radius:18px; border:2px solid #1a0f08;
  background:radial-gradient(ellipse at 50% 45%, #2d6a47 0%, #20503a 55%, #153325 100%);
  box-shadow:0 22px 44px #000b, inset 0 0 0 6px #6a4529, inset 0 0 0 8px #2d1a0e, inset 0 0 60px #0007;}
.seat{display:flex; flex-direction:column; align-items:center; gap:6px; min-width:0; position:relative;}
.seat.top{grid-column:2; grid-row:1;} .seat.left{grid-column:1; grid-row:2; justify-content:center;}
.seat.right{grid-column:3; grid-row:2; justify-content:center;} .seat.me{grid-column:1/-1; grid-row:3;}
.center{grid-column:2; grid-row:2; display:grid; place-items:center; position:relative; min-height:230px; padding-top:30px;}
.nm{font-family:var(--serif); font-weight:700; font-size:15px; padding:3px 12px; border-radius:99px; background:#0009; border:1px solid var(--line); max-width:100%; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; color:var(--ivory);}
.seat.act .nm{background:#f0d79a; color:var(--ink); border-color:var(--gold); box-shadow:0 0 14px #f0d79a99;}
.nm small{font-weight:400; opacity:.8;}
.backs{display:flex; justify-content:center; padding-left:18px;}
.backs .jc{--cw:36px; margin-left:calc(-36px*.62);}
.seat.left .backs,.seat.right .backs{flex-direction:column; padding-left:0; padding-top:calc(var(--ch)*.1);}
.seat.left .backs .jc,.seat.right .backs .jc{--cw:34px; margin-left:0; margin-top:-37px; transform:rotate(90deg);} .seat.left .backs .jc:first-child,.seat.right .backs .jc:first-child{margin-top:0;}
.hand{display:flex; justify-content:center; flex-wrap:nowrap; padding-top:16px; min-height:calc(var(--ch) + 18px);}
.hand .cardbtn{margin-left:calc(var(--cw)*-.3);} .hand .cardbtn:first-child{margin-left:0;}
.trick{position:relative; width:min(100%,300px); height:240px;}
.trick .tc{position:absolute; transition:all .25s;}
.trick .tc.p0{left:50%; bottom:2px; transform:translateX(-50%) rotate(-3deg);} .trick .tc.p1{right:6%; top:50%; transform:translateY(-50%) rotate(7deg);}
.trick .tc.p2{left:50%; top:2px; transform:translateX(-50%) rotate(3deg);} .trick .tc.p3{left:6%; top:50%; transform:translateY(-50%) rotate(-7deg);}
.trick .tc .jc{--cw:64px;}
.trumpbadge{position:absolute; left:6px; top:6px; display:flex; align-items:center; gap:6px; padding:4px 10px; border-radius:99px; background:#0009; border:1px solid var(--gold); font-size:13px; font-weight:700; color:var(--gold-soft);}
.trumpbadge svg{width:22px; height:22px;}
.bubble{position:absolute; z-index:6; max-width:190px; background:#fff8e4; color:#2b1d12; font-size:13.5px; padding:6px 10px; border-radius:12px; box-shadow:0 4px 10px #0007; pointer-events:none; animation:fade .2s;}
.seat.top .bubble{top:100%; margin-top:4px;} .seat.left .bubble{left:10px; top:-6px;} .seat.right .bubble{right:10px; top:-6px;}
.seat.me .bubble{bottom:100%;}
.tabs-mini{display:flex; gap:6px; flex-wrap:wrap; margin:8px 0;}
.ctrls{display:flex; gap:8px; flex-wrap:wrap; justify-content:center; margin-top:10px;}
.stage2{display:grid; grid-template-columns:minmax(0,1fr) 270px; gap:16px; align-items:start;}
@media (max-width:980px){.stage2{grid-template-columns:1fr;} :root{--cw:min(11.5vw,70px);} .hand .cardbtn{margin-left:calc(var(--cw)*-.42);}}
@media (max-width:560px){ :root{--cw:min(12vw,56px);} .jtable{padding:10px 4px;} .trick .tc .jc{--cw:50px;} .trick{height:200px;} .center{min-height:200px;} .seat.left .backs .jc,.seat.right .backs .jc{--cw:24px; margin-top:-26px;} .backs .jc{--cw:28px; margin-left:-17px;} .jtable{grid-template-columns:62px minmax(0,1fr) 62px; gap:4px;} .nm{border-radius:12px; font-size:11.5px; padding:2px 6px; white-space:normal; text-align:center; line-height:1.15;} .nm small{display:block;} .bubble{max-width:130px; font-size:12px; padding:5px 8px;} .seat.left .bubble{left:62px;} .seat.right .bubble{right:62px;} }

.tafel{background:linear-gradient(180deg,#2c342f,var(--tafel)); border:7px solid #7a5230; border-radius:10px; padding:10px 12px 12px; color:var(--kreide); font-family:"Segoe Print","Bradley Hand","Chalkboard SE","Comic Sans MS",cursive; box-shadow:0 10px 24px #0008, inset 0 0 30px #0006;}
.tafel h4{margin:0 0 6px; text-align:center; font-weight:400; letter-spacing:.08em; font-size:15px; color:#fff7d6;}
.tafel table{width:100%; border-collapse:collapse; font-size:17px; text-align:center;}
.tafel th{font-weight:400; border-bottom:2px solid #eef0e888; padding:2px 0 4px;} .tafel td{padding:2px 0; border-bottom:1px dashed #eef0e822; font-variant-numeric:tabular-nums;}
.tafel td:first-child,.tafel th:first-child{width:24px; opacity:.55; font-size:13px;} .tafel th+th{border-left:2px solid #eef0e888;} .tafel td+td{border-left:2px solid #eef0e888;}
.tafel tfoot td{border-top:2px solid #eef0e8; border-bottom:0; font-weight:700; font-size:20px; padding-top:4px;}
.strichi{display:inline-flex; flex-wrap:wrap; gap:3px 4px; align-items:flex-end; justify-content:center; vertical-align:middle; line-height:0; color:var(--kreide);} .strichi svg{display:block; overflow:visible;} .tafel td .strichi{display:flex; margin-top:1px;} .tafel tfoot td .strichi{margin-top:3px;}
.tafel .ziel{text-align:center; font-size:13px; opacity:.7; margin-top:6px;}
.liveinfo{margin-top:10px; padding:10px 12px; border:1px solid var(--line); border-radius:10px; background:#0006; font-size:14px;}
.liveinfo b{color:var(--gold-soft);}
.sidebox{display:flex; flex-direction:column; gap:12px;}
.stbar{padding:10px 14px; border-radius:12px; border:1px solid var(--line); background:#0007; font-family:var(--serif); font-size:17px; color:var(--gold-soft); text-align:center; margin-bottom:10px;}
.stbar small{display:block; font-family:var(--sans); color:var(--muted); font-size:13px;}

/* Trumpfwahl */
.tw{display:flex; flex-wrap:wrap; gap:8px; justify-content:center; margin-top:8px;}
.tw button{display:flex; flex-direction:column; align-items:center; gap:2px; padding:8px 10px; min-width:84px; border-radius:12px; border:1px solid var(--line); background:linear-gradient(180deg,var(--panel-2),var(--panel)); font-size:13px;}
.tw button:hover{border-color:var(--gold); transform:translateY(-2px);} .tw button svg{width:34px; height:34px;} .tw button b{font-size:14px;}
.tw button small{color:var(--muted); font-size:11.5px;}

/* Erklärbuch */
.book{display:grid; grid-template-columns:230px minmax(0,1fr); gap:16px; align-items:start;}
@media (max-width:820px){.book{grid-template-columns:1fr;}}
.toc{position:sticky; top:8px; max-height:calc(100vh - 20px); overflow:auto;}
@media (max-width:820px){.toc{position:static; max-height:none;}}
.toc button{display:block; width:100%; text-align:left; padding:7px 10px; border-radius:8px; border:0; background:transparent; font-size:14.5px; color:var(--ivory);}
.toc button:hover{background:#ffffff12;} .toc button.on{background:linear-gradient(180deg,#f0d28a,var(--gold)); color:var(--ink); font-weight:700;}
.toc .grp{font-size:11.5px; letter-spacing:.12em; text-transform:uppercase; color:var(--muted); padding:10px 10px 3px;}
.page{background:linear-gradient(180deg,#f6ecd3,#eadcb8); color:#2b1d12; border-radius:6px 14px 14px 6px; padding:22px 26px 26px; box-shadow:0 14px 30px #000a, inset 8px 0 14px -8px #7a5230aa; border:1px solid #8a6a45; min-height:420px;}

}
function saveLocal(){

}
function sayB(G, seat, text, ms){ G.bubble = {seat:seat, text:text, until:Date.now() + (ms || 2200)}; setTimeout(function(){ if(S.G === G) draw(); }, (ms || 2200) + 50); }

  var sp = G.seats[seat]; if(sp.type !== 'ai') return; var l = SPRUCH[kind] && SPRUCH[kind][sp.lvl]; if(l && Math.random() < 0.6) sayB(G, seat, pick(l));
}
function entryText(G, e){
  var nm = G.seats[e.seat].name;

}

  var nm = G.seats[e.seat].name;
  if(e.act.charAt(0) === 'a'){ G.msg = nm + ' sagt ' + e.act.slice(1) + ' an.'; ton('weis'); return; }
  if(e.act === 's'){ G.msg = nm + ' schiebt.'; aiSay(G, e.seat, 'schieb'); ton('weis'); return; }
  if(e.act.charAt(0) === 't'){ G.msg = nm + ' sagt an: ' + modeName(+e.act.slice(1)) + '.'; ton('weis'); return; }
  ton('karte');
  if(e.info && e.info.weis){ var pts = 0; e.info.weis.forEach(function(w){ pts += w.pts; }); sayB(G, e.seat, 'Weis: ' + pts, 2600); aiSay(G, e.seat, 'weis'); ton('weis'); }
  if(e.info && e.info.stoeck){ sayB(G, e.seat, 'Stöck! (+20)', 2400); ton('weis'); }
  if(e.info && e.info.trump != null){ G.msg = nm + ' wirft eine fremde Farbe ab: ' + suitName(e.info.trump) + ' ist Trumpf!'; sayB(G, e.seat, suitName(e.info.trump) + ' ist Trumpf', 2600); ton('weis'); }
  if(e.trick){
    G.showTrick = {plays:G.rd.lastTrick.plays, win:e.trick.win, pts:e.trick.pts + (e.trick.bonus || 0), until:Date.now() + (e.trick.bonus ? 2200 : 1200)};
    if(e.trick.bonus){ toast(e.trick.btxt + ' auf dem Tisch: ' + (e.trick.win === G.my ? 'du bekommst' : G.seats[e.trick.win].name + ' bekommt') + ' ' + e.trick.bonus + ' Punkte dazu.'); ton('weis'); }
    ton('stich');
    if(e.trick.pts >= 25) aiSay(G, e.trick.win, 'stich');

      var w = G.rd.weisPts[G.rd.weisWin], who = G.rd.weisWin === G.my % 2 ? 'Euer Team' : 'Das Gegenteam';

}

  var G = S.G; if(!G) return; var rd = G.rd, guard = 0;

    onApplied(G, rd.log[rd.log.length - 1]);
  }
  draw();
  if(rd.phase === 'done'){ if(!G.endShown){ G.endShown = true; setTimeout(function(){ if(S.G === G) roundEnd(); }, Math.max(300, (G.showTrick ? G.showTrick.until - Date.now() : 0) + 150)); } return; }

  if(rd.phase === 'done') return;

  if(sp.type === 'ai' && iAmHost(G) && !srcActs(G, seat)[rd.cnt[seat]]){

function myTurn(G){ return G && !G.over && G.rd.phase !== 'done' && isMine(G, G.rd.turn) && !(G.showTrick && G.showTrick.until > Date.now()); }

/* =====================================================================

    var lvl = IND[cfg.kind] || s % 2 !== my % 2 ? cfg.lvlG : cfg.lvlP, names = AINAMES[lvl].filter(function(n){ return !used[n]; }), nm = pick(names.length ? names : AINAMES[lvl]);

}

function kindLabel(o){ return o.kind === 'handjass' ? 'Handjass · 7 Striche' : o.kind === 'molotow' ? 'Molotow · Ziel ' + o.target : o.kind === 'coiffeur' ? 'Coiffeur' : o.kind === 'differenzler' ? 'Differenzler · ' + o.rounds + ' Runden' : 'Schieber · Ziel ' + o.target; }

function resRows(res, my){

  h += '<tr><td><b>Total</b></td><td><b>' + res.final[t] + '</b></td><td><b>' + res.final[o] + '</b></td></tr></tbody></table>';

}

    if(swsWin >= 0){ win = swsWin === t ? 0 : 1; swsTxt = '<p class="muted" style="margin:6px 0 0">Beide Teams haben das Ziel erreicht – nach der Zählreihenfolge Stöck, Weis, Stich ' + (win === 0 ? 'seid <b>ihr</b>' : 'sind <b>die Gegner</b>') + ' zuerst dort.</p>'; }
  }

    var w = m.querySelector('[data-a="weiter"]'), n = m.querySelector('[data-a="neu"]'), e = m.querySelector('[data-a="ende"]');

function roundEndInd(G){
  var rd = G.rd, res = rd.result, kd = G.cfg.kind, dz = kd === 'differenzler';

    tb += '<tr><td>Stiche</td>' + order.map(function(s){ return '<td>' + (res.spts[s] - res.bon[s]) + '</td>'; }).join('') + '</tr>';
    tb += '<tr><td>Weis / Stöck</td>' + order.map(function(s){ return '<td>' + (res.bon[s] ? '+' + res.bon[s] : '–') + '</td>'; }).join('') + '</tr>';
    tb += '<tr><td><b>Runde</b></td>' + order.map(function(s){ return '<td><b>' + res.final[s] + '</b></td>'; }).join('') + '</tr>';

    var w = m.querySelector('[data-a="weiter"]'), n = m.querySelector('[data-a="neu"]'), e = m.querySelector('[data-a="ende"]');
    if(w){ if(G.mode !== 'ai'){ w.disabled = true; setTimeout(function(){ w.disabled = false; }, 1800); } w.onclick = function(){ closeModal(); nextRound(); }; }
    if(e) e.onclick = function(){ verlassen(); };

function saveLocalClear(){ if(S.G && S.G.mode === 'ai') lsDel('jassen_save_v1'); }

  if(rd.phase === 'ansage' && rd.trumpCard != null) small = 'Trumpf ist durch die letzte Karte des Gebers bestimmt: ' + esc(suitName(rd.t));

}
function seatHtml(G, relPos){

/* =====================================================================
   Tschau-Sepp (Kinderspiel, Regeln wie im Dossier)
   Karte: gleiche Farbe oder gleiches Bild · 8 überspringt · Bauer wählt Farbe · Ass: gleiche Farbe nachlegen, sonst ziehen ·
   6 tauscht · Banner/Zehn wechselt die Richtung · 7: +2 (weitergeben möglich) · vorletzte Karte «Tschau», letzte «Sepp»

function tsShuffle(a){ return shuffle(a); }
function tsNew(lvl){
  var deck = tsShuffle(Array.apply(null, Array(36)).map(function(_, i){ return i; })), hands = [[], [], [], []], i, s;
  for(i = 0; i < 6; i++) for(s = 0; s < 4; s++) hands[s].push(deck.pop());
  var top = deck.pop(), guard = 0;
  while([0, 3, 4, 6, 7, 8].indexOf(top % 9) >= 0 && guard++ < 20){ deck.unshift(top); top = deck.pop(); }
  var names = [API.name], used = {}, nm;
  for(s = 1; s < 4; s++){ var l = lvl, cand = AINAMES[l].filter(function(n){ return !used[n]; }); nm = pick(cand.length ? cand : AINAMES[l]); used[nm] = 1; names.push(nm); }
  return {ts:true, mode:'ts', cfg:{kind:'ts'}, my:0, seats:names.map(function(n, k){ return {type:k ? 'ai' : 'me', name:n, lvl:lvl}; }), lvl:lvl, hands:hands.map(function(h){ return tsSort(h); }), draw:deck, disc:[top], dir:1, turn:0, suit:null, pend:0, must:null, said:false, over:false, winner:-1, msg:'Du beginnst.', justDrew:false, bubble:null, timer:null, token:0, hint:null};
}
function tsSort(h){ return h.slice().sort(function(a, b){ var sa = a / 9 | 0, sb = b / 9 | 0; return sa !== sb ? sa - sb : a % 9 - b % 9; }); }
function tsTop(G){ return G.disc[G.disc.length - 1]; }
function tsCurSuit(G){ return G.suit != null ? G.suit : tsTop(G) / 9 | 0; }
function tsPlayable(G, seat, c){
  if(G.pend > 0) return c % 9 === 7;
  if(G.must != null) return (c / 9 | 0) === G.must;
  if(c % 9 === 3) return true;
  return (c / 9 | 0) === tsCurSuit(G) || c % 9 === tsTop(G) % 9;
}
function tsRefill(G){
  if(G.draw.length) return;
  var top = G.disc.pop(); G.draw = tsShuffle(G.disc); G.disc = [top];
}
function tsDrawCards(G, seat, n){
  var got = [];
  for(var i = 0; i < n; i++){ tsRefill(G); if(!G.draw.length) break; var c = G.draw.pop(); G.hands[seat].push(c); got.push(c); }
  G.hands[seat] = tsSort(G.hands[seat]); return got;
}
function tsAdvance(G, skip){
  var n = 1 + (skip ? 1 : 0); G.turn = ((G.turn + G.dir * n) % 4 + 4) % 4; G.justDrew = false;
}
function tsSay(G, seat, text){ G.bubble = {seat:seat, text:text, until:Date.now() + 2200}; setTimeout(function(){ if(S.G === G) draw(); }, 2300); }
/* spielt eine Karte; opts: {suit, swapTarget, swapCard, said} */
function tsPlay(G, seat, c, opts){
  opts = opts || {};
  var h = G.hands[seat], i = h.indexOf(c); if(i < 0 || !tsPlayable(G, seat, c)) return false;
  h.splice(i, 1); G.disc.push(c); G.suit = null; var r = c % 9, name = G.seats[seat].name, skip = false, stay = false;
  var said = seat === 0 ? G.said : opts.said; if(seat === 0) G.said = false;
  ton('karte'); G.hint = null;
  if(G.must != null) G.must = null;
  if(h.length === 0){
    if(said){ G.over = true; G.winner = seat; G.msg = name + ' hat «Sepp» gerufen und gewonnen!'; return true; }
    tsDrawCards(G, seat, 4); G.msg = name + ' hat «Sepp» vergessen: 4 Karten aufnehmen.'; tsSay(G, seat, 'Ups …'); ton('weis');
  } else if(h.length === 1 && !said){ tsDrawCards(G, seat, 2); G.msg = name + ' hat «Tschau» vergessen: 2 Karten aufnehmen.'; ton('weis'); }
  else if(h.length === 1 || h.length === 0){ tsSay(G, seat, h.length === 1 ? 'Tschau!' : 'Sepp!'); }
  if(r === 6){ skip = true; G.msg = name + ' spielt eine Acht – ' + G.seats[((G.turn + G.dir) % 4 + 4) % 4].name + ' wird übersprungen.'; }
  else if(r === 3){ G.suit = opts.suit != null ? opts.suit : (c / 9 | 0); G.msg = name + ' wünscht sich ' + suitName(G.suit) + '.'; }
  else if(r === 0 && G.hands[seat].length){ G.must = c / 9 | 0; stay = true; G.msg = name + ' spielt ein Ass und muss mit ' + suitName(c / 9 | 0) + ' nachlegen – sonst eine Karte ziehen.'; }
  else if(r === 8){
    var tgt = opts.swapTarget, give = opts.swapCard;
    if(tgt != null && G.hands[tgt] && G.hands[tgt].length && G.hands[seat].length){
      if(give == null || G.hands[seat].indexOf(give) < 0) give = pick(G.hands[seat]);
      var get = pick(G.hands[tgt]); G.hands[tgt].splice(G.hands[tgt].indexOf(get), 1); G.hands[seat].splice(G.hands[seat].indexOf(give), 1);
      G.hands[tgt].push(give); G.hands[seat].push(get); G.hands[tgt] = tsSort(G.hands[tgt]); G.hands[seat] = tsSort(G.hands[seat]);
      G.msg = name + ' tauscht eine Karte mit ' + G.seats[tgt].name + '.';
    }
  }
  else if(r === 4){ G.dir = -G.dir; G.msg = name + ' spielt einen Banner – die Richtung wechselt.'; }
  else if(r === 7){ G.pend += 2; G.msg = name + ' spielt eine Sieben: ' + G.seats[((G.turn + G.dir) % 4 + 4) % 4].name + ' muss ' + G.pend + ' Karten aufnehmen – oder mit einer Sieben weitergeben.'; }
  else G.msg = '';
  if(!stay) tsAdvance(G, skip);
  return true;
}
function tsDrawAction(G, seat){
  var name = G.seats[seat].name;
  if(G.pend > 0){ var n = G.pend; G.pend = 0; tsDrawCards(G, seat, n); G.msg = name + ' nimmt ' + n + ' Karten auf.'; tsAdvance(G, false); return {played:false}; }
  if(G.must != null){ G.must = null; tsDrawCards(G, seat, 1); G.msg = name + ' kann nicht nachlegen und zieht eine Karte.'; tsAdvance(G, false); return {played:false}; }
  var got = tsDrawCards(G, seat, 1); G.msg = name + ' zieht eine Karte.';
  if(got.length && tsPlayable(G, seat, got[0])){ G.justDrew = true; return {played:false, drew:got[0]}; }
  tsAdvance(G, false); return {played:false};
}
/* Computer */
function tsAiChoose(G, seat){
  var h = G.hands[seat], pl = h.filter(function(c){ return tsPlayable(G, seat, c); });
  if(!pl.length) return null;
  var cnt = [0, 0, 0, 0]; h.forEach(function(c){ cnt[c / 9 | 0]++; });
  var next = ((G.turn + G.dir) % 4 + 4) % 4, nextSmall = G.hands[next].length <= 2;
  var score = function(c){
    var r = c % 9, s = 0;
    if(r === 3) s -= 6; if(r === 0) s -= 2;
    if(r === 7 && nextSmall) s += 8; if(r === 6 && nextSmall) s += 6;
    if(r === 4 && nextSmall && G.dir === 1) s += 1;
    s += cnt[c / 9 | 0]; return s + Math.random() * 1.5;
  };
  if(G.lvl === 1) return pick(pl);
  pl.sort(function(a, b){ return score(b) - score(a); }); return pl[0];
}
function tsAiSuit(G, seat){
  var cnt = [0, 0, 0, 0]; G.hands[seat].forEach(function(c){ if(c % 9 !== 3) cnt[c / 9 | 0]++; });
  var best = 0; for(var s = 1; s < 4; s++) if(cnt[s] > cnt[best]) best = s; return best;
}
function tsAiMove(G){
  var seat = G.turn; if(G.over) return;
  var c = tsAiChoose(G, seat), said = G.lvl === 1 ? Math.random() < 0.7 : G.lvl === 2 ? Math.random() < 0.92 : true;
  if(c == null){
    var res = tsDrawAction(G, seat);
    if(res.drew != null){ var again = res.drew; tsPlay(G, seat, again, {said:said, suit:tsAiSuit(G, seat), swapTarget:tsAiTarget(G, seat)}); }
  } else {
    var opts = {said:said};
    if(c % 9 === 3){ var rest = G.hands[seat].filter(function(x){ return x !== c; }); var cnt = [0, 0, 0, 0]; rest.forEach(function(x){ cnt[x / 9 | 0]++; }); var b = 0; for(var s = 1; s < 4; s++) if(cnt[s] > cnt[b]) b = s; opts.suit = b; }
    if(c % 9 === 8) opts.swapTarget = tsAiTarget(G, seat);
    tsPlay(G, seat, c, opts);
  }
}
function tsAiTarget(G, seat){
  var best = -1, bn = -1; for(var s = 0; s < 4; s++){ if(s === seat) continue; if(G.hands[s].length > bn){ bn = G.hands[s].length; best = s; } } return best;
}
function tsSchedule(G){
  clearTimeout(G.timer); if(S.G !== G || G.over) return;
  if(G.turn === 0) return;
  var token = ++G.token;
  G.timer = setTimeout(function(){
    if(S.G !== G || G.token !== token || G.over || G.turn === 0) return;
    tsAiMove(G); tsAfter(G);
  }, 950 + rnd(500));
}
function tsAfter(G){
  draw();
  if(G.over){ ton('ende'); setTimeout(function(){ if(S.G === G) tsEnd(G); }, 900); return; }
  tsSchedule(G);
}
function tsEnd(G){
  var win = G.winner === 0;
  modal('<div class="resbox"><h2>' + (win ? '🏆 Gewonnen!' : 'Gewonnen hat ' + esc(G.seats[G.winner].name)) + '</h2><p class="muted">' + esc(G.msg) + '</p></div><div class="actions"><button class="btn ghost" data-a="neu" type="button">Nochmals</button><button class="btn" data-a="ende" type="button">Zum Menü</button></div>', function(m){
    m.querySelector('[data-a="ende"]').onclick = verlassen;
    m.querySelector('[data-a="neu"]').onclick = function(){ closeModal(); startTS(G.lvl); };
  }, true);
}
function startTS(lvl){
  closeModal(); var G = tsNew(lvl); S.G = G; S.view = 'game'; refresh(true); tsSchedule(G);
}
/* Zeichnen */
function tsSeatHtml(G, relPos){
  var seat = relPos, cls = ['me', 'right', 'top', 'left'][relPos], sp = G.seats[seat], act = !G.over && G.turn === seat ? ' act' : '';
  var b = G.bubble && G.bubble.seat === seat && G.bubble.until > Date.now() ? '<div class="bubble">' + esc(G.bubble.text) + '</div>' : '';
  var nm = '<div class="nm">' + esc(sp.name) + (seat ? ' <small>' + LVLN[sp.lvl] + ' · ' + G.hands[seat].length + ' Karten</small>' : ' <small>' + G.hands[0].length + ' Karten</small>') + '</div>';
  var hand;
  if(seat === 0){

   Wer es bei den Gegnern merkt, ruft «Gegen-Gämsch» (Punkt für euch) – falsch geraten gibt den Gegnern einen Punkt. Wer zuerst 10 hat, gewinnt.

function gsHasQuad(h){ var c = {}; h.forEach(function(x){ c[x % 9] = (c[x % 9] || 0) + 1; }); return Object.keys(c).some(function(k){ return c[k] >= 4; }); }

  var all = shuffle(Array.apply(null, Array(36)).map(function(_, i){ return i; })), s;
  G.hands = [[], [], [], []];
  for(s = 0; s < 4; s++) for(var i = 0; i < 4; i++) G.hands[s].push(all.pop());
  G.center = [all.pop(), all.pop(), all.pop(), all.pop()]; G.stock = all; G.discard = []; G.passes = 0; G.sel = null; G.selHand = null;
  G.hands = G.hands.map(tsSort);
}
function gsNew(lvl){
  var names = [API.name], used = {}, s;
  for(s = 1; s < 4; s++){ var cand = AINAMES[lvl].filter(function(n){ return !used[n]; }), nm = pick(cand.length ? cand : AINAMES[lvl]); used[nm] = 1; names.push(nm); }

  gsDeal(G); return G;
}
function gsRefreshCenter(G){
  G.discard = G.discard.concat(G.center); G.center = [];

function gsResolve(G, team, pts, text){
  G.points[team] += pts; G.msg = text; ton('weis'); G.rounds++;

function gsAiStep(G){
  var seat = G.turn, h = G.hands[seat], lvl = G.lvl;

    var fs = foes[f];
    if(gsHasQuad(G.hands[fs]) && Math.random() < (lvl === 1 ? 0.25 : lvl === 2 ? 0.55 : 0.9)){
      gsResolve(G, seat % 2, 1, G.seats[seat].name + ' ruft «Gegen-Gämsch» – Punkt für ' + (seat % 2 === 0 ? 'euch' : 'die Gegner') + '!'); tsSay(G, seat, 'Gegen-Gämsch!'); return;
    }
  }
  if(gsHasQuad(h) && Math.random() < (lvl === 1 ? 0.55 : lvl === 2 ? 0.85 : 1)){ gsCall(G, seat); return; }
  // Tausch
  var cnt = {}; h.forEach(function(x){ cnt[x % 9] = (cnt[x % 9] || 0) + 1; });
  var best = -1, bc = 0; Object.keys(cnt).forEach(function(k){ if(cnt[k] > bc){ bc = cnt[k]; best = +k; } });

 {id:'karten', g:'Grundlagen', t:'Karten, Werte & Reihenfolge', f:function(){

   var h = '<h2>Karten, Werte &amp; Reihenfolge</h2><p class="lead">36 Karten: vier Farben mit je neun Karten.</p>' +
   '<p><b>Deutsches Blatt:</b> Rosen, Eicheln, Schellen, Schilten · <b>Französisches Blatt:</b> Herz, Kreuz, Ecken, Schaufeln. Beide Blätter haben dieselben Karten: Rosen = Herz, Eicheln = Kreuz, Schellen = Ecken, Schilten = Schaufeln.</p>' +
   '<p>Wähle eine Farbe und eine Spielart:</p><div class="tabs-mini">' + [0, 1, 2, 3].map(function(x){ return '<button class="btn sm' + (x === s ? '' : ' ghost') + '" data-ks="' + x + '" type="button">' + esc(suitName(x)) + '</button>'; }).join('') + '</div>' +
   '<div class="tabs-mini">' + [['trumpf', 'Trumpf'], ['oben', 'Obenabe'], ['unden', 'Undenufe']].map(function(x){ return '<button class="btn sm' + (x[0] === mode ? '' : ' ghost') + '" data-km="' + x[0] + '" type="button">' + x[1] + '</button>'; }).join('') + '</div>';
   var order = []; for(var r = 0; r < 9; r++) order.push(r);
   order.sort(function(a, b){ return cstr(C(s, b), m, s) - cstr(C(s, a), m, s); });
   h += '<table class="t"><thead><tr><th>Stärke</th><th>Karte</th><th class="l">Name</th>' + (mode === 'trumpf' ? '<th>Punkte als Trumpf</th><th>Punkte in anderer Farbe</th>' : '<th>Punkte</th>') + '</tr></thead><tbody>';
   order.forEach(function(r, i){
     h += '<tr><td>' + (i + 1) + '</td><td>' + cardHtml(C(s, r), 'sm') + '</td><td class="l">' + esc(RANKN[SET][r]) + (mode === 'trumpf' && r === 3 ? ' (Buur)' : mode === 'trumpf' && r === 5 ? ' (Nell)' : '') + '</td>' +
       (mode === 'trumpf' ? '<td><b>' + cardPts(C(s, r), m) + '</b></td><td>' + cardPts(C(o, r), m) + '</td>' : '<td><b>' + cardPts(C(s, r), m) + '</b></td>') + '</tr>';
   });
   h += '</tbody></table>';
   h += box('<b>Total:</b> Eine Jassrunde hat <b>152</b> Punkte. Der <b>letzte Stich</b> bringt 5 Punkte dazu: <b>157</b> Punkte pro Runde. Macht ein Team alle 9 Stiche, ist das ein <b>Match</b> (+100).') +
   (mode === 'trumpf' ? box('Beim Trumpf gilt: Der <b>Buur</b> (' + RANKN[SET][3] + ') ist mit 20 Punkten die höchste Karte, der <b>Nell</b> (Neun) mit 14 Punkten die zweithöchste. Alle anderen Karten der Trumpffarbe folgen: Ass, König, ' + RANKN[SET][2] + ', Zehn, Acht, Sieben, Sechs.') : mode === 'oben' ? box('Beim <b>Obenabe</b> gibt es keinen Trumpf. Das Ass sticht, die Acht zählt 8 Punkte.') : box('Beim <b>Undenufe</b> ist es umgekehrt: Die Sechs sticht und zählt 11 Punkte, das Ass zählt nichts.'));
   h += '<h3>Alle 36 Karten</h3>' + [0, 1, 2, 3].map(function(x){ return '<div class="cardrow">' + [0, 1, 2, 3, 4, 5, 6, 7, 8].map(function(r){ return cardHtml(C(x, r), 'xs'); }).join('') + '</div>'; }).join('');
   return h + goUeben('wert', 'Kartenwerte üben') + '<p><button class="btn sm ghost" data-ue="raetsel" type="button">🔎 Jass-Rätsel lösen</button></p>';
 }},
 {id:'ablauf', g:'Grundlagen', t:'Grundlegender Spielablauf', f:function(){
   var st = [['Karten mischen', 'Die Karten werden gemischt.'], ['Karten abheben', 'Mindestens 3 Karten werden von der Person links des Gebers abgehoben.'], ['Karten verteilen', 'Bei vier Spielern erhält jede Person 3 × 3 Karten.'], ['Handkarten sortieren', 'Zuerst nach Farbe, dann nach Kartenwert.'], ['Trumpf bestimmen und ausspielen', 'Je nach Jassart wird der Trumpf bestimmt und gleichzeitig die erste Karte ausgespielt.'], ['Weisen', 'Im ersten Spielzug wird der Weis bekannt gegeben (wenn die Jassart ihn kennt).'], ['Jassen', 'Alle Runden werden nach den Regeln der jeweiligen Jassart gespielt.'], ['Punkte schreiben', 'Am Schluss der Runde werden die Punkte aufgeschrieben.'], ['Bedanken', 'Beim Jassen bedanken sich die Gewinner:innen – das gehört dazu!']];
   return '<h2>Grundlegender Spielablauf</h2><p class="lead">So läuft fast jede Jassrunde ab.</p><ol style="padding:0;list-style:none">' + st.map(function(x, i){ return '<li style="display:flex;gap:12px;align-items:flex-start;margin:8px 0"><span style="font-family:var(--serif);font-size:30px;font-weight:700;color:#7a4b12;width:34px;text-align:center">' + (i + 1) + '</span><span><b>' + x[0] + '</b><br>' + x[1] + '</span></li>'; }).join('') + '</ol>' +
     box('Gespielt wird <b>gegen den Uhrzeigersinn</b>. Die Person <b>rechts vom Geber</b> hat <i>Vorhand</i> – sie beginnt.');
 }},
 {id:'stich', g:'Grundlagen', t:'Der Stich', f:function(){
   var tr = C(1, 0);
   return '<h2>Der Stich</h2><p class="lead">Jeder Spieler legt eine Karte – wer gewinnt?</p>' +
   '<p>In einem <b>Stich</b> legt jede Person reihum eine Karte offen in die Mitte. Wer die <b>stärkste Karte</b> gelegt hat, gewinnt den Stich, nimmt die vier Karten zu sich und spielt als Nächstes aus.</p>' +
   '<ul><li>Es gilt <b>Farbe bedienen</b> (auch «Leihhalten»): Wer die ausgespielte Farbe hat, muss sie zugeben.</li><li>Wer die Farbe nicht hat, darf beliebig spielen – im Trumpfspiel auch mit Trumpf <b>stechen</b>.</li><li>Gewonnen hat der <b>höchste Trumpf</b>, sonst die <b>höchste Karte der Anspielfarbe</b>.</li></ul>' +
   '<h3>Beispiel: ' + esc(suitName(1)) + ' ist Trumpf</h3>' + cardsRow([C(1, 0), C(1, 3), C(1, 8), C(1, 4)], '') +
   '<p>Spieler 4 spielt das <b>' + esc(cardName(C(1, 0))) + '</b> aus, Spieler 1 legt den <b>' + esc(cardName(C(1, 3))) + '</b> (Buur!), dann kommen ' + esc(cardName(C(1, 8))) + ' und ' + esc(cardName(C(1, 4))) + '. Der Buur ist die höchste Trumpfkarte – <b>Spieler 1 gewinnt den Stich</b>. Zusammen mit dem Partner (Spieler 3) zählt er die Punkte: 11 + 20 + 0 + 10 = <b>41</b>.</p>' + goUeben('sticht', 'Wer sticht? üben');
 }},
 {id:'schieber1', g:'Schieber', t:'Schieber – Ziel und Ablauf', f:function(){
   return '<h2>Schieber</h2><p class="lead">Der Schweizer Klassiker: zwei Teams zu je zwei Personen.</p>' +
   '<div class="box"><b>Ziel des Spiels.</b> Gewonnen hat das Paar, das zuerst die vereinbarte Punktzahl erreicht – zum Beispiel <b>1000</b> Punkte.</div>' +
   '<h3>Vorbereitung &amp; Trumpf ansagen</h3><p>Alle Karten werden verteilt: jede Person erhält <b>9 Karten</b>. Die Person <b>rechts vom Geber</b> (Vorhand) sagt den Trumpf an <b>oder schiebt</b> – dann muss ihr Partner den Trumpf bestimmen. <b>Zurückschieben ist nicht erlaubt.</b></p>' +
   '<h3>Spielablauf</h3><ul><li>Wer den Trumpf ansagt oder schiebt, spielt in der <b>ersten Runde</b> die erste Karte aus (Vorhand).</li><li>Reihum, gegen den Uhrzeigersinn, legt jede Person eine Karte.</li><li><b>Kartenreihenfolge</b>: wie beim Obenabe/Undenufe – ausser beim Trumpf: Dort ist der <b>Buur</b> (' + esc(RANKN[SET][3]) + ') die höchste Karte, der <b>Nell</b> (Neun) die zweithöchste.</li><li><b>Leih halten (Farbe bedienen)</b>: Hast du die ausgespielte Farbe, musst du sie zugeben.</li><li><b>Ausnahme Trumpfbauer</b>: Der Buur muss nicht gespielt werden, wenn Trumpf ausgespielt wird – er kann aber.</li><li>Statt Farbe zu bedienen darfst du auch mit <b>Trumpf stechen</b>. Mit einem <i>kleineren</i> Trumpf als schon liegt darfst du nicht untertrumpfen – ausser du hast nur noch Trümpfe.</li></ul>' +
   '<p>Wer den Stich gewinnt, nimmt die 4 Karten und spielt die nächste Karte aus. So geht es, bis alle <b>9 Stiche</b> gespielt sind.</p>' +
   goUeben('darf', 'Welche Karte darf ich spielen?');
 }},
 {id:'schieber2', g:'Schieber', t:'Schieber – ein Beispiel', f:function(){
   return '<h2>Schieber – ein Beispiel</h2><p class="lead">Spieler 4 schiebt, Spieler 1 sagt an.</p>' +
   '<p>Spieler 4 <b>schiebt</b> zu Spieler 1. Spieler 1 sagt <b>' + esc(suitName(1)) + ' Trumpf</b> an. Spieler 4 darf als Erster ausspielen und legt das <b>' + esc(cardName(C(1, 0))) + '</b>. Spieler 2 spielt den ' + esc(cardName(C(1, 8))) + ', Spieler 3 die ' + esc(cardName(C(1, 4))) + ' – und Spieler 1 sticht alles mit dem <b>Trumpfbauer</b>.</p>' + cardsRow([C(1, 0), C(1, 8), C(1, 4), C(1, 3)]) +
   '<p>Der Stich geht an das Team von Spieler 1 und Spieler 4. Spieler 1 spielt nun die nächste Karte aus. Alles wiederholt sich, bis alle 9 Stiche gespielt wurden.</p>' + box('<b>Wichtig:</b> Der <b>letzte Stich</b> zählt 5 Punkte extra. Insgesamt gibt es pro Runde <b>157</b> Punkte.') +
   '<p><button class="btn sm" data-play="ai" type="button">♠ Gleich ausprobieren: Schieber gegen den Computer</button></p>';
 }},
 {id:'trumpfarten', g:'Schieber', t:'Trumpfarten', f:function(){
   var sy = function(t){ return '<span style="display:inline-block;width:26px;vertical-align:middle">' + modeIcon(t).replace('<svg', '<svg style="width:26px;height:26px;background:#1c1712;border-radius:50%"') + '</span>'; };
   return '<h2>Schieber – Trumpfarten</h2><p class="lead">Welche Spielarten kannst du ansagen?</p>' +
   '<div class="box"><b>Trumpffarbe</b> ' + [0, 1, 2, 3].map(function(t){ return sy(t) + ' '; }).join('') + '<br>Du wählst eine Farbe zum Trumpf. Von dieser Farbe ist der <b>Buur</b> die höchste Karte (20 Punkte), gefolgt vom <b>Nell</b> (14 Punkte). Gestochen werden kann jederzeit, sofern man eine Trumpfkarte besitzt.</div>' +
   '<div class="box"><b>Obenabe</b> ' + sy(4) + '<br>Es gibt keine Stechfarbe. Die Asse sind die stärksten Karten, dann König, ' + esc(RANKN[SET][2]) + ' und so weiter. Das Ass zählt 11 Punkte – aber Achtung: auch die tiefe <b>Acht zählt 8 Punkte</b>.</div>' +
   '<div class="box"><b>Undenufe</b> ' + sy(5) + '<br>Das Gegenstück zum Obenabe: Die <b>Sechser</b> sind die stärksten Karten, gefolgt von Siebner und Achter. Die Sechs gibt 11 Punkte, das Ass nur 0.</div>' +
   '<div class="box"><b>Slalom (Zick-Zack)</b> ' + sy(6) + sy(7) + '<br>Ein Mix aus Obenabe und Undenufe: Nach jedem Stich wechselt die Spielart. Wer zuerst ausspielt, bestimmt, ob oben oder unten begonnen wird – und danach zählen auch die Punktwerte.</div>' +
   box('<b>Guschti</b>: Fünf Stiche Obenabe, dann vier Stiche Undenufe (oder umgekehrt) – hier im Spiel zuschaltbar. Es gibt noch weitere Trumpfarten wie Marty, 3×3, Trumpf-Undenufe, Tutti, Mezzo oder Misere. Sie werden nicht überall gespielt.') +
   '<p>Hier im Spiel kannst du Slalom und Guschti beim Starten zuschalten.</p>';
 }},
 {id:'trumpfansagen', g:'Schieber', t:'Trumpf ansagen', f:function(){
   var m = MULTS[SET];
   var f1 = [], f2 = []; [0, 1, 2, 3].forEach(function(s){ (m[s] === 1 ? f1 : f2).push(s); });
   return '<h2>Trumpf ansagen</h2><p class="lead">Wer sagt an – und wann lohnt sich welcher Trumpf?</p>' +
   '<h3>Wer sagt den Trumpf an?</h3><p>Die Person rechts vom Geber (Vorhand) darf den Trumpf ansagen oder <b>schieben</b>. Dann muss der Partner ansagen – zurückschieben ist verboten.</p>' +
   '<h3>Wann soll ich selbst ansagen?</h3><ul><li>Mit <b>3 bis 4 sicheren Trümpfen</b> kannst du Vorhand Trumpf ansagen (z. B. Buur, Nell, Ass und eine weitere Trumpfkarte).</li><li>Für <b>Obenabe</b> oder <b>Undenufe</b> sollten deine Handkarten mindestens <b>5 bis 6 sichere Stiche</b> ergeben (viele Asse und Könige bzw. viele Sechser und Siebner).</li><li>Hast du von allem etwas, aber nichts Gutes? Dann <b>schieb</b> – vielleicht hat dein Partner eine bessere Hand.</li></ul>' +
   '<h3>Wie werden die Trumpfarten gewertet?</h3><p>Vor Spielbeginn kann ein Faktor abgemacht werden. Die erzielten Punkte zählen dann einfach, doppelt oder dreifach – das am weitesten verbreitete System:</p>' +
   '<table class="t"><tbody><tr><td style="width:60px"><b>1×</b></td><td class="l">' + f1.map(function(s){ return esc(suitName(s)); }).join(', ') + '</td></tr><tr><td><b>2×</b></td><td class="l">' + f2.map(function(s){ return esc(suitName(s)); }).join(', ') + '</td></tr><tr><td><b>3×</b></td><td class="l">Obenabe, Undenufe' + ' (und Slalom)</td></tr></tbody></table>' +
   box('Tipp: Je höher der Faktor, desto riskanter – aber desto mehr Punkte gibt es auch!', 'tip');
 }},
 {id:'weisen', g:'Schieber', t:'Weisen', f:function(){
   var h = '<h2>Weisen</h2><p class="lead">Extrapunkte für besondere Kartenkombinationen.</p>' +
   '<p>Es gibt zwei Arten von Weis: eine <b>Reihe</b> in derselben Farbe (mindestens drei aufeinanderfolgende Karten) oder <b>vier gleiche Karten</b> in verschiedenen Farben.</p>' +
   '<table class="t"><thead><tr><th>Weis</th><th>Punkte</th></tr></thead><tbody><tr><td class="l">Dreiblatt (3 Karten in Folge)</td><td>20</td></tr><tr><td class="l">Vierblatt</td><td>50</td></tr><tr><td class="l">Fünfblatt</td><td>100</td></tr><tr><td class="l">Sechsblatt</td><td>150</td></tr><tr><td class="l">Siebenblatt / Achtblatt / Neunblatt</td><td>200 / 250 / 300</td></tr><tr><td class="l">vier gleiche Karten (Ass, König, ' + esc(RANKN[SET][2]) + ' oder Zehner)</td><td>100</td></tr><tr><td class="l">vier Neuner (Nell)</td><td>150</td></tr><tr><td class="l">vier ' + (SET === 'f' ? 'Buben' : 'Bauern') + '</td><td>200</td></tr><tr><td class="l"><b>Stöck</b>: König + ' + esc(RANKN[SET][2]) + ' der Trumpffarbe</td><td>20</td></tr></tbody></table>' +
   '<p>Die Reihenfolge der Karten für eine Reihe ist: Ass, König, ' + esc(RANKN[SET][2]) + ', ' + esc(RANKN[SET][3]) + ', 10, 9, 8, 7, 6.</p>' +
   '<h3>Wann muss ich weisen?</h3><p>Der Weis wird <b>im ersten Stich</b> gleichzeitig mit dem Ausspielen der ersten Karte angesagt. Sobald die nächste Person ihre Karte gespielt hat, darf nicht mehr gewiesen werden. Man sagt nur die <b>Höhe</b> oder die Anzahl Karten (z. B. «Dreiblatt»), nie welche Karten es sind.</p>' +
   '<h3>Wer darf seine Weispunkte schreiben?</h3><ul><li>Nur das Team mit dem <b>höchsten Weis</b> schreibt <b>alle</b> seine Weispunkte (auch die des Partners). Das andere Team schreibt keine.</li><li>Eine <b>Reihe schlägt vier Gleiche</b> bei gleicher Punktzahl (Fünfblatt vor vier Königen).</li><li>Bei gleicher Punktzahl entscheidet die <b>höhere Karte</b> (beim Undenufe die tiefste), dann der Trumpf, dann wer <b>zuerst</b> weist (Vorhand).</li><li><b>Kreuzweis</b>: Kommt eine Karte in zwei Weisen derselben Person vor, dürfen beide geschrieben werden.</li><li>Der <b>Stöck</b> zählt immer – auch wenn das Gegenteam den höchsten Weis hat.</li></ul>' +
   '<h3>Weis-Rechner</h3><p>Tippe bis zu neun Karten an – ich zeige dir, was du weisen darfst.</p><div class="kgrid">';
   for(var s = 0; s < 4; s++) for(var r = 0; r < 9; r++){ var c = C(s, r); h += '<button type="button" class="' + (BOOK.wsel.indexOf(c) >= 0 ? 'sel' : '') + '" data-wc="' + c + '" aria-label="' + esc(cardName(c)) + '">' + cardHtml(c) + '</button>'; }
   h += '</div>';
   var ws = findWeis(BOOK.wsel, 4), sum = 0; ws.forEach(function(w){ sum += w.pts; });
   h += '<div class="box ' + (ws.length ? 'tip' : '') + '"><b>' + BOOK.wsel.length + ' Karten</b> gewählt. ' + (ws.length ? 'Du darfst weisen: ' + ws.map(function(w){ return esc(w.name) + ' (' + w.pts + ')'; }).join(', ') + ' – zusammen <b>' + sum + '</b> Punkte.' : 'Kein Weis in dieser Auswahl.') + '</div><p><button class="btn sm ghost" data-wclr="1" type="button">Auswahl löschen</button></p>';
   return h;
 }},
 {id:'punkte', g:'Schieber', t:'Punkte schreiben', f:function(){
   return '<h2>Schieber – Punkte schreiben</h2><p class="lead">Wie hält man das Resultat fest?</p>' +
   '<p>Am Ende jeder Runde zählt jedes Team seine <b>Stichpunkte</b> (Kartenwerte aller gewonnenen Stiche plus 5 für den letzten Stich) zusammen und addiert <b>Weis</b> und <b>Stöck</b>. Danach wird mit dem <b>Faktor</b> der Trumpfart multipliziert.</p>' +
   '<table class="t"><tbody><tr><td class="l">Stichpunkte (inkl. 5 letzter Stich)</td><td>Wir 98</td><td>Sie 59</td></tr><tr><td class="l">Weis</td><td>50</td><td>–</td></tr><tr><td class="l">Faktor (z. B. Schaufel 2×)</td><td colspan="2">×2</td></tr><tr><td class="l"><b>Total</b></td><td><b>(98+50)×2 = 296</b></td><td><b>59×2 = 118</b></td></tr></tbody></table>' +
   '<p>Das geht auf der <b>Jasstafel</b> mit Kreide, auf einem Blatt oder mit der <b>Schreibtafel</b> in diesem Programm.</p>' + '<p><button class="btn sm" data-v="tafel" type="button">📝 Zur Schreibtafel</button></p>' +
   box('Macht ein Team alle 9 Stiche, ist das ein <b>Match</b> – es gibt <b>100</b> Zusatzpunkte (257 statt 157).');
 }},
 {id:'obenabe', g:'Weitere Jassarten', t:'Obenabe &amp; Undenufe', f:function(){
   return '<h2>Obenabe-Jass</h2><p class="lead">Der ideale Einstieg: keine Trumpffarbe, nur die Reihenfolge zählt.</p>' +
   '<div class="box"><b>Ziel.</b> Gewinne möglichst viele Stiche, indem du die stärkste Karte der ausgespielten Farbe legst – und so die Karten sammelst.</div>' +
   '<h3>Vorbereitung</h3><p>Alle Karten werden gleichmässig verteilt. Jede Person sortiert ihre Karten nach Farbe und Wert.</p>' +
   '<h3>Ablauf</h3><ol><li>Die erste Person beginnt und legt eine Karte offen auf den Tisch.</li><li>Reihum legt jede Person eine Karte der <b>gleichen Farbe</b>. Fehlt die Farbe, darf eine beliebige Karte gespielt werden.</li><li>Wer die <b>stärkste Karte der ersten Farbe</b> hat, gewinnt den Stich und legt die Karten verdeckt auf seinen Stapel.</li><li>Diese Person spielt die nächste Karte aus und bestimmt damit die Farbe.</li><li>Wiederholen, bis alle Karten gespielt sind.</li></ol>' +
   '<h3>Wer gewinnt?</h3><p>Zähle zuerst nur die <b>Anzahl der eingenommenen Karten</b> (oder Stiche). Wenn die Reihenfolge sitzt, zählst du die Punkte nach Tabelle (Ass 11, König 4, ' + esc(RANKN[SET][2]) + ' 3, ' + esc(RANKN[SET][3]) + ' 2, Zehn 10, <b>Acht 8</b>) zusammen und jasst auf eine Zielpunktzahl.</p>' +
   '<h3>Undenufe (Hindenufe)</h3><p>Gleich wie Obenabe – aber <b>umgekehrt</b>: Die Sechs ist am stärksten (11 Punkte), das Ass am schwächsten (0 Punkte).</p><p><button class="btn sm" data-play="oben" type="button">↓ Obenabe-Jass spielen</button> <button class="btn sm" data-play="unden" type="button">↑ Undenufe spielen</button></p>';
 }},
 {id:'handjass', g:'Weitere Jassarten', t:'Handjass', f:function(){
   return '<h2>Handjass</h2><p class="lead">Die einfachste Form des Jassens – für 2 bis 4 Personen.</p>' +
   '<p>Handjass heisst auch <i>Sackjass</i> oder <i>Butzer</i>. Jeder spielt für sich oder in Paaren; man spielt mit den Trumpf-Regeln wie beim Schieber, aber ohne Schieben: Der Trumpf wird meist <b>durch die letzte Karte des Gebers</b> oder die oberste Karte des Stapels bestimmt.</p>' +
   '<ul><li>Gespielt wird mit 36 Karten, gegen den Uhrzeigersinn.</li><li>Ziel: <b>7 Striche</b> sammeln – die Person, die zuletzt übrig bleibt, hat verloren (so die gängigste Hausregel).</li><li>Nach jeder Runde bekommen die beiden Personen mit den meisten Punkten je einen Strich; wer weniger als <b>26</b> Kartenpunkte hat, bekommt eine «Null» (−1 Strich).</li><li>Der letzte Stich zählt 5 Punkte. <b>Weis</b> und <b>Stöck</b> zählen wie beim Schieber.</li></ul>' + '<p><button class="btn sm" data-play="handjass" type="button">♣ Handjass gegen den Computer spielen</button></p>' + box('Hausregeln unterscheiden sich stark. Vereinbart vor dem Spiel Zielpunkte und Weis ab. Im Spiel hier gewinnt, wer zuerst 7 Striche hat (ohne Weis).', 'warn');
 }},
 {id:'coiffeur', g:'Weitere Jassarten', t:'Coiffeur', f:function(){
   var rows = [[0, 1], [1, 2], [2, 1], [3, 2]];
   return '<h2>Coiffeur</h2><p class="lead">Jede Spielart muss einmal gespielt werden.</p>' +
   '<p>Coiffeur wird mit zwei Teams zu je zwei Personen gespielt. Auf der <b>Coiffeur-Tafel</b> hat jedes Team eine Spalte mit allen Spielarten:</p><table class="t"><thead><tr><th class="l">Spielart</th><th>Faktor</th></tr></thead><tbody>' +
   [2, 0, 3, 1].map(function(s){ return '<tr><td class="l">' + esc(suitName(s)) + ' Trumpf</td><td>' + COIFF[s] + '×</td></tr>'; }).join('') + '<tr><td class="l">Obenabe</td><td>5×</td></tr><tr><td class="l">Undenufe</td><td>6×</td></tr></tbody></table><p class="muted">Das ist die klassische Tafel. Die Faktoren sind regional verschieden; beim Start einer Partie kannst du auch <b>Alle ×3</b> wählen.</p>' +

  {q:'Wer darf beim Schieber zuerst Trumpf ansagen?', o:['Der Geber', 'Die Person rechts vom Geber (Vorhand)', 'Wer das Ass hat', 'Der Partner des Gebers'], a:1, e:'Die Vorhand sagt an – oder schiebt.'},
  {q:'Darf der Partner den Trumpf wieder zurückschieben?', o:['Ja, einmal', 'Ja, immer', 'Nein', 'Nur beim Obenabe'], a:2, e:'Zurückschieben ist nicht erlaubt.'},
  {q:'Wie viele Punkte gibt ein Dreiblatt?', o:['10', '20', '50', '100'], a:1, e:'Dreiblatt 20, Vierblatt 50, Fünfblatt 100.'},
  {q:'Was ist ein Stöck?', o:['Vier Buben', 'König und Ober/Dame der Trumpffarbe', 'Der letzte Stich', 'Ein Dreiblatt'], a:1, e:'Stöck = König + Ober (Dame) vom Trumpf, 20 Punkte.'},
  {q:'Wie viele Punkte bringt der letzte Stich?', o:['0', '5', '10', '20'], a:1, e:'Der letzte Stich zählt 5 Punkte.'},
  {q:'Beim Undenufe ist die stärkste Karte …', o:['das Ass', 'der König', 'die Sechs', 'der Buur'], a:2, e:'Beim Undenufe ist die Sechs ganz oben (11 Punkte).'},
  {q:'In welche Richtung wird gejasst?', o:['Im Uhrzeigersinn', 'Gegen den Uhrzeigersinn', 'Egal', 'Immer zum Partner'], a:1, e:'Gegen den Uhrzeigersinn.'},
  {q:'Was ist ein Match?', o:['Ein Team holt alle 9 Stiche', 'Zwei Teams haben gleich viele Punkte', 'Man hat vier Asse', 'Der Trumpf wird geschoben'], a:0, e:'Alle 9 Stiche: 100 Zusatzpunkte.'},
  {q:'Darf man mit einem kleineren Trumpf stechen, als schon auf dem Tisch liegt?', o:['Ja, immer', 'Nein, das ist untertrumpfen – nur erlaubt, wenn man sonst nur Trümpfe hat', 'Nur im Obenabe', 'Nur der Partner'], a:1, e:'Untertrumpfen ist verboten, ausser man hat nur noch Trümpfe.'},
  {q:'Was zählt die Acht beim Obenabe?', o:['0', '4', '8', '10'], a:2, e:'Die Acht gibt beim Obenabe und Undenufe 8 Punkte.'}
];
var RAETSEL = [
  function(){ return ['Ich zähle als Trumpf 14 Punkte, sonst nichts – und ich gehöre zur Farbe ' + suitName(0) + '.', C(0, 5)]; },
  function(){ return ['Als Trumpf bin ich der Chef und zähle 20 Punkte. Meine Farbe: ' + suitName(1) + '.', C(1, 3)]; },
  function(){ return ['Beim Obenabe bin ich die stärkste Karte (11 Punkte) in der Farbe ' + suitName(2) + '.', C(2, 0)]; },
  function(){ return ['Beim Undenufe bin ich die stärkste Karte (11 Punkte) in der Farbe ' + suitName(3) + '.', C(3, 8)]; },
  function(){ return ['Ich zähle immer 10 Punkte – in der Farbe ' + suitName(0) + '. Wer bin ich?', C(0, 4)]; },
  function(){ return ['Zusammen mit meiner ' + RANKN[SET][2] + ' bilde ich im Trumpf einen Stöck. Ich bin der König der Farbe ' + suitName(1) + '.', C(1, 1)]; },
  function(){ return ['Beim Obenabe zähle ich 8 Punkte, im Trumpf 0. Meine Farbe ist ' + suitName(2) + '.', C(2, 6)]; },
  function(){ return ['Ich bin die ' + RANKN[SET][2] + ' der Farbe ' + suitName(3) + ' und zähle 3 Punkte.', C(3, 2)]; },
  function(){ return ['Ich zähle nie Punkte – ich bin die Sieben der Farbe ' + suitName(0) + '.', C(0, 7)]; },
  function(){ return ['Ich bin die Neun: In der Trumpffarbe heisse ich Nell. Meine Farbe: ' + suitName(1) + '.', C(1, 5)]; }
];
function ueMenu(){
  var items = [['wert', 'Kartenwerte', 'Wie viele Punkte zählt die Karte?'], ['sticht', 'Wer sticht?', 'Welche Karte gewinnt den Stich?'], ['darf', 'Welche Karte darf ich spielen?', 'Farbe bedienen, stechen, nicht untertrumpfen'], ['mathi1', 'Jass-Mathi I', 'Plus und Minus mit Kartenwerten'], ['mathi2', 'Jass-Mathi II', 'Auch mal und – Punkt vor Strich!'], ['raetsel', 'Jass-Rätsel', 'Finde die gesuchte Karte'], ['regeln', 'Regel-Quiz', RQ.length + ' Fragen zum Schieber']];
  return '<div class="card"><h2>Üben</h2><p class="muted">Kleine Übungen zu den Jass-Lernzielen. Die Karten wechseln mit dem Blatt (Deutsch/Französisch).</p></div><div class="modes" style="margin-top:14px">' + items.map(function(i){ return '<button class="mode" data-uk="' + i[0] + '" type="button"><b>' + i[1] + '</b><small>' + i[2] + '</small></button>'; }).join('') + '</div>';
}
function renderUeben(){
  var el = $('ueben');
  if(!UE.kind){ el.innerHTML = ueMenu(); el.querySelectorAll('[data-uk]').forEach(function(b){ b.onclick = function(){ UE.kind = b.dataset.uk; UE.n = 0; UE.ok = 0; UE.ri = rnd(RQ.length); UE.q = null; renderUeben(); }; }); return; }
  var k = UE.kind, total = k === 'raetsel' ? RAETSEL.length : k === 'regeln' ? RQ.length : UE.total;
  if(UE.n >= total){
    el.innerHTML = '<div class="card qbox" style="text-align:center"><h2>Geschafft!</h2><div class="big2">' + UE.ok + ' / ' + total + '</div><p class="muted">' + (UE.ok >= total * 0.8 ? 'Super – du bist ein echter Jasser!' : UE.ok >= total * 0.5 ? 'Gut gemacht – noch etwas üben und es sitzt.' : 'Lies noch einmal im Erklärbuch nach und versuch es nochmals.') + '</p><div class="row" style="justify-content:center"><button class="btn" data-a="again" type="button">Nochmals</button><button class="btn ghost" data-a="menu" type="button">Zurück</button><button class="btn ghost" data-a="buch" type="button">📖 Erklärbuch</button></div></div>';
    el.querySelector('[data-a="again"]').onclick = function(){ UE.n = 0; UE.ok = 0; UE.q = null; UE.ri = rnd(RQ.length); renderUeben(); };
    el.querySelector('[data-a="menu"]').onclick = function(){ UE.kind = null; renderUeben(); }; el.querySelector('[data-a="buch"]').onclick = function(){ S.view = 'buch'; refresh(true); };
    return;
  }
  if(!UE.q){ if(k === 'raetsel'){ var r = RAETSEL[UE.n](); UE.q = {t:r[0], ans:r[1]}; UE.sel = []; UE.done = false; UE.fb = ''; } else ueQuestion(); }
  var q = UE.q, h = '<div class="card qbox"><div class="row" style="justify-content:space-between"><button class="btn sm ghost" data-a="menu" type="button">← Übungen</button><span class="muted">Frage ' + (UE.n + 1) + ' von ' + total + ' · richtig: ' + UE.ok + '</span></div><div class="bar"><i style="width:' + (UE.n / total * 100) + '%"></i></div>';
  if(k === 'wert'){
    h += '<div class="qq">' + esc(modeLabel(q.m)) + ': Wie viele Punkte zählt diese Karte?</div><div style="text-align:center">' + cardHtml(q.c, 'lg') + '</div><div class="qopt" style="flex-direction:row;flex-wrap:wrap;justify-content:center">' + q.opts.map(function(o){ return '<button type="button" data-o="' + o + '" style="min-width:90px;text-align:center">' + o + '</button>'; }).join('') + '</div>';
  } else if(k === 'sticht'){
    h += '<div class="qq">' + esc(modeLabel(q.m)) + '. Die Karten wurden in dieser Reihenfolge gespielt (von links nach rechts). Welche gewinnt den Stich?</div><div class="cardrow" style="justify-content:center">' + q.cards.map(function(c, i){ return '<button class="cardbtn ok" type="button" data-o="' + i + '">' + cardHtml(c, 'sm') + '<div class="muted" style="font-size:12px">' + (i + 1) + '.</div></button>'; }).join('') + '</div>';
  } else if(k === 'darf'){
    h += '<div class="qq">' + esc(modeLabel(q.m)) + '. Auf dem Tisch liegt schon (erste Karte = Anspiel):</div>' + cardsRow(q.trick, 'sm') + '<div class="qq">Deine Hand – wähle <b>alle</b> Karten, die du jetzt spielen darfst:</div><div class="cardrow">' + q.hand.map(function(c){ return '<button type="button" class="cardbtn ok" data-o="' + c + '" style="' + (UE.sel.indexOf(c) >= 0 ? 'outline:3px solid var(--gold);outline-offset:2px;border-radius:6px' : '') + '">' + cardHtml(c, 'sm') + '</button>'; }).join('') + '</div><div class="row"><button class="btn" data-a="check" type="button"' + (UE.done ? ' disabled' : '') + '>Prüfen</button></div>';
  } else if(k === 'mathi1' || k === 'mathi2'){
    h += '<div class="qq">' + esc(modeLabel(q.m)) + ' – rechne:' + (k === 'mathi2' ? ' <span class="muted">(Punkt vor Strich!)</span>' : '') + '</div><div class="mathi">' + cardHtml(q.cs[0], 'sm') + '<span class="op">' + q.ops[0] + '</span>' + cardHtml(q.cs[1], 'sm') + '<span class="op">' + q.ops[1] + '</span>' + cardHtml(q.cs[2], 'sm') + '<span class="op">=</span><input id="mAns" type="number" inputmode="numeric" ' + (UE.done ? 'disabled' : '') + ' autofocus></div><div class="row"><button class="btn" data-a="mcheck" type="button"' + (UE.done ? ' disabled' : '') + '>Prüfen</button></div>';
  } else if(k === 'raetsel'){
    h += '<div class="qq">🔎 ' + esc(q.t) + '</div><div class="kgrid">';
    for(var s = 0; s < 4; s++) for(var rr = 0; rr < 9; rr++){ var cc = C(s, rr); h += '<button type="button" data-o="' + cc + '" class="' + (UE.sel[0] === cc ? 'sel' : '') + '" style="color:#000" aria-label="' + esc(cardName(cc)) + '">' + cardHtml(cc) + '</button>'; }
    h += '</div>';
  } else if(k === 'regeln'){
    h += '<div class="qq">' + esc(q.q) + '</div><div class="qopt">' + q.o.map(function(o, i){ return '<button type="button" data-o="' + i + '" class="' + (UE.done ? (i === q.a ? 'rich' : (UE.sel[0] === i ? 'falsch' : '')) : '') + '">' + esc(o) + '</button>'; }).join('') + '</div>';
  }
  if(UE.fb) h += '<div class="box ' + (UE.good ? 'tip' : 'warn') + '" style="color:#2b1d12">' + UE.fb + '</div>';
  if(UE.done) h += '<div class="row"><button class="btn" data-a="next" type="button">' + (UE.n + 1 >= total ? 'Resultat' : 'Weiter') + '</button></div>';
  el.innerHTML = h + '</div>';
  if(k === 'sticht' && UE.done){ /* nichts */ }
  var cl = function(){ };
  el.querySelectorAll('[data-a="menu"]').forEach(function(b){ b.onclick = function(){ UE.kind = null; renderUeben(); }; });
  var nx = el.querySelector('[data-a="next"]'); if(nx) nx.onclick = function(){ UE.n++; UE.ri++; UE.q = null; renderUeben(); };
  el.querySelectorAll('[data-o]').forEach(function(b){ b.onclick = function(){ ueAnswer(+b.dataset.o); }; });
  var ck = el.querySelector('[data-a="check"]'); if(ck) ck.onclick = ueCheckDarf;
  var mk = el.querySelector('[data-a="mcheck"]'); if(mk) mk.onclick = function(){ var v = el.querySelector('#mAns').value; if(v === ''){ toast('Trag eine Zahl ein.'); return; } ueFinish(Math.round(+v * 100) / 100 === Math.round(q.ans * 100) / 100, q.ans + (k === 'mathi2' ? '' : '')); };
  var inp = el.querySelector('#mAns'); if(inp) inp.onkeydown = function(e){ if(e.key === 'Enter' && mk) mk.click(); };
}
function ueFinish(good, ansTxt, extra){
  if(UE.done) return; UE.done = true; UE.good = good; if(good) UE.ok++;
  UE.fb = (good ? '✓ Richtig! ' : '✗ Leider nicht. ' + (ansTxt != null ? 'Richtig ist: <b>' + esc(ansTxt) + '</b>. ' : '')) + (extra || '');
  renderUeben();
}
function ueAnswer(v){
  var q = UE.q, k = UE.kind; if(UE.done) return;
  if(k === 'wert') ueFinish(v === q.ans, q.ans, q.m < 4 ? '' : '');
  else if(k === 'sticht') ueFinish(v === q.ans, (q.ans + 1) + '. Karte (' + cardName(q.cards[q.ans]) + ')', 'Die höchste Trumpfkarte gewinnt, sonst die höchste Karte der Anspielfarbe.');
  else if(k === 'darf'){ var i = UE.sel.indexOf(v); if(i >= 0) UE.sel.splice(i, 1); else UE.sel.push(v); renderUeben(); }
  else if(k === 'raetsel'){ UE.sel = [v]; ueFinish(v === q.ans, cardName(q.ans)); }
  else if(k === 'regeln'){ UE.sel = [v]; ueFinish(v === q.a, q.o[q.a], q.e); }
}
function ueCheckDarf(){
  var q = UE.q; if(UE.done) return;
  var a = q.ans.slice().sort(function(x, y){ return x - y; }), b = UE.sel.slice().sort(function(x, y){ return x - y; });
  var good = a.length === b.length && a.every(function(x, i){ return x === b[i]; });
  ueFinish(good, q.ans.map(cardName).join(', '), reasonText(q));
}
function reasonText(q){
  var m = q.m, led = suitOf(q.trick[0]);
  if(m >= 4) return 'Ohne Trumpf: Farbe bedienen, sonst frei.';
  if(led === m) return 'Trumpf wurde ausgespielt: Trumpf zugeben (der Buur darf zurückgehalten werden, wenn er der einzige Trumpf ist).';
  return 'Farbe bedienen oder stechen – aber nicht untertrumpfen.';
}

function init(){
  $('soundBtn').textContent = S.muted ? '🔇' : '🔊';
  $('soundBtn').onclick = function(){ S.muted = !S.muted; lsSet('jassen_mute', S.muted); $('soundBtn').textContent = S.muted ? '🔇' : '🔊'; if(!S.muted) ton('neu'); };
  window.__jassRedraw = function(){ refresh(true); };
  bindGame(); bindBuch(); bindTS(); bindGS();
  S.unsubFrei = API.freigabeWatch(function(f){ S.frei = f; refresh(true); });
  refresh(true);
  if(status().offen) startLobby();
  setInterval(function(){ refresh(); if(S.G && S.G.mode === 'online' && S.G.rd){ var tk = takeoverBtn(S.G); if(tk !== S.G.lastTake){ S.G.lastTake = tk; draw(); } } if(S.G && S.G.showTrick && S.G.showTrick.until < Date.now() - 50 && S.G.showTrick.shown !== true){ S.G.showTrick.shown = true; draw(); } }, 1000);
  if(API.mock){ window.__jass = S; window.__jassTest = {newRound:newRound, applyAct:applyAct, legal:legal, findWeis:findWeis, aiAct:aiAct, cardPts:cardPts, trickWinnerIdx:trickWinnerIdx}; }
}
init();
